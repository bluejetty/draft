  const stripMessage = document.getElementById('strip-message');
  const lenOut = document.getElementById('strip-len');
  const angOut = document.getElementById('strip-ang');
  const protractorOut = document.getElementById('strip-protractor-angle');
  const rulerChip = strip.querySelector('[data-mode-ruler]');
  const tsquareChip = strip.querySelector('[data-mode-tsquare]');
  const lengthBox = document.getElementById('frozen-length');

  const F = window.DraftFormatters;
  const feetLabel = ft => F.formatArchitecturalInches(ft * 12);
  // Compass bearing off the +X axis, the reading a protractor gives: 0-180
  // either way rather than 0-360, because a wall drawn left has the same
  // angle as the same wall drawn right and a drafter reading 183° would
  // reasonably think it was out of square.
  const angleLabel = (from, to) => {
    const deg = Math.atan2(-(to.z - from.z), to.x - from.x) * 180 / Math.PI;
    const folded = deg <= -90 ? deg + 180 : (deg > 90 ? deg - 180 : deg);
    return `${folded.toFixed(1)}°`;
  };

  // WHAT THE T-SQUARE ACTUALLY DOES. The longer leg wins, so the run follows
  // the direction the hand is already going rather than jumping axes under
  // the cursor.
  const squareTo = (from, at) => {
    if (!tsquareOn || !from) return at;
    return Math.abs(at.x - from.x) >= Math.abs(at.z - from.z)
      ? { x: at.x, z: from.z } : { x: from.x, z: at.z };
  };

  // The run the instruments are reading: the wall being drawn if there is
  // one, otherwise the ruler's measure. Null when the drafter is doing
  // neither, and the readouts go blank rather than holding a stale number --
  // a length that stays on screen after the gesture ends is the one thing a
  // drafter should never be able to misread.
  const runInHand = () => {
    if (!cursorWorld) return null;
    if (drawStart && activeTool === 'wall') return { from: drawStart, to: squareTo(drawStart, cursorWorld) };
    if (rulerFrom) return { from: rulerFrom, to: cursorWorld };
    return null;
  };

  // FOUR READS OF `drawArmed` BECAME READS OF THE REGISTER. #398 wrote this
  // strip against the armed boolean; the tool register replaced that boolean
  // with a tool id, and the merge that brought the two together was clean --
  // the strip and the column live in different parts of the file. The same
  // shape as deleteLevel's `setArmed(false)` earlier today, from the other
  // side: git has nothing to say when one branch deletes a name another branch
  // starts using.
  function stripRefresh() {
    const run = runInHand();
    const dist = run ? Math.hypot(run.to.x - run.from.x, run.to.z - run.from.z) : null;
    lenOut.textContent = dist === null ? '' : feetLabel(dist);
    angOut.textContent = run ? angleLabel(run.from, run.to) : '';
    protractorOut.textContent = run ? angleLabel(run.from, run.to) : '—';
    rulerChip.classList.toggle('lit', rulerOn);
    tsquareChip.classList.toggle('lit', tsquareOn);
    // THE LENGTH BOX IS LIVE ONLY WHILE A WALL IS IN HAND, because that is
    // the only moment a typed length has an anchor and a direction to be
    // measured along. Enabled at any other time it would take a number and
    // have nowhere to put it.
    const typable = !!(activeTool === 'wall' && drawStart && cursorWorld);
    if (lengthBox.disabled === typable) {
      lengthBox.disabled = !typable;
      if (!typable) lengthBox.value = '';
    }
    // While the drafter is typing, the box is his; the live length would
    // overwrite the digits mid-word.
    if (typable && document.activeElement !== lengthBox) {
      lengthBox.value = dist === null ? '' : feetLabel(dist);
    }
    stripMessage.textContent = rulerOn
      ? (rulerFrom ? 'ruler — second point' : 'ruler — first point')
      : (activeTool === 'wall' ? (drawStart ? 'wall — second point' : 'wall — first point') : '');
  }

  const rulerPress = at => {
    if (!rulerFrom) { rulerFrom = { x: at.x, z: at.z }; }
    else { rulerFrom = null; }
    cursorWorld = at;
    stripRefresh();
    paint();
  };

  rulerChip.addEventListener('click', () => {
    rulerOn = !rulerOn;
    rulerFrom = null;
    canvas.style.cursor = rulerOn ? 'crosshair' : (activeTool === 'wall' ? 'crosshair' : '');
    stripRefresh();
    paint();
  });
  tsquareChip.addEventListener('click', () => {
    tsquareOn = !tsquareOn;
    stripRefresh();
    paint();
  });

  // TYPING A LENGTH COMMITS THE WALL, which is the instrument's whole point:
  // a drafter who knows the wall is 12'-6" should not have to find 12'-6"
  // with a mouse. The DIRECTION is the one the cursor is already giving --
  // squared first if the T-square is down -- so the typed number replaces the
  // distance and nothing else.
  const commitTypedLength = () => {
    const parsed = F.parseArchitecturalLength(lengthBox.value);
    if (!parsed.ok) { stripMessage.textContent = parsed.error; return; }
    const feet = parsed.inches / 12;
    if (!(feet > 0) || !drawStart || !cursorWorld) return;
    const aim = squareTo(drawStart, cursorWorld);
    const dx = aim.x - drawStart.x, dz = aim.z - drawStart.z;
    const len = Math.hypot(dx, dz);
    if (len < 1e-6) { stripMessage.textContent = 'point away from the start first'; return; }
    const end = { x: drawStart.x + dx / len * feet, y: 0, z: drawStart.z + dz / len * feet };
    const wall = commitWall(drawStart, end);
    drawStart = wall.end;
    // THE SELECTION IS A SET ON THIS BRANCH. #398 wrote this line as
    // `selectedSeg = wall` against the single-wall variable that the selection
    // set replaced -- the third binding this merge had to re-seat, after
    // deleteLevel's setArmed and the strip's four reads of drawArmed. Same
    // shape every time: one branch deletes a name, another starts using it,
    // and git has nothing to say.
    setSelection([{ type: 'wall', item: wall }]);
    lengthBox.blur();
    stripRefresh();
    paint();
  };
  lengthBox.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); commitTypedLength(); }
    if (e.key === 'Escape') { e.preventDefault(); lengthBox.blur(); stripRefresh(); }
    // The page's own keys (0 to fit, Escape, Delete) must not fire while a
    // length is being typed -- a drafter typing 10' would otherwise refit the
    // view under his hands.
    e.stopPropagation();
  });

  // ── the switches ──────────────────────────────────────────────────────────
  // SKIN WITHOUT A RELOAD. Every painter reads its colours from `skin` inside
  // its own body, so re-resolving the palette and repainting is the whole
  // change -- and it has to be, because this page can be holding an unsaved
  // edit and a reload would be asked to throw it away to change a colour.
  const themeButtons = [...strip.querySelectorAll('[data-theme]')];
  const modeButtons = [...strip.querySelectorAll('[data-skin-mode]')];
  const boardButtons = [...strip.querySelectorAll('[data-board]')];

  const markSwitch = (buttons, attr, value) =>
    buttons.forEach(b => b.setAttribute('aria-pressed', String(b.dataset[attr] === value)));

  const applySkin = () => {
    skin = window.DraftPalette.apply(document, theme, mode);
    markSwitch(themeButtons, 'theme', theme);
    markSwitch(modeButtons, 'skinMode', mode);
    try { localStorage.setItem(SKIN_KEY, JSON.stringify({ theme, mode })); }
    catch { /* a private window refusing storage is not a reason to refuse the skin */ }
    paint();
  };
  themeButtons.forEach(b => b.addEventListener('click', () => { theme = b.dataset.theme; applySkin(); }));
  modeButtons.forEach(b => b.addEventListener('click', () => { mode = b.dataset.skinMode; applySkin(); }));

  // THE BOARD SWITCH IS A SWITCH AND NOTHING IS WIRED BEHIND IT YET, and that
  // is said out loud rather than implied. Movie, 13 Sep, asked for it on the
  // PC strip; the sentence defining what TOY MODE restricts was cut off
  // mid-word and has not arrived, so what exists is the choice, remembered
  // across reloads and readable by whoever builds the constraints -- not a
  // claim that they exist. The title on each button says so; when the rules
  // land they read `body[data-board]` and nothing here moves.
  const BOARDS = ['toy', 'drafting'];
  let board = BOARDS.includes(stored.board) ? stored.board : 'toy';
  const applyBoard = () => {
    document.body.setAttribute('data-board', board);
    markSwitch(boardButtons, 'board', board);
    try {
      const keep = JSON.parse(localStorage.getItem(SKIN_KEY) || '{}');
      localStorage.setItem(SKIN_KEY, JSON.stringify({ ...keep, board }));
    } catch { /* as above */ }
  };
  boardButtons.forEach(b => {
    b.title = 'Board mode — remembered, but nothing is constrained by it yet';
    b.addEventListener('click', () => { board = b.dataset.board; applyBoard(); });
  });

  markSwitch(themeButtons, 'theme', theme);
  markSwitch(modeButtons, 'skinMode', mode);
  applyBoard();
  stripRefresh();

  // ONE LISTENER, THE REGISTER'S. #398 wrote this against the armed
  // boolean (`setArmed(!drawArmed)`); the register replaced that, and the
  // merge offered both because the strip and the tool column were added at
  // the same point in the file. Keeping both listeners would have given the
  // button two handlers that disagree about what armed means.
  drawButton.addEventListener('click',
    () => setTool(activeTool === 'wall' ? RESTING_TOOL : 'wall'));

  // ── the tool column ───────────────────────────────────────────────────────
  // SEVENTEEN KEYS, RENDERED FROM THE LIST. tool-roster.js holds the roster;
  // this builds it and wires it to the register above. Nothing here decides
  // what a tool does — pressing a key sets `activeTool` and that is all — so a
  // tool whose gesture is not written yet still lights, still says what it
  // would do, and still puts the previous one down. A key that did nothing at
  // all would be worse than no key: it would look like a working tool.
  //
  // THE LETTERS ARE READ ONCE AT BUILD, from SETTINGS through the roster. A
  // remap made in another tab lands on the next load, which is how every other
  // profile-backed value on this page behaves.
  const buildToolColumn = () => {
    const roster = window.DraftToolRoster;
    const slot = document.getElementById('tool-slot');
    if (!roster || !slot) return;
    const resolved = roster.bindings();
    slot.replaceChildren(...roster.GROUPS.map(group => {
      const box = document.createElement('div');
      box.dataset.toolGroup = group.id;
      const name = document.createElement('div');
      name.dataset.toolGroupName = '';
      name.textContent = group.label;
      const keys = document.createElement('div');
      keys.className = 'tool-keys';
      keys.append(...roster.inGroup(group.id).map(tool => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'tool-key';
        btn.dataset.toolKey = tool.id;
        btn.dataset.toolKind = tool.kind;
        btn.setAttribute('aria-pressed', String(tool.id === activeTool));
        // The title is the whole name, because the face is 40px and
        // FENESTRATION does not fit on it at a readable size.
        btn.title = tool.name;
        const letter = document.createElement('span');
        letter.dataset.toolLetter = '';
        letter.textContent = roster.keyFor(tool.id, resolved);
        const label = document.createElement('span');
        label.dataset.toolName = '';
        label.textContent = tool.name;
        btn.append(letter, label);
        // PRESSING THE ARMED KEY RETURNS TO SELECT rather than to nothing --
        // see the register's comment. Pressing SELECT while select is armed is
        // therefore a no-op, which is right: it is the resting state.
        btn.addEventListener('click',
          () => setTool(tool.id === activeTool ? RESTING_TOOL : tool.id));
        return btn;
      }));
      box.append(name, keys);
      return box;
    }));
  };

  // The register tells the column, never the other way round. Any future
  // arming path -- a keyboard shortcut, a tool that puts itself down when it
  // finishes -- lights the right key for free, because it goes through
  // setTool and setTool is what fires this.
  toolListeners.push(next => {
    document.querySelectorAll('[data-tool-key]').forEach(btn => {
      btn.setAttribute('aria-pressed', String(btn.dataset.toolKey === next));
    });
  });

  buildToolColumn();

  // ── SELECTION and OBJECT TYPE ─────────────────────────────────────────────
  // THE HELP STRINGS ARE THE OLD PAGE'S, VERBATIM (:23597 and :23619). They are
  // not decoration: the mode help is the only place the shift-drag shortcut is
  // written down, and the filter help is the only thing that tells a drafter
  // why the thing under the cursor stopped responding. Paraphrasing them would
  // have quietly dropped facts a drafter depends on.
  const MODES = [
    { id: 'click', label: 'ITEMS' },
    { id: 'window', label: 'WINDOW' },
    { id: 'window-all', label: 'ALL LEVELS' },
  ];
  const MODE_HELP = {
    click: 'Click items to select; Shift adds or removes. Press and drag for a '
      + 'blue window — hold Shift while dragging for a red all-levels window.',
    window: 'Drag a blue box to select fully enclosed items on the current level.',
    'window-all': 'Drag a red box to select fully enclosed items on every level.',
  };
  const FILTERS = [
    { id: 'all', label: 'ALL', aria: 'Grab any object type' },
    { id: 'line', label: 'LINE', aria: 'Grab only lines' },
    { id: 'wall', label: 'WALL', aria: 'Grab only walls' },
    { id: 'outline', label: 'OUTLINE', aria: 'Grab only outlines' },
    { id: 'floor', label: 'FLOOR', aria: 'Grab only floors' },
  ];
  const filterHelp = () => (selectFilter === 'all'
    ? 'Engage a type so Select only grabs that object — even under other geometry.'
    : `${selectFilter.toUpperCase()} is engaged: nothing else responds. `
      + 'Click ALL — or press Esc with nothing selected — to release.');

  // PICKING A MODE ALSO ARMS SELECT, which is the old page's own behaviour
  // (setClickSelectionMode and its two siblings all set activeTool: 'select').
  // Without it a drafter with WALL armed could press WINDOW, see it light, and
  // still draw a wall on the next drag.
  const setSelectionMode = id => {
    selectionMode = id;
    setTool('select');
    syncSelectionPanel();
  };

  const setSelectFilter = id => { selectFilter = id; syncSelectionPanel(); };

  let syncSelectionPanel = () => {};

  const buildSelectionPanel = () => {
    const slot = document.getElementById('tool-slot');
    if (!slot) return;
    const chip = (dataKey, entry, onPick) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'sel-chip';
      btn.dataset[dataKey] = entry.id;
      btn.textContent = entry.label;
      if (entry.aria) btn.setAttribute('aria-label', entry.aria);
      btn.addEventListener('click', () => onPick(entry.id));
      return btn;
    };
    const section = (name, chips, help) => {
      const box = document.createElement('div');
      box.dataset.toolGroup = name.toLowerCase().replace(/\s+/g, '-');
      const title = document.createElement('div');
      title.dataset.toolGroupName = '';
      title.textContent = name;
      const row = document.createElement('div');
      row.className = 'sel-row';
      row.append(...chips);
      box.append(title, row, help);
      return box;
    };

    const modeHelp = document.createElement('div');
    modeHelp.className = 'sel-help';
    modeHelp.dataset.selHelp = '';
    const filterHelpEl = document.createElement('div');
    filterHelpEl.className = 'sel-help';
    filterHelpEl.dataset.filterHelp = '';

    slot.append(
      section('SELECTION',
        MODES.map(m => chip('selMode', m, setSelectionMode)), modeHelp),
      section('OBJECT TYPE',
        FILTERS.map(f => chip('selFilter', f, setSelectFilter)), filterHelpEl));

    syncSelectionPanel = () => {
      slot.querySelectorAll('[data-sel-mode]').forEach(btn => {
        btn.setAttribute('aria-pressed',
          String(btn.dataset.selMode === selectionMode));
      });
      slot.querySelectorAll('[data-sel-filter]').forEach(btn => {
        btn.setAttribute('aria-pressed',
          String(btn.dataset.selFilter === selectFilter));
      });
      modeHelp.textContent = MODE_HELP[selectionMode];
      filterHelpEl.textContent = filterHelp();
      // RED WHENEVER A FILTER IS ENGAGED -- not when the cursor is over
      // something the filter excludes. selectFilterHelpColor (:23622) is a
      // straight ternary on selectFilter, and a cursor-driven red would mean
      // hit-testing on every mousemove, which the old page does not do.
      filterHelpEl.toggleAttribute('data-engaged', selectFilter !== 'all');
    };
    syncSelectionPanel();
  };

  buildSelectionPanel();

  // ── ASSEMBLY and UNGROUP ──────────────────────────────────────────────────
  // WHAT AN ASSEMBLY IS, in the file: a named set of members recorded by TYPE
  // AND ID, never by object reference (_createGroup :17940). Ids are what
  // survive a save; references are not.
  //
  // ESCAPE IN THE NAME FIELD CREATES A "NOT FIXED" ASSEMBLY. It does not
  // cancel. That is the old page's binding (onGroupNameKey :23685-23687:
  // Enter -> _createGroup(true), Escape -> _createGroup(false)) and it is
  // ported faithfully because this order says the roster is not a place to
  // improve on -- but it is worth someone's decision rather than quiet
  // inheritance: everywhere else on both pages Escape backs out, so a drafter
  // reaching for it to abandon the dialog gets an assembly they did not want.
  // Flagged, not fixed.
  const nextGroupNumber = () => {
    const n = Number(drawing?.nextGroupId);
    return Number.isFinite(n) && n > 0 ? n : (groups().length + 1);
  };

  const createAssembly = fixed => {
    const chosen = selection.slice();
    if (!chosen.length) { closeAssemblyDialog(); return; }
    const members = [];
    chosen.forEach(entry => {
      if (!entry.item || entry.item.id == null) return;
      const key = memberKey(entry);
      if (!members.some(m => `${m.type}:${m.id}` === key)) {
        members.push({ type: entry.type, id: entry.item.id });
      }
    });
    if (!members.length) { closeAssemblyDialog(); return; }
    // AN ITEM BELONGS TO ONE ASSEMBLY. Taking it into a new one takes it out
    // of its old one, and an assembly left with nothing in it goes -- the old
    // page's own two lines, and without them a drafter can build overlapping
    // assemblies that disagree about what moves with what.
    const taken = new Set(members.map(m => `${m.type}:${m.id}`));
    drawing.groups = groups()
      .map(group => ({ ...group,
        members: (group.members || [])
          .filter(m => !taken.has(`${m.type}:${m.id}`)) }))
      .filter(group => group.members.length > 0);

    const n = nextGroupNumber();
    const typed = (assemblyName || '').trim().toUpperCase();
    const firstWall = chosen.find(entry => entry.type === 'wall')?.item;
    const group = {
      id: `group-${n}`,
      name: typed || `ASSEMBLY ${n}`,
      fixed: fixed === true,
      stretchBehavior: fixed === true ? 'rigid' : 'item-geometry',
      members,
      // The first wall's settings ride the assembly, so a later change to the
      // assembly has something to change FROM. Null when it holds no wall.
      wallSettings: firstWall ? {
        wallType: firstWall.wallType,
        baseHeight: firstWall.baseHeight,
        topHeight: firstWall.topHeight,
        refLine: firstWall.refLine,
      } : null,
    };
    drawing.groups.push(group);
    drawing.nextGroupId = n + 1;
    // The new assembly is what is selected afterwards -- all of it, which is
    // also the drafter's confirmation that it took.
    setSelection(itemsOfGroup(group));
    assemblyName = '';
    closeAssemblyDialog();
    markDirty();
    paint();
  };

  const ungroupSelected = () => {
    const going = selectedGroups();
    if (!going.length) return;
    const ids = new Set(going.map(group => group.id));
    // THE ITEMS SURVIVE; only the grouping goes. Ungroup is not delete, and
    // the members stay selected so the drafter can see what they just freed.
    drawing.groups = groups().filter(group => !ids.has(group.id));
    syncAssembly();
    markDirty();
    paint();
  };

  let assemblyName = '';
  let assemblyDialogOpen = false;
  let syncAssembly = () => {};
  const closeAssemblyDialog = () => { assemblyDialogOpen = false; syncAssembly(); };

  const buildAssemblyPanel = () => {
    const slot = document.getElementById('tool-slot');
    if (!slot) return;
    const box = document.createElement('div');
    box.dataset.toolGroup = 'assembly';
    const title = document.createElement('div');
    title.dataset.toolGroupName = '';
    title.textContent = 'ASSEMBLY';

    const asmBtn = document.createElement('button');
    asmBtn.type = 'button';
    asmBtn.className = 'sel-chip asm-wide';
    asmBtn.dataset.assemblyStart = '';
    asmBtn.addEventListener('click', () => {
      if (!selection.length) return;
      assemblyDialogOpen = true;
      syncAssembly();
      slot.querySelector('[data-assembly-name]')?.focus();
    });

    const unBtn = document.createElement('button');
    unBtn.type = 'button';
    unBtn.className = 'sel-chip asm-wide';
    unBtn.dataset.assemblyUngroup = '';
    unBtn.addEventListener('click', ungroupSelected);

    const help = document.createElement('div');
    help.className = 'sel-help';
    help.dataset.assemblyHelp = '';

    const dialog = document.createElement('div');
    dialog.dataset.assemblyDialog = '';
    dialog.hidden = true;
    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.dataset.assemblyName = '';
    nameInput.placeholder = 'NAME';
    nameInput.addEventListener('input', e => { assemblyName = e.target.value; });
    nameInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); createAssembly(true); }
      // See the note above: Escape here CREATES, it does not cancel.
      if (e.key === 'Escape') { e.preventDefault(); createAssembly(false); }
      // The page's own Escape clears the selection, which would empty the
      // dialog out from under itself.
      e.stopPropagation();
    });
    const row = document.createElement('div');
    row.className = 'sel-row';
    const fixedBtn = document.createElement('button');
    fixedBtn.type = 'button';
    fixedBtn.className = 'sel-chip';
    fixedBtn.dataset.assemblyFixed = '';
    fixedBtn.textContent = 'FIXED';
    fixedBtn.addEventListener('click', () => createAssembly(true));
    const looseBtn = document.createElement('button');
    looseBtn.type = 'button';
    looseBtn.className = 'sel-chip';
    looseBtn.dataset.assemblyLoose = '';
    looseBtn.textContent = 'NOT FIXED';
    looseBtn.addEventListener('click', () => createAssembly(false));
    row.append(fixedBtn, looseBtn);
    dialog.append(nameInput, row);

    box.append(title, asmBtn, unBtn, help, dialog);
    slot.append(box);

    syncAssembly = () => {
      const n = selection.length;
      const held = selectedGroups();
      const key = window.DraftToolRoster?.keyFor('select')
        ? window.DraftToolRoster.bindings() : {};
      const gKey = window.DraftKeyboard?.keyBindingLabel(key.group) || '';
      asmBtn.textContent = gKey ? `ASSEMBLY  [${gKey}]` : 'ASSEMBLY';
      asmBtn.disabled = n === 0;
      unBtn.textContent = 'UNGROUP';
      unBtn.disabled = held.length === 0;
      unBtn.hidden = held.length === 0;
      // The old page's own two sentences (:23631-23633), and the red is its
      // own too: nothing selected is the state that stops the button working.
      help.textContent = n
        ? `${n} selected item${n === 1 ? '' : 's'} · make a named assembly.`
        : 'Select drawing items before assembling them.';
      help.toggleAttribute('data-engaged', n === 0);
      dialog.hidden = !assemblyDialogOpen;
      if (!assemblyDialogOpen) nameInput.value = assemblyName = '';
    };
    syncAssembly();
  };

  buildAssemblyPanel();
  selectionWatchers.push(() => syncAssembly());

  // ── THE STRUCTURE PROPERTIES PANEL ───────────────────────────────────────
  //
  // WHAT IT DOES NOT DO, said plainly rather than left to be discovered: it
  // does not make an existing column or beam clickable. This page's hit-test
  // knows walls, lines and floors; teaching it structure is the selection
  // system's job and not #392's. So the panel shows the item the drafter just
  // PLACED, which is the moment its properties are wanted and the moment
  // commitWall already selects its wall in.
  //
  // ONE VALUE PER ROW, AND THE VALUES ARE THE FORMAT'S. footing and mode are
  // enumerations drawing-format.js validates (:517 and :563); anything not on
  // those lists is silently replaced with the default on the next load, so the
  // panel offers exactly what the reader accepts and nothing else.
  const FOOTINGS = [['pad36', 'PAD 36"'], ['pad42', 'PAD 42"'],
    ['pile8', 'PILE 8"'], ['pile10', 'PILE 10"'], ['pile12', 'PILE 12"']];
  const BEAM_MODES = [['flush', 'FLUSH'], ['dropped', 'DROPPED']];

  const propRow = (label, options, current, pick) => {
    const row = document.createElement('div');
    row.dataset.propRow = label.toLowerCase();
    const name = document.createElement('div');
    name.className = 'props-title';
    name.textContent = label;
    const chips = document.createElement('div');
    chips.className = 'chip-row';
    chips.append(...options.map(([id, face]) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'sel-chip';
      btn.dataset.propValue = id;
      btn.textContent = face;
      btn.setAttribute('aria-pressed', String(id === current));
      btn.addEventListener('click', () => pick(id));
      return btn;
    }));
    row.append(name, chips);
    return row;
  };

  const showStructureProps = () => {
    const P = window.ModelProps;
    if (!P) return;
    const picked = selection.length === 1 ? selection[0] : null;
    if (!picked || (picked.type !== 'column' && picked.type !== 'beam')) return;
    const item = picked.item;
    const box = document.createElement('div');
    if (picked.type === 'column') {
      box.append(propRow('FOOTING', FOOTINGS, item.footing, id => {
        item.footing = id;
        // A pile has a fixed diameter, so a pad's custom size is meaningless
        // on one. The format drops padIn for piles anyway (:534); dropping it
        // here too keeps the page's record and the reader's identical.
        if (id.startsWith('pile')) delete item.padIn;
        markDirty();
        showStructureProps();
        paint();
      }));
    } else {
      const span = Math.hypot(item.end.x - item.start.x, item.end.z - item.start.z);
      box.append(propRow('BEAM', BEAM_MODES, item.mode, id => {
        item.mode = id;
        markDirty();
        showStructureProps();
        paint();
      }));
      const len = document.createElement('div');
      len.dataset.propSpan = '';
      len.className = 'props-title';
      // The span is read from the geometry, never stored: a stored length and
      // a moved endpoint are two facts that can disagree, and the drafter
      // would believe the one on the panel.
      len.textContent = `SPAN ${feetLabel(span)}`;
      box.append(len);
    }
    P.set(picked.type === 'column' ? 'COLUMN' : 'BEAM', box);
  };
  selectionWatchers.push(showStructureProps);
  deleteButton.addEventListener('click', () => {
    const wall = selectedWall();
    if (!wall) return;
    deleteWall(wall);    paint();
  });

  // ── pan and zoom ──────────────────────────────────────────────────────────
  let dragging = null;
  // One drag for both gestures: `kind` says whether the press took a corner or
  // the wall's body, and `before` is the list of pooled vertices it will move
  // with the numbers they started with.
  let moveDrag = null;
  canvas.addEventListener('pointerdown', e => {
    const rect = canvas.getBoundingClientRect();
    const at = toWorld(e.clientX - rect.left, e.clientY - rect.top);
    // THE RULER TAKES THE PRESS BEFORE ANYTHING ELSE, because it is the one
    // instrument that must be usable ON TOP of whatever is being drawn: a
    // drafter measures between two corners of a wall he is halfway through
    // placing. It writes nothing to the drawing -- two presses and a number
    // on the strip -- so taking the press costs him no geometry.
    if (rulerOn) { rulerPress(at); return; }
    // ARMED TAKES THE PRESS WHOLE, before the corner/body hit test and before
    // panning. Otherwise the first tap of a wall that starts on an existing
    // corner would be read as grabbing that corner, and the drafter would drag
    // the building instead of drawing against it.
    if (activeTool === 'column') { placeColumn(at); return; }
    if (activeTool === 'beam') { beamPress(at); return; }
    if (activeTool === 'wall') { drawPress(at); return; }
    // A WINDOW MODE TAKES THE PRESS BEFORE THE PAN, and before the corner and
    // body tests too. Otherwise a box begun on a selected wall would grab that
    // wall instead, and the drafter would drag the building across the sheet
    // while trying to draw a box round it.
    if (activeTool === RESTING_TOOL && selectionMode !== 'click') {
      bandDrag = { from: at, to: at, sx: e.clientX, sy: e.clientY,
        active: false, shift: e.shiftKey };
      canvas.setPointerCapture(e.pointerId);
      return;
    }
    // VERTEX BEFORE BODY — the old page's own precedence (_findVertexHit at
    // MODEL.dc.html:16791, then _findLineHit at :16799). A press near a corner
    // is a corner press even though it is also on the wall.
    const corner = cornerAt(at);
    const body = corner ? null : wallBodyAt(at);
    if (corner || body) {
      // A grabbed corner or wall takes the gesture whole: no pan starts, so
      // the sheet cannot slide out from under geometry being placed.
      const ends = corner ? [corner] : movingEnds(body);
      moveDrag = {
        kind: corner ? 'corner' : 'wall',
        grab: at,
        before: ends.map(v => ({ vtx: v, x: v.x, z: v.z, offX: v.offX, offZ: v.offZ })),
        sx: e.clientX, sy: e.clientY, active: false,
      };
      canvas.setPointerCapture(e.pointerId);
      return;
    }
    canvas.classList.remove('over-corner', 'over-wall');
    dragging = { sx: e.clientX, sy: e.clientY, cx: view.cx, cz: view.cz, moved: 0 };
    canvas.classList.add('dragging');
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e => {
    if (bandDrag) {
      // The same 4px arm the corner drag uses: under that it is a click, and a
      // one-pixel box that selects nothing is indistinguishable from a tap
      // that missed.
      if (!bandDrag.active
        && Math.hypot(e.clientX - bandDrag.sx, e.clientY - bandDrag.sy) > DRAG_ARM_PX) {
        bandDrag.active = true;
      }
      const rect = canvas.getBoundingClientRect();
      bandDrag.to = toWorld(e.clientX - rect.left, e.clientY - rect.top);
      if (bandDrag.active) paint();
      return;
    }
    if (moveDrag) {
      const md = moveDrag;
      if (!md.active && Math.hypot(e.clientX - md.sx, e.clientY - md.sy) > DRAG_ARM_PX) md.active = true;
      if (md.active) {
        const rect = canvas.getBoundingClientRect();
        const raw = toWorld(e.clientX - rect.left, e.clientY - rect.top);
        if (md.kind === 'corner') {
          // The corner goes TO the cursor, not by the cursor's delta — the old
          // page's node drag writes the point through (MODEL.dc.html:10848),
          // so a corner grabbed off-centre still lands under the pointer.
          const pt = cornerSnap(raw, md.before[0].vtx) || raw;
          md.before[0].vtx.x = pt.x;
          md.before[0].vtx.z = pt.z;
        } else {
          // A WALL MOVES BY THE DELTA, and the delta is measured from where
          // the press landed to where the cursor is now — never accumulated
          // move to move. Absolute is what makes "both ends travelled the same
          // distance" exactly true, rather than true to within the float drift
          // of a hundred pointermove events.
          let dx = raw.x - md.grab.x, dz = raw.z - md.grab.z;
          const snapped = wallSnapDelta(md.before, dx, dz);
          if (snapped) { dx = snapped.dx; dz = snapped.dz; }
          md.before.forEach(b => { b.vtx.x = b.x + dx; b.vtx.z = b.z + dz; });
        }
        // Live, on every move, exactly where the old page relinks — not once
        // on release. The two agree at the end of a completed drag; they part
        // company on a drag the browser cancels mid-gesture, and matching the
        // old page is the point.
        md.before.forEach(b => relinkVertex(b.vtx));
        paint();
      }
      return;
    }
    if (!dragging) {
      // HOVER HINT. The handles are 8px squares and the grab zone is 30, so
      // without this there is nothing on screen telling a drafter where the
      // corner tool starts and the pan ends — and now the same for the body of
      // a selected wall, whose grab zone has no marks on it at all.
      const rect = canvas.getBoundingClientRect();
      const at = toWorld(e.clientX - rect.left, e.clientY - rect.top);
      // The instruments read the cursor, which is what makes them
      // instruments: length and angle are live while the run is in hand and
      // blank when it is not, exactly as the old strip behaves.
      cursorWorld = at;
      stripRefresh();
      const corner = cornerAt(at);
      canvas.classList.toggle('over-corner', !!corner);
      canvas.classList.toggle('over-wall', !corner && !!wallBodyAt(at));
      return;
    }
    dragging.moved = Math.max(dragging.moved,
      Math.hypot(e.clientX - dragging.sx, e.clientY - dragging.sy));
    view.cx = dragging.cx - (e.clientX - dragging.sx) / view.scale;
    view.cz = dragging.cz - (e.clientY - dragging.sy) / view.scale;
    paint();
  });
  const endDrag = e => {
    if (bandDrag) {
      const band = bandDrag;
      bandDrag = null;
      if (e && canvas.hasPointerCapture?.(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
      if (band.active) {
        const raw = enclosedBy(band.from, band.to);
        // Deduped by item. withGroup is the identity today (see its note), so
        // this is a straight copy -- kept as the shape it will need if the
        // whole-assembly question above is ever answered yes.
        const caught = [];
        raw.forEach(entry => withGroup(entry).forEach(w => {
          if (!caught.some(c => c.item === w.item)) caught.push(w);
        }));
        // SHIFT ADDS TO WHAT IS THERE, exactly as it does for a click, and the
        // old page's own `!shiftHeld` replace flag. Without it a drafter can
        // build a selection by clicking but not by boxing, which is the
        // inconsistency that makes a tool feel broken rather than limited.
        setSelection(band.shift
          ? selection.concat(caught.filter(c =>
            !selection.some(entry => entry.item === c.item)))
          : caught);
      } else {
        // A press that never armed is a click, and a click still selects --
        // the old page runs _handleSelectClick for "a clean click (no drag) in
        // select mode" whichever window mode is armed.
        const rect = canvas.getBoundingClientRect();
        const hit = hitAt(toWorld(e.clientX - rect.left, e.clientY - rect.top));
        setSelection(hit ? [hit] : []);
      }
      paint();
      return;
    }
    if (moveDrag) {
      const md = moveDrag;
      // A grab that never armed moved nothing, so there is nothing to undo —
      // and a snapshot pushed for it would make one Ctrl+Z do nothing visible.
      if (md.active) {
        undoStack.push({ kind: 'move', before: md.before });
        markDirty();
      }
      moveDrag = null;
      if (e && canvas.hasPointerCapture?.(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
      return;
    }
    if (!dragging) return;
    // A CLICK SELECTS, A DRAG PANS, and the difference is 4px of travel. Every
    // pointerdown starts a pan here -- it has since tier 1 -- so selection
    // cannot take pointerdown without taking panning with it. Deciding on
    // RELEASE, by how far the pointer actually went, leaves the pan untouched:
    // a drafter who moved the sheet gets no selection, and one who tapped a
    // wall gets no pan they can see.
    if (dragging.moved <= 4 && e) {
      const rect = canvas.getBoundingClientRect();
      const hit = hitAt(toWorld(e.clientX - rect.left, e.clientY - rect.top));
      // SHIFT ADDS OR REMOVES, which is what the mode help line promises and
      // the only way to build a selection of more than one by clicking. A
      // shift-click on something already selected takes it OUT -- the old
      // page's own toggle, and the reason the help says "adds or removes"
      // rather than "adds".
      if (e.shiftKey) {
        if (hit) {
          const at = selection.findIndex(entry => entry.item === hit.item);
          const whole = withGroup(hit);
          setSelection(at >= 0
            ? selection.filter(entry => !whole.some(w => w.item === entry.item))
            : selection.concat(whole.filter(w =>
              !selection.some(entry => entry.item === w.item))));
        }
        // A shift-click on empty space keeps the selection. Clearing it would
        // make an inaccurate shift-click destroy the set a drafter just built.
      } else {
        // An empty click clears, which is the other half of select: without it
        // the drafter has no way to put a selection down.
        setSelection(withGroup(hit));
      }
      paint();
    }
    dragging = null;
    canvas.classList.remove('dragging');
    if (e && canvas.hasPointerCapture?.(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
  };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    // Zoom about the cursor: the world point under it must not move.
    const before = toWorld(sx, sy);
    const factor = Math.exp(-e.deltaY * 0.0015);
    view.scale = Math.max(0.25, Math.min(view.scale * factor, 200));
    const after = toWorld(sx, sy);
    view.cx += before.x - after.x;
    view.cz += before.z - after.z;
    paint();
  }, { passive: false });

  window.addEventListener('keydown', e => {
    if (e.key === '0') { fit(); paint(); }
    // ESCAPE IS THE OLD PAGE'S ESCAPE, measured rather than invented.
    // MODEL.dc.html:22165-22172 does two things in ONE press: it cancels every
    // in-progress gesture (_cancelWall among a dozen siblings) AND clears the
    // selection. It does NOT put the tool down — activeTool survives, so the
    // drafter who was drawing walls is still drawing walls.
    //
    // A ladder was tried here first — pending start, then the mode, then the
    // selection, one press each — and it is wrong twice over: it takes two
    // presses to reach the selection, and it disarms a tool the old page
    // keeps. A drafter who learns Escape on one page would lose their tool on
    // the other. The DRAW button is how this page puts the tool down, because
    // it is the affordance a drafter with no keyboard can reach.
    if (e.key === 'Escape') {
      drawStart = null;
      // ESC WITH NOTHING SELECTED RELEASES THE FILTER, which is the release
      // the filter help line promises in writing (:22418-22419). With
      // something selected Esc clears the selection first, so a drafter never
      // loses both in one press.
      if (!selection.length && selectFilter !== 'all') setSelectFilter('all');
      setSelection([]);
      // A half-taken measure is an in-progress gesture like any other, so it
      // goes down with them. The ruler itself stays up, the way the tool does.
      rulerFrom = null;
      stripRefresh();
      paint();
      return;
    }
    // 3c TAKES THE WALL CASE ONLY. The old page's `delete` answers for walls,
    // floors, roofs, fenestrations, surface openings, dimensions, fixtures and
    // outline nodes at once (MODEL.dc.html:22209), behind a "this corner
    // carries built geometry" refusal (:22196). This page can select a wall
    // and nothing else, so the key does the one thing it can do and is silent
    // on the rest — said out loud here because the drafter presses the same
    // key for all of them and a silent no-op reads as a broken page.
    if ((e.key === 'Delete' || e.key === 'Backspace') && selectedWall()) {
      e.preventDefault();
      deleteWall(selectedWall());
      paint();
      return;
    }
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z') {
      const step = undoStack.pop();
      if (!step) return;
      e.preventDefault();
      // ONE PRESS IS ONE UNDO whether the press moved one corner or a wall's
      // two, drew a wall, or deleted one: the entry is whatever that gesture
      // captured, so a wall goes back in one keystroke rather than two.
      if (step.kind === 'move') {
        step.before.forEach(b => {
          b.vtx.x = b.x;
          b.vtx.z = b.z;
          // The offsets go BACK to what they were, not to a re-measure. Undo that
          // recomputed them would leave the corner at its old position carrying a
          // new offset — a different drawing from the one before the drag, and one
          // whose difference nothing on screen would show.
          if (b.offX !== undefined) { b.vtx.offX = b.offX; b.vtx.offZ = b.offZ; }
        });
      } else if (step.kind === 'add-item') {
        // Structure placement. The list is captured in the step, so this works
        // for columns and beams without knowing which it is holding.
        const at = step.list.indexOf(step.item);
        if (at >= 0) step.list.splice(at, 1);
      } else if (step.kind === 'add') {
        const at = drawing.walls.indexOf(step.wall);
        if (at >= 0) drawing.walls.splice(at, 1);
        setSelection(selection.filter(entry => entry.item !== step.wall));
        // AND RETIRE THE CORNERS IT INTRODUCED, or the pool keeps a phantom
        // the next drawn wall snaps to — a corner belonging to a wall that no
        // longer exists, invisible and magnetic.
        retirePoolCorners([step.wall.start, step.wall.end]);
      } else if (step.kind === 'remove') {
        drawing.walls.splice(Math.min(step.index, drawing.walls.length), 0, step.wall);
        // The dependents come back BY VALUE into the same raw arrays the
        // cascade took them out of. They were never normalised on the way in
        // (this page rides them through on the ...parsed spread), so putting
        // the same objects back is the only restoration that is exact.
        step.deps.forEach(d => { if (Array.isArray(d.list)) d.list.splice(Math.min(d.index, d.list.length), 0, d.item); });
        // AND THE CORNERS GO BACK IN THE POOL. The restored wall already holds
        // these objects — identity on the wall survives the round trip — but
        // the pool is what the NEXT drawn endpoint searches. Leave them out
        // and a wall drawn onto the restored free end mints a fresh object at
        // the same coordinates instead of joining: every number right, the
        // drawing right, and the mitre silently gone. That is the same class
        // as the pooling mutation this rung's specs already caught, arriving
        // through undo instead of through create.
        (step.retired || []).forEach(corner => {
          if (!vertexPool.includes(corner)) vertexPool.push(corner);
        });
      }
      // AN UNDO IS AN EDIT TOO. The drawing on screen no longer matches the
      // file — going back to where you started is only free if you never
      // saved the trip out.
      markDirty();
      paint();
    }
  });
  window.addEventListener('resize', resize);

  // ── boot ──────────────────────────────────────────────────────────────────
  // ── from a saved file to the drawing on this page ─────────────────────────
  // Parse, check the envelope, normalise the four collections this page owns
  // rules for, and rebuild reference equality at the shared corners. BOOT AND
  // THE CHANGE BROADCAST BOTH COME THROUGH HERE, so a page that adopts another
  // page's write builds exactly the drawing a reload would have built — one
  // definition of what reading a file means, not two that drift.
  //
  // Returns false when the file could not be adopted, having already told the
  // drafter why. The drawing on screen is left alone in that case: a page that
  // blanked itself because somebody else wrote something unreadable would turn
  // one damaged file into two lost drawings.
  const adoptFile = async file => {
    let parsed;
    try {
      parsed = JSON.parse(await file.text());
    } catch (err) {
      readout.textContent = 'unreadable';
      say('The saved drawing could not be parsed',
        `<p><code>${String(err && err.message || err)}</code></p>`);
      return false;
    }

    // The same envelope check MODEL.dc.html runs, from the same module, so this
    // page agrees with the old one about what a valid drawing is rather than
    // inventing a second opinion.
    const check = window.DraftDrawingFormat?.checkEnvelope(parsed)
      || { ok: true, reason: 'unchecked' };
    if (!check.ok) {
      readout.textContent = `envelope ${check.reason}`;
      say('That drawing is not one this page can read',
        `<p>checkEnvelope said <code>${check.reason}</code>.
            <code>version</code> means it was written by a newer MODEL than this page knows.</p>`);
      return false;
    }

    // VALIDATE THE THREE TYPES NOTHING VALIDATED. Every other item type on a
    // saved drawing goes through drawing-format.js on load; walls, lines and
    // floors were inflated inline in MODEL.dc.html, so this page read them raw
    // -- no view whitelist, no wallType check, no zero-length rejection. The
    // rules now live in the shared module (drawing-format.js) and this is the
    // first caller of them.
    //
    // REJECTED ITEMS ARE NOT DRAWN AND NOT DELETED (RULING-a-rejected-item-is-
    // still-the-drafters, 11 Sep). They used to be dropped, exactly as the old
    // page drops them, and a SAVE then wrote the file back without them: a
    // drafter who opened a drawing and pressed SAVE had asked to draw nothing
    // and lost geometry anyway. Same failure as the 12" foundation, a different
    // field.
    //
    // So each normaliser is handed a `drops` sink and what it refuses is kept
    // RAW, by index, for the serializer to put back untouched. The readout says
    // how many are being carried, so a malformed drawing reads as a fact rather
    // than as a page that quietly lost -- or quietly kept -- geometry.
    const F = window.DraftDrawingFormat;
    const levelIds = new Set((parsed.levels || []).map(level => Number(level.id)));
    const WT = window.DraftWallTypes;
    refusedItems = { walls: [], lines: [], floors: [], dimensions: [] };
    drawing = {
      ...parsed,
      walls: F.walls(parsed.walls, levelIds, {
        wallTypes: WT.WALL_TYPES,
        legacyWallTypes: WT.LEGACY_WALL_TYPES,
        defaultWallTopFt: 8,
        drops: refusedItems.walls,
      }),
      // THE KNOWN LAYERS, or the normaliser flattens them. format.lines folds
      // any layer outside this set to 'draft' (or E-POWER); passing {} here
      // read fine — a flattened layer still paints — but the Write Tier
      // re-emits what it loaded, so a save through this page would have
      // quietly moved every A-DOOR and A-GLAZ line to draft. The set is
      // derived from the same table MODEL.dc.html derives its own from.
      lines: F.lines(parsed.lines, levelIds, {
        knownLayerIds: new Set(window.DraftLayerStandards.DEFAULT_LAYER_STANDARDS
          .flatMap(group => group.layers).map(layer => layer.id)),
        drops: refusedItems.lines,
      }),
      floors: F.floors(parsed.floors, levelIds, {
        defaultFloorThickness: 0.75,
        drops: refusedItems.floors,
      }),
      // Dimensions already had a rule; this page just never called it. Running
      // it is what lets the view filter above trust that every dimension in
      // the array carries a real view.
      dimensions: F.dimensions(parsed.dimensions, levelIds, { drops: refusedItems.dimensions }),
      // Normalised here rather than at the paint site so the null survives to
      // exactly one place that resolves it. `drawing` is built by spreading
      // `parsed`, so without this line the raw key would still be present and
      // the paint site would read it -- indistinguishable for a valid number,
      // wrong for a quoted one, since the format does not coerce.
      autoDimFirstOffsetFt: F.autoDimFirstOffsetFt(parsed.autoDimFirstOffsetFt),
    };
    // Recorded against the RAW file: the normaliser is the only thing that knows
    // a substitution happened, and it does not say so — the two types differ and
    // nothing else marks it.
    substitutedWallTypes = new Map();
    (Array.isArray(parsed.walls) ? parsed.walls : []).forEach(raw => {
      if (!raw || typeof raw.wallType !== 'string') return;
      const kept = drawing.walls.find(wall => wall.id === raw.id);
      if (kept && kept.wallType !== raw.wallType) {
        substitutedWallTypes.set(kept.id, { original: raw.wallType, painted: kept.wallType });
      }
    });

    // ONE SOURCE, NOT TWO. This used to be a length difference between the raw
    // arrays and the normalised ones. It agreed with the sink by construction,
    // which is the problem: two ways to count the same thing drift, and the one
    // that drifts is the one nothing reads back.
    dropped = REFUSED_KEYS.reduce((total, key) => total + refusedItems[key].length, 0);

    // REBUILD REFERENCE EQUALITY AT SHARED CORNERS. Everything above restores
    // VALUES: JSON has no way to say "these two walls end at the same point",
    // only "these two walls end at points that happen to be equal". So a
    // drawing read back off disk holds a separate object at every corner --
    // and geometryJoins() keys on OBJECT IDENTITY, so without this pass it
    // finds nothing and every corner stays a butt joint. Silently: no error,
    // no warning, just capped ends on a house that should be mitred.
    //
    // MODEL.dc.html does the same thing on its own load path and describes it
    // the same way: "restores reference equality at shared corners instead of
    // merely restoring values."
    //
    // The key is the pool's, not this page's: (levelId, viewId, body). The
    // view is folded to two values because a wall on the e-power or floor set
    // is the same physical wall as the one on plan and shares its corner. The
    // BODY IS PASSED THROUGH UNTOUCHED -- collapsing it is what would let a
    // garage, or a shed, splice onto a house corner, and the normaliser is
    // already the place that decides what a body may be.
    const G = window.DraftGeometry2D;
    vertexPool = [];
    // mergeVertex copies coordinates and pool identity, NOTHING ELSE — and a
    // stored point may carry more: srcId/offX/offZ, the link that lets a wall
    // corner ride its BONEYARD master point (drawing-format.js stores them on
    // purpose). A viewer could shrug that off; a page that SAVES cannot,
    // because the pooled object is what gets re-emitted, and a save that
    // drops srcId silently unhooks every BUILD HOUSE wall from its bone.
    // First point into a pooled corner wins, matching the identity the old
    // page saved: one shared object per corner has one link.
    const pooled = (pt, wall, view, body) => {
      const v = G.mergeVertex(vertexPool, pt, wall.levelId, view, body);
      if (pt.srcId && !v.srcId) {
        v.srcId = pt.srcId;
        v.offX = pt.offX;
        v.offZ = pt.offZ;
      }
      return v;
    };
    drawing.walls.forEach(wall => {
      const view = wall.view === 'foundation' ? 'foundation' : 'plan';
      const body = wall.body || 'house';
      wall.start = pooled(wall.start, wall, view, body);
      wall.end = pooled(wall.end, wall, view, body);
    });

    // THE HISTORY GOES WITH THE DRAWING IT POINTS INTO. Undo entries hold
    // references to wall and corner OBJECTS, and every one of them has just
    // been replaced. Kept, an undo would splice a wall from the previous
    // drawing back into this one, or move a corner nothing is joined to.
    undoStack.length = 0;
    setSelection([]);
    drawStart = null;
    return true;
  };


  const boot = async () => {
    resize();
    let file = null;
    try {
      // loadSharedFileAt, not loadSharedFile: the file AND the revision it was
      // read at, in one transaction, so the rev handed to a later save really
      // describes the drawing on screen and not some neighbouring moment.
      const at = await window.SharedFileStore.loadSharedFileAt(BUCKET);
      file = at.file;
      storeRev = at.rev;
    } catch (err) {
      readout.textContent = 'store unavailable';
      say('The drawing store could not be opened',
        `<p>IndexedDB refused to open: <code>${String(err && err.message || err)}</code></p>
         <p>Private-browsing windows and blocked site data both do this.</p>`);
      return;
    }
    if (!file) {
      readout.textContent = 'no drawing saved';
      say('No saved drawing on this origin',
        `<p>Nothing is stored under <code>${BUCKET}</code> yet.</p>
         <p>Draw something in <code>MODEL.dc.html</code> on this same origin and save it,
            then reload this page. Storage is per-origin, so a drawing made on a
            different host or port will not appear here.</p>`);
      return;
    }

    if (!(await adoptFile(file))) return;
    // The drawing is on the page: first epoch, as MODEL.dc.html bumps at the
    // end of its load (:6366).
    bumpModelEpoch();
    fit();
    paint();
    // The shell comes up with the drawing, for the same reason the switchers
    // do: a tab that opens an empty panel is furniture.
    syncShell();
    syncBuildBar();
    // The switchers can only be built once the drawing is on the page: their
    // options ARE its levels. Before this the bar stays hidden, like #save.
    buildChrome();
    saveButton.classList.add('show');
    // CLEAN ON ARRIVAL, and stamped rather than assumed: without this the
    // attribute is absent, and absent is not '0' to anything reading it.
    document.body.dataset.saveDirty = '0';
    // Deliberately NOT awaited: the drawing is correct without its tracing
    // images and should be on screen before they arrive. Each one repaints
    // itself as it lands.
    loadUnderlayImages();
    // CLAIMED ONCE THERE IS SOMETHING TO EDIT. A page that failed to load a
    // drawing has nothing to protect and should not hold the lease shut against
    // a page that does.
    await askForLease();
    startLeaseHeartbeat();
  };

  // ── the Write Tier ──────────────────────────────────────────────────────────────────
  // This page has no serializer of its own, ON PURPOSE. `drawing` was built by
  // spreading the parsed save, so every persisted key — all 65 literal ones
  // plus conditional layout/specs passthrough — is still sitting on it,
  // untouched, in the shape MODEL.dc.html wrote. The four collections this
  // page normalises on load are re-emitted through the SAME shared rules the
  // old page saves through, and pooled wall corners go back to stored points
  // through the same pointForStorage that wrote them. Nothing here decides
  // what a drawing looks like; drawing-format.js already did.
  //
  // What a save through this page is, precisely: load → normalise → store.
  // The deep-compare proof in tests/write-tier.spec.js holds the result
  // against a straight legacy save of the same drawing, key for key.
  // ── unsaved edits ─────────────────────────────────────────────────────────
  // MODEL.dc.html AUTOSAVES: _markUnsaved (MODEL.dc.html:6199) writes on every
  // edit, so its UNSAVED is only ever briefly true. THIS PAGE SAVES ON A
  // PRESS, deliberately — the Write Tier note below says why, and the stale
  // check in save() is the other half of it: two pages writing the same file
  // on every drag would spend the day refusing each other. A manual save is
  // only honest if the drafter can see there is something unsaved, so the
  // button carries three true words: SAVE before anything is touched, UNSAVED
  // the instant a corner moves, SAVED once it is written.
  //
  // THE BODY ATTRIBUTE IS LIFTED FROM MODEL.dc.html:6206 and is there for the
  // same stated reason: it flips SYNCHRONOUSLY with the edit, where the
  // button's text lands a frame later. A test that watched the text would be
  // racing the edit it is checking.
  let dirty = false;
  const markDirty = () => {
    if (!drawing) return;
    // EVERY EDIT, ahead of the dirty guard. That guard returns early once the
    // page is already unsaved, which is right for the button and wrong for
    // the epoch: MODEL.dc.html's _markUnsaved has no such short-circuit, so
    // its rail epoch moves on every edit. Bumping below the guard would
    // freeze the six thumbnails on the FIRST change after a save and leave
    // them stale for every change after it -- a wall drawn, no seat updated.
    bumpModelEpoch();
    if (dirty) return;
    dirty = true;
    document.body.dataset.saveDirty = '1';
    saveButton.textContent = 'UNSAVED';
    saveButton.classList.add('dirty');
  };
  const markSaved = () => {
    dirty = false;
    document.body.dataset.saveDirty = '0';
    saveButton.textContent = 'SAVED';
    saveButton.classList.remove('dirty');
  };

  // PUT THE REFUSED ITEMS BACK WHERE THEY CAME FROM. Original index, so a load
  // followed by an untouched SAVE reproduces the file's own order rather than a
  // resemblance of it — the round trip is asserted deep-equal, and an item that
  // comes back in a different slot fails that as surely as one that vanishes.
  //
  // The index clamps. After the drafter adds or deletes, the recorded slot can
  // be past the end of a shorter array, and there is no honest answer to
  // "where does it go now" — it lands as near its old position as the array
  // allows. Stated because it is a choice, not an invariant.
  //
  // Applied to all four collections unconditionally, empty list or not. A
  // `if (refused.length)` around the call site would be dead code on every
  // clean drawing, which is to say untested on every clean drawing.
  const withRefused = (key, items) => {
    const refused = refusedItems[key] || [];
    if (!refused.length) return items;
    const out = items.slice();
    [...refused].sort((a, b) => a.index - b.index)
      .forEach(({ index, item }) => out.splice(Math.min(index, out.length), 0, item));
    return out;
  };

  const serializeDrawing = () => {
    const point = p => window.DraftDrawingFormat.pointForStorage(p);
    return {
      ...drawing,
      walls: withRefused('walls', drawing.walls.map(wall => {
        // Restored ONLY while the wall still carries the type this page
        // substituted; a deliberate later change is the drafter's edit and is
        // what gets written.
        const swap = substitutedWallTypes.get(wall.id);
        const wallType = (swap && wall.wallType === swap.painted) ? swap.original : wall.wallType;
        return { ...wall, wallType, start: point(wall.start), end: point(wall.end) };
      })),
      // Spread from `drawing` these three would already be here; they are named
      // so the refused items go back into them. A refused LINE is as much the
      // drafter's as a refused wall.
      lines: withRefused('lines', drawing.lines),
      floors: withRefused('floors', drawing.floors),
      dimensions: withRefused('dimensions', drawing.dimensions),
    };
  };

  // ONE WRITE, TWO CALLERS. The press and the hide-save below both come through
  // here, and that is the point: two write paths to one file is how the two
  // halves drift apart, and the half that drifts is always the one nobody
  // watches. Everything that decides WHETHER to write stays with the caller;
  // everything that decides HOW lives here.
  //
  // markSaved() is inside the await rather than after it at the call site, so a
  // page cannot say SAVED before the store has taken the bytes.
  const writeDrawing = async () => {
    const contents = JSON.stringify(serializeDrawing());
    const file = new File([contents], 'model-drawing.json', { type: 'application/json' });
    storeRev = await window.SharedFileStore.saveSharedFile(file, BUCKET, {
      // BOTH GUARDS, NOT ONE. The lease prevents the collision; `ifRev`
      // catches the case where prevention failed. Dropping `ifRev` because
      // this page holds a lease would reintroduce audit C3.
      ifRev: Number.isInteger(storeRev) ? storeRev : null,
      lease: { scope: LEASE_SCOPE, holderId: holderId(), generation: leaseGeneration },
    });
    markSaved();
  };

  const save = async () => {
    if (!drawing) return;
    // A READ-ONLY PAGE DOES NOT ASK. The store would refuse it anyway — that gate
    // is the authority and is tested on its own — but a page that fires a write
    // it knows will be refused spends the drafter's attention to learn something
    // it already knew.
    if (!holdsLease()) { paintLease(); return; }
    saveButton.disabled = true;
    saveButton.textContent = 'SAVING…';
    try {
      await writeDrawing();
      // The note described a difference this save has just resolved.
      if (elsewhereNote) elsewhereNote.hidden = true;
      saveButton.disabled = false;
    } catch (error) {
      // The edit is still unsaved, so the button must still say so. Dropping
      // back to a neutral SAVE here would tell a drafter whose write just
      // failed that there is nothing to lose.
      saveButton.textContent = dirty ? 'UNSAVED' : 'SAVE';
      saveButton.disabled = false;
      // A STALE WRITE IS REFUSED, NOT MERGED. MODEL.dc.html re-reads and
      // retries because it holds live edits worth fighting for; this page
      // holds only what it loaded, so the honest resolution is to reload and
      // read what is really there now.
      // TAKEN OVER BETWEEN THE PRESS AND THE WRITE. The edit is untouched and
      // still on screen; the banner names who holds it and offers it back.
      if (error?.lease) {
        leaseGeneration = null;
        leaseHolder = error.holderId;
        paintLease();
        return;
      }
      if (error?.stale) {
        say('The drawing changed underneath this page',
          `<p>Another page saved since this one loaded. Nothing was written.
              Reload to pick up the current drawing, then save again.</p>`);
        return;
      }
      say('The save failed', `<p><code>${String(error && error.message || error)}</code></p>`);
    }
  };
  saveButton.addEventListener('click', save);

  // THE LAST THING BETWEEN AN EDIT AND LOSING IT. MODEL.dc.html never needed
  // this: _markUnsaved (MODEL.dc.html:6199) writes on every edit, so there is
  // never a closed tab with work in it. This page saves on a press, which is
  // the right call for a second writer on one file — and it is what puts a
  // drafter one stray Ctrl+W away from a moved corner that never landed.
  //
  // The browser owns the dialog and its wording; a page can only say whether
  // there is something to lose.
  //
  // TWO SPELLINGS, AND ONLY ONE OF THEM IS TESTED HERE. Mutating preventDefault
  // away makes the spec below fail; mutating returnValue away does not — this
  // Chromium reads preventDefault and nothing else. returnValue is the older
  // spelling, kept for the engines that still read only it, and THE SUITE
  // CANNOT PROVE IT DOES ANYTHING, because it runs one engine. Said out loud
  // rather than left as a line that reads as verified: a reader who deletes it
  // will see every test pass.
  //
  // This is the honest minimum, not the answer. The answer is autosave, and
  // autosave here means deciding what happens when this page and MODEL.dc.html
  // both hold the same file — the ifRev refusal in save() above is one half of
  // a story that has not been written yet. Not a rung to take on the way past.
  window.addEventListener('beforeunload', event => {
    if (!dirty) return;
    event.preventDefault();
    event.returnValue = '';
  });

  // ── the edit lease ──────────────────────────────────────────────────────────
  // RULING-autosave-two-writers.md §2 and §3.1-3.2, rung 3. The broadcast below
  // stops a CLEAN page going stale; this is what happens when two pages are both
  // being edited. It is the only thing in the design that protects work before
  // it is written, and it does not make concurrent editing safe — it makes it
  // refused, visibly, with the loser's work intact.
  const LEASE_SCOPE = 'model';
  // ONE ID PER PAGE INSTANCE, and it is rung 2's `writerId` rather than a second
  // one. A page that ignored its own broadcast under one identity and held the
  // lease under another would have two answers to "is this me".
  const holderId = () => window.SharedFileStore.leaseHolderId();
  let leaseGeneration = null;   // the generation we hold, or null when we do not
  let leaseHolder = null;       // whoever holds it instead, so the banner can say
  let leaseTimer = null;
  const holdsLease = () => leaseGeneration !== null;

  const paintLease = () => {
    const held = holdsLease();
    // A SYNCHRONOUS BEACON, like data-save-dirty: it flips with the state, where
    // the banner's text lands a frame later.
    document.body.dataset.leaseHeld = held ? '1' : '0';
    if (leaseBanner) {
      leaseBanner.hidden = held;
      // NAMED, as §2 asks — and the holder id is the only name there is. It is
      // not shown, because "w-mf2k3-8ad19c" tells a drafter nothing; it is
      // carried where a second page, and a test, can read WHICH page has it
      // rather than merely that one does.
      if (leaseHolder) leaseBanner.dataset.leaseHolder = leaseHolder;
      else delete leaseBanner.dataset.leaseHolder;
    }
    if (leaseMessage && !held) {
      // WORDED AS BEING EDITED ELSEWHERE, NOT AS EXPIRED (§3.4). An
      // expired-but-unclaimed lease is an absent drafter, not a free lease, and a
      // drafter told "expired" will reasonably assume they may simply carry on.
      leaseMessage.textContent = 'Being edited in another tab';
    }
    // DISABLED, NOT HIDDEN. The ruling leaves this unruled and asks that someone
    // who watches drafters pick it; THIS IS A PICK, NOT A SPECIFICATION. A
    // missing button reads as a broken page, where a dead one says the drafter
    // is looking at the right place and cannot use it yet.
    if (saveButton) saveButton.disabled = !held;
  };

  const askForLease = async ({ takeover = false } = {}) => {
    const S = window.SharedFileStore;
    if (!S || !S.claimLease) return false;
    let got;
    try {
      got = await S.claimLease(BUCKET, LEASE_SCOPE, holderId(),
        { ttlMs: S.LEASE_TTL_MS, takeover });
    } catch (error) {
      console.warn('draft: could not reach the edit lease', error);
      return holdsLease();
    }
    if (!got.ok) {
      // WE DO NOT HOLD IT, AND NOTHING OF OURS IS DISCARDED. A dirty page keeps
      // every edit it has; it is simply refused at the store if it tries to
      // write, and the banner tells the drafter why and offers the way out.
      leaseGeneration = null;
      leaseHolder = got.holderId;
      paintLease();
      return false;
    }
    // A GENERATION THAT MOVED WHILE WE WERE AWAY MEANS SOMEBODY HELD THIS IN
    // BETWEEN — we froze, they took it, it came back to us. They may have
    // written, so this page says the same thing rung 2 says when another page
    // writes rather than inventing a fourth kind of notice.
    //
    // A generation that did NOT move is the resume path (§3.4): our own lease
    // expired, nobody took it, nothing happened, and the drafter is told nothing
    // at all. Bump the generation on every re-claim and every woken tab
    // announces a takeover that never occurred.
    const wasTakenOver = leaseGeneration !== null && got.generation !== leaseGeneration;
    leaseGeneration = got.generation;
    leaseHolder = null;
    paintLease();
    if (wasTakenOver && !takeover && elsewhereNote) elsewhereNote.hidden = false;
    return true;
  };

  const startLeaseHeartbeat = () => {
    if (leaseTimer) return;
    const S = window.SharedFileStore;
    // It renews while we hold it and acquires when whoever does goes away —
    // expiry with a heartbeat is what stops a closed tab bricking the drawing,
    // and the ruling calls that non-negotiable.
    leaseTimer = setInterval(() => {
      askForLease().catch(error => console.warn('draft: lease heartbeat failed', error));
    }, (S && S.LEASE_HEARTBEAT_MS) || 4000);
  };

  if (takeOverButton) {
    takeOverButton.addEventListener('click', () => {
      // The only thing that may seize a live lease, and only because a person
      // read a banner and pressed it.
      askForLease({ takeover: true })
        .catch(error => console.warn('draft: takeover failed', error));
    });
  }

  // ── the hide-save ───────────────────────────────────────────────────────────
  // RULING-autosave-two-writers.md §3.4, rung 4. AN EXTRA, NOT A MECHANISM.
  // The press is still the only commit point and stays the only commit point.
  // This closes the tab-closed hole MOST OF THE TIME, which is the whole claim
  // and the most that can honestly be claimed: the probe (TTL-MEASUREMENT-MEMO)
  // measured a pagehide IndexedDB write failing to land on a tab reload with no
  // memory pressure at all. It landed on close. So nothing here — no rung, no
  // test, no comment — may assume this ran.
  //
  // TWO LISTENERS, AND NEITHER IS A SUPERSET OF THE OTHER. visibilitychange is
  // what fires when an iPad drafter switches apps or backgrounds the tab;
  // pagehide is what fires on close and on navigation. A page that listened to
  // one of them would miss whichever half of the drafter's day it did not pick.
  //
  // It writes only when it can write CLEANLY, and the three conditions are the
  // press's own: something to save, a lease to save under, a drawing to
  // serialise. A hide-save that fired without the lease would spend a refusal
  // to learn what holdsLease() already knew, exactly as save() says.
  //
  // NO TIMER, AND THAT IS NOT AN OVERSIGHT. Saving on an interval or a debounce
  // is rung 5, and rung 5 is illegal until this page is the sole model writer.
  // A mutation in the rung-4 PR fires this on a timer specifically so the suite
  // can tell the two rungs apart.
  // THE WRITE THE RELEASE WAITS ON. Rung 4 dropped this promise on the floor,
  // which is what left the write and the lease release racing; the release
  // below chains off it.
  let inFlightWrite = null;
  const saveOnHide = () => {
    if (!dirty || !drawing || !holdsLease()) return;
    const write = writeDrawing();
    inFlightWrite = write;
    // NOTHING ON FAILURE, ON PURPOSE. Stale, refused, store unreachable — the
    // page keeps the edit and keeps saying UNSAVED, because markSaved() runs
    // only inside a resolved write. The failure mode of a best-effort save is
    // "the drafter still has their work and can still see it is unsaved", never
    // "the drafter was told it was fine" on the way out the door.
    //
    // SWALLOWED HERE RATHER THAN IN THE STORED PROMISE. `inFlightWrite` keeps
    // the raw write, so the release can tell a failure from a success and
    // still run either way; a pre-caught promise would hide the difference and
    // make a release chained on success alone look correct.
    write.catch(() => {});
  };
  // REGISTERED BEFORE THE LEASE RELEASE BELOW, WHICH BUYS THE CALL ORDER AND
  // NOTHING MORE. Listeners run in registration order, so this handler is
  // CALLED first — but it starts an asynchronous write and returns, so the
  // release listener runs while that write is still in flight. What guarantees
  // the lease is still live when the write reads it is the release awaiting
  // `inFlightWrite`, below; registration order alone never settled a race
  // between two async operations.
  //
  // WHY THIS WAS NOT A BUG BEFORE THE CHAINING, for the record and not as the
  // guarantee: both paths reach IndexedDB through the store's `withDb`, which
  // awaits one cached connection promise, so the write's continuation is queued
  // as a microtask ahead of the release's and its `readwrite` transaction is
  // created first — and IndexedDB serialises overlapping transactions on a
  // store in creation order. True, load-bearing, and two levels below anything
  // this file says. One added `await` before the write's transaction opens, or
  // the re-open branch inside `withDb`, inverts it silently and nothing
  // reports. That is the sentence this comment used to make, and the reason it
  // was replaced rather than softened.
  window.addEventListener('pagehide', saveOnHide);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'hidden') return;
    saveOnHide();
  });

  // BEST EFFORT, AND NOTHING DEPENDS ON IT (§3.4). The probe found a pagehide
  // IndexedDB write fail to land on a tab reload with no memory pressure at all;
  // the TTL is the real backstop and this only shortens the wait for whoever is
  // next.
  //
  // AFTER THE HIDE-SAVE, AND AFTER IT EITHER WAY. The release is chained on the
  // write's promise SETTLING, not resolving: a write that was refused as stale
  // must still give the lease up, or a failed best-effort save would cost the
  // next drafter the full TTL — a regression traded for nothing. With no write
  // in flight this is exactly what it was.
  //
  // ONLY pagehide RELEASES. visibilitychange deliberately does not: a
  // backgrounded iPad tab is coming back, and handing its lease away while the
  // drafter is reading their mail is how they return to a read-only page.
  window.addEventListener('pagehide', () => {
    const S = window.SharedFileStore;
    if (!holdsLease() || !S || !S.releaseLease) return;
    const release = () => S.releaseLease(BUCKET, LEASE_SCOPE, holderId()).catch(() => {});
    if (inFlightWrite) inFlightWrite.then(release, release);
    else release();
  });

  // ── the change broadcast ────────────────────────────────────────────────────
  // RULING-autosave-two-writers.md §4, rung 2. This page reads its revision
  // once at load and advances it only by its own save, so before this listener
  // existed a single sheet edit in LAYOUT — a write to a key this page does not
  // touch — refused every save from here until the drafter reloaded, and
  // reloading is what costs them the corner they had not saved.
  //
  // A page that hears the write and re-reads is never stale, so it never has
  // anything to overwrite.
  //
  // Reads overlap: two writes land in quick succession and the second read can
  // resolve first, leaving the older file on screen with the newer revision
  // beside it. A sequence number is the cheapest thing that makes the last
  // change asked for the one that wins.
  let adoptSeq = 0;
  const adoptStore = async () => {
    const mine = ++adoptSeq;
    const at = await window.SharedFileStore.loadSharedFileAt(BUCKET);
    if (mine !== adoptSeq) return;
    // A cleared bucket is not a drawing to adopt. Keeping what is on screen is
    // the safe direction: nothing here can put it back.
    if (!at.file) return;
    if (!(await adoptFile(at.file))) return;
    if (mine !== adoptSeq) return;
    // THE REVISION COMES FROM THE READ, NOT FROM THE MESSAGE. loadSharedFileAt
    // takes the file and the revision in ONE transaction, so they describe one
    // state of the bucket. The message's rev describes the write that woke us,
    // and by the time this read ran a third page may have written again —
    // adopting that number would hand the next save an `ifRev` that does not
    // match the drawing it is about to write.
    storeRev = at.rev;
    // NOT fit(). A reload would re-frame the view; a live adopt must not move
    // the drafter's camera out from under them for someone else's edit.
    paint();
    buildChrome();
    loadUnderlayImages();
  };

  if (window.SharedFileStore?.onBucketChanged) {
    window.SharedFileStore.onBucketChanged(BUCKET, change => {
      // OUR OWN SAVE. The store tells every listener, this page's included, so
      // that "the bucket changed" means one thing regardless of who wrote it.
      // Ignoring our own is this page's decision and this is where it is made:
      // without it, every SAVE would be followed by a re-read that replaces the
      // drawing the undo stack points into, and the drafter's history would go
      // with it.
      if (change.writerId === window.SharedFileStore.writerId) return;
      // Nothing on screen yet — boot failed or the store was empty. There is no
      // drawing to keep current and no camera to preserve; a reload is the
      // honest way back and the notice already says so.
      if (!drawing) return;
      // A DIRTY PAGE RE-READS NOTHING. Not the drawing, not the revision: the
      // next save must still be refused, because this page's copy really is
      // built on an older one and rung 1's refusal is what stands between the
      // drafter and somebody else's work being eaten.
      if (dirty) {
        if (elsewhereNote) elsewhereNote.hidden = false;
        return;
      }
      adoptStore().catch(error => {
        console.warn('draft: could not adopt a change from another page', error);
      });
    });
  }

  boot();
})();
</script>
</body>
</html>
