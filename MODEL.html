  // than a line on a sign. A sign can only be read; that one has to be
  // answered.
  //
  // AND IT IS DECIDED HERE RATHER THAN IN THE BONE'S HANDLER, where the other
  // refusals live. The seam's own rule is that what an order MEANS is the
  // geometry side's call (:4184); refusing before fireOrder would also stop
  // the order reaching the seam at all, and model-drivethru.spec.js measures
  // that each press fires its own seam and not the other's.
  //
  // THE GARAGE ORDER IS NOT TOUCHED. It is served by the listener above, which
  // runs first, builds, and spends the order; this one recognises the same
  // tile through the same predicate and stands off.
  window.ModelBuild.onOrder(order => {
    if (!order?.entry || isGarageChoice(order)) return;
    if (buildPremadePlan(order)) {
      setSign(false);
      // SPENT: something was BUILT, which is exactly what orderServed means
      // (:4262). A refusal below spends nothing -- the drafter's choice still
      // stands, because he has not been answered.
      window.ModelBuild.orderServed();
      return;
    }
    signRefusal = {
      line: 'NOT READY YET.',
      note: `${order.entry.label} has no design on the board yet. `
        + '1 STOREY and 1 STOREY + GARAGE do.',
    };
    paintSign();
  });

  // ── THE CUT TOOL: a section line and the way it looks ─────────────────────
  //
  // The parity row said "SECTIONS list -- listed and deletable, not cuttable",
  // and the panel said so out loud: "This page has no cut tool -- sections are
  // cut in LAYOUT." Both are true until this block, and neither is after it.
  //
  // THREE PRESSES, WHICH IS THE OLD PAGE'S GESTURE (MODEL.dc.html:22284):
  // where the cut starts, where it ends, and which side the drafter wants to
  // look from. The third press is the one that carries meaning a plan cannot
  // show -- see geometry-2d.js's cutDirVec, and the harness beside it.
  //
  // NO PHASE VARIABLE. The old page keeps `cutPhase: 'idle'|'placing'|
  // 'choosing'` beside the two points, which is a second fact about the same
  // state and free to disagree with it. Here the points ARE the phase: no
  // start is "place the start", a start alone is "place the end", both is
  // "choose the side". A state that cannot be out of step with itself.
  let cutStart = null;
  let cutEnd = null;

  const armCut = () => {
    activeTool = 'cut';
    cutStart = null;
    cutEnd = null;
    drawStart = null;
    sayOnStrip('CUT — press where the section line starts.');
    paint();
  };

  const cutPress = at => {
    const here = { x: at.x, z: at.z };
    if (!cutStart) {
      cutStart = here;
      sayOnStrip('Now press the other end of the section line.');
      paint();
      return;
    }
    if (!cutEnd) {
      // THE OLD PAGE'S OWN GUARD, and it is not a nicety: a cut with no length
      // has no perpendicular, so it has no direction to store. Refusing the
      // second press leaves the drafter placing it again rather than making a
      // record that can never say which way it looks.
      if (Math.hypot(here.x - cutStart.x, here.z - cutStart.z) < 0.001) return;
      cutEnd = here;
      sayOnStrip('Now press the side you want the section to look FROM.');
      paint();
      return;
    }
    commitCut(here);
  };

  const commitCut = at => {
    const G = window.DraftGeometry2D;
    const dirVec = G.cutDirVec(cutStart, cutEnd, at);
    if (!dirVec) return;
    if (!Array.isArray(drawing.cuts)) drawing.cuts = [];
    const stored = drawing.cuts;
    // THE ID IS DERIVED FROM THE CUTS THEMSELVES rather than kept in a
    // counter. The old page stores `nextCutId` in the file and then, on load,
    // ignores it in favour of max(1, ...cuts.map(id + 1)) anyway
    // (MODEL.dc.html:5623) -- so the counter is a value the loader already
    // refuses to trust. Deriving it here means the two pages cannot disagree
    // about the next number, and there is no key to leave stale.
    //
    // drawing-format.js reads a cut id with Number.isInteger (:79), so this is
    // the one id on this page that is a NUMBER: newDrawingItemId mints
    // strings, and a string here would be dropped on load without a word.
    const id = Math.max(1, ...stored.map(cut => Number(cut.id) + 1));
    // S1, S2 ... after the standard E1-E4 elevations, taking the first free
    // number rather than the count: deleting S2 of three should let the next
    // cut be S2 again rather than mint an S4 beside an existing one.
    const used = new Set(stored.map(cut => cut.name));
    let n = 1;
    while (used.has(`S${n}`)) n += 1;
    const levelId = activeLevelId();
    const level = (drawing.levels || []).find(lvl => Number(lvl.id) === Number(levelId));
    const cut = {
      id,
      name: `S${n}`,
      startPt: { x: cutStart.x, z: cutStart.z },
      endPt: { x: cutEnd.x, z: cutEnd.z },
      dirVec: { x: dirVec.x, z: dirVec.z },
      // The old page stores `this._drawElev`, which _applyLevelElevation sets
      // to the active level's own elev (:9860). Same number, read from the
      // level rather than from a field that shadows it.
      elev: Number(level?.elev) || 0,
      levelId,
    };
    stored.push(cut);
    // THE EXISTING GENERIC UNDO ENTRY, which captures the LIST as well as the
    // item -- so this needed no new branch. It is also why the push above is
    // in place rather than `drawing.cuts = [...stored, cut]`: a new array
    // would leave undo holding the old one and taking the cut out of a list
    // nothing reads.
    undoStack.push({ kind: 'add-item', list: stored, item: cut });
    cutStart = null;
    cutEnd = null;
    activeTool = RESTING_TOOL;
    sayOnStrip(`${cut.name} cut.`);
    markDirty();
    buildChrome();
    paint();
    return cut;
  };

  // ── the instrument strip ──────────────────────────────────────────────────
  // MODEL.dc.html:1963's bottom panel, rebuilt on this page's terms. Movie,
  // 13 Sep: "we also still need the bottom bar which should look like lights
  // for [an] instrument panel like on the Model.dc.html version. the length
  // T-square, ruler and other stuff are down there we need. and the skin
  // switcher can be there too."
  //
  // FOUR INSTRUMENTS ARE REAL AND SIX ARE DORMANT, and the strip says which
  // is which rather than offering ten buttons where four work. The dormant
  // six hold their seats (see the stylesheet's note on spacing) with a title
  // that names them as unbuilt -- the same refusal as the panel's disabled 3D
  // chair, which is the house rule: a control that lies about what the page
  // can do is worse than a gap.
  const strip = document.getElementById('strip');
  const stripMessage = document.getElementById('strip-message');
  // What the page is SAYING, as against what it is reporting. Cleared by the
  // next press that does something, so a refusal never sits over a gesture
  // that has since succeeded.
  let stripNotice = '';
  // BOTH HALVES GO THROUGH A FUNCTION THAT REPAINTS. Saying it and clearing it
  // are the same operation with different text, and the bug both times was the
  // repaint: first stripRefresh overwrote a notice that had been set, then a
  // notice was cleared and the strip kept showing it because nothing repainted
  // until an unrelated pointermove happened along. A message has two halves --
  // it must appear and it must STOP -- and a bare assignment does neither on
  // its own.
  const sayOnStrip = text => { stripNotice = text; stripRefresh(); };
  const clearNotice = () => { if (stripNotice) sayOnStrip(''); };
  const lenOut = document.getElementById('strip-len');
  const angOut = document.getElementById('strip-ang');
  const protractorOut = document.getElementById('strip-protractor-angle');
  const rulerChip = strip.querySelector('[data-mode-ruler]');
  const tsquareChip = strip.querySelector('[data-mode-tsquare]');
  const scaleChip = strip.querySelector('[data-mode-scale]');
  const brushChip = strip.querySelector('[data-mode-brush]');
  const brushLoadOut = strip.querySelector('[data-brush-load]');
  const lengthBox = document.getElementById('frozen-length');
  const angleBox = document.getElementById('frozen-angle');

  const F = window.DraftFormatters;
  const feetLabel = ft => F.formatArchitecturalInches(ft * 12);
  // Compass bearing off the +X axis, the reading a protractor gives: 0-180
  // either way rather than 0-360, because a wall drawn left has the same
  // angle as the same wall drawn right and a drafter reading 183° would
  // reasonably think it was out of square.
  const angleLabel = (from, to) => {
    const deg = Math.atan2(-(to.z - from.z), to.x - from.x) * 180 / Math.PI;
    const folded = deg <= -90 ? deg + 180 : (deg > 90 ? deg - 180 : deg);
    return `${folded.toFixed(1)}°`;
  };

  // WHAT THE T-SQUARE ACTUALLY DOES. The longer leg wins, so the run follows
  // the direction the hand is already going rather than jumping axes under
  // the cursor.
  // TOY SQUARES BECAUSE THE BOARD SAYS SO, not because an instrument is up.
  // §1: "Four directions only, +X/-X/+Z/-Z from the start point", and TOY has
  // no instruments for a drafter to switch on -- §6 takes the tools away. So
  // the T-square is one reason to square and the board is another, and a run
  // is held square if EITHER holds.
  //
  // Acceptance #4 is what keeps this honest in the other direction: in
  // DRAFTING with the T-square down, nothing squares and the same gesture
  // commits the same off-axis wall it commits today. TOY must not leak.
  const squaring = () => tsquareOn || board === 'toy';

  const squareTo = (from, at) => {
    if (!squaring() || !from) return at;
    return Math.abs(at.x - from.x) >= Math.abs(at.z - from.z)
      ? { x: at.x, z: from.z } : { x: from.x, z: at.z };
  };

  // WHICH COORDINATE THE SQUARE FIXED, or null when nothing is squaring. The
  // caller needs this and cannot get it by comparing points: a run that is
  // already axis-aligned comes back from squareTo unchanged, and "unchanged"
  // then means both "not squaring" and "squaring, already square".
  const squaredAxis = (from, at) => {
    if (!squaring() || !from) return null;
    return Math.abs(at.x - from.x) >= Math.abs(at.z - from.z) ? 'z' : 'x';
  };

  // The run the instruments are reading: the wall being drawn if there is
  // one, otherwise the ruler's measure. Null when the drafter is doing
  // neither, and the readouts go blank rather than holding a stale number --
  // a length that stays on screen after the gesture ends is the one thing a
  // drafter should never be able to misread.
  const runInHand = () => {
    if (!cursorWorld) return null;
    // drawPoint, NOT squareTo, AND THAT IS A BUG FIX RATHER THAN A TIDY-UP.
    // squareTo only squares; drawPoint is what the commit calls, and in TOY it
    // also lands the run on the whole foot. Reading the cursor through the
    // weaker of the two made the strip say 5.4 ft over a wall that committed
    // at 5. §1: the readout must be "the same number commitWall will receive,
    // not the cursor measured separately -- two readings of one distance
    // drift, and the drafter believes the one he can see." This has been
    // wrong on the TOY board since §1 landed.
    if (drawStart && activeTool === 'wall') return { from: drawStart, to: drawPoint(cursorWorld) };
    if (rulerFrom) return { from: rulerFrom, to: cursorWorld };
    return null;
  };

  // THE LENGTH ON THE DRAWING, beside the one on the strip. Both read
  // runInHand, so both read what commitWall will receive -- §1 asks for the
  // on-screen number and the committed number to be ASSERTED EQUAL, and the
  // only way to keep that true is for there to be one number.
  //
  // PLACEMENT IS THE WHOLE DIFFERENCE BETWEEN THE TWO POINTERS. §1: "by the
  // cursor on PC, clear of the finger on touch". On a touch screen the thing
  // being read is exactly the thing the hand is covering, so it goes well
  // above the contact point and centred on it; a mouse has nothing to hide
  // behind it, so it sits low and to the right where a cursor label belongs.
  const drawLenEl = document.getElementById('draw-len');
  let pointerScreen = null;
  const syncDrawLength = () => {
    if (!drawLenEl) return;
    const run = activeTool === 'wall' && drawStart ? runInHand() : null;
    if (!run || !pointerScreen) { drawLenEl.hidden = true; return; }
    drawLenEl.hidden = false;
    drawLenEl.textContent =
      feetLabel(Math.hypot(run.to.x - run.from.x, run.to.z - run.from.z));
    const touch = pointerScreen.type === 'touch';
    drawLenEl.style.left = `${pointerScreen.x + (touch ? 0 : 14)}px`;
    drawLenEl.style.top = `${pointerScreen.y + (touch ? -54 : 16)}px`;
    drawLenEl.style.transform = touch ? 'translateX(-50%)' : 'none';
  };

  // FOUR READS OF `drawArmed` BECAME READS OF THE REGISTER. #398 wrote this
  // strip against the armed boolean; the tool register replaced that boolean
  // with a tool id, and the merge that brought the two together was clean --
  // the strip and the column live in different parts of the file. The same
  // shape as deleteLevel's `setArmed(false)` earlier today, from the other
  // side: git has nothing to say when one branch deletes a name another branch
  // starts using.
  function stripRefresh() {
    const run = runInHand();
    const dist = run ? Math.hypot(run.to.x - run.from.x, run.to.z - run.from.z) : null;
    lenOut.textContent = dist === null ? '' : feetLabel(dist);
    angOut.textContent = run ? angleLabel(run.from, run.to) : '';
    protractorOut.textContent = run ? angleLabel(run.from, run.to) : '—';
    rulerChip.classList.toggle('lit', rulerOn);
    tsquareChip.classList.toggle('lit', tsquareOn);
    scaleChip.classList.toggle('lit', footOn);
    // LIT MEANS LOADED, not merely armed, and that is the whole reason this
    // tool needs no mode indicator anywhere else: an armed-but-empty brush
    // does nothing to the drawing, and a loaded one says what it will do.
    brushChip.classList.toggle('lit', !!brushLoad);
    brushChip.classList.toggle('armed', brushOn);
    const said = brushSays();
    brushLoadOut.textContent = said.short;
    brushChip.title = brushLoad
      ? `DRAFTING BRUSH — holding ${said.long}. Press another of the same kind `
        + 'to give them to it. Escape puts it down.'
      : 'DRAFTING BRUSH — press a thing to pick its properties up, then press '
        + 'another of the same kind to give them to it';
    // THE LENGTH BOX IS LIVE ONLY WHILE A WALL IS IN HAND, because that is
    // the only moment a typed length has an anchor and a direction to be
    // measured along. Enabled at any other time it would take a number and
    // have nowhere to put it.
    const typable = !!(activeTool === 'wall' && drawStart && cursorWorld);
    if (lengthBox.disabled === typable) {
      lengthBox.disabled = !typable;
      if (!typable) lengthBox.value = '';
    }
    // THE ANGLE BOX LIVES UNDER THE SAME RULE, for the same reason: a typed
    // bearing needs a start point to turn about.
    if (angleBox.disabled === typable) {
      angleBox.disabled = !typable;
      if (!typable) angleBox.value = '';
    }
    if (typable && document.activeElement !== angleBox) {
      angleBox.value = run ? angleLabel(run.from, run.to) : '';
    }
    // While the drafter is typing, the box is his; the live length would
    // overwrite the digits mid-word.
    if (typable && document.activeElement !== lengthBox) {
      lengthBox.value = dist === null ? '' : feetLabel(dist);
    }
    // A NOTICE OUTLIVES ONE REFRESH, and it has to. Both the refusal and the
    // cancel wrote straight to stripMessage and were erased microseconds later
    // by this line -- the page said the true thing and then said the routine
    // thing over the top of it, which on screen is the page saying nothing.
    // Found by the check asserting the message was VISIBLE rather than that
    // the code had set it, which is the difference between the two halves of
    // every failure today.
    stripMessage.textContent = stripNotice || (rulerOn
      ? (rulerFrom ? 'ruler — second point' : 'ruler — first point')
      : (activeTool === 'wall' ? (drawStart ? 'wall — second point' : 'wall — first point') : ''));
    // Last, and from here rather than from the pointer handlers, so the label
    // goes out the moment the run does -- every path that ends a run already
    // calls stripRefresh, and a length still on screen after the gesture is
    // over is the one thing a drafter should never be able to misread.
    syncDrawLength();
  }

  const rulerPress = at => {
    if (!rulerFrom) { rulerFrom = { x: at.x, z: at.z }; }
    else { rulerFrom = null; }
    cursorWorld = at;
    stripRefresh();
    paint();
  };

  rulerChip.addEventListener('click', () => {
    rulerOn = !rulerOn;
    rulerFrom = null;
    canvas.style.cursor = rulerOn ? 'crosshair' : (activeTool === 'wall' ? 'crosshair' : '');
    stripRefresh();
    paint();
  });
  tsquareChip.addEventListener('click', () => {
    tsquareOn = !tsquareOn;
    stripRefresh();
    paint();
  });

  // THE SAME CONTROL AS THE T-SQUARE, with one line more: the store. The
  // order says to follow that neighbour exactly, and this does -- toggle,
  // refresh, paint -- but the T-SQUARE keeps nothing across a reload and
  // acceptance 3 requires that this does.
  scaleChip.addEventListener('click', () => {
    footOn = !footOn;
    try {
      const keep = JSON.parse(localStorage.getItem(SKIN_KEY) || '{}');
      localStorage.setItem(SKIN_KEY, JSON.stringify({ ...keep, footLight: footOn }));
    } catch { /* a browser refusing storage still gets the light, for this tab */ }
    stripRefresh();
    paint();
  });

  // ── THE DRAFTING BRUSH ────────────────────────────────────────────────────
  //
  // Movie, 20 Sep: "brush will copy the propeties of the object type - LINE /
  // WALL / FLOOR / DIMENSIONS etc. and will copy the EXACT PROPERTIES over to
  // a 'matching' object TYPE - a WALL will only change another WALL for
  // example." Then, on what a loaded brush does next: "if they change to WALL
  // command and start drawing a wall those 'selected' drafting brush
  // properties will remain", and "if you select FENSTRATION you should be
  // able to put new windows into a WALL".
  //
  // Designed with him on 5 Sep and written down then as
  // RD-DOCUMENTS/SPEC-drafting-brush.md, which left two questions open and
  // marked them "Needs Movie". Both are answered above and the answers are
  // what this is built to.
  //
  // ── THE RULE THAT SETTLES EVERY EDGE CASE ───────────────────────────────
  //
  // THE BRUSH CARRIES WHAT A THING IS, NEVER WHERE IT IS. Type, size, head
  // height, sill height -- yes. Which wall, which storey, how far along, which
  // points -- never. Dust is a finish lifted off a surface; it is not the
  // surface. Every list below is that sentence applied once, and the keys
  // left OUT of them are the substance of it.
  const BRUSH_PROPS = {
    // The four the WALL panel edits. GUARDRAIL is not here because it is not
    // stored: `wallType === 'guardrail'` IS the guardrail, so it travels
    // inside wallType and cannot arrive disagreeing with itself.
    wall: ['wallType', 'refLine', 'baseHeight', 'topHeight'],
    // `garage` rides along although no panel edits it: it is what makes an
    // overhead door an overhead door, and Movie's own example is dusting one.
    // `offset` and `wallId` are the two that must NEVER travel -- they are
    // where it is.
    fenestration: ['type', 'layer', 'width', 'sillHeight', 'headHeight', 'garage', 'casement'],
    // NOT `structure`. Whether a floor is framed or a slab is read from the
    // layer set it lives on (layer-views.js's floorHomeView), so copying it
    // would make a floor's own two answers disagree -- and `points` is its
    // shape, which is where it is.
    floor: ['thickness', 'thickenedEdge', 'slopeInPerFt'],
    // A line is two points, a level, a view and a layer. Three of those five
    // are where it is; the layer is the whole of what it is.
    line: ['layer'],
  };

  // WHAT THE BRUSH CANNOT REACH, AND WHY, said here rather than discovered.
  // Movie named DIMENSIONS among the kinds. hitAt's chain is fenestration,
  // wall, line, outline, floor -- a dimension cannot be pressed on this page
  // at all, so a dimension entry above would be a promise with nothing behind
  // it. Columns and beams are the same story from the other end: they are
  // selected by being PLACED and never found again by a press. OUTLINE is in
  // the chain and is deliberately absent: an outline is a guide, and what a
  // drafter changes about one is its corners.
  // `brushOn` and `brushLoad` are declared with the strip's other state, up
  // beside rulerOn and footOn -- stripRefresh reads both, and a `let` down
  // here would sit in the temporal dead zone for every call made before this
  // line runs. The comments that belong to them are here, where the tool is.
  //
  // brushOn -- the chip: presses lift and dust instead of select
  // THE LOAD OUTLIVES THE CHIP, which is Movie's second sentence and not an
  // accident of scope: "if they change to WALL command and start drawing a
  // wall those 'selected' drafting brush properties will remain". Arming a
  // drawing tool puts the brush's PRESS down -- otherwise there would be no
  // way to draw -- and keeps what it is holding, so the next wall comes out
  // wearing it. One thing held, two ways to spend it.
  // brushLoad -- { kind, props } or null

  const brushHas = kind => brushLoad && brushLoad.kind === kind;

  // The properties a drawing tool should use, or nothing. Handed to the
  // COMMIT rather than read inside it: commitWall is also how a premade house
  // and an ordered garage raise their walls, and a loaded brush must not
  // change what the bone builds.
  const brushOptions = kind => (brushHas(kind) ? { ...brushLoad.props } : {});

  const brushPick = (item, kind) => {
    const out = {};
    (BRUSH_PROPS[kind] || []).forEach(key => {
      if (item[key] !== undefined) out[key] = item[key];
    });
    return out;
  };

  // WHAT THE CHIP SAYS IT IS HOLDING. Short enough for the strip; the whole
  // of it goes in the title, where there is room.
  const brushSays = () => {
    if (!brushLoad) return { short: '', long: '' };
    const F = window.DraftFormatters;
    const ftIn = feet => F.formatArchitecturalInches((Number(feet) || 0) * 12);
    const p = brushLoad.props;
    if (brushLoad.kind === 'wall') {
      const type = window.DraftWallTypes.WALL_TYPES
        .find(t => t.id === (p.wallType || 'stud_2x6'));
      return { short: `WALL ${ftIn(p.topHeight)}`,
        long: `${type ? type.label : p.wallType} — ${ftIn(p.baseHeight)} to `
          + `${ftIn(p.topHeight)}, ${p.refLine} reference` };
    }
    if (brushLoad.kind === 'fenestration') {
      const name = p.garage === true ? 'GARAGE DOOR'
        : (p.type === 'door' ? 'DOOR' : 'WINDOW');
      return { short: `${name} ${ftIn(p.width)}`,
        long: `${name} ${ftIn(p.width)} wide, head ${ftIn(p.headHeight)}`
          + (p.type === 'door' ? '' : `, sill ${ftIn(p.sillHeight)}`) };
    }
    if (brushLoad.kind === 'floor') {
      return { short: `FLOOR ${ftIn(p.thickness)}`,
        long: `FLOOR ${ftIn(p.thickness)} thick`
          + (p.thickenedEdge ? ', thickened edge' : '')
          + (p.slopeInPerFt ? `, falling ${p.slopeInPerFt}"/ft` : '') };
    }
    return { short: `LINE ${p.layer || ''}`.trim(), long: `LINE on ${p.layer}` };
  };

  // A KIND IN THE WORDS THE DRAFTER SEES, for the refusals. 'fenestration' is
  // the record's word and nobody else's.
  const BRUSH_KIND_SAID = { wall: 'WALL', fenestration: 'OPENING',
    floor: 'FLOOR', line: 'LINE', outline: 'OUTLINE' };

  // ── UNDO FOR A DUST ───────────────────────────────────────────────────────
  //
  // THE PANELS DO NOT PUSH ONE AND THIS DOES, which is a difference worth
  // stating rather than leaving to be found. A panel edit is slow and
  // deliberate: a drafter opens a field, types, and sees the number he typed.
  // A brush is a repeated press -- ten things in five seconds -- so a
  // misplaced one is not a rare event, it is the ordinary cost of using the
  // tool at speed. The step below is the seam the panels should join when
  // somebody gives them one; it is deliberately shaped for any property edit
  // and not for the brush.
  const brushUndoStep = items => ({
    kind: 'props',
    edits: items.map(item => ({ item, before: { ...item } })),
  });

  const brushDust = (hit) => {
    const F = window.DraftFormatters;
    const G = window.DraftGeometry2D;
    const item = hit.item;
    // ── AN OPENING IS PLACED AGAIN, NOT JUST OVERWRITTEN ────────────────
    //
    // Movie, 20 Sep, on dusting a small window with a garage door: "DOES NOT
    // become a garage door - popup says 'TOO BIG' and won't be accepted the
    // same window will remain it won't change PROPERTIES". Which is the fit
    // rule, and it is his own from 5 Sep: "maybe don't allow to place in that
    // case". So the width goes through clampOpeningToWall -- the same rule a
    // press follows and the same rule the WIDTH field follows -- and a wall
    // that cannot carry it keeps the opening it has, untouched.
    //
    // REFUSED, NOT SLID. A typed width may slide the opening along to make
    // room, because the drafter asked for that width at that opening. A dusted
    // one may not: he asked for THESE PROPERTIES, and quietly moving the
    // window he aimed at would be the brush editing where a thing is.
    if (hit.type === 'fenestration') {
      const wall = openingHostWall(item);
      const width = Number(brushLoad.props.width) || 0;
      const fit = wall && G.clampOpeningToWall(wall, Number(item.offset) || 0, width,
        { walls: walls(), thicknessFt: openingThicknessFt() });
      if (!fit || Math.abs(fit.offset - (Number(item.offset) || 0)) > 1e-6) {
        sayOnStrip(`TOO BIG — that wall cannot carry a `
          + `${F.formatArchitecturalInches(width * 12)} opening there. Nothing changed.`);
        return;
      }
    }
    undoStack.push(brushUndoStep([item]));
    Object.assign(item, brushLoad.props);
    // A WALL'S SUBSTITUTION ENDS WITH A DRAFTER'S CHANGE, and a dust is one.
    // Without this a wall just brushed to RAIL would save as concrete_12
    // again -- see applyToWalls, whose rule this is.
    if (hit.type === 'wall') substitutedWallTypes.delete(item.id);
    markDirty();
    showSelectionProps();
    paint();
    sayOnStrip(`${BRUSH_KIND_SAID[hit.type]} takes the brush's properties.`);
  };

  const brushPress = at => {
    const hit = hitAt(at);
    // ── NOTHING UNDER THE PRESS ──────────────────────────────────────────
    if (!hit) {
      sayOnStrip(brushLoad
        ? 'Nothing there. Press something of the same kind to give it these properties.'
        : 'Press a wall, an opening, a floor or a line to pick up its properties.');
      return;
    }
    const kind = hit.type;
    // ── EMPTY: THE PRESS LIFTS ───────────────────────────────────────────
    if (!brushLoad) {
      if (!BRUSH_PROPS[kind]) {
        sayOnStrip(`The brush has nothing to lift off ${BRUSH_KIND_SAID[kind] || 'that'}.`);
        return;
      }
      brushLoad = { kind, props: brushPick(hit.item, kind) };
      stripRefresh();
      paint();
      sayOnStrip(`Brush loaded: ${brushSays().long}. Escape puts it down.`);
      return;
    }
    // ── LOADED: A MATCHING KIND TAKES THEM ───────────────────────────────
    //
    // Movie: "a WALL will only change another WALL for example." The refusal
    // names both sides, because "wrong kind" without saying which two is a
    // sentence the drafter has to work out from what he can see.
    if (kind === brushLoad.kind) { brushDust(hit); return; }
    // ── AND A BARE WALL UNDER A LOADED OPENING GETS A NEW ONE ────────────
    //
    // Movie, 20 Sep: "if you select FENSTRATION you should be able to put new
    // windows into a WALL". The target decides the verb -- press an opening
    // and it becomes this one, press the wall between two and a new one lands
    // there -- so there is no mode to pick and nothing to remember.
    //
    // THROUGH placeOpening, NOT A SECOND BUILDER. It already finds the wall,
    // clamps to it, refuses a wall too short in the app's own words, files the
    // record on the host's level and view, and pushes the undo step. A second
    // one here would agree with it today and stop agreeing the first time
    // either moved.
    if (brushLoad.kind === 'fenestration' && kind === 'wall') {
      placeOpening(at);
      return;
    }
    sayOnStrip(`The brush is holding ${BRUSH_KIND_SAID[brushLoad.kind]} `
      + `properties. That is a ${BRUSH_KIND_SAID[kind] || 'different kind of thing'}.`);
  };

  // THE LOAD GOES DOWN, THE TOOL STAYS UP -- which the chip alone cannot do,
  // and is why the spec gives Escape a step of its own. Called from the
  // canvas Escape branch, where every other half-taken gesture is put down.
  const brushDrop = () => {
    brushLoad = null;
    stripRefresh();
    sayOnStrip('Brush put down.');
  };

  brushChip.addEventListener('click', () => {
    brushOn = !brushOn;
    // A DRAFTER WHO SWITCHES THE BRUSH OFF AT THE CHIP IS DONE WITH IT, load
    // and all. Escape is the one that keeps the tool and drops the load; the
    // chip is the coarse one, exactly as the spec's three states describe.
    if (!brushOn) brushLoad = null;
    // THE ARMED TOOL GOES DOWN WITH THE BRUSH COMING UP, because the brush
    // takes the press whole: a WALL left armed under a brush would be a tool
    // the page says is on and that no press can reach.
    if (brushOn && activeTool !== RESTING_TOOL) setTool(RESTING_TOOL);
    canvas.style.cursor = brushOn ? 'copy' : (activeTool === 'wall' ? 'crosshair' : '');
    stripRefresh();
    paint();
  });

  // TYPING A LENGTH COMMITS THE WALL, which is the instrument's whole point:
  // a drafter who knows the wall is 12'-6" should not have to find 12'-6"
  // with a mouse. The DIRECTION is the one the cursor is already giving --
  // squared first if the T-square is down -- so the typed number replaces the
  // distance and nothing else.
  // ── the promotion, and the question that comes first ──────────────────────
  // §7: "Entering an exact length anywhere promotes the drawing to DRAFTING",
  // and the drafter is ASKED BEFORE it happens, not told after. Movie ruled
  // this against a typed-length exception inside TOY, and his version is
  // better for the reason he gave: TOY then has one law with no exceptions,
  // and the promotion is visible instead of a hidden mode flip.
  //
  // WHAT "ASKS ONCE PER DRAWING" MEANS, and this is a reading of the order
  // rather than a quotation from it. §7 says the confirm "asks once per
  // drawing, then remembers", and separately that Stay in TOY "commits nothing
  // and changes nothing -- no wall, no mode change, no half-application".
  // Those two pull opposite ways on whether a Stay counts as an answer, so:
  //
  //   Continue  sets boardPromptSeen, promotes, and commits the length.
  //   Stay      changes NOTHING, the flag included -- so the next typed length
  //             asks again.
  //
  // The annoyance §7 names is "a dialog people learn to click through without
  // reading", and that is the drafter who keeps saying Continue; once they
  // have, they are never asked again. A drafter who keeps saying Stay keeps
  // being asked because they keep trying to do the thing TOY does not allow,
  // and the alternative -- silently promoting them later on the strength of a
  // refusal -- is worse. FLAGGED for Movie rather than settled by me.
  const promote = document.getElementById('promote');
  let pendingPromotion = null;

  const askToPromote = onContinue => {
    pendingPromotion = onContinue;
    promote.hidden = false;
    promote.querySelector('[data-promote-go]').focus();
  };
  const closePromote = () => { pendingPromotion = null; promote.hidden = true; };

  promote.querySelector('[data-promote-go]').addEventListener('click', () => {
    const go = pendingPromotion;
    closePromote();
    if (drawing) { drawing.boardPromptSeen = true; markDirty(); }
    setBoard('drafting');
    if (go) go();
  });
  // NOTHING AT ALL, which is the whole of Stay's contract. No wall, no board,
  // no flag: a refusal that recorded itself would be a change.
  promote.querySelector('[data-promote-stay]').addEventListener('click', closePromote);

  const commitTypedLength = () => {
    const parsed = F.parseArchitecturalLength(lengthBox.value);
    if (!parsed.ok) { stripMessage.textContent = parsed.error; return; }
    const feet = parsed.inches / 12;
    if (!(feet > 0) || !drawStart || !cursorWorld) return;
    // ASKED BEFORE ANYTHING HAPPENS. The length is re-read inside the
    // continuation rather than captured here, so what commits is what the box
    // says when the drafter answers -- and if the gesture has moved on, the
    // guards above run again on the way through.
    if (board === 'toy' && !drawing?.boardPromptSeen) {
      askToPromote(() => commitTypedLength());
      return;
    }
    const aim = squareTo(drawStart, cursorWorld);
    const dx = aim.x - drawStart.x, dz = aim.z - drawStart.z;
    const len = Math.hypot(dx, dz);
    if (len < 1e-6) { stripMessage.textContent = 'point away from the start first'; return; }
    const end = { x: drawStart.x + dx / len * feet, y: 0, z: drawStart.z + dz / len * feet };
    const wall = commitWall(drawStart, end, brushOptions('wall'));
    drawStart = wall.end;
    // THE SELECTION IS A SET ON THIS BRANCH. #398 wrote this line as
    // `selectedSeg = wall` against the single-wall variable that the selection
    // set replaced -- the third binding this merge had to re-seat, after
    // deleteLevel's setArmed and the strip's four reads of drawArmed. Same
    // shape every time: one branch deletes a name, another starts using it,
    // and git has nothing to say.
    setSelection([{ type: 'wall', item: wall }]);
    lengthBox.blur();
    stripRefresh();
    paint();
  };
  // TYPING AN ANGLE COMMITS THE WALL TOO, and it is the length path with the
  // two halves swapped: there the typed number is the distance and the cursor
  // gives the direction, here the typed number is the direction and the
  // distance comes from whatever the other box or the cursor is holding.
  //
  // WHICH WAY 30° POINTS is decided by the hand, not by the sign of the
  // number. The protractor reads -90..90 off +X -- a wall drawn left reads
  // the same as the same wall drawn right, deliberately -- so the typed
  // bearing gives a LINE and the cursor's own aim picks the end of it. Type
  // the number the protractor is showing and nothing moves, which is the test
  // of a readout a drafter can also set.
  const commitTypedAngle = () => {
    const deg = parseFloat(String(angleBox.value).replace(/[°\s]/g, ''));
    if (!Number.isFinite(deg) || Math.abs(deg) > 180) {
      stripMessage.textContent = 'angle in degrees, -180 to 180';
      return;
    }
    if (!drawStart || !cursorWorld) return;
    if (board === 'toy' && !drawing?.boardPromptSeen) {
      askToPromote(() => commitTypedAngle());
      return;
    }
    const aim = squareTo(drawStart, cursorWorld);
    const rad = deg * Math.PI / 180;
    let ux = Math.cos(rad), uz = -Math.sin(rad);
    if ((aim.x - drawStart.x) * ux + (aim.z - drawStart.z) * uz < 0) { ux = -ux; uz = -uz; }
    // THE LENGTH THE DRAFTER CAN SEE, in the order he can see it: the length
    // box if he has typed one, else the run the cursor is making.
    const typed = F.parseArchitecturalLength(lengthBox.value);
    const feet = typed.ok && typed.inches > 0 ? typed.inches / 12
      : Math.hypot(aim.x - drawStart.x, aim.z - drawStart.z);
    if (!(feet > 1e-6)) { stripMessage.textContent = 'point away from the start first'; return; }
    const end = { x: drawStart.x + ux * feet, y: 0, z: drawStart.z + uz * feet };
    const wall = commitWall(drawStart, end, brushOptions('wall'));
    drawStart = wall.end;
    setSelection([{ type: 'wall', item: wall }]);
    angleBox.blur();
    stripRefresh();
    paint();
  };
  angleBox.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); commitTypedAngle(); }
    if (e.key === 'Escape') { e.preventDefault(); angleBox.blur(); stripRefresh(); }
    e.stopPropagation();
  });

  lengthBox.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); commitTypedLength(); }
    if (e.key === 'Escape') { e.preventDefault(); lengthBox.blur(); stripRefresh(); }
    // The page's own keys (0 to fit, Escape, Delete) must not fire while a
    // length is being typed -- a drafter typing 10' would otherwise refit the
    // view under his hands.
    e.stopPropagation();
  });

  // ── the switches ──────────────────────────────────────────────────────────
  // SKIN WITHOUT A RELOAD. Every painter reads its colours from `skin` inside
  // its own body, so re-resolving the palette and repainting is the whole
  // change -- and it has to be, because this page can be holding an unsaved
  // edit and a reload would be asked to throw it away to change a colour.
  // THE THREE SWITCHES LIVE IN THE MODE CORNER, not the strip: §7b moved them
  // to the head-left so the strip carries instruments and readings only.
  //
  // BUTTONS ONLY, AND INSIDE A DECLARED HOME. `html` carries `data-theme`
  // and `body` carries `data-board` -- those are the marks the switches SET
  // -- so a document-wide query hands the switch code its own output as a
  // control: every click then bubbles to `html`, re-reads the theme off it
  // and rewrites the skin key without the board in it.
  //
  // THE HOME IS AN ATTRIBUTE, NOT A LIST OF IDS, and this is the second time
  // that has paid for itself. The switches were split across the strip and
  // the bottom bar (Movie, 15 Sep) and all four are back in the mode corner
  // (Movie, 17 Sep) -- two moves, and not one line of wiring in between,
  // because `#mode-corner, #house-strip` would have gone stale on the first
  // of them. It fails SILENTLY when it does, with the switch simply never
  // wired, which is the failure shape this page keeps paying for.
  // THE SWITCH FINDER AND THE PRESSED-MARKER ARE THE BAR'S NOW. Both went out
  // with shell-bars.js, carrying the note they earned here: the home is an
  // ATTRIBUTE, not a list of ids, because the switches moved twice across
  // this page and a `#mode-corner, #house-strip` selector would have gone
  // stale on the first move -- silently, with the switch simply never wired.
  const { switchSet, markSwitch } = window.DraftShellBars;
  const themeButtons = switchSet('data-theme');
  const modeButtons = switchSet('data-skin-mode');
  const boardButtons = switchSet('data-board');

  // THE SKIN SWITCH IS THE BAR'S; WHAT TO REPAINT AFTERWARDS IS THIS PAGE'S.
  // The module applies the palette, marks the pressed button and merges the
  // choice into the stored skin -- the half PROJECT, SPECS and Construction
  // Layout will each need, and would each have copied. The three paints below
  // are the half that stayed, because a bar that repainted a drawing would be
  // a bar that knows what a drawing is.
  //
  // theme AND mode COME BACK THROUGH THE CALLBACK rather than being read off
  // the module, because this page keeps its own and a dozen things read them:
  // the board artwork, the bone artwork, the logo and the readout line. A
  // copy that went stale after the first switch would have left RUFF's dog on
  // a ROUGH board, which is exactly the shape of bug that does not show up
  // until someone flips a skin twice.
  window.DraftShellBars.wireSkin({
    theme, mode, key: SKIN_KEY,
    onSkin: (nextSkin, nextTheme, nextMode) => {
      skin = nextSkin; theme = nextTheme; mode = nextMode;
      paintBonePress();
      paintSignBoard();
      paint();
      // AND THE RAIL, which paint() does not touch. Its seats hold PIXELS
      // painted in whatever skin was current when they were last drawn, so a
      // switch left four night elevations sitting beside a white drawing --
      // Movie, 24 Sep: "the 'day' sidebar elevations look like 'night'".
      //
      // IT ONLY BECAME VISIBLE WHEN THE PAINTER LEARNED ABOUT SKINS. Before
      // the elevations took their inks from the caller, a thumbnail painted
      // the same picture whatever the lights were doing, so a rail that was
      // never repainted was a rail nobody could tell was stale. The bug is
      // older than the symptom.
      //
      // THE PRECEDENT IS TEN LINES UP: inDaylight swaps the skin for a shoot
      // and puts BOTH back in its finally, paint() and paintRailNow(). That
      // path knew the rail follows the skin; this one, which is where the
      // drafter actually changes it, did not.
      //
      // SYNCHRONOUS RATHER THAN THE SEAT-PER-FRAME REPAINT, for the reason
      // paintRailNow exists at all: a skin switch is one press and wants
      // finished pictures, not four frames of half-turned rail.
      paintRailNow();
    },
  });

  // THE BOARD SWITCH IS A SWITCH AND NOTHING IS WIRED BEHIND IT YET, and that
  // is said out loud rather than implied. Movie, 13 Sep, asked for it on the
  // PC strip; the sentence defining what TOY MODE restricts was cut off
  // mid-word and has not arrived, so what exists is the choice, remembered
  // across reloads and readable by whoever builds the constraints -- not a
  // claim that they exist. The title on each button says so; when the rules
  // land they read `body[data-board]` and nothing here moves.
  const BOARDS = ['toy', 'drafting'];
  // THE DRAWING OWNS THE BOARD; localStorage only seeds a drawing that has
  // never recorded one. §7 of the TOY bones order is explicit -- a per-browser
  // flag means "the same drafter meets it on every file while a second drafter
  // never sees it at all" -- and acceptance #11 wants a PROMOTED DRAWING to
  // reload as DRAFTING, which is a fact about one file.
  //
  // The remembered value is kept as the seed rather than dropped, so a fresh
  // page still opens on the board the drafter last used, which is what it does
  // today. A drawing that HAS chosen overrides it, always.
  const rememberedBoard = BOARDS.includes(stored.board) ? stored.board : 'toy';
  let board = rememberedBoard;

  const boardOfDrawing = () =>
    window.DraftDrawingFormat.board(drawing?.board) || rememberedBoard;
  const applyBoard = () => {
    document.body.setAttribute('data-board', board);
    markSwitch(boardButtons, 'board', board);
    boardListeners.forEach(fn => fn(board));
    try {
      const keep = JSON.parse(localStorage.getItem(SKIN_KEY) || '{}');
      localStorage.setItem(SKIN_KEY, JSON.stringify({ ...keep, board }));
    } catch { /* as above */ }
  };
  boardButtons.forEach(b => {
    // §8 of the TOY bones order: this title said "remembered, but nothing is
    // constrained by it yet" for as long as that was true. §6 made it false
    // -- the board decides which tools the column offers -- and the disclaimer
    // went rather than being left to mislead.
    //
    // §1–§5 have since made it false a second time, in the direction a drafter
    // meets FIRST. The tool roster is what TOY takes away; squareness and the
    // whole foot are what it DOES, on the very first wall, and a title that
    // named only the roster left the drafter to discover the geometry rule by
    // being surprised by it. Both facts, one sentence each side of the comma.
    //
    // STILL NOT PROMISING THE UNBUILT: this names what a drafter can confirm
    // by drawing one wall today. model-html-strip.spec.js:353 holds it to that.
    b.title = b.dataset.board === 'toy'
      ? 'TOY board — walls only, square and whole-foot; the other tools are put away'
      : 'DRAFTING board — the full tool column, any angle and any length';
    b.addEventListener('click', () => { setBoard(b.dataset.board); });
  });

  // ONE PLACE THE BOARD CHANGES, so the drawing and the switch cannot drift.
  // Everything that moves a board -- the buttons here, and the promotion the
  // LENGTH box will raise -- goes through this.
  const setBoard = next => {
    if (!BOARDS.includes(next) || next === board) return;
    board = next;
    if (drawing) {
      drawing.board = window.DraftDrawingFormat.board(next);
      markDirty();
    }
    applyBoard();
  };

  markSwitch(themeButtons, 'theme', theme);
  markSwitch(modeButtons, 'skinMode', mode);
  paintBonePress();
  paintSignBoard();
  applyBoard();
  stripRefresh();

  // ONE LISTENER, THE REGISTER'S. #398 wrote this against the armed
  // boolean (`setArmed(!drawArmed)`); the register replaced that, and the
  // merge offered both because the strip and the tool column were added at
  // the same point in the file. Keeping both listeners would have given the
  // button two handlers that disagree about what armed means.

  // ── the tool column ───────────────────────────────────────────────────────
  // SEVENTEEN KEYS, RENDERED FROM THE LIST. tool-roster.js holds the roster;
  // this builds it and wires it to the register above. Nothing here decides
  // what a tool does — pressing a key sets `activeTool` and that is all — so a
  // tool whose gesture is not written yet still lights, still says what it
  // would do, and still puts the previous one down. A key that did nothing at
  // all would be worse than no key: it would look like a working tool.
  //
  // THE LETTERS ARE READ ONCE AT BUILD, from SETTINGS through the roster. A
  // remap made in another tab lands on the next load, which is how every other
  // profile-backed value on this page behaves.
  const buildToolColumn = () => {
    const roster = window.DraftToolRoster;
    const slot = document.getElementById('tool-slot');
    if (!roster || !slot) return;
    const resolved = roster.bindings();
    slot.replaceChildren(...roster.GROUPS.map(group => {
      const box = document.createElement('div');
      box.dataset.toolGroup = group.id;
      const name = document.createElement('div');
      name.dataset.toolGroupName = '';
      name.textContent = group.label;
      const keys = document.createElement('div');
      keys.className = 'tool-keys';
      keys.append(...roster.inGroup(group.id).map(tool => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'tool-key';
        btn.dataset.toolKey = tool.id;
        btn.dataset.toolKind = tool.kind;
        btn.setAttribute('aria-pressed', String(tool.id === activeTool));
        // The disabled state and the title are NOT set here -- see
        // refreshToolAvailability below, which this function calls once the
        // keys exist. One place decides the face, for the same reason one
        // place decides availability.
        const letter = document.createElement('span');
        letter.dataset.toolLetter = '';
        letter.textContent = roster.keyFor(tool.id, resolved);
        const label = document.createElement('span');
        label.dataset.toolName = '';
        label.textContent = tool.name;
        btn.append(letter, label);
        // PRESSING THE ARMED KEY RETURNS TO SELECT rather than to nothing --
        // see the register's comment. Pressing SELECT while select is armed is
        // therefore a no-op, which is right: it is the resting state.
        btn.addEventListener('click',
          () => setTool(tool.id === activeTool ? RESTING_TOOL : tool.id));
        return btn;
      }));
      box.append(name, keys);
      return box;
    }));
    refreshToolAvailability();
  };

  // §6 ON THE FACE, AND IT IS A WALK RATHER THAN A REBUILD. `disabled` rather
  // than hidden: a key that vanishes on TOY tells a drafter the tool does not
  // exist, and moves every key below it, so switching boards would reshuffle
  // the column under their finger. Down and still in its place says the true
  // thing -- this board does not offer it.
  //
  // WHY THIS IS NOT buildToolColumn() CALLED AGAIN. #tool-slot is shared: the
  // SELECTION and ASSEMBLY panels append into the same element, and this
  // builder is the only one that calls replaceChildren. Re-running it on a
  // board change wiped both of them -- the page kept its seventeen keys and
  // lost every selection mode, filter and assembly control. My own boards spec
  // stayed green through it, because it only ever looked at tool keys; 25
  // checks in three MERGED suites went red. Availability changes on a board
  // switch, the letters do not, so nothing needs rebuilding.
  function refreshToolAvailability() {
    const roster = window.DraftToolRoster;
    if (!roster) return;
    document.querySelectorAll('[data-tool-key]').forEach(btn => {
      const tool = roster.get(btn.dataset.toolKey);
      if (!tool) return;
      const usable = roster.availableOn(tool.id, board);
      btn.disabled = !usable;
      // The title is the whole name, because the face is 40px and
      // FENESTRATION does not fit on it at a readable size. When the key is
      // down the title is the only place the REASON fits.
      btn.title = usable ? tool.name
        : `${tool.name} — the TOY board does not offer this tool`;
    });
  }

  // The register tells the column, never the other way round. Any future
  // arming path -- a keyboard shortcut, a tool that puts itself down when it
  // finishes -- lights the right key for free, because it goes through
  // setTool and setTool is what fires this.
  toolListeners.push(next => {
    document.querySelectorAll('[data-tool-key]').forEach(btn => {
      btn.setAttribute('aria-pressed', String(btn.dataset.toolKey === next));
    });
  });

  buildToolColumn();

  // ── THE LETTERS ON THE KEYS DO SOMETHING ─────────────────────────────────
  //
  // The column has painted a letter on every key since it was built and not
  // one of them was wired. The faces are real -- they come from the roster,
  // which reads the drafter's OWN bindings, so a profile that moves TRIM off Q
  // moves the face too -- and pressing the key the page drew did nothing at
  // all. Seventeen keys, seventeen instructions the page could not carry out.
  //
  // Movie, 18 Sep: "check the model.dc file it has a tool was U before". It is
  // U -- profile-manager.js, `outline: 'U'` -- and he was pressing it. The old
  // page has no OUTLINE button either (its column is the same seventeen,
  // :24035); outline is reached there by that key or by picking a house type.
  // So the missing tool and the dead letters are one gap, not two.
  //
  // A KEY FACE THAT DOES NOTHING IS THE SAME DEFECT AS THE STALE GARAGE
  // REFUSAL two rungs back: the page stating something about itself that is
  // not true, and a drafter believing it.
  //
  // THE VERB IS THE COLUMN'S, not a second one. Pressing the armed tool's
  // letter returns to SELECT exactly as pressing its key does, because they
  // are one sentence said two ways -- and both go through setTool, so the
  // board refuses a tool it does not offer whichever way it was asked for.
  document.addEventListener('keydown', event => {
    const kb = window.DraftKeyboard;
    const roster = window.DraftToolRoster;
    if (!kb || !roster) return;
    // A DRAFTER TYPING A GARAGE WIDTH IS NOT ARMING THE WALL TOOL. The size
    // fields on the sign are the live case -- 'W' is a digit's neighbour and
    // a name is nothing but letters -- and a page that armed a tool out from
    // under a field would also eat the character.
    const el = event.target;
    if (el && (el.isContentEditable
      || ['INPUT', 'TEXTAREA', 'SELECT'].includes(el.tagName))) return;
    // NO COMBINATIONS FALL THROUGH HERE BY ACCIDENT: eventMatchesBinding
    // compares every modifier exactly, so Ctrl+Z is not 'Z' and the undo
    // handler keeps it.
    const map = roster.bindings();
    const tool = roster.TOOLS.find(entry => entry.command
      && kb.eventMatchesBinding(event, map[entry.command]));
    if (!tool) return;
    // ASKED OF THE BOARD BEFORE THE PRESS IS SPENT. setTool would refuse a
    // tool the board does not offer and fall back to SELECT, which would put
    // down the tool the drafter was holding as the price of a key that was
    // never going to work.
    if (!roster.availableOn(tool.id, board)) return;
    event.preventDefault();
    setTool(tool.id === activeTool ? RESTING_TOOL : tool.id);
  });

  // A BOARD CHANGE PUTS DOWN A TOOL THE NEW BOARD DOES NOT OFFER, and ONLY
  // such a tool. Leaving it armed would keep ROOF live behind a greyed ROOF
  // key -- the column telling the truth about the key and a lie about the
  // state, and the next drag still drawing a roof on the toy board.
  //
  // THE CONDITION IS NOT DECORATION. The first version called setTool on every
  // board change, and setTool clears `drawStart` because a tool change
  // abandons the gesture that belonged to the old tool. A BOARD change is not
  // a tool change: PROMOTION crosses boards in the middle of a run on purpose
  // -- typing a length in TOY offers DRAFTING and then commits that same run
  // -- so disarming unconditionally cut the anchor out from under the commit
  // and the wall was never made. model-toy-board.spec.js:224 caught it; the
  // gesture survives a crossing that keeps its tool.
  boardListeners.push(() => {
    const roster = window.DraftToolRoster;
    if (roster && !roster.availableOn(activeTool, board)) setTool(RESTING_TOOL);
    refreshToolAvailability();
    // THE OTHER TWO SURFACES. Leaving these out is exactly the gap that made
    // §6 a third built: the keys obeyed the board and the panels did not, and
    // nothing said so because the spec only looked at keys.
    syncSelectionPanel();
    syncAssembly();
    // AND THE FIXTURE PANEL, for the reason stated three lines up -- which is
    // the gap this very listener was written to close, and which the fixture
    // panel promptly fell into: built before the board settles, its chips read
    // TOY's answer and stayed dead on the drafting board. The keys obeyed the
    // board and one more panel did not.
    syncFixturePanel();
  });

  // ── SELECTION and OBJECT TYPE ─────────────────────────────────────────────
  // THE HELP STRINGS ARE THE OLD PAGE'S, VERBATIM (:23597 and :23619). They are
  // not decoration: the mode help is the only place the shift-drag shortcut is
  // written down, and the filter help is the only thing that tells a drafter
  // why the thing under the cursor stopped responding. Paraphrasing them would
  // have quietly dropped facts a drafter depends on.
  const MODES = [
    { id: 'click', label: 'ITEMS' },
    { id: 'window', label: 'WINDOW' },
    { id: 'window-all', label: 'ALL LEVELS' },
  ];
  const MODE_HELP = {
    click: 'Click items to select; Shift adds or removes. Press and drag for a '
      + 'blue window — hold Shift while dragging for a red all-levels window.',
    window: 'Drag a blue box to select fully enclosed items on the current level.',
    'window-all': 'Drag a red box to select fully enclosed items on every level.',
  };
  const FILTERS = [
    { id: 'all', label: 'ALL', aria: 'Grab any object type' },
    { id: 'line', label: 'LINE', aria: 'Grab only lines' },
    { id: 'wall', label: 'WALL', aria: 'Grab only walls' },
    { id: 'outline', label: 'OUTLINE', aria: 'Grab only outlines' },
    { id: 'floor', label: 'FLOOR', aria: 'Grab only floors' },
  ];
  const filterHelp = () => (selectFilter === 'all'
    ? 'Engage a type so Select only grabs that object — even under other geometry.'
    : `${selectFilter.toUpperCase()} is engaged: nothing else responds. `
      + 'Click ALL — or press Esc with nothing selected — to release.');

  // PICKING A MODE ALSO ARMS SELECT, which is the old page's own behaviour
  // (setClickSelectionMode and its two siblings all set activeTool: 'select').
  // Without it a drafter with WALL armed could press WINDOW, see it light, and
  // still draw a wall on the next drag.
  const setSelectionMode = id => {
    selectionMode = id;
    setTool('select');
    syncSelectionPanel();
  };

  const setSelectFilter = id => { selectFilter = id; syncSelectionPanel(); };

  let syncSelectionPanel = () => {};

  const buildSelectionPanel = () => {
    const slot = document.getElementById('tool-slot');
    if (!slot) return;
    const chip = (dataKey, entry, onPick) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'sel-chip';
      btn.dataset[dataKey] = entry.id;
      btn.textContent = entry.label;
      if (entry.aria) btn.setAttribute('aria-label', entry.aria);
      btn.addEventListener('click', () => onPick(entry.id));
      return btn;
    };
    const section = (name, chips, help) => {
      const box = document.createElement('div');
      box.dataset.toolGroup = name.toLowerCase().replace(/\s+/g, '-');
      const title = document.createElement('div');
      title.dataset.toolGroupName = '';
      title.textContent = name;
      const row = document.createElement('div');
      row.className = 'sel-row';
      row.append(...chips);
      box.append(title, row, help);
      return box;
    };

    const modeHelp = document.createElement('div');
    modeHelp.className = 'sel-help';
    modeHelp.dataset.selHelp = '';
    const filterHelpEl = document.createElement('div');
    filterHelpEl.className = 'sel-help';
    filterHelpEl.dataset.filterHelp = '';

    slot.append(
      section('SELECTION',
        MODES.map(m => chip('selMode', m, setSelectionMode)), modeHelp),
      section('OBJECT TYPE',
        FILTERS.map(f => chip('selFilter', f, setSelectFilter)), filterHelpEl));

    syncSelectionPanel = () => {
      // §6: "the selection filters ... none of them operate in TOY". The board
      // answer comes from the roster, not from a `board === 'toy'` written
      // here, so this panel and the keypad cannot disagree about a board.
      const on = window.DraftToolRoster?.panelOn('selection', board) !== false;
      slot.querySelectorAll('[data-sel-mode]').forEach(btn => {
        btn.setAttribute('aria-pressed',
          String(btn.dataset.selMode === selectionMode));
        btn.disabled = !on;
      });
      slot.querySelectorAll('[data-sel-filter]').forEach(btn => {
        btn.setAttribute('aria-pressed',
          String(btn.dataset.selFilter === selectFilter));
        btn.disabled = !on;
      });
      // THE HELP SAYS WHY, and it replaces the mode help rather than sitting
      // beside it: MODE_HELP describes a shortcut for a gesture this board
      // does not have, and leaving it up would teach a drafter a control that
      // is right there and dead.
      modeHelp.textContent = on ? MODE_HELP[selectionMode]
        : 'The TOY board edits through bones. Selection modes and filters are '
          + 'on the DRAFTING board.';
      filterHelpEl.textContent = on ? filterHelp() : '';
      // RED WHENEVER A FILTER IS ENGAGED -- not when the cursor is over
      // something the filter excludes. selectFilterHelpColor (:23622) is a
      // straight ternary on selectFilter, and a cursor-driven red would mean
      // hit-testing on every mousemove, which the old page does not do.
      filterHelpEl.toggleAttribute('data-engaged', selectFilter !== 'all');
    };
    syncSelectionPanel();
  };

  buildSelectionPanel();

  // ── ASSEMBLY and UNGROUP ──────────────────────────────────────────────────
  // WHAT AN ASSEMBLY IS, in the file: a named set of members recorded by TYPE
  // AND ID, never by object reference (_createGroup :17940). Ids are what
  // survive a save; references are not.
  //
  // ESCAPE IN THE NAME FIELD CREATES A "NOT FIXED" ASSEMBLY. It does not
  // cancel. That is the old page's binding (onGroupNameKey :23685-23687:
  // Enter -> _createGroup(true), Escape -> _createGroup(false)) and it is
  // ported faithfully because this order says the roster is not a place to
  // improve on -- but it is worth someone's decision rather than quiet
  // inheritance: everywhere else on both pages Escape backs out, so a drafter
  // reaching for it to abandon the dialog gets an assembly they did not want.
  // Flagged, not fixed.
  const nextGroupNumber = () => {
    const n = Number(drawing?.nextGroupId);
    return Number.isFinite(n) && n > 0 ? n : (groups().length + 1);
  };

  const createAssembly = fixed => {
    const chosen = selection.slice();
    if (!chosen.length) { closeAssemblyDialog(); return; }
    const members = [];
    chosen.forEach(entry => {
      if (!entry.item || entry.item.id == null) return;
      const key = memberKey(entry);
      if (!members.some(m => `${m.type}:${m.id}` === key)) {
        members.push({ type: entry.type, id: entry.item.id });
      }
    });
    if (!members.length) { closeAssemblyDialog(); return; }
    // AN ITEM BELONGS TO ONE ASSEMBLY. Taking it into a new one takes it out
    // of its old one, and an assembly left with nothing in it goes -- the old
    // page's own two lines, and without them a drafter can build overlapping
    // assemblies that disagree about what moves with what.
    const taken = new Set(members.map(m => `${m.type}:${m.id}`));
    drawing.groups = groups()
      .map(group => ({ ...group,
        members: (group.members || [])
          .filter(m => !taken.has(`${m.type}:${m.id}`)) }))
      .filter(group => group.members.length > 0);

    const n = nextGroupNumber();
    const typed = (assemblyName || '').trim().toUpperCase();
    const firstWall = chosen.find(entry => entry.type === 'wall')?.item;
    const group = {
      id: `group-${n}`,
      name: typed || `ASSEMBLY ${n}`,
      fixed: fixed === true,
      stretchBehavior: fixed === true ? 'rigid' : 'item-geometry',
      members,
      // The first wall's settings ride the assembly, so a later change to the
      // assembly has something to change FROM. Null when it holds no wall.
      wallSettings: firstWall ? {
        wallType: firstWall.wallType,
        baseHeight: firstWall.baseHeight,
        topHeight: firstWall.topHeight,
        refLine: firstWall.refLine,
      } : null,
    };
    drawing.groups.push(group);
    drawing.nextGroupId = n + 1;
    // The new assembly is what is selected afterwards -- all of it, which is
    // also the drafter's confirmation that it took.
    setSelection(itemsOfGroup(group));
    assemblyName = '';
    closeAssemblyDialog();
    markDirty();
    paint();
  };

  const ungroupSelected = () => {
    const going = selectedGroups();
    if (!going.length) return;
    const ids = new Set(going.map(group => group.id));
    // THE ITEMS SURVIVE; only the grouping goes. Ungroup is not delete, and
    // the members stay selected so the drafter can see what they just freed.
    drawing.groups = groups().filter(group => !ids.has(group.id));
    syncAssembly();
    markDirty();
    paint();
  };

  let assemblyName = '';
  let assemblyDialogOpen = false;
  let syncAssembly = () => {};
  const closeAssemblyDialog = () => { assemblyDialogOpen = false; syncAssembly(); };

  // ── THE FIXTURE PANEL ────────────────────────────────────────────────────
  //
  // Sixteen catalogue entries under their own four headings, and the headings
  // are DERIVED from the catalogue (DraftFixtureKinds.GROUPS) rather than
  // listed here -- a kind added to fixture-kinds.js appears under its heading
  // without a second place to edit, which is the whole reason the catalogue
  // moved out of MODEL.dc.html.
  //
  // PICKING A KIND ARMS THE TOOL. A drafter who presses CABINET means to place
  // a cabinet; making them press FIXTURE afterwards would be a second step
  // that says nothing. This is the same reasoning as the build bar arming the
  // outline trace at :3875 -- the choice IS the arming.
  //
  // THE HELP LINE IS THE CATALOGUE'S OWN `note`, not a sentence written here,
  // so what the panel promises and what the tool does come from one string.
  const buildFixturePanel = () => {
    const slot = document.getElementById('tool-slot');
    const K = window.DraftFixtureKinds;
    if (!slot || !K) return;

    const help = document.createElement('div');
    help.className = 'sel-help';
    help.dataset.fixtureHelp = '';

    K.GROUPS.forEach(group => {
      const box = document.createElement('div');
      box.dataset.toolGroup = `fixture-${group.toLowerCase()}`;
      const title = document.createElement('div');
      title.dataset.toolGroupName = '';
      title.textContent = group;
      const row = document.createElement('div');
      row.className = 'sel-row';
      K.kindsInGroup(group).forEach(kind => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'sel-chip';
        btn.dataset.fixtureKind = kind.id;
        btn.textContent = kind.label;
        btn.title = kind.note;
        btn.addEventListener('click', () => {
          fixtureKindId = kind.id;
          // A run half-made with one kind must not finish as another: the
          // second press would take the first press's `along` and file a
          // cabinet's width under a vanity. Same rule setTool applies to
          // drawStart, for the same reason.
          fixtureRunStart = null;
          setTool('fixture');
          syncFixturePanel();
        });
        row.append(btn);
      });
      box.append(title, row);
      slot.append(box);
    });
    slot.append(help);

    syncFixturePanel = () => {
      // The board answers through the roster, never a `board === 'toy'`
      // written here -- so this panel and the keypad cannot disagree about a
      // board. FIXTURE is not a TOY tool, so on TOY every chip is dead.
      const on = window.DraftToolRoster?.availableOn('fixture', board) !== false;
      slot.querySelectorAll('[data-fixture-kind]').forEach(btn => {
        btn.setAttribute('aria-pressed',
          String(activeTool === 'fixture' && btn.dataset.fixtureKind === fixtureKindId));
        btn.disabled = !on;
      });
      const kind = K.kindFor(fixtureKindId);
      help.textContent = activeTool === 'fixture'
        ? (fixtureRunStart
          ? `Press the other end of the ${kind.label.toLowerCase()} run.`
          : kind.note)
        : '';
    };
    syncFixturePanel();
  };

  const buildAssemblyPanel = () => {
    const slot = document.getElementById('tool-slot');
    if (!slot) return;
    const box = document.createElement('div');
    box.dataset.toolGroup = 'assembly';
    const title = document.createElement('div');
    title.dataset.toolGroupName = '';
    title.textContent = 'ASSEMBLY';

    const asmBtn = document.createElement('button');
    asmBtn.type = 'button';
    asmBtn.className = 'sel-chip asm-wide';
    asmBtn.dataset.assemblyStart = '';
    asmBtn.addEventListener('click', () => {
      if (!selection.length) return;
      assemblyDialogOpen = true;
      syncAssembly();
      slot.querySelector('[data-assembly-name]')?.focus();
    });

    const unBtn = document.createElement('button');
    unBtn.type = 'button';
    unBtn.className = 'sel-chip';
    unBtn.dataset.assemblyUngroup = '';
    unBtn.addEventListener('click', ungroupSelected);

    // LEVEL LOCK LIVES BESIDE ASSEMBLY, not in the LEVELS panel. The order
    // leaves the placement to me and this is the reason: a lock is made FROM
    // assemblies and it is the assembly the drafter has in his hand when he
    // wants one. The LEVELS panel knows about storeys, not about which
    // assembly on each storey is the same room -- putting the verb there would
    // mean picking the assemblies somewhere else and then walking to another
    // panel to join them.
    const lockBtn = document.createElement('button');
    lockBtn.type = 'button';
    lockBtn.className = 'sel-chip';
    lockBtn.dataset.levelLock = '';
    lockBtn.addEventListener('click', () => {
      const chosen = selectedGroups();
      // A LOCK OF ONE IS NOT A LOCK and the MODULE refuses it -- this verb
      // hands it the list and believes the answer, rather than counting to two
      // here. Counting here is how the page grows a second, weaker rule that
      // disagrees with the loader the day one of them changes.
      const lock = lockGroupsAcrossLevels(chosen);
      if (!lock) {
        sayOnStrip('a level lock needs two assemblies — one has nothing to '
          + 'be held against');
        return;
      }
      syncAssembly();
      paint();
    });

    const breakBtn = document.createElement('button');
    breakBtn.type = 'button';
    breakBtn.className = 'sel-chip';
    breakBtn.dataset.levelLockBreak = '';
    breakBtn.addEventListener('click', () => {
      const lock = selectedGroups().map(levelLockFor).find(Boolean);
      if (lock && breakLevelLock(lock)) { syncAssembly(); paint(); }
    });

    const help = document.createElement('div');
    help.className = 'sel-help';
    help.dataset.assemblyHelp = '';

    const dialog = document.createElement('div');
    dialog.dataset.assemblyDialog = '';
    dialog.hidden = true;
    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.dataset.assemblyName = '';
    nameInput.placeholder = 'NAME';
    nameInput.addEventListener('input', e => { assemblyName = e.target.value; });
    nameInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); createAssembly(true); }
      // See the note above: Escape here CREATES, it does not cancel.
      if (e.key === 'Escape') { e.preventDefault(); createAssembly(false); }
      // The page's own Escape clears the selection, which would empty the
      // dialog out from under itself.
      e.stopPropagation();
    });
    const row = document.createElement('div');
    row.className = 'sel-row';
    const fixedBtn = document.createElement('button');
    fixedBtn.type = 'button';
    fixedBtn.className = 'sel-chip';
    fixedBtn.dataset.assemblyFixed = '';
    fixedBtn.textContent = 'FIXED';
    fixedBtn.addEventListener('click', () => createAssembly(true));
    const looseBtn = document.createElement('button');
    looseBtn.type = 'button';
    looseBtn.className = 'sel-chip';
    looseBtn.dataset.assemblyLoose = '';
    looseBtn.textContent = 'NOT FIXED';
    looseBtn.addEventListener('click', () => createAssembly(false));
    row.append(fixedBtn, looseBtn);
    dialog.append(nameInput, row);

    // ONE ROW FOR THE THREE VERBS THAT ACT ON AN ASSEMBLY THAT ALREADY
    // EXISTS. Not a tidy: two extra full-width rows grew the right panel until
    // it covered world (4,-3), and model-html-draw-delete caught it as "the
    // tap reached the right sidebar, not the canvas" -- the same shape as the
    // instrument strip overflowing at 1280, one tier down. The panel was
    // already at that edge and one row tipped it.
    //
    // UNGROUP keeps its own width when it is alone, because BREAK LOCK is
    // hidden until there is a lock to break.
    const actRow = document.createElement('div');
    actRow.className = 'sel-row';
    actRow.append(unBtn, lockBtn, breakBtn);
    box.append(title, asmBtn, actRow, help, dialog);
    slot.append(box);

    syncAssembly = () => {
      const n = selection.length;
      const held = selectedGroups();
      const key = window.DraftToolRoster?.keyFor('select')
        ? window.DraftToolRoster.bindings() : {};
      const gKey = window.DraftKeyboard?.keyBindingLabel(key.group) || '';
      // §6: "the assembly verbs ... none of them operate in TOY". The board
      // beats the selection count -- a TOY drafter with items selected must
      // still find ASSEMBLY down, or the rule holds only while nothing is
      // picked, which is the half nobody would test.
      const on = window.DraftToolRoster?.panelOn('assembly', board) !== false;
      asmBtn.textContent = gKey ? `ASSEMBLY  [${gKey}]` : 'ASSEMBLY';
      asmBtn.disabled = !on || n === 0;
      unBtn.textContent = 'UNGROUP';
      unBtn.disabled = !on || held.length === 0;
      unBtn.hidden = held.length === 0;
      // THE LOCK VERBS ARE SYNCED HERE, in the same pass that owns these
      // buttons' state. Two places deciding one button's state is how they
      // drift -- the boneyard card cost an hour to exactly that.
      const lockedNow = held.map(levelLockFor).find(Boolean) || null;
      lockBtn.textContent = 'LEVEL LOCK';
      // OFFERED WITH ONE, AND REFUSED BY THE MODULE. Disabling this at
      // `held.length < 2` would be THE PAGE COUNTING TO TWO -- a second, weaker
      // copy of makeLock's rule, sitting where it can drift from the loader
      // that enforces the same thing. The gate proved it: with the count here,
      // a mutant replacing makeLock with the page's own maker SURVIVED,
      // because the button never fired and nothing ever asked the module.
      //
      // So the verb is live whenever an assembly is held, the module refuses a
      // lock of one, and the strip says why. A drafter finds out what a lock
      // needs by being told, rather than by a grey button that explains
      // nothing.
      lockBtn.disabled = !on || held.length === 0 || !!lockedNow;
      lockBtn.hidden = held.length === 0;
      breakBtn.textContent = lockedNow ? `BREAK ${lockedNow.name}` : 'BREAK LOCK';
      breakBtn.disabled = !on || !lockedNow;
      breakBtn.hidden = !lockedNow;
      // The old page's own two sentences (:23631-23633), and the red is its
      // own too: nothing selected is the state that stops the button working.
      help.textContent = !on
        ? 'Assemblies are a DRAFTING board verb.'
        : (n ? `${n} selected item${n === 1 ? '' : 's'} · make a named assembly.`
             : 'Select drawing items before assembling them.');
      help.toggleAttribute('data-engaged', !on || n === 0);
      dialog.hidden = !assemblyDialogOpen;
      if (!assemblyDialogOpen) nameInput.value = assemblyName = '';
    };
    syncAssembly();
  };

  buildFixturePanel();
  buildAssemblyPanel();
  selectionWatchers.push(() => syncAssembly());

  // ── THE STRUCTURE PROPERTIES PANEL ───────────────────────────────────────
  //
  // WHAT IT DOES NOT DO, said plainly rather than left to be discovered: it
  // does not make an existing column or beam clickable. This page's hit-test
  // knows walls, lines and floors; teaching it structure is the selection
  // system's job and not #392's. So the panel shows the item the drafter just
  // PLACED, which is the moment its properties are wanted and the moment
  // commitWall already selects its wall in.
  //
  // ONE VALUE PER ROW, AND THE VALUES ARE THE FORMAT'S. footing and mode are
  // enumerations drawing-format.js validates (:517 and :563); anything not on
  // those lists is silently replaced with the default on the next load, so the
  // panel offers exactly what the reader accepts and nothing else.
  const FOOTINGS = [['pad36', 'PAD 36"'], ['pad42', 'PAD 42"'],
    ['pile8', 'PILE 8"'], ['pile10', 'PILE 10"'], ['pile12', 'PILE 12"']];
  const BEAM_MODES = [['flush', 'FLUSH'], ['dropped', 'DROPPED']];

  const propRow = (label, options, current, pick) => {
    const row = document.createElement('div');
    row.dataset.propRow = label.toLowerCase();
    const name = document.createElement('div');
    name.className = 'props-title';
    name.textContent = label;
    const chips = document.createElement('div');
    chips.className = 'chip-row';
    chips.append(...options.map(([id, face]) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'sel-chip';
      btn.dataset.propValue = id;
      btn.textContent = face;
      btn.setAttribute('aria-pressed', String(id === current));
      btn.addEventListener('click', () => pick(id));
      return btn;
    }));
    row.append(name, chips);
    return row;
  };

  // A BUILDER RETURNS A NODE AND NOTHING ELSE. It used to call ModelProps.set
  // itself and return EARLY when the selection was not its own kind -- which
  // left whatever was in the box standing. See the router below.
  const columnPropsNode = item => {
    const box = document.createElement('div');
    box.append(propRow('FOOTING', FOOTINGS, item.footing, id => {
      item.footing = id;
      // A pile has a fixed diameter, so a pad's custom size is meaningless
      // on one. The format drops padIn for piles anyway (:534); dropping it
      // here too keeps the page's record and the reader's identical.
      if (id.startsWith('pile')) delete item.padIn;
      markDirty();
      showSelectionProps();
      paint();
    }));
    return box;
  };

  const beamPropsNode = item => {
    const box = document.createElement('div');
    const span = Math.hypot(item.end.x - item.start.x, item.end.z - item.start.z);
    box.append(propRow('BEAM', BEAM_MODES, item.mode, id => {
      item.mode = id;
      markDirty();
      showSelectionProps();
      paint();
    }));
    const len = document.createElement('div');
    len.dataset.propSpan = '';
    len.className = 'props-title';
    // The span is read from the geometry, never stored: a stored length and
    // a moved endpoint are two facts that can disagree, and the drafter
    // would believe the one on the panel.
    len.textContent = `SPAN ${feetLabel(span)}`;
    box.append(len);
    return box;
  };

  // ── WALL PROPERTIES ───────────────────────────────────────────────────────
  //
  // Movie, 19 Sep: "if they select a specific wall or multiples they can
  // change the properties". A wall, or several -- NOT the old page's rule.
  // MODEL.dc.html has this editor only on an ASSEMBLY
  // (_selectedGroupForWallEditing), so changing one wall's type there means
  // bundling it into a named group first. Movie ruled otherwise for this
  // page. The RECORD it writes is the old page's, field for field
  // (_applyGroupWallSettings :18110-18118).
  //
  // WHY IT MATTERS MORE THAN IT LOOKS. A wall's height is copied in when it
  // is drawn, from the storey's default, and never looked at again -- on both
  // pages. Movie's rule for the default moving ("if the floor or ceiling is
  // the same height as the DEFAULT, if they change the PROJECT DEFAULT, also
  // change those heights to match") leaves behind exactly the walls somebody
  // had already adjusted, and he answered that himself: "(the user may need
  // to manually change the 'previously adjusted' height". This is the panel
  // he changes them with.
  const REF_LINES = [['left', 'LEFT'], ['center', 'CENTRE'], ['right', 'RIGHT']];

  // A GUARDRAIL IS 42", and that is a HELD DEFAULT rather than a code rule --
  // the height one arrives at when it is first switched on, and Movie's to
  // change. 42 inches is 3'-6", which is what the field shows.
  //
  // AND IT IS A GUARDRAIL, NOT A HANDRAIL. Movie drew the line, 20 Sep: "it
  // should be clarified as GUARDRAIL (typical 42" height) / to be not
  // confused with HANDRAIL which would be 3' height an accompany min one
  // side of a staircase". Six inches apart and different jobs -- a guard
  // stops a fall, a hand rail is what you hold going down. The handrail is
  // NOT built, here or anywhere: it belongs to the stair, not to a wall
  // type, and naming this one properly is what keeps the next reader from
  // assuming it was.
  const GUARDRAIL_HEIGHT_FT = 42 / 12;

  // What the walls in hand AGREE on, or null. A LIT CHIP IS A CLAIM ABOUT
  // EVERY WALL IN THE SELECTION, so two walls of different types light
  // nothing rather than lighting the first one's -- the drafter would
  // otherwise read the panel as "these are all 2x6" and be wrong about one.
