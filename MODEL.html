      drawing.outlines.push(bone);
      pendingBone = null;
    }
  };

  // ── THE ORDERED GARAGE BUILDS ITSELF ─────────────────────────────────────
  //
  // Movie, 15 Sep: "now i need the garage to be AUTOBUILT ... it should
  // make a rectangle outline of that size and then build it with the
  // project data". This is the FIRST listener on the order seam: until now
  // a press recorded what was wanted and drew nothing.
  //
  // THE OUTLINE IS THE ORDER AND THE WALLS FOLLOW IT, in that sequence,
  // because the loop is what says "this is a detached garage of this size"
  // -- four walls alone are a shape the file cannot tell from a shed. The
  // walls are committed through the same commitWall the drafter's own
  // trace uses, so the garage carries the project's wall type, heights and
  // reference line rather than a second set of defaults invented here.
  //
  // WHERE IT STANDS IS garage-site.js's ANSWER, not this page's: PROJECT
  // will place one too, and a second derivation of "beside the house" is
  // the copy the ruling is about.
  //
  // ONE PRESS, ONE UNDO. Five separate steps would have Ctrl+Z leave three
  // walls and a garage-flagged loop standing around them, which is not a
  // state any gesture can otherwise produce.
  const buildOrderedGarage = order => {
    if (!drawing || !order?.entry?.needsSize || !order.size) return null;
    // THE LOWEST FLOOR LEVEL, NOT THE ACTIVE ONE -- the same fix the premade
    // house needed, and the other half of what Movie reported. A garage
    // ordered while looking at FOUNDATION had its STUD walls committed
    // through the active view, so contextWallType handed back concrete_8 and
    // the drafter got a garage framed in eight inches of concrete on the
    // foundation set. MODEL.dc.html's _buildGarageWalls uses
    // `_floorLevels()[0]` for exactly this reason.
    const storey = lowestFloorLevel();
    if (!storey) return null;
    const levelId = storey.id;
    const corners = window.DraftGarageSite.plotFor(drawing, levelId, order.size);
    if (!corners) return null;
    drawing.outlines = drawing.outlines || [];
    const outline = {
      id: newDrawingItemId('outline'),
      masterId: null,
      levelId,
      garage: true,
      // DETACHED, SAID ON THE RECORD. It is the detached family's own tile,
      // and an outline that only implies it would not spend the detached
      // garage's slot -- building-bodies.js reads the flag, not the family.
      detached: true,
      foundation: order.entry.foundation || null,
      points: corners.map(pt => ({ x: pt.x, y: 0, z: pt.z })),
      overriddenSrcIds: [],
    };
    drawing.outlines.push(outline);
    // The four walls' own 'add' steps are dropped for the single 'built'
    // one below. Left in, the first Ctrl+Z would take the whole garage and
    // the next four would each hunt a wall that is already gone.
    const mark = undoStack.length;
    // STUDS ON THE STOREY, said explicitly rather than inherited: `plan` is
    // where a garage's framed walls live whatever set the drafter is on.
    const walls = corners.map((corner, index) =>
      commitWall(corner, corners[(index + 1) % corners.length],
        { bone: false, levelId, view: 'plan', body: 'garage' }));
    // ── AND A WAY INTO IT ────────────────────────────────────────────────
    //
    // Movie, 20 Sep: "also the detached garage doesn't have a roof or windows
    // and doors yet i noticed". Four walls, its concrete, and nothing else --
    // a sealed box on every sheet.
    //
    // BY EDGE, and this array IS edge-indexed rather than merely in order:
    // corners.map raises one wall per edge and skips none, so `walls[i]` is
    // edge i. Said out loud because the same assumption held in raiseLoop
    // right up until an attached garage began skipping shared edges, and the
    // openings then moved one wall over and still looked like doors.
    //
    // THE SIZE THE DRAFTER TYPED, handed to the design rather than re-derived
    // from the corners: `order.size` is what build-menu.js checked and named,
    // and measuring the loop back would be a second opinion about which of the
    // two numbers is the width.
    //
    // AND THE WALL THICKNESS THIS PAGE FRAMED IT IN, because that is what
    // carries the end of the overhead door's lintel -- premade-plans.js sizes
    // the door to fit and cannot know what contextWallType handed back.
    const openings = dealOpenings(
      window.DraftPremadePlans.detachedGarageOpenings({
        widthFt: order.size.widthFt,
        depthFt: order.size.depthFt,
        wallThicknessFt: openingThicknessFt()(walls[0]),
      }), walls, levelId);
    // AND ITS CONCRETE. Movie ordered a "detached garage 25x25 with frost
    // wall" and got four stud walls: the tile asked him which foundation and
    // then threw the answer away, because nothing on this page read it.
    const concrete = raiseGarageConcrete(corners, outline);
    // ── AND THE ROOF OVER IT ─────────────────────────────────────────────
    //
    // NO `against`, and that is the whole difference between this roof and the
    // attached garage's. A detached garage touches nothing: every edge is an
    // eave, every edge takes the full overhang, and there is no house wall for
    // a gable to cut against. The attached one passes the house and gets both
    // of those answers the other way round on two of its edges.
    //
    // FLAGGED `garage` WITH ITS OWN PLATE, for the same reason the attached
    // one is: cut-view.js's roofBaseElev bears such a roof at the first floor's
    // top plus the plate instead of on the full wall stack, so a single-storey
    // garage beside a 2 STOREY keeps a single-storey roof. On a bungalow the
    // two readings land on the same number, so the flag costs nothing there.
    //
    // AND ONLY WHERE THERE IS A ROOF LEVEL TO PUT IT ON, which is the rule the
    // premade build already follows -- a drawing without one gets the garage it
    // ordered rather than a silent failure or a roof filed nowhere.
    const roof = levelPresent(ROOF_LEVEL_ID)
      ? raiseRoofOver(corners, {
        garage: true,
        plateHeightFt: assemblyFor(levelId).wallHeightFt,
        sourceLevelId: levelId,
      })
      : null;
    undoStack.length = mark;
    // `outlines` PLURAL, because a premade bungalow raises two bodies on one
    // press and one press is one undo. The garage passes its single loop as a
    // list of one rather than the branch learning two shapes.
    undoStack.push({ kind: 'built', walls: walls.concat(concrete.walls),
      outlines: [outline], list: drawing.outlines, openings,
      items: concrete.items.concat(roof ? [roof] : []) });
    markDirty();
    paint();
    return outline;
  };
  // AND THE BOARD GETS OUT OF THE WAY once it has built what was ordered:
  // the drafter's next move is to look at the garage, and it is behind the
  // sign.
  window.ModelBuild.onOrder(order => {
    if (!buildOrderedGarage(order)) return;
    window.ModelBuild.orderServed();
    setSign(false);
  });

  // ── STRUCTURE: PLACING A COLUMN AND A BEAM ───────────────────────────────
  //
  // AN INTEGER ID, AND NOT newDrawingItemId. This is the whole trap in #392's
  // other half. That helper returns the STRING `column-7`, which is what
  // commitWall uses and what the wall reader accepts -- but drawing-format.js
  // reads a column's id at :512 and a beam's at :549 with `Number(id)` and
  // drops the record when it is not an integer. Measured before any of this
  // was written:
  //
  //   F.columns([{ id: 'column-7', point, levelId: 3, view: 'plan' }])  ->  []
  //   F.columns([{ id: 7,          point, levelId: 3, view: 'plan' }])  ->  [ ... ]
  //
  // So the obvious implementation puts a column on the canvas, saves a file
  // that reads correctly, and loses it on the next load with no error at
  // either end. Highest-plus-one rather than a counter, because the format
  // dedupes on id: a repeat drops every record after the first, equally
  // silently.
  const newStructureId = list => {
    let max = 0;
    for (const item of (list || [])) {
      const n = Number(item?.id);
      if (Number.isInteger(n) && n > max) max = n;
    }
    return max + 1;
  };

  // A SECOND UNDO KIND RATHER THAN A WIDER FIRST ONE. The existing 'add' step
  // is wall-shaped -- `drawing.walls.indexOf(step.wall)` -- so pushing a column
  // through it would pop a step, find nothing, and silently spend the
  // drafter's undo. Widening that branch would touch wall undo, which is
  // merged and covered; this leaves it alone.
  const addItem = (list, item) => {
    list.push(item);
    undoStack.push({ kind: 'add-item', list, item });
    markDirty();
    paint();
    return item;
  };

  const placeColumn = at => {
    const { levelId, viewId } = onActiveLevel();
    drawing.columns = drawing.columns || [];
    return selectPlaced('column', addItem(drawing.columns, {
      id: newStructureId(drawing.columns),
      point: { x: at.x, y: 0, z: at.z },
      levelId,
      // A column answers to the same home-view rule a wall does: everything on
      // this page reads 'plan' except floors. Placed on the FOUNDATION plan it
      // belongs to the foundation, not to a default.
      view: wallHomeView(viewId),
      // The format's own default, named here rather than left out, so the
      // record this page writes and the record the reader rebuilds are the
      // same object rather than one filled in behind the page's back.
      footing: 'pad36',
    }));
  };

  // WHAT WAS JUST PLACED IS WHAT IS SELECTED, exactly as commitWall does for a
  // wall. It is also what gives the properties panel something to show: this
  // page cannot hit-test a column, so the placement is the only moment the
  // selection can arrive.
  const selectPlaced = (type, item) => {
    setSelection([{ type, item }]);
    return item;
  };

  let beamStart = null;
  const beamPress = at => {
    if (!beamStart) { beamStart = { x: at.x, y: 0, z: at.z }; paint(); return null; }
    const end = { x: at.x, y: 0, z: at.z };
    // A BEAM OF NO LENGTH IS NOT A BEAM, and the reader agrees: the format
    // drops anything under 0.001 (drawing-format.js:553). Writing one would
    // put a record in the file that vanishes on load -- the same silent loss
    // as a string id, by a different route. Treat the second press as a
    // correction, exactly as drawPress does for a wall.
    if (Math.hypot(end.x - beamStart.x, end.z - beamStart.z) < 0.001) {
      beamStart = end; paint(); return null;
    }
    const { levelId, viewId } = onActiveLevel();
    drawing.beams = drawing.beams || [];
    const beam = addItem(drawing.beams, {
      id: newStructureId(drawing.beams),
      start: beamStart,
      end,
      levelId,
      view: wallHomeView(viewId),
      // Named for the same reason footing is: the record this page writes and
      // the record the reader rebuilds should be the same object, not one
      // filled in behind the page's back.
      mode: 'flush',
    });
    // No chaining: a beam is one span between two supports, not a run. The
    // next beam starts where the drafter next presses.
    beamStart = null;
    return selectPlaced('beam', beam);
  };

  // ── ROOF: THE FOOTPRINT IS THE GESTURE ────────────────────────────────────
  //
  // Parity with MODEL.dc.html:16704 `_buildRoofFromShape` -- the from-a-shape
  // rework, board #31 -- and with nothing else. The old page has a SECOND way
  // in: click an edge, click the side the body runs toward, drop a square
  // (:16584 `_handleRoofClick`, phases 'edge' / 'direction' / 'overhang').
  // That path is deliberately not ported. It is a second control on one piece
  // of state, which is the drift this page was rebuilt to end, and the order
  // is explicit: no new entry path.
  //
  // WHAT IS WRITTEN IS drawing-format.js:490's record, key for key. Every
  // field below is one that validator already rebuilds, so the roof this
  // gesture writes and the roof the reader restores are the same object.
  //
  // POINTS ARE PLAIN, NOT POOLED. Walls pool their endpoints through
  // poolVertex(pt, levelId, viewId), but that pool is keyed by VIEW and a roof
  // has none -- roofs take the level-only rule (see roofs(), :2221). A roof
  // corner filed under a view roofs do not have is a corner nothing can find
  // again. The old page pools because its node drag hit-tests roof vertices;
  // this page has no such gesture, so pooling here would add state with no
  // way to reach it.
  //
  // 5.5 IS NOT A CHOICE THE PANEL MAKES, AND NOT A NUMBER THIS PAGE OWNS.
  // drawing-format.js writes `fascia` unconditionally on load, so a
  // drafter-set one would be dropped on the next open -- store-vs-derive, the
  // bug class task #28 named. The panel DERIVES the heel and stores nothing,
  // and it takes the fascia from the module that decides what a roof record
  // is rather than keeping a second 5.5 here to drift from it.
  const ROOF_FASCIA_IN = window.DraftDrawingFormat.ROOF_FASCIA_IN;
  const ROOF_EDGE_GRAB_PX = 12;
  let roofOverhangFt = 2;   // drawing-format.js:503's own default
  let roofPitch = 4;        //  ..and :504's

  // THE HEEL IS NOT RE-DERIVED HERE. drawing-format.js owns
  // `fasciaIn + overhangFt * pitch` beside the fascia it starts from, and
  // proto/section-table-harness.js:204 measures it (5.5, 2, 4 -> 13.5);
  // project-page.js delegates to the same function. A second copy in this file
  // would be a second answer the moment either moved.
  //
  // IT IS READ FROM A MODULE THIS PAGE ALREADY LOADS. Getting it from
  // project-page.js instead cost nothing at the panel and 1855 lines at the
  // door, and tests/model-html-tier1.spec.js:244 -- the guard on what this
  // page is allowed to depend on -- went red for exactly that reason.
  const roofHeelIn = () =>
    window.DraftDrawingFormat.roofHeelIn(ROOF_FASCIA_IN, roofOverhangFt, roofPitch);

  // The footprint the roof is cut from: the level's outline, offset OUT by the
  // overhang. Last one wins, as the old page takes the last shape (:16718).
  const roofSourceOutline = () => {
    const list = outlines().filter(o => (o.points || []).length >= 3);
    return list.length ? list[list.length - 1] : null;
  };

  const buildRoofFromFootprint = () => {
    const { levelId } = onActiveLevel();
    const source = roofSourceOutline();
    if (levelId == null || !source) return null;
    const pts = window.DraftGeometry2D.offsetOutline(
      source.points.map(pt => ({ x: pt.x, z: pt.z })), roofOverhangFt);
    // An offset that collapses the loop is not a roof. Writing the degenerate
    // one would put a record in the file that drawing-format.js:494 drops on
    // load -- present on screen, gone after a reload, which is the silent loss
    // beamPress refuses for the same reason.
    if (!Array.isArray(pts) || pts.length < 3) return null;
    drawing.roofs = drawing.roofs || [];
    return addItem(drawing.roofs, {
      id: newDrawingItemId('roof'),
      points: pts.map(pt => ({ x: pt.x, z: pt.z })),
      levelId,
      sourceLevelId: source.levelId ?? null,
      sourceShapeId: source.id || null,
      edges: pts.map(() => 'eave'),
      overhang: roofOverhangFt,
      pitch: roofPitch,
      fascia: ROOF_FASCIA_IN,
      layer: 'A-ROOF',
    });
  };

  // Nearest roof EDGE to a world point, threshold converted at the current
  // zoom exactly as wallAt does, so the grab stays 12px on screen at any
  // scale. Mirrors MODEL.dc.html:_findRoofEdgeAt, whose threshold is the same
  // conversion written through the frustum instead of view.scale.
  const roofEdgeAt = worldPt => {
    const G = window.DraftGeometry2D;
    const thresh = ROOF_EDGE_GRAB_PX / view.scale;
    let best = null, bestD = thresh;
    roofs().forEach(roof => {
      const pts = roof.points || [];
      pts.forEach((pt, index) => {
        const next = pts[(index + 1) % pts.length];
        const { d } = G.pointToSegment(worldPt, { start: pt, end: next });
        if (d < bestD) { bestD = d; best = { roof, index }; }
      });
    });
    return best;
  };

  // A GABLE IS PLACED BY FLIPPING AN EDGE, NOT BY DRAWING ONE (the BONE note's
  // ruled pick-target model). The press does nothing at all when it lands off
  // every edge -- it does not start a roof, because there is only one way to
  // start one and it is the panel's button.
  const roofPress = at => {
    const hit = roofEdgeAt(at);
    if (!hit) return null;
    const was = hit.roof.edges[hit.index] === 'gable' ? 'gable' : 'eave';
    const now = was === 'gable' ? 'eave' : 'gable';
    hit.roof.edges[hit.index] = now;
    // A FOURTH UNDO KIND rather than a wider existing one, for the reason
    // addItem's comment gives: 'add-item' pops a record OUT of a list, and a
    // tag flip adds nothing. Undoing one through that branch would splice a
    // whole roof away for a one-word change.
    undoStack.push({ kind: 'edge-tag', roof: hit.roof, index: hit.index, was });
    markDirty();
    paint();
    return hit;
  };

  // DELETE CASCADES, IT DOES NOT REFUSE — MODEL.dc.html:22225-22251 does, and
  // the round-trip proof is about the two pages agreeing on what delete MEANS.
  // A refusal here would also need a message surface this page does not have
  // for a drafter with no keyboard.
  //
  // Three referent classes, all riding through on the ...parsed spread and
  // none of them validated on load — format.fenestrations and format.fixtures
  // check levelId, type, width and offset and NEVER that the host wall exists
  // (drawing-format.js:184-200, :229-245). So an orphan is invisible and
  // persistent: it survives every save, paints nowhere, and returns the moment
  // something is given its host's id.
  const deleteWall = wall => {
    const index = drawing.walls.indexOf(wall);
    if (index < 0) return null;
    drawing.walls.splice(index, 1);
    const gone = wall.id;
    const deps = [];
    const cut = (list, doomed) => {
      if (!Array.isArray(list)) return;
      for (let i = list.length - 1; i >= 0; i--) {
        if (!doomed(list[i])) continue;
        deps.push({ list, index: i, item: list[i] });
        list.splice(i, 1);
      }
    };
    // A door or window whose host is gone.
    cut(drawing.fenestrations, f => f && f.wallId === gone);
    // A fixture by either anchor: the tub needs its faucet-END wall too.
    cut(drawing.fixtures, f => f && (f.wallId === gone || f.endWallId === gone));
    // AND THE REFUSED ONES, or refusing a record makes it IMMORTAL. Since the
    // load block started normalising fixtures (tier 3j), a fixture the format
    // turns down is held in `refusedItems` and put back by withRefused() on
    // save -- which is right, because declining to act on a drafter's geometry
    // must not delete it. But a delete cascade IS this page acting on the
    // wall, and a refused fixture the cascade cannot reach outlives the wall
    // it hung on: invisible, unpaintable, and back in the file after every
    // save. That is the orphan this test names, arriving by a new road.
    //
    // Through `cut` rather than a filter, so the removal joins `deps` and undo
    // restores it with everything else the wall took.
    cut(refusedItems.fixtures, entry => entry && entry.item
      && (entry.item.wallId === gone || entry.item.endWallId === gone));
    // AND GROUPS, which neither the order nor the review named. The old page
    // runs _cleanupGroups() beside the cascade; groups reference members by
    // {type, id}, so a group left holding a dead wall id adopts the next wall
    // to be given it. Members go; a group emptied to fewer than two members
    // is not a group, so it goes too.
    if (Array.isArray(drawing.groups)) {
      drawing.groups.forEach(group => {
        cut(group && group.members, m => m && m.type === 'wall' && String(m.id) === gone);
      });
      cut(drawing.groups, g => g && Array.isArray(g.members) && g.members.length < 2);
    }
    // deps were collected newest-first per list; undo re-inserts in reverse so
    // each splice lands at the index it was taken from.
    deps.reverse();
    const retired = retirePoolCorners([wall.start, wall.end]);
    setSelection(selection.filter(entry => entry.item !== wall));
    undoStack.push({ kind: 'remove', wall, index, deps, retired });
    markDirty();
    return wall;
  };

  // ── one DELETE, for everything selected (§7a) ─────────────────────────────
  // THE VERB IS WIDENED, `selectedWall()` IS NOT. That helper answers "is a
  // single wall selected", which is what the length box and the wall gestures
  // ask it; widening it to mean "the selected thing" would quietly hand those
  // callers a floor. So the narrow question stays narrow and the deleting
  // happens out here, over the selection itself.
  //
  // AND THE WALL CASCADE IS CALLED, NOT REIMPLEMENTED. deleteWall carries the
  // fenestrations, fixtures, group members and pooled corners with it; a
  // second removal path that only spliced drawing.walls would leave every one
  // of those behind, which is the exact orphan class its own comment
  // describes.
  const SELECTION_LISTS = Object.freeze({
    line: 'lines',
    floor: 'floors',
    outline: 'outlines',
    column: 'columns',
    beam: 'beams',
    // DELETE COMES FREE WITH THE ENTRY. deleteEntry splices out of whatever
    // list this names and pushes the undo step, so an opening needs no branch
    // of its own -- and the cascade the other way already worked: deleteWall
    // takes its openings with it.
    fenestration: 'fenestrations',
  });

  const deleteEntry = entry => {
    if (!entry || !drawing) return false;
    if (entry.type === 'wall') return !!deleteWall(entry.item);
    const key = SELECTION_LISTS[entry.type];
    const list = key ? drawing[key] : null;
    if (!Array.isArray(list)) return false;
    const index = list.indexOf(entry.item);
    if (index < 0) return false;
    list.splice(index, 1);
    undoStack.push({ kind: 'remove-item', list, index, item: entry.item });
    markDirty();
    return true;
  };

  // ── COPY AND PASTE, ACROSS WORKSPACES ──────────────────────────────────────
  // Movie, 14 Sep: "copy and paste stuff in there that won't show on the plan
  // (to save for later / reference)".
  //
  // WHAT MAKES THIS NEW rather than a port. DC's copy is one gesture inside
  // one workspace -- capture a rectangle, give a base point, give a
  // destination, done -- and Movie's ask OUTLIVES the gesture: take it here,
  // put it down over there, possibly after looking at three other shelves.
  // So COPY takes a snapshot and PASTE reads that snapshot, and the two are
  // joined by `held` rather than by one uninterrupted drag.
  //
  // RAW SNAPSHOTS, taken at COPY. Holding references to the live items would
  // let an edit -- or a DELETE -- between the copy and the paste reach back
  // into what the drafter thought he had taken.
  const copySelection = () => {
    if (!drawing || !selection.length) return 0;
    held = selection
      .filter(entry => entry.type === 'wall' || SELECTION_LISTS[entry.type])
      .map(entry => ({ type: entry.type, raw: JSON.parse(JSON.stringify(entry.item)) }));
    return held.length;
  };

  const pasteHeld = () => {
    if (!drawing || !held.length) return 0;
    const owner = activeLevelId();
    const landed = [];
    held.forEach(({ type, raw }) => {
      const key = type === 'wall' ? 'walls' : SELECTION_LISTS[type];
      if (!key) return;
      // EVERY LINK TO WHERE IT CAME FROM IS CUT, and each strip is its own
      // rule rather than one tidy-up:
      //
      //   id        REALLOCATED, always. "Never paste an item carrying the id
      //             it had on the level it came from" -- #392 paid for one id
      //             bug already and a duplicate id is the same family.
      //   levelId   THE ACTIVE WORKSPACE, which is what makes this a paste
      //             ONTO a shelf: a level's id, or -shelfId on a shelf.
      //   groupId   DROPPED, though MEASURED IT IS ALREADY A NO-OP HERE and
      //             that is worth saying rather than implying a guard that is
      //             not doing the work. The order's rule is "do not let a
      //             pasted wall join a group that lives on another level", and
      //             on this page membership is not on the item: a group holds
      //             `members: [{type, id}]` and the wall normaliser keeps no
      //             groupId. Reallocating the id is therefore what actually
      //             enforces the rule -- no member row names the copy. The
      //             strip stays for anything that does carry one.
      //   srcId     DROPPED, with offX/offZ. Those link a corner to a
      //             boneyard master so propagation can find it; a pasted copy
      //             is new geometry, not a second face of the master, and
      //             leaving the link would have the master drag the parked
      //             copy around.
      const { id: _id, groupId: _g, ...rest } = raw;
      const copy = { ...rest, id: newDrawingItemId(type), levelId: owner };
      ['start', 'end', 'point', 'anchor'].forEach(field => {
        if (!copy[field] || typeof copy[field] !== 'object') return;
        const { srcId: _s, offX: _ox, offZ: _oz, ...pt } = copy[field];
        copy[field] = { ...pt };
      });
      if (Array.isArray(copy.points)) {
        copy.points = copy.points.map(pt => {
          const { srcId: _s, offX: _ox, offZ: _oz, ...keep } = pt || {};
          return { ...keep };
        });
      }
      drawing[key] = drawing[key] || [];
      drawing[key].push(copy);
      landed.push({ type, item: copy });
    });
    if (!landed.length) return 0;
    markDirty();
    // SELECTED WHERE IT LANDED, so the drafter can see what he just put down
    // and move it without hunting for it.
    setSelection(landed);
    paint();
    return landed.length;
  };

  // A COPY OF THE SELECTION FIRST. deleteWall calls setSelection, which
  // rebuilds the array being walked; iterating the live one deletes every
  // second thing and reports success.
  const deleteSelection = () => {
    if (!drawing || !selection.length) return 0;
    const doomed = selection.slice();
    let gone = 0;
    doomed.forEach(entry => { if (deleteEntry(entry)) gone += 1; });
    if (!gone) return 0;
    setSelection(selection.filter(entry => !doomed.includes(entry)));
    return gone;
  };

  // ── the draw gesture ──────────────────────────────────────────────────────
  // TWO PRESSES, one wall. The first sets a start and the second commits, so
  // the gesture works with a finger, a pen or a mouse without a drag — the old
  // page's wall tool is press-press too (its chain committer is the same shape
  // repeated).
  //
  // ARMED IS A MODE, and it is visible: the WALL key in the tool column
  // carries the accent while the next tap will draw. A mode nobody can see is
  // how a drafter loses a pan and gets a wall.
  //
  // DRAW WALL, THE BUTTON, IS GONE (§7). It was the chrome bar's own arming
  // control and the tool column's WALL key was the second one; two buttons
  // for one register is the drift this pass exists to end, and the key is the
  // survivor because the other sixteen tools are already only there.
  const deleteButton = document.getElementById('delete');
  const copyButton = document.getElementById('copy');
  const pasteButton = document.getElementById('paste');

  // WHAT IS HELD. Not the selection, and not a reference to it: raw snapshots
  // taken at COPY, so an edit or a delete between the copy and the paste
  // cannot reach back into what the drafter took.
  let held = [];

  // WHAT COUNTS AS A MODAL. Each of these covers the whole viewport at
  // z-index 7 and asks a question that has to be answered first; the foot
  // strip sits at 6, under all of them. The drive-thru sign is not built and
  // will be the fifth entry in this list rather than a new mechanism.
  const MODAL_IDS = ['promote', 'bone-choice', 'build-choice', 'file-guard', 'save-as'];
  const modalUp = () => MODAL_IDS.some(id => {
    const node = document.getElementById(id);
    return !!node && !node.hidden;
  });

  // ONE DELETE PRESS, whichever control did the pressing. The button and the
  // two keys were separate implementations of the same sentence and only one
  // of them was ever taught anything new.
  const pressDelete = () => {
    if (activeCut() || modalUp()) return 0;
    const gone = deleteSelection();
    if (gone) paint();
    return gone;
  };
  // ── the tool register ─────────────────────────────────────────────────────
  // ONE VARIABLE HOLDS WHICH TOOL IS ARMED, and it holds a tool id, never a
  // boolean. This was `let drawArmed = false` — correct while WALL was the only
  // tool on the page, and the wrong shape the moment a second one exists. A
  // seventeen-key column hung off its own state beside a live boolean gives the
  // page two ideas of what is armed; a drafter would then press SELECT, see the
  // column agree, and still commit a wall on the next tap, because the boolean
  // never heard about it. That is the same two-sources-of-truth failure this
  // page's own shell comment warns about for the active level, one panel over.
  //
  // SELECT IS THE RESTING TOOL, not "nothing armed". The old page has no
  // no-tool state (its Select is `standardTool('Select', …)`, one of the four),
  // and a column with no key lit looks exactly like a column that stopped
  // working. Pressing the armed key puts it back to select.
  //
  // WHAT THIS DOES NOT DO: it does not know how any tool behaves. Every gesture
  // still reads the register and decides for itself; the register only says
  // which one gets the press.
  const RESTING_TOOL = 'select';
  let activeTool = RESTING_TOOL;
  let drawStart = null;
  // Where the wall gesture's pointer went down, and whether that press opened
  // the run. Read by the pointerup that places the line; see its comment.
  let wallPress = null;
  const toolListeners = [];
  // THE BOARD'S LISTENERS ARE DECLARED HERE, beside the tool's, for one dull
  // reason: `applyBoard` runs at load and the tool column builder is a `const`
  // defined several hundred lines further down, so applyBoard cannot name it
  // without landing in its temporal dead zone. An array declared up here can
  // be filled in later and fired from anywhere.
  const boardListeners = [];

  const setTool = id => {
    const roster = window.DraftToolRoster;
    // An unknown id would silently arm nothing and read as "select is on",
    // which is a broken state that looks like a working one.
    //
    // §6, "no other tools": THE REGISTER ASKS THE SAME FUNCTION THE KEYPAD
    // ASKS. Greying a key is presentation and presentation can be got round --
    // a keyboard shortcut, a restored session, a tool that arms itself when a
    // gesture finishes. Refusing here is what makes the board a rule rather
    // than a look, and it falls back to the resting tool for the same reason
    // an unknown id does: there is no such thing as no tool.
    const next = roster && roster.availableOn(id, board) ? id : RESTING_TOOL;
    activeTool = next;
    // THE BRUSH'S PRESS GOES DOWN AND ITS LOAD STAYS UP. Movie, 20 Sep: "if
    // they change to WALL command and start drawing a wall those 'selected'
    // drafting brush properties will remain". The brush takes pointerdown
    // whole, so a tool armed under it could never be reached -- but clearing
    // what it is holding here would delete the very thing that sentence asks
    // to survive. Two facts, and only one of them is about the tool.
    if (next !== RESTING_TOOL) brushOn = false;
    // Any half-finished gesture belongs to the tool being put down. Carrying an
    // anchor across a tool change is how a chain commits into the next tool's
    // first tap -- and the beam's anchor is a second one of exactly the same
    // kind, so it goes the same way. Leaving it would let a beam started under
    // BEAM finish under COLUMN.
    drawStart = null;
    beamStart = null;
    canvas.style.cursor = next === RESTING_TOOL ? '' : 'crosshair';
    // The instrument strip is a third reader of the same fact, added by #398
    // against the boolean this replaced. It reads the register now like
    // everything else does.
    stripRefresh();
    toolListeners.forEach(fn => fn(next));
  };

  // A drawn endpoint snaps to an existing corner exactly as a dragged one
  // does, and for the same reason: landing ON a corner is what makes the join
  // mitre. Nothing is moving during a draw, so nothing is excluded.
  //
  // THE T-SQUARE GOES FIRST AND THE CORNER SNAP MAY ONLY SLIDE ALONG IT. A
  // snap that pulled the run off square would make the instrument a
  // suggestion, and an instrument a drafter cannot trust is worse than no
  // instrument.
  //
  // THIS COMMENT USED TO SAY THAT AND THE CODE DID NOT DO IT. It cited
  // "squareTo's second half"; squareTo has no second half, and cornerSnap was
  // an unrestricted nearest-vertex search. Measured in
  // proto/tsquare-snap-override.js: with the T-square lit, a bait corner
  // 0.06 ft off the axis and inside the 0.129 ft radius pulled the endpoint
  // onto itself -- (0,0) -> (4, 0.06) where squaring gives (4, 0). A comment
  // describing behaviour the code does not have is worse than no comment: it
  // is the reason nobody looked.
  // WHOLE FEET IN TOY, ON THE NUMBER THAT REACHES commitWall. §1 says that in
  // those words, and it is the whole of the difference between a constraint
  // and a display convention: rounding the readout would show 12'-0" over a
  // wall the file records as 12.037, and the drafter would find out later,
  // from a dimension string that disagrees with the plan it measures.
  //
  // MEASURED FROM THE START, NOT ROUNDED IN PLACE. The run's LENGTH is what
  // lands on the foot, so the far end moves to make it so; rounding the
  // endpoint's coordinates instead would give whole-foot positions and a
  // fractional length whenever the start was itself fractional -- which it is,
  // on any drawing that existed before TOY.
  //
  // AND IT ROUNDS AFTER THE SNAP, so a corner the snap legitimately reached is
  // not then nudged off it. A snap that lands on a real corner is the one case
  // where the foot gives way: the corner is where the geometry actually joins.
  // THE FOOT IS ROUNDED FOR TWO REASONS AND THE SWITCH REACHES ONE OF THEM.
  // Read this beside `squaring()` -- same shape, same reason. `||` is what
  // makes the leak impossible in both directions that matter:
  //
  //   TOY cannot be UNROUNDED by the light, because the board arm does not
  //   consult it. §3's gate carries "TOY LEAKS: every board goes through the
  //   constraint path"; a light that could unround TOY is that same defect
  //   wearing the other coat, and the order asks for a check on both.
  //
  //   DRAFTING is not rounded unless the drafter lit it. Off by default, and
  //   a drafter who has never touched it never finds his plan on the grid.
  //
  // AND IT ROUNDS DISTANCE ONLY. onTheFoot takes the run's LENGTH to the
  // nearest foot along the direction the hand gave it; it does not square.
  // The T-SQUARE is a different instrument and this is not a second one.
  const onTheFoot_if = () => board === 'toy' || footOn;

  const onTheFoot = (from, pt) => {
    if (!from) return pt;
    const dx = pt.x - from.x, dz = pt.z - from.z;
    // One of these is zero under the square, so this is the run's length.
    const len = Math.hypot(dx, dz);
    if (len < 1e-9) return pt;
    const feet = Math.max(1, Math.round(len));
    return { x: from.x + (dx / len) * feet, y: 0, z: from.z + (dz / len) * feet };
  };

  const drawPoint = at => {
    const wanted = squareTo(drawStart, at);
    const fixed = squaredAxis(drawStart, at);
    const snapped = fixed ? axisSnap(wanted, fixed) : cornerSnap(wanted, []);
    if (snapped) return snapped;
    const free = { x: wanted.x, y: 0, z: wanted.z };
    return onTheFoot_if() ? onTheFoot(drawStart, free) : free;
  };

  // AN UNFINISHED RUN REFUSES A NEW ONE, AND SAYS SO. Ruled 13 Sep, after I
  // reported the boundary rather than hardening it: starting a disconnected
  // run while the first had only two taps used to drop those taps silently.
  // Nothing was lost from a saved file -- a two-point run was never a shape
  // the reader keeps -- but the drafter's hand had done something the screen
  // forgot, which is the quiet half of every failure this board is arranged
  // against.
  //
  // REFUSED AT THE FIRST PRESS OF THE NEW RUN, before any wall is made. The
  // run is what is refused, so refusing it after committing its first wall
  // would be a half-application -- the same thing "Stay in TOY commits nothing
  // and changes nothing" forbids one section over.
  // PRESSING ON THE OPEN END RESUMES THE RUN, and this is what §2's refusal
  // was missing. §2 asks whether the press continues the pending run and
  // tested it with `sameSpot` at 1e-6 -- an EQUALITY test between two points
  // computed by different routes.
  //
  // They cannot match. TOY rounds a run's LENGTH, not its coordinates
  // (model-toy-board.spec.js:333 makes that a rule), so committing the first
  // wall moves its end up to half a foot from the pixel the drafter released
  // on. Press there again to carry on and the raw press is nowhere near the
  // stored end by 1e-6 -- often further than CORNER_SNAP_PX, so cornerSnap
  // does not rescue it either -- and §2 refused a run that was continuing.
  // The wall was silently not drawn, with only the strip to say why.
  //
  // So the question is asked the way every other "did the drafter hit this"
  // question on this page is asked: a grab radius, not an equality. And it
  // returns THE STORED END, so the run resumes exactly where it left off
  // rather than a snap-width away from itself.
  // ── §4: BREAKING THE BONE ────────────────────────────────────────────────
  //
  // Movie: "they will be allowed to 'BREAK the bone' every foot if they want
  // to by clicking on it". The order is explicit that the marks are a set to
  // choose from, not a bone pre-chopped into forty segments: "same result, one
  // decision at a time".
  //
  // THE MARK IS A DISTANCE ALONG THE RUN, NOT A ROUNDED COORDINATE, and that
  // is the rule I broke once already tonight. TOY rounds a run's LENGTH
  // (model-toy-board.spec.js:333), so a bone whose start sits at x = -10.4 has
  // its marks at -9.4, -8.4, ... Rounding the clicked point's x would put the
  // break at a whole number that is not a mark on this bone at all -- whole
  // POSITIONS and a fractional LENGTH, which is exactly backwards.
  const breakMarkOn = (wall, at) => {
    const rx = wall.end.x - wall.start.x, rz = wall.end.z - wall.start.z;
    const run = Math.hypot(rx, rz);
    if (run < 2) return null;              // no interior mark to break at
    const along = ((at.x - wall.start.x) * rx + (at.z - wall.start.z) * rz) / run;
    // CLAMPED OFF BOTH ENDS. A break AT a corner is not a break -- it would
    // make a zero-length half, and the format drops anything under 1e-6 on
    // load, so it would be a wall that vanishes on the next reload.
    // CLAMPED OFF BOTH ENDS, and the clamp IS the guard. A `feet <= 0 || feet
    // >= run` line sat here too and the gate showed it surviving: the clamp
    // already pins feet to [1, floor(run) - 1], so nothing could ever reach
    // it. A guard nothing can exercise is a claim about a case that does not
    // exist -- the same dead-guard shape as the already-angled skip in
    // wouldAngle, removed on the same evidence.
    const feet = Math.min(Math.max(Math.round(along), 1), Math.floor(run) - 1 || 1);
    return { x: wall.start.x + (rx / run) * feet, y: 0,
      z: wall.start.z + (rz / run) * feet };
  };

  // The bone gains the point BETWEEN the two corners it lies between, never
  // appended: an outline is an ordered ring, so a point on the end is a
  // different shape, not the same shape with a joint in it.
  const insertOnEdge = (o, a, b, pt) => {
    const same = (p, q) => Math.hypot(p.x - q.x, p.z - q.z) < 1e-6;
    const pts = o.points || [];
    for (let i = 0; i < pts.length; i += 1) {
      const j = (i + 1) % pts.length;
      if ((same(pts[i], a) && same(pts[j], b)) || (same(pts[i], b) && same(pts[j], a))) {
        pts.splice(i + 1, 0, { x: pt.x, y: 0, z: pt.z });
        return true;
      }
    }
    return false;
  };

  // A BREAK ON A MASTERED LEVEL CUTS THE MASTER, ruled 14 Sep: "yes break
  // master and all that area attached to it locked to it".
  //
  // I BUILT THIS BACKWARDS FIRST. The line here read `if (o.masterId)
  // continue` -- "a master's copy is not ours to cut" -- which is the opposite
  // of the ruling, and the order names exactly why it matters: THE FIRST HOUSE
  // DRAWN IS MASTER-DERIVED, so refusing the break on a mastered outline makes
  // the very first bone anyone wants to cut the one bone that will not cut. It
  // would have passed every check I had written, because all of them draw one
  // unmastered bone.
  //
  // So the master governs the break exactly as it governs a move -- one rule
  // for the master, not one for moving and another for cutting -- and every
  // level locked to it takes the same cut. The unlocked exit is §5a's and is
  // not invented here.
  // TAKES THE ORIGINAL ENDS, not a wall. The first version took the new tail
  // wall and read its `start` -- which is the break point, because breakBoneAt
  // has already moved it. So it searched every ring for an edge from the mark
  // to the far corner, an edge that does not exist yet, matched nothing, and
  // cut no bone at all. The five §4 checks all passed anyway: they assert the
  // WALLS, and the wall split was fine. Only 7a, which reads the rings, saw it.
  const boneGainsPoint = (a, b, pt) => {
    const all = drawing.outlines || [];
    const hit = all.find(o => insertOnEdge(o, a, b, pt));
    if (!hit) return false;
    if (!hit.masterId) return true;        // a purely local bone cuts alone
    // The master, then every OTHER level that follows it. The clicked level is
    // already cut, and the geometry is the master's, so each copy takes the
    // cut at the same place on the same edge rather than at a point computed
    // again per level.
    (drawing.boneyardOutlines || []).forEach(m => {
      if (m.id === hit.masterId) insertOnEdge(m, a, b, pt);
    });
    all.forEach(o => {
      if (o === hit || o.masterId !== hit.masterId) return;
      insertOnEdge(o, a, b, pt);
    });
    return true;
  };

  const breakBoneAt = (wall, pt) => {
    // CAPTURED BEFORE THE MUTATION, because the ring still describes the wall
    // as it was and that is the edge the break has to be placed on.
    const was = { a: { x: wall.start.x, z: wall.start.z },
      b: { x: wall.end.x, z: wall.end.z } };
    const mid = poolVertex(pt, wall.levelId, wall.view);
    const tail = { ...wall, id: newDrawingItemId('wall'), start: mid, end: wall.end };
    wall.end = mid;
    const at = (drawing.walls || []).indexOf(wall);
    drawing.walls.splice(at < 0 ? drawing.walls.length : at + 1, 0, tail);
    boneGainsPoint(was.a, was.b, pt);
    rebuildRoofs();                        // §5: the ring changed
    undoStack.push({ kind: 'add', wall: tail });
    markDirty();
    paint();
    return tail;
  };

  // ── §4's SECOND HALF: THE CONNECTOR ──────────────────────────────────────
  //
  // "After a break the two halves are independent bones and each obeys §3."
  // A joint alone does not deliver that. The halves of a broken run are
  // COLLINEAR and share a corner, so dragging one swings the other -- §3b
  // refuses it rather than produce a diagonal, which is safe and leaves the L
  // and the bump-out the order names as the POINT of §4 unreachable.
  //
  // What makes them reachable: the drag UNSHARES that corner. The dragged
  // wall takes its own vertex, the neighbour keeps the old one, and a
  // connector wall spans the two. As the drag proceeds the connector grows --
  // perpendicular to the wall being dragged, because the move is -- and that
  // connector IS the side of the bump-out. Nothing is left angled, so §3b has
  // nothing to refuse.
  //
  // ONLY FOR COLLINEAR NEIGHBOURS. A perpendicular neighbour just gets longer
  // and stays square, which is §3's whole behaviour on an ordinary house;
  // splitting corners there would drop a zero-length wall into the drawing on
  // every drag.
  //
  // ONCE, WHEN THE DRAG ARMS, not on every pointermove -- a connector per
  // mouse event would be several hundred walls across one gesture.
  const collinearWith = (wall, other) => {
    const rx = wall.end.x - wall.start.x, rz = wall.end.z - wall.start.z;
    const ox = other.end.x - other.start.x, oz = other.end.z - other.start.z;
    const a = Math.hypot(rx, rz), b = Math.hypot(ox, oz);
    if (a < 1e-9 || b < 1e-9) return false;
    return Math.abs((rx * oz - rz * ox) / (a * b)) < 1e-6;
  };

  const splitRunCorners = md => {
    if (board !== 'toy' || md.kind !== 'wall' || !md.body) return;
    const wall = md.body;
    md.before.forEach(b => {
      const v = b.vtx;
      const touching = (drawing.walls || [])
        .filter(w => w !== wall && (w.start === v || w.end === v));
      if (!touching.some(other => collinearWith(wall, other))) return;
      // A SEPARATE VERTEX AT THE SAME PLACE, and poolVertex must not be used:
      // mergeVertex merges by position and would hand back the very corner
      // being unshared. The pool's own rule allows this -- "two corners at the
      // same place are still two corners if the pool never merged them".
      const fresh = { x: v.x, y: 0, z: v.z,
        srcId: v.srcId ?? null, offX: v.offX ?? 0, offZ: v.offZ ?? 0 };
      vertexPool.push(fresh);
      if (wall.start === v) wall.start = fresh; else wall.end = fresh;
      b.vtx = fresh;
      const conn = { ...wall, id: newDrawingItemId('wall'), start: fresh, end: v };
      // Which neighbour this corner was shared WITH, so the constraint call
      // can be told it is no longer carried by the move.
      conn.detachedFrom = (touching.find(other => collinearWith(wall, other)) || {}).id;
      drawing.walls.push(conn);
      undoStack.push({ kind: 'add', wall: conn });
      md.connectors = (md.connectors || []).concat(conn);
    });
    if (md.connectors) markDirty();
  };

  // ── §5: A ROOF OVER WHATEVER NOTHING SITS ON ─────────────────────────────
  //
  // Movie, 14 Sep: a roof belongs to "every part of a floor that nothing sits
  // on" -- so it is a FUNCTION of the difference between one storey's
  // footprint and the one above it, recomputed when either bone moves, not a
  // thing attached to the top storey. A ranch is the degenerate case.
  //
  // THE GEOMETRY IS geometry-2d.js's, not a second opinion. uncoveredRegions
  // does the rectilinear difference and returns rectangles, because a storey
  // set back on all sides leaves a RING and the format's roof has `points`
  // with no holes.
  //
  // WHICH ROOFS ARE OURS: `sourceShapeId`, which the format already carries
  // (drawing-format.js:490) and which means "where this came from". A roof
  // built from a bone names that bone; a roof a drafter drew names nothing and
  // is NEVER touched here. No new field, and no guessing.
  const storeyAbove = levelId => {
    const here = (drawing.levels || []).find(l => Number(l.id) === Number(levelId));
    if (!here) return null;
    return (drawing.levels || [])
      .filter(l => (Number(l.elev) || 0) > (Number(here.elev) || 0))
      .sort((a, b) => (Number(a.elev) || 0) - (Number(b.elev) || 0))[0] || null;
  };

  const boneOf = levelId => (drawing.outlines || [])
    .find(o => Number(o.levelId) === Number(levelId)) || null;

  // The edge that dies into the storey above is a GABLE -- ruled 14 Sep, "the
  // roof should terminate where it meets the upper storey wall like a garage
  // roof that is dropped". A gable end is vertical and carries no eave
  // overhang, which is the property that matters: an eave there would hang two
  // feet of roof straight into the house above.
  //
  // The format has no third kind -- an edge is `gable` if it says so and
  // `eave` otherwise -- so this needs no format change and no older reader
  // sees anything it cannot read.
  const edgeKinds = (ring, upper) => {
    if (!upper) return ring.map(() => 'eave');
    const onUpper = pt => (upper.points || []).some((a, i) => {
      const b = upper.points[(i + 1) % upper.points.length];
      const cross = (b.x - a.x) * (pt.z - a.z) - (b.z - a.z) * (pt.x - a.x);
      const len = Math.hypot(b.x - a.x, b.z - a.z);
      if (len < 1e-9 || Math.abs(cross) / len > 1e-6) return false;
      const t = ((pt.x - a.x) * (b.x - a.x) + (pt.z - a.z) * (b.z - a.z)) / (len * len);
      return t >= -1e-6 && t <= 1 + 1e-6;
    });
    return ring.map((pt, i) => {
      const next = ring[(i + 1) % ring.length];
      return onUpper(pt) && onUpper(next) ? 'gable' : 'eave';
    });
  };

  // THE BONE FOLLOWS THE DRAG, and until §5 it did not.
  //
  // §2 is explicit: "a level's bone drives that level's FLOOR and WALL nodes"
  // and "the bone is not a separate drawing that happens to look like the
  // plan". But §3's drag moves wall VERTICES and nothing else, so every TOY
  // drag left the outline behind as a stale snapshot of where the house used
  // to be. Invisible on screen -- the walls are what paints -- and invisible
  // to every §3 check, which all read walls.
  //
  // §5 is what made it bite: roofs derive from the bone, so a bone that never
  // moved produced a roof over the old footprint. The drag moved the wall a
  // foot and the roof stayed where it was.
  //
  // By the ORIGINAL position, not by identity: an outline point is a plain
  // record, not the pooled vertex object the wall holds, so the two are only
  // ever connected by where they sit.
  //
  // ON THIS LEVEL ONLY. The first version walked every outline in the drawing
  // and moved any point sitting at the dragged corner -- so dragging the main
  // floor's wall silently reshaped the SECOND FLOOR's bone, because storeys
  // stacked on the same footprint have points at identical coordinates. A
  // §5 check caught it: the storey above followed the floor below and the
  // roof between them never changed. Matching by position is right; matching
  // by position across levels is not.
  const boneFollows = (before, levelId) => {
    const rings = (drawing.outlines || [])
      .filter(o => Number(o.levelId) === Number(levelId));
    before.forEach(b => {
      if (b.x === b.vtx.x && b.z === b.vtx.z) return;
      rings.forEach(ring => (ring.points || []).forEach(pt => {
        if (Math.hypot(pt.x - b.x, pt.z - b.z) > 1e-6) return;
        pt.x = b.vtx.x;
        pt.z = b.vtx.z;
      }));
    });
  };

  const rebuildRoofs = () => {
    const G = window.DraftGeometry2D;
    if (!G || !G.uncoveredRegions) return;
    const mine = new Set();
    (drawing.levels || []).forEach(level => {
      const bone = boneOf(level.id);
      if (!bone) return;
      mine.add(String(bone.id));
      const above = storeyAbove(level.id);
      const cover = above ? boneOf(above.id) : null;
      const regions = G.uncoveredRegions(bone.points || [], cover ? cover.points : null);
      // DROP THIS BONE'S OLD ROOFS FIRST, so a storey pushed back out takes
      // its roof away with it rather than leaving the old one behind. "A roof
      // appears" is satisfied by an implementation that only ever adds.
      drawing.roofs = (drawing.roofs || [])
        .filter(r => String(r.sourceShapeId || '') !== String(bone.id));
      regions.forEach(ring => {
        drawing.roofs.push({
          id: newDrawingItemId('roof'),
          points: ring.map(pt => ({ x: pt.x, y: 0, z: pt.z })),
          levelId: Number(level.id),
          sourceLevelId: above ? Number(above.id) : null,
          sourceShapeId: String(bone.id),
          edges: edgeKinds(ring, cover),
          // THE FORMAT'S OWN DEFAULTS, written out rather than left implicit:
          // pitch 4 is the 4/12 that was ruled, overhang 2 is what a roof
          // reads back as anyway (drawing-format.js:493-494).
          overhang: 2,
          pitch: 4,
          garage: false,
        });
      });
    });
    markDirty();
  };

  const boneChoice = document.getElementById('bone-choice');
  let boneChoiceFor = null;
  const closeBoneChoice = () => { boneChoiceFor = null; boneChoice.hidden = true; };
  const offerBoneChoice = (wall, at) => {
    const pt = breakMarkOn(wall, at);
    if (!pt) { sayOnStrip('this wall is too short to break'); return; }
    boneChoiceFor = { wall, pt };
    boneChoice.hidden = false;
    boneChoice.querySelector('[data-break-here]').focus();
  };
  boneChoice.querySelector('[data-break-here]').addEventListener('click', () => {
    const pick = boneChoiceFor;
    closeBoneChoice();
    if (pick) breakBoneAt(pick.wall, pick.pt);
  });
  // NOTHING AT ALL, the same contract as Stay in TOY: the drag already moves
  // the wall, so this button's whole job is to leave without changing
  // anything. A choice that always did something would not be a choice.
  boneChoice.querySelector('[data-break-move]').addEventListener('click', closeBoneChoice);

  const toyOpenEnd = at => {
    if (board !== 'toy' || !pendingBone) return null;
    const open = pendingBone.points[pendingBone.points.length - 1];
    if (!open) return null;
    const reach = CORNER_GRAB_PX / view.scale;
    return Math.hypot(at.x - open.x, at.z - open.z) <= reach
      ? { x: open.x, y: 0, z: open.z }
      : null;
  };

  const toyRunRefused = at => {
    if (board !== 'toy' || !pendingBone) return false;
    if (endsAt(pendingBone, at)) return false;      // this press continues it
    // NAMES BOTH WAYS OUT, because the order's wording does: "finish or cancel
    // the run you started". Escape is the cancel.
    sayOnStrip('finish or cancel the run you started — Esc cancels');
    return true;
  };

  const drawPress = at => {
    if (!drawStart) {
      // Resume before refusing: a press on the open end is the drafter
      // carrying on, which is the one case the refusal must not catch.
      const open = toyOpenEnd(at);
      if (open) { clearNotice(); drawStart = open; paint(); return; }
      if (toyRunRefused(drawPoint(at))) return;
      clearNotice();
      drawStart = drawPoint(at); paint(); return;
    }
    clearNotice();
    const end = drawPoint(at);
    // A wall of no length is not a wall — the format drops anything under
    // 1e-6 on load, so committing one would write a record that vanishes on
    // the next open. Treat the second tap as a correction, not a commit.
    if (Math.hypot(end.x - drawStart.x, end.z - drawStart.z) < 0.001) { drawStart = end; paint(); return; }
    // WEARING WHAT THE BRUSH IS HOLDING, if it is holding a wall. Movie, 20
    // Sep: "if they change to WALL command and start drawing a wall those
    // 'selected' drafting brush properties will remain". Passed in HERE and
    // at the two typed-commit sites below rather than read inside commitWall,
    // because that function is also how a premade house and an ordered garage
    // raise their walls -- a loaded brush must not change what the bone
    // builds. Empty brush, empty options, and the drafter's stored defaults
    // answer exactly as they did.
    const wall = commitWall(drawStart, end, brushOptions('wall'));
    // CHAINING, the old page's habit: the next wall starts where this one
    // ended, so a room is four taps and not eight. The pooled END object is
    // the start, so the corner is shared by identity.
    drawStart = wall.end;
    setSelection([{ type: 'wall', item: wall }]);
    stripRefresh();
    paint();
  };

  // ── THE OUTLINE TOOL ─────────────────────────────────────────────────────
  //
  // PARITY-model-html-vs-dc.md has carried "Draw an outline — absent,
  // must-have" since #389, and the reason is written at :3866: the old page's
  // _pressBuildType does TWO things, records the type and arms the outline
  // tool, and only the first half came across because there was no tool to
  // arm. This is the second half.
  //
  // THE GESTURE IS drawPress's SIBLING, not a new idea: successive presses
  // drop corners, and pressing the first corner again closes the loop. No
  // Enter and no FINISH button, because that is the old page's contract and a
  // tool that needs a keyboard is not one an iPad at the counter can use.
  //
  // WHAT IT PERSISTS IS THE OLD PAGE'S SHAPE, through outline-master.js rather
  // than a second copy of it: a master on the BONEYARD shelf holding the
  // common geometry, and a copy on every level linked back corner by corner.
  // This page still shows no BONEYARD -- that absence is settled -- and writes
  // the master anyway, sight unseen, because BUILD HOUSE reads outlines and
  // the drawing is shared with a page that does show it.
  let outlineCorners = [];
  // WHICH BUILD FAMILY ARMED THE TRACE, kept for the colour: the order's rule
  // 4 is that a house outline draws in the build-bar family's colour, "red
  // house / blue split".
  let outlineFamily = null;
  // The floor being traced, corner by corner. A SEPARATE LIST from the
  // outline's on purpose: the two tools draw the same SHAPE and mean entirely
  // different things -- an outline is a guide that never prints, a floor is
  // structure -- and one shared array would let an abandoned trace of either
  // finish as the other.
  let floorCorners = [];

  // THE FAMILY COLOURS, and what each one is answerable to.
  //
  // BUNGALOW is the old page's house trace EXACTLY -- #c0392b is
  // MODEL.dc.html's own `traceHouse` (:8276), not a red picked to match it.
  //
  // BILEVEL is the "blue split" half of the order and it has NO counterpart on
  // the old page: a bilevel trace there is house red like every other, and the
  // SPLIT button that stood in that strip before the build menu never drew
  // anything -- _pressSplitLevel was a stub that said "coming soon". So this
  // is a colour the rung INTRODUCES rather than one it carries across, and it
  // is the page's existing trace blue rather than a seventh hex. That blue is
  // also the ATTACHED garage run's on the old page. The two cannot collide
  // today, because garage runs are not on this page at all; whoever lands them
  // owns telling them apart, and this note is the warning rather than a
  // surprise waiting in the palette.
  //
  // THE GARAGE FAMILY IS ABSENT ON PURPOSE -- see armOutline, which refuses it
  // rather than colouring it.
  const OUTLINE_TRACE_COLORS = Object.freeze({
    bungalow: '#c0392b',
    bilevel: '#3f7fd6',
  });
  // The colour the PAINTER is handed for a house trace. Falls back to the
  // house red rather than throwing: a family the map has not heard of is a
  // menu that grew, and a trace drawn in the ordinary house colour is a far
  // better answer to that than a trace that does not draw.
  const outlineTraceColor = () =>
    OUTLINE_TRACE_COLORS[outlineFamily?.id] || OUTLINE_TRACE_COLORS.bungalow;

  // HOW NEAR COUNTS AS CLOSING. In FEET rather than pixels, so the same press
  // closes the same loop whatever the zoom: a pixel tolerance would demand
  // surgical aim zoomed out and would swallow a deliberate second corner
  // zoomed in.
  const OUTLINE_CLOSE_FT = 1.5;

  // IS THIS A GARAGE ORDER? Asked in ONE place because two copies of it is
  // how the trace and the bone come to disagree about the same tile -- and
  // they answer opposite questions from the same test, so a copy that drifted
  // would arm a house trace for a garage at one end and refuse to build it at
  // the other.
  const isGarageChoice = picked =>
    picked?.family?.id === 'detachedGarage' || Boolean(picked?.entry?.foundation);

  // WHAT THE DRAFTER PRESSES NEXT, in the words of the thing he picked. One
  // sentence, said from both ways in -- the tile arms the trace, and the
  // bone takes the sign down over the top of it -- so the page cannot tell
  // him two different things about one gesture.
  const sayTraceThe = picked => sayOnStrip(
    `Trace your ${picked?.entry?.label || 'house'} — press each corner, then the `
    + 'first corner again to close.');

  const armOutline = picked => {
    // A DETACHED GARAGE PRESS IS NOT A HOUSE TRACE, and answering it with one
    // is worse than answering it with nothing. The old page sends those
    // entries to _toggleGarageMode('detached') with the foundation they
    // pre-answered (MODEL.dc.html:14339); garages are not traced on this page,
    // so arming the house trace here would take a garage press and persist a
    // master carrying `garage: false` -- a wrong drawing rather than a missing
    // feature, and one nothing downstream can tell from a house the drafter
    // meant to draw.
    //
    // AND IT NO LONGER SAYS THEY ARE NOT ON THIS PAGE, because they are:
    // buildOrderedGarage (:7085) sets one on the lot off the sign's bone. The
    // old sentence was written before that landed and it cost Movie a bug
    // report -- he read "not on this page yet", believed the page, and only
    // found the working gesture by pressing the bone anyway. A refusal that
    // is out of date is worse than no refusal: it argues the drafter out of
    // something that works.
    if (isGarageChoice(picked)) {
      sayOnStrip('Pick a size, then press the bone — I’ll set the garage on the lot.');
      return;
    }
    // THROUGH THE REGISTER, NOT AROUND IT. This line was `activeTool =
    // 'outline'` and had to be: outline was not in the roster at all, so
    // setTool would have found it unavailable on every board and put SELECT on
    // instead. Now that it is a tool, arming it any other way would make the
    // board a look rather than a rule -- the exact thing setTool's own comment
    // is about -- and would leave the strip and the key faces reading a tool
    // the page is not actually holding.
    //
    // THE ORDER MATTERS. setTool fires the listeners, and the one below clears
    // the pending corners and the family for whatever is being armed; the
    // choice's own family and its named sentence land after, on top.
    //
    // PUTTING THE OLD LINE BACK WAS TRIED AS A MUTATION AND SURVIVED, which is
    // worth writing down rather than leaving as a caught row nobody checked.
    // `activeTool = 'outline'` plus by-hand copies of the two clears setTool
    // does is behaviourally identical to this for everything today's two
    // boards can express. What it does NOT copy is `beamStart` -- a drafter
    // who anchored a beam and then picked a house type would keep that anchor,
    // which is the chain-commits-into-the-next-tool defect setTool's comment
    // describes -- and the board's refusal, which neither board can currently
    // demonstrate because both offer outline. So the register is the right
    // door for reasons no check here can fail on; that is the reason, not a
    // measurement, and it is labelled as such.
    setTool('outline');
    outlineFamily = picked?.family ?? null;
    sayTraceThe(picked);
    paint();
  };

  // PUTTING THE TRACE DOWN IS PART OF PUTTING THE TOOL DOWN. setTool clears
  // the wall's anchor and the beam's for the reason its comment gives -- a
  // half-finished gesture belongs to the tool being put down, and an anchor
  // carried across is how a chain commits into the next tool's first tap. The
  // outline's pending corners are a third one of exactly that kind, and they
  // were the one nothing cleared: switch to SELECT mid-house, come back, and
  // the next press continued a loop the drafter had walked away from.
  //
  // They are cleared HERE rather than inside setTool because setTool is a
  // const several hundred lines above these `let`s and runs once at load --
  // naming them from inside it would be a temporal dead zone waiting for the
  // first drafter who armed a tool early.
  toolListeners.push(next => {
    outlineCorners = [];
    floorCorners = [];
    outlineFamily = null;
    // ARMED FROM THE KEY, which carries no house type with it -- so the trace
    // is the plain house red that outlineTraceColor falls back to, and the
    // sentence is the one without a name in it. A house-type press says the
    // named version immediately after this, over the top.
    if (next === 'outline') sayTraceThe(null);
  });

  const outlinePress = at => {
    const here = { x: at.x, z: at.z };
    // THREE CORNERS BEFORE CLOSING IS LEGAL, because two enclose no floor --
    // the same floor the old page's own guard is about. Below three, a press
    // near the first corner is a drafter placing a corner there, not closing.
    if (outlineCorners.length >= 3) {
      const first = outlineCorners[0];
      if (Math.hypot(here.x - first.x, here.z - first.z) <= OUTLINE_CLOSE_FT) {
        commitOutline();
        return;
      }
    }
    outlineCorners.push(here);
    paint();
  };

  const commitOutline = () => {
    const loop = outlineCorners.slice();
    if (loop.length < 3) return null;
    // A CROSSED LOOP ENCLOSES NO FLOOR, and the old page refuses it at
    // MODEL.dc.html's own close with the same test from the same module. The
    // pending corners are KEPT on a refusal so the drafter can move the last
    // one rather than retrace the whole house.
    if (window.DraftGeometry2D.selfIntersects(loop)) {
      sayOnStrip('That outline crosses itself, so it encloses no floor area.');
      return null;
    }
    const OM = window.DraftOutlineMaster;
    const spec = OM.masterFromLoop({
      points: loop,
      shelfId: activeShelfId(),
      sourceLevelId: activeLevelId(),
      newItemId: () => newDrawingItemId('outline'),
      newPointId: () => newDrawingItemId('op'),
    });
    // THE FILE'S SPELLING, AT THE MOMENT OF WRITING. This page has no
    // serializer between the push and the file (see commitWall's note on
    // 'centre'), and storage spells a master point's id `id` while
    // MODEL.dc.html holds `pointId`. Writing the memory spelling would produce
    // a master whose points have no id at all once the old page loads it --
    // and it would look perfect until a corner was dragged.
    const master = OM.storageMaster(spec);
    const levels = (drawing.levels || []);
    const copies = OM.copiesForLevels(master, levels, {
      newItemId: () => newDrawingItemId('outline'),
    });
    if (!Array.isArray(drawing.boneyardOutlines)) drawing.boneyardOutlines = [];
    if (!Array.isArray(drawing.outlines)) drawing.outlines = [];
    drawing.boneyardOutlines.push(master);
    copies.forEach(copy => drawing.outlines.push(copy));
    // WHAT THE BONE WILL BUILD, remembered as it is drawn. See outlineToBuild:
    // the copy on the level the drafter is standing on, because that is the
    // loop he just walked.
    tracedOutline = copies.find(copy =>
      Number(copy.levelId) === Number(activeLevelId())) || null;
    undoStack.push({ kind: 'add-outline', master, copies });
    outlineCorners = [];
    activeTool = RESTING_TOOL;
    markDirty();
    stripRefresh();
    paint();
    return master;
  };

  // ── THE BONE BUILDS WHAT THE DRAFTER DREW ────────────────────────────────
  //
  // Movie, 18 Sep: "when they draw the U outline, they should still press the
  // BONE or blue house to cause the house to be created". The seam for it was
  // declared with the build bar (:4174, onBuild -- "build what the drafter
  // drew, his own outline") and NOTHING HAS EVER REGISTERED ON IT. The foot
  // bone fired into an empty list: a drafter traced his house, pressed the
  // bone, and the page called the drive-thru up over his loop.
  //
  // ALREADY BUILT IS DERIVED, NOT STORED. A `built: true` on the outline would
  // be a new key in the file for both pages to agree about, and the answer is
  // already in the drawing: a loop whose first edge has a wall running along
  // it has been built. Same rule as the cut id -- the old page writes
  // nextCutId and then refuses to trust it on load, so this page derives.
  //
  // THE FIRST EDGE IS ENOUGH and the whole ring would be worse. A drafter who
  // deletes one wall of a built house and presses the bone again means "put my
  // house back"; a ring test would call that unbuilt and lay a second wall
  // along every edge that survived.
  const NEAR_FT = 0.05;
  const samePoint = (a, b) => a && b && Math.hypot(a.x - b.x, a.z - b.z) < NEAR_FT;

  const outlineIsBuilt = (outline, levelId) => {
    const points = outline?.points || [];
    if (points.length < 2) return false;
    const [a, b] = points;
    return (drawing.walls || []).some(wall => Number(wall.levelId) === Number(levelId)
      && ((samePoint(wall.start, a) && samePoint(wall.end, b))
        || (samePoint(wall.start, b) && samePoint(wall.end, a))));
  };

  // THE LOOP THIS PAGE JUST TRACED, and only that one.
  //
  // THE FIRST VERSION TOOK ANY UNBUILT HOUSE OUTLINE ON THE LEVEL, and that is
  // too greedy by a long way: a drawing loaded from a file can carry outlines
  // whose walls were never made -- the repro fixture in
  // model-drivethru.spec.js carries five -- and the bone would then raise
  // walls round a loop the drafter had never drawn and was not asking about.
  // It also swallowed Movie's own rule for the empty press (15 Sep): "take
  // them to the full house flow if there isn't a house and detached garage
  // already ... it will do nothing once both house and garage both made". A
  // build that fires on a drawing which already has houses is not nothing.
  // model-drivethru.spec.js:477 is what caught it.
  //
  // So the bone answers a GESTURE, not a search: commitOutline records the
  // loop as it is drawn and this hands back that one, still unbuilt, still in
  // the drawing. An undo splices it out, and the test below it fails -- which
  // is the behaviour a drafter would expect from taking his trace back.
  let tracedOutline = null;

  const outlineToBuild = () => {
    const { levelId } = onActiveLevel();
    const outline = tracedOutline;
    if (!outline) return null;
    if (!(drawing?.outlines || []).includes(outline)) return null;
    if (Number(outline.levelId) !== Number(levelId)) return null;
    if ((outline.points || []).length < 3) return null;
    return outlineIsBuilt(outline, levelId) ? null : outline;
  };

  const buildFromDrawnOutline = () => {
    if (!drawing) return null;
    const outline = outlineToBuild();
    if (!outline) return null;
    const BH = window.DraftBuildHouse;
    const points = outline.points.map(point => ({ x: point.x, z: point.z }));
    // THE OUTLINE DECIDES WHICH SIDE THE BODY SITS ON, through the module the
    // old page builds with rather than a second copy of the winding test.
    const refLine = BH.outlineInteriorRef(points);
    const runs = BH.houseWallRuns(points);
    if (!runs.length) return null;
    // ONE GESTURE, ONE UNDO. The runs' own 'add' steps are dropped for the
    // single 'built' one, exactly as the ordered garage drops its four: left
    // in, the first Ctrl+Z would take the whole house and the next several
    // would each hunt a wall that was already gone.
    const mark = undoStack.length;
    const walls = runs.map(run => commitWall(run.start, run.end,
      { bone: false, refLine }));
    undoStack.length = mark;
    // `outline: null` -- the loop is the DRAFTER'S and it stays. See the
    // 'built' branch in undo, which now asks before it splices.
    undoStack.push({ kind: 'built', walls, outlines: [], list: null });
    sayOnStrip(`House built — ${walls.length} walls off your outline.`);
    markDirty();
    buildChrome();
    paint();
    return walls;
  };

  // THE SEAM'S FIRST LISTENER. It says buildServed when the house went up,
  // which is how the press learns it has been answered -- see fireBuild.
  window.ModelBuild.onBuild(() => {
    if (buildFromDrawnOutline()) window.ModelBuild.buildServed();
  });

  // ── THE FLOOR TOOL: a closed loop, and what it saves as ──────────────────
  //
  // The parity row read "Draw a floor -- absent, must-have: it paints floors it
  // cannot create", which is this page's recurring shape: the painter arrived
  // with tier 1 and the gesture did not.
  //
  // THE SAME GESTURE AS THE OUTLINE, deliberately -- press corners, close on
  // the first. That is MODEL.dc.html's floor gesture too
  // (_handleFloorClick:11572), so a drafter who has learnt one has learnt
  // both. What is NOT shared is the state; see floorCorners.
  //
  // OUT OF SCOPE AND ABSENT RATHER THAN HALF-DONE: the typed-length ruler, arc
  // edges, the slope and thickened-edge properties, and the FLOOR JOISTS box.
  // Each is a panel of its own and none of them is the gesture.
  const floorPress = at => {
    const here = { x: at.x, z: at.z };
    // THREE CORNERS BEFORE CLOSING IS LEGAL and two is not, for the reason the
    // outline's own guard gives: two enclose no area. Below three, a press near
    // the first corner is a drafter putting a corner there.
    if (floorCorners.length >= 3) {
      const first = floorCorners[0];
      if (Math.hypot(here.x - first.x, here.z - first.z) <= OUTLINE_CLOSE_FT) {
        commitFloor();
        return;
      }
    }
    floorCorners.push(here);
    paint();
  };

  // WHAT A FLOOR RECORD IS, in one place. The gesture below and the premade
  // build both make one, and a second copy of these seven fields is how a
  // drawn floor and a built one come to disagree about what a floor IS.
  //
  // A CONCRETE SLAB IS AS THICK AS ITS LEVEL POURS; a framed floor is its
  // assembly's own depth. Both are MODEL.dc.html:11641's rule read from the
  // modules it reads them from -- this page has no floor-thickness setting of
  // its own, and inventing one here would be a third number for a thing that
  // has just stopped having three. assemblyFor IS this page's one
  // level-assembly lookup, and its own comment says why there is exactly one.
  const floorRecord = (loop, levelId, homeView, { garage = false } = {}) => {
    const LA = window.DraftLevelAssembly;
    const slab = homeView === 'foundation';
    return {
      id: newDrawingItemId('floor'),
      points: loop.map(point => ({ x: point.x, y: 0, z: point.z })),
      levelId,
      view: homeView,
      structure: slab ? 'slab' : 'floor',
      garage,
      slopeInPerFt: 0,
      thickness: slab
        ? assemblyFor(levelId).slabThicknessIn / 12
        : LA.DEFAULT_FLOOR_THICKNESS_IN / 12,
      thickenedEdge: false,
      assembly: { ...LA.DEFAULT_FLOOR_ASSEMBLY },
    };
  };

  const commitFloor = () => {
    const loop = floorCorners.slice();
    if (loop.length < 3) return null;
    // A CROSSED LOOP ENCLOSES NO AREA -- the same refusal the outline makes
    // on this page, through the same module. The pending corners are KEPT on a
    // refusal so the drafter can move the last one rather than retrace the room.
    //
    // AND THIS IS AN ADDITION, NOT PARITY, which is worth saying plainly: the
    // old page's _finishFloor checks the corner COUNT and nothing else, so a
    // bowtie drawn there commits and renders as two triangles with a fill that
    // fights itself. The outline tool here already refuses one, and a page
    // where the same gesture is legal for a guide and illegal for structure
    // would be teaching two rules for one motion.
    if (window.DraftGeometry2D.selfIntersects(loop)) {
      sayOnStrip('That floor crosses itself, so it encloses no area.');
      return null;
    }
    const LV = window.DraftLayerViews;
    const LA = window.DraftLevelAssembly;
    const { levelId, viewId } = onActiveLevel();
    // WHERE IT SAVES IS NOT WHERE IT WAS DRAWN, and layer-views.js owns that
    // rule. The surprising half is the second clause: a level that HAS a
    // foundation set puts its floor there whichever set the drafter was
    // looking at, because such a level's floor IS its foundation.
    const homeView = LV.floorHomeView(viewId, levelId);
    const slab = homeView === 'foundation';
    const floor = floorRecord(loop, levelId, homeView);
    if (!Array.isArray(drawing.floors)) drawing.floors = [];
    drawing.floors.push(floor);
    undoStack.push({ kind: 'add-item', list: drawing.floors, item: floor });
    floorCorners = [];
    setTool(RESTING_TOOL);
    // THE MESSAGE HAS TO SAY WHERE IT WENT WHEN IT WENT SOMEWHERE ELSE.
    // floorHomeView's second clause files a floor drawn on FOUNDATION's WALLS
    // plan onto the FOUNDATION set, which is right -- and from the drafter's
    // seat it means the slab they just closed is nowhere on the sheet in front
    // of them. The old page softens that with a courtesy set (_courtesyFloorIds)
    // that keeps such a floor on screen until the layer set changes; this page
    // has no courtesy set and is not being given one on this rung, so it OWES
    // the drafter the sentence instead. A silent vanish is the one outcome
    // that reads as the tool having failed.
    const homeLabel = (LV.layerViewsForLevelId(levelId)
      .find(view => view.id === homeView) || {}).label || homeView;
    sayOnStrip(homeView === viewId
      ? (slab ? 'Slab drawn — it saves to S-SLAB.' : 'Floor drawn.')
      : `${slab ? 'Slab' : 'Floor'} drawn — it belongs to ${homeLabel}, `
        + 'so it is not on this layer set.');
    markDirty();
    paint();
    return floor;
  };

  // ── PLACING A WINDOW OR A DOOR ───────────────────────────────────────────
  //
  // Movie, 18 Sep, asking for the bungalow's openings: "please windows and
  // doors into the bungalow and i'll change them if i need to afterwards".
  // The design's eleven arrived that day and this page had no way to change
  // them -- no gesture to add one, move one or take one out. This is the first
  // of the three.
  //
  // ONE PRESS ON A WALL, which is the old page's own gesture
  // (_handleFenestrationClick:15180) and the only one a finger can make
  // without a keyboard. The press picks the nearest wall within reach and the
  // opening lands centred on the point pressed, then slides to fit.
  //
  // THE TOOL STAYS ARMED. A house has a dozen windows and resting after each
  // would cost a trip to the tool column between every one -- the old page
  // stays armed for the same reason. This is the opposite choice from FLOOR
  // and OUTLINE, and the difference is that those two gestures END: a closed
  // loop is finished, an opening is one press and the next press is the next
  // window.
  //
  // OUT OF SCOPE HERE AND EACH ITS OWN THING, exactly as the old page's
  // handler splits them: stair openings (its `stairs` type), boneyard marks on
  // a master outline, and shaped holes cut into a floor or a roof.
  const FENESTRATION_PICK_PX = 18;   // MODEL.dc.html:2198's own pick distance

  // DOOR FIRST, because the old page's state opens on 'door' (:2912) and a
  // drafter switching pages should not find the tool set to something else.
  let fenestrationType = 'door';
  // WHICH CASEMENT THE NEXT WINDOW WILL BE. Movie, 22 Sep: *"the first one
  // SINGLE CASEMENT, this one DOUBLE CASEMENT"*. A door has none, so this is
  // read only while a window is the thing being placed.
  let fenestrationCasement = 'single';
  let openingPanelUp = false;

  // ── WHAT THE NEXT OPENING WILL MEASURE ──────────────────────────────────
  //
  // A WIDTH PER TYPE, one sill, one head -- the old page's own shape
  // (:2925-2930). A door and a window are different sizes of thing, and a
