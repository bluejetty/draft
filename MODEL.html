  const deleteEntry = entry => {
    if (!entry || !drawing) return false;
    if (entry.type === 'wall') return !!deleteWall(entry.item);
    const key = SELECTION_LISTS[entry.type];
    const list = key ? drawing[key] : null;
    if (!Array.isArray(list)) return false;
    const index = list.indexOf(entry.item);
    if (index < 0) return false;
    list.splice(index, 1);
    undoStack.push({ kind: 'remove-item', list, index, item: entry.item });
    markDirty();
    return true;
  };

  // A COPY OF THE SELECTION FIRST. deleteWall calls setSelection, which
  // rebuilds the array being walked; iterating the live one deletes every
  // second thing and reports success.
  const deleteSelection = () => {
    if (!drawing || !selection.length) return 0;
    const doomed = selection.slice();
    let gone = 0;
    doomed.forEach(entry => { if (deleteEntry(entry)) gone += 1; });
    if (!gone) return 0;
    setSelection(selection.filter(entry => !doomed.includes(entry)));
    return gone;
  };

  // ── the draw gesture ──────────────────────────────────────────────────────
  // TWO PRESSES, one wall. The first sets a start and the second commits, so
  // the gesture works with a finger, a pen or a mouse without a drag — the old
  // page's wall tool is press-press too (its chain committer is the same shape
  // repeated).
  //
  // ARMED IS A MODE, and it is visible: the WALL key in the tool column
  // carries the accent while the next tap will draw. A mode nobody can see is
  // how a drafter loses a pan and gets a wall.
  //
  // DRAW WALL, THE BUTTON, IS GONE (§7). It was the chrome bar's own arming
  // control and the tool column's WALL key was the second one; two buttons
  // for one register is the drift this pass exists to end, and the key is the
  // survivor because the other sixteen tools are already only there.
  const deleteButton = document.getElementById('delete');

  // WHAT COUNTS AS A MODAL. Each of these covers the whole viewport at
  // z-index 7 and asks a question that has to be answered first; the foot
  // strip sits at 6, under all of them. The drive-thru sign is not built and
  // will be the fifth entry in this list rather than a new mechanism.
  const MODAL_IDS = ['promote', 'bone-choice', 'file-guard', 'save-as'];
  const modalUp = () => MODAL_IDS.some(id => {
    const node = document.getElementById(id);
    return !!node && !node.hidden;
  });

  // ONE DELETE PRESS, whichever control did the pressing. The button and the
  // two keys were separate implementations of the same sentence and only one
  // of them was ever taught anything new.
  const pressDelete = () => {
    if (activeCut() || modalUp()) return 0;
    const gone = deleteSelection();
    if (gone) paint();
    return gone;
  };
  // ── the tool register ─────────────────────────────────────────────────────
  // ONE VARIABLE HOLDS WHICH TOOL IS ARMED, and it holds a tool id, never a
  // boolean. This was `let drawArmed = false` — correct while WALL was the only
  // tool on the page, and the wrong shape the moment a second one exists. A
  // seventeen-key column hung off its own state beside a live boolean gives the
  // page two ideas of what is armed; a drafter would then press SELECT, see the
  // column agree, and still commit a wall on the next tap, because the boolean
  // never heard about it. That is the same two-sources-of-truth failure this
  // page's own shell comment warns about for the active level, one panel over.
  //
  // SELECT IS THE RESTING TOOL, not "nothing armed". The old page has no
  // no-tool state (its Select is `standardTool('Select', …)`, one of the four),
  // and a column with no key lit looks exactly like a column that stopped
  // working. Pressing the armed key puts it back to select.
  //
  // WHAT THIS DOES NOT DO: it does not know how any tool behaves. Every gesture
  // still reads the register and decides for itself; the register only says
  // which one gets the press.
  const RESTING_TOOL = 'select';
  let activeTool = RESTING_TOOL;
  let drawStart = null;
  // Where the wall gesture's pointer went down, and whether that press opened
  // the run. Read by the pointerup that places the line; see its comment.
  let wallPress = null;
  const toolListeners = [];
  // THE BOARD'S LISTENERS ARE DECLARED HERE, beside the tool's, for one dull
  // reason: `applyBoard` runs at load and the tool column builder is a `const`
  // defined several hundred lines further down, so applyBoard cannot name it
  // without landing in its temporal dead zone. An array declared up here can
  // be filled in later and fired from anywhere.
  const boardListeners = [];

  const setTool = id => {
    const roster = window.DraftToolRoster;
    // An unknown id would silently arm nothing and read as "select is on",
    // which is a broken state that looks like a working one.
    //
    // §6, "no other tools": THE REGISTER ASKS THE SAME FUNCTION THE KEYPAD
    // ASKS. Greying a key is presentation and presentation can be got round --
    // a keyboard shortcut, a restored session, a tool that arms itself when a
    // gesture finishes. Refusing here is what makes the board a rule rather
    // than a look, and it falls back to the resting tool for the same reason
    // an unknown id does: there is no such thing as no tool.
    const next = roster && roster.availableOn(id, board) ? id : RESTING_TOOL;
    activeTool = next;
    // Any half-finished gesture belongs to the tool being put down. Carrying an
    // anchor across a tool change is how a chain commits into the next tool's
    // first tap -- and the beam's anchor is a second one of exactly the same
    // kind, so it goes the same way. Leaving it would let a beam started under
    // BEAM finish under COLUMN.
    drawStart = null;
    beamStart = null;
    canvas.style.cursor = next === RESTING_TOOL ? '' : 'crosshair';
    // The instrument strip is a third reader of the same fact, added by #398
    // against the boolean this replaced. It reads the register now like
    // everything else does.
    stripRefresh();
    toolListeners.forEach(fn => fn(next));
  };

  // A drawn endpoint snaps to an existing corner exactly as a dragged one
  // does, and for the same reason: landing ON a corner is what makes the join
  // mitre. Nothing is moving during a draw, so nothing is excluded.
  //
  // THE T-SQUARE GOES FIRST AND THE CORNER SNAP MAY ONLY SLIDE ALONG IT. A
  // snap that pulled the run off square would make the instrument a
  // suggestion, and an instrument a drafter cannot trust is worse than no
  // instrument.
  //
  // THIS COMMENT USED TO SAY THAT AND THE CODE DID NOT DO IT. It cited
  // "squareTo's second half"; squareTo has no second half, and cornerSnap was
  // an unrestricted nearest-vertex search. Measured in
  // proto/tsquare-snap-override.js: with the T-square lit, a bait corner
  // 0.06 ft off the axis and inside the 0.129 ft radius pulled the endpoint
  // onto itself -- (0,0) -> (4, 0.06) where squaring gives (4, 0). A comment
  // describing behaviour the code does not have is worse than no comment: it
  // is the reason nobody looked.
  // WHOLE FEET IN TOY, ON THE NUMBER THAT REACHES commitWall. §1 says that in
  // those words, and it is the whole of the difference between a constraint
  // and a display convention: rounding the readout would show 12'-0" over a
  // wall the file records as 12.037, and the drafter would find out later,
  // from a dimension string that disagrees with the plan it measures.
  //
  // MEASURED FROM THE START, NOT ROUNDED IN PLACE. The run's LENGTH is what
  // lands on the foot, so the far end moves to make it so; rounding the
  // endpoint's coordinates instead would give whole-foot positions and a
  // fractional length whenever the start was itself fractional -- which it is,
  // on any drawing that existed before TOY.
  //
  // AND IT ROUNDS AFTER THE SNAP, so a corner the snap legitimately reached is
  // not then nudged off it. A snap that lands on a real corner is the one case
  // where the foot gives way: the corner is where the geometry actually joins.
  const onTheFoot = (from, pt) => {
    if (!from) return pt;
    const dx = pt.x - from.x, dz = pt.z - from.z;
    // One of these is zero under the square, so this is the run's length.
    const len = Math.hypot(dx, dz);
    if (len < 1e-9) return pt;
    const feet = Math.max(1, Math.round(len));
    return { x: from.x + (dx / len) * feet, y: 0, z: from.z + (dz / len) * feet };
  };

  const drawPoint = at => {
    const wanted = squareTo(drawStart, at);
    const fixed = squaredAxis(drawStart, at);
    const snapped = fixed ? axisSnap(wanted, fixed) : cornerSnap(wanted, []);
    if (snapped) return snapped;
    const free = { x: wanted.x, y: 0, z: wanted.z };
    return board === 'toy' ? onTheFoot(drawStart, free) : free;
  };

  // AN UNFINISHED RUN REFUSES A NEW ONE, AND SAYS SO. Ruled 13 Sep, after I
  // reported the boundary rather than hardening it: starting a disconnected
  // run while the first had only two taps used to drop those taps silently.
  // Nothing was lost from a saved file -- a two-point run was never a shape
  // the reader keeps -- but the drafter's hand had done something the screen
  // forgot, which is the quiet half of every failure this board is arranged
  // against.
  //
  // REFUSED AT THE FIRST PRESS OF THE NEW RUN, before any wall is made. The
  // run is what is refused, so refusing it after committing its first wall
  // would be a half-application -- the same thing "Stay in TOY commits nothing
  // and changes nothing" forbids one section over.
  // PRESSING ON THE OPEN END RESUMES THE RUN, and this is what §2's refusal
  // was missing. §2 asks whether the press continues the pending run and
  // tested it with `sameSpot` at 1e-6 -- an EQUALITY test between two points
  // computed by different routes.
  //
  // They cannot match. TOY rounds a run's LENGTH, not its coordinates
  // (model-toy-board.spec.js:333 makes that a rule), so committing the first
  // wall moves its end up to half a foot from the pixel the drafter released
  // on. Press there again to carry on and the raw press is nowhere near the
  // stored end by 1e-6 -- often further than CORNER_SNAP_PX, so cornerSnap
  // does not rescue it either -- and §2 refused a run that was continuing.
  // The wall was silently not drawn, with only the strip to say why.
  //
  // So the question is asked the way every other "did the drafter hit this"
  // question on this page is asked: a grab radius, not an equality. And it
  // returns THE STORED END, so the run resumes exactly where it left off
  // rather than a snap-width away from itself.
  // ── §4: BREAKING THE BONE ────────────────────────────────────────────────
  //
  // Movie: "they will be allowed to 'BREAK the bone' every foot if they want
  // to by clicking on it". The order is explicit that the marks are a set to
  // choose from, not a bone pre-chopped into forty segments: "same result, one
  // decision at a time".
  //
  // THE MARK IS A DISTANCE ALONG THE RUN, NOT A ROUNDED COORDINATE, and that
  // is the rule I broke once already tonight. TOY rounds a run's LENGTH
  // (model-toy-board.spec.js:333), so a bone whose start sits at x = -10.4 has
  // its marks at -9.4, -8.4, ... Rounding the clicked point's x would put the
  // break at a whole number that is not a mark on this bone at all -- whole
  // POSITIONS and a fractional LENGTH, which is exactly backwards.
  const breakMarkOn = (wall, at) => {
    const rx = wall.end.x - wall.start.x, rz = wall.end.z - wall.start.z;
    const run = Math.hypot(rx, rz);
    if (run < 2) return null;              // no interior mark to break at
    const along = ((at.x - wall.start.x) * rx + (at.z - wall.start.z) * rz) / run;
    // CLAMPED OFF BOTH ENDS. A break AT a corner is not a break -- it would
    // make a zero-length half, and the format drops anything under 1e-6 on
    // load, so it would be a wall that vanishes on the next reload.
    // CLAMPED OFF BOTH ENDS, and the clamp IS the guard. A `feet <= 0 || feet
    // >= run` line sat here too and the gate showed it surviving: the clamp
    // already pins feet to [1, floor(run) - 1], so nothing could ever reach
    // it. A guard nothing can exercise is a claim about a case that does not
    // exist -- the same dead-guard shape as the already-angled skip in
    // wouldAngle, removed on the same evidence.
    const feet = Math.min(Math.max(Math.round(along), 1), Math.floor(run) - 1 || 1);
    return { x: wall.start.x + (rx / run) * feet, y: 0,
      z: wall.start.z + (rz / run) * feet };
  };

  // The bone gains the point BETWEEN the two corners it lies between, never
  // appended: an outline is an ordered ring, so a point on the end is a
  // different shape, not the same shape with a joint in it.
  const insertOnEdge = (o, a, b, pt) => {
    const same = (p, q) => Math.hypot(p.x - q.x, p.z - q.z) < 1e-6;
    const pts = o.points || [];
    for (let i = 0; i < pts.length; i += 1) {
      const j = (i + 1) % pts.length;
      if ((same(pts[i], a) && same(pts[j], b)) || (same(pts[i], b) && same(pts[j], a))) {
        pts.splice(i + 1, 0, { x: pt.x, y: 0, z: pt.z });
        return true;
      }
    }
    return false;
  };

  // A BREAK ON A MASTERED LEVEL CUTS THE MASTER, ruled 14 Sep: "yes break
  // master and all that area attached to it locked to it".
  //
  // I BUILT THIS BACKWARDS FIRST. The line here read `if (o.masterId)
  // continue` -- "a master's copy is not ours to cut" -- which is the opposite
  // of the ruling, and the order names exactly why it matters: THE FIRST HOUSE
  // DRAWN IS MASTER-DERIVED, so refusing the break on a mastered outline makes
  // the very first bone anyone wants to cut the one bone that will not cut. It
  // would have passed every check I had written, because all of them draw one
  // unmastered bone.
  //
  // So the master governs the break exactly as it governs a move -- one rule
  // for the master, not one for moving and another for cutting -- and every
  // level locked to it takes the same cut. The unlocked exit is §5a's and is
  // not invented here.
  // TAKES THE ORIGINAL ENDS, not a wall. The first version took the new tail
  // wall and read its `start` -- which is the break point, because breakBoneAt
  // has already moved it. So it searched every ring for an edge from the mark
  // to the far corner, an edge that does not exist yet, matched nothing, and
  // cut no bone at all. The five §4 checks all passed anyway: they assert the
  // WALLS, and the wall split was fine. Only 7a, which reads the rings, saw it.
  const boneGainsPoint = (a, b, pt) => {
    const all = drawing.outlines || [];
    const hit = all.find(o => insertOnEdge(o, a, b, pt));
    if (!hit) return false;
    if (!hit.masterId) return true;        // a purely local bone cuts alone
    // The master, then every OTHER level that follows it. The clicked level is
    // already cut, and the geometry is the master's, so each copy takes the
    // cut at the same place on the same edge rather than at a point computed
    // again per level.
    (drawing.boneyardOutlines || []).forEach(m => {
      if (m.id === hit.masterId) insertOnEdge(m, a, b, pt);
    });
    all.forEach(o => {
      if (o === hit || o.masterId !== hit.masterId) return;
      insertOnEdge(o, a, b, pt);
    });
    return true;
  };

  const breakBoneAt = (wall, pt) => {
    // CAPTURED BEFORE THE MUTATION, because the ring still describes the wall
    // as it was and that is the edge the break has to be placed on.
    const was = { a: { x: wall.start.x, z: wall.start.z },
      b: { x: wall.end.x, z: wall.end.z } };
    const mid = poolVertex(pt, wall.levelId, wall.view);
    const tail = { ...wall, id: newDrawingItemId('wall'), start: mid, end: wall.end };
    wall.end = mid;
    const at = (drawing.walls || []).indexOf(wall);
    drawing.walls.splice(at < 0 ? drawing.walls.length : at + 1, 0, tail);
    boneGainsPoint(was.a, was.b, pt);
    rebuildRoofs();                        // §5: the ring changed
    undoStack.push({ kind: 'add', wall: tail });
    markDirty();
    paint();
    return tail;
  };

  // ── §4's SECOND HALF: THE CONNECTOR ──────────────────────────────────────
  //
  // "After a break the two halves are independent bones and each obeys §3."
  // A joint alone does not deliver that. The halves of a broken run are
  // COLLINEAR and share a corner, so dragging one swings the other -- §3b
  // refuses it rather than produce a diagonal, which is safe and leaves the L
  // and the bump-out the order names as the POINT of §4 unreachable.
  //
  // What makes them reachable: the drag UNSHARES that corner. The dragged
  // wall takes its own vertex, the neighbour keeps the old one, and a
  // connector wall spans the two. As the drag proceeds the connector grows --
  // perpendicular to the wall being dragged, because the move is -- and that
  // connector IS the side of the bump-out. Nothing is left angled, so §3b has
  // nothing to refuse.
  //
  // ONLY FOR COLLINEAR NEIGHBOURS. A perpendicular neighbour just gets longer
  // and stays square, which is §3's whole behaviour on an ordinary house;
  // splitting corners there would drop a zero-length wall into the drawing on
  // every drag.
  //
  // ONCE, WHEN THE DRAG ARMS, not on every pointermove -- a connector per
  // mouse event would be several hundred walls across one gesture.
  const collinearWith = (wall, other) => {
    const rx = wall.end.x - wall.start.x, rz = wall.end.z - wall.start.z;
    const ox = other.end.x - other.start.x, oz = other.end.z - other.start.z;
    const a = Math.hypot(rx, rz), b = Math.hypot(ox, oz);
    if (a < 1e-9 || b < 1e-9) return false;
    return Math.abs((rx * oz - rz * ox) / (a * b)) < 1e-6;
  };

  const splitRunCorners = md => {
    if (board !== 'toy' || md.kind !== 'wall' || !md.body) return;
    const wall = md.body;
    md.before.forEach(b => {
      const v = b.vtx;
      const touching = (drawing.walls || [])
        .filter(w => w !== wall && (w.start === v || w.end === v));
      if (!touching.some(other => collinearWith(wall, other))) return;
      // A SEPARATE VERTEX AT THE SAME PLACE, and poolVertex must not be used:
      // mergeVertex merges by position and would hand back the very corner
      // being unshared. The pool's own rule allows this -- "two corners at the
      // same place are still two corners if the pool never merged them".
      const fresh = { x: v.x, y: 0, z: v.z,
        srcId: v.srcId ?? null, offX: v.offX ?? 0, offZ: v.offZ ?? 0 };
      vertexPool.push(fresh);
      if (wall.start === v) wall.start = fresh; else wall.end = fresh;
      b.vtx = fresh;
      const conn = { ...wall, id: newDrawingItemId('wall'), start: fresh, end: v };
      // Which neighbour this corner was shared WITH, so the constraint call
      // can be told it is no longer carried by the move.
      conn.detachedFrom = (touching.find(other => collinearWith(wall, other)) || {}).id;
      drawing.walls.push(conn);
      undoStack.push({ kind: 'add', wall: conn });
      md.connectors = (md.connectors || []).concat(conn);
    });
    if (md.connectors) markDirty();
  };

  // ── §5: A ROOF OVER WHATEVER NOTHING SITS ON ─────────────────────────────
  //
  // Movie, 14 Sep: a roof belongs to "every part of a floor that nothing sits
  // on" -- so it is a FUNCTION of the difference between one storey's
  // footprint and the one above it, recomputed when either bone moves, not a
  // thing attached to the top storey. A ranch is the degenerate case.
  //
  // THE GEOMETRY IS geometry-2d.js's, not a second opinion. uncoveredRegions
  // does the rectilinear difference and returns rectangles, because a storey
  // set back on all sides leaves a RING and the format's roof has `points`
  // with no holes.
  //
  // WHICH ROOFS ARE OURS: `sourceShapeId`, which the format already carries
  // (drawing-format.js:490) and which means "where this came from". A roof
  // built from a bone names that bone; a roof a drafter drew names nothing and
  // is NEVER touched here. No new field, and no guessing.
  const storeyAbove = levelId => {
    const here = (drawing.levels || []).find(l => Number(l.id) === Number(levelId));
    if (!here) return null;
    return (drawing.levels || [])
      .filter(l => (Number(l.elev) || 0) > (Number(here.elev) || 0))
      .sort((a, b) => (Number(a.elev) || 0) - (Number(b.elev) || 0))[0] || null;
  };

  const boneOf = levelId => (drawing.outlines || [])
    .find(o => Number(o.levelId) === Number(levelId)) || null;

  // The edge that dies into the storey above is a GABLE -- ruled 14 Sep, "the
  // roof should terminate where it meets the upper storey wall like a garage
  // roof that is dropped". A gable end is vertical and carries no eave
  // overhang, which is the property that matters: an eave there would hang two
  // feet of roof straight into the house above.
  //
  // The format has no third kind -- an edge is `gable` if it says so and
  // `eave` otherwise -- so this needs no format change and no older reader
  // sees anything it cannot read.
  const edgeKinds = (ring, upper) => {
    if (!upper) return ring.map(() => 'eave');
    const onUpper = pt => (upper.points || []).some((a, i) => {
      const b = upper.points[(i + 1) % upper.points.length];
      const cross = (b.x - a.x) * (pt.z - a.z) - (b.z - a.z) * (pt.x - a.x);
      const len = Math.hypot(b.x - a.x, b.z - a.z);
      if (len < 1e-9 || Math.abs(cross) / len > 1e-6) return false;
      const t = ((pt.x - a.x) * (b.x - a.x) + (pt.z - a.z) * (b.z - a.z)) / (len * len);
      return t >= -1e-6 && t <= 1 + 1e-6;
    });
    return ring.map((pt, i) => {
      const next = ring[(i + 1) % ring.length];
      return onUpper(pt) && onUpper(next) ? 'gable' : 'eave';
    });
  };

  // THE BONE FOLLOWS THE DRAG, and until §5 it did not.
  //
  // §2 is explicit: "a level's bone drives that level's FLOOR and WALL nodes"
  // and "the bone is not a separate drawing that happens to look like the
  // plan". But §3's drag moves wall VERTICES and nothing else, so every TOY
  // drag left the outline behind as a stale snapshot of where the house used
  // to be. Invisible on screen -- the walls are what paints -- and invisible
  // to every §3 check, which all read walls.
  //
  // §5 is what made it bite: roofs derive from the bone, so a bone that never
  // moved produced a roof over the old footprint. The drag moved the wall a
  // foot and the roof stayed where it was.
  //
  // By the ORIGINAL position, not by identity: an outline point is a plain
  // record, not the pooled vertex object the wall holds, so the two are only
  // ever connected by where they sit.
  //
  // ON THIS LEVEL ONLY. The first version walked every outline in the drawing
  // and moved any point sitting at the dragged corner -- so dragging the main
  // floor's wall silently reshaped the SECOND FLOOR's bone, because storeys
  // stacked on the same footprint have points at identical coordinates. A
  // §5 check caught it: the storey above followed the floor below and the
  // roof between them never changed. Matching by position is right; matching
  // by position across levels is not.
  const boneFollows = (before, levelId) => {
    const rings = (drawing.outlines || [])
      .filter(o => Number(o.levelId) === Number(levelId));
    before.forEach(b => {
      if (b.x === b.vtx.x && b.z === b.vtx.z) return;
      rings.forEach(ring => (ring.points || []).forEach(pt => {
        if (Math.hypot(pt.x - b.x, pt.z - b.z) > 1e-6) return;
        pt.x = b.vtx.x;
        pt.z = b.vtx.z;
      }));
    });
  };

  const rebuildRoofs = () => {
    const G = window.DraftGeometry2D;
    if (!G || !G.uncoveredRegions) return;
    const mine = new Set();
    (drawing.levels || []).forEach(level => {
      const bone = boneOf(level.id);
      if (!bone) return;
      mine.add(String(bone.id));
      const above = storeyAbove(level.id);
      const cover = above ? boneOf(above.id) : null;
      const regions = G.uncoveredRegions(bone.points || [], cover ? cover.points : null);
      // DROP THIS BONE'S OLD ROOFS FIRST, so a storey pushed back out takes
      // its roof away with it rather than leaving the old one behind. "A roof
      // appears" is satisfied by an implementation that only ever adds.
      drawing.roofs = (drawing.roofs || [])
        .filter(r => String(r.sourceShapeId || '') !== String(bone.id));
      regions.forEach(ring => {
        drawing.roofs.push({
          id: newDrawingItemId('roof'),
          points: ring.map(pt => ({ x: pt.x, y: 0, z: pt.z })),
          levelId: Number(level.id),
          sourceLevelId: above ? Number(above.id) : null,
          sourceShapeId: String(bone.id),
          edges: edgeKinds(ring, cover),
          // THE FORMAT'S OWN DEFAULTS, written out rather than left implicit:
          // pitch 4 is the 4/12 that was ruled, overhang 2 is what a roof
          // reads back as anyway (drawing-format.js:493-494).
          overhang: 2,
          pitch: 4,
          garage: false,
        });
      });
    });
    markDirty();
  };

  const boneChoice = document.getElementById('bone-choice');
  let boneChoiceFor = null;
  const closeBoneChoice = () => { boneChoiceFor = null; boneChoice.hidden = true; };
  const offerBoneChoice = (wall, at) => {
    const pt = breakMarkOn(wall, at);
    if (!pt) { sayOnStrip('this wall is too short to break'); return; }
    boneChoiceFor = { wall, pt };
    boneChoice.hidden = false;
    boneChoice.querySelector('[data-break-here]').focus();
  };
  boneChoice.querySelector('[data-break-here]').addEventListener('click', () => {
    const pick = boneChoiceFor;
    closeBoneChoice();
    if (pick) breakBoneAt(pick.wall, pick.pt);
  });
  // NOTHING AT ALL, the same contract as Stay in TOY: the drag already moves
  // the wall, so this button's whole job is to leave without changing
  // anything. A choice that always did something would not be a choice.
  boneChoice.querySelector('[data-break-move]').addEventListener('click', closeBoneChoice);

  const toyOpenEnd = at => {
    if (board !== 'toy' || !pendingBone) return null;
    const open = pendingBone.points[pendingBone.points.length - 1];
    if (!open) return null;
    const reach = CORNER_GRAB_PX / view.scale;
    return Math.hypot(at.x - open.x, at.z - open.z) <= reach
      ? { x: open.x, y: 0, z: open.z }
      : null;
  };

  const toyRunRefused = at => {
    if (board !== 'toy' || !pendingBone) return false;
    if (endsAt(pendingBone, at)) return false;      // this press continues it
    // NAMES BOTH WAYS OUT, because the order's wording does: "finish or cancel
    // the run you started". Escape is the cancel.
    sayOnStrip('finish or cancel the run you started — Esc cancels');
    return true;
  };

  const drawPress = at => {
    if (!drawStart) {
      // Resume before refusing: a press on the open end is the drafter
      // carrying on, which is the one case the refusal must not catch.
      const open = toyOpenEnd(at);
      if (open) { clearNotice(); drawStart = open; paint(); return; }
      if (toyRunRefused(drawPoint(at))) return;
      clearNotice();
      drawStart = drawPoint(at); paint(); return;
    }
    clearNotice();
    const end = drawPoint(at);
    // A wall of no length is not a wall — the format drops anything under
    // 1e-6 on load, so committing one would write a record that vanishes on
    // the next open. Treat the second tap as a correction, not a commit.
    if (Math.hypot(end.x - drawStart.x, end.z - drawStart.z) < 0.001) { drawStart = end; paint(); return; }
    const wall = commitWall(drawStart, end);
    // CHAINING, the old page's habit: the next wall starts where this one
    // ended, so a room is four taps and not eight. The pooled END object is
    // the start, so the corner is shared by identity.
    drawStart = wall.end;
    setSelection([{ type: 'wall', item: wall }]);
    stripRefresh();
    paint();
  };

  // ── the instrument strip ──────────────────────────────────────────────────
  // MODEL.dc.html:1963's bottom panel, rebuilt on this page's terms. Movie,
  // 13 Sep: "we also still need the bottom bar which should look like lights
  // for [an] instrument panel like on the Model.dc.html version. the length
  // T-square, ruler and other stuff are down there we need. and the skin
  // switcher can be there too."
  //
  // FOUR INSTRUMENTS ARE REAL AND SIX ARE DORMANT, and the strip says which
  // is which rather than offering ten buttons where four work. The dormant
  // six hold their seats (see the stylesheet's note on spacing) with a title
  // that names them as unbuilt -- the same refusal as the panel's disabled 3D
  // chair, which is the house rule: a control that lies about what the page
  // can do is worse than a gap.
  const strip = document.getElementById('strip');
  const stripMessage = document.getElementById('strip-message');
  // What the page is SAYING, as against what it is reporting. Cleared by the
  // next press that does something, so a refusal never sits over a gesture
  // that has since succeeded.
  let stripNotice = '';
  // BOTH HALVES GO THROUGH A FUNCTION THAT REPAINTS. Saying it and clearing it
  // are the same operation with different text, and the bug both times was the
  // repaint: first stripRefresh overwrote a notice that had been set, then a
  // notice was cleared and the strip kept showing it because nothing repainted
  // until an unrelated pointermove happened along. A message has two halves --
  // it must appear and it must STOP -- and a bare assignment does neither on
  // its own.
  const sayOnStrip = text => { stripNotice = text; stripRefresh(); };
  const clearNotice = () => { if (stripNotice) sayOnStrip(''); };
  const lenOut = document.getElementById('strip-len');
  const angOut = document.getElementById('strip-ang');
  const protractorOut = document.getElementById('strip-protractor-angle');
  const rulerChip = strip.querySelector('[data-mode-ruler]');
  const tsquareChip = strip.querySelector('[data-mode-tsquare]');
  const lengthBox = document.getElementById('frozen-length');

  const F = window.DraftFormatters;
  const feetLabel = ft => F.formatArchitecturalInches(ft * 12);
  // Compass bearing off the +X axis, the reading a protractor gives: 0-180
  // either way rather than 0-360, because a wall drawn left has the same
  // angle as the same wall drawn right and a drafter reading 183° would
  // reasonably think it was out of square.
  const angleLabel = (from, to) => {
    const deg = Math.atan2(-(to.z - from.z), to.x - from.x) * 180 / Math.PI;
    const folded = deg <= -90 ? deg + 180 : (deg > 90 ? deg - 180 : deg);
    return `${folded.toFixed(1)}°`;
  };

  // WHAT THE T-SQUARE ACTUALLY DOES. The longer leg wins, so the run follows
  // the direction the hand is already going rather than jumping axes under
  // the cursor.
  // TOY SQUARES BECAUSE THE BOARD SAYS SO, not because an instrument is up.
  // §1: "Four directions only, +X/-X/+Z/-Z from the start point", and TOY has
  // no instruments for a drafter to switch on -- §6 takes the tools away. So
  // the T-square is one reason to square and the board is another, and a run
  // is held square if EITHER holds.
  //
  // Acceptance #4 is what keeps this honest in the other direction: in
  // DRAFTING with the T-square down, nothing squares and the same gesture
  // commits the same off-axis wall it commits today. TOY must not leak.
  const squaring = () => tsquareOn || board === 'toy';

  const squareTo = (from, at) => {
    if (!squaring() || !from) return at;
    return Math.abs(at.x - from.x) >= Math.abs(at.z - from.z)
      ? { x: at.x, z: from.z } : { x: from.x, z: at.z };
  };

  // WHICH COORDINATE THE SQUARE FIXED, or null when nothing is squaring. The
  // caller needs this and cannot get it by comparing points: a run that is
  // already axis-aligned comes back from squareTo unchanged, and "unchanged"
  // then means both "not squaring" and "squaring, already square".
  const squaredAxis = (from, at) => {
    if (!squaring() || !from) return null;
    return Math.abs(at.x - from.x) >= Math.abs(at.z - from.z) ? 'z' : 'x';
  };

  // The run the instruments are reading: the wall being drawn if there is
  // one, otherwise the ruler's measure. Null when the drafter is doing
  // neither, and the readouts go blank rather than holding a stale number --
  // a length that stays on screen after the gesture ends is the one thing a
  // drafter should never be able to misread.
  const runInHand = () => {
    if (!cursorWorld) return null;
    // drawPoint, NOT squareTo, AND THAT IS A BUG FIX RATHER THAN A TIDY-UP.
    // squareTo only squares; drawPoint is what the commit calls, and in TOY it
    // also lands the run on the whole foot. Reading the cursor through the
    // weaker of the two made the strip say 5.4 ft over a wall that committed
    // at 5. §1: the readout must be "the same number commitWall will receive,
    // not the cursor measured separately -- two readings of one distance
    // drift, and the drafter believes the one he can see." This has been
    // wrong on the TOY board since §1 landed.
    if (drawStart && activeTool === 'wall') return { from: drawStart, to: drawPoint(cursorWorld) };
    if (rulerFrom) return { from: rulerFrom, to: cursorWorld };
    return null;
  };

  // THE LENGTH ON THE DRAWING, beside the one on the strip. Both read
  // runInHand, so both read what commitWall will receive -- §1 asks for the
  // on-screen number and the committed number to be ASSERTED EQUAL, and the
  // only way to keep that true is for there to be one number.
  //
  // PLACEMENT IS THE WHOLE DIFFERENCE BETWEEN THE TWO POINTERS. §1: "by the
  // cursor on PC, clear of the finger on touch". On a touch screen the thing
  // being read is exactly the thing the hand is covering, so it goes well
  // above the contact point and centred on it; a mouse has nothing to hide
  // behind it, so it sits low and to the right where a cursor label belongs.
  const drawLenEl = document.getElementById('draw-len');
  let pointerScreen = null;
  const syncDrawLength = () => {
    if (!drawLenEl) return;
    const run = activeTool === 'wall' && drawStart ? runInHand() : null;
    if (!run || !pointerScreen) { drawLenEl.hidden = true; return; }
    drawLenEl.hidden = false;
    drawLenEl.textContent =
      feetLabel(Math.hypot(run.to.x - run.from.x, run.to.z - run.from.z));
    const touch = pointerScreen.type === 'touch';
    drawLenEl.style.left = `${pointerScreen.x + (touch ? 0 : 14)}px`;
    drawLenEl.style.top = `${pointerScreen.y + (touch ? -54 : 16)}px`;
    drawLenEl.style.transform = touch ? 'translateX(-50%)' : 'none';
  };

  // FOUR READS OF `drawArmed` BECAME READS OF THE REGISTER. #398 wrote this
  // strip against the armed boolean; the tool register replaced that boolean
  // with a tool id, and the merge that brought the two together was clean --
  // the strip and the column live in different parts of the file. The same
  // shape as deleteLevel's `setArmed(false)` earlier today, from the other
  // side: git has nothing to say when one branch deletes a name another branch
  // starts using.
  function stripRefresh() {
    const run = runInHand();
    const dist = run ? Math.hypot(run.to.x - run.from.x, run.to.z - run.from.z) : null;
    lenOut.textContent = dist === null ? '' : feetLabel(dist);
    angOut.textContent = run ? angleLabel(run.from, run.to) : '';
    protractorOut.textContent = run ? angleLabel(run.from, run.to) : '—';
    rulerChip.classList.toggle('lit', rulerOn);
    tsquareChip.classList.toggle('lit', tsquareOn);
    // THE LENGTH BOX IS LIVE ONLY WHILE A WALL IS IN HAND, because that is
    // the only moment a typed length has an anchor and a direction to be
    // measured along. Enabled at any other time it would take a number and
    // have nowhere to put it.
    const typable = !!(activeTool === 'wall' && drawStart && cursorWorld);
    if (lengthBox.disabled === typable) {
      lengthBox.disabled = !typable;
      if (!typable) lengthBox.value = '';
    }
    // While the drafter is typing, the box is his; the live length would
    // overwrite the digits mid-word.
    if (typable && document.activeElement !== lengthBox) {
      lengthBox.value = dist === null ? '' : feetLabel(dist);
    }
    // A NOTICE OUTLIVES ONE REFRESH, and it has to. Both the refusal and the
    // cancel wrote straight to stripMessage and were erased microseconds later
    // by this line -- the page said the true thing and then said the routine
    // thing over the top of it, which on screen is the page saying nothing.
    // Found by the check asserting the message was VISIBLE rather than that
    // the code had set it, which is the difference between the two halves of
    // every failure today.
    stripMessage.textContent = stripNotice || (rulerOn
      ? (rulerFrom ? 'ruler — second point' : 'ruler — first point')
      : (activeTool === 'wall' ? (drawStart ? 'wall — second point' : 'wall — first point') : ''));
    // Last, and from here rather than from the pointer handlers, so the label
    // goes out the moment the run does -- every path that ends a run already
    // calls stripRefresh, and a length still on screen after the gesture is
    // over is the one thing a drafter should never be able to misread.
    syncDrawLength();
  }

  const rulerPress = at => {
    if (!rulerFrom) { rulerFrom = { x: at.x, z: at.z }; }
    else { rulerFrom = null; }
    cursorWorld = at;
    stripRefresh();
    paint();
  };

  rulerChip.addEventListener('click', () => {
    rulerOn = !rulerOn;
    rulerFrom = null;
    canvas.style.cursor = rulerOn ? 'crosshair' : (activeTool === 'wall' ? 'crosshair' : '');
    stripRefresh();
    paint();
  });
  tsquareChip.addEventListener('click', () => {
    tsquareOn = !tsquareOn;
    stripRefresh();
    paint();
  });

  // TYPING A LENGTH COMMITS THE WALL, which is the instrument's whole point:
  // a drafter who knows the wall is 12'-6" should not have to find 12'-6"
  // with a mouse. The DIRECTION is the one the cursor is already giving --
  // squared first if the T-square is down -- so the typed number replaces the
  // distance and nothing else.
  // ── the promotion, and the question that comes first ──────────────────────
  // §7: "Entering an exact length anywhere promotes the drawing to DRAFTING",
  // and the drafter is ASKED BEFORE it happens, not told after. Movie ruled
  // this against a typed-length exception inside TOY, and his version is
  // better for the reason he gave: TOY then has one law with no exceptions,
  // and the promotion is visible instead of a hidden mode flip.
  //
  // WHAT "ASKS ONCE PER DRAWING" MEANS, and this is a reading of the order
  // rather than a quotation from it. §7 says the confirm "asks once per
  // drawing, then remembers", and separately that Stay in TOY "commits nothing
  // and changes nothing -- no wall, no mode change, no half-application".
  // Those two pull opposite ways on whether a Stay counts as an answer, so:
  //
  //   Continue  sets boardPromptSeen, promotes, and commits the length.
  //   Stay      changes NOTHING, the flag included -- so the next typed length
  //             asks again.
  //
  // The annoyance §7 names is "a dialog people learn to click through without
  // reading", and that is the drafter who keeps saying Continue; once they
  // have, they are never asked again. A drafter who keeps saying Stay keeps
  // being asked because they keep trying to do the thing TOY does not allow,
  // and the alternative -- silently promoting them later on the strength of a
  // refusal -- is worse. FLAGGED for Movie rather than settled by me.
  const promote = document.getElementById('promote');
  let pendingPromotion = null;

  const askToPromote = onContinue => {
    pendingPromotion = onContinue;
    promote.hidden = false;
    promote.querySelector('[data-promote-go]').focus();
  };
  const closePromote = () => { pendingPromotion = null; promote.hidden = true; };

  promote.querySelector('[data-promote-go]').addEventListener('click', () => {
    const go = pendingPromotion;
    closePromote();
    if (drawing) { drawing.boardPromptSeen = true; markDirty(); }
    setBoard('drafting');
    if (go) go();
  });
  // NOTHING AT ALL, which is the whole of Stay's contract. No wall, no board,
  // no flag: a refusal that recorded itself would be a change.
  promote.querySelector('[data-promote-stay]').addEventListener('click', closePromote);

  const commitTypedLength = () => {
    const parsed = F.parseArchitecturalLength(lengthBox.value);
    if (!parsed.ok) { stripMessage.textContent = parsed.error; return; }
    const feet = parsed.inches / 12;
    if (!(feet > 0) || !drawStart || !cursorWorld) return;
    // ASKED BEFORE ANYTHING HAPPENS. The length is re-read inside the
    // continuation rather than captured here, so what commits is what the box
    // says when the drafter answers -- and if the gesture has moved on, the
    // guards above run again on the way through.
    if (board === 'toy' && !drawing?.boardPromptSeen) {
      askToPromote(() => commitTypedLength());
      return;
    }
    const aim = squareTo(drawStart, cursorWorld);
    const dx = aim.x - drawStart.x, dz = aim.z - drawStart.z;
    const len = Math.hypot(dx, dz);
    if (len < 1e-6) { stripMessage.textContent = 'point away from the start first'; return; }
    const end = { x: drawStart.x + dx / len * feet, y: 0, z: drawStart.z + dz / len * feet };
    const wall = commitWall(drawStart, end);
    drawStart = wall.end;
    // THE SELECTION IS A SET ON THIS BRANCH. #398 wrote this line as
    // `selectedSeg = wall` against the single-wall variable that the selection
    // set replaced -- the third binding this merge had to re-seat, after
    // deleteLevel's setArmed and the strip's four reads of drawArmed. Same
    // shape every time: one branch deletes a name, another starts using it,
    // and git has nothing to say.
    setSelection([{ type: 'wall', item: wall }]);
    lengthBox.blur();
    stripRefresh();
    paint();
  };
  lengthBox.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); commitTypedLength(); }
    if (e.key === 'Escape') { e.preventDefault(); lengthBox.blur(); stripRefresh(); }
    // The page's own keys (0 to fit, Escape, Delete) must not fire while a
    // length is being typed -- a drafter typing 10' would otherwise refit the
    // view under his hands.
    e.stopPropagation();
  });

  // ── the switches ──────────────────────────────────────────────────────────
  // SKIN WITHOUT A RELOAD. Every painter reads its colours from `skin` inside
  // its own body, so re-resolving the palette and repainting is the whole
  // change -- and it has to be, because this page can be holding an unsaved
  // edit and a reload would be asked to throw it away to change a colour.
  // THE THREE SWITCHES LIVE IN THE MODE CORNER, not the strip: §7b moved them
  // to the head-left so the strip carries instruments and readings only.
  //
  // BUTTONS ONLY, and inside the corner. `html` carries `data-theme` and
  // `body` carries `data-board` -- those are the marks the switches SET --
  // so a document-wide query hands the switch code its own output as a
  // control: every click then bubbles to `html`, re-reads the theme off it
  // and rewrites the skin key without the board in it.
  const switchSet = attr =>
    [...document.querySelectorAll(`#mode-corner button[${attr}]`)];
  const themeButtons = switchSet('data-theme');
  const modeButtons = switchSet('data-skin-mode');
  const boardButtons = switchSet('data-board');

  const markSwitch = (buttons, attr, value) =>
    buttons.forEach(b => b.setAttribute('aria-pressed', String(b.dataset[attr] === value)));

  const applySkin = () => {
    skin = window.DraftPalette.apply(document, theme, mode);
    markSwitch(themeButtons, 'theme', theme);
    markSwitch(modeButtons, 'skinMode', mode);
    // MERGED, not replaced: the board seed shares this key, and a skin write
    // that rebuilt the object dropped it.
    try {
      const keep = JSON.parse(localStorage.getItem(SKIN_KEY) || '{}');
      localStorage.setItem(SKIN_KEY, JSON.stringify({ ...keep, theme, mode }));
    }
    catch { /* a private window refusing storage is not a reason to refuse the skin */ }
    paint();
  };
  themeButtons.forEach(b => b.addEventListener('click', () => { theme = b.dataset.theme; applySkin(); }));
  modeButtons.forEach(b => b.addEventListener('click', () => { mode = b.dataset.skinMode; applySkin(); }));

  // THE BOARD SWITCH IS A SWITCH AND NOTHING IS WIRED BEHIND IT YET, and that
  // is said out loud rather than implied. Movie, 13 Sep, asked for it on the
  // PC strip; the sentence defining what TOY MODE restricts was cut off
  // mid-word and has not arrived, so what exists is the choice, remembered
  // across reloads and readable by whoever builds the constraints -- not a
  // claim that they exist. The title on each button says so; when the rules
  // land they read `body[data-board]` and nothing here moves.
  const BOARDS = ['toy', 'drafting'];
  // THE DRAWING OWNS THE BOARD; localStorage only seeds a drawing that has
  // never recorded one. §7 of the TOY bones order is explicit -- a per-browser
  // flag means "the same drafter meets it on every file while a second drafter
  // never sees it at all" -- and acceptance #11 wants a PROMOTED DRAWING to
  // reload as DRAFTING, which is a fact about one file.
  //
  // The remembered value is kept as the seed rather than dropped, so a fresh
  // page still opens on the board the drafter last used, which is what it does
  // today. A drawing that HAS chosen overrides it, always.
  const rememberedBoard = BOARDS.includes(stored.board) ? stored.board : 'toy';
  let board = rememberedBoard;

  const boardOfDrawing = () =>
    window.DraftDrawingFormat.board(drawing?.board) || rememberedBoard;
  const applyBoard = () => {
    document.body.setAttribute('data-board', board);
    markSwitch(boardButtons, 'board', board);
    boardListeners.forEach(fn => fn(board));
    try {
      const keep = JSON.parse(localStorage.getItem(SKIN_KEY) || '{}');
      localStorage.setItem(SKIN_KEY, JSON.stringify({ ...keep, board }));
    } catch { /* as above */ }
  };
  boardButtons.forEach(b => {
    // §8 of the TOY bones order: this title said "remembered, but nothing is
    // constrained by it yet" for as long as that was true. §6 made it false
    // -- the board decides which tools the column offers -- and the disclaimer
    // went rather than being left to mislead.
    //
    // §1–§5 have since made it false a second time, in the direction a drafter
    // meets FIRST. The tool roster is what TOY takes away; squareness and the
    // whole foot are what it DOES, on the very first wall, and a title that
    // named only the roster left the drafter to discover the geometry rule by
    // being surprised by it. Both facts, one sentence each side of the comma.
    //
    // STILL NOT PROMISING THE UNBUILT: this names what a drafter can confirm
    // by drawing one wall today. model-html-strip.spec.js:353 holds it to that.
    b.title = b.dataset.board === 'toy'
      ? 'TOY board — walls only, square and whole-foot; the other tools are put away'
      : 'DRAFTING board — the full tool column, any angle and any length';
    b.addEventListener('click', () => { setBoard(b.dataset.board); });
  });

  // ONE PLACE THE BOARD CHANGES, so the drawing and the switch cannot drift.
  // Everything that moves a board -- the buttons here, and the promotion the
  // LENGTH box will raise -- goes through this.
  const setBoard = next => {
    if (!BOARDS.includes(next) || next === board) return;
    board = next;
    if (drawing) {
      drawing.board = window.DraftDrawingFormat.board(next);
      markDirty();
    }
    applyBoard();
  };

  markSwitch(themeButtons, 'theme', theme);
  markSwitch(modeButtons, 'skinMode', mode);
  applyBoard();
  stripRefresh();

  // ONE LISTENER, THE REGISTER'S. #398 wrote this against the armed
  // boolean (`setArmed(!drawArmed)`); the register replaced that, and the
  // merge offered both because the strip and the tool column were added at
  // the same point in the file. Keeping both listeners would have given the
  // button two handlers that disagree about what armed means.

  // ── the tool column ───────────────────────────────────────────────────────
  // SEVENTEEN KEYS, RENDERED FROM THE LIST. tool-roster.js holds the roster;
  // this builds it and wires it to the register above. Nothing here decides
  // what a tool does — pressing a key sets `activeTool` and that is all — so a
  // tool whose gesture is not written yet still lights, still says what it
  // would do, and still puts the previous one down. A key that did nothing at
  // all would be worse than no key: it would look like a working tool.
  //
  // THE LETTERS ARE READ ONCE AT BUILD, from SETTINGS through the roster. A
  // remap made in another tab lands on the next load, which is how every other
  // profile-backed value on this page behaves.
  const buildToolColumn = () => {
    const roster = window.DraftToolRoster;
    const slot = document.getElementById('tool-slot');
    if (!roster || !slot) return;
    const resolved = roster.bindings();
    slot.replaceChildren(...roster.GROUPS.map(group => {
      const box = document.createElement('div');
      box.dataset.toolGroup = group.id;
      const name = document.createElement('div');
      name.dataset.toolGroupName = '';
      name.textContent = group.label;
      const keys = document.createElement('div');
      keys.className = 'tool-keys';
      keys.append(...roster.inGroup(group.id).map(tool => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'tool-key';
        btn.dataset.toolKey = tool.id;
        btn.dataset.toolKind = tool.kind;
        btn.setAttribute('aria-pressed', String(tool.id === activeTool));
        // The disabled state and the title are NOT set here -- see
        // refreshToolAvailability below, which this function calls once the
        // keys exist. One place decides the face, for the same reason one
        // place decides availability.
        const letter = document.createElement('span');
        letter.dataset.toolLetter = '';
        letter.textContent = roster.keyFor(tool.id, resolved);
        const label = document.createElement('span');
        label.dataset.toolName = '';
        label.textContent = tool.name;
        btn.append(letter, label);
        // PRESSING THE ARMED KEY RETURNS TO SELECT rather than to nothing --
        // see the register's comment. Pressing SELECT while select is armed is
        // therefore a no-op, which is right: it is the resting state.
        btn.addEventListener('click',
          () => setTool(tool.id === activeTool ? RESTING_TOOL : tool.id));
        return btn;
      }));
      box.append(name, keys);
      return box;
    }));
    refreshToolAvailability();
  };

  // §6 ON THE FACE, AND IT IS A WALK RATHER THAN A REBUILD. `disabled` rather
  // than hidden: a key that vanishes on TOY tells a drafter the tool does not
  // exist, and moves every key below it, so switching boards would reshuffle
  // the column under their finger. Down and still in its place says the true
  // thing -- this board does not offer it.
  //
  // WHY THIS IS NOT buildToolColumn() CALLED AGAIN. #tool-slot is shared: the
  // SELECTION and ASSEMBLY panels append into the same element, and this
  // builder is the only one that calls replaceChildren. Re-running it on a
  // board change wiped both of them -- the page kept its seventeen keys and
  // lost every selection mode, filter and assembly control. My own boards spec
  // stayed green through it, because it only ever looked at tool keys; 25
  // checks in three MERGED suites went red. Availability changes on a board
  // switch, the letters do not, so nothing needs rebuilding.
  function refreshToolAvailability() {
    const roster = window.DraftToolRoster;
    if (!roster) return;
    document.querySelectorAll('[data-tool-key]').forEach(btn => {
      const tool = roster.get(btn.dataset.toolKey);
      if (!tool) return;
      const usable = roster.availableOn(tool.id, board);
      btn.disabled = !usable;
      // The title is the whole name, because the face is 40px and
      // FENESTRATION does not fit on it at a readable size. When the key is
      // down the title is the only place the REASON fits.
      btn.title = usable ? tool.name
        : `${tool.name} — the TOY board does not offer this tool`;
    });
  }

  // The register tells the column, never the other way round. Any future
  // arming path -- a keyboard shortcut, a tool that puts itself down when it
  // finishes -- lights the right key for free, because it goes through
  // setTool and setTool is what fires this.
  toolListeners.push(next => {
    document.querySelectorAll('[data-tool-key]').forEach(btn => {
      btn.setAttribute('aria-pressed', String(btn.dataset.toolKey === next));
    });
  });

  buildToolColumn();

  // A BOARD CHANGE PUTS DOWN A TOOL THE NEW BOARD DOES NOT OFFER, and ONLY
  // such a tool. Leaving it armed would keep ROOF live behind a greyed ROOF
  // key -- the column telling the truth about the key and a lie about the
  // state, and the next drag still drawing a roof on the toy board.
  //
  // THE CONDITION IS NOT DECORATION. The first version called setTool on every
  // board change, and setTool clears `drawStart` because a tool change
  // abandons the gesture that belonged to the old tool. A BOARD change is not
  // a tool change: PROMOTION crosses boards in the middle of a run on purpose
  // -- typing a length in TOY offers DRAFTING and then commits that same run
  // -- so disarming unconditionally cut the anchor out from under the commit
  // and the wall was never made. model-toy-board.spec.js:224 caught it; the
  // gesture survives a crossing that keeps its tool.
  boardListeners.push(() => {
    const roster = window.DraftToolRoster;
    if (roster && !roster.availableOn(activeTool, board)) setTool(RESTING_TOOL);
    refreshToolAvailability();
    // THE OTHER TWO SURFACES. Leaving these out is exactly the gap that made
    // §6 a third built: the keys obeyed the board and the panels did not, and
    // nothing said so because the spec only looked at keys.
    syncSelectionPanel();
    syncAssembly();
  });

  // ── SELECTION and OBJECT TYPE ─────────────────────────────────────────────
  // THE HELP STRINGS ARE THE OLD PAGE'S, VERBATIM (:23597 and :23619). They are
  // not decoration: the mode help is the only place the shift-drag shortcut is
  // written down, and the filter help is the only thing that tells a drafter
  // why the thing under the cursor stopped responding. Paraphrasing them would
  // have quietly dropped facts a drafter depends on.
  const MODES = [
    { id: 'click', label: 'ITEMS' },
    { id: 'window', label: 'WINDOW' },
    { id: 'window-all', label: 'ALL LEVELS' },
  ];
  const MODE_HELP = {
    click: 'Click items to select; Shift adds or removes. Press and drag for a '
      + 'blue window — hold Shift while dragging for a red all-levels window.',
    window: 'Drag a blue box to select fully enclosed items on the current level.',
    'window-all': 'Drag a red box to select fully enclosed items on every level.',
  };
  const FILTERS = [
    { id: 'all', label: 'ALL', aria: 'Grab any object type' },
    { id: 'line', label: 'LINE', aria: 'Grab only lines' },
    { id: 'wall', label: 'WALL', aria: 'Grab only walls' },
    { id: 'outline', label: 'OUTLINE', aria: 'Grab only outlines' },
    { id: 'floor', label: 'FLOOR', aria: 'Grab only floors' },
  ];
  const filterHelp = () => (selectFilter === 'all'
    ? 'Engage a type so Select only grabs that object — even under other geometry.'
    : `${selectFilter.toUpperCase()} is engaged: nothing else responds. `
      + 'Click ALL — or press Esc with nothing selected — to release.');

  // PICKING A MODE ALSO ARMS SELECT, which is the old page's own behaviour
  // (setClickSelectionMode and its two siblings all set activeTool: 'select').
  // Without it a drafter with WALL armed could press WINDOW, see it light, and
  // still draw a wall on the next drag.
  const setSelectionMode = id => {
    selectionMode = id;
    setTool('select');
    syncSelectionPanel();
  };

  const setSelectFilter = id => { selectFilter = id; syncSelectionPanel(); };

  let syncSelectionPanel = () => {};

  const buildSelectionPanel = () => {
    const slot = document.getElementById('tool-slot');
    if (!slot) return;
    const chip = (dataKey, entry, onPick) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'sel-chip';
      btn.dataset[dataKey] = entry.id;
      btn.textContent = entry.label;
      if (entry.aria) btn.setAttribute('aria-label', entry.aria);
      btn.addEventListener('click', () => onPick(entry.id));
      return btn;
    };
    const section = (name, chips, help) => {
      const box = document.createElement('div');
      box.dataset.toolGroup = name.toLowerCase().replace(/\s+/g, '-');
      const title = document.createElement('div');
      title.dataset.toolGroupName = '';
      title.textContent = name;
      const row = document.createElement('div');
      row.className = 'sel-row';
      row.append(...chips);
      box.append(title, row, help);
      return box;
    };

    const modeHelp = document.createElement('div');
    modeHelp.className = 'sel-help';
    modeHelp.dataset.selHelp = '';
    const filterHelpEl = document.createElement('div');
    filterHelpEl.className = 'sel-help';
    filterHelpEl.dataset.filterHelp = '';

    slot.append(
      section('SELECTION',
        MODES.map(m => chip('selMode', m, setSelectionMode)), modeHelp),
      section('OBJECT TYPE',
        FILTERS.map(f => chip('selFilter', f, setSelectFilter)), filterHelpEl));

    syncSelectionPanel = () => {
      // §6: "the selection filters ... none of them operate in TOY". The board
      // answer comes from the roster, not from a `board === 'toy'` written
      // here, so this panel and the keypad cannot disagree about a board.
      const on = window.DraftToolRoster?.panelOn('selection', board) !== false;
      slot.querySelectorAll('[data-sel-mode]').forEach(btn => {
        btn.setAttribute('aria-pressed',
          String(btn.dataset.selMode === selectionMode));
        btn.disabled = !on;
      });
      slot.querySelectorAll('[data-sel-filter]').forEach(btn => {
        btn.setAttribute('aria-pressed',
          String(btn.dataset.selFilter === selectFilter));
        btn.disabled = !on;
      });
      // THE HELP SAYS WHY, and it replaces the mode help rather than sitting
      // beside it: MODE_HELP describes a shortcut for a gesture this board
      // does not have, and leaving it up would teach a drafter a control that
      // is right there and dead.
      modeHelp.textContent = on ? MODE_HELP[selectionMode]
        : 'The TOY board edits through bones. Selection modes and filters are '
          + 'on the DRAFTING board.';
      filterHelpEl.textContent = on ? filterHelp() : '';
      // RED WHENEVER A FILTER IS ENGAGED -- not when the cursor is over
      // something the filter excludes. selectFilterHelpColor (:23622) is a
      // straight ternary on selectFilter, and a cursor-driven red would mean
      // hit-testing on every mousemove, which the old page does not do.
      filterHelpEl.toggleAttribute('data-engaged', selectFilter !== 'all');
    };
    syncSelectionPanel();
  };

  buildSelectionPanel();

  // ── ASSEMBLY and UNGROUP ──────────────────────────────────────────────────
  // WHAT AN ASSEMBLY IS, in the file: a named set of members recorded by TYPE
  // AND ID, never by object reference (_createGroup :17940). Ids are what
  // survive a save; references are not.
  //
  // ESCAPE IN THE NAME FIELD CREATES A "NOT FIXED" ASSEMBLY. It does not
  // cancel. That is the old page's binding (onGroupNameKey :23685-23687:
  // Enter -> _createGroup(true), Escape -> _createGroup(false)) and it is
  // ported faithfully because this order says the roster is not a place to
  // improve on -- but it is worth someone's decision rather than quiet
  // inheritance: everywhere else on both pages Escape backs out, so a drafter
  // reaching for it to abandon the dialog gets an assembly they did not want.
  // Flagged, not fixed.
  const nextGroupNumber = () => {
    const n = Number(drawing?.nextGroupId);
    return Number.isFinite(n) && n > 0 ? n : (groups().length + 1);
  };

  const createAssembly = fixed => {
    const chosen = selection.slice();
    if (!chosen.length) { closeAssemblyDialog(); return; }
    const members = [];
    chosen.forEach(entry => {
      if (!entry.item || entry.item.id == null) return;
      const key = memberKey(entry);
      if (!members.some(m => `${m.type}:${m.id}` === key)) {
        members.push({ type: entry.type, id: entry.item.id });
      }
    });
    if (!members.length) { closeAssemblyDialog(); return; }
    // AN ITEM BELONGS TO ONE ASSEMBLY. Taking it into a new one takes it out
    // of its old one, and an assembly left with nothing in it goes -- the old
    // page's own two lines, and without them a drafter can build overlapping
    // assemblies that disagree about what moves with what.
    const taken = new Set(members.map(m => `${m.type}:${m.id}`));
    drawing.groups = groups()
      .map(group => ({ ...group,
        members: (group.members || [])
          .filter(m => !taken.has(`${m.type}:${m.id}`)) }))
      .filter(group => group.members.length > 0);

    const n = nextGroupNumber();
    const typed = (assemblyName || '').trim().toUpperCase();
    const firstWall = chosen.find(entry => entry.type === 'wall')?.item;
    const group = {
      id: `group-${n}`,
      name: typed || `ASSEMBLY ${n}`,
      fixed: fixed === true,
      stretchBehavior: fixed === true ? 'rigid' : 'item-geometry',
      members,
      // The first wall's settings ride the assembly, so a later change to the
      // assembly has something to change FROM. Null when it holds no wall.
      wallSettings: firstWall ? {
        wallType: firstWall.wallType,
        baseHeight: firstWall.baseHeight,
        topHeight: firstWall.topHeight,
        refLine: firstWall.refLine,
      } : null,
    };
    drawing.groups.push(group);
    drawing.nextGroupId = n + 1;
    // The new assembly is what is selected afterwards -- all of it, which is
    // also the drafter's confirmation that it took.
    setSelection(itemsOfGroup(group));
    assemblyName = '';
    closeAssemblyDialog();
    markDirty();
    paint();
  };

  const ungroupSelected = () => {
    const going = selectedGroups();
    if (!going.length) return;
    const ids = new Set(going.map(group => group.id));
    // THE ITEMS SURVIVE; only the grouping goes. Ungroup is not delete, and
    // the members stay selected so the drafter can see what they just freed.
    drawing.groups = groups().filter(group => !ids.has(group.id));
    syncAssembly();
    markDirty();
    paint();
  };

  let assemblyName = '';
  let assemblyDialogOpen = false;
  let syncAssembly = () => {};
  const closeAssemblyDialog = () => { assemblyDialogOpen = false; syncAssembly(); };

  const buildAssemblyPanel = () => {
    const slot = document.getElementById('tool-slot');
    if (!slot) return;
    const box = document.createElement('div');
    box.dataset.toolGroup = 'assembly';
    const title = document.createElement('div');
    title.dataset.toolGroupName = '';
    title.textContent = 'ASSEMBLY';

    const asmBtn = document.createElement('button');
    asmBtn.type = 'button';
    asmBtn.className = 'sel-chip asm-wide';
    asmBtn.dataset.assemblyStart = '';
    asmBtn.addEventListener('click', () => {
      if (!selection.length) return;
      assemblyDialogOpen = true;
      syncAssembly();
      slot.querySelector('[data-assembly-name]')?.focus();
    });

    const unBtn = document.createElement('button');
    unBtn.type = 'button';
    unBtn.className = 'sel-chip asm-wide';
    unBtn.dataset.assemblyUngroup = '';
    unBtn.addEventListener('click', ungroupSelected);

    const help = document.createElement('div');
    help.className = 'sel-help';
    help.dataset.assemblyHelp = '';

    const dialog = document.createElement('div');
    dialog.dataset.assemblyDialog = '';
    dialog.hidden = true;
    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.dataset.assemblyName = '';
    nameInput.placeholder = 'NAME';
    nameInput.addEventListener('input', e => { assemblyName = e.target.value; });
    nameInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); createAssembly(true); }
      // See the note above: Escape here CREATES, it does not cancel.
      if (e.key === 'Escape') { e.preventDefault(); createAssembly(false); }
      // The page's own Escape clears the selection, which would empty the
      // dialog out from under itself.
      e.stopPropagation();
    });
    const row = document.createElement('div');
    row.className = 'sel-row';
    const fixedBtn = document.createElement('button');
    fixedBtn.type = 'button';
    fixedBtn.className = 'sel-chip';
    fixedBtn.dataset.assemblyFixed = '';
    fixedBtn.textContent = 'FIXED';
    fixedBtn.addEventListener('click', () => createAssembly(true));
    const looseBtn = document.createElement('button');
    looseBtn.type = 'button';
    looseBtn.className = 'sel-chip';
    looseBtn.dataset.assemblyLoose = '';
    looseBtn.textContent = 'NOT FIXED';
    looseBtn.addEventListener('click', () => createAssembly(false));
    row.append(fixedBtn, looseBtn);
    dialog.append(nameInput, row);

    box.append(title, asmBtn, unBtn, help, dialog);
    slot.append(box);

    syncAssembly = () => {
      const n = selection.length;
      const held = selectedGroups();
      const key = window.DraftToolRoster?.keyFor('select')
        ? window.DraftToolRoster.bindings() : {};
      const gKey = window.DraftKeyboard?.keyBindingLabel(key.group) || '';
      // §6: "the assembly verbs ... none of them operate in TOY". The board
      // beats the selection count -- a TOY drafter with items selected must
      // still find ASSEMBLY down, or the rule holds only while nothing is
      // picked, which is the half nobody would test.
      const on = window.DraftToolRoster?.panelOn('assembly', board) !== false;
      asmBtn.textContent = gKey ? `ASSEMBLY  [${gKey}]` : 'ASSEMBLY';
      asmBtn.disabled = !on || n === 0;
      unBtn.textContent = 'UNGROUP';
      unBtn.disabled = !on || held.length === 0;
      unBtn.hidden = held.length === 0;
      // The old page's own two sentences (:23631-23633), and the red is its
      // own too: nothing selected is the state that stops the button working.
      help.textContent = !on
        ? 'Assemblies are a DRAFTING board verb.'
        : (n ? `${n} selected item${n === 1 ? '' : 's'} · make a named assembly.`
             : 'Select drawing items before assembling them.');
      help.toggleAttribute('data-engaged', !on || n === 0);
      dialog.hidden = !assemblyDialogOpen;
      if (!assemblyDialogOpen) nameInput.value = assemblyName = '';
    };
    syncAssembly();
  };

  buildAssemblyPanel();
  selectionWatchers.push(() => syncAssembly());

  // ── THE STRUCTURE PROPERTIES PANEL ───────────────────────────────────────
  //
  // WHAT IT DOES NOT DO, said plainly rather than left to be discovered: it
  // does not make an existing column or beam clickable. This page's hit-test
  // knows walls, lines and floors; teaching it structure is the selection
  // system's job and not #392's. So the panel shows the item the drafter just
  // PLACED, which is the moment its properties are wanted and the moment
  // commitWall already selects its wall in.
  //
  // ONE VALUE PER ROW, AND THE VALUES ARE THE FORMAT'S. footing and mode are
  // enumerations drawing-format.js validates (:517 and :563); anything not on
  // those lists is silently replaced with the default on the next load, so the
  // panel offers exactly what the reader accepts and nothing else.
  const FOOTINGS = [['pad36', 'PAD 36"'], ['pad42', 'PAD 42"'],
    ['pile8', 'PILE 8"'], ['pile10', 'PILE 10"'], ['pile12', 'PILE 12"']];
  const BEAM_MODES = [['flush', 'FLUSH'], ['dropped', 'DROPPED']];

  const propRow = (label, options, current, pick) => {
    const row = document.createElement('div');
    row.dataset.propRow = label.toLowerCase();
    const name = document.createElement('div');
    name.className = 'props-title';
    name.textContent = label;
    const chips = document.createElement('div');
    chips.className = 'chip-row';
    chips.append(...options.map(([id, face]) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'sel-chip';
      btn.dataset.propValue = id;
      btn.textContent = face;
      btn.setAttribute('aria-pressed', String(id === current));
      btn.addEventListener('click', () => pick(id));
      return btn;
    }));
    row.append(name, chips);
    return row;
  };

  const showStructureProps = () => {
    const P = window.ModelProps;
    if (!P) return;
    const picked = selection.length === 1 ? selection[0] : null;
    if (!picked || (picked.type !== 'column' && picked.type !== 'beam')) return;
    const item = picked.item;
    const box = document.createElement('div');
    if (picked.type === 'column') {
      box.append(propRow('FOOTING', FOOTINGS, item.footing, id => {
        item.footing = id;
        // A pile has a fixed diameter, so a pad's custom size is meaningless
        // on one. The format drops padIn for piles anyway (:534); dropping it
        // here too keeps the page's record and the reader's identical.
        if (id.startsWith('pile')) delete item.padIn;
        markDirty();
        showStructureProps();
        paint();
      }));
    } else {
      const span = Math.hypot(item.end.x - item.start.x, item.end.z - item.start.z);
      box.append(propRow('BEAM', BEAM_MODES, item.mode, id => {
        item.mode = id;
        markDirty();
        showStructureProps();
        paint();
      }));
      const len = document.createElement('div');
      len.dataset.propSpan = '';
      len.className = 'props-title';
      // The span is read from the geometry, never stored: a stored length and
      // a moved endpoint are two facts that can disagree, and the drafter
      // would believe the one on the panel.
      len.textContent = `SPAN ${feetLabel(span)}`;
      box.append(len);
    }
    P.set(picked.type === 'column' ? 'COLUMN' : 'BEAM', box);
  };
  selectionWatchers.push(showStructureProps);
  deleteButton.addEventListener('click', pressDelete);

  // ── pan and zoom ──────────────────────────────────────────────────────────
  let dragging = null;
  // One drag for both gestures: `kind` says whether the press took a corner or
  // the wall's body, and `before` is the list of pooled vertices it will move
  // with the numbers they started with.
  let moveDrag = null;

  // ── §3: MOVING A BONE ────────────────────────────────────────────────────
  //
  // THE WALL MOVES PERPENDICULAR TO ITSELF. A wall running along x travels in
  // z and vice versa; the component along its own run is dropped rather than
  // constrained, because sliding a wall lengthwise is not a move this board
  // offers.
  const runAxisOf = w => (Math.abs(w.end.x - w.start.x) >= Math.abs(w.end.z - w.start.z)
    ? 'x' : 'z');
  const posOnMoveAxis = w => (runAxisOf(w) === 'x' ? w.start.z : w.start.x);

  // THE FIRST NUDGE OF AN OFF-GRID WALL LANDS IT ON THE FOOT MARK. Movie,
  // 13 Sep: "make the first point land on a ft point how about so we don't
  // have that problem" -- so a wall at 12'-0½" goes to 13'-0", then 14'-0".
  //
  // WHY THIS LIVES HERE AND NOT IN THE MODULE. allowedMove quantises the
  // DELTA, never the position: quantiseFeet(d, step) = round(d/step)*step. It
  // cannot land a wall on the grid because it never looks at where the wall
  // is. Teaching it to is the second constraint path §3 forbids. So the PAGE
  // decides what distance to ask for, and the module still decides whether
  // that distance is allowed -- which is the division of labour the order
  // describes.
  //
  // The half-inch is given up ONCE, on the wall the drafter deliberately
  // moved. A wall nobody touches is never re-gridded, which is what keeps the
  // 31 Aug rule intact: opening an old plan in TOY moves nothing.
  const FOOT = 1;
  const offGridBy = pos => {
    const frac = pos - Math.floor(pos);
    return Math.min(frac, FOOT - frac) < 1e-6 ? 0 : frac;
  };
  // ONE FUNCTION, AND IT RETURNS THE STEP. This was a landingDelta returning
  // null for an on-grid wall, and a caller turning that null into FOOT -- and
  // the gate showed the null branch was redundant twice over: with `ask` now
  // always the drafter's distance, an on-grid wall computes a step of exactly
  // FOOT down either path, so the two arms produced identical answers and the
  // mutant deleting the guard changed nothing.
  //
  // The distance to the next foot mark IN THE DIRECTION OF TRAVEL is the whole
  // rule, and on a wall already on the grid that distance IS a foot. Saying it
  // once is shorter than saying it twice and calling one of them a special
  // case.
  const landingStep = (pos, direction) => {
    const frac = offGridBy(pos);
    if (!frac) return FOOT;
    return direction > 0 ? FOOT - frac : frac;
  };

  // THE MODULE'S REASONS, IN THE DRAFTER'S WORDS. toy-constraints.js names
  // them as codes on purpose -- it is a node module with no screen -- so the
  // page is where they become a sentence. Movie's rule for TOY is that a
  // refusal is explained "in the room's own words", and a code is not that.
  //
  // The default is the code itself rather than a shrug: an unnamed reason is a
  // bug in this list, and printing it is how anyone finds out. A generic
  // "cannot move that" would hide the gap for ever.
  const BLOCKER_WORDS = {
    NOT_ORTHOGONAL: 'this wall is not square, so the toy cannot move it',
    TOUCHES_NON_ORTHOGONAL: 'this wall meets an angled wall, so the toy cannot move it',
    MIN_ROOM: 'that would make a room too small',
    OPENING_WOULD_NOT_FIT: 'a door or window would not fit after that',
    CANTILEVER: 'that would overhang more than 2 ft — bring the foundation out first',
    GROUP_MEMBER_BLOCKED: 'a wall joined to this one cannot move that far',
    OBJECT_CLEARANCE: 'something in the room would not have room left',
    NEEDS_A_BEAM: 'that span would need a beam',
    // The wall the drafter grabbed is square and so is its neighbour; moving
    // it is what would bend one. So this says what the MOVE would do, not what
    // the wall is -- the other two ortho lines above are about the wall.
    WOULD_ANGLE_NEIGHBOUR: 'that would leave the next wall on an angle — break it first',
  };
  const blockerSays = verdict =>
    BLOCKER_WORDS[verdict.reason] || `cannot move it: ${verdict.reason}`;

  const toyWallDelta = (md, dx, dz) => {
    const T = window.DraftToyConstraints;
    const C = window.DraftToyContext;
    const wall = md.body;
    if (!T || !C || !wall) return null;
    const axis = runAxisOf(wall);
    // Perpendicular only. The along-run component is discarded, not clamped.
    const wanted = axis === 'x' ? dz : dx;
    if (!wanted) return { dx: 0, dz: 0 };

    // TWO THINGS, AND I REMOVED ONE OF THEM AS REDUNDANT AN HOUR AGO. The gate
    // had shown `ask = land` changing nothing, so I dropped it -- but it was
    // only ever exercised pulling -z, where the distance to the mark behind is
    // 0.958 and quantising a one-foot ask by 0.958 lands on the mark anyway.
    // Push +z from the same wall and the distance to the mark AHEAD is 0.042:
    // quantising a one-foot ask by 0.042 gives 1.008, and the wall sails past
    // the mark to -5.03.
    //
    // So the step alone does not carry the rule. THE FIRST NUDGE OF AN
    // OFF-GRID WALL IS THE LANDING, whatever the drag distance -- that is what
    // `ask` says -- and the step is what stops the module rounding the landing
    // back off the grid. Both, and neither is decoration.
    //
    // The lesson is the one from the fixture that only ran -z: a gate result
    // is only as good as the directions the checks take. I generalised from
    // one arm of a branch and deleted a line that carried the other.
    const pos = posOnMoveAxis(wall);
    const dir = Math.sign(wanted);
    const land = landingStep(pos, dir);
    const ask = offGridBy(pos) ? dir * land : wanted;
    const probe = { ...wall, stepFt: land };
    // ZERO-LENGTH WALLS ARE NOT GEOMETRY, and handing one to the module makes
    // it refuse the very drag that is about to give the wall its length. §4's
    // connector is born with both ends at the same point; `isOrthogonal`
    // reports false for a run of no length, so `inertReason` sees the dragged
    // wall TOUCHING a non-orthogonal wall and calls it inert. The move is
    // refused by the thing the move creates.
    //
    // The format drops anything under 1e-6 on load, so a wall this short is
    // not a record the drawing will keep either. The module is asked about
    // real walls.
    const ctx = C.gather({ walls: (drawing.walls || [])
      .filter(w => Math.hypot(w.end.x - w.start.x, w.end.z - w.start.z) >= 1e-6)
      .map(w => ({ ...w })) });
    // THE PAGE HAS TO SAY WHAT ACTUALLY MOVES, and until now it did not.
    //
    // Left to itself the module builds a weld group: any two walls whose ends
    // touch are welded, so a CLOSED ROOM is one group and dragging any wall of
    // it is judged as picking the whole house up and setting it down a foot
    // away. That is trivially legal, which is why `allowedMove` has answered
    // an unconditional yes here since §3 landed -- every room minimum, every
    // cantilever band, every beam-span rule in the module was unreachable from
    // this page, and no mutant could show it because the answer is the same
    // whether the rules work or not.
    //
    // Measured: dragging `n` on the plain square returned group [n,e,s,w] and
    // no stretches. The page then moved ONE wall and stretched its neighbours,
    // which is a different operation from the one that was approved.
    //
    // `welds` is the module's own override, so this is telling it the truth
    // rather than defeating it: the group is the dragged wall, and the walls
    // hanging off its corners are STRETCHES -- which is exactly what this page
    // does to them.
    const verdict = T.allowedMove(probe, ask,
      { ...ctx, mode: T.MODE.TOY, welds: [[wall.id]],
        // §4: the corners this drag already unshared. Their neighbours still
        // sit at the same coordinates until the first delta lands, so without
        // this the module refuses the bump-out as a diagonal it would have
        // caused -- a refusal about geometry the page has already resolved.
        detached: (md.connectors || []).map(c => c.detachedFrom).filter(Boolean) });
    // §3: "A BLOCKED DRAG STOPS DEAD AND THE BLOCKER SAYS WHY. Never elastic."
    // The saying is the half that was missing: allowedMove has always returned
    // a reason and this page has always stored it, and nothing put it on
