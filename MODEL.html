    // different but the bone and house are the same button". What the pulse
    // LOOKS like differs per theme and is settled in shell-bars.css, where
    // the rest of this button's states already live.
    // LOOKED UP RATHER THAN CLOSED OVER, like the line above it: `boneFoot`
    // is declared 130 lines below this and would be in the temporal dead
    // zone if anything ever calls this during setup rather than on a press.
    document.getElementById('bone')?.toggleAttribute('data-ready', boneReady);

    // THE SIZE ROW BELONGS TO THE CHOSEN ENTRY, not to the open submenu:
    // it is the question that follows the press, so it stays up after the
    // submenu shuts and the drafter can still see what he answered.
    const asks = ASKS_SIZE && chosen()?.entry?.needsSize === true;
    sizeRow.hidden = !asks;
    if (asks) {
      sizeStock.replaceChildren(...BM.GARAGE_SIZES.map(size => {
        const button = document.createElement('button');
        button.type = 'button';
        button.dataset.buildSize = size.id;
        button.textContent = size.label;
        button.classList.toggle('chosen', size.id === chosenSizeId);
        button.onclick = () => { chosenSizeId = size.id; syncBuildBar(); };
        return button;
      }), (() => {
        // THE FOURTH IS NOT A SIZE, it is the fields. It presses like the
        // other three so the row reads as one question with four answers.
        const button = document.createElement('button');
        button.type = 'button';
        button.dataset.buildSize = 'custom';
        button.textContent = 'OTHER';
        button.classList.toggle('chosen', chosenSizeId === 'custom');
        button.onclick = () => {
          chosenSizeId = 'custom';
          syncBuildBar();
          sizeWidth.focus();
        };
        return button;
      })());
      sizeCustom.hidden = chosenSizeId !== 'custom';
    }

    buildBar.hidden = false;
    paintSign();
  };
  // A TYPED FIGURE REDRAWS THE SIGN AND NOTHING ELSE. Rebuilding the row on
  // every keystroke would take the field's focus away mid-number.
  [sizeWidth, sizeDepth].forEach(field =>
    field.addEventListener('input', () => paintSign()));

  // A HANDLER THAT BUILT SOMETHING SAYS SO, and fireBuild passes that word back
  // to the press. Without it the foot bone cannot tell "I raised the house"
  // from "nobody was listening": it falls through to NOTHING TO BUILD YET and
  // calls the board up, so a drafter who had just watched his walls appear
  // would get the drive-thru over the top of them.
  //
  // IT SAYS SO BY CALLING buildServed, NOT BY RETURNING SOMETHING. The first
  // version read the handlers' return values, and that is a trap: a handler
  // written for any other purpose reports a build by accident. The one in
  // model-drivethru.spec.js does exactly that -- `p => seen.push(p)` returns
  // the array's new LENGTH, which is truthy, so a spec that only wanted to
  // watch the seam silenced the board. Found by that test.
  //
  // So the word is deliberate, and it is the seam's own existing idiom:
  // orderServed already means "the geometry side BUILT it" (:4262) and this is
  // its twin for the foot's bone. Nothing incidental can say it by mistake.
  let buildWasServed = false;
  const fireBuild = () => {
    // A BUILD COSTS A BONE (board #261), AND THE TOLL IS HERE rather than in
    // the handlers. MODEL.dc.html checks the wallet inside its build method,
    // which is one place because it has one caller; this page fires the same
    // seam from the foot press, from the sign's own bone on the post, and
    // from anything that registers later. A check per caller is a rule with
    // as many copies as there are doors, and the door added next year is the
    // one that forgets. So: refused before any handler runs, and paid for
    // only if one of them actually served.
    if (!canAffordBuild()) { refuseForBones(); return false; }
    buildWasServed = false;
    // EVERY handler is called, and the flag is read after -- never a short
    // circuit, which would silently skip whatever registered later.
    buildHandlers.forEach(fn => fn(chosen()));
    // PAID ON DELIVERY. A press the geometry side declined to serve -- no
    // type picked, nothing the design can make -- costs nothing, which is
    // what `buildWasServed` is already the page's word for.
    if (buildWasServed) chargeForBuild();
    return buildWasServed;
  };
  // THE ORDER CARRIES ITS ROUND: 'menu' means hand over the premade design
  // for this type, 'outline' means walk the drafter through drawing it.
  // AND ITS SIZE, when the entry asked for one. `size` is null on every
  // other order rather than absent, so the geometry side reads one shape.
  const fireOrder = () => {
    const order = {
      ...(chosen() || { family: null, entry: null }), round, size: chosenSize(),
    };
    orderHandlers.forEach(fn => fn(order));
  };
  // The foot bone is wired under the sign, because an empty press is
  // answered by the sign and the sign does not exist yet up here.

  // ── GRUFF'S DRIVE-THRU SIGN ───────────────────────────────────────────
  // Movie, 15 Sep: the sign rises from the foot and covers the two presses
  // in the middle of the strip, carries its own bone, and "the dog on
  // screen will take them through the menu of home types".
  //
  // IT IS THE BUILD BAR WITH A FACE. The tiles are the same family and
  // entry chips, from the same build-menu.js, firing the same pressEntry --
  // so the seam is untouched: an order records a type and draws nothing,
  // and the bone fires the build handlers whether it is the one on the foot
  // or the one on the post. The premade design per house type attaches
  // there, and this knows nothing about geometry.
  //
  // WHAT GRUFF SAYS IS DERIVED, never stored: it reads the menu's own state
  // each paint, so a line that disagrees with the tiles cannot happen.
  const sign = document.getElementById('drivethru');
  const signLine = document.getElementById('dt-line');
  const signNote = document.getElementById('dt-note');
  // THE BONE IS THE ONE PRESS UNDER THE BOARD (Movie, 16 Sep: "remove the
  // two house buttons and keep the BONE button just go to the drivethru").
  // The house button and the OUTLINE button were two more ways to the same
  // window, so the bone inherits their whole job: it calls the sign up, it
  // wears the glow while the board rises, and it carries the aria-expanded
  // the reader listens for. The outline ROUND still exists in `round` --
  // what retired is its button, not its meaning.
  const boneFoot = document.getElementById('bone');

  // THE PRESS'S ARTWORK IS PART OF THE FINISH. Movie, 17 Sep: the bone
  // becomes a blue house on the ROUGH DRAFTER version. A theme was already
  // "mainly through logos and colors" (palette.js's own note) -- this is the
  // first logo to arrive, so it rides the same switch the colours do rather
  // than growing a second way to be on ROUGH.
  //
  // ONE ENTRY PER THEME, AND EVERY THEME HAS ONE, so a theme added to
  // DraftPalette.THEMES without an artwork is a missing key here rather than
  // a press that silently keeps the last theme's picture.
  //
  // BOTH PRESSES, FOUND BY ATTRIBUTE. The foot bar's bone and the one on the
  // sign's post are one verb wearing one artwork -- the stylesheet says so in
  // as many words -- and a query that named only #bone would have left the
  // sign showing a bone under a blue house on the bar.
  //
  // `lit` IS A SECOND FILE, NOT A FILTER, AND ONLY WHERE ONE WAS DRAWN. The
  // bone's glow is a brightness filter over one artwork; the house arrived as
  // an ON and an OFF pair, drawn that way, and a filter cannot invent the
  // neon its ON state has. So a theme that ships two files gets the swap and
  // one that ships a single file keeps the filter the stylesheet gives it.
  //
  // IT LIVES HERE, BESIDE THE PRESS, rather than with the skin switches lower
  // down. callSign lights the bone during module evaluation on the ?from=entry
  // path, and a `const` declared after that line is in its dead zone when that
  // runs -- so the page would have thrown on the one entry that most needs to
  // work, and only on that entry.
  //
  // `balanceTop` IS PART OF THE ARTWORK, not part of the wallet. The bone's
  // number sits low, in the red under the bone; the house's sits in the
  // middle of its outline. Same number, two pictures -- so the offset is
  // declared where the pictures are, and a third theme that ships a third
  // drawing says where its number goes in the same line it names its file.
  // 74% is MODEL.dc.html:558's own figure, carried rather than re-eyeballed.
  // THE TABLE IS THE BAR'S NOW, and this page reads it rather than holding
  // the second copy. It went out with shell-bars.js the moment PROJECT wore
  // the bone and came up RED on a ROUGH skin: the artwork swap lived here, so
  // the page that owned the table got the house and the page that did not got
  // a red bone on a blue board. A table with two homes is how this repo's
  // oldest bugs start.
  const BONE_ART = window.DraftShellBars.BONE_ART;
  // AND THE BOARD IS THE SECOND LOGO. The note above says a theme is "mainly
  // through logos and colors" and that the press was the first to arrive;
  // this is the second, so it rides the same switch rather than growing a
  // third way to be on ROUGH. One entry per theme, for the same reason.
  // WHETHER IT COVERS THE BONE IS A FACT ABOUT THE ART, so it is kept beside
  // the art rather than derived from the theme's name further down. The sign
  // rises over the foot and hides the bone -- the stylesheet has said so since
  // the strip was built -- and carries its own copy of the press on its post.
  // The sheet stops above the bar and leaves the bone standing, so there the
  // bone is not something to disable, it is the press the drafter uses.
  //
  // AND WHETHER THE DOG IS ON IT is the other fact about the art, and it is
  // one fact rather than two: Gruff's screen and Gruff's bone are both Gruff.
  // Movie, 17 Sep, on the sheet: "in the ROUGH version it isn't going to show
  // the dog", and "no dog will ask questions they will just see the
  // selections". The stylesheet hides #dt-screen and #dt-bone on rough; this
  // flag is what the SCRIPT reads for the same fact, and model-drivethru pins
  // the two together so they cannot drift apart.
  //
  // IT IS NOT DERIVABLE FROM coversBone, which is about where the board
  // stands rather than what is painted on it. A board could stop above the
  // bar and still carry a dog.
  const BOARD_ART = Object.freeze({
    ruff:  Object.freeze({ src: './assets/drivethru-menu-board.png', coversBone: true,  dog: true }),
    rough: Object.freeze({ src: './assets/draft-board.png',          coversBone: false, dog: false }),
  });
  const boardHasDog = () => (BOARD_ART[theme] || {}).dog === true;
  const signBoard = document.querySelector('[data-drivethru-board]');
  const paintSignBoard = () => {
    const art = BOARD_ART[theme];
    if (!art || !signBoard) {
      console.warn(`MODEL: no board artwork for theme "${theme}"; leaving it as it is.`);
      return;
    }
    const next = new URL(art.src, location.href).href;
    if (signBoard.src !== next) signBoard.src = next;
    // A THEME PRESSED WITH THE BOARD ALREADY UP changes who is covered, and
    // a bone left disabled under a sheet that is not on top of it is a press
    // the drafter can see and cannot use.
    boneFoot.disabled = !sign.hasAttribute('data-shut') && art.coversBone;
  };
  const bonePressArt = [...document.querySelectorAll('[data-bone-art]')];
  // THE SPOKEN NAME MOVES WITH THE PICTURE. One of the two images carries the
  // press's only label (the sign's), the other is decorative beside a visually
  // hidden span -- so an empty alt stays empty and a spoken one is rewritten.
  // A screen reader told "BONE" while the screen shows a house is the same
  // defect as the sign keeping the old artwork, one sense over.
  const boneSaid = document.querySelector('#bone .said');
  // THE ON STATE, FETCHED BEFORE IT IS WANTED. The glow lasts two seconds and
  // is the whole of the feedback; a file that starts downloading when the
  // press is hit shows an empty box for the part of it that matters.
  Object.values(BONE_ART).forEach(art => {
    if (art.lit) { const pre = new Image(); pre.src = art.lit; }
  });
  const paintBonePress = () => {
    const art = BONE_ART[theme];
    if (!art) {
      console.warn(`MODEL: no bone artwork for theme "${theme}"; leaving it as it is.`);
      return;
    }
    bonePressArt.forEach(img => {
      // THE PRESS'S OWN STATE, not a shared one: the foot bar's bone lights
      // and the sign's does not, and they are two buttons.
      const press = img.closest('button');
      const wanted = (art.lit && press && press.hasAttribute('data-lit'))
        ? art.lit : art.src;
      // ONLY ON A CHANGE. Assigning the src it already has is a no-op in
      // every browser this page is tested in, but this runs on every
      // NIGHT/DAY press and on both edges of the glow, and a needless
      // assignment is a needless decode.
      const next = new URL(wanted, location.href).href;
      if (img.src !== next) img.src = next;
      if (img.alt) img.alt = `${art.label} — build it`;
    });
    if (boneSaid) boneSaid.textContent = art.label;
    // The number follows the picture it is drawn on -- low in the red on the
    // bone, in the middle of the outline on the house.
    if (boneBalanceEl) boneBalanceEl.style.top = art.balanceTop;
  };

  // ── THE FREE-BONE WALLET (board #261) ─────────────────────────────────
  //
  // Movie, 19 Sep: "can you bring the BONE number / TOKEN system over too",
  // "bring it like it was in model.dc". MODEL.html did not load
  // bone-wallet.js at all, so the whole economy was missing here: builds
  // were free, the press said nothing about what it cost, and a drafter
  // moving between the two pages met two different rules.
  //
  // THE WALLET IS APP STATE, NEVER DRAWING STATE. It lives in localStorage
  // and belongs to the browser, not to the file -- so nothing here marks the
  // drawing dirty, and a build that spends a bone does not make the drawing
  // need saving for that reason.
  //
  // THE MODULE'S OWN HEADER CALLS IT AN HONOUR SYSTEM: localStorage, editable
  // with devtools, real enforcement waiting on the server ledger (#52). This
  // page inherits that and does not pretend otherwise.
  const boneBalanceEl = document.getElementById('bone-balance');
  const waitLabel = ms => {
    if (ms == null) return '';
    const minutes = Math.ceil(ms / 60000);
    return minutes <= 1 ? '<1m' : `${minutes}m`;
  };
  let walletShown = { balance: null, nextDripMs: null };
  const readWallet = () => (window.DraftBoneWallet
    ? window.DraftBoneWallet.read() : { balance: Infinity, nextDripMs: null });

  const paintWallet = () => {
    const W = window.DraftBoneWallet;
    if (!W || !boneBalanceEl) return;
    const { balance, nextDripMs } = walletShown;
    const broke = balance < 1;
    // AN EMPTY WALLET SHOWS THE COUNTDOWN, not a bare 0 -- the number on the
    // press is the answer to "can I build", and "no" is only half of it.
    boneBalanceEl.textContent = broke
      ? `0 \u00b7 ${waitLabel(nextDripMs)}` : String(balance);
    // THE DIGIT LADDER (MODEL.dc.html:23499), carried rather than re-derived:
    // sized for one digit and stepping down so even a five-digit paid wallet
    // never overflows the artwork.
    const chars = broke ? 8 : String(balance).length;
    boneBalanceEl.style.fontSize =
      `${chars <= 1 ? 15 : chars <= 3 ? 11 : chars <= 5 ? 8 : 7}px`;
    boneFoot.toggleAttribute('data-broke', broke);
    boneFoot.title = broke
      ? `Out of bones \u2014 the next free bone lands in ${waitLabel(nextDripMs)}. `
        + `One drips in every hour, up to ${W.DRIP_CAP}.`
      : nextDripMs != null
        ? `${balance} bone${balance === 1 ? '' : 's'} \u00b7 next free bone in `
          + `${waitLabel(nextDripMs)}. Each BUILD costs 1.`
        : `${balance} bones \u2014 the free wallet is full. Each BUILD costs 1.`;
  };

  // REPAINTED ONLY ON A CHANGE, which is what makes the minute tick below
  // cheap enough to leave running: read() is a localStorage parse and a
  // little arithmetic, and the DOM is touched only when the answer moved.
  const refreshWallet = () => {
    if (!window.DraftBoneWallet) return;
    const now = readWallet();
    if (now.balance === walletShown.balance
      && now.nextDripMs === walletShown.nextDripMs) return;
    walletShown = { balance: now.balance, nextDripMs: now.nextDripMs };
    paintWallet();
  };
  refreshWallet();
  // ONE TICK A MINUTE, because the countdown on an empty press is in minutes
  // and a drip lands on the hour. Faster would redraw nothing; slower would
  // leave a bone in the wallet that the press says is not there.
  window.setInterval(refreshWallet, 60000);

  const signShut = () => sign.hasAttribute('data-shut');

  // WHAT GRUFF SAYS WHEN HE IS REFUSING, set by the press that was refused
  // and spent by the next paint, so it cannot outlive the moment it explains.
  let signRefusal = null;

  paintSign = () => {
    const picked = chosen();
    const open = openFamilyId ? BM.familyById(openFamilyId) : null;
    if (signRefusal) {
      signLine.textContent = signRefusal.line;
      signNote.textContent = signRefusal.note;
      signRefusal = null;
    } else if (picked?.entry?.needsSize && !chosenSize()) {
      // THE GARAGE IS ASKED HOW BIG BEFORE IT IS PROMISED. Saying "press
      // the bone and I'll build it" with the size still open would promise
      // something the bone is about to refuse.
      signLine.textContent = `${picked.entry.label}. HOW BIG?`;
      signNote.textContent = chosenSizeId === 'custom'
        ? `Type the two figures \u2014 anything from ${BM.GARAGE_SIZE_MIN_FT} to `
          + `${BM.GARAGE_SIZE_MAX_FT} feet.`
        : 'Pick a size off the shelf, or press OTHER and type your own.';
    } else if (picked) {
      const size = chosenSize();
      signLine.textContent = size
        ? `ONE ${size.label} ${picked.entry.label}. GOOD CHOICE.`
        : `ONE ${picked.entry.label}. GOOD CHOICE.`;
      // THE SAME BOARD SAYS WHICH ROUND IT IS. Both rounds end on the same
      // bone, so the screen is the only thing telling the drafter whether
      // the house arrives built or he draws it -- and that is the whole
      // difference between the two presses.
      signNote.textContent = round === 'outline'
        ? 'Press the bone and I\u2019ll walk you through drawing it.'
        : 'Press the bone and I\u2019ll build it.';
    } else if (open) {
      signLine.textContent = `${open.label} \u2014 WHICH ONE?`;
      signNote.textContent = open.title;
    } else {
      signLine.textContent = 'WELCOME TO THE DRIVE-THRU. WHAT ARE WE BUILDING?';
      signNote.textContent = 'Pick a house type off the board.';
    }
  };

  // OPENING THE SIGN CHANGES NOTHING BUT THE SIGN. It reads the menu and
  // moves; it does not choose, build, mark the drawing dirty or touch a
  // level. A drafter who opens it to look and shuts it again has made no
  // edit, and the spec says so.
  // THE PRESS STAYS LIT FOR AS LONG AS THE BOARD IS UP. Movie, 17 Sep: "when
  // the blueprint is showing the blue house button should be light and when it
  // goes down unlit" -- and then, naming which button: "i mean the blue house
  // button", the one in the bar that the sheet now rides above.
  //
  // SO THE GLOW IS NO LONGER TWO SECONDS, it is the whole visit. callSign
  // lights the press and the light simply never goes out until the board does,
  // which is why the timeout below hands the attribute to this function rather
  // than clearing it and letting this set it again a line later.
  //
  // ON RUFF NOBODY SEES IT, because the sign covers the bone -- and that is
  // not a reason to make this conditional. The rule is "the press that called
  // the board is lit while the board is up", the same rule on both finishes,
  // and RUFF's sign already carries its own lit copy of the press on its post.
  const setSign = show => {
    sign.toggleAttribute('data-shut', !show);
    boneFoot.setAttribute('aria-expanded', String(show));
    if (show) paintSign();
    boneFoot.toggleAttribute('data-lit', show);
    paintBonePress();
    // Covered is not reachable: the sign hides the bone and nothing under it
    // should be tabbed into. The sheet does not, so there it stays live.
    boneFoot.disabled = show && (BOARD_ART[theme] || {}).coversBone === true;
  };
  // THE BUTTON LIGHTS BEFORE THE SIGN RISES (Movie, 15 Sep): the house
  // button glows, then the board comes up. One constant, because he said
  // he would want to change the length.
  const SIGN_LIGHT_MS = 2000;
  let lighting = 0;
  // WHICH BUTTON PULLED UP TO THE WINDOW. The board is the same either way;
  // what changes is what the bone at the end of the round means.
  const callSign = (button, which) => {
    // A SECOND PRESS MID-GLOW IS NOT A SECOND ORDER. Without this the
    // impatient double-press queues two rises, and the second one lands on
    // a sign that is already up -- which reads as the board flickering shut.
    if (lighting) return;
    if (!signShut()) { setSign(false); return; }
    round = which;
    button.toggleAttribute('data-lit', true);
    // BOTH EDGES, because a theme whose ON state is its own file has to be
    // put back as well as put on. RUFF's filter needs neither and this is a
    // no-op there.
    paintBonePress();
    lighting = window.setTimeout(() => {
      lighting = 0;
      // THE LIGHT IS NOT PUT OUT HERE ANY MORE. It was two seconds and then
      // dark; it is now on until the board goes down, and setSign owns that.
      // Clearing it first would paint the OFF artwork for one frame between
      // the glow and the board.
      setSign(true);
    }, SIGN_LIGHT_MS);
  };

  // THE BONE ON THE SCREEN WITH NOTHING TO BUILD (Movie, 15 Sep: "what
  // happens if they press the bone if no outline?" -- then: "take them to
  // the full house flow (not the outline flow) if there isn't a house and
  // detached garage already... it will do nothing once both house and
  // garage both made").
  //
  // THE HOUSE ROUND, NEVER THE OUTLINE ROUND. A drafter who pressed the
  // bone asked for a house, not for a drawing lesson; sending him down the
  // guided trace would answer a question he did not ask.
  //
  // AND NOTHING AT ALL WHEN THE PROJECT IS FULL. One house and one detached
  // garage is the cap, so with both standing there is nothing the board
  // could offer -- a board that rises with every tile spent is a board that
  // wastes a press. What counts as standing is building-bodies.js's answer,
  // not this page's: PROJECT and the drive-thru's own tiles will ask the
  // same question, and three derivations of it would be two too many.
  //
  // The seam still hears every press either way -- what an empty press
  // means to the geometry side stays the geometry side's call.
  boneFoot.addEventListener('click', () => {
    // BUILT IS AN ANSWER. Movie, 18 Sep: "when they draw the U outline, they
    // should still press the BONE or blue house to cause the house to be
    // created" -- so the press that raises a house is a press that has been
    // answered, and the board has nothing left to ask.
    // AT THE WINDOW, THIS PRESS IS THE POST'S. The board is up, so the
    // drafter is inside the drive-thru, and Movie said so twice: "unless
    // they are inside the drive thru, if they press it then (or when the
    // house is glowing blue) that will count as only BUILD HOUSE". On RUFF
    // he never gets here because the board covers this press; on ROUGH it
    // does not, and this is the press he actually reaches for.
    if (!signShut()) { orderAtWindow(); return; }
    // THE SECOND PRESS ASKS. A type is picked and the board is down, so the
    // drafter has already been through the window once.
    if (chosen()) { openBuildChoice(); return; }
    // AND THE FIRST PRESS IS THE BOARD, ALWAYS -- including with an outline
    // traced and waiting, which is the whole of Movie's ruling: "on 1st
    // press go to drivethru questions". fireBuild used to run here and
    // build on the spot; it now runs from the card's BUILD instead, so the
    // traced shape is still what gets built, one press later and named.
    //
    // AND "ALWAYS" NOW MEANS ALWAYS. A gate stood on this line and returned
    // in SILENCE when building-bodies said the file was full. That was right
    // while full meant "there is nothing left to build, ever" -- Movie's rule
    // for it was "it will do nothing once both house and garage both made".
    //
    // Under ONE BUILDING PER FILE it means something else: "this file has its
    // building". The drafter can still have another, in a file of its own, so
    // a gate here would make this the one press in the app that answers
    // nothing at all -- he could never reach a tile, never reach the offer to
    // save and start clean, and never be told why the bone had gone dead. The
    // cap is enforced at the ORDER instead (:4746), which is the only place
    // that knows WHICH building he wants and can therefore ask about it.
    signRefusal = {
      line: 'NOTHING TO BUILD YET.',
      note: 'Pick a type off the board and I\u2019ll build it.',
    };
    callSign(boneFoot, 'menu');
  });

  // ARRIVING FROM THE FRONT DOOR PULLS UP TO THE WINDOW BY ITSELF (Movie,
  // 15 Sep): "when they enter into the model area from the front entry
  // screen the drivethru should pop up after about 2 seconds". The same
  // call as the press, so it is the same two seconds of glow and the same
  // board -- one behaviour, not a second copy of it.
  //
  // ONLY FROM THE ENTRY SCREEN, and the address says so. A board that rose
  // on every load would rise on every reload, over a drafter who is mid-
  // drawing; the flag is spent as it is read so a refresh lands in the
  // drawing rather than in the drive-thru again.
  //
  // AND A HAND ON THE PAGE CANCELS IT. Someone who starts working inside
  // those two seconds has said what they came for, and the board rising
  // over them would take the press they were making.
  if (new URLSearchParams(location.search).get('from') === 'entry') {
    const spent = new URL(location.href);
    spent.searchParams.delete('from');
    history.replaceState(null, '', spent.pathname + spent.search + spent.hash);
    const cancel = () => {
      ['pointerdown', 'keydown', 'wheel'].forEach(type =>
        document.removeEventListener(type, cancel, true));
      if (!lighting) return;
      window.clearTimeout(lighting);
      lighting = 0;
      boneFoot.toggleAttribute('data-lit', false);
      paintBonePress();
    };
    ['pointerdown', 'keydown', 'wheel'].forEach(type =>
      document.addEventListener(type, cancel, true));
    callSign(boneFoot, 'menu');
  }
  document.getElementById('dt-close').addEventListener('click', () => {
    setSign(false);
    boneFoot.focus();
  });
  // THE SIGN'S BONE IS THE ORDER, not the drafter's outline -- the other
  // seam, and nothing is listening on it yet because neither the premade
  // designs nor the guided trace exist. A press with nothing behind it is
  // still a press the geometry side is told about, and it carries the round
  // so "build me one" and "walk me through drawing one" cannot be confused
  // for each other by whoever writes them.
  //
  // EXCEPT A GARAGE WITH NO SIZE, which is not an order. The size is the
  // whole design of a box, so an order without one has nothing in it --
  // and the drafter who typed 4ft by 900ft is told so rather than watching
  // a press do nothing.
  // WHAT A PRESS AT THE WINDOW MEANS, once, for BOTH presses that can make
  // it. Movie, 19 Sep: "unless they are inside the drive thru, if they press
  // it then (or when the house is glowing blue) that will count as only
  // BUILD HOUSE".
  //
  // THIS WAS THE BLUE HOUSE BUG. There are two presses at the window -- the
  // bone on the post and the one on the foot -- and only the post's did this.
  // On RUFF that is invisible, because BOARD_ART.ruff covers the foot press
  // and setSign disables it; on ROUGH the sheet stops above the bar, the foot
  // press stays live in front of the drafter, and its handler read
  // `if (chosen()) return;` -- a bare return with no refusal, no board and no
  // sound. Pick a house on ROUGH, press the blue house, nothing happens.
  // Movie: "sometimes i have to switch to RUFF to make it work."
  //
  // So the meaning lives here and both presses call it. A second copy is what
  // made one of them wrong, and a second copy is what would make one of them
  // wrong again.
  // A REFUSAL HAS TO BE READ, and the only place this page says one is on
  // Gruff's screen. That was fine while the only press that could be refused
  // stood ON the board; the bone's second press can order with the board
  // DOWN, and paintSign() into a shut sign writes a sentence nobody sees --
  // and worse, SPENDS it, because paintSign consumes signRefusal. So: raise
  // the board and let its own paint carry the line.
  //
  // AND ON ROUGH THERE IS NO SCREEN TO RAISE IT TO. The same bug one layer
  // in: the stylesheet hides #dt-screen on the sheet with the rest of the
  // dog, so "how big, though?", "you've got one already", "you've got a
  // house already" and the wallet's refusal were all being written onto a
  // box nobody can see. The board still comes up -- it is the selections --
  // but it comes up silent, which is a press that does nothing and says
  // nothing, the worst answer this page can give.
  //
  // THE PAGE'S OWN LINE IS WHERE THEY GO WITHOUT HIM. sayOnStrip is how this
  // page speaks when it is not wearing a dog, and it is the same line the
  // outline tool's refusals already use. Both halves are spoken, because the
  // shout is the WHAT and the note is the WHAT TO DO, and on one line the
  // drafter needs both. The words are taken off signRefusal rather than
  // passed in, because refuseForBones STAGES its refusal for the next paint
  // instead of handing it over -- and taken off means taken: leaving it
  // staged would let Gruff say it later, in RUFF, about a press that is long
  // over.
  const sayAtWindow = () => {
    if (!boardHasDog()) {
      const said = signRefusal;
      signRefusal = null;
      if (said) sayOnStrip(`${said.line} ${said.note}`);
      return false;
    }
    if (signShut()) callSign(boneFoot, 'menu'); else paintSign();
    return false;
  };

  // Returns whether the order was actually placed, so a caller that pressed
  // with the board down knows whether to expect a house or an explanation.
  // FALSE NOW COVERS A THIRD OUTCOME: a press that opened the save dialog on
  // its way to a clean file has placed no order yet, and may never place one.
  const orderAtWindow = () => {
    const picked = chosen();
    if (picked?.entry?.needsSize && !chosenSize()) {
      signRefusal = {
        line: 'HOW BIG, THOUGH?',
        note: chosenSizeId === 'custom'
          ? `Both figures, between ${BM.GARAGE_SIZE_MIN_FT} and `
            + `${BM.GARAGE_SIZE_MAX_FT} feet.`
          : 'Pick a size off the shelf, or press OTHER and type your own.',
      };
      return sayAtWindow();
    }
    // THE WALLET GOES BEFORE THE CAP NOW, and the comment that stood below
    // used to argue the exact opposite: while the cap was a REFUSAL, a
    // drafter with no bones AND a house standing was better told about the
    // house, the thing waiting could not fix.
    //
    // THE CAP BELOW IS NO LONGER A REFUSAL, so that reasoning inverts with
    // it. It SWAPS THE DRAFTER'S FILE OUT -- asks, saves, blanks, builds --
    // and doing all of that for a build the wallet was always going to turn
    // away would clear his screen for nothing and then hand him the bone
    // message he could have had with his drawing still up.
    if (!canAffordBuild()) { refuseForBones(); return sayAtWindow(); }
    // AND ONE BUILDING IS THE FILE'S LOT -- a HOUSE or a DETACHED GARAGE,
    // never both. Movie, 24 Sep: "rule should be 1 autobuilt BUILDING per
    // DRAFT file (a BUILDING would be a HOUSE or a DETACHED GARAGE)". An
    // ATTACHED garage is part of the house it hangs off and spends nothing,
    // which is why one question does for both bodies; building-bodies.js
    // holds all of that arithmetic, so PROJECT cannot come to a different
    // answer about the same file.
    //
    // AND IT IS AN OFFER RATHER THAN A REFUSAL, which is the change here.
    // Two "YOU'VE GOT ONE ALREADY" signs stood in these lines and sent the
    // drafter away from a build that is perfectly available -- it just needs
    // a file of its own. Movie: "if they press the button ask them if they
    // would like to SAVE the current drawing and then proceed with a NEW
    // CLEAN file for the new AUTOBUILD".
    //
    // ASKED ONLY OF A PRESS THAT WOULD ACTUALLY RAISE ONE. A garage tile
    // qualifies -- it is past its size question by the time it gets here --
    // and a house tile only if it HAS a design. A 2 STOREY press with no plan
    // behind it falls through to the trace handover, and swapping the file
    // out from under a shape the drafter is about to trace by hand would be
    // the worst of the three outcomes. The old refusal was gated the same
    // way, for the milder version of the same reason.
    //
    // AND TWO PRESSES REACH THIS, not one. The obvious caller is the bone at
    // the window. The other is the CHOICE CARD'S BUILD, which runs fireBuild
    // first and falls through to here when it answers false (:4204) -- a
    // drafter whose traced loop is already built presses BUILD, there is
    // nothing left to raise from his outline, and the premade design is what
    // the order round is for. That second press lands on a file that by
    // definition already holds the house he just built, so it is the one most
    // likely to meet this offer. Worth naming because the fall-through is
    // easy to miss: nothing at the card says it leads here.
    const raisesABuilding = picked?.entry?.needsSize
      || !!window.DraftPremadePlans?.planFor(picked?.entry?.id);
    if (raisesABuilding && window.DraftBuildingBodies.hasBuilding(drawing)) {
      buildInAFreshFile();
      // FALSE BECAUSE NOTHING IS BUILT YET. The dialog is up and the order
      // fires from its answer -- or never, if the drafter cancels -- so this
      // press has placed none, which is what the caller is asking about.
      return false;
    }
    fireOrder();
    return true;
  };
  document.getElementById('dt-bone').addEventListener('click', orderAtWindow);

  // ── THE BONE'S SECOND PRESS ──────────────────────────────────────────
  //
  // Movie, 19 Sep, ruling on the collision between two of his own rules:
  // "go with the 19 sep rule, on 1st press go to drivethru questions and on
  // 2nd always offer choice between drivetrhu or house build". So a press
  // with the board down NEVER builds straight off any more -- not even with
  // an outline traced, which is what his 18 Sep instruction asked for and
  // what this retires.
  //
  // WHAT THE CARD NAMES IS THE ENTRY'S OWN LABEL, out of build-menu.js:
  // "1 STOREY", "2 STOREY + GARAGE + ROOM OVER", "MODIFIED BILEVEL" --
  // Movie's own words for these houses, already written down once. The
  // FAMILY is prefixed only for the detached garage, whose entries are named
  // for their FOUNDATION ("THICKENED EDGE") and say nothing about what is
  // being built on their own.
  const buildChoice = document.getElementById('build-choice');
  const queuedHouseLabel = () => {
    const picked = chosen();
    if (!picked?.entry) return '';
    return picked.entry.needsSize
      ? `${picked.family?.label || 'DETACHED GARAGE'} \u00b7 ${picked.entry.label}`
      : picked.entry.label;
  };
  const closeBuildChoice = () => { buildChoice.hidden = true; };
  const openBuildChoice = () => {
    buildChoice.querySelector('[data-build-choice-house]').textContent =
      queuedHouseLabel();
    buildChoice.hidden = false;
    buildChoice.querySelector('[data-build-choice-build]').focus();
  };
  buildChoice.querySelector('[data-build-choice-change]')
    .addEventListener('click', () => { closeBuildChoice(); callSign(boneFoot, 'menu'); });
  buildChoice.querySelector('[data-build-choice-build]')
    .addEventListener('click', () => {
      closeBuildChoice();
      // HIS OWN OUTLINE FIRST, which is where the 18 Sep instruction went
      // rather than being dropped: a drafter who traced a shape and picked a
      // type gets the house on that shape. fireBuild answers false when
      // there is nothing traced to build from, and the premade design is
      // what the order round is for.
      if (fireBuild()) return;
      orderAtWindow();
    });
  // Escape backs out, as it does from every other card on this page. It
  // CHANGES NOTHING -- the type stays picked and the next press asks again.
  buildChoice.addEventListener('keydown', event => {
    if (event.key !== 'Escape') return;
    event.stopPropagation();
    closeBuildChoice();
    boneFoot.focus();
  });
  // Escape shuts the sign, as it shuts every other thing this page puts over
  // the drawing. Captured before the drawing's own Escape so an open sign is
  // not also a cleared selection.
  document.addEventListener('keydown', event => {
    if (event.key !== 'Escape' || signShut()) return;
    event.stopPropagation();
    setSign(false);
    boneFoot.focus();
  }, true);

  // ── the per-tool properties slot ──────────────────────────────────────────
  // THE CONTRACT, for Gilligan, written so it can be built against without
  // reading anything below it:
  //
  //   window.ModelProps.set(title, node)   puts `node` in the right panel
  //                                        under `title` and shows the slot.
  //   window.ModelProps.clear()            empties it and hides the slot.
  //   window.ModelProps.slot()             the element, if something would
  //                                        rather append to it directly.
  //
  // WHAT THE SHELL PROMISES: the slot exists whenever the page has a drawing,
  // it sits under the view rail in the right panel, and it is hidden while
  // empty so a shut-looking panel never has an empty PROPERTIES heading in it.
  // Opening the right panel is the caller's business, not the slot's -- a tool
  // arming should not yank a panel open under a drafter who closed it.
  //
  // WHAT IT DOES NOT DO: it holds no state, reads no tool, and knows nothing
  // about beams, columns, fixtures or annotations. The armed tool decides what
  // goes here and when; this only owns the space and the show/hide.
  const propsSlot = document.getElementById('props-slot');
  const propsBox = document.getElementById('props-box');
  const propsFold = propsBox.querySelector('[data-props-fold]');

  // FOLDED IS IN THE URL, beside `left` and `right`, for the reason those
  // are: it is what the drafter is looking at and it survives a reload.
  //
  // DEFAULT OPEN, and the absent-means-open spelling is deliberate. A drafter
  // who has just pressed a wall wants to see what he pressed; the box has to
  // earn being shut rather than be shut until asked. `props=0` is the only
  // value that means anything, so a stale or hand-typed URL opens.
  const propsFolded = () => params.get('props') === '0';
  const syncPropsFold = () => {
    propsBox.toggleAttribute('data-folded', propsFolded());
    propsFold.setAttribute('aria-expanded', String(!propsFolded()));
  };
  propsFold.addEventListener('click', () => {
    if (propsFolded()) params.delete('props'); else params.set('props', '0');
    syncUrl();
    syncPropsFold();
  });
  syncPropsFold();

  window.ModelProps = Object.freeze({
    slot: () => propsSlot,
    clear: () => {
      propsSlot.replaceChildren();
      propsSlot.hidden = true;
      // THE BOX GOES WITH ITS CONTENTS. An empty box would leave a PROPERTIES
      // heading and a fold arrow under the tools with nothing behind them --
      // a control that does nothing, which is the same lie a stale panel is.
      propsBox.hidden = true;
    },
    set: (title, node) => {
      propsSlot.replaceChildren();
      if (title) {
        const head = document.createElement('div');
        head.className = 'props-title';
        head.textContent = title;
        propsSlot.append(head);
      }
      if (node) propsSlot.append(node);
      propsSlot.hidden = !(title || node);
      propsBox.hidden = propsSlot.hidden;
    },
  });

  // THE LEVEL AND VIEW PICKERS ARE GONE (§7). They were the chrome bar's two
  // SELECTs and the panel's cards were the second way to do the same two
  // things -- one piece of state with two controls on it, which is the drift
  // this page has paid for repeatedly. The panel is the survivor because it
  // says MORE: the layer rows, the datum, the colours, ADD and DELETE. The
  // one thing the pickers had over it was that they were reachable with the
  // rail shut, and the LEVELS / LAYERS tab answers that now: one press opens
  // the panel, the same one press the pickers cost.
  const levelsPanel = document.getElementById('levels-panel');
  const fileRow = document.getElementById('file-row');

  // UNITS. The page already reads `drawing.units` everywhere it prints a
  // length -- `drawing?.units !== 'metric'` is the test, in seven places --
  // so the control is the one thing that was missing, not the plumbing.
  // WHAT IT DOES NOT DO: re-snap the geometry. MODEL.dc.html's _setUnits
  // moves the drawing onto the other system's increments; here the feet in
  // the file are the truth and the unit is how they are READ, so switching
  // changes no coordinate. That is a smaller promise than the old page's and
  // it is the one this page can keep -- a re-snap that rounded a permit
  // drawing's walls on a button press is the opposite of what Movie asked
  // the foot light for.
  //
  // TWO BUTTONS NOW, NOT ONE (Movie, 15 Sep), and the shading is what makes
  // that safe to say: with a toggle, the label had to carry the state,
  // which is why it read "UNITS: IMPERIAL" rather than "IMPERIAL". Two
  // buttons name the two systems and the accent says which is in force, so
  // neither label has to do a second job. Each is a SET, not a toggle --
  // pressing IMPERIAL while imperial is in force does nothing, where a
  // toggle pressed twice by a slipping thumb changed the drawing.
  const unitButtons =
    [...document.querySelectorAll('#units-corner button[data-units]')];
  const metric = () => drawing?.units === 'metric';
  const paintUnits = () => {
    unitButtons.forEach(b => b.setAttribute('aria-pressed',
      String((b.dataset.units === 'metric') === metric())));
  };
  unitButtons.forEach(b => b.addEventListener('click', () => {
    if (!drawing) return;
    const wanted = b.dataset.units === 'metric';
    if (wanted === metric()) return;
    drawing.units = wanted ? 'metric' : 'imperial';
    markDirty();
    paintUnits();
    paint();
  }));

  // replaceState, not pushState: a switch is a change of viewpoint, not a
  // navigation, and forty pushes would bury whatever page the drafter came
  // from under forty presses of Back.
  const syncUrl = () => {
    const query = params.toString();
    history.replaceState(null, '',
      query ? `${location.pathname}?${query}` : location.pathname);
  };

  // THE PANEL IS A VIEW OF `drawing.levels`, never a second copy of it. Every
  // row here drives goToLevel / goToView -- the same two entry points the
  // pickers use -- so the card, the seat, the picker and the plan cannot
  // disagree about what is active. That is the seam Devin drew between this
  // panel and the tool column: the panel owns the level/view state and
  // everything else reads it.
  //
  // The layer rows come from layerViewsForLevelId and are NOT hard-coded.
  // ROOF and SITE answer with none, which is why their cards carry no rows --
  // the same fact that puts them in one rail row together rather than two.
  // COPIED FROM MODEL.dc.html:2292, not remembered. Its own comment records
  // why it is one list: fenestrations, fixtures, stairs, notes and roomTags
  // were each missing from the delete at some point, so deleting a level left
  // its doors, windows, appliances, stairs, annotations and room names behind
  // -- pointing at a level id that no longer existed, invisible on every
  // level, and carried through save after save. Retyping it from memory is
  // how that happens a second time.
  //
  // NOT here, deliberately and for the old page's reasons: boneyardOutlines
  // (the master is storage, not a level), groups (membership spans levels and
  // is cleaned below), and cuts (owned by level id, handled separately).
  const LEVEL_OWNED_COLLECTIONS = [
    'lines', 'walls', 'floors', 'shapes', 'roofs', 'outlines',
    'surfaceOpenings', 'dimensions', 'columns', 'beams',
    'fenestrations', 'fixtures', 'stairs', 'notes', 'roomTags',
    'electricDevices', 'underlays',
  ];

  // ADD A LEVEL — MODEL.dc.html:9850 `_addLevel`, carried rather than invented.
  // The elevation it suggests is the assembly below plus its floor sandwich,
  // NOT a round 9': a suggestion that disagrees with the construction the
  // level cards already show is worse than no suggestion.
  const addLevel = () => {
    if (!drawing) return;
    const LV = window.DraftLayerViews;
    const LA = window.DraftLevelAssembly;
    const floors = LV.floorLevels(drawing.levels || []);
    const count = floors.length + 1;
    const suggestedName = `${count === 1 ? '1ST' : count === 2 ? '2ND'
      : count === 3 ? '3RD' : `${count}TH`} FL`;
    const name = window.prompt('Level name:', suggestedName);
    if (name === null) return;
    const topFloor = floors[floors.length - 1];
    const assemblyOf = id => LA.levelAssemblyFor(drawing.levelAssemblies, id);
    const suggestedElev = topFloor
      ? Math.round(((Number(topFloor.elev) || 0)
        + assemblyOf(topFloor.id).wallHeightFt
        + LA.levelFloorFt(assemblyOf(topFloor.id))) * 10000) / 10000
      : 0;
    const elevRaw = window.prompt(
      topFloor
        ? `Elevation in feet, top of this floor (negative = below grade).\n`
          + `Suggested: ${suggestedElev} — ${topFloor.name} wall + floor.`
        : 'Elevation in feet (negative = below grade):',
      String(suggestedElev));
    if (elevRaw === null) return;
    const elev = parseFloat(elevRaw);
    if (Number.isNaN(elev)) return;

    const id = Number.isInteger(drawing.nextLevelId) ? drawing.nextLevelId : 1;
    const level = { id, name: String(name).toUpperCase().trim(), elev, visible: true };
    // Every regular level carries a copy of each BONEYARD master outline, so a
    // freshly added floor starts with the inherited geometry rather than bare.
    //
    // LINKED, AND WITH ITS OWN POINTS. This read
    //
    //   drawing.outlines.push({ ...master, id: ..., levelId: id });
    //
    // and was wrong twice, in opposite directions that hid each other.
    //
    // NO LINK. The copy carried no masterId and its points no srcId, so
    // nothing could find it again. _propagateMasterOutline (MODEL.dc.html:
    // 12057) selects copies by `outline.masterId === master.id` and then each
    // point by `point.srcId`; with both null the ported propagation would have
    // moved NOTHING, on every drawing this page has ever made -- and a check
    // for it would have passed by finding no work to do. That is the order's
    // "the master is a stamp, not a governor", measured.
    //
    // AND TOTAL ALIASING. `{ ...master }` is a shallow spread, so the copy and
    // the master shared ONE points array. Moving a corner on the second floor
    // moved the master and therefore every other floor -- not by propagation
    // but by there only ever being one set of coordinates, which also makes a
    // per-level override impossible to express.
    //
    // offX/offZ start at ZERO because the copy starts coincident, and
    // relinkVertex re-measures them on every drag. That is the same
    // srcId/offset contract the dimension ends, beams and columns already use.
    (drawing.boneyardOutlines || []).forEach(master => {
      drawing.outlines = drawing.outlines || [];
      drawing.outlines.push({
        ...master,
        id: newDrawingItemId('outline'),
        levelId: id,
        masterId: master.id,
        shelfId: undefined,          // a level copy is not shelf storage
        overriddenSrcIds: [],
        points: (master.points || []).map(pt => ({
          ...pt,
          id: undefined,             // the copy's point is not the master's
          srcId: pt.id,
          offX: 0,
          offZ: 0,
        })),
      });
    });
    // ABOVE THE TOP FLOOR AND BELOW ROOF, which is where the old page stacks a
    // new storey -- levels are stored top-down, so that is the top floor's own
    // index rather than the end of the list.
    const levels = [...(drawing.levels || [])];
    const insertIdx = topFloor
      ? levels.findIndex(entry => entry.id === topFloor.id)
      : levels.length;
    levels.splice(insertIdx < 0 ? levels.length : insertIdx, 0, level);
    drawing.levels = levels;
    drawing.nextLevelId = id + 1;
    markDirty();
    buildChrome();
    paint();
    return level;
  };

  // DELETE A LEVEL — MODEL.dc.html:9895 `_deleteLevel`. It does not refuse and
  // does not orphan: it confirms, then takes everything the level owned.
  const deleteLevel = levelId => {
    if (!drawing) return false;
    const levels = drawing.levels || [];
    if (levels.length <= 1) { window.alert('Cannot delete the last level.'); return false; }
    const idx = levels.findIndex(level => Number(level.id) === Number(levelId));
    if (idx < 0) return false;
    if (!window.confirm(`Delete level "${levels[idx].name}"? `
      + 'Geometry on this level will be removed.')) return false;

    // PENDING GEOMETRY BELONGS TO THE FLOOR IT WAS STARTED ON. Discard it
    // before the level list changes, or a half-drawn wall commits into
    // whichever floor the page lands on next.
    //
    // THIS WAS `setArmed(false)` AND THE MERGE THAT BROKE IT WAS CLEAN. The
    // tool register replaced the armed boolean, and setArmed went with it;
    // this call arrived from a branch written against the old shape, in a
    // region of the file neither side had touched, so git had nothing to
    // report. The line threw, deleteLevel stopped at its first statement, and
    // a level "deleted" with all its geometry still in the file -- which is
    // why tests/model-html-levels.spec.js's cascade check is worth its length.
    // setTool does what setArmed did and clears the pending anchor too, which
    // is what the paragraph above is actually asking for.
    setTool(RESTING_TOOL);
    const id = Number(levels[idx].id);
    // ASKED BEFORE THE LEVEL IS REMOVED, and that ordering is the whole of it.
    // Asking afterwards returns the FALLBACK -- activeLevelId drops to MAIN FL
    // and then to the first level when `?level=` names one that is gone -- so
    // the test "am I standing on the level being deleted" was never true and
    // the URL went on naming a level the drawing no longer had.
    const wasStandingHere = activeLevelId() === id;

    const droppedUnderlays = (drawing.underlays || []).filter(u => u && u.levelId === id);
    const goneIds = new Set();
    LEVEL_OWNED_COLLECTIONS.forEach(field => {
      if (!Array.isArray(drawing[field])) return;
      drawing[field].forEach(item => { if (item && item.levelId === id) goneIds.add(String(item.id)); });
      drawing[field] = drawing[field].filter(item => !item || item.levelId !== id);
    });
    // An underlay's PICTURE lives outside the drawing, in its own bucket keyed
    // by the underlay id, so dropping the record is only half of it -- the
    // bytes would sit in the browser profile for ever with nothing pointing at
    // them.
    droppedUnderlays.forEach(underlay => {
      window.SharedFileStore?.removeNamedFile?.(underlay.id, 'underlays')
        ?.catch(error => console.warn('Underlay binary removal failed:', error));
    });
    // Cuts are owned by a level id, not by elevation: two levels can sit at the
    // same height, so only this level's own sections go with it.
    if (Array.isArray(drawing.cuts)) {
      drawing.cuts = drawing.cuts.filter(cut => cut && cut.levelId !== id);
    }
    // Groups reference members by {type, id} and can span levels, so they are
    // cleaned rather than dropped -- and a group left holding a dead id would
    // adopt the next item given that id, which is the fault the wall cascade
    // above already guards.
    if (Array.isArray(drawing.groups)) {
      drawing.groups.forEach(group => {
        if (group && Array.isArray(group.members)) {
          group.members = group.members.filter(m => m && !goneIds.has(String(m.id)));
        }
      });
      drawing.groups = drawing.groups.filter(g => g && Array.isArray(g.members) && g.members.length >= 2);
    }
    drawing.backgroundLevelIds = (drawing.backgroundLevelIds || []).filter(x => Number(x) !== id);
    if (drawing.backgroundLevelViews && typeof drawing.backgroundLevelViews === 'object') {
      delete drawing.backgroundLevelViews[String(id)];
    }
    drawing.levels = levels.filter((_, i) => i !== idx);

    // The drafter has to land somewhere real. If the level being deleted is
    // the one on screen, step to its neighbour rather than leaving `?level=`
    // pointing at a level that no longer exists.
    if (wasStandingHere) {
      const next = drawing.levels[Math.min(idx, drawing.levels.length - 1)];
      params.set('level', String(next.id));
      params.delete('view');
      syncUrl();
    }
    markDirty();
    buildChrome();
    paint();
    return true;
  };

  // WHICH ROW IS LIT, in one place. buildLevelsPanel draws the rows and this
  // lights them, so the rule lives once -- the level lookup having had four
  // homes (#325) is the reason that matters here rather than being tidy.
  const markActiveLayer = () => {
    if (!levelsPanel) return;
    const activeId = activeLevelId();
    const LV = window.DraftLayerViews;
    const asked = params.get('view');
    // A CUT IS A VIEW TOO. Standing in a section, no layer row is lit: the
    // section's own row carries the mark, and lighting FLOOR PLAN under a
    // painted section is the panel disagreeing with the canvas.
    const inCut = typeof asked === 'string' && asked.startsWith(CUT_VIEW);
    const live = !inCut && asked
      && LV.layerViewsForLevelId(activeId).some(v => v.id === asked)
      ? asked : LV.defaultLayerViewId(activeId);
    // THIS PASS OWNS `data-active`, and that is why the boneyard is named in
    // it rather than lighting itself during the build. It runs over EVERY
    // .lv-card and .lv-layer after buildLevelsPanel, so a card that set the
    // attribute on itself a moment earlier has it taken straight back off --
    // which is exactly what the boneyard card did for an hour: `toggleAttribute
    // ('data-active', true)` ran, under a condition measured true, and the
    // attribute was gone by the time anything could read it.
    //
    // Two places deciding which row is lit is how the panel and the canvas
    // come to disagree. One place, and the boneyard is one of the things it
    // knows can be active.
    levelsPanel.querySelectorAll('.lv-layer').forEach(row => {
      if (row.dataset.shelf !== undefined) {
        row.toggleAttribute('data-active',
          boneyardActive && Number(row.dataset.shelf) === activeShelfId());
        return;
      }
      if (row.dataset.viewRow) {
        row.toggleAttribute('data-active', row.dataset.viewRow === asked);
        return;
      }
      // A LEVEL'S LAYER ROW IS NEVER LIT ON THE BONEYARD. Without this the
      // panel shows MAIN FL's FLOOR PLAN lit while the canvas draws a shelf.
      row.toggleAttribute('data-active',
        !inCut && !boneyardActive && row.dataset.layer === `${activeId}:${live}`);
    });
    levelsPanel.querySelectorAll('.lv-card').forEach(card => {
      if (card.dataset.boneyard !== undefined) {
        card.toggleAttribute('data-active', boneyardActive);
        return;
      }
      card.toggleAttribute('data-active',
        !boneyardActive && Number(card.dataset.level) === activeId);
    });
  };

  const buildLevelsPanel = () => {
    if (!levelsPanel) return;
    const levels = drawing?.levels || [];
    const LV = window.DraftLayerViews;
    const activeId = activeLevelId();
    levelsPanel.innerHTML = '';
    if (!levels.length) return;

    const head = document.createElement('div');
    head.className = 'lv-head';
    const title = document.createElement('div');
    title.className = 'lv-head-title';
    title.textContent = 'Levels';
    const datum = document.createElement('div');
    datum.className = 'lv-datum';
    // The old page's DATUM readout. It reads the stored elevationDatum rather
    // than assuming 0, because a drafter who has moved it would otherwise see
    // a panel confidently disagreeing with his own drawing.
    datum.textContent = `DATUM ${Number(drawing?.elevationDatum || 0)}'`;
    const add = document.createElement('button');
    add.type = 'button';
    add.className = 'lv-add';
    add.dataset.addLevel = '';
    add.textContent = '+ ADD';
    add.title = 'Add a level above the top floor';
    add.addEventListener('click', addLevel);
    head.append(title, datum, add);
    levelsPanel.append(head);

    levels.forEach(level => {
      const card = document.createElement('div');
      card.className = 'lv-card';
      card.dataset.level = String(level.id);
      if (Number(level.id) === activeId) card.toggleAttribute('data-active', true);

      const bar = document.createElement('div');
      bar.className = 'lv-bar';
      bar.style.background = level.color || 'var(--rule)';

      const body = document.createElement('div');
      body.className = 'lv-body';

      const name = document.createElement('button');
      name.type = 'button';
      name.className = 'lv-name';
      // `data-level-row`, and it stays that way now that the chrome bar's
      // select is gone: these rows are THE way to change level, and a name
      // that once collided with the select is the name every spec drives.
      name.dataset.levelRow = String(level.id);
      // THE NUMBERED NAME, derived rather than stored -- level-assembly.js's
      // levelLabel. The record keeps whatever it was saved with, so a file is
      // byte-identical either side of this and every lookup by stored name
      // goes on working; only what the drafter READS changes.
      const label = levelLabel(level.id, level.name);
      name.textContent = label;
      name.title = `Switch to ${label}`;
      name.addEventListener('click', () => goToLevel(level.id));

      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'lv-del';
      del.dataset.deleteLevel = String(level.id);
      del.textContent = '×';
      del.title = `Delete ${label}`;
      del.addEventListener('click', event => {
        event.stopPropagation();
        deleteLevel(level.id);
      });

      const headRow = document.createElement('div');
      headRow.className = 'lv-card-head';
      headRow.append(name, del);
      body.append(headRow);

      const views = LV.layerViewsForLevelId(level.id);
      if (views.length) {
        const stack = document.createElement('div');
        stack.className = 'lv-layers';
        views.forEach(view => {
          const row = document.createElement('button');
          row.type = 'button';
          row.className = 'lv-layer';
          row.dataset.layer = `${level.id}:${view.id}`;
          row.textContent = view.label || view.id;
          row.addEventListener('click', () => {
            if (Number(level.id) !== activeId) goToLevel(level.id);
            goToView(view.id);
          });
          stack.append(row);
        });
        body.append(stack);
      }

      card.append(bar, body);
      levelsPanel.append(card);
    });

    // ── ELEVATIONS ──────────────────────────────────────────────────────────
    // Real, and the same four the rail seats: autoElevationCuts is the one
    // home for that derivation, so the panel and the seats cannot disagree
    // about which elevations exist or what they are called.
    const section = (label, extra) => {
      const wrap = document.createElement('div');
      wrap.className = 'lv-head';
      wrap.style.marginTop = '8px';
      const t = document.createElement('div');
      t.className = 'lv-head-title';
      t.textContent = label;
      wrap.append(t);
      if (extra) wrap.append(extra);
      levelsPanel.append(wrap);
      return wrap;
    };
    const rowButton = (text, title, onClick, active) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'lv-layer';
      b.textContent = text;
      b.title = title;
      if (active) b.toggleAttribute('data-active', true);
      if (onClick) b.addEventListener('click', onClick);
      else b.disabled = true;
      levelsPanel.append(b);
      return b;
    };

    section('Elevations');
    const viewNow = params.get('view');
    autoElevationCuts().forEach(cut => {
      rowButton(`${cut.id} · ${elevationName(cut.id)}`,
        `${cut.id} — the ${elevationName(cut.id)} elevation; tap to bring it center`,
        () => goToView(CUT_VIEW + cut.id),
        viewNow === CUT_VIEW + cut.id).dataset.viewRow = CUT_VIEW + cut.id;
    });

    // ── SECTIONS ────────────────────────────────────────────────────────────
    const stored = cuts();
    // + CUT, AND NOT A KEY. The old page's hint is "Press [C] to cut a view",
    // and `cut: 'C'` is in DEFAULT_KEYBINDINGS to this day -- but this page
    // binds no tool letters at all, and a cut a drafter can only reach from a
    // keyboard is no cut on the iPad at the counter. The button is the
    // affordance; the letter can follow it whenever the keypad does.
    //
    // It sits in the SECTIONS head beside its own list, where + ADD sits for
    // levels and + SHELF for the boneyard -- the place a drafter already looks
    // to make one more of the thing under it.
    const cutBtn = document.createElement('button');
    cutBtn.type = 'button';
    cutBtn.className = 'lv-add';
    cutBtn.dataset.addCut = '';
    cutBtn.textContent = '+ CUT';
    cutBtn.title = 'Cut a section — press the two ends of the line, then the '
      + 'side you want to look from';
    cutBtn.addEventListener('click', event => { event.stopPropagation(); armCut(); });
    section('Sections', cutBtn);
    if (!stored.length) {
      // THIS SAID "This page has no cut tool -- sections are cut in LAYOUT",
      // which was true when it was written and is not any more. An empty state
      // is the one piece of text a drafter reads when nothing else is on
      // screen, so it names the gesture rather than an absence.
      const none = document.createElement('div');
      none.className = 'lv-empty';
      none.dataset.noSections = '';
      none.textContent = 'No sections yet. Press + CUT, then the two ends of the '
        + 'line and the side to look from.';
      levelsPanel.append(none);
    }
    stored.forEach(cut => {
      const row = document.createElement('div');
      row.className = 'lv-card-head';
      const b = rowButton(cut.name || cut.id,
        `${cut.name || cut.id} — tap to bring this section center`,
        () => goToView(CUT_VIEW + cut.id),
        viewNow === CUT_VIEW + cut.id);
      b.dataset.viewRow = CUT_VIEW + cut.id;
      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'lv-del';
      del.dataset.deleteCut = String(cut.id);
      del.textContent = '×';
      del.title = `Delete ${cut.name || cut.id}`;
      del.addEventListener('click', event => {
        event.stopPropagation();
        if (!window.confirm(`Delete section "${cut.name || cut.id}"?`)) return;
        drawing.cuts = cuts().filter(c => c.id !== cut.id);
        // A drafter looking AT the section being deleted has to be moved off
        // it, or the page keeps painting a cut the drawing no longer has.
        if (params.get('view') === CUT_VIEW + cut.id) {
          params.delete('view');
          syncUrl();
        }
        markDirty();
        buildChrome();
        paint();
      });
      b.style.flex = '1';
      levelsPanel.removeChild(b);
      row.append(b, del);
      levelsPanel.append(row);
    });

    // ── THE BONEYARD ────────────────────────────────────────────────────────
    // THIS READ "LISTED, NOT EDITED, and that is a ruling rather than an
    // omission" -- the shelf names printed as dead text because "the level
    // picker offers no negative pseudo-level, so there is nowhere for a new
    // shelf to be used. '+ SHELF' would write a shelf into the file that this
    // page can never open." That reasoning was exactly right and is now spent:
    // activeLevelId() answers -shelfId, so there IS somewhere for a shelf to
    // be used, and a wall parked on one survives the reload (c8654eb).
    //
    // Movie ruled it back on, 14 Sep: "yes boneyard should be working so i can
    // copy and paste stuff in there that won't show on the plan".
    //
    // PINNED LAST, and that is a rule rather than an accident of order: a
    // basement added beneath the foundation lands ABOVE this card, because
    // the boneyard is not a storey. Built after the level loop for exactly
    // that reason, and acceptance 7 asserts it by POSITION -- a row that
    // sorts last in the markup but paints halfway up is still wrong.
    const shelfList = shelves();
    section('Boneyard');
    const bone = document.createElement('div');
    bone.className = 'lv-card';
    bone.dataset.boneyard = '';
    if (boneyardActive) bone.toggleAttribute('data-active', true);
    bone.title = 'BONEYARD — shelf storage: geometry parks in its exact '
      + 'position, never prints';

    const boneHead = document.createElement('div');
    boneHead.className = 'lv-head';
    const boneName = document.createElement('div');
    boneName.className = 'lv-head-title';
    boneName.textContent = 'BONEYARD';
    const plus = document.createElement('button');
    plus.type = 'button';
    plus.className = 'lv-add';
    plus.dataset.addShelf = '';
    plus.textContent = '+ SHELF';
    // DC'S OWN TOOLTIP, which states the reason shelves exist at all rather
    // than what the button does: a drafter who cannot see why he would want a
    // second shelf never presses it.
    plus.title = 'Add a shelf — park geometry at the same spot on different '
      + 'shelves without overlap';
    plus.addEventListener('click', event => { event.stopPropagation(); addShelf(); });
    boneHead.append(boneName, plus);
    bone.append(boneHead);
    bone.addEventListener('click', () => goToBoneyard());
    levelsPanel.append(bone);

    shelfList.forEach(shelf => {
      const row = document.createElement('button');
      row.type = 'button';
      row.className = 'lv-layer';
      row.dataset.shelf = String(shelf.id);
      if (boneyardActive && Number(shelf.id) === activeShelfId()) {
        row.toggleAttribute('data-active', true);
      }
      row.textContent = shelf.name || `SHELF ${shelf.id}`;
      row.title = `Show only ${shelf.name || `SHELF ${shelf.id}`} — each shelf `
        + 'keeps its own geometry';
      row.addEventListener('click', event => {
        event.stopPropagation();
        goToBoneyard(Number(shelf.id));
      });
      levelsPanel.append(row);
    });

    markActiveLayer();
  };

  // THE ONE REBUILD, and it is now the panel's. Everything that used to call
  // buildChrome() to re-fill two SELECTs calls it to redraw the cards, which
  // is the same job with one control left instead of three.
  const buildChrome = () => {
    buildLevelsPanel();
    paintUnits();
    if (fileRow) fileRow.hidden = false;
    // THE WRITE BUTTONS COME ALIVE WITH THE THING THEY WRITE, and here rather
    // than in the loader because a drawing arrives two ways -- stored on
    // arrival, and NEW/OPEN once the page is up -- and only one of them used
    // to say so. The lease painter may put them straight back down if
    // another page holds the file: something to save first, permission to
    // save second.
    const saveAsButton = document.getElementById('file-save-as');
    if (saveButton) saveButton.disabled = !drawing;
    if (saveAsButton) saveAsButton.disabled = !drawing;
  };

  // ONE WAY INTO THE BONEYARD, and one way out. The card and every shelf row
  // come through here, so the panel, the plan and what a new wall is stamped
  // with cannot disagree about where the drafter is.
  //
  // CHANGES WHAT IS LOOKED AT AND, WHEN THE SHELF MOVES, ONE THING THAT IS
  // SAVED. Which shelf is active is a fact about the drawing -- reopen it
  // tomorrow and the shelf you were working on is the one you get -- so a
  // shelf switch marks dirty. Being ON the boneyard is not saved at all, the
  // same call DC makes at :5606.
  const goToBoneyard = (shelfId = null) => {
    const want = shelfId === null ? activeShelfId() : Number(shelfId);
    const moved = drawing && Number(drawing.activeBoneyardShelfId) !== want;
    if (drawing && moved) { drawing.activeBoneyardShelfId = want; markDirty(); }
    boneyardActive = true;
    // A HALF-TAKEN GESTURE DOES NOT FOLLOW YOU ACROSS, which is the same rule
    // Escape enforces and the same one DC applies on _selectBoneyard (:9). A
    // run begun on MAIN FL and finished on a shelf would weld two workspaces
    // together through one wall.
    drawStart = null;
    pendingBone = null;
    selection = [];
    buildChrome();
    paint();
  };

  const addShelf = () => {
    if (!drawing) return;
    const list = shelves();
    // THE ALLOCATOR IS STORED, not `list.length + 1`. Delete SHELF 2 of three
    // and the count says 2 while SHELF 3 still holds geometry; the next shelf
    // would take an id that is already an owner and adopt that geometry on
    // sight. Same family as the duplicate-id bug #392 paid for.
    const next = Math.max(
      Number.isInteger(drawing.nextBoneyardShelfId) ? drawing.nextBoneyardShelfId : 1,
      ...list.map(s => Number(s.id) + 1), 2);
    drawing.boneyardShelves = [...list, { id: next, name: `SHELF ${next}` }];
    drawing.nextBoneyardShelfId = next + 1;
    drawing.activeBoneyardShelfId = next;
    markDirty();
    boneyardActive = true;
    buildChrome();
    paint();
  };

  const goToLevel = id => {
    // LEAVING THE BONEYARD IS PART OF ARRIVING AT A LEVEL. Without this the
    // card stays lit while the plan shows MAIN FL, and the two readouts the
    // drafter has disagree about where he is.
    boneyardActive = false;
    params.set('level', String(id));
    // THE VIEW IS KEPT WHERE THE NEW LEVEL HAS IT, dropped where it does not.
    // MAIN FL and 2ND FL share the same four views, so a drafter comparing
    // one floor's electrical plan with the next stays on ELECTRIC rather than
    // being thrown back to walls at every switch. FOUNDATION has no 'stair',
    // so arriving there falls to that level's own default -- and dropping the
    // parameter is how it falls, since leaving a stale `?view=stair` in the
    // URL would make activeViewId() warn about a view the level never had.
    const views = window.DraftLayerViews.layerViewsForLevelId(Number(id));
    const asked = params.get('view');
    if (!asked || !views.some(view => view.id === asked)) params.delete('view');
    syncUrl();
    buildChrome();
    refreshToolPropsOnLevel();
    paint();
  };

  // ONE WAY INTO A VIEW, for the picker and for a seat press. Both change
  // what is looked at and nothing that is saved: a query parameter and a
  // repaint, with `drawing` untouched and markDirty uncalled.
  const goToView = viewId => {
    params.set('view', viewId);
    syncUrl();
    // No buildChrome(): the level did not change, so the cards are still
    // right. What DOES have to move is which row is lit -- a layer row
    // clicked on another level once moved the URL and the plan to STAIR
    // while the panel went on lighting PLAN, because goToLevel rebuilt the
    // panel before goToView had set the view. Two answers on screen at once,
    // which is the fault this page keeps having to be shown.
    markActiveLayer();
    paint();
  };

  // ── the view rail ─────────────────────────────────────────────────────────
  // SIX SEATS, ALWAYS SIX. The rail shows E1-E4 and S1-S2 whether or not those
  // views exist, because a seating chart with gaps in it is a worse answer to
  // "what can I look at" than one with empty chairs.
  //
  // THE PAIRING IS THE OLD PAGE'S. MODEL.dc.html fills two columns across:
  // E1|E3, then E2|E4 (:7266-7267), and the section seats side by side at the
  // bottom (:7281-7290). Reading down a column would put E1 above E2, which is
  // not where a drafter who knows that rail expects to find them.
  // THE FULL CHART, IN MOVIE'S ORDER (12 Sep), so the six below are the front
  // of a list rather than a list of their own:
  //
  //     1. the four elevations          E1|E3 over E2|E4        <- built
  //     2. ROOF PLAN and SITE PLAN
  //     3. the floor plans, level by level
  //     4. the sections                 S1|S2                   <- built
  //     5. the electric plan
  //
  // It is NOT MODEL.dc.html's order, which runs the sections last after every
  // plan (:7281). Sections sit ahead of the electric plan here because that is
  // where Movie wants to find them. Rows 2, 3 and 5 are not built; when they
  // are, they go between these two groups rather than after them, which is why
  // the order is written down now instead of inferred from the array later.
  // THE SEATING CHART IS DERIVED, not listed. MODEL.dc.html:7160
  // `_viewRailCards` walks `state.levels` to build it, and that is the whole
  // reason the LEVELS / LAYERS panel came first: add a level and two seats
  // appear, delete one and two leave. A fixed list of fourteen looks right on
  // Movie's bungalow today and is wrong the first time he adds a floor.
  //
  // Counted from the old page on proto/perf-bungalow.draft rather than taken
  // from the order, which said twelve -- it is twelve FILLED seats and two
  // empty section chairs, fourteen elements:
  //
  //     E1 · FRONT            E3 · BACK
  //     E2 · LEFT             E4 · RIGHT
  //     ROOF PLAN             SITE PLAN
  //     2ND FL PLAN (WALLS)   2ND FL LAYOUT (FLOOR)
  //     MAIN FL PLAN (WALLS)  MAIN FL LAYOUT (FLOOR)
  //     FOUNDATION            BASEMENT (WALLS)
  //     S1                    S2
  //
  // The rail is two columns, so the flat order is row-major: inner, outer,
  // inner, outer. SITE and ROOF are seated as a PAIR in row three rather than
  // getting a plan/layout row each, because layerViewsForLevelId answers with
  // none for them -- the same fact the panel shows by giving their cards no
  // layer rows.
  // ROOF is level 7 and SITE is level 8 -- MODEL.dc.html:7201 seats them by
  // id, and layer-views.js calls the pair WHOLE_LEVEL_IDS. By id rather than
  // by name, so renaming a level cannot empty the row; and if a drawing has
  // no ROOF, that seat is ABSENT rather than an empty chair, which is the old
  // page's own `push` skipping a falsy card.
  const ROOF_LEVEL_ID = 7, SITE_LEVEL_ID = 8;
  const seatingChart = () => {
    const LV = window.DraftLayerViews;
    const levels = drawing?.levels || [];
    const byId = id => levels.find(level => Number(level.id) === id) || null;
    const seats = [];
    const planSeat = (level, viewId, label) => {
      if (level) seats.push({ kind: 'plan', levelId: Number(level.id), viewId, label });
    };
    ['E1', 'E3', 'E2', 'E4'].forEach(id => seats.push({ kind: 'cut', name: id }));
    planSeat(byId(ROOF_LEVEL_ID), null, 'ROOF PLAN');
    planSeat(byId(SITE_LEVEL_ID), null, 'SITE PLAN');
    levels.forEach(level => {
      const views = LV.layerViewsForLevelId(level.id);
      if (!views.length) return;
      // THE FOUNDATION PAIR IS `foundation` AND `plan`, and the second one is
      // labelled BASEMENT (WALLS) -- there is no `basement` view id. Reading
      // the label as if it named a view is how this would have seated a blank.
      if (views.some(view => view.id === 'foundation')) {
        planSeat(level, 'foundation', 'FOUNDATION');
        planSeat(level, 'plan', 'BASEMENT (WALLS)');
      } else {
        const seatName = levelLabel(level.id, level.name);
        planSeat(level, 'plan', `${seatName} PLAN (WALLS)`);
        planSeat(level, 'floor', `${seatName} LAYOUT (FLOOR)`);
      }
    });
    // SECTIONS FILL ACROSS, with two chairs standing ready before anything is
    // cut (:7215). Padded to a minimum of two, not to an even number: the
    // rows above are balanced pairs, so appending in order is the old page's
    // "whichever column is shorter".
    const stored = cuts();
    for (let n = 0; n < Math.max(2, stored.length); n += 1) {
      seats.push({ kind: 'cut', name: `S${n + 1}` });
    }
    return seats;
  };

  const rail = document.getElementById('view-rail');
  let railEpoch = -1;
  let railFrame = null;
  // A PASS IN FLIGHT: the seats still to paint, the env they are being painted
  // against, and the total so far. One seat lands per frame, so a pass spans
  // several -- see repaintSeats for why, and for what that does NOT fix.
  let railQueue = null;
  let railPassEnv = null;
  let railPassMs = 0;

  // WHICH CUT SITS IN A SEAT. Elevations are looked up BY ID -- E3 is the back
  // of the house wherever it falls in the array. Sections are seated BY
  // POSITION, which is the old page's rule and not an oversight of mine: it
  // maps `cuts` across the seats in order (:7281), so the first stored cut
  // takes the first seat whatever the drafter named it.
  const seatFor = name => {
    if (name[0] === 'E') {
      const cut = autoElevationCuts().find(c => String(c.id) === name) || null;
      return {
        cut,
        label: cut ? cutLabel(cut) : `${name} · ${elevationName(name)}`,
        title: cut
          ? `${cut.name || name} — the ${elevationName(name)} elevation; tap to bring it center`
          // The old page's words for an empty elevation seat, and still true
          // here: nobody cuts these by hand, the house cuts them for you.
          : `${name} — this elevation cuts itself when the house builds`,
      };
    }
    const cut = cuts()[Number(name.slice(1)) - 1] || null;
    return {
      cut,
      label: cut ? cutLabel(cut) : name,
      // NOT the old page's "tap to cut a section into this screen". That seat
      // offers a creation gesture this page has not got yet (SPEC §3), and a
      // title promising a tap that does nothing is worse than a plain one.
      title: cut
        ? `${cut.name || name} — tap to bring this section center`
        : `${name} — cut a section on the plan and it takes this seat`,
    };
  };

  // ONE SPEC FOR EITHER KIND OF SEAT. A cut seat shows a section or an
  // elevation and a plan seat shows a level's drawing, but both answer the
  // same four questions -- what it is called, what it says on hover, whether
  // it is the view on screen, and where a press goes -- so the rail below
  // does not care which it is holding.
  const seatSpec = entry => {
