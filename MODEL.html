<!DOCTYPE html>
<!--
  MODEL.html — the framework-free model space, tier 1.

  This is the migration target. It is NOT wired into the site: index.html still
  points at MODEL.dc.html, which serves every user until this page earns the
  swap. Both live at root together on purpose, so the old page keeps running
  untouched while this one is filled in.

  Tier 1 asks one question and answers only that: can a page with no framework
  read the drawing MODEL.dc.html saved, and paint it with the same painters?

  The Write Tier begins here: SAVE writes the drawing back to the shared
  store, revision-guarded, through the same drawing-format rules the old page
  saves through. This page still edits nothing — a save re-emits what it
  loaded — so the deep-compare proof (tests/write-tier.spec.js) is what says a
  save through this page equals a save through the old one.

  What it carries, and why the list is this short: render-2d.js reaches for
  zero globals — every outside thing it needs arrives in an `env` object — so
  the wall painter costs exactly one dependency, wall-types.js.

  Load order is not cosmetic. Eight modules in this repo capture a global at
  module scope (`const geo = window.DraftGeometry2D;`), which binds at load
  time, so a dependency arriving later never helps. None of the four below do
  that — checked, not assumed — but the moment tier 2 adds one, order becomes
  load-bearing. See MIGRATION-STATUS.md.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<title>Rough Drafter — Model Space</title>
<!-- Self-hosted (see vendor/fonts.css): no third-party request on the
     drafter's behalf, and the OFL text ships beside the files. -->
<link rel="stylesheet" href="vendor/fonts.css" />
<style>
  :root {
    color-scheme: dark;

    /* TYPE, DECLARED ONCE ON PURPOSE.
       MODEL.dc.html carries 284 inline `font-family:` declarations and the
       site 391 across seven files, so changing the typeface there is 391
       edits and a find-and-replace through a 22,000-line file. Here it is
       three lines. When the faces are redesigned, this block is the change
       and every later tier inherits it.

       Barlow / Barlow Condensed / DM Mono are all SIL OFL and vendored in
       vendor/fonts/ with the licence beside them -- nothing is fetched
       from a CDN. Each stack keeps a real fallback so the page is legible
       before the woff2 lands, and if a face is ever swapped for one with
       different metrics the fallback is what a reader sees mid-swap. */
    --font-ui:   'Barlow Condensed', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono: 'DM Mono', ui-monospace, Menlo, Consolas, monospace;

    /* COLOUR IS NOT DECLARED HERE. palette.js writes every --role token onto
       this element at boot, because 92% of MODEL's colour is set from
       JavaScript (canvas fills, inline styles) and only a table both the
       stylesheet and the painters can read reaches all of it. The fallbacks
       below are the night skin, so the page is never unpainted between parse
       and boot -- and never a SECOND definition to keep in step, because
       palette.js overwrites all of them. See RD-DOCUMENTS/SPEC-skins.md. */
    --surface-page: #1d1f20;
    --surface-panel: rgba(20,22,23,0.82);
    --surface-chip: #2a2d2e;
    --edge-panel: #3a3d3f;
    --ink-primary: #e7e5e2;
    --ink-secondary: #b9bcbe;
    --ink-quiet: #8b8f92;
    --accent: #f0b429;
  }
  html, body { margin:0; height:100%; overflow:hidden;
    /* Two properties rather than the `background:` shorthand: its layer list
       parses differently with and without an image, and a skin that later
       defines --surface-page-tex should not have to re-learn that. */
    background-color: var(--surface-page); background-image: var(--surface-page-tex, none);
    font: 13px/1.45 var(--font-body);
    color: var(--ink-primary); }
  #plan { display:block; width:100%; height:100%; cursor:grab; touch-action:none; }
  #plan.dragging { cursor:grabbing; }
  /* Over a grabbable corner. Declared AFTER .dragging so it wins while a
     corner is actually being dragged -- equal specificity, later rule. */
  #plan.over-corner, #plan.over-wall { cursor:move; }

  /* THE COUNTERS READ AT THE TOP NOW (§7b). They used to sit above the strip
     at the foot of the sheet; the drive-thru sign rises from there and would
     cover the one panel a drafter reads while drawing. Third band down --
     instruments, then the mode corner and the file row, then this -- so the
     numbers never share a line with a control that can grow with a level
     name. */
  #readout { position:fixed; left:40px; top:var(--readout-top); z-index:5;
    background-color: var(--surface-panel); background-image: var(--surface-panel-tex, none);
    border:1px solid var(--edge-panel); border-radius:6px;
    padding:8px 11px; white-space:pre; pointer-events:none;
    /* Instrument text: tabular figures so the counts do not jitter as they
       change, and the mono face so a column of numbers reads as a column. */
    font-family: var(--font-mono); font-size:12px;
    font-variant-numeric:tabular-nums; letter-spacing:0.01em; }
  #readout b { color: var(--accent); font-weight:600; }

  #hint { position:fixed; right:12px; bottom:calc(var(--house-h) + 12px); z-index:5; color: var(--ink-quiet);
    font-family: var(--font-ui); font-size:12px; letter-spacing:0.04em;
    text-transform:uppercase; pointer-events:none; }

  /* THE INSTRUMENT STRIP — one bar across the HEAD of the page, the shape
     MODEL.dc.html:1963 carries: the message at the left and the drafting
     instruments holding the centre. PROJECT went to the page row at the
     lower left and the switches to the mode corner at the upper left, both
     by §7b; what is left here is only what the drafter READS.

     A CHIP HAS THREE STATES AND THEY MEAN DIFFERENT THINGS, which is the
     whole reason the old strip reads as an instrument panel rather than a
     toolbar. `.lit` is engaged. The base state is an instrument that exists
     and is down. `.dormant` is an instrument this page has NOT built — drawn
     at a quarter of the ink, not clickable, and carrying a title that says
     so. Dormant rather than absent because the old strip's spacing IS the
     panel: six instruments flanking the cluster is what makes the ruler and
     the T-square sit dead centre, and a bar that drops them re-centres
     itself every time one is built.

     It is the one place on this page that says what state the board is in,
     so the readout sits below it rather than under it. */
  /* ONE HOME FOR THE STRIP'S HEIGHT. It was 34px here and the hint's 46px
     was 34 + 12 written out by hand, so the bottom band's size lived in two
     literals that had to agree and nothing made them. They did not: the
     sidebars' height was tuned to a hint at bottom:12px, the strip moved it
     to 46, and the pairwise chrome check went red on `right-rail overlaps
     hint` -- its sixth catch, and the second one this file has produced from
     one distance being written down twice. */
  :root { --strip-h: 34px;
    /* THE HOUSE STRIP, along the foot: BUNGALOW / BILEVEL / DETACHED GARAGE /
       BONE and the one DELETE. Named for the same reason --strip-h is: the
       hint, the page row and both sidebars all stop above it, and that
       distance was written out by hand three times the last time this file
       had two bands. */
    --house-h: 40px;
    /* THE BAND THE SIDEBARS MUST STAY OUT OF at the foot: the house strip and
       the page row above it, which is one row of buttons plus its gaps. */
    --bottom-band: calc(var(--house-h) + 52px);
    /* THE TOP BANDS, top down: the instrument strip, then the mode corner and
       the file row, then the readout. Each derived from the one above it so a
       taller strip moves the lot rather than leaving two of them behind --
       the fault --strip-h was introduced to end. */
    --top-row-top: calc(var(--strip-h) + 8px);
    --readout-top: calc(var(--strip-h) + 48px);
    --rail-top: calc(var(--strip-h) + 108px); }
  /* AT THE TOP OF THE SHEET NOW, not the foot (§7b). Movie: the drive-thru
     sign rises from the bottom and covers the house row, so nothing the
     drafter reads WHILE DRAWING may live down there. */
  #strip { position:fixed; left:0; right:0; top:0; z-index:6; height:var(--strip-h);
    display:flex; align-items:center; gap:10px; padding:0 12px;
    background-color: var(--surface-panel); background-image: var(--surface-panel-tex, none);
    border-bottom:1px solid var(--edge-panel);
    font-family: var(--font-ui); font-size:12px; font-weight:600;
    letter-spacing:0.04em; color: var(--ink-secondary);
    user-select:none; }
  #strip a, #strip button { font:inherit; letter-spacing:inherit; }
  #strip .grow { flex:1; }
  #strip-message { font-size:11px; text-transform:uppercase;
    color: var(--ink-quiet); white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; max-width:24vw; }

  /* THE CLUSTER IS ABSOLUTELY CENTRED, not laid out between the two ends.
     Flexed between them it would slide left and right as the message text
     changes length, and a ruler that moves while you read a number is worse
     than one an inch off centre. */
  #strip-center { position:absolute; left:50%; top:0; height:var(--strip-h);
    transform:translateX(-50%); display:flex; align-items:center; gap:10px;
    padding:0 8px; }
  .chip { display:inline-flex; align-items:center; gap:3px; padding:2px 4px;
    border:1px solid transparent; border-radius:4px; background:none;
    color: var(--ink-secondary); cursor:pointer; }
  .chip:hover { border-color: var(--edge-panel); }
  .chip.lit { color: var(--accent); border-color: var(--accent); }
  .chip.dormant { color: var(--ink-quiet); opacity:0.35; cursor:default; }
  .chip.dormant:hover { border-color:transparent; }
  #strip .num { font-family: var(--font-mono); font-size:12px;
    font-variant-numeric:tabular-nums; color: var(--ink-primary); }
  #strip-len { min-width:74px; text-align:right; }
  #strip-ang { min-width:44px; color: var(--ink-quiet); }
  #strip-length-box { display:flex; align-items:center; gap:5px;
    font-size:11px; color: var(--ink-quiet); }
  #frozen-length { width:96px; text-align:right; padding:3px 6px;
    font-family: var(--font-mono); font-size:12px;
    background-color: var(--surface-chip); color: var(--ink-primary);
    border:1px solid var(--edge-panel); border-radius:4px; outline:none; }
  #frozen-length:disabled { color: var(--ink-quiet); opacity:0.5; }
  #frozen-length:focus { border-color: var(--accent); }

  /* THE MODE CORNER, upper-left (§7b): what the drawing IS -- board, finish,
     day/night. It sat at the right-hand end of the foot strip; Movie moved it
     to the corner the old LEVEL / VIEW / DRAW WALL / SAVE bar vacated. The
     buttons and what they do are untouched: this is a position, not a
     re-scope. */
  #mode-corner { display:flex; align-items:center; gap:6px; flex:0 0 auto;
    font-family: var(--font-ui); font-size:12px; font-weight:600;
    letter-spacing:0.04em; }
  #mode-corner .set { display:flex; align-items:center;
    background-color: var(--surface-panel); background-image: var(--surface-panel-tex, none);
    border:1px solid var(--edge-panel); border-radius:4px; overflow:hidden; }
  #mode-corner button { font:inherit; letter-spacing:inherit;
    padding:4px 9px; font-size:11px;
    text-transform:uppercase; cursor:pointer; border:none; background:none;
    color: var(--ink-quiet); }
  #mode-corner button[aria-pressed="true"] { color: var(--accent-ink);
    background-color: var(--accent); }

  /* THE FILE ROW, upper-right (§1): what the FILE is -- NEW, OPEN, SAVE with
     its three words, SAVE AS, and the extension the generated name takes.
     The row from MODEL.dc.html:573-590 without its PROJECT button: Movie has
     another place for that and it is the page row at the lower left. */
  #file-row { flex:0 0 auto; display:flex; align-items:center; gap:6px; }
  #file-row[hidden] { display:none; }
  #file-row button, #file-row select {
    font-family: var(--font-ui); font-size:12px; font-weight:600;
    letter-spacing:0.06em; text-transform:uppercase;
    color: var(--ink-primary); cursor:pointer;
    background-color: var(--surface-chip); background-image: var(--surface-chip-tex, none);
    border:1px solid var(--edge-panel); border-radius:6px; padding:6px 12px; }
  #file-row button:hover, #file-row select:hover { border-color: var(--accent); }
  #file-row select { padding:5px 6px; text-transform:none; }
  /* SAVE IS ALSO THE STATUS, and that is a decision rather than a shortcut.
     §1 draws NEW · OPEN · SAVE · status · SAVE AS, and the .dc page has two
     elements there because its SAVE is a download and its status describes a
     different write. Here they are one write, so a separate word beside the
     button would be a second reading of one fact -- the drift this page has
     paid for twice -- and the three words SAVE / UNSAVED / SAVED are already
     load-bearing in the specs. `data-save-status` is on the button that
     carries them. */
  #save { display:none; }
  #file-row #save.show { display:inline-block; }
  #save:disabled { color: var(--ink-quiet); cursor:default; }
  /* Unsaved edits. The accent is the page's one attention colour, so the
     button stops being furniture the moment there is something to lose. */
  #save.dirty { color: var(--accent); border-color: var(--accent); }

  /* THE PAGE ROW, lower-left (§7b): where the drafter GOES. PROJECT stayed
     where it was and gained five neighbours.

     A BUTTON THAT GOES NOWHERE LOOKS LIKE IT GOES NOWHERE -- the dormant
     chip's own treatment, quarter ink and no pointer, because a control that
     lights and does nothing is a worse lie than one that is plainly down. */
  #page-row { position:fixed; left:12px; bottom:calc(var(--house-h) + 10px);
    z-index:6; display:flex; align-items:center; gap:4px;
    font-family: var(--font-ui); font-size:11px; font-weight:600;
    letter-spacing:0.06em; }
  #page-row a, #page-row button, #page-row span { font:inherit;
    letter-spacing:inherit; display:inline-flex; align-items:center;
    height:24px; padding:0 8px; text-transform:uppercase; text-decoration:none;
    border-radius:4px; border:1px solid var(--edge-panel);
    background-color: var(--surface-panel); background-image: var(--surface-panel-tex, none);
    color: var(--ink-primary); cursor:pointer; }
  #page-row a:hover, #page-row button:hover { border-color: var(--accent);
    color: var(--accent); }
  /* HERE, not a link to here. A button that reloads the page you are on
     loses an unsaved corner to a stray thumb. */
  #page-row [aria-current="page"] { color: var(--accent);
    border-color: var(--accent); cursor:default; }
  #page-row button:disabled, #page-row button:disabled:hover {
    color: var(--ink-quiet); opacity:0.35; cursor:not-allowed;
    border-color: var(--edge-panel); }

  /* RUNG 2's QUIET NOTE. A page holding an unsaved edit re-reads nothing when
     another page writes — throwing away this drafter's work to avoid throwing
     away someone else's is the defect the ruling exists to remove — so the
     only thing left to do is say so. Quiet on purpose: it reports a fact about
     the file, it does not ask for a decision, and it sits under SAVE rather
     than over the drawing. */
  /* Follows SAVE to the left: it is SAVE's note, and it was under the shell
     for the same reason SAVE was. */
  #elsewhere { position:fixed; right:12px; top:var(--readout-top); z-index:5;
    font-family: var(--font-ui); font-size:11px; letter-spacing:0.06em;
    text-transform:uppercase; color: var(--ink-quiet);
    background-color: var(--surface-chip); background-image: var(--surface-chip-tex, none);
    border:1px solid var(--edge-panel); border-radius:6px; padding:5px 10px; }
  #elsewhere[hidden] { display:none; }

  /* RUNG 3's READ-ONLY BANNER. It names the holder because "somebody is
     editing this" is not something a drafter can act on, and it carries the one
     press that resolves it. Sat under SAVE with the change note, so the page has
     one place where it says things about the file rather than three. */
  #lease { position:fixed; right:12px; top:calc(var(--readout-top) + 34px); z-index:6;
    display:flex; gap:10px; align-items:center;
    font-family: var(--font-ui); font-size:11px; letter-spacing:0.06em;
    text-transform:uppercase; color: var(--ink-primary);
    background-color: var(--surface-chip); background-image: var(--surface-chip-tex, none);
    border:1px solid var(--accent); border-radius:6px; padding:5px 10px; }
  #lease[hidden] { display:none; }
  #take-over { font:inherit; letter-spacing:inherit; text-transform:inherit;
    color: var(--accent); background:none; border:1px solid var(--accent);
    border-radius:4px; padding:3px 8px; cursor:pointer; }
  /* The change note steps down when the banner is up, so they never overlap. */
  body[data-lease-held="0"] #elsewhere { top:calc(var(--readout-top) + 68px); }

  /* THE TOP ROW OWNS THE POSITION; its two children just flow inside it.
     Inset past the tabs on both edges (26px each plus air) so the row never
     sits on one.

     ONE FLEX ROW, STILL, AND FOR THE SAME REASON: the mode corner grows with
     nothing and the file row grows with the extension picker, but two
     separately fixed-positioned bars is how the build bar came to be sitting
     on SAVE. A flex row cannot overlap at any width. */
  #top-row { position:fixed; top:var(--top-row-top); left:40px; right:40px; z-index:6;
    display:flex; gap:12px; align-items:center;
    justify-content:space-between; pointer-events:none; }
  #top-row > * { pointer-events:auto; }

  /* THE HOUSE STRIP, along the foot (§7b): what the drafter PICKS. This is
     the region the drive-thru sign will rise into and cover, which is why
     nothing read while drawing lives here -- and why DELETE, which does live
     here, is unavailable while the sign is up. The sign is not built; the
     page's modal layer (#promote, #bone-choice, z-index 7 over the whole
     viewport) is the mechanism it will use, and it already covers this strip
     at z-index 6. */
  #house-strip { position:fixed; left:0; right:0; bottom:0; z-index:6;
    min-height:var(--house-h);
    display:flex; align-items:center; gap:10px; padding:0 12px;
    background-color: var(--surface-panel); background-image: var(--surface-panel-tex, none);
    border-top:1px solid var(--edge-panel); }
  #house-strip .grow { flex:1; }
  /* THE ONE DELETE (§7a). Not per type, and not only for walls: it acts on
     the selection, whatever is in it. It is on screen exactly while there is
     something to delete -- and the iPad has no Delete key, so this button is
     the only way to delete anything at all there. */
  #delete { font-family: var(--font-ui); font-size:12px; font-weight:600;
    letter-spacing:0.06em; text-transform:uppercase; cursor:pointer;
    color: var(--ink-primary);
    background-color: var(--surface-chip); background-image: var(--surface-chip-tex, none);
    border:1px solid var(--edge-panel); border-radius:6px; padding:6px 14px; }
  #delete:hover { color: var(--accent); border-color: var(--accent); }
  #delete[hidden] { display:none; }

  /* THE BUILD BAR, centred in the house strip. */
  #build-bar { flex:0 1 auto;
    display:flex; align-items:center; justify-content:center; gap:6px; }
  #build-bar[hidden] { display:none; }
  #build-families, #build-entries { display:flex; gap:4px; }
  #build-entries[hidden] { display:none; }
  #build-bar button { font-family: var(--font-ui); font-size:11px; font-weight:600;
    letter-spacing:0.06em; text-transform:uppercase; cursor:pointer;
    color: var(--ink-primary); padding:6px 10px; border-radius:6px;
    border:1px solid var(--edge-panel);
    background-color: var(--surface-chip); background-image: var(--surface-chip-tex, none); }
  #build-bar button:hover { border-color: var(--accent); color: var(--accent); }
  /* The family whose submenu is open, and the type the drawing carries, both
     read as the page's one attention colour -- the same signal the wall tool
     uses when it is armed. */
  #build-bar button.open, #build-bar button.chosen {
    color: var(--accent); border-color: var(--accent); }
  #bone { font-weight:700; letter-spacing:0.1em; }

  /* ── THE SHELL ─────────────────────────────────────────────────────────
     Two pull-out sidebars and their tabs. The SHAPE is MODEL.dc.html's
     (.rail-tab at :147-150): a full-height tab on each edge, vertical
     lettering, the panel sliding in beside it. The stylesheet is not carried
     across -- that page has one light skin and hardcodes #fff and #1d1f20,
     so every colour here is a palette token.

     BOTH START CLOSED, which is the old page's own default
     ("pull-out tabs: both side rails start hidden", :3009) and the only
     state that costs the drafter no drawing area at all. The four
     combinations are measured in tests/model-html-shell.spec.js. */
  /* THE TAB IS AS TALL AS ITS WORD, not as tall as the sheet. MODEL.dc.html's
     tabs run the full edge (:147, top:0 bottom:0) because that page's canvas
     is inset; here the canvas is full-bleed, so a full-height tab is a full-
     height bite out of the drawing. Measured: the full-height pair plus a
     full-height collapsed strip hid 9.7% of the house with both panels SHUT,
     which was worse than the 5.5% of the corner rail they replaced. */
  /* TOP-ALIGNED, NOT CENTRED, and this is the largest single number in the
     shell. fit() centres the drawing, so a vertically centred panel sits
     exactly where the house is: centred cost 4.5% of the drawing with both
     panels shut, top-aligned costs 1.3%. Bottom-aligned ties it at 1.2% and
     loses, because the readout and the hint already live along that edge. */
  /* BELOW THE TOP ROW, not beside it. The row spans the sheet's top edge, so
     a panel starting at the same y sits under it -- measured with a pairwise
     box check across every piece of chrome, and top:12 put the row over BOTH
     rails (over the first seat row on the right, over the tool slot on the
     left when open). Bottom-anchoring is cheaper still but puts the rails on
     #readout and #hint, which already live along that edge.
     Only this clears everything: shut 7.3% of the drawing against 3.4% at
     top:12. Four points is what a top bar costs, and chrome that covers
     chrome is a defect where drawing area is a price -- both panels collapse,
     so the drafter can have the sheet back. */
  .rail-tab { position:fixed; top:var(--rail-top); z-index:6;
    height:auto; max-height:52vh; padding:14px 6px;
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--edge-panel); cursor:pointer;
    background-color: var(--surface-chip); background-image: var(--surface-chip-tex, none);
    color: var(--ink-quiet); font-family: var(--font-ui); font-size:13px;
    font-weight:600; letter-spacing:0.14em; line-height:1;
    writing-mode:vertical-rl; text-transform:uppercase; }
  .rail-tab:hover { color: var(--accent); border-color: var(--accent); }
  .rail-tab[hidden] { display:none; }
  #left-tab { left:0; border-left:none; border-radius:0 4px 4px 0; }
  /* The right tab reads bottom-to-top so both tabs run outward from the edge
     they hang on. */
  #right-tab { right:0; border-right:none; border-radius:4px 0 0 4px;
    writing-mode:vertical-lr; }
  /* A panel is pinned to its own edge and is as tall as it needs to be, for
     the same reason as the tab: full height costs drawing area that a panel
     holding three rows of seats is not using. */
  aside { position:fixed; top:var(--rail-top);
    /* STOPS ABOVE THE HINT. 100vh - 60 let the panel run to within 12px of the
       bottom, which was fine while it held a rail and an empty slot and is not
       once the LEVELS / LAYERS panel is inside it: expanded, it reached the
       "drag to pan" hint at bottom:12px and the pairwise chrome check caught
       it -- the fifth collision that check has found, and the fifth that was
       invisible until something was measured rather than looked at. The hint
       sits above the strip, so the panel has to end above the hint's top.

       PINNED BY `bottom`, NOT BY max-height, and that is the fix for a fault
       this cost twice. max-height sizes the CONTENT box, so with padding:10px
       the panel stood 20px taller than the number asked for -- 644 where 624
       was written -- and overlapped the hint by a single pixel. Giving the box
       a top AND a bottom lets the browser do that arithmetic, and deriving the
       bottom from --strip-h means the strip can move without this going stale
       again. The collapsed cap below is a max-height still, and being smaller
       it wins. */
    bottom:var(--bottom-band); z-index:5; overflow-y:auto;
    overscroll-behavior:contain; padding:10px;
    background-color: var(--surface-panel); background-image: var(--surface-panel-tex, none); }
  aside[hidden] { display:none; }
  #left-rail { left:28px; border-right:1px solid var(--edge-panel); min-width:120px; }
  #right-rail { right:28px; border-left:1px solid var(--edge-panel); }
  /* THE RIGHT PANEL COLLAPSES TO A SEAT, NOT TO NOTHING (Devin, 12 Sep).
     MODEL.dc.html's rail comment (:1766) says the open LEVELS panel covers
     only the outer column and "the inner column always keeps its seat, so
     every view stays one tap away" -- a property it protects deliberately,
     and one that a panel closing to zero would have destroyed.
     So collapsed still holds all six seats and drops the properties, which has
     no such claim on the edge.

     BUT NOT AS A SEAT-WIDE STRIP, and the measurement is why. A strip one seat
     across is six seats TALL, and a tall narrow panel is the worst possible
     shape here: fit() centres a house that is wider than it is deep, so a
     column runs down through it while a squat block sits past its end. On
     repro-garage-house, collapsed, percentage of the DRAWING hidden:

         1 column   97x486   9.4%     <- the strip, and the worst of them
         2 columns 187x246   6.5%
         3 columns 277x166   4.5%     <- widest and shortest, the best
         (expanded 195x254   6.7%)

     One column also cost MORE than leaving the panel open, which would have
     made collapsing pointless, and more than the 5.5% of the corner overlay
     this shell replaced. So collapsed goes WIDE and SHORT: same six seats,
     same order, no properties, 4.5%. */
  /* COLLAPSED IS CAPPED, AND THE CAP IS THE ONLY THING THAT BOUNDS IT once
     the chart is derived. At six seats "wide and short" was enough -- 3
     columns beat 1 at 4.5% against 9.4%. At FOURTEEN there is no shape that
     works, because the panel is large in both directions whichever way it is
     folded; measured on repro-garage-house, collapsed:

         3 columns  277x406  13.2%      4 columns  367x326  14.3%
         5 columns  457x246  14.5%      6 columns  547x246  19.9%

     Every one of those is worse than the 9.7% full-height version rejected
     during #389 for being worse than the corner overlay it replaced. So the
     height is capped and the rest scrolls, which is what MODEL.dc.html does
     with its own rail (:183, top/bottom pinned with overflow-y:auto):

         3 columns, capped 150px   277x162   4.3%   <- shipped
         2 columns, capped 220px   187x232   5.8%
         3 columns, capped 220px   277x232   8.5%

     150px is two rows, so collapsed still shows SIX seats at a glance -- the
     whole rail as it stood before the chart grew -- and the other eight are
     one scroll away. Devin withdrew "simultaneously visible" in favour of
     "reachable means one click"; this is that ruling costing eight seats a
     scroll rather than costing the drafter 13% of the sheet. */
  /* 150px WAS TWO ROWS OF SEATS; the level chips below add one short row,
     and 182 is that row. The chart above is what makes this a price rather
     than a preference: 277x194 hides 5.2% of the drawing against 4.3%, and
     the nine tenths of a point buys the thing §7c will not go without --
     a level switch that is still there when the rail is shut. */
  #right-rail[data-collapsed] { box-sizing:border-box; padding:6px; max-height:182px; }
  #right-rail[data-collapsed] #view-rail { grid-template-columns:repeat(3, 84px); }
  #right-rail[data-collapsed] #props-slot { display:none; }
  /* THE TOOL COLUMN. Four square keys a row, which is the old page's own
     shape and not a taste: at four across, DRAW/EDIT is three rows and BUILD
     is two, and the whole roster is reachable without the panel scrolling on
     a laptop. Three across would push it to six rows and start scrolling the
     one thing a drafter reaches for constantly.

     THE COMMAND LETTER SITS TOP-LEFT AND THE NAME ALONG THE BOTTOM, leaving
     the middle of the face clear. That gap is deliberate: the old page's keys
     carry an icon there and this page has none yet, so the space is held open
     rather than closed up and re-opened later at every caller. */
  #tool-slot:empty::after { content:'TOOLS'; display:block; padding:6px 2px;
    font-family: var(--font-ui); font-size:9px; letter-spacing:0.1em;
    color: var(--ink-quiet); opacity:0.5; }
  [data-tool-group] + [data-tool-group] { margin-top:10px; }
  [data-tool-group-name] { font-family: var(--font-ui); font-size:9px;
    font-weight:600; letter-spacing:0.1em; text-transform:uppercase;
    color: var(--ink-quiet); margin-bottom:5px; }
  .tool-keys { display:grid; grid-template-columns:repeat(4, 40px); gap:4px; }
  .tool-key { position:relative; width:40px; height:40px; padding:0;
    display:block; cursor:pointer; border-radius:3px;
    border:1px solid var(--edge-panel);
    background-color: var(--surface-chip);
    background-image: var(--surface-chip-tex, none);
    color: var(--ink-quiet); font-family: var(--font-ui); }
  .tool-key:hover { border-color: var(--accent); color: var(--accent); }
  /* ARMED IS THE ACCENT, the same signal every armed control on the page
     uses, because a drafter should not have to learn that the tool column
     means something different from the rest of the chrome. */
  .tool-key[aria-pressed="true"] { border-color: var(--accent);
    color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  /* AN UNAVAILABLE TOOL LOOKS DOWN, and it has to look down MEASURABLY. An
     opacity of 0.9 would satisfy "the rule exists" while looking identical on
     screen, and a `disabled` attribute with no rule behind it at all is the
     broken state that looks exactly like the working one -- so
     tests/model-tool-boards.spec.js reads the COMPUTED opacity, not the
     attribute. Three signals, none of them the accent: the key is dimmed, it
     loses the hover promise, and the cursor says it will not take the press. */
  .tool-key:disabled, .tool-key:disabled:hover { opacity:0.35; cursor:not-allowed;
    border-color: var(--edge-panel); color: var(--ink-quiet); box-shadow:none; }
  /* Fixed to the viewport and out of the way of hit-testing: a label that
     ate the pointer would break the very gesture it is reporting on. */
  #draw-len { position:fixed; z-index:40; pointer-events:none;
    font-family: var(--font-mono); font-size:12px; font-weight:600;
    padding:2px 6px; border-radius:3px; white-space:nowrap;
    background: var(--surface-panel); color: var(--ink-primary);
    border:1px solid var(--edge-panel); }
  [data-tool-letter] { position:absolute; top:2px; left:4px; font-size:11px;
    font-weight:600; line-height:1; }
  /* The five bare faces keep the same box: a key whose letter box collapses
     would sit differently from its neighbours and read as a different kind of
     key, which is a thing about the tool that is not true. */
  [data-tool-letter]:empty::after { content:'\200b'; }
  [data-tool-name] { position:absolute; left:0; right:0; bottom:2px;
    font-size:6.5px; font-weight:600; letter-spacing:0.02em;
    text-transform:uppercase; line-height:1.1; text-align:center;
    padding:0 1px; overflow:hidden; }
  /* SELECTION and OBJECT TYPE. Chips wrap rather than scroll: ALL LEVELS and
     FENESTRATION are long words in a 120px panel, and a row that scrolls
     sideways hides the chip a drafter is looking for. */
  /* THE COLUMN IS AS WIDE AS THE KEYPAD AND NO WIDER. Measured, because the
     first version was not: `flex:1 1 auto` chips plus the words FENESTRATION
     and ALL LEVELS pushed the panel to 451px, against the keypad's 172. A
     panel two and a half times the width it needs is drawing area taken for
     nothing, and it is the same occlusion cost Skipper measured and cut on the
     right. Fixing the slot's width makes the chips wrap inside it instead of
     stretching it. */
  #tool-slot { width:172px; }
  .sel-row { display:flex; flex-wrap:wrap; gap:3px; }
  .sel-chip { flex:0 1 auto; min-width:0; overflow-wrap:anywhere;
    padding:5px 4px; cursor:pointer;
    border:1px solid var(--edge-panel); border-radius:2px;
    background-color: var(--surface-chip);
    background-image: var(--surface-chip-tex, none);
    color: var(--ink-quiet); font-family: var(--font-ui); font-size:9px;
    font-weight:600; letter-spacing:0.04em; line-height:1; }
  .sel-chip:hover { border-color: var(--accent); color: var(--accent); }
  /* §6's other two surfaces go down the same way the keys do, and the same
     0.35 so one number governs "unavailable" across the whole column. Read as
     computed opacity by the spec, never as the attribute. */
  .sel-chip:disabled, .sel-chip:disabled:hover { opacity:0.35; cursor:not-allowed;
    border-color: var(--edge-panel); color: var(--ink-quiet); box-shadow:none; }
  .sel-chip[aria-pressed="true"] { border-color: var(--accent);
    color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .sel-help { margin-top:5px; font-family: var(--font-ui); font-size:9px;
    line-height:1.25; color: var(--ink-quiet); }
  /* The old page's warning red (#b04050, :23622), and it means one thing: a
     filter is engaged. Not "the cursor is over something excluded". */
  .sel-help[data-engaged] { color:#b04050; }
  /* ASSEMBLY and UNGROUP run the panel's width -- they are commands, not a
     choice between siblings, and a full-width button is what says so. */
  .asm-wide { display:block; width:100%; margin-bottom:3px; }
  /* AN AUTHOR `display` BEATS THE BROWSER'S `[hidden]`, which is a rule of the
     cascade rather than a quirk: [hidden]{display:none} lives in the UA
     stylesheet and any author display wins it. Without this line UNGROUP is
     visible whenever it has been rendered, hidden attribute and all -- it
     showed with nothing selected, which invites a press that cannot do
     anything. Caught by the spec, not by looking. */
  .asm-wide[hidden] { display:none; }
  .asm-wide:disabled { opacity:0.42; cursor:not-allowed;
    border-color: var(--edge-panel); color: var(--ink-quiet); }
  .asm-wide:disabled:hover { border-color: var(--edge-panel);
    color: var(--ink-quiet); }
  [data-assembly-dialog] { margin-top:6px; padding-top:6px;
    border-top:1px solid var(--edge-panel); }
  [data-assembly-dialog][hidden] { display:none; }
  [data-assembly-name] { box-sizing:border-box; width:100%; margin-bottom:4px;
    padding:5px 4px; border:1px solid var(--edge-panel); border-radius:2px;
    background: var(--surface-chip); color: var(--ink);
    font-family: var(--font-ui); font-size:10px; letter-spacing:0.04em;
    text-transform:uppercase; }
  #props-slot[hidden] { display:none; }

  /* THE LEVELS / LAYERS PANEL. Movie: "i will also need the LEVELS / LAYERS
     menu too", and "the level layers should be a tab on the right side like
     in the DC files". It is a third pane in the right-edge group rather than
     a second rotated tab on the same edge -- Devin's ruling, and he withdrew
     the "must not bury the rail" line with it: reachable means one click, not
     simultaneously visible. Two tabs on one edge is how the chrome-on-chrome
     collisions of #389 happened.

     Carried from MODEL.dc.html:1850-1955 by SHAPE, not by stylesheet: a card
     per level with its layer rows inside, the active one lit. */
  #levels-panel { display:flex; flex-direction:column; gap:6px; margin-top:8px;
    max-height:42vh; overflow-y:auto; scrollbar-width:none; }
  #levels-panel::-webkit-scrollbar { display:none; }
  /* THE LEVELS SURVIVE THE COLLAPSE (§7c). This rule used to read
     `display:none`, which was true while the chrome bar carried a LEVEL
     picker: the panel was the second way to switch and the picker was the
     first. §7 deletes the picker, so a collapsed rail would have left the
     page with NO way to change level -- the hole the order names, and the
     reason it forbids deleting the picker before this line changes.

     COLLAPSED IS THE NAMES ONLY: no layer rows, no datum, no add or delete,
     the cards wrapping across the panel's width the way the seats do. Same
     buttons and the same `data-level-row` the expanded panel carries, so the
     collapsed rail is the SAME control drawn short -- not a second one that
     can come to disagree with it. */
  #right-rail[data-collapsed] #levels-panel { display:flex; flex-flow:row wrap;
    gap:4px; margin-top:6px; max-height:none; overflow:visible; }
  #right-rail[data-collapsed] #levels-panel > *:not(.lv-card) { display:none; }
  #right-rail[data-collapsed] #levels-panel .lv-card { flex:0 0 auto; }
  #right-rail[data-collapsed] #levels-panel .lv-layers,
  #right-rail[data-collapsed] #levels-panel .lv-del { display:none; }
  .lv-head { display:flex; align-items:center; gap:6px; }
  .lv-head-title { flex:1; font-family: var(--font-ui); font-size:9px;
    letter-spacing:0.1em; text-transform:uppercase; color: var(--ink-quiet); }
  .lv-datum { font-family: var(--font-ui); font-size:9px; letter-spacing:0.04em;
    color: var(--ink-quiet); opacity:0.8; }
  .lv-card { display:flex; gap:0; border:1px solid var(--rule); background:transparent; }
  .lv-bar { width:4px; flex:0 0 4px; }
  .lv-body { flex:1; min-width:0; display:flex; flex-direction:column; }
  .lv-name { font-family: var(--font-ui); font-size:10px; letter-spacing:0.06em;
    text-align:left; padding:4px 6px; background:none; border:0; color: var(--ink);
    cursor:pointer; text-transform:uppercase; }
  .lv-card[data-active] .lv-name { font-weight:700; }
  .lv-layers { display:flex; flex-direction:column; }
  .lv-layer { font-family: var(--font-ui); font-size:9px; letter-spacing:0.04em;
    text-align:left; padding:3px 6px 3px 12px; background:none; border:0;
    color: var(--ink-quiet); cursor:pointer; }
  .lv-layer[data-active] { background: var(--accent); color: var(--on-accent);
    font-weight:700; }
  .lv-card-head { display:flex; align-items:center; }
  .lv-card-head .lv-name { flex:1; }
  .lv-add, .lv-del { font-family: var(--font-ui); background:none; cursor:pointer;
    color: var(--ink-quiet); }
  .lv-add { border:1px solid var(--rule); font-size:9px; font-weight:700;
    letter-spacing:0.06em; padding:2px 5px; }
  .lv-del { border:0; font-size:12px; line-height:1; padding:2px 6px; }
  .lv-del:hover, .lv-add:hover { color: var(--ink); }
  .lv-empty { font-family: var(--font-ui); font-size:9px; letter-spacing:0.04em;
    color: var(--ink-quiet); opacity:0.7; padding:3px 6px; }
  .lv-layer[disabled] { opacity:0.35; cursor:default; }
  .props-title { font-family: var(--font-ui); font-size:9px; font-weight:600;
    letter-spacing:0.1em; text-transform:uppercase; color: var(--ink-quiet);
    margin-bottom:6px; }
  #props-slot { margin-top:10px; padding-top:10px;
    border-top:1px solid var(--edge-panel);
    font-family: var(--font-ui); font-size:10px; color: var(--ink-quiet); }

  /* THE SEATING CHART: six cut views, all six always shown. The shape is
     MODEL.dc.html's rail (:188-200) and the PAIRING is its own -- E1|E3 over
     E2|E4, then the two section seats side by side (:7266, :7281).

     NOT its colours, though. That rail is #fff cards with #b04060 accents
     baked in, because that page has one light skin. This page has a night
     one, and the same literals inside drawCutMarks2D punched a white disc
     into the night drawing -- tests/model-html-cuts.spec.js's header records
     it. Every colour here is a palette token, so the rail follows the skin. */
  /* The CONTAINER takes no clicks, the seats do -- MODEL.dc.html's own split
     (.view-thumb carries `pointer-events:auto`, so its wrapper does not).
     Without it the 6px gutters between seats swallow taps meant for the
     drawing underneath. */
  /* TWO COLUMNS, AND THE SEATS ARE SMALL ON PURPOSE. Two because this rail is
     going to hold the plan cards as well -- ROOF and SITE, then plan/floor for
     each level, the way MODEL.dc.html pairs them across its two columns
     (:7268-7279). Six seats is three rows; the full chart is closer to seven,
     so the rail grows DOWNWARD and the seat has to be small enough that it
     still fits when it does.
     Measured on repro-garage-house rather than eyeballed: at 118px the rail
     hid 9.6% of the drawing, at 84px it hides 5.5%, for the same six views.
     A single tall column was worse than either (10.9%) -- fit() puts the house
     against the right edge, so a column runs straight down the work. */
  /* A TENANT OF THE RIGHT PANEL, not a corner overlay. It was fixed at
     right:12px/top:80px and hid 5.5% of the drawing whatever the drafter was
     doing; inside the panel it hides nothing when the panel is shut. */
  #view-rail { display:grid; grid-template-columns:repeat(2, 84px); gap:6px;
    /* No max-height of its own any more: the panel it sits in scrolls, so the
       plan cards can double the row count without the rail needing a second
       scroller inside the first. */ }
  #view-rail[hidden] { display:none; }
  .seat { pointer-events:auto;
    width:84px; padding:0; text-align:left; cursor:pointer; overflow:hidden;
    background-color: var(--surface-panel); background-image: var(--surface-panel-tex, none);
    border:1px solid var(--edge-panel); border-radius:4px; }
  .seat:hover { border-color: var(--accent); }
  .seat.active { border-color: var(--accent); box-shadow:0 0 0 1px var(--accent); }
  /* AN EMPTY SEAT IS A CHAIR, NOT A BUTTON. The creation gesture that fills a
     section seat on the old page is deferred (SPEC §3), so an empty seat must
     not invite a press that does nothing. It is disabled rather than merely
     unstyled: `cursor:default` tells a mouse and nothing else, while disabled
     also takes it out of the tab order and off a screen reader's list of
     things to press. */
  .seat[disabled] { cursor:default; }
  .seat[disabled]:hover { border-color: var(--edge-panel); }
  .seat canvas { display:block; width:82px; height:54px; }
  .seat[disabled] canvas { opacity:0.25; }
  .seat-label { padding:3px 4px 4px; border-top:1px solid var(--edge-panel);
    font-family: var(--font-ui); font-size:8px; font-weight:600;
    letter-spacing:0.04em; text-transform:uppercase; color: var(--ink-quiet);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .seat.active .seat-label { color: var(--accent); }

  /* The empty and error states say what to do, because a black screen with
     nothing on it is indistinguishable from a page that failed to boot. */
  /* The promotion confirm sits above everything, including the notice, because
     it is the one thing a drafter must answer before the page does what they
     asked. [hidden] is spelled out: the author display below would otherwise
     beat the UA rule, which is the bug the UNGROUP button had. */
  #promote { position:fixed; inset:0; z-index:7; display:flex;
    align-items:center; justify-content:center; padding:24px;
    background:rgba(0,0,0,0.35); }
  #promote[hidden] { display:none; }
  /* SAME SHELL AS #promote, deliberately. It is the same kind of question --
     a modal with two ways out -- and a second look would read as a second
     kind of thing. */
  #bone-choice { position:fixed; inset:0; z-index:7; display:flex;
    align-items:center; justify-content:center; padding:24px;
    background:rgba(0,0,0,0.35); }
  #bone-choice[hidden] { display:none; }
  /* AND THE SAME SHELL AGAIN for the two file questions, for the same reason:
     three kinds of modal would teach the drafter that they are three
     different kinds of thing. They are one -- a question that must be
     answered before the page does what was asked. */
  #file-guard, #save-as { position:fixed; inset:0; z-index:7; display:flex;
    align-items:center; justify-content:center; padding:24px;
    background:rgba(0,0,0,0.35); }
  #file-guard[hidden], #save-as[hidden] { display:none; }
  #save-as-name { width:100%; box-sizing:border-box; margin:0 0 12px;
    padding:7px 9px; border-radius:3px; border:1px solid var(--edge-panel);
    background-color: var(--surface-chip); color: var(--ink-primary);
    font-family: var(--font-mono); font-size:13px; }
  #save-as-name:focus { border-color: var(--accent); outline:none; }
  .promote-card { max-width:26em; padding:16px 18px; border-radius:4px;
    border:1px solid var(--edge-panel);
    background-color: var(--surface-panel);
    background-image: var(--surface-panel-tex, none); }
  .promote-card p { margin:0 0 12px; font-family: var(--font-ui);
    font-size:13px; line-height:1.4; color: var(--ink-primary); }
  .promote-row { display:flex; gap:8px; }
  .promote-row button { flex:1; padding:7px 10px; cursor:pointer;
    border-radius:3px; border:1px solid var(--edge-panel);
    background-color: var(--surface-chip);
    background-image: var(--surface-chip-tex, none);
    color: var(--ink-quiet); font-family: var(--font-ui); font-size:11px;
    font-weight:600; letter-spacing:0.04em; }
  .promote-row button:hover { border-color: var(--accent); color: var(--accent); }
  [data-promote-go] { border-color: var(--accent); color: var(--accent); }
  #notice { position:fixed; inset:0; z-index:6; display:none;
    align-items:center; justify-content:center; padding:24px; text-align:center; }
  #notice.show { display:flex; }
  #notice div { max-width:34em; }
  #notice h1 { font-family: var(--font-ui); font-size:19px; font-weight:600;
    letter-spacing:0.02em; margin:0 0 8px; color: var(--accent); }
  #notice p { margin:0 0 6px; color: var(--ink-secondary); }
  #notice code { font-family: var(--font-mono); font-size:0.92em;
    color: var(--ink-primary); padding:1px 5px; border-radius:3px;
    background-color: var(--surface-chip); background-image: var(--surface-chip-tex, none); }
</style>
</head>
<body>

<canvas id="plan"></canvas>
<div id="readout">loading…</div>
<!-- ONE TOP ROW, so the two cannot land on each other. They were separately
     fixed-positioned -- the chrome bar at left:12 and the build bar centred at
     left:50% -- and both are as wide as their CONTENT, and on a drawing whose
     level names ran long the chrome bar reached under the build bar and
     BUNGALOW swallowed the SAVE button. Tuning the numbers would have fixed
     one drawing; a flex row cannot overlap at any width. The two ends have
     changed tenants since -- the mode corner at the left, the file row at the
     right -- and the reason for the row has not. -->
<div id="top-row" data-top-row>
<!-- THE MODE CORNER (§7b): WHAT THE DRAWING IS. Carried whole out of the foot
     strip -- same buttons, same data-* attributes, same listeners. TOY still
     means cardinal, square and whole-foot and DRAFTING is still one-way; a
     control that changed meaning because it changed corner would be the
     re-scope §7b forbids. -->
<div id="mode-corner" data-mode-corner>
  <span class="set" data-board-switch>
    <!-- NO title HERE. These two are set from script below, and a static one
         would be overwritten -- which is exactly what happened when this
         markup was given titles first: they read correctly in the file and
         never reached the page. The wording, and the check that holds it to
         the truth, live with the assignment. -->
    <button type="button" data-board="toy" aria-pressed="false">TOY</button>
    <button type="button" data-board="drafting" aria-pressed="false">DRAFTING</button>
  </span>
  <span class="set" data-theme-switch>
    <button type="button" data-theme="ruff" aria-pressed="false">RUFF</button>
    <button type="button" data-theme="rough" aria-pressed="false">ROUGH</button>
  </span>
  <span class="set" data-mode-switch>
    <button type="button" data-skin-mode="night" aria-pressed="false">NIGHT</button>
    <button type="button" data-skin-mode="day" aria-pressed="false">DAY</button>
  </span>
</div>
<!-- THE FILE ROW (§1): WHAT THE FILE IS. NEW · OPEN · SAVE · SAVE AS · the
     extension, after MODEL.dc.html:573-590. SAVE carries the status word
     itself -- see the stylesheet note. The picker chooses what the GENERATED
     NAME ends in and nothing else: every one of the four is plain JSON, which
     is why OPEN takes all four without asking which it was given. -->
<div id="file-row" data-file-row hidden>
  <button id="file-new" type="button" data-file-new title="Start an empty drawing">NEW</button>
  <button id="file-open" type="button" data-file-open title="Open a drawing file">OPEN</button>
  <input id="file-input" type="file" data-file-input hidden
    accept=".json,.draft,.model,.plan,application/json" />
  <!-- SAVE MOVED OUT OF THE TOP-LEFT BAR, not out of the shell: the right tab

<script src="./level-assembly.js"></script>
<script src="./stair-geometry.js"></script>

<script>
(() => {
  // ── skin ──────────────────────────────────────────────────────────────────
  // Four dashboards: RUFF DRAFTER and ROUGH DRAFTER, each night and day
  // (RD-DOCUMENTS/SPEC-skins.md). The skins themselves get designed later;
  // what exists now is the seam they arrive through.
  //
  // ?theme= and ?mode= are the seam, deliberately: a URL is the cheapest way
  // for a designer to see a skin, and for a spec to assert one, before any
  // settings UI exists. When the profile package carries the choice, this
  // reads that first and the query string stays as an override.
  //
  // `skin` is captured ONCE at module scope, which is a load-order hazard this
  // repo has been bitten by 13 times across 8 files -- so palette.js is loaded
  // above and this throws here, naming itself, rather than painting undefined
  // three functions away.
  // resolve() throws on an unknown name, which is right for a painter asking
  // for a role that does not exist. It is WRONG here: a typo in a URL someone
  // pasted should not blank the page. So the query string is validated against
  // the palette's own lists and falls back, loudly, to the default skin.
  const params = new URLSearchParams(location.search);
  const pick = (name, allowed, fallback) => {
    const asked = params.get(name);
    if (!asked || allowed.includes(asked)) return asked || fallback;
    console.warn(`MODEL: unknown ${name} "${asked}"; using ${fallback}. `
      + `Known: ${allowed.join(', ')}`);
    return fallback;
  };
  // THE CHOICE OUTLIVES THE TAB, and the query string still wins. A drafter
  // who picks DAY on the strip gets DAY tomorrow morning; a ?mode= in a URL
  // someone pasted is a deliberate override for that visit and does not
  // overwrite what the drafter chose. Stored under one key rather than in the
  // profile package: the package is office standards, and a skin is not one.
  const SKIN_KEY = 'draft-skin';
  const stored = (() => {
    try { return JSON.parse(localStorage.getItem(SKIN_KEY) || 'null') || {}; }
    catch { return {}; }
  })();
  const storedOr = (name, allowed, fallback) =>
    (allowed.includes(stored[name]) ? stored[name] : fallback);
  // `let`, and this is the whole seam the switcher hangs on. Every painter
  // reads `skin['role']` INSIDE its own function (30 sites, checked), so
  // re-resolving here and repainting changes the drawing's colours without a
  // reload -- and a reload is what a switcher must avoid, because this page
  // holds unsaved edits.
  let theme = pick('theme', window.DraftPalette.THEMES,
    storedOr('theme', window.DraftPalette.THEMES, 'ruff'));
  let mode = pick('mode', window.DraftPalette.MODES,
    storedOr('mode', window.DraftPalette.MODES, 'night'));
  let skin = window.DraftPalette.apply(document, theme, mode);
  'use strict';

  const BUCKET = 'model-drawing';
  const canvas = document.getElementById('plan');
  // NOT const, and this is the one binding that decides whether a seat can
  // show a plan. Every painter on this page draws into `ctx` and projects
  // through toS(), both module-level -- so a thumbnail either swaps them for
  // the length of one draw or becomes a SECOND, smaller renderer. The old
  // page took the second road (_drawPlanThumb2D) and this page took the first
  // for its cut seats already: "the same painter that draws the full-size
  // view, through the same env". A miniature that can disagree with the plan
  // it claims to show is the defect this suite keeps meeting.
  let ctx = canvas.getContext('2d');
  const readout = document.getElementById('readout');
  const notice = document.getElementById('notice');
  const noticeBody = document.getElementById('notice-body');
  const saveButton = document.getElementById('save');
  const elsewhereNote = document.getElementById('elsewhere');
  const leaseBanner = document.getElementById('lease');
  const leaseMessage = leaseBanner && leaseBanner.querySelector('[data-lease-message]');
  const takeOverButton = document.getElementById('take-over');

  // ── the instruments' own state ────────────────────────────────────────────
  // Declared here rather than beside the strip's wiring because paint() reads
  // the ruler, and paint() is defined a thousand lines above it. A `let` read
  // before its declaration is a throw, not an undefined, and the boot paint
  // would hit it.
  let tsquareOn = false;    // T-SQUARE down: the run in hand is held square
  let rulerOn = false;      // RULER down: presses measure instead of drawing
  let rulerFrom = null;     // the ruler's first press, in world feet
  let cursorWorld = null;   // where the cursor last was, for the live readouts

  // View state in world units (feet). scale is screen pixels per foot.
  // Deliberately plain arithmetic: MODEL.dc.html projects through a three.js
  // camera, but the painters take `toS` as a parameter and never ask where it
  // came from, so tier 1 owes three.js nothing.
  const view = { cx: 0, cz: 0, scale: 6 };
  // WHILE A SEAT IS BEING PAINTED, this says which level and which drawing of
  // it -- and it is deliberately the ONLY override. activeLevelId and
  // activeViewId read it, and everything downstream (walls, lines, floors,
  // roofs, dimensions, the fit) already reads THEM, so one hook aims the
  // entire existing filter chain at another level instead of seventeen
  // painters growing a parameter. It is a second source of truth for "what is
  // active" for exactly as long as one synchronous draw, restored in a
  // `finally` so a throwing painter cannot leave the page pointing at a seat.
  let thumbTarget = null;
  let drawing = null;
  // The bucket revision the drawing was read at, handed back as `ifRev` on
  // save so a write that would land on top of someone else's is REFUSED
  // rather than silent — the same guard MODEL.dc.html saves under.
  let storeRev = null;
  // One shared object per corner, rebuilt on every load. Only wall endpoints
  // go in it today, because mitring is the only thing that needs identity;
  // MODEL.dc.html pools lines, floors and roofs too, and this grows to match
  // when something on this page needs them to share a corner.
  let vertexPool = [];
  let dropped = 0;   // items the format module refused on load — kept, not drawn
  // WHAT THE FORMAT MODULE REFUSED, HELD RAW SO THE SAVE CAN PUT IT BACK
  // (RULING-a-rejected-item-is-still-the-drafters, Movie, 11 Sep). Keyed by
  // collection; each entry is `{ index, item }` with `item` byte-for-byte as it
  // came out of the file. The page will not draw these — they failed the
  // format's own rules and drawing them is exactly what those rules prevent —
  // but a page may show less than the file contains; it may not SAVE less than
  // the file contains.
  //
  // The list comes from the normaliser's own sink rather than from a comparison
  // made here, because a reconstruction at this call site gets the duplicate-id
  // case backwards: a dimension refused for a duplicate id PASSES when re-run
  // on its own, so a caller re-deriving the refusals one at a time would call
  // it accepted, never record it, and lose it on the next save — while looking
  // exactly like a caller that works.
  const REFUSED_KEYS = ['walls', 'lines', 'floors', 'dimensions'];
  let refusedItems = { walls: [], lines: [], floors: [], dimensions: [] };
  // PAINT THE SUBSTITUTE, NEVER PERSIST IT (RULING-substitution-is-not-a-save,
  // Movie, 11 Sep). `LEGACY_WALL_TYPES` rewrites a retired wall type to the
  // nearest surviving assembly so the wall can be DRAWN — a reader's
  // accommodation, and the right one. This page also WRITES, and re-emitting the
  // substitute makes the accommodation permanent: open an old house with 12"
  // foundation walls, change nothing, press SAVE, and four inches of concrete
  // are gone from the record with no message.
  //
  // The mapping is lossy and ONE-WAY. Nothing in the saved file records that a
  // wall was ever 12", so when the thicker types come back — one row each in
  // WALL_TYPES — the app recovers and already-round-tripped drawings do not.
  //
  // The rule this belongs to: a page may SHOW less than the file contains; it
  // may not SAVE less than the file contains. Keyed by wall id and holding both
  // halves, so a type the drafter later changes on purpose is not quietly
  // reverted to the legacy one.
  //
  // THE CONTRACT, AND IT IS NOT ENFORCED BY ANYTHING. The serializer decides
  // whether to restore by asking whether the wall still carries the type this
  // page substituted — it INFERS the drafter's intent, and there is one case it
  // infers wrongly: a drafter who deliberately picks the very type the
  // substitution chose is indistinguishable from the substitution, so the save
  // would put the retired type back over their choice. Skipper measured that on
  // MODEL.dc.html by modelling this guard as a mutant, and it fails there.
  //
  // It cannot happen HERE, today: every write of `wallType` in this file is the
  // creation site, the load-path normaliser, or the serializer. There is no
  // picker and no change-type verb, so an existing wall's type cannot be
  // reassigned at all. That makes this a LATENT defect, not a live one — and it
  // is why there is no clear-on-assignment call in this file. A call at the
  // creation site would be a no-op by construction: a freshly drawn wall has
  // never been loaded and has no kept original to forget, so the line could
  // never fail and would read to the next person as a guard that is working.
  //
  // So the rule is written and not pretended: ANY site that assigns a type to an
  // existing wall must delete that wall's entry here. The day the picker is
  // added, this comment is the thing that has to be obeyed, because nothing in
  // the code will complain.
  let substitutedWallTypes = new Map();

  const say = (title, body) => {
    noticeBody.innerHTML = `<h1>${title}</h1>${body}`;
    notice.classList.add('show');
  };

  // ── canvas sizing ─────────────────────────────────────────────────────────
  // Backing store in device pixels, drawing in CSS pixels, so lines are crisp
  // on a retina screen without every painter having to know the ratio.
  let dpr = 1, cssW = 0, cssH = 0;
  const resize = () => {
    dpr = window.devicePixelRatio || 1;
    cssW = canvas.clientWidth;
    cssH = canvas.clientHeight;
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    paint();
  };

  // ── world → screen ────────────────────────────────────────────────────────
  const toS = p => ({
    x: (p.x - view.cx) * view.scale + cssW / 2,
    y: (p.z - view.cz) * view.scale + cssH / 2,
  });
  const toWorld = (sx, sy) => ({
    x: (sx - cssW / 2) / view.scale + view.cx,
    z: (sy - cssH / 2) / view.scale + view.cz,
  });

  // ── which level, and which drawing OF that level ──────────────────────────
  // Tier 1 painted all five levels at once, stacked. A drafter looks at one
  // level at a time, so this picks one -- and picking one is not
  // `levelId === active`, because a level is not one drawing. MAIN FL has a
  // walls plan, a floor layout, a stair drawing and an electrical plan;
  // FOUNDATION has basement walls and the concrete below them. That table is
  // layer-views.js, already shared with LAYOUT, so this reads it rather than
  // restating it.
  //
  // MAIN_FLOOR is an ID (3), not an index. MODEL.dc.html's own
  // state.activeLevelIdx is an INDEX into DEFAULT_LEVELS, and for the default
  // list index 3 also happens to be id 3 -- they stop agreeing the moment a
  // level is inserted. See RD-DOCUMENTS/SPEC-model-html-tiers.md.
  const MAIN_FLOOR_LEVEL_ID = 3;
  const levelIds = () => (drawing?.levels || []).map(level => Number(level.id));
  const activeLevelId = () => {
    if (thumbTarget) return thumbTarget.levelId;
    const asked = Number(params.get('level'));
    if (Number.isFinite(asked) && levelIds().includes(asked)) return asked;
    if (params.get('level') !== null && drawing) {
      console.warn(`MODEL: unknown level "${params.get('level')}"; using MAIN FL. `
        + `Known: ${levelIds().join(', ')}`);
    }
    return levelIds().includes(MAIN_FLOOR_LEVEL_ID) ? MAIN_FLOOR_LEVEL_ID : levelIds()[0];
  };

  // ── what is on the page ───────────────────────────────────────────────────
  // FIVE RULES, NOT ONE, measured from MODEL.dc.html:6505-6513:
  //   walls / lines / floors  filter by level AND view
  //   roofs / outlines        filter by level ONLY -- no view filter at all
  //   and the view filter switches ITSELF OFF on a level that has no layer
  //   views (ROOF, SITE), which show everything they hold.
  //
  // The trap in the third rule: floors default to view 'floor', not 'plan'
  // (MODEL.dc.html:2905). Writing `view === 'plan'` hides every floor in the
  // drawing and reads exactly like a broken painter.
  // ?view= PICKS THE DRAWING, and without it half the level is unreachable.
  //
  // Tier 2a defaulted the layer view and offered no way to change it, which
  // quietly switched the floors off: MAIN FL and 2ND FL default to the walls
  // plan, FOUNDATION to the concrete, and a floor saves with `view: 'floor'`
  // (MODEL.dc.html:2905). So `(view || 'plan') === viewId` was false for every
  // floor on every reachable view, paintFloors() drew nothing anywhere, and
  // the readout said `floors 0` on a drawing that has them. Tier 1 painted
  // them; tier 2a turned them off and no spec noticed, because the specs
  // asserted walls.
  //
  // A level is not one drawing. Choosing the level and not the drawing is
  // choosing half.
  // A CUT IS A VIEW, and it is named in the URL like every other one.
  // SPEC-model-html-cut-views.md called for "a state saying which one you are
  // looking at" and the first draft of that spec proposed building one. The
  // page already had it: `?view=` keyed through the URL. A second source of
  // truth for what is on screen is the defect shape this project spent the
  // week removing, so the section reuses the mechanism instead — which also
  // means it is shareable, survives a reload, and inherits the level-change
  // handling below for free.
  const CUT_VIEW = 'cut:';
  // BOTH LISTS, as the old page's _cutById reads them (MODEL.dc.html:9531):
  // the four DERIVED elevations first, then the drafter's stored sections.
  //
  // This searched `cuts()` alone when the host shipped, which was wrong and
  // quiet about it: E1-E4 are not in `cuts` -- they are computed from the
  // plan's extents -- so every `?view=cut:E1` resolved to null, fell through
  // to the layer-view branch, and warned about a view the level does not
  // have. Nothing caught it because nothing had asked for an elevation yet;
  // the rail is what asks, and it would have seated four dead cards.
  const cutForViewId = id => {
    if (typeof id !== 'string' || !id.startsWith(CUT_VIEW)) return null;
    const wanted = id.slice(CUT_VIEW.length);
    return allCuts().find(cut => String(cut.id) === wanted) || null;
  };
  const activeCut = () => cutForViewId(params.get('view'));

  const activeViewId = () => {
    if (thumbTarget) return thumbTarget.viewId;
    const LV = window.DraftLayerViews;
    const levelId = activeLevelId();
    const views = LV.layerViewsForLevelId(levelId);
    const asked = params.get('view');
    // Before the layer-view lookup, or a cut would be reported as a view the
    // level does not have and warn on every paint.
    if (cutForViewId(asked)) return asked;
    if (!views.length) return null;               // ROOF / SITE hold everything
    if (asked && views.some(v => v.id === asked)) return asked;
    if (asked) {
      console.warn(`MODEL: level ${levelId} has no view "${asked}"; using its `
        + `default. Known: ${views.map(v => v.id).join(', ')}`);
    }
    return LV.defaultLayerViewId(levelId);
  };

  const onActiveLevel = () => {
    const LV = window.DraftLayerViews;
    const levelId = activeLevelId();
    const views = LV.layerViewsForLevelId(levelId);
    const viewId = activeViewId();
    // THE FALLBACK DIFFERS BY ITEM TYPE. Measured, not assumed: every
    // `.view || '...'` in MODEL.dc.html reads 'plan' -- wall, line, stair,
    // opening, fixture, device, seg, 20-odd sites -- EXCEPT floors, which
    // read 'floor' (MODEL.dc.html:2905, 9029, 9089, 9098, 9162, 17025).
    //
    // A floor outline's home layer set is FLOOR, or FOUNDATION where it is a
    // concrete slab; it was never a plan-set item. Defaulting floors to
    // 'plan' put a view-less floor on the wrong layer set -- invisible on
    // every fixture, because a floor drawn by the old page always carries an
    // explicit `view`, and visible only on an older saved drawing whose
    // floors predate the field. Those are exactly the drawings that have to
    // keep opening, so the spec builds that case by hand.
    const onPlan = (item, fallback = 'plan') =>
      !views.length || (item.view || fallback) === viewId;
    const byLevel = item => Number(item.levelId) === levelId;
    return { levelId, viewId, onPlan, byLevel };
  };
  const walls = () => (drawing?.walls || [])
    .filter(w => { const f = onActiveLevel(); return f.byLevel(w) && f.onPlan(w); });
  const lines = () => (drawing?.lines || [])
    .filter(l => { const f = onActiveLevel(); return f.byLevel(l) && f.onPlan(l); });
  const floors = () => (drawing?.floors || [])
    .filter(x => { const f = onActiveLevel(); return f.byLevel(x) && f.onPlan(x, 'floor'); });
  // Rules four and five: LEVEL ONLY. A roof footprint and a reference shape are
  // level-wide -- every drawing of the level shows them -- so they take no view
  // filter at all. Copying the walls line here would hide both on FOUNDATION.
  const roofs = () => (drawing?.roofs || [])
    .filter(r => onActiveLevel().byLevel(r));
  // DIMENSIONS TAKE NO FALLBACK, and that is not an oversight -- it is the
  // one collection whose invariant is guaranteed upstream. MODEL.dc.html:8929
  // filters `dimension.view === view` with no `|| 'plan'`, because
  // format.dimensions (drawing-format.js:101) DROPS any dimension whose view
  // is not one of plan/floor/e-power/foundation. By the time anything filters
  // them, every survivor carries an explicit view.
  //
  // So copying the walls line here would be worse than redundant: `|| 'plan'`
  // can only fire on a dimension the normaliser already rejected, which means
  // it would only ever run on geometry that is not in the array. Writing the
  // filter to match the guarantee is what makes the guarantee readable.
  const dimensions = () => (drawing?.dimensions || [])
    .filter(d => { const f = onActiveLevel(); return f.byLevel(d)
      && (f.viewId == null || d.view === f.viewId); });
  // NOTES TAKE THE DIMENSION RULE -- level, plus view where the level has views
  // -- and then one exclusion the bone applies on top of it. MODEL.dc.html:7025
  // filters `note.view !== 'stair'` AFTER _activeNotes(), which reads redundant
  // beside the view match and is not: a level with NO layer views matches every
  // note it holds, stair ones included, and the STAIR workspace is a separate
  // surface with its own painter (drawStairNotes2D, tier 3).
  const notes = () => (drawing?.notes || [])
    .filter(n => { const f = onActiveLevel(); return f.byLevel(n)
      && (f.viewId == null || n.view === f.viewId)
      && n.view !== 'stair'; });
  // FIXTURES INHERIT THEIR WALL'S VISIBILITY -- they do not carry a view rule
  // of their own. MODEL.dc.html:_activeFixtures keeps a fixture whose levelId
  // matches AND whose wallId is in the set of walls the page is showing, and
  // the note above it says why in as many words: "a fixture inherits the
  // layer-view exclusion rather than having one of its own", and that
  // inheritance is the only thing keeping a sink unselectable on the ELECTRIC
  // sheet. Filtering on `fixture.view` here would look equivalent and would
  // not be -- a fixture on a hidden wall would come back.
  //
  // ONE DIFFERENCE, STATED RATHER THAN HIDDEN. The bone unions in
  // _sharedContextWalls() -- the foundation walls it ghosts under a plan, the
  // plan walls it ghosts under e-power. This page paints no context walls at
  // all (walls() is the plain view filter), so keying off walls() gives it the
  // same RULE against a smaller set: a fixture shows when its host wall shows
  // HERE. When context walls arrive, this follows them with no edit, which is
  // the reason it reads walls() rather than repeating the filter.
  const fixtures = () => {
    const shown = new Set(walls().map(w => w.id));
    return (drawing?.fixtures || [])
      .filter(fx => onActiveLevel().byLevel(fx) && shown.has(fx.wallId));
  };
  // CUTS TAKE NO LEVEL FILTER, and that is the bone's rule rather than an
  // omission here. _drawCuts2D (MODEL.dc.html:7432) is called ungated -- no
  // activeVisible, no view test -- because a section cut is a fact about the
  // BUILDING, not about one storey: the same line through the house is what
  // the drafter wants to see whichever floor is on screen. The four auto marks
  // carry levelId: null, which says the same thing in the data.
  const cuts = () => drawing?.cuts || [];
  // STAIRS FILTER STRICTLY ON view, and that is copied deliberately rather
  // than routed through onPlan(). _activeStairs (MODEL.dc.html) reads
  // `stair.view === view` with NO `|| 'plan'` fallback, unlike every wall,
  // line and fixture beside it. So a stair saved without a view is hidden on
  // a level that has layer views, and shown on one that has none. Reusing
  // onPlan() here would have quietly REVEALED those stairs on this page only.
  const stairs = () => {
    const { levelId, viewId } = onActiveLevel();
    const views = window.DraftLayerViews.layerViewsForLevelId(levelId);
    return (drawing?.stairs || [])
      .filter(stair => Number(stair.levelId) === levelId
        && (!views.length || stair.view === viewId));
  };
  // UNDERLAYS TAKE THE LEVEL FILTER ONLY -- no view filter, because an
  // underlay is a tracing image for the whole level, not for one layer set.
  // That is the painter's own rule (drawUnderlays2D skips on
  // `underlay.levelId !== env.activeLevel.id` and tests nothing else), copied
  // rather than invented.
  const underlays = () => (drawing?.underlays || [])
    .filter(underlay => Number(underlay.levelId) === activeLevelId());

  // Decoded tracing images, by underlay id. Empty until the async loader
  // fills it, which is why paint() must tolerate a missing image -- and the
  // painter already does: `if (!image) continue`.
  const underlayImages = new Map();

  // RASTER ONLY, AND THE PDF CASE IS NAMED RATHER THAN SKIPPED.
  //
  // MODEL.dc.html decodes both kinds: images straight from the blob, PDF pages
  // re-rendered through pdf.js. Carrying pdf.js here costs 1.37 MB
  // (vendor/pdf-3.11.174.min.js + its worker) against a page whose whole claim
  // is an exact, short dependency list -- so this page decodes rasters and
  // says so about the rest. The bone's loader already contains the same
  // refusal (`if (!window.pdfjsLib) continue;`); the difference is that this
  // page admits it on screen instead of drawing nothing and looking broken.
  const loadUnderlayImages = async () => {
    for (const underlay of (drawing?.underlays || [])) {
      if (underlayImages.has(underlay.id) || underlay.kind === 'pdf') continue;
      try {
        const file = await window.SharedFileStore.loadNamedFile(underlay.id, 'underlays');
        if (!file) continue;
        const bitmap = await createImageBitmap(file).catch(() => null);
        if (!bitmap) continue;
        const canvas = document.createElement('canvas');
        canvas.width = bitmap.width;
        canvas.height = bitmap.height;
        canvas.getContext('2d').drawImage(bitmap, 0, 0);
        bitmap.close();
        underlayImages.set(underlay.id, canvas);
        // Each image repaints as it lands, rather than one repaint at the end:
        // a large tracing image can take a moment and the drawing above it is
        // already correct without it.
        paint();
        updateReadout();
      } catch (error) {
        console.warn(`MODEL: underlay ${underlay.id} failed to load:`, error);
      }
    }
  };

  const shapes = () => (drawing?.shapes || [])
    .filter(sh => onActiveLevel().byLevel(sh));

  // BEAMS AND COLUMNS take the level AND view rule: a foundation beam has no
  // business on the main floor's plan, and the old page files them by view the
  // same way.
  const beams = () => (drawing?.beams || [])
    .filter(b => onActiveLevel().byLevel(b) && onActiveLevel().onPlan(b));
  const columns = () => (drawing?.columns || [])
    .filter(c => onActiveLevel().byLevel(c) && onActiveLevel().onPlan(c));
  // Outlines take the same LEVEL-ONLY rule as roofs -- rule four above. They
  // are the room and garage footprints, level-wide, so no view filter.
  const outlines = () => (drawing?.outlines || [])
    .filter(o => onActiveLevel().byLevel(o));

  // Every point that defines the drawing's extent, for fit-to-content.
  const allPoints = (wide = false) => {
    const pts = [];
    walls().forEach(w => { if (w.start && w.end) pts.push(w.start, w.end); });
    lines().forEach(l => { if (l.start && l.end) pts.push(l.start, l.end); });
    floors().forEach(f => (f.points || []).forEach(p => pts.push(p)));
    // ROOFS AND OUTLINES ONLY WHEN ASKED, and the scoping is the point.
    //
    // ROOF and SITE hold no walls, lines or floors at all -- a roof footprint
    // and an outline is the whole of them -- so a fit over the three above
    // finds nothing, falls back to scale 6 at the world origin, and draws the
    // level off the side of the canvas. The plan seats have to fit those two
    // levels, so they ask for all five, the way MODEL.dc.html's own thumbnail
    // bounds do (:7269).
    //
    // THE MAIN VIEW DELIBERATELY DOES NOT, even though it has the same gap.
    // Adding them there changes the default zoom of every drawing that owns a
    // roof or an outline -- which is nearly all of them -- and that showed up
    // immediately: model-html-corner.spec.js released a corner 2px from
    // another and it landed 0.66ft away instead of snapping, because 2px is a
    // different distance once the scale moves. Fixing a real fit bug is not a
    // licence to re-zoom the drafter's page inside a rail change. The gap is
    // written up rather than smuggled; pressing 0 on ROOF still fits to
    // nothing, and that is one line to change when somebody rules on it.
    if (wide) {
      roofs().forEach(r => (r.points || []).forEach(p => pts.push(p)));
      outlines().forEach(o => (o.points || []).forEach(p => pts.push(p)));
    }
    return pts.filter(p => Number.isFinite(p?.x) && Number.isFinite(p?.z));
  };

  const fit = (wide = false) => {
    const pts = allPoints(wide);
    if (!pts.length) { view.cx = 0; view.cz = 0; view.scale = 6; return; }
    let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
    pts.forEach(p => {
      if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
      if (p.z < minZ) minZ = p.z; if (p.z > maxZ) maxZ = p.z;
    });
    view.cx = (minX + maxX) / 2;
    view.cz = (minZ + maxZ) / 2;
    // A drawing one foot across must not zoom to a thousand pixels per foot,
    // and a zero-extent one must not divide by zero.
    const spanX = Math.max(maxX - minX, 1);
    const spanZ = Math.max(maxZ - minZ, 1);
    const margin = 0.86;
    view.scale = Math.min(cssW / spanX, cssH / spanZ) * margin;
    view.scale = Math.max(0.25, Math.min(view.scale, 200));
  };

  // ── painting ──────────────────────────────────────────────────────────────
  // THE DATUM IS THE DRAFTER'S ZERO, not the world's. MODEL.dc.html sets
  // state.drawingOrigin from the drafter's FIRST CLICK (MODEL.dc.html:10360),
  // so the point they start on reads as 0,0 from then on, and drawGrid2D
  // anchors the grid to it. Movie, 3 Sep: "that way he always first clicks on
  // 0,0."
  //
  // No click, no datum, and therefore NO GRID. That is deliberate, not a gap:
  // tests/registration-grid.spec.js asserts it by name -- "an untouched model
  // space draws no grid, and the first node sets the datum" -- and the grid
  // cannot be anchored to a point the drafter has not chosen yet. Tier 1's
  // hand-rolled grid drew always, aligned to world 0,0, which was a
  // divergence from the old page rather than a feature.
  //
  // ABSENT AND NULL MEAN DIFFERENT THINGS. This is the tier-2a floors bug's
  // exact shape, so it is spelled out rather than compressed. MODEL.dc.html
  // :5160 reads:
  //     'drawingOrigin' in saved ? normalise(saved.drawingOrigin) : {x:0,z:0}
  // Absent = a drawing made before the datum existed. It was drawn on the
  // world grid, so 0,0 is what leaves every coordinate where it is. Explicit
  // null = "no origin yet", which is where NEW starts and how it avoids
  // silently adopting 0,0.
  //
  // `drawing.drawingOrigin || null` would collapse the two and strip the grid
  // from every old drawing -- and no fixture would catch it, because the old
  // page always writes the key now.
  const gridDatum = () => {
    if (!drawing) return null;
    if (!('drawingOrigin' in drawing)) return { x: 0, z: 0 };
    const raw = drawing.drawingOrigin;
    if (!raw || typeof raw !== 'object') return null;
    const x = Number(raw.x), z = Number(raw.z);
    return Number.isFinite(x) && Number.isFinite(z) ? { x, z } : null;
  };

  const paintGrid = () => {
    const R = window.DraftRender2D;
    if (!R) {
      throw new Error('MODEL.html: cannot paint the grid, render-2d.js did not '
        + 'load. Check the script order in the page head.');
    }
