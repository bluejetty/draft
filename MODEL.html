    if (levels.length <= 1) { window.alert('Cannot delete the last level.'); return false; }
    const idx = levels.findIndex(level => Number(level.id) === Number(levelId));
    if (idx < 0) return false;
    if (!window.confirm(`Delete level "${levels[idx].name}"? `
      + 'Geometry on this level will be removed.')) return false;

    // PENDING GEOMETRY BELONGS TO THE FLOOR IT WAS STARTED ON. Discard it
    // before the level list changes, or a half-drawn wall commits into
    // whichever floor the page lands on next.
    //
    // THIS WAS `setArmed(false)` AND THE MERGE THAT BROKE IT WAS CLEAN. The
    // tool register replaced the armed boolean, and setArmed went with it;
    // this call arrived from a branch written against the old shape, in a
    // region of the file neither side had touched, so git had nothing to
    // report. The line threw, deleteLevel stopped at its first statement, and
    // a level "deleted" with all its geometry still in the file -- which is
    // why tests/model-html-levels.spec.js's cascade check is worth its length.
    // setTool does what setArmed did and clears the pending anchor too, which
    // is what the paragraph above is actually asking for.
    setTool(RESTING_TOOL);
    const id = Number(levels[idx].id);
    // ASKED BEFORE THE LEVEL IS REMOVED, and that ordering is the whole of it.
    // Asking afterwards returns the FALLBACK -- activeLevelId drops to MAIN FL
    // and then to the first level when `?level=` names one that is gone -- so
    // the test "am I standing on the level being deleted" was never true and
    // the URL went on naming a level the drawing no longer had.
    const wasStandingHere = activeLevelId() === id;

    const droppedUnderlays = (drawing.underlays || []).filter(u => u && u.levelId === id);
    const goneIds = new Set();
    LEVEL_OWNED_COLLECTIONS.forEach(field => {
      if (!Array.isArray(drawing[field])) return;
      drawing[field].forEach(item => { if (item && item.levelId === id) goneIds.add(String(item.id)); });
      drawing[field] = drawing[field].filter(item => !item || item.levelId !== id);
    });
    // An underlay's PICTURE lives outside the drawing, in its own bucket keyed
    // by the underlay id, so dropping the record is only half of it -- the
    // bytes would sit in the browser profile for ever with nothing pointing at
    // them.
    droppedUnderlays.forEach(underlay => {
      window.SharedFileStore?.removeNamedFile?.(underlay.id, 'underlays')
        ?.catch(error => console.warn('Underlay binary removal failed:', error));
    });
    // Cuts are owned by a level id, not by elevation: two levels can sit at the
    // same height, so only this level's own sections go with it.
    if (Array.isArray(drawing.cuts)) {
      drawing.cuts = drawing.cuts.filter(cut => cut && cut.levelId !== id);
    }
    // Groups reference members by {type, id} and can span levels, so they are
    // cleaned rather than dropped -- and a group left holding a dead id would
    // adopt the next item given that id, which is the fault the wall cascade
    // above already guards.
    if (Array.isArray(drawing.groups)) {
      drawing.groups.forEach(group => {
        if (group && Array.isArray(group.members)) {
          group.members = group.members.filter(m => m && !goneIds.has(String(m.id)));
        }
      });
      drawing.groups = drawing.groups.filter(g => g && Array.isArray(g.members) && g.members.length >= 2);
    }
    drawing.backgroundLevelIds = (drawing.backgroundLevelIds || []).filter(x => Number(x) !== id);
    if (drawing.backgroundLevelViews && typeof drawing.backgroundLevelViews === 'object') {
      delete drawing.backgroundLevelViews[String(id)];
    }
    drawing.levels = levels.filter((_, i) => i !== idx);

    // The drafter has to land somewhere real. If the level being deleted is
    // the one on screen, step to its neighbour rather than leaving `?level=`
    // pointing at a level that no longer exists.
    if (wasStandingHere) {
      const next = drawing.levels[Math.min(idx, drawing.levels.length - 1)];
      params.set('level', String(next.id));
      params.delete('view');
      syncUrl();
    }
    markDirty();
    buildChrome();
    paint();
    return true;
  };

  // WHICH ROW IS LIT, in one place. buildLevelsPanel draws the rows and this
  // lights them, so the rule lives once -- the level lookup having had four
  // homes (#325) is the reason that matters here rather than being tidy.
  const markActiveLayer = () => {
    if (!levelsPanel) return;
    const activeId = activeLevelId();
    const LV = window.DraftLayerViews;
    const asked = params.get('view');
    const live = asked && LV.layerViewsForLevelId(activeId).some(v => v.id === asked)
      ? asked : LV.defaultLayerViewId(activeId);
    levelsPanel.querySelectorAll('.lv-layer').forEach(row => {
      row.toggleAttribute('data-active', row.dataset.layer === `${activeId}:${live}`);
    });
    levelsPanel.querySelectorAll('.lv-card').forEach(card => {
      card.toggleAttribute('data-active', Number(card.dataset.level) === activeId);
    });
  };

  const buildLevelsPanel = () => {
    if (!levelsPanel) return;
    const levels = drawing?.levels || [];
    const LV = window.DraftLayerViews;
    const activeId = activeLevelId();
    levelsPanel.innerHTML = '';
    if (!levels.length) return;

    const head = document.createElement('div');
    head.className = 'lv-head';
    const title = document.createElement('div');
    title.className = 'lv-head-title';
    title.textContent = 'Levels';
    const datum = document.createElement('div');
    datum.className = 'lv-datum';
    // The old page's DATUM readout. It reads the stored elevationDatum rather
    // than assuming 0, because a drafter who has moved it would otherwise see
    // a panel confidently disagreeing with his own drawing.
    datum.textContent = `DATUM ${Number(drawing?.elevationDatum || 0)}'`;
    const add = document.createElement('button');
    add.type = 'button';
    add.className = 'lv-add';
    add.dataset.addLevel = '';
    add.textContent = '+ ADD';
    add.title = 'Add a level above the top floor';
    add.addEventListener('click', addLevel);
    head.append(title, datum, add);
    levelsPanel.append(head);

    levels.forEach(level => {
      const card = document.createElement('div');
      card.className = 'lv-card';
      card.dataset.level = String(level.id);
      if (Number(level.id) === activeId) card.toggleAttribute('data-active', true);

      const bar = document.createElement('div');
      bar.className = 'lv-bar';
      bar.style.background = level.color || 'var(--rule)';

      const body = document.createElement('div');
      body.className = 'lv-body';

      const name = document.createElement('button');
      name.type = 'button';
      name.className = 'lv-name';
      // NOT `data-level-pick`, which is the CHROME BAR'S SELECT. Naming these
      // buttons that made `locator('[data-level-pick]')` resolve to six
      // elements, and model-html-switcher.spec.js -- which drives the select
      // by exactly that attribute -- failed four ways on strict mode. The
      // collision was invisible here because that spec was never run against
      // the panel; CI found it. A panel row and a chrome control are not the
      // same control even when they do the same thing.
      name.dataset.levelRow = String(level.id);
      name.textContent = level.name || `level ${level.id}`;
      name.title = `Switch to ${level.name || level.id}`;
      name.addEventListener('click', () => goToLevel(level.id));

      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'lv-del';
      del.dataset.deleteLevel = String(level.id);
      del.textContent = '×';
      del.title = `Delete ${level.name || level.id}`;
      del.addEventListener('click', event => {
        event.stopPropagation();
        deleteLevel(level.id);
      });

      const headRow = document.createElement('div');
      headRow.className = 'lv-card-head';
      headRow.append(name, del);
      body.append(headRow);

      const views = LV.layerViewsForLevelId(level.id);
      if (views.length) {
        const stack = document.createElement('div');
        stack.className = 'lv-layers';
        views.forEach(view => {
          const row = document.createElement('button');
          row.type = 'button';
          row.className = 'lv-layer';
          row.dataset.layer = `${level.id}:${view.id}`;
          row.textContent = view.label || view.id;
          row.addEventListener('click', () => {
            if (Number(level.id) !== activeId) goToLevel(level.id);
            goToView(view.id);
          });
          stack.append(row);
        });
        body.append(stack);
      }

      card.append(bar, body);
      levelsPanel.append(card);
    });

    // ── ELEVATIONS ──────────────────────────────────────────────────────────
    // Real, and the same four the rail seats: autoElevationCuts is the one
    // home for that derivation, so the panel and the seats cannot disagree
    // about which elevations exist or what they are called.
    const section = (label, extra) => {
      const wrap = document.createElement('div');
      wrap.className = 'lv-head';
      wrap.style.marginTop = '8px';
      const t = document.createElement('div');
      t.className = 'lv-head-title';
      t.textContent = label;
      wrap.append(t);
      if (extra) wrap.append(extra);
      levelsPanel.append(wrap);
      return wrap;
    };
    const rowButton = (text, title, onClick, active) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'lv-layer';
      b.textContent = text;
      b.title = title;
      if (active) b.toggleAttribute('data-active', true);
      if (onClick) b.addEventListener('click', onClick);
      else b.disabled = true;
      levelsPanel.append(b);
      return b;
    };

    section('Elevations');
    const viewNow = params.get('view');
    autoElevationCuts().forEach(cut => {
      rowButton(`${cut.id} · ${elevationName(cut.id)}`,
        `${cut.id} — the ${elevationName(cut.id)} elevation; tap to bring it center`,
        () => goToView(CUT_VIEW + cut.id),
        viewNow === CUT_VIEW + cut.id);
    });

    // ── SECTIONS ────────────────────────────────────────────────────────────
    const stored = cuts();
    section('Sections');
    if (!stored.length) {
      // THE OLD PAGE SAYS "Press [C] to cut a view" AND THIS PAGE MUST NOT.
      // There is no [C] handler here and no cut tool -- grep the file. A hint
      // telling a drafter to press a key that does nothing is worse than no
      // hint, and it is the same seam the build bar is built on: say what is
      // true of THIS page, not what was true of the old one.
      const none = document.createElement('div');
      none.className = 'lv-empty';
      none.dataset.noSections = '';
      none.textContent = 'No sections. This page has no cut tool — sections are cut in LAYOUT.';
      levelsPanel.append(none);
    }
    stored.forEach(cut => {
      const row = document.createElement('div');
      row.className = 'lv-card-head';
      const b = rowButton(cut.name || cut.id,
        `${cut.name || cut.id} — tap to bring this section center`,
        () => goToView(CUT_VIEW + cut.id),
        viewNow === CUT_VIEW + cut.id);
      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'lv-del';
      del.dataset.deleteCut = String(cut.id);
      del.textContent = '×';
      del.title = `Delete ${cut.name || cut.id}`;
      del.addEventListener('click', event => {
        event.stopPropagation();
        if (!window.confirm(`Delete section "${cut.name || cut.id}"?`)) return;
        drawing.cuts = cuts().filter(c => c.id !== cut.id);
        // A drafter looking AT the section being deleted has to be moved off
        // it, or the page keeps painting a cut the drawing no longer has.
        if (params.get('view') === CUT_VIEW + cut.id) {
          params.delete('view');
          syncUrl();
        }
        markDirty();
        buildChrome();
        paint();
      });
      b.style.flex = '1';
      levelsPanel.removeChild(b);
      row.append(b, del);
      levelsPanel.append(row);
    });

    // ── BONEYARD ────────────────────────────────────────────────────────────
    // LISTED, NOT EDITED, and that is a ruling rather than an omission.
    // PARITY-model-html-vs-dc.md records the boneyard as "absent,
    // deliberately" on this page, and model-html-gestures.spec.js drives it:
    // the level picker offers no negative pseudo-level, so there is nowhere
    // for a new shelf to be used. "+ SHELF" would write a shelf into the file
    // that this page can never open.
    const shelves = drawing?.boneyardShelves || [];
    section('Boneyard');
    if (!shelves.length) {
      const none = document.createElement('div');
      none.className = 'lv-empty';
      none.textContent = 'No shelves.';
      levelsPanel.append(none);
    }
    shelves.forEach(shelf => {
      const row = document.createElement('div');
      row.className = 'lv-empty';
      row.dataset.shelf = String(shelf.id);
      row.textContent = shelf.name || `shelf ${shelf.id}`;
      levelsPanel.append(row);
    });

    // ── 3D VIEW ─────────────────────────────────────────────────────────────
    // A CHAIR, NOT A BUTTON, which is this page's own rule for a view that
    // does not exist yet. There is no WebGL, no three.js and no perspective
    // camera in this file at all -- so an enabled 3D VIEW would be a button
    // that cannot do the one thing its label promises.
    const threeD = rowButton('⬡ 3D VIEW',
      'No 3D view on this page yet — the drawing is 2D only here', null, false);
    threeD.dataset.view3d = '';

    markActiveLayer();
  };

  const buildChrome = () => {
    const levels = drawing?.levels || [];
    levelPick.innerHTML = '';
    levels.forEach(level => {
      const option = document.createElement('option');
      option.value = String(level.id);
      option.textContent = level.name || `level ${level.id}`;
      option.selected = Number(level.id) === activeLevelId();
      levelPick.append(option);
    });
    fillViewPick();
    buildLevelsPanel();
    chromeBar.hidden = false;
  };

  const goToLevel = id => {
    params.set('level', String(id));
    // THE VIEW IS KEPT WHERE THE NEW LEVEL HAS IT, dropped where it does not.
    // MAIN FL and 2ND FL share the same four views, so a drafter comparing
    // one floor's electrical plan with the next stays on ELECTRIC rather than
    // being thrown back to walls at every switch. FOUNDATION has no 'stair',
    // so arriving there falls to that level's own default -- and dropping the
    // parameter is how it falls, since leaving a stale `?view=stair` in the
    // URL would make activeViewId() warn about a view the level never had.
    const views = window.DraftLayerViews.layerViewsForLevelId(Number(id));
    const asked = params.get('view');
    if (!asked || !views.some(view => view.id === asked)) params.delete('view');
    syncUrl();
    buildChrome();
    paint();
  };

  levelPick.addEventListener('change', () => goToLevel(levelPick.value));
  // ONE WAY INTO A VIEW, for the picker and for a seat press. Both change
  // what is looked at and nothing that is saved: a query parameter and a
  // repaint, with `drawing` untouched and markDirty uncalled.
  const goToView = viewId => {
    params.set('view', viewId);
    syncUrl();
    // No buildChrome(): the level did not change, so the option lists are
    // still right. The picker's own selection is moved here rather than by
    // the browser, because a seat press has to move it too -- the rail and
    // the picker are two controls on ONE piece of state, and a seat that left
    // the picker behind would put two answers on screen at once.
    if (!viewWrap.hidden) viewPick.value = viewId;
    // AND THE PANEL, which is the THIRD control on this one piece of state.
    // The comment above warned about exactly this and I still missed it: a
    // layer row clicked on another level moved the URL, the plan and the
    // picker to STAIR while the panel went on lighting PLAN, because
    // goToLevel rebuilt the panel before goToView had set the view. Two
    // answers on screen at once, which is what that rule exists to stop.
    markActiveLayer();
    paint();
  };

  viewPick.addEventListener('change', () => goToView(viewPick.value));

  // ── the view rail ─────────────────────────────────────────────────────────
  // SIX SEATS, ALWAYS SIX. The rail shows E1-E4 and S1-S2 whether or not those
  // views exist, because a seating chart with gaps in it is a worse answer to
  // "what can I look at" than one with empty chairs.
  //
  // THE PAIRING IS THE OLD PAGE'S. MODEL.dc.html fills two columns across:
  // E1|E3, then E2|E4 (:7266-7267), and the section seats side by side at the
  // bottom (:7281-7290). Reading down a column would put E1 above E2, which is
  // not where a drafter who knows that rail expects to find them.
  // THE FULL CHART, IN MOVIE'S ORDER (12 Sep), so the six below are the front
  // of a list rather than a list of their own:
  //
  //     1. the four elevations          E1|E3 over E2|E4        <- built
  //     2. ROOF PLAN and SITE PLAN
  //     3. the floor plans, level by level
  //     4. the sections                 S1|S2                   <- built
  //     5. the electric plan
  //
  // It is NOT MODEL.dc.html's order, which runs the sections last after every
  // plan (:7281). Sections sit ahead of the electric plan here because that is
  // where Movie wants to find them. Rows 2, 3 and 5 are not built; when they
  // are, they go between these two groups rather than after them, which is why
  // the order is written down now instead of inferred from the array later.
  // THE SEATING CHART IS DERIVED, not listed. MODEL.dc.html:7160
  // `_viewRailCards` walks `state.levels` to build it, and that is the whole
  // reason the LEVELS / LAYERS panel came first: add a level and two seats
  // appear, delete one and two leave. A fixed list of fourteen looks right on
  // Movie's bungalow today and is wrong the first time he adds a floor.
  //
  // Counted from the old page on proto/perf-bungalow.draft rather than taken
  // from the order, which said twelve -- it is twelve FILLED seats and two
  // empty section chairs, fourteen elements:
  //
  //     E1 · FRONT            E3 · BACK
  //     E2 · LEFT             E4 · RIGHT
  //     ROOF PLAN             SITE PLAN
  //     2ND FL PLAN (WALLS)   2ND FL LAYOUT (FLOOR)
  //     MAIN FL PLAN (WALLS)  MAIN FL LAYOUT (FLOOR)
  //     FOUNDATION            BASEMENT (WALLS)
  //     S1                    S2
  //
  // The rail is two columns, so the flat order is row-major: inner, outer,
  // inner, outer. SITE and ROOF are seated as a PAIR in row three rather than
  // getting a plan/layout row each, because layerViewsForLevelId answers with
  // none for them -- the same fact the panel shows by giving their cards no
  // layer rows.
  // ROOF is level 7 and SITE is level 8 -- MODEL.dc.html:7201 seats them by
  // id, and layer-views.js calls the pair WHOLE_LEVEL_IDS. By id rather than
  // by name, so renaming a level cannot empty the row; and if a drawing has
  // no ROOF, that seat is ABSENT rather than an empty chair, which is the old
  // page's own `push` skipping a falsy card.
  const ROOF_LEVEL_ID = 7, SITE_LEVEL_ID = 8;
  const seatingChart = () => {
    const LV = window.DraftLayerViews;
    const levels = drawing?.levels || [];
    const byId = id => levels.find(level => Number(level.id) === id) || null;
    const seats = [];
    const planSeat = (level, viewId, label) => {
      if (level) seats.push({ kind: 'plan', levelId: Number(level.id), viewId, label });
    };
    ['E1', 'E3', 'E2', 'E4'].forEach(id => seats.push({ kind: 'cut', name: id }));
    planSeat(byId(ROOF_LEVEL_ID), null, 'ROOF PLAN');
    planSeat(byId(SITE_LEVEL_ID), null, 'SITE PLAN');
    levels.forEach(level => {
      const views = LV.layerViewsForLevelId(level.id);
      if (!views.length) return;
      // THE FOUNDATION PAIR IS `foundation` AND `plan`, and the second one is
      // labelled BASEMENT (WALLS) -- there is no `basement` view id. Reading
      // the label as if it named a view is how this would have seated a blank.
      if (views.some(view => view.id === 'foundation')) {
        planSeat(level, 'foundation', 'FOUNDATION');
        planSeat(level, 'plan', 'BASEMENT (WALLS)');
      } else {
        planSeat(level, 'plan', `${level.name} PLAN (WALLS)`);
        planSeat(level, 'floor', `${level.name} LAYOUT (FLOOR)`);
      }
    });
    // SECTIONS FILL ACROSS, with two chairs standing ready before anything is
    // cut (:7215). Padded to a minimum of two, not to an even number: the
    // rows above are balanced pairs, so appending in order is the old page's
    // "whichever column is shorter".
    const stored = cuts();
    for (let n = 0; n < Math.max(2, stored.length); n += 1) {
      seats.push({ kind: 'cut', name: `S${n + 1}` });
    }
    return seats;
  };

  const rail = document.getElementById('view-rail');
  let railEpoch = -1;
  let railFrame = null;
  // A PASS IN FLIGHT: the seats still to paint, the env they are being painted
  // against, and the total so far. One seat lands per frame, so a pass spans
  // several -- see repaintSeats for why, and for what that does NOT fix.
  let railQueue = null;
  let railPassEnv = null;
  let railPassMs = 0;

  // WHICH CUT SITS IN A SEAT. Elevations are looked up BY ID -- E3 is the back
  // of the house wherever it falls in the array. Sections are seated BY
  // POSITION, which is the old page's rule and not an oversight of mine: it
  // maps `cuts` across the seats in order (:7281), so the first stored cut
  // takes the first seat whatever the drafter named it.
  const seatFor = name => {
    if (name[0] === 'E') {
      const cut = autoElevationCuts().find(c => String(c.id) === name) || null;
      return {
        cut,
        label: cut ? cutLabel(cut) : `${name} · ${elevationName(name)}`,
        title: cut
          ? `${cut.name || name} — the ${elevationName(name)} elevation; tap to bring it center`
          // The old page's words for an empty elevation seat, and still true
          // here: nobody cuts these by hand, the house cuts them for you.
          : `${name} — this elevation cuts itself when the house builds`,
      };
    }
    const cut = cuts()[Number(name.slice(1)) - 1] || null;
    return {
      cut,
      label: cut ? cutLabel(cut) : name,
      // NOT the old page's "tap to cut a section into this screen". That seat
      // offers a creation gesture this page has not got yet (SPEC §3), and a
      // title promising a tap that does nothing is worse than a plain one.
      title: cut
        ? `${cut.name || name} — tap to bring this section center`
        : `${name} — cut a section on the plan and it takes this seat`,
    };
  };

  // ONE SPEC FOR EITHER KIND OF SEAT. A cut seat shows a section or an
  // elevation and a plan seat shows a level's drawing, but both answer the
  // same four questions -- what it is called, what it says on hover, whether
  // it is the view on screen, and where a press goes -- so the rail below
  // does not care which it is holding.
  const seatSpec = entry => {
    if (entry.kind === 'cut') {
      const base = seatFor(entry.name);
      return { ...base,
        key: `cut:${entry.name}`,
        // THE NAME STAYS THE NAME. `data-seat` is what the tap guard prints
        // when a press lands on chrome and what every seat assertion looks up
        // by, so a cut seat is still E1 or S1 and a plan seat gets a readable
        // level:view of its own. The rebuild key is separate, below.
        seatId: entry.name,
        active: Boolean(base.cut) && params.get('view') === CUT_VIEW + base.cut.id,
        press: base.cut ? () => goToView(CUT_VIEW + base.cut.id) : null };
    }
    // A PLAN SEAT IS LIVE WHENEVER THE PAGE IS ON THAT LEVEL AND DRAWING.
    // Asked of activeLevelId/activeViewId rather than of the URL, because a
    // level with no `?view=` is still showing its default -- the same reason
    // the panel's lit row is computed and not read off the query string.
    const onIt = !cutForViewId(params.get('view'))
      && activeLevelId() === entry.levelId
      && (entry.viewId === null || activeViewId() === entry.viewId);
    return {
      cut: null,
      plan: entry,
      key: `plan:${entry.levelId}:${entry.viewId || ''}`,
      seatId: `${entry.levelId}:${entry.viewId || 'all'}`,
      label: entry.label,
      title: `${entry.label} — tap to bring this plan center`,
      active: onIt,
      press: () => {
        if (activeLevelId() !== entry.levelId) goToLevel(entry.levelId);
        if (entry.viewId) goToView(entry.viewId);
        else { params.delete('view'); syncUrl(); buildChrome(); paint(); }
      },
    };
  };

  // THE SEATS THE RAIL IS CURRENTLY HOLDING, so the DOM is rebuilt when the
  // CHART changes and not on every paint. Adding a level adds two seats and
  // deleting one takes two away -- that is the item this whole order exists
  // to demonstrate, so the rail cannot assume its own length.
  let railKeys = '';
  const syncRail = () => {
    if (!drawing) return;
    const chart = seatingChart();
    const specs = chart.map(seatSpec);
    const keys = specs.map(spec => spec.key).join('|');
    if (keys !== railKeys) {
      railKeys = keys;
      rail.innerHTML = '';
      specs.forEach(spec => {
        const seat = document.createElement('button');
        seat.type = 'button';
        seat.className = 'seat';
        seat.dataset.seat = spec.seatId;
        seat.dataset.seatKey = spec.key;
        const screen = document.createElement('canvas');
        // 2x the CSS size, so the lines are crisp on a retina panel. The old
        // page uses 232x152 for a 116x76 seat (:7306); these seats are 82x54,
        // small enough that the rail still fits once the plan cards join it.
        screen.width = 164; screen.height = 108;
        seat.append(screen);
        const label = document.createElement('div');
        label.className = 'seat-label';
        seat.append(label);
        rail.append(seat);
      });
    }
    specs.forEach((spec, i) => {
      const seat = rail.children[i];
      seat.title = spec.title;
      seat.lastChild.textContent = spec.label;
      // A CHAIR, NOT A BUTTON, for a seat with nothing behind it -- and a
      // plan seat always has something behind it, because the chart only
      // seats levels the drawing actually holds.
      seat.disabled = !spec.press;
      seat.classList.toggle('active', spec.active);
      seat.onclick = spec.press;
    });

    // THE THUMBNAILS, ON THE NEXT FRAME, AND ONLY WHEN THE DRAWING MOVED.
    //
    // Two gates, and they do different jobs. The EPOCH says whether there is
    // anything new to draw -- six paints on every pan and zoom would redraw
    // six pictures that did not change, which is MODEL.dc.html's own rule at
    // :7203, "Repaints only when the model changes, never on mouse traffic".
    // The FRAME says when to do it.
    //
    // The frame gate is the one I missed first time, and it is the whole
    // difference between this rail and the old page's. syncRail is reached
    // from paint(), which runs INSIDE the click handler that commits a wall --
    // so painting here put the rail's whole cost in the middle of the
    // drafter's gesture. MODEL.dc.html never does that: it calls
    // _syncViewRails from _animate (:7188), its requestAnimationFrame loop, so
    // the edit handler returns, the wall appears, and the rail catches up on
    // the next frame. The work is the same; the felt difference is a wall that
    // lands instantly against one that lands after a stutter.
    //
    // That is also why the elevations can be pictures again. They cost ~45 ms
    // each and the labels fallback existed because four of them blocked the
    // gesture; off the critical path they cost the drafter nothing they can
    // feel, which is how the old page has always shown them.
    //
    // COALESCED, because an edit can bump the epoch again before the frame
    // runs. One pending frame at a time, and it draws whatever the epoch says
    // when it arrives -- not once per bump.
    if (railEpoch !== modelEpoch && railFrame === null) {
      railFrame = requestAnimationFrame(stepSeats);
    }
    rail.hidden = false;
  };

  // ONE SEAT PER FRAME, and the reason is a measurement rather than a taste.
  //
  // Painting all six in one rAF is a single task the length of the whole rail,
  // and on `repro-garage-house` that task is 47 ms against the browser's 50 ms
  // longtask threshold -- so the page reported a main-thread block on about
  // three runs in five. Attributed rather than guessed: the longtask entry's
  // startTime equals the first painter call's, to the millisecond, across
  // three runs, and it is always the FIRST edit.
  //
  //     EDIT 1  E1 15.1  E3 14.7  E2 9.7  E4 6.9  S1 0.8  = 47.2 ms  -> 50 ms long task
  //     EDIT 2  E1 10.3  E3  9.6  E2 7.6  E4 9.7  S1 0.9  = 38.1 ms     none
  //     EDIT 4  E1  7.2  E3  6.7  E2 7.1  E4 5.4  S1 0.5  = 26.9 ms     none
  //
  // Devin's ruling, and the trade in his words: a drafter cannot see four
  // thumbnails land in one frame anyway; they CAN feel a 47 ms lurch. The work
  // is identical, the longest task becomes one elevation instead of four, and
  // the cost is that the last seat settles a few frames after the edit.
  //
  // WHAT THIS DOES NOT FIX, kept here because it would otherwise be forgotten
  // the moment the spec goes green:
  //   - The steady state is four elevations at ~7 ms = 28 ms, 56% of the
  //     threshold. Splitting the frame buys headroom; it does not retire the
  //     question, and the honest answer is still a cheaper elevation painter.
  //   - E1 and E3 cost 15-16 ms on the first edit against ~7 ms after it.
  //     That is a FIRST-PAINT cost, not an outlier to cut -- it was chased and
  //     it is warmup, so nobody need chase it twice.
  // The standing pre-ruling on both: make the painter cheaper, do not move the
  // line.
  const stepSeats = () => {
    railFrame = null;
    if (!drawing || !rail.children.length) { railQueue = null; return; }
    // A FRESH PASS when there is none, or when an edit landed mid-pass. The
    // epoch check is the coalescing the single-frame version did at the
    // scheduler; at seat granularity it has to happen here too, or a pass
    // started before an edit would finish painting the model as it was.
    if (railQueue === null || railEpoch !== modelEpoch) {
      railEpoch = modelEpoch;
      railPassEnv = cutEnv();
      railQueue = seatingChart().map((entry, i) => ({ spec: seatSpec(entry), i }));
      railPassMs = 0;
    }
    const t0 = performance.now();
    const { spec, i } = railQueue.shift();
    paintSeat(spec, i, railPassEnv);
    railPassMs += performance.now() - t0;
    if (railQueue.length) {
      railFrame = requestAnimationFrame(stepSeats);
      return;
    }
    railQueue = null;
    railPassEnv = null;
    // THE NUMBER THE WHOLE LIVE-THUMBNAIL DECISION RESTS ON, on screen
    // rather than in a commit message. The spec recommended label-only seats
    // precisely because nobody had measured this; it is measured here, on
    // whatever house the drafter actually has open, and it is the cost of an
    // EDIT rather than of a frame. It is still the whole pass -- splitting the
    // frames changed when the work happens, not how much of it there is.
    lastRailMs = railPassMs;
    // AND SAY SO. updateReadout runs inside paint(), which is over before
    // this frame fires, so without this the readout carries the PREVIOUS
    // repaint's number for ever -- 0 on the first load, and one edit behind
    // after that. The synchronous version ordered these deliberately for
    // exactly this reason; deferring the paint put the staleness back, and
    // the instrument being one step behind is the fault it exists to catch.
    updateReadout();
  };

  // A LEVEL'S PLAN IN MINIATURE, drawn by the painters that draw the big one.
  // The viewport is swapped for the length of the call and restored in a
  // `finally`: ctx, the canvas size, the device ratio, the camera and the
  // thumb target all go back even if a painter throws, because a page left
  // pointing at a 82x54 seat would paint the drawing into a thumbnail and
  // look like the canvas had died.
  //
  // fit() is the page's own fit, not a second one -- it reads allPoints(),
  // which reads the filtered collections, which read activeLevelId(), which
  // reads thumbTarget. So the seat frames THAT level by the same rule the
  // drafter gets from pressing 0.
  const paintPlanThumb = (screen, levelId, viewId) => {
    const savedCtx = ctx, savedW = cssW, savedH = cssH, savedDpr = dpr;
    const savedView = { cx: view.cx, cz: view.cz, scale: view.scale };
    try {
      thumbTarget = { levelId: Number(levelId), viewId: viewId || null };
      ctx = screen.getContext('2d');
      // The seat canvas is 2x its CSS box, the same trick the main canvas
      // uses, so the miniature is crisp on a retina panel.
      dpr = 2; cssW = screen.width / dpr; cssH = screen.height / dpr;
      ctx.save();
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, cssW, cssH);
      // WIDE: this level may be ROOF or SITE, whose whole content is a roof
      // footprint and an outline. See allPoints.
      fit(true);
      // GEOMETRY ONLY. No grid, no underlays: a grid at 82px across is noise,
      // and an underlay is a decoded image per seat per edit. The old page's
      // thumbnail makes the same cut (:7269 draws the level's own geometry).
      paintFloors(); paintRoofs(); paintShapes();
      paintOutlines(); paintLines(); paintWalls();
      ctx.restore();
    } finally {
      ctx = savedCtx; cssW = savedW; cssH = savedH; dpr = savedDpr;
      view.cx = savedView.cx; view.cz = savedView.cz; view.scale = savedView.scale;
      thumbTarget = null;
    }
  };

  const paintSeat = (spec, i, env) => {
    const screen = rail.children[i] && rail.children[i].firstChild;
    if (!screen) return;
    // A PLAN SEAT GOES THROUGH THE PAGE'S OWN PAINTERS, not a second
    // miniature renderer -- see paintPlanThumb. It returns before the
    // clearRect below because it clears inside its own viewport swap, where
    // the size it is clearing is the size it is about to draw into.
    if (spec.plan) {
      paintPlanThumb(screen, spec.plan.levelId, spec.plan.viewId);
      return;
    }
    const c = screen.getContext('2d');
    c.clearRect(0, 0, screen.width, screen.height);
    if (!spec.cut) return;
    // A TRUE MINIATURE where one is affordable: the same painter that
    // draws the full-size view, through the same env. MODEL.dc.html's
    // thumbnail painter is a one-line wrapper over drawCutView (:10117),
    // so this is not a second, smaller renderer that could drift.
    //
    // ELEVATIONS DO NOT GET ONE, and the reason is what the seat is FOR,
    // not what it costs. A thumbnail earns its keep where the name does
    // not identify the view: S1 and S2 tell a drafter nothing about which
    // section is which, so a picture is the only way to tell them apart.
    // E1 FRONT and E3 BACK already do the job a picture would.
    //
    // The cost only makes the correct answer also the cheap one, and it
    // is worth recording because it was measured the wrong way first.
    // Per seat, 232x152, repro-garage-house:
    //
    //     E1 46.8 ms   E2 43.2 ms   E3 47.6 ms   E4 43.7 ms   S1 0.32 ms
    //
    // About 100x, holding across three houses and IDENTICAL at 232x152
    // and 900x600 -- so it is the painter's hidden-line geometry, not
    // fill. Four live elevations is ~180 ms of blocking JS on every edit;
    // in the browser, before this, the rail cost 148 ms per wall drawn.
    //
    // THE SHAPE IS KEPT ON PURPOSE. Seat, canvas and epoch are unchanged
    // and an elevation draws its name where its picture would go, so a
    // faster elevation painter becomes a thumbnail here without moving a
    // seat -- Devin's "labels behind the same seat", taken literally.
    // COARSE, because the seat is 82 px wide. The roof silhouette's full
    // 240-sample resolution is eleven samples per pixel here and costs
    // ~28 ms an elevation; at 40 it is one sample per two pixels and costs
    // ~7 ms. Four elevations: 112 ms against 30 ms, for a picture that
    // cannot differ at this size.
    window.DraftCutView.drawCutView(env, c, screen.width, screen.height, spec.cut,
      { coarseSilhouette: true });
  };

  // ── selection ─────────────────────────────────────────────────────────────
  // TIER 3a. The first editing tool: click a wall, it lights up.
  //
  // THE OLD PAGE IS THE SPEC, and it does NOT paint this through the painter.
  // drawWallSeg2D has no `selected` key -- drawRoof2D, drawFixture2D and
  // drawFloor2D do, and MODEL.dc.html uses both mechanisms deliberately, split
  // by what is being selected: AREAS go through their painter with
  // { selected: true } (:7393), SEGMENTS get a separate overlay pass (:7380).
  // A wall is a segment, so it gets the overlay, and render-2d.js needs no
  // change at all.
  //
  // The colours are MODEL.dc.html's literals. #5980a6 is the drafting blue --
  // 81 uses across the repo -- and the palette has no `selected` role to ask
  // for, only 'draw-floor-edge' which happens to hold the same hex under a
  // name that means something else. Naming a role is tier 2j's boarded colour
  // problem; borrowing the wrong name here would be worse than a literal that
  // says where it came from.
  const SELECT_INK = 'rgba(89,128,166,0.55)';   // MODEL.dc.html:7385
  const SELECT_HANDLE = '#5980a6';              // MODEL.dc.html:7388
  const SELECT_GRAB_PX = 12;                    // MODEL.dc.html:16707, _findLineHit
  // ── the selection ─────────────────────────────────────────────────────────
  // A SET, NOT A WALL. This was `let selectedSeg = null` -- correct while a
  // wall was the only selectable thing on the page, and the wrong shape for
  // ITEMS/WINDOW/ALL LEVELS, which select many things of several types at
  // once. Same correction as the tool register a few hundred lines down: the
  // single-value variable becomes the general one, and the old narrow reading
  // becomes a VIEW of it rather than a second copy kept in step by hand.
  //
  // ENTRIES ARE { type, item }, because a bare item cannot answer "is this a
  // wall or a line" -- both are `{ start, end }` and the OBJECT TYPE filter
  // has to tell them apart. `type` is the filter vocabulary
  // (MODEL.dc.html:2793): 'line' | 'wall' | 'outline' | 'floor'.
  //
  // selectedWall() IS THE OLD MEANING, exactly: the one wall the corner drag,
  // the body drag, the delete button and the highlight act on. It is null the
  // moment the selection holds anything other than a single wall, which is
  // what those four should do when a drafter has ten things selected -- a
  // corner handle on one of ten walls would be a handle on an ambiguity.
  let selection = [];

  // THE TWO PANEL STATES, with the old page's own vocabularies and defaults
  // (:2792-2793). `window-all` is a THIRD MODE, not a modifier on `window`:
  // WINDOW drags a blue box over the current level, ALL LEVELS drags a red one
  // over every level, and they are mutually exclusive.
  let selectionMode = 'click';        // 'click' | 'window' | 'window-all'
  let selectFilter = 'all';           // 'all' | 'line' | 'wall' | 'outline' | 'floor'

  const selectedWall = () => (selection.length === 1 && selection[0].type === 'wall'
    ? selection[0].item : null);

  // ONE PLACE THE SELECTION CHANGES, so anything that watches it cannot fall
  // out of step. The assembly panel's button states and help line are a
  // function of the selection, and a panel updated at each call site instead
  // would be a second copy of "what is selected" -- the failure this file has
  // now corrected twice.
  const selectionWatchers = [];
  const setSelection = next => {
    selection = next;
    selectionWatchers.forEach(fn => fn());
  };

  // Nearest wall to a world point, or null. The threshold is converted from
  // pixels at the CURRENT zoom, so the grab zone stays the same size on screen
  // however far in the drafter is -- and it is passed in rather than baked
  // into geometry-2d.js, because the old page uses eight different distances
  // (30, 24, 18, 14, 12, 4 px) for different targets and a number frozen in
  // the shared function would be wrong for seven of them.
  const wallAt = worldPt => {
    const G = window.DraftGeometry2D;
    const thresh = SELECT_GRAB_PX / view.scale;
    let best = null, bestD = thresh;
    walls().forEach(wall => {
      if (!wall.start || !wall.end) return;
      const { d } = G.pointToSegment(worldPt, wall);
      if (d < bestD) { bestD = d; best = wall; }
    });
    return best;
  };

  // ── what a click can hit ──────────────────────────────────────────────────
  // THE OLD PAGE'S PRECEDENCE, in its order (_handleSelectClick :18185). It is
  // not arbitrary: a vertex beats the segments through it, a segment beats the
  // outline edge behind it, and a floor is last because it is the biggest
  // target on screen and would otherwise swallow everything drawn on top of it.
  //
  // WHAT IS MISSING HERE AND WHY IT IS NOT A BUG. The old page's chain also
  // tests fenestrations, fixtures, surface openings, dimensions and roofs. None
  // of those five is in the OBJECT TYPE vocabulary ('all' | 'line' | 'wall' |
  // 'outline' | 'floor', :2793), so they are reachable only under ALL, and none
  // of them has a tool on this page yet. Selecting is not saving -- the file
  // keeps every one of them untouched -- so this page selects less than the old
  // one for now, and says so rather than pretending the chain is complete.
  //
  // THE TOOLTIP AND THE HANDLER DISAGREE IN THE OLD PAGE, and the handler wins
  // here. `title: 'Only outline nodes respond to Select'` says nodes;
  // _findOutlineEdgeHit and the corner branch above it both select the WHOLE
  // outline, from an edge or from a corner. Copying the tooltip would have
  // produced a filter that behaves differently from the one it was ported from.
  const segAt = (list, worldPt) => {
    const G = window.DraftGeometry2D;
    const thresh = SELECT_GRAB_PX / view.scale;
    let best = null, bestD = thresh;
    list.forEach(item => {
      if (!item.start || !item.end) return;
      const { d } = G.pointToSegment(worldPt, item);
      if (d < bestD) { bestD = d; best = item; }
    });
    return best;
  };

  const lineAt = worldPt => segAt(lines(), worldPt);

  // A ray cast, which is the standard test and the only one that answers
  // correctly for the concave footprints this program draws all day -- an L or
  // a courtyard has points outside its own bounding box's interior.
  const pointInRing = (ring, pt) => {
    let inside = false;
    for (let i = 0, j = ring.length - 1; i < ring.length; j = i, i += 1) {
      const a = ring[i], b = ring[j];
      if (!a || !b) continue;
      if ((a.z > pt.z) !== (b.z > pt.z)
        && pt.x < ((b.x - a.x) * (pt.z - a.z)) / (b.z - a.z) + a.x) inside = !inside;
    }
    return inside;
  };

  const floorAt = worldPt => floors()
    .find(floor => pointInRing(floor.points || [], worldPt)) || null;

  // An outline is selected WHOLE, from any of its edges or any of its corners.
  const outlineAt = worldPt => {
    const G = window.DraftGeometry2D;
    const thresh = SELECT_GRAB_PX / view.scale;
    return outlines().find(outline => {
      const pts = outline.points || [];
      return pts.some((a, i) => {
        const b = pts[(i + 1) % pts.length];
        if (!a || !b || pts.length < 2) return false;
        return G.pointToSegment(worldPt, { start: a, end: b }).d < thresh;
      });
    }) || null;
  };

  // 'all' passes everything; any other filter passes only its own type. The old
  // page's whole rule, in one line (_selectFilterAllows :18180).
  const filterAllows = type => selectFilter === 'all' || selectFilter === type;

  // ── the window drag ───────────────────────────────────────────────────────
  // FULLY ENCLOSED, NOT CROSSED. The old page's own rule
  // (_handleWindowSelection :18282): every point of an item must be inside the
  // box. A crossing window -- catching anything the box touches -- is a
  // different tool with different node rules, and its own comment there says
  // so: "A future Stretch command can use a crossing window".
  //
  // OUTLINES ARE NOT IN A WINDOW, and that is the old page's behaviour rather
  // than an omission here. Its window reaches lines, walls, floors and
  // dimensions; outlines are click-only. So OUTLINE engaged plus a window drag
  // selects nothing, which is correct and would look exactly like a bug if it
  // were not written down.
  let bandDrag = null;

  const enclosedBy = (a, b) => {
    const minX = Math.min(a.x, b.x), maxX = Math.max(a.x, b.x);
    const minZ = Math.min(a.z, b.z), maxZ = Math.max(a.z, b.z);
    const inside = pt => pt && pt.x >= minX && pt.x <= maxX
      && pt.z >= minZ && pt.z <= maxZ;
    // ALL LEVELS reads the whole collection; WINDOW reads what is on screen.
    const all = selectionMode === 'window-all';
    const scope = (key, onScreen) => (all ? (drawing?.[key] || []) : onScreen());
    const out = [];
    if (filterAllows('wall')) {
      scope('walls', walls).forEach(item => {
        if (inside(item.start) && inside(item.end)) out.push({ type: 'wall', item });
      });
    }
    if (filterAllows('line')) {
      scope('lines', lines).forEach(item => {
        if (inside(item.start) && inside(item.end)) out.push({ type: 'line', item });
      });
    }
    if (filterAllows('floor')) {
      scope('floors', floors).forEach(item => {
        const pts = (item.points || []).filter(Boolean);
        if (pts.length >= 3 && pts.every(inside)) out.push({ type: 'floor', item });
      });
    }
    return out;
  };

  // Blue for the current level, red for every level -- the two colours the
  // mode help promises in words, so the box a drafter sees matches the
  // sentence they just read.
  const BAND_INK = { window: SELECT_HANDLE, 'window-all': '#b04050' };

  const paintBand = () => {
    if (!bandDrag || !bandDrag.active) return;
    const a = toS(bandDrag.from), b = toS(bandDrag.to);
    ctx.save();
    ctx.strokeStyle = BAND_INK[selectionMode] || SELECT_HANDLE;
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 3]);
    ctx.strokeRect(Math.min(a.x, b.x), Math.min(a.y, b.y),
      Math.abs(b.x - a.x), Math.abs(b.y - a.y));
    ctx.restore();
  };

  // ── assemblies ────────────────────────────────────────────────────────────
  // A GROUP NAMES ITS MEMBERS BY TYPE AND ID, never by object reference
  // (_createGroup :17940). That is what lets it survive a save and a reload,
  // where every object in the drawing is a new one: the ids come back, the
  // references do not.
  //
  // A GROUP IS "SELECTED" IF ANY ONE MEMBER IS -- the old page's own test
  // (_selectedGroups :…, `items.some(isSelected)`), not "all members". So
  // clicking one wall of an assembly and pressing UNGROUP releases the whole
  // thing, which is what a drafter means by it.
  const groups = () => (drawing?.groups || []);

  const memberKey = entry => `${entry.type}:${entry.item?.id}`;

  const itemsOfGroup = group => {
    const want = new Set((group.members || []).map(m => `${m.type}:${m.id}`));
    const out = [];
    const sweep = (type, list) => list.forEach(item => {
      if (want.has(`${type}:${item.id}`)) out.push({ type, item });
    });
    sweep('wall', walls());
    sweep('line', lines());
    sweep('floor', floors());
    return out;
  };

  const groupOf = entry => groups().find(group => (group.members || [])
    .some(m => m.type === entry.type && String(m.id) === String(entry.item?.id))) || null;

  const selectedGroups = () => groups().filter(group => (group.members || [])
    .some(m => selection.some(entry =>
      entry.type === m.type && String(entry.item?.id) === String(m.id))));

  // CLICKING A MEMBER TAKES THAT MEMBER, NOT THE WHOLE ASSEMBLY -- and this is
  // a deliberate divergence from the old page, left open rather than decided
  // here.
  //
  // The old page pulls a hit item's group in with it
  // (_addItemsAndTheirGroups), and that shipped here first. It broke ten
  // checks in tests/model-html-draw-delete.spec.js, whose fixture groups w-a
  // with w-b: a tap meant to select ONE wall selected two, the DELETE button
  // (which means "exactly one wall") went dark, and "delete this wall" had
  // quietly become "delete this assembly". That last one is a product
  // decision -- a drafter who groups two walls and presses Delete on one may
  // or may not mean both -- and it is not mine to make inside a PR whose
  // order says only that ASSEMBLY groups and UNGROUP releases.
  //
  // NOTHING IN THE ACCEPTANCE NEEDS THE EXPANSION. selectedGroups() counts a
  // group as selected when ANY member is, which is the old page's own test, so
  // UNGROUP still releases an assembly from a click on one of its walls. The
  // expansion was parity I reached for, not a requirement, and the established
  // behaviour wins while the question is open.
  const withGroup = entry => (entry ? [entry] : []);

  // Returns { type, item } or null, in the old page's precedence.
  const hitAt = worldPt => {
    if (filterAllows('wall')) {
      const wall = segAt(walls(), worldPt);
      if (wall) return { type: 'wall', item: wall };
    }
    if (filterAllows('line')) {
      const line = lineAt(worldPt);
      if (line) return { type: 'line', item: line };
    }
    if (filterAllows('outline')) {
      const outline = outlineAt(worldPt);
      if (outline) return { type: 'outline', item: outline };
    }
    if (filterAllows('floor')) {
      const floor = floorAt(worldPt);
      if (floor) return { type: 'floor', item: floor };
    }
    return null;
  };

  // EVERY SELECTED ITEM, not just the one wall. The highlight is what tells a
  // drafter what a Delete or an ASSEMBLY is about to act on, so a selection of
  // ten that paints one is worse than useless -- it names the wrong thing with
  // total confidence.
  //
  // HANDLES ONLY ON A LONE WALL. They are the grab targets for the corner drag,
  // and cornerAt() only offers them when exactly one wall is selected
  // (selectedWall()). Drawing them on ten walls would advertise ten grabs that
  // do nothing, which is the same lie one step down.
  const paintSelection = () => {
    if (!selection.length) return;
    const onScreen = { wall: walls(), line: lines(), floor: floors(), outline: outlines() };
    const lone = selectedWall();
    ctx.save();
    ctx.strokeStyle = SELECT_INK;
    ctx.lineWidth = 7;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    selection.forEach(({ type, item }) => {
      // Only if it is still on screen's level: a selection kept across a level
      // change would paint a highlight over nothing.
      if (!(onScreen[type] || []).includes(item)) return;
      if (type === 'wall' || type === 'line') {
        const a = toS(item.start), b = toS(item.end);
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
        if (item === lone) {
          // Square handles at each end -- the same 8px squares the old page
          // draws, and the grab targets the corner drag uses.
          ctx.fillStyle = SELECT_HANDLE;
          [a, b].forEach(pt => ctx.fillRect(pt.x - 4, pt.y - 4, 8, 8));
        }
        return;
      }
      const pts = (item.points || []).filter(Boolean);
      if (pts.length < 2) return;
      ctx.beginPath();
      pts.forEach((pt, i) => {
        const p = toS(pt);
        if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
      });
      ctx.closePath();
      ctx.stroke();
    });
    ctx.restore();
  };

  // ── move a corner ─────────────────────────────────────────────────────────
  // THE DRAG MOVES THE POOLED VERTEX OBJECT, not a copy of its numbers. That
  // is the whole mechanism: load rebuilt reference equality at shared corners
  // (the pool, above), so one wall's endpoint IS its neighbour's, and writing
  // x/z once carries every wall in every view that meets there. Nothing
  // iterates "the other walls", because there is no such list to get wrong.
  //
  // The three distances are the old page's, measured rather than chosen:
  //   grab  _findVertexHit, MODEL.dc.html:16589 — _magnetRadius() * 1.5,
  //         and _magnetRadius() is snapZone * 5 (MODEL.dc.html:16532)
  //   snap  _nodeSnapRadius, MODEL.dc.html:16536 — snapZone flat
  //   arm   the node drag turns live past 4px of travel, MODEL.dc.html:10825
  // snapZone is a setting this page has no UI for, so it reads the shipped
  // default instead of inventing a number: 30px to grab, 4px to snap.
  const SNAP_ZONE_PX = window.DraftSnapZone.DEFAULT_SNAP_ZONE;
  const CORNER_GRAB_PX = SNAP_ZONE_PX * 5 * 1.5;
  const CORNER_SNAP_PX = SNAP_ZONE_PX;
  const DRAG_ARM_PX = 4;

  // A BUILD HOUSE wall corner rides a BONEYARD master point: srcId names the
  // master, offX/offZ hold the corner's offset from it. THE OLD PAGE KEEPS THE
  // LINK THROUGH A DRAG and re-measures the offset — _relinkVertex,
  // MODEL.dc.html:11641, called on every moved ref at MODEL.dc.html:10855. It
  // never drops srcId. This page matches that, because a dropped link is a
  // wall that quietly stops following its bone and nothing says so.
  //
  // The masters are reachable here: `drawing` is the parsed save spread whole,
  // so drawing.boneyardOutlines arrives untouched. It arrives RAW, which is
  // the trap — storage names a master point's id `id` (drawing-format.js:698)
  // and only MODEL.dc.html's loader renames it `pointId` in memory
  // (MODEL.dc.html:5828). Reading `pointId` here would resolve nothing,
  // silently, on every corner in the drawing.
  const masterPointById = srcId => {
    for (const master of (drawing?.boneyardOutlines || [])) {
      const src = (master?.points || []).find(p => p && String(p.id) === String(srcId));
      if (src) return src;
    }
    return null;
  };

  const relinkVertex = vtx => {
    if (!vtx?.srcId) return;
    const src = masterPointById(vtx.srcId);
    if (src) { vtx.offX = vtx.x - src.x; vtx.offZ = vtx.z - src.z; }
  };

  // Only the SELECTED wall's own two corners are grabbable. Selection first,
  // then drag: without that rule every pan begun near any corner anywhere in
  // the drawing would move it instead of sliding the sheet.
  const cornerAt = worldPt => {
    const selectedSeg = selectedWall();
    if (!selectedSeg || !walls().includes(selectedSeg)) return null;
    const G = window.DraftGeometry2D;
    const ends = [selectedSeg.start, selectedSeg.end].filter(Boolean);
    return G.nearestVertex(ends, worldPt, CORNER_GRAB_PX / view.scale);
  };

  // Corners on screen that a moving vertex may snap to. Excluded by reference
  // AND by coincident position, matching _withoutVertices (MODEL.dc.html:16543):
  // the pool keys corners by (level, view, body), so a garage corner and a
  // house corner can share a spot as two separate objects, and offering one as
  // a snap target for the other would be a snap that moved nothing.
  const snapCandidates = moving => {
    const out = [];
    walls().forEach(wall => {
      [wall.start, wall.end].forEach(v => {
        if (!v || moving.includes(v)) return;
        if (moving.some(m => Math.abs(v.x - m.x) < 0.001 && Math.abs(v.z - m.z) < 0.001)) return;
        out.push(v);
      });
    });
    return out;
  };

  const cornerSnap = (worldPt, moving) =>
    window.DraftGeometry2D.nearestVertex(
      snapCandidates([moving]), worldPt, CORNER_SNAP_PX / view.scale);

  // ── move a whole wall ─────────────────────────────────────────────────────
  // BOTH ENDS BY THE SAME DELTA. Their corners are pooled, so the neighbouring
  // walls that meet them travel too and the outline deforms around the moved
  // wall — the ruling, and the conservative one: a wall that detached from its
  // corners instead would be silently unhooked from the pool, the same failure
  // shape as a dropped srcId and just as invisible until much later. A true
  // detach, if it is ever wanted, is a deliberate gesture with its own name.
  //
  // THE OLD PAGE HAS NO SUCH GESTURE — its SELECT drag grabs a vertex
  // (_findVertexHit, MODEL.dc.html:10512) and a press on a wall body away from
  // a corner moves nothing. So this is the first behaviour on this page with
  // nothing to copy, and the one thing that IS copied is the precedence: the
  // old page tests for a vertex before it tests for a line
  // (MODEL.dc.html:16791 then :16799), and so does pointerdown below.
  //
  // A CONSEQUENCE OF THAT ORDER, stated rather than discovered later: the
  // corner zone is 30px and the body zone is 12, so on a wall shorter than
  // about 60px on screen the two corner zones meet and there is no body left
  // to grab. Zoom in and it appears. That is the old page's own precedence
  // producing it, not a rule added here.
  const wallBodyAt = worldPt => {
    const selectedSeg = selectedWall();
    if (!selectedSeg || !walls().includes(selectedSeg)) return null;
    if (!selectedSeg.start || !selectedSeg.end) return null;
    const { d } = window.DraftGeometry2D.pointToSegment(worldPt, selectedSeg);
    return d < SELECT_GRAB_PX / view.scale ? selectedSeg : null;
  };

  // The two vertex objects a wall drag moves. NOT deduped, and it took a
  // mutation to settle that. A wall whose ends were one pooled corner would
  // travel twice the cursor's distance, so a dedupe looks obviously necessary
  // — but nothing can reach it: segmentCore drops any wall shorter than 1e-6
  // before it arrives (drawing-format.js), the pool merges corners closer than
  // 0.001, and everything in between is sub-pixel, with its two corners on top
  // of each other. Every press on such a wall is inside the 30px corner zone,
  // so the body grab below never runs on one. The dedupe that was here could
  // not be made to fail, which is the same thing as not being a guard.
  const movingEnds = wall => [wall.start, wall.end];

  // A wall drag snaps by its ENDS, not its body: offer each moving end the
  // corner nearest to where the raw delta would put it, take the closer of the
  // two, and shift the whole delta so that end lands exactly. The wall still
  // moves rigidly — the correction applies to both ends — which is the corner
  // drag's snap generalised rather than a second rule.
  const wallSnapDelta = (before, dx, dz) => {
    const G = window.DraftGeometry2D;
    const moving = before.map(b => b.vtx);
    const candidates = snapCandidates(moving);
    const r = CORNER_SNAP_PX / view.scale;
    let best = null, bestD = Infinity;
    before.forEach(b => {
      const at = { x: b.x + dx, z: b.z + dz };
      const hit = G.nearestVertex(candidates, at, r);
      if (!hit) return;
      const d = Math.hypot(hit.x - at.x, hit.z - at.z);
      if (d < bestD) { bestD = d; best = { dx: hit.x - b.x, dz: hit.z - b.z }; }
    });
    return best;
  };

  // ONE ENTRY PER GESTURE, and an entry KNOWS WHAT IT UNDOES.
  //
  // TIER 3c GENERALISED THIS, and it had to. Until 3c an entry was a bare list
  // of vertices with the numbers they started with, and undo wrote those
  // numbers back — which can only restore the POSITION of an object that still
  // exists. A created wall has no position to go back to and a deleted one has
  // no vertex left to write on, so create and delete were unrepresentable, not
  // merely unimplemented.
  //
  // Three kinds now, and the old one is unchanged in behaviour:
  //   { kind: 'move',   before }              the corner / wall drag, as before
  //   { kind: 'add',    wall }                undo removes it again
  //   { kind: 'remove', wall, index, deps }   undo puts it and its dependents back
  //
  // The pool is still what keeps 'move' small — restoring those objects'
  // numbers puts back every wall that travelled with them. 'add' and 'remove'
  // carry the wall RECORD, whose endpoints are the pooled objects themselves,
  // so a re-added wall rejoins its corners by identity rather than by
  // coordinate — which is the same reason the loader pools at all.
  const undoStack = [];

  // ── TIER 3c: drawing a wall, and deleting one ─────────────────────────────
  // THE FIRST RUNG THAT CREATES AND DESTROYS. Everything before it moved
  // geometry that already existed; the whole write surface was a move-drag
  // commit and an undo. So the rule here is not "make it work" but "make it
  // indistinguishable from the old page's own writer", because the file has to
  // keep opening there.
  //
  // MODEL.dc.html:14609 `_commitWall` is the single authority — the two chain
  // committers (:11297, :21833) both funnel through it — and every field below
  // is derived the way that function derives it. DERIVER on the left of the
  // arrow, STORER on the right:
  //
  //   id          _newDrawingItemId('wall')  ->  `wall-${n}`, counter persisted
  //                                              as nextDrawingItemId (:3559)
  //   start/end   _mergeVertex(pt, levelId, homeView)  ->  the POOLED object
  //   levelId     the active level's ID, never its index
  //   view        _wallHomeView  ->  'foundation' on that set, else 'plan'
  //   wallType    _contextWallType()  ->  validated against WALL_TYPES
  //   baseHeight  state.wallBaseHeight  ->  number, 0
  //   topHeight   state.wallTopHeight   ->  number, 8
  //   refLine     state.wallRefLine     ->  'centre' folds to 'center'; 'left'
  //   body/auto   NOT SET by _commitWall — conditional keys, never invented
  //
  // `auto: true` in particular would tell the old page's delete path this is
  // generated geometry (:22218). A hand-drawn wall must not carry it.

  // THE THREE WALL SETTINGS ARE PERSISTED, so they are read off the drawing
  // rather than hardcoded here: MODEL.dc.html:3517-3519 writes wallRefLine,
  // wallBaseHeight and wallTopHeight into every save. Reading them back is how
  // a wall drawn on this page inherits the same settings the drafter last used
  // on the old one, instead of this page having a private opinion. The
  // fallbacks are the old page's own initial values (:2911-2913).
  const wallSetting = (key, fallback) =>
    (drawing && drawing[key] !== undefined && drawing[key] !== null) ? drawing[key] : fallback;

  // MODEL.dc.html:9010 `_contextWallTypes` and :9016 `_contextWallType`,
  // ported rather than re-decided. THE TWO LISTS ARE DISJOINT — foundation
  // assemblies on one side, stud/insul on the other — so picking the wrong
  // default is not a near miss, it is a wall of the wrong kind, silently.
  // (No BONEYARD on this page, so that arm of the original is not ported; a
  // level with no layer views returns every type, as viewId == null does there.)
  const contextWallTypes = viewId => {
    const WT = window.DraftWallTypes;
    if (viewId == null) return WT.WALL_TYPES;
    const isFdn = id => WT.FOUNDATION_WALL_TYPE_IDS.includes(id);
    return viewId === 'foundation'
      ? WT.WALL_TYPES.filter(t => isFdn(t.id))
      : WT.WALL_TYPES.filter(t => !isFdn(t.id));
  };
  const contextWallType = viewId => {
    const choices = contextWallTypes(viewId);
    const active = wallSetting('activeWallType', null);
    if (choices.some(t => t.id === active)) return active;
    const want = viewId === 'foundation' ? 'concrete_8' : 'stud_2x6';
    return (choices.find(t => t.id === want) || choices[0]).id;
  };

  // MODEL.dc.html:14614 `_wallHomeView`. A wall drawn on any set other than
  // FOUNDATION lives in PLAN — pooling it under the ACTIVE view instead would
  // let a foundation wall and a plan wall at the same coordinates share a
  // corner they do not share on the old page.
  const wallHomeView = viewId => (viewId === 'foundation' ? 'foundation' : 'plan');

  // MODEL.dc.html:3224 `_newDrawingItemId`, and :5982 is why the counter must
  // be BUMPED rather than left to heal itself. The old page's load takes
  // Math.max(saved, highestSuffix + 1, 1) — a maximum, never a lowering. Draw
  // wall-7, delete it, save without bumping: nothing survives carrying 7, the
  // max does not rise, and the NEXT wall drawn anywhere is wall-7 again. The
  // cascade below stops a door reattaching that way, but groups and level
  // locks reference members by id too and this page passes both through
  // untouched — so a stale group would adopt a brand-new wall nobody put in it.
  const newDrawingItemId = kind => {
    const next = Number.isInteger(drawing.nextDrawingItemId) ? drawing.nextDrawingItemId : 1;
    drawing.nextDrawingItemId = next + 1;
    return `${kind}-${next}`;
  };

  // The pool key is THREE VALUES plus coordinates — (levelId, viewId, body) —
  // and mergeVertex is the same shared function the loader pools with, so a
  // new endpoint landing on an existing corner returns THAT OBJECT. Anything
  // else and mitring silently reverts to butt joints: no error, capped ends.
  const poolVertex = (pt, levelId, viewId) =>
    window.DraftGeometry2D.mergeVertex(vertexPool, pt, levelId, viewId, 'house');

  // A corner is retired only when NOTHING still holds it. Identity, not
  // coordinates: two corners at the same place are still two corners if the
  // pool never merged them.
  // Returns WHAT IT RETIRED, because undo has to put exactly those back — see
  // the 'remove' branch. A retire that reports nothing forces undo to guess.
  const retirePoolCorners = corners => {
    const retired = [];
    corners.forEach(corner => {
      const held = drawing.walls.some(w => w.start === corner || w.end === corner);
      if (held) return;
      const at = vertexPool.indexOf(corner);
      if (at >= 0) { vertexPool.splice(at, 1); retired.push(corner); }
    });
    return retired;
  };

  const commitWall = (startPt, endPt) => {
    const { levelId, viewId } = onActiveLevel();
    const homeView = wallHomeView(viewId);
    const wall = {
      id: newDrawingItemId('wall'),
      start: poolVertex(startPt, levelId, homeView),
      end: poolVertex(endPt, levelId, homeView),
      levelId,
      view: homeView,
      wallType: contextWallType(viewId),
      baseHeight: wallSetting('wallBaseHeight', 0),
      topHeight: wallSetting('wallTopHeight', 8),
      // 'center', not 'centre'. drawing-format.js:400 folds the British
      // spelling on LOAD, but this page has no serializer — a record written
      // with 'centre' reaches the file unvalidated and only the next load
      // repairs it, moving the wall half an assembly thickness in between.
      refLine: (raw => (raw === 'centre' ? 'center' : raw))(wallSetting('wallRefLine', 'left')),
    };
    drawing.walls.push(wall);
    undoStack.push({ kind: 'add', wall });
    markDirty();
    return wall;
  };

  // ── STRUCTURE: PLACING A COLUMN AND A BEAM ───────────────────────────────
  //
  // AN INTEGER ID, AND NOT newDrawingItemId. This is the whole trap in #392's
  // other half. That helper returns the STRING `column-7`, which is what
  // commitWall uses and what the wall reader accepts -- but drawing-format.js
  // reads a column's id at :512 and a beam's at :549 with `Number(id)` and
  // drops the record when it is not an integer. Measured before any of this
  // was written:
  //
  //   F.columns([{ id: 'column-7', point, levelId: 3, view: 'plan' }])  ->  []
  //   F.columns([{ id: 7,          point, levelId: 3, view: 'plan' }])  ->  [ ... ]
  //
  // So the obvious implementation puts a column on the canvas, saves a file
  // that reads correctly, and loses it on the next load with no error at
  // either end. Highest-plus-one rather than a counter, because the format
  // dedupes on id: a repeat drops every record after the first, equally
  // silently.
  const newStructureId = list => {
    let max = 0;
    for (const item of (list || [])) {
      const n = Number(item?.id);
      if (Number.isInteger(n) && n > max) max = n;
    }
    return max + 1;
  };

  // A SECOND UNDO KIND RATHER THAN A WIDER FIRST ONE. The existing 'add' step
  // is wall-shaped -- `drawing.walls.indexOf(step.wall)` -- so pushing a column
  // through it would pop a step, find nothing, and silently spend the
  // drafter's undo. Widening that branch would touch wall undo, which is
  // merged and covered; this leaves it alone.
  const addItem = (list, item) => {
    list.push(item);
    undoStack.push({ kind: 'add-item', list, item });
    markDirty();
    paint();
    return item;
  };

  const placeColumn = at => {
    const { levelId, viewId } = onActiveLevel();
    drawing.columns = drawing.columns || [];
    return selectPlaced('column', addItem(drawing.columns, {
      id: newStructureId(drawing.columns),
      point: { x: at.x, y: 0, z: at.z },
      levelId,
      // A column answers to the same home-view rule a wall does: everything on
      // this page reads 'plan' except floors. Placed on the FOUNDATION plan it
      // belongs to the foundation, not to a default.
      view: wallHomeView(viewId),
      // The format's own default, named here rather than left out, so the
      // record this page writes and the record the reader rebuilds are the
      // same object rather than one filled in behind the page's back.
      footing: 'pad36',
    }));
  };

  // WHAT WAS JUST PLACED IS WHAT IS SELECTED, exactly as commitWall does for a
  // wall. It is also what gives the properties panel something to show: this
  // page cannot hit-test a column, so the placement is the only moment the
  // selection can arrive.
  const selectPlaced = (type, item) => {
    setSelection([{ type, item }]);
    return item;
  };

  let beamStart = null;
  const beamPress = at => {
    if (!beamStart) { beamStart = { x: at.x, y: 0, z: at.z }; paint(); return null; }
    const end = { x: at.x, y: 0, z: at.z };
    // A BEAM OF NO LENGTH IS NOT A BEAM, and the reader agrees: the format
    // drops anything under 0.001 (drawing-format.js:553). Writing one would
    // put a record in the file that vanishes on load -- the same silent loss
    // as a string id, by a different route. Treat the second press as a
    // correction, exactly as drawPress does for a wall.
    if (Math.hypot(end.x - beamStart.x, end.z - beamStart.z) < 0.001) {
      beamStart = end; paint(); return null;
    }
    const { levelId, viewId } = onActiveLevel();
    drawing.beams = drawing.beams || [];
    const beam = addItem(drawing.beams, {
      id: newStructureId(drawing.beams),
      start: beamStart,
      end,
      levelId,
      view: wallHomeView(viewId),
      // Named for the same reason footing is: the record this page writes and
      // the record the reader rebuilds should be the same object, not one
      // filled in behind the page's back.
      mode: 'flush',
    });
    // No chaining: a beam is one span between two supports, not a run. The
    // next beam starts where the drafter next presses.
    beamStart = null;
    return selectPlaced('beam', beam);
  };

  // DELETE CASCADES, IT DOES NOT REFUSE — MODEL.dc.html:22225-22251 does, and
  // the round-trip proof is about the two pages agreeing on what delete MEANS.
  // A refusal here would also need a message surface this page does not have
  // for a drafter with no keyboard.
  //
  // Three referent classes, all riding through on the ...parsed spread and
  // none of them validated on load — format.fenestrations and format.fixtures
  // check levelId, type, width and offset and NEVER that the host wall exists
  // (drawing-format.js:184-200, :229-245). So an orphan is invisible and
  // persistent: it survives every save, paints nowhere, and returns the moment
  // something is given its host's id.
  const deleteWall = wall => {
    const index = drawing.walls.indexOf(wall);
    if (index < 0) return null;
    drawing.walls.splice(index, 1);
    const gone = wall.id;
    const deps = [];
    const cut = (list, doomed) => {
      if (!Array.isArray(list)) return;
      for (let i = list.length - 1; i >= 0; i--) {
        if (!doomed(list[i])) continue;
        deps.push({ list, index: i, item: list[i] });
        list.splice(i, 1);
      }
    };
    // A door or window whose host is gone.
    cut(drawing.fenestrations, f => f && f.wallId === gone);
    // A fixture by either anchor: the tub needs its faucet-END wall too.
    cut(drawing.fixtures, f => f && (f.wallId === gone || f.endWallId === gone));
    // AND GROUPS, which neither the order nor the review named. The old page
    // runs _cleanupGroups() beside the cascade; groups reference members by
    // {type, id}, so a group left holding a dead wall id adopts the next wall
    // to be given it. Members go; a group emptied to fewer than two members
    // is not a group, so it goes too.
    if (Array.isArray(drawing.groups)) {
      drawing.groups.forEach(group => {
        cut(group && group.members, m => m && m.type === 'wall' && String(m.id) === gone);
      });
      cut(drawing.groups, g => g && Array.isArray(g.members) && g.members.length < 2);
    }
    // deps were collected newest-first per list; undo re-inserts in reverse so
    // each splice lands at the index it was taken from.
    deps.reverse();
    const retired = retirePoolCorners([wall.start, wall.end]);
    setSelection(selection.filter(entry => entry.item !== wall));
    undoStack.push({ kind: 'remove', wall, index, deps, retired });
    markDirty();
    return wall;
  };

  // ── the draw gesture ──────────────────────────────────────────────────────
  // TWO PRESSES, one wall. The first sets a start and the second commits, so
  // the gesture works with a finger, a pen or a mouse without a drag — the old
  // page's wall tool is press-press too (its chain committer is the same shape
  // repeated).
  //
  // ARMED IS A MODE, and it is visible: the button carries the accent while
  // the next tap will draw. A mode nobody can see is how a drafter loses a
  // pan and gets a wall.
  const drawButton = document.getElementById('draw-wall');
  const deleteButton = document.getElementById('delete-wall');
  // ── the tool register ─────────────────────────────────────────────────────
  // ONE VARIABLE HOLDS WHICH TOOL IS ARMED, and it holds a tool id, never a
  // boolean. This was `let drawArmed = false` — correct while WALL was the only
  // tool on the page, and the wrong shape the moment a second one exists. A
  // seventeen-key column hung off its own state beside a live boolean gives the
  // page two ideas of what is armed; a drafter would then press SELECT, see the
  // column agree, and still commit a wall on the next tap, because the boolean
  // never heard about it. That is the same two-sources-of-truth failure this
  // page's own shell comment warns about for the active level, one panel over.
  //
  // SELECT IS THE RESTING TOOL, not "nothing armed". The old page has no
  // no-tool state (its Select is `standardTool('Select', …)`, one of the four),
  // and a column with no key lit looks exactly like a column that stopped
  // working. Pressing the armed key puts it back to select.
  //
  // WHAT THIS DOES NOT DO: it does not know how any tool behaves. Every gesture
  // still reads the register and decides for itself; the register only says
  // which one gets the press.
  const RESTING_TOOL = 'select';
  let activeTool = RESTING_TOOL;
  let drawStart = null;
  const toolListeners = [];

  const setTool = id => {
    const roster = window.DraftToolRoster;
    // An unknown id would silently arm nothing and read as "select is on",
    // which is a broken state that looks like a working one.
    const next = roster && roster.get(id) ? id : RESTING_TOOL;
    activeTool = next;
    // Any half-finished gesture belongs to the tool being put down. Carrying an
    // anchor across a tool change is how a chain commits into the next tool's
    // first tap -- and the beam's anchor is a second one of exactly the same
    // kind, so it goes the same way. Leaving it would let a beam started under
    // BEAM finish under COLUMN.
    drawStart = null;
    beamStart = null;
    // THE LEGACY BUTTON IS A VIEW OF THE REGISTER, not a second copy of it.
    // tests/model-html-seats.spec.js arms and disarms through this button on
    // every run, and it stays the affordance a drafter with no keyboard can
    // reach; it just no longer owns the state.
    drawButton.classList.toggle('armed', next === 'wall');
    canvas.style.cursor = next === RESTING_TOOL ? '' : 'crosshair';
    // The instrument strip is a third reader of the same fact, added by #398
    // against the boolean this replaced. It reads the register now like
    // everything else does.
    stripRefresh();
    toolListeners.forEach(fn => fn(next));
  };

  // A drawn endpoint snaps to an existing corner exactly as a dragged one
  // does, and for the same reason: landing ON a corner is what makes the join
  // mitre. Nothing is moving during a draw, so nothing is excluded.
  //
  // THE T-SQUARE GOES FIRST AND THE CORNER SNAP MAY STILL OVERRIDE IT, but
  // only along the axis it is already on (squareTo's second half). A snap
  // that pulled the run off square would make the instrument a suggestion,
  // and an instrument a drafter cannot trust is worse than no instrument --
  // this is the same wall the old page holds when its T-square is down.
  const drawPoint = at => {
    const wanted = squareTo(drawStart, at);
    return cornerSnap(wanted, []) || { x: wanted.x, y: 0, z: wanted.z };
  };

  const drawPress = at => {
    if (!drawStart) { drawStart = drawPoint(at); paint(); return; }
    const end = drawPoint(at);
    // A wall of no length is not a wall — the format drops anything under
    // 1e-6 on load, so committing one would write a record that vanishes on
    // the next open. Treat the second tap as a correction, not a commit.
    if (Math.hypot(end.x - drawStart.x, end.z - drawStart.z) < 0.001) { drawStart = end; paint(); return; }
    const wall = commitWall(drawStart, end);
    // CHAINING, the old page's habit: the next wall starts where this one
    // ended, so a room is four taps and not eight. The pooled END object is
    // the start, so the corner is shared by identity.
    drawStart = wall.end;
    setSelection([{ type: 'wall', item: wall }]);
    stripRefresh();
    paint();
  };

  // ── the instrument strip ──────────────────────────────────────────────────
  // MODEL.dc.html:1963's bottom panel, rebuilt on this page's terms. Movie,
  // 13 Sep: "we also still need the bottom bar which should look like lights
  // for [an] instrument panel like on the Model.dc.html version. the length
  // T-square, ruler and other stuff are down there we need. and the skin
  // switcher can be there too."
  //
  // FOUR INSTRUMENTS ARE REAL AND SIX ARE DORMANT, and the strip says which
  // is which rather than offering ten buttons where four work. The dormant
  // six hold their seats (see the stylesheet's note on spacing) with a title
  // that names them as unbuilt -- the same refusal as the panel's disabled 3D
  // chair, which is the house rule: a control that lies about what the page
  // can do is worse than a gap.
  const strip = document.getElementById('strip');
