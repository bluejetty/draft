<!DOCTYPE html>
<!--
  MODEL.html — the framework-free model space, tier 1.

  This is the migration target. It is NOT wired into the site: index.html still
  points at MODEL.dc.html, which serves every user until this page earns the
  swap. Both live at root together on purpose, so the old page keeps running
  untouched while this one is filled in.

  Tier 1 asks one question and answers only that: can a page with no framework
  read the drawing MODEL.dc.html saved, and paint it with the same painters?

  The Write Tier begins here: SAVE writes the drawing back to the shared
  store, revision-guarded, through the same drawing-format rules the old page
  saves through. This page still edits nothing — a save re-emits what it
  loaded — so the deep-compare proof (tests/write-tier.spec.js) is what says a
  save through this page equals a save through the old one.

  What it carries, and why the list is this short: render-2d.js reaches for
  zero globals — every outside thing it needs arrives in an `env` object — so
  the wall painter costs exactly one dependency, wall-types.js.

  Load order is not cosmetic. Eight modules in this repo capture a global at
  module scope (`const geo = window.DraftGeometry2D;`), which binds at load
  time, so a dependency arriving later never helps. None of the four below do
  that — checked, not assumed — but the moment tier 2 adds one, order becomes
  load-bearing. See MIGRATION-STATUS.md.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<title>Rough Drafter — Model Space</title>
<!-- Self-hosted (see vendor/fonts.css): no third-party request on the
     drafter's behalf, and the OFL text ships beside the files. -->
<link rel="stylesheet" href="vendor/fonts.css" />
<!-- THE SHELL'S OWN STYLESHEET, ahead of this page's own block so anything
     below may still override it. Shared with PROJECT, Construction Layout,
     SPECS and the two pages not built yet; see the file's head. -->
<link rel="stylesheet" href="./shell-bars.css" />
<!-- THE BARS THEMSELVES, loaded HERE rather than with the other modules at
     the foot, because the page MOUNTS them mid-body and a module that
     arrives after its own mount call is not a module, it is a crash. -->
<script src="./shell-bars.js"></script>
<style>
  :root {
    color-scheme: dark;

    /* TYPE, DECLARED ONCE ON PURPOSE.
       MODEL.dc.html carries 284 inline `font-family:` declarations and the
       site 391 across seven files, so changing the typeface there is 391
       edits and a find-and-replace through a 22,000-line file. Here it is
       three lines. When the faces are redesigned, this block is the change
       and every later tier inherits it.

       Barlow / Barlow Condensed / DM Mono are all SIL OFL and vendored in
       vendor/fonts/ with the licence beside them -- nothing is fetched
       from a CDN. Each stack keeps a real fallback so the page is legible
       before the woff2 lands, and if a face is ever swapped for one with
       different metrics the fallback is what a reader sees mid-swap. */
    --font-ui:   'Barlow Condensed', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono: 'DM Mono', ui-monospace, Menlo, Consolas, monospace;

    /* COLOUR IS NOT DECLARED HERE. palette.js writes every --role token onto
       this element at boot, because 92% of MODEL's colour is set from
       JavaScript (canvas fills, inline styles) and only a table both the
       stylesheet and the painters can read reaches all of it. The fallbacks
       below are the night skin, so the page is never unpainted between parse
       and boot -- and never a SECOND definition to keep in step, because
       palette.js overwrites all of them. See RD-DOCUMENTS/SPEC-skins.md. */
    --surface-page: #1d1f20;
    --surface-panel: rgba(20,22,23,0.50);
    --surface-chip: #2a2d2e;
    --edge-panel: #3a3d3f;
    --ink-primary: #e7e5e2;
    --ink-secondary: #b9bcbe;
    --ink-quiet: #8b8f92;
    --accent: #fd0000;
    --accent-mark: #f0b429;
  }
  html, body { margin:0; height:100%; overflow:hidden;
    /* Two properties rather than the `background:` shorthand: its layer list
       parses differently with and without an image, and a skin that later
       defines --surface-page-tex should not have to re-learn that. */
    background-color: var(--surface-page); background-image: var(--surface-page-tex, none);
    font: 13px/1.45 var(--font-body);
    color: var(--ink-primary); }
  #plan { display:block; width:100%; height:100%; cursor:grab; touch-action:none; }
  #plan.dragging { cursor:grabbing; }
  /* Over a grabbable corner. Declared AFTER .dragging so it wins while a
     corner is actually being dragged -- equal specificity, later rule. */
  #plan.over-corner, #plan.over-wall { cursor:move; }

  #hint { position:fixed; right:12px; bottom:var(--readout-bottom); z-index:5; color: var(--ink-quiet);
    font-family: var(--font-ui); font-size:12px; letter-spacing:0.04em;
    text-transform:uppercase; pointer-events:none; }
  :root {
    /* THE RAIL BAND, left behind when the bar metrics went to
       shell-bars.css: only the sidebars read these two, and the bars
       they measure from are now somebody else's to name. */
    --bottom-band: calc(var(--house-h) + 72px);
    --rail-top: calc(var(--strip-h) + 80px); }
  /* PRINTSCREEN borrows the settings corner's own button rules rather than
     inventing a third button shape on the same bar. */
  #printscreen {
    font-family: var(--font-ui); font-size:9px; font-weight:600;
    letter-spacing:0.05em; text-transform:uppercase;
    display:inline-flex; align-items:center; justify-content:center;
    min-width:64px; padding:4px 6px; margin-left:8px; flex:0 0 auto;
    cursor:pointer; border:1px solid var(--edge-panel); border-radius:3px;
    background-color: var(--surface-chip); background-image: var(--surface-chip-tex, none);
    color: var(--ink-primary); }
  #printscreen:hover { border-color: var(--accent); color: var(--accent); }

  /* THE PRESENTATION. Built on the press, printed, and thrown away -- it is
     never part of the page a drafter works on, which is why it is hidden
     outright on screen instead of being styled to sit somewhere.
     WHITE AND BLACK WHATEVER THE SKIN IS. A night-skin page printed in its
     own colours is a sheet of ink; the pictures inside carry the skin they
     were drawn in, and the paper around them does not. */
  #presentation { display:none; }
  /* LANDSCAPE (Movie, 15 Sep). A plan is wider than it is tall and so is the
     tile grid, so portrait paper spends half its height on nothing. The size
     is declared rather than asked for: the browser's own dialog opens on
     landscape, and a drafter who wants portrait can still say so there. */
  @page { size: landscape; }
  @media print {
    /* THE APP IS A FIXED PANE -- html and body are height:100% with overflow
       hidden so the drawing never scrolls. On paper that clips the set to
       the first sheet: pages two and three exist and simply never come out
       of the printer. Paper scrolls, so the pane rules are lifted here. */
    html, body { height:auto; overflow:visible; }
    body > *:not(#presentation) { display:none !important; }
    #presentation { display:block; position:static; background:#fff; color:#000; }
    .pres-page { page-break-after:always; break-after:page;
      display:flex; flex-direction:column; height:100vh; padding:10mm;
      box-sizing:border-box; }
    .pres-page:last-child { page-break-after:auto; break-after:auto; }
    .pres-title { font-family:'Barlow Condensed',system-ui,sans-serif;
      font-size:13pt; font-weight:600; letter-spacing:.06em;
      text-transform:uppercase; margin-bottom:4mm; }
    .pres-art { flex:1; display:flex; align-items:center;
      justify-content:center; min-height:0; }
    .pres-art img { max-width:100%; max-height:100%; object-fit:contain; }
    /* THE TILES PAGE is a grid of whatever the rail is holding, so it grows
       a row when the drawing grows a level rather than being laid out for
       the six seats that exist today. Four across on landscape paper, where
       three left a hand's width of margin down each side. */
    .pres-tiles { display:grid; grid-template-columns:repeat(4, 1fr);
      gap:0.125in; align-content:start; width:100%; }
    /* A FIGURE CARRIES 40px OF BROWSER MARGIN. Narrowing the grid gap alone
       left the tiles 92px apart -- the gap the eye sees is the margin, not
       the grid's. */
    .pres-tile { display:flex; flex-direction:column; align-items:center;
      gap:2mm; margin:0; }
    .pres-tile img { width:100%; border:0.3mm solid #000; }
    .pres-tile figcaption { font-family:'Barlow Condensed',system-ui,sans-serif;
      font-size:8pt; letter-spacing:.05em; text-transform:uppercase; }
    /* NOT TO SCALE SITS ABOVE THE LOGO (Movie, 15 Sep), in the corner, on
       every page -- so the disclaimer travels with the picture even if one
       page is torn off the set. */
    .pres-foot { display:flex; justify-content:flex-end; margin-top:4mm; }
    .pres-mark { display:flex; flex-direction:column; align-items:center;
      gap:1mm; }
    .pres-scale { font-family:'Barlow Condensed',system-ui,sans-serif;
      font-size:9pt; font-weight:700; letter-spacing:.12em; }
    .pres-mark img { height:12mm; }
  }

  /* THE UPPER RIGHT IS A COLUMN, for the reason #lower-left is a row at the
     other end of the sheet: separately fixed elements sharing one inset are a
     layout kept in step by hand, and this corner was one -- the banner placed
     at +34px and the change note stepping to +68px to get out from under it,
     three numbers that had to be re-measured every time any of the three
     changed height. A flex column does that arithmetic itself.

     CLICK-THROUGH, for #readout's reason a few hundred lines up: it lies over
     the sheet, and a drafter drawing under it should reach the drawing. The
     column is wider than its narrowest child, so the transparent air beside a
     short line would take a press if the column did not refuse it. */
  #upper-right { position:fixed; right:12px; top:var(--note-top); z-index:6;
    display:flex; flex-direction:column; align-items:flex-end; gap:8px;
    pointer-events:none; }

  /* THE DRAFTER'S OWN CLOCK, first in the column (Movie, 20 Sep: "in the
     upper right under the top banner ... put in there the current time and
     date of where the person is (timezonewise)"). That spot was the only
     empty one at the head of the sheet: the file row is above it and both
     file notes are below, and on a page with nothing wrong with the file
     nothing at all was there.

     THE COUNTER'S TYPE, which is what was asked for -- Barlow Condensed at
     10px with the visit count's weight and tracking, so the page's two
     ambient readings are one voice: what the drawing owes nobody, at the
     head, and how many have been here, at the foot. THE INK IS THIS PAGE'S
     TOKEN and not the counter's literal rgba(29,31,32,0.45), which is ink for
     a white page; MODEL wears a night skin by default and palette.js repaints
     --ink-quiet for whichever skin is in force.

     TABULAR FIGURES, #readout's rule for the same reason: a proportional 1 is
     narrower than a 4, so a clock set in them twitches sideways every time the
     minute changes. */
  #clock { font-family: var(--font-ui); font-size:10px; font-weight:600;
    letter-spacing:0.06em; text-transform:uppercase; color: var(--ink-quiet);
    font-variant-numeric:tabular-nums; white-space:nowrap; }
  /* AN EMPTY SLOT TAKES NO ROOM -- the visit counter's slot keeps the same
     rule at the foot. The clock is empty until it is written and stays empty
     if it never is, and the column's gap must not pay for a line that is not
     there. */
  #clock:empty { display:none; }

  /* RUNG 2's QUIET NOTE. A page holding an unsaved edit re-reads nothing when
     another page writes — throwing away this drafter's work to avoid throwing
     away someone else's is the defect the ruling exists to remove — so the
     only thing left to do is say so. Quiet on purpose: it reports a fact about
     the file, it does not ask for a decision, and it sits under SAVE rather
     than over the drawing. */
  /* Follows SAVE to the left: it is SAVE's note, and it was under the shell
     for the same reason SAVE was. LAST IN THE COLUMN, under the banner that
     can be up beside it -- which is the step-down the stylesheet used to do
     by hand with a second `top`. */
  #elsewhere { font-family: var(--font-ui); font-size:11px; letter-spacing:0.06em;
    text-transform:uppercase; color: var(--ink-quiet);
    background-color: var(--surface-chip); background-image: var(--surface-chip-tex, none);
    border:1px solid var(--edge-panel); border-radius:6px; padding:5px 10px; }
  #elsewhere[hidden] { display:none; }
  /* Borrows #elsewhere's chip wholesale -- same corner, same job: a quiet
     line of fact that is not a dialog and does not need dismissing. The
     filename wraps rather than stretching the chip off the screen. */
  #saved-where { font-family: var(--font-ui); font-size:11px; letter-spacing:0.06em;
    text-transform:uppercase; color: var(--ink-quiet);
    background-color: var(--surface-chip); background-image: var(--surface-chip-tex, none);
    border:1px solid var(--edge-panel); border-radius:6px; padding:5px 10px;
    max-width:260px; text-align:right; }
  #saved-where[hidden] { display:none; }
  #saved-where b { color: var(--ink); font-weight:600; }

  /* RUNG 3's READ-ONLY BANNER. It names the holder because "somebody is
     editing this" is not something a drafter can act on, and it carries the one
     press that resolves it. Sat under SAVE with the change note, so the page has
     one place where it says things about the file rather than three. */
  /* THE ONE THING IN THIS COLUMN THAT IS PRESSED, so it is the one that takes
     the pointer back off #upper-right. */
  #lease { display:flex; gap:10px; align-items:center; pointer-events:auto;
    font-family: var(--font-ui); font-size:11px; letter-spacing:0.06em;
    text-transform:uppercase; color: var(--ink-primary);
    background-color: var(--surface-chip); background-image: var(--surface-chip-tex, none);
    border:1px solid var(--accent); border-radius:6px; padding:5px 10px; }
  #lease[hidden] { display:none; }
  #take-over { font:inherit; letter-spacing:inherit; text-transform:inherit;
    color: var(--accent); background:none; border:1px solid var(--accent);
    border-radius:4px; padding:3px 8px; cursor:pointer; }

  /* THE DRIVE-THRU SIGN. It rises from the foot and covers the bone in the
     middle of the strip -- z-index 7, the page's modal layer, over
     the strip's 6. Off screen rather than hidden while shut so the rise is a
     movement the drafter can follow; `visibility` goes with it so nothing
     under the foot takes a stray press.

     THE BOARD IS ONE IMAGE and every zone on it is a percentage of that
     image, measured off assets/drivethru-menu-board.png (2000x1550). The
     art moves, the zones move with it, and nothing here hardcodes a pixel.
     The same arrangement as gruff-drivethru.js, for the same reason: the
     board is a PICTURE, and only the controls painted on top of it take a
     press. */
  /* BIGGER, BECAUSE MOVIE COULD NOT READ IT (16 Sep: "make the stuff in the
     drivethru menu bigger its hard to see"), and then bigger again on 17 Sep
     with a new sign drawn for it: "i'd like this one so the stuff inside can
     be bigger". The shelf went from a sixth of the picture's height to two
     fifths of it, which is what let the cards below grow.

     RE-MEASURED, NOT RESCALED. The art changed shape as well as size, so
     every figure here was read off the new file's own pixels: the screen's
     black runs x 427..948 and y 175..510, the shelf's x 87..932 and y
     536..1150, the post's disc y 1217..1333 centred on x 509.5. Nothing was
     carried over from the square board by proportion. */
  /* TWO BOARDS, TWO SHAPES, ONE RULE. The shape is a variable the skin sets
     rather than a second copy of this block.

     AND THE HEIGHT IS A CONSTRAINT, not an outcome. On the portrait sign this
     was the binding term -- 720px of width on a 0.68 board is 1059px of
     height, taller than the laptop it is drawn on. On the landscape one it is
     slack and the WIDTH binds, which is why that width went up: see the note
     on the screen below. The term stays because it is the rule, not the
     answer, and the next board may be tall again. */
  #drivethru { position:fixed; left:50%; bottom:0; z-index:7;
    --dt-aspect:1.29; --dt-headroom:16px;
    --dt-w:min(860px, calc(100vw - 24px),
      calc((100vh - var(--dt-headroom)) * var(--dt-aspect)));
    width:var(--dt-w);
    transform:translate(-50%, 0);
    transition:transform 220ms ease-out, visibility 220ms;
    pointer-events:none; }
  #drivethru[data-shut] { transform:translate(-50%, 104%); visibility:hidden; }
  #dt-frame { position:relative; width:100%; aspect-ratio:var(--dt-aspect); }
  #dt-board { position:absolute; inset:0; width:100%; height:100%;
    display:block; pointer-events:none; }
  /* Gruff's screen: what he is saying, and the one line under it that says
     what the press will do. Live so a drafter on a reader hears the order
     move without watching the board. */
  /* ── RE-MEASURED FOR THE LANDSCAPE BOARD ───────────────────────────────
     Movie, 20 Sep: "the text is coming off the top board so i increased the
     text area for the dog", and then a second pass -- "i should make more
     space for him". What he sent back is not the old sign made taller, it is
     a different SHAPE: 2000x1550 landscape where the old was 1020x1500
     portrait. So every figure below was read off the new file's own pixels
     rather than carried over by proportion, the same way the 17 Sep art was.

       the dog's band   x 444..1912   y  124.. 458
       the shelf        x 104..1896   y  486..1198
       the bone's disc  x 943..1053   y 1267..1374

     AND THE OVERFLOW IS FIXED BY WIDTH, NOT BY HEIGHT, which is worth saying
     because the band is SHORTER than the one it replaces. At a 1366 sheet the
     old screen was 261x168 and the three lines in it wrapped to eight; this
     one is 626x144 and they wrap to four. A band a third taller would not
     have held the old wrapping either -- the line that was falling off the
     bottom was falling off because seventeen characters is not a sentence. */
  #dt-screen { position:absolute; left:22.2%; top:8%; width:73.4%; height:21.548%;
    box-sizing:border-box; padding:1.6% 2.4%; pointer-events:none;
    display:flex; flex-direction:column; justify-content:center; gap:6px;
    font-family: var(--font-mono); color:#ff4033;
    text-shadow:0 0 10px rgba(255,64,51,0.45); letter-spacing:0.03em;
    line-height:1.35; overflow:hidden; }
  /* SCALED TO THE BOX IT HAS, not to the one it used to have. The square
     board gave the screen 363x240 at a 1366-wide sheet and 22px sat in it;
     the new art's screen is 261x168 there, and 22px in it wraps "BUNGALOW --
     WHICH ONE?" onto three lines. 22 * 261/363 is about 16, which is what
     these ceilings are -- the same type at the same size relative to the
     screen it is printed on. */
  #dt-line { font-size:clamp(11px, 1.9vw, 17px); font-weight:600; }
  #dt-note { font-size:clamp(9px, 1.4vw, 14px); opacity:0.7; }
  /* SMALLER THAN THE NOTE AND DIMMER, at every width -- the ceilings and the
     floors both step down, so there is no sheet size where this line grows
     into the one above it. The screen is pointer-events:none so that the
     board behind it stays a picture; this line takes its press back, and it
     is the only thing in there that does. */
  #dt-project { pointer-events:auto; margin-top:2px;
    font-size:clamp(7px, 1vw, 10px); opacity:0.55; letter-spacing:0.06em;
    color:inherit; text-decoration:none; line-height:1.25; }
  #dt-project:hover { opacity:0.95; text-decoration:underline; }
  /* The tile strip: the house types, on the board's own shelf. */
  #dt-tiles { position:absolute; left:5.9%; top:32.5%; width:88.2%; height:44.1%;
    box-sizing:border-box; display:flex; flex-direction:column;
    justify-content:center; gap:4px; pointer-events:none; }
  /* ONLY THE CARDS TAKE A PRESS, not the shelf they stand on. This read
     `#dt-tiles > *`, and `> *` is #build-bar -- a flex COLUMN, not a control,
     and one that spans the shelf corner to corner. So the gaps between cards,
     and the strip of shelf either side of them, were taken by a container and
     never reached the sheet underneath.

     THE RULE IS THE ONE THE BOARD'S OWN COMMENT STATES two blocks up: the
     board is a PICTURE, and only the controls painted on top of it take a
     press. pointer-events inherits, so the container passes the press through
     and the buttons and fields take it back. model-drivethru.spec.js pins
     every zone of it, the way gruff-drivethru.spec.js pins the other board's.

     WHAT THIS DOES NOT FIX, so nobody looks for it here: a corner pressed onto
     a CARD. A card is a control and swallowing that press is correct. The
     deeper shelf on Movie's 18 Sep art grew the cards, which put more of the
     sheet behind a control, and model-html-outline -- which traces a square
     with the board up -- started failing on CI when the camera framed the
     drawing small. That belongs to the spec, and clearOfTheShelf there is
     where it is answered. */
  #dt-tiles > * { pointer-events:none; }
  #dt-tiles button, #dt-tiles input { pointer-events:auto; }
  /* THE DISC IS A SMALLER SHARE OF A WIDER BOARD -- 110px of 2000 where it
     was 116 of 1020 -- so the percentage halves while the button on screen
     stays the size the art draws it. Centred on x 998 of 2000, which is half
     a percent off centre and not worth a number of its own. */
  #dt-bone { position:absolute; left:50%; top:81.7%; width:5.5%;
    transform:translateX(-50%); aspect-ratio:1 / 1; border:none; padding:0;
    border-radius:50%; background:transparent; cursor:pointer;
    pointer-events:auto;
    /* THE SHADOW THE ART USED TO CAST, cast by the press itself now (Movie,
       20 Sep: "put the little shadow around the bone button on the bottom so
       it looks more 3d"). The painted disc left the board with its shadow,
       and a disc lying flat on the post is a sticker -- the shadow was the
       whole of what made it a dome.

       MEASURED OFF THE OLD ARTWORK, not dialled in by eye. On the 2000px
       board the painted disc was 123px across, and the halo around it
       reached 0px left, 0px right, 0px above and 10px BELOW -- which is why
       Movie's word for it is "on the bottom" and why there is no x offset
       here. Down the disc's centre line it ran 57 levels under the post's
       143 grey about 4px below the edge and was gone by 10px: an offset of
       4, a blur of 6, and 57/143 of black.

       AS FRACTIONS OF --dt-w, BECAUSE THE SIGN IS NOT ONE SIZE. Every figure
       on this board is a percentage of the picture and this is the same rule
       one layer down: 4/2000 and 6/2000 are the two numbers the art was
       measured in. Fixed pixels would be right at the 860px sign and wrong
       at every other width -- a slab on a phone, a hairline on a wall.

       ON THE IMAGE RATHER THAN THE BUTTON: drop-shadow traces the PNG's
       alpha, which is the disc. The button's own box is a square with
       transparent corners, so a box-shadow would cast a square.

       AND IT IS A VARIABLE BECAUSE `filter` DOES NOT STACK. The hover
       brightens the disc, and a bare `filter:brightness()` there would
       REPLACE this rather than add to it -- the press would drop its shadow
       at the exact moment the drafter points at it. */
    --bone-lift: drop-shadow(0 calc(var(--dt-w) * 0.002)
      calc(var(--dt-w) * 0.003) rgba(0,0,0,0.40)); }
  /* CONTAIN, BECAUSE THE ARTWORK IS NO LONGER SQUARE. The post's box is a
     1:1 circle and the bone filled it; a house is taller than it is wide and
     a stretched one reads as a different building. */
  #dt-bone img { width:100%; height:100%; display:block; object-fit:contain;
    filter:var(--bone-lift); }
  #dt-bone:hover img { filter:var(--bone-lift) brightness(1.12); }
  #dt-close { position:absolute; right:5.5%; top:9%; pointer-events:auto;
    font-family: var(--font-ui); font-size:11px; font-weight:700;
    letter-spacing:0.08em; cursor:pointer; color:#f2efe9;
    background:rgba(0,0,0,0.45); border:1px solid rgba(242,239,233,0.45);
    border-radius:4px; padding:3px 8px; }
  #dt-close:hover { border-color:#ff4033; color:#ff4033; }

  /* ROUGH'S BOARD IS A SHEET, NOT A SIGN. Movie, 17 Sep: "the blueprint will
     replace the drivethru", "in the ROUGH version it isn't going to show the
     dog", "no dog will ask questions they will just see the selections".

     THE ZONES ARE RE-MEASURED, NOT NUDGED, which is what the block above
     demands of anyone who replaces the art. assets/draft-board.png is a
     1536x1024 sheet reduced to 896x597, and its blue rule runs from 2.539% to
     97.266% across and 3.809% to 95.996% down -- measured off the file's own
     pixels, not read off a ruler. Every zone below sits inside that rule with
     room to spare, so a sheet re-scanned at another size moves the rule and
     the zones with it.

     THE SIGN'S FURNITURE IS GONE RATHER THAN RESTYLED. A sign has a portrait
     bezel, an LED screen and a post; a sheet of paper has none of them, so
     the screen is not shown here at all. What is lost with it is one line --
     signNote's "press the bone and I'll build it" -- and with the outline
     button retired (see `round`) that line has one wording in practice. The
     selections and the press are what is left, which is the whole of what was
     asked for.

     THE TILES NEED NO SKIN OF THEIR OWN. They were already "the board's own
     blueprint cards: paper, blue ink, a hard edge" for a sign that had no
     paper on it. On actual paper they are simply at home, which is why this
     block sets geometry and one button's colours and nothing else. */
  /* IT RIDES ABOVE THE BAR RATHER THAN OVER IT. Movie, 17 Sep: "don't put the
     house on the blueprint, just bring the blueprint up high enough so the
     house button on the model area can be seen still" -- "i mean the blue
     house button don't put it on the blueprint".

     So the sheet has no press on it at all. The sign covers the bone and
     carries its own copy of it on the post; the sheet leaves the bone
     standing in the bar underneath, and that one press is both the way up to
     the board and the way to build what you picked off it. Which is also
     which button he meant by the one that lights while the blueprint shows.

     THE LIFT IS `--house-h` AND A GAP, and --house-h is a min-height, so a
     foot bar whose row wrapped would be taller than this clears. The spec
     asserts the bone's rectangle is clear of the sheet's rather than
     asserting this number, so a wrap fails there instead of on a squint. */
  /* AND IT SITS IN THE MIDDLE OF THE SHEET, not just above the bar (Movie,
     18 Sep: "can you move the blueprint to closer to middle (top
     bottomwise)").

     CENTRED, OR CLEAR OF THE BAR, WHICHEVER IS LOWER. Centring alone is a
     rule that works on the screen it was written on: on a short sheet half
     the board is taller than the room above the foot, and the centred sheet
     lands back on the bone it was lifted off. `max` says the real rule --
     put it in the middle, and never below the bar -- rather than leaving the
     two in tension. The height it needs for that is the width it took
     divided by its own aspect, which is why the width became a variable. */
  /* AND THE SHEET COMES IN A TENTH, clear of the press below it. Movie, 24
     Sep: "can you make the 'BLUEPRINT' backdrop about 90% that size so there
     will be a little space between the 'BLUEPRINT' and the HOUSE BUTTON (and
     put some padding in so it doesn't cover the HOUSE button (always leave a
     few pixels gap at least but more prefered".

     THE SCALE GOES ON THE WIDTH and nothing else moves: the frame takes its
     height from the aspect and every tile is a percentage of the frame, so
     one number brings the whole sheet in and its contents keep their
     proportions.

     AND THE GAP GOES FROM 12px TO 28px, which is the figure the headroom
     above already reserves for this press -- so the space kept for the house
     and the space left under the sheet are one number rather than two that
     drift. Twelve pixels was "not covering it"; this is the clearance he
     asked for. */
  html[data-theme="rough"] #drivethru { --dt-aspect:1.5;
    --dt-sheet-scale:0.9;
    --dt-headroom:calc(var(--house-h) + 28px);
    --dt-w:calc(min(860px, calc(100vw - 24px),
      calc((100vh - var(--dt-headroom)) * var(--dt-aspect)))
      * var(--dt-sheet-scale));
    bottom:max(calc(var(--house-h) + 28px),
      calc(50vh - var(--dt-w) / var(--dt-aspect) / 2)); }
  html[data-theme="rough"] #dt-screen { display:none; }
  html[data-theme="rough"] #dt-bone { display:none; }
  /* With no screen and no press on it, the selections have the sheet. */
  html[data-theme="rough"] #dt-tiles { left:6%; top:13%; width:88%; height:72%; }
  /* Inside the rule, and in the sheet's own ink. The sign's CLOSE is light
     lettering on a dark plate because it sits on a dark sign; the same plate
     on paper reads as a sticker. */
  html[data-theme="rough"] #dt-close { right:4.6%; top:6.4%; color:#1f3f6b;
    background:rgba(241,233,210,0.72); border-color:#1f3f6b; }
  html[data-theme="rough"] #dt-close:hover { border-color:#8f2a1d; color:#8f2a1d; }

  /* THE BUILD BAR, now the sign's tile shelf rather than a row on the foot. */
  #build-bar { flex:0 1 auto;
    display:flex; flex-direction:column; align-items:stretch; gap:4px; }
  #build-bar[hidden] { display:none; }
  #build-families, #build-entries { display:flex; gap:4px;
    justify-content:center; flex-wrap:wrap; }
  /* THE FIRST SCREEN KEEPS ITS WIDER GAP and nothing else. It used to take a
     taller card as well; with one size everywhere that override is gone, and
     what is left is the space between the three that Movie asked for when
     they were alone on the shelf. `:has()` rather than a class because the
     condition is already in the DOM -- #build-entries carries `hidden`
     exactly when no family is open, set in one place. */
  #build-bar:has(#build-entries[hidden]) #build-families {
    gap:clamp(8px, calc(var(--dt-w) * 0.022), 24px); }
  /* THE BONE ASKS FOR THE PRESS once a complete order is on the board. The
     glow is the one the lit bone already wears; the pulse is what makes it a
     request rather than a state. Stilled for anyone who has asked for less
     motion -- the glow stays, so nothing is only announced by movement. */
  @keyframes dt-bone-ask {
    0%, 100% { filter:var(--bone-lift) brightness(1.15)
      drop-shadow(0 0 4px rgba(255,64,51,0.55)); }
    50%      { filter:var(--bone-lift) brightness(1.35)
      drop-shadow(0 0 13px rgba(255,64,51,0.95)); }
  }
  #dt-bone[data-ready] img { animation:dt-bone-ask 1.4s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) {
    #dt-bone[data-ready] img { animation:none;
      filter:var(--bone-lift) brightness(1.3) drop-shadow(0 0 9px rgba(255,64,51,0.8)); }
  }
  #build-entries[hidden] { display:none; }
  /* The tiles are the board's own blueprint cards: paper, blue ink, a hard
     edge. They are not palette tokens because the board is one picture in
     one light, and a night-skin chip on it would read as a hole. */
  #build-bar button { font-family: var(--font-ui); font-size:clamp(10px, 1.5vw, 14px);
    font-weight:700; letter-spacing:0.04em; text-transform:uppercase;
    cursor:pointer; color:#1f3f6b; padding:5px 10px; border-radius:2px;
    border:1px solid #1f3f6b; background:#f1e9d2; }
  #build-bar button:hover { background:#fff8e6; }
  /* A CARD IS THE WHOLE BUTTON. Movie drew one per house type, lettering and
     all, so the tile wearing one carries no text of its own -- the label
     stays in the DOM for the reader and the check, clipped out of sight,
     because a printed name under a printed name reads as a stutter. */
  #build-bar button.card { padding:0; border:none; background:none;
    line-height:0; }
  /* TWO ROWS HAVE TO FIT THE SHELF. A family and its open submenu are both
     on the board at once, so the card is sized so that pair clears the
     black strip -- a tile that spills past the frame is an order the
     drafter cannot reach.

     MEASURED AGAINST THE BOARD, NOT THE VIEWPORT. This was 8vw, which is the
     wrong ruler by one step: the shelf a card has to fit inside is a fraction
     of --dt-w, and --dt-w is a min() of three terms of which the viewport is
     only one. On the portrait sign the two happened to track each other. On
     the landscape one they came apart -- the board grew and the cards did
     not, and three tiles sat in the middle of a shelf twice their height.

     THE CEILING IS THE SHELF'S OWN ARITHMETIC. The sign's shelf is 44.1% of
     a board 1/1.29 as tall as it is wide, so at the 860px cap it is 294px and
     two rows plus their gap must live in that: 2h + 4 <= 294, h <= 145. 120
     leaves room for the label row the entries carry and is still a third
     bigger than the 86 it replaces -- Movie, 16 Sep, and still standing:
     "make the stuff in the drivethru menu bigger its hard to see". */
  /* SQUARE, AND ONE SIZE FOR EVERY CARD (Movie, 24 Sep): "these should all be
     the same size (a little bigger than the bottom ones) the top ones are a
     bit too big and they would look better matching sizes i think".

     THAT SUPERSEDES THE 150/110 EARLIER THE SAME EVENING, which gave the
     family row half again the entries', and it is the second time this pair
     of numbers has moved -- both times after he looked at the board rather
     than at a description of it. One rule now, so there is nowhere for a
     second size to hide.

     A LITTLE BIGGER THAN THE BOTTOM ROW WAS, which is what he asked for:
     0.1265 of the board became 0.14, so the entries grow from 111px to 122
     at his window and the families come down from 150 to meet them.

     THE PAIR STILL HAS TO CLEAR THE SHELF. It is 44.1% of a board 1/1.29 as
     tall as it is wide -- 294px at the 860px cap -- and a family row and its
     open submenu share it: two rows at the 134 ceiling is 268 and a gap,
     inside 294 with room. Equal rows make that arithmetic simpler than it
     has been all evening. */
  /* THE CARD IS A SQUARE BOX, and the picture fits inside it. `width:auto`
     off a fixed height let the ART decide the tile's shape, so a card that
     was not square made its own row uneven -- 1storey.png is 512x562 and
     rendered 111x122 beside its 122x122 neighbours. The board's own rule is
     square cards, one size a row, and it is checked in
     model-drivethru.spec.js.
     `contain` RATHER THAN `cover` because the alternative is cropping
     somebody's drawing to fit a grid: a square card fills this box exactly
     and is untouched, and a card that is not square pillarboxes instead of
     losing its edges. A square export still looks better and is the thing to
     ask for; this makes the board honest either way. */
  #build-bar button.card img { display:block;
    height:clamp(48px, calc(var(--dt-w) * 0.14), 134px);
    width:clamp(48px, calc(var(--dt-w) * 0.14), 134px);
    object-fit:contain;
    border:1px solid transparent; border-radius:2px; }
  #build-bar button.card:hover img { border-color:#8f2a1d; }
  #build-bar button.card.open img, #build-bar button.card.chosen img {
    border-color:#8f2a1d; box-shadow:0 0 0 2px rgba(143,42,29,0.45); }
  #build-bar button.card .said { position:absolute; width:1px; height:1px;
    margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0);
    white-space:nowrap; border:0; }
  /* THE SIZE ROW sits under the entry chips, on the same shelf, because it
     is the same question continued: which garage. The fields wear the
     board's paper and ink rather than the browser's, or they read as a
     form dropped on a picture. */
  #build-sizes { display:flex; gap:4px; justify-content:center;
    align-items:center; flex-wrap:wrap; }
  #build-sizes[hidden] { display:none; }
  #size-stock { display:flex; gap:4px; justify-content:center; flex-wrap:wrap; }
  #size-custom { display:flex; gap:3px; align-items:center;
    font-family:var(--font-ui); font-size:clamp(10px, 1.5vw, 14px);
    font-weight:700; letter-spacing:0.04em; color:#1f3f6b; }
  #size-custom[hidden] { display:none; }
  #size-custom input { width:4.2em; font-family:var(--font-ui);
    font-size:clamp(10px, 1.5vw, 14px); font-weight:700; text-align:center;
    color:#1f3f6b; background:#f1e9d2; border:1px solid #1f3f6b;
    border-radius:2px; padding:3px 4px; }
  #size-custom input:focus { outline:2px solid #8f2a1d; outline-offset:1px; }
  /* The family whose submenu is open, and the type the drawing carries, both
     read as the page's one attention colour -- the same signal the wall tool
     uses when it is armed. */
  #build-bar button.open, #build-bar button.chosen {
    color:#8f2a1d; border-color:#8f2a1d; box-shadow:inset 0 0 0 1px #8f2a1d; }

  #tool-slot:empty::after { content:'TOOLS'; display:block; padding:6px 2px;
    font-family: var(--font-ui); font-size:9px; letter-spacing:0.1em;
    color: var(--ink-quiet); opacity:0.5; }
  [data-tool-group] + [data-tool-group] { margin-top:10px; }
  [data-tool-group-name] { font-family: var(--font-ui); font-size:9px;
    font-weight:600; letter-spacing:0.1em; text-transform:uppercase;
    color: var(--ink-quiet); margin-bottom:5px; }
  .tool-keys { display:grid; grid-template-columns:repeat(4, 40px); gap:4px; }
  .tool-key { position:relative; width:40px; height:40px; padding:0;
    display:block; cursor:pointer; border-radius:3px;
    border:1px solid var(--edge-panel);
    background-color: var(--surface-chip);
    background-image: var(--surface-chip-tex, none);
    color: var(--ink-quiet); font-family: var(--font-ui); }
  .tool-key:hover { border-color: var(--accent); color: var(--accent); }
  /* ARMED IS THE ACCENT, the same signal every armed control on the page
     uses, because a drafter should not have to learn that the tool column
     means something different from the rest of the chrome. */
  .tool-key[aria-pressed="true"] { border-color: var(--accent);
    color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  /* AN UNAVAILABLE TOOL LOOKS DOWN, and it has to look down MEASURABLY. An
     opacity of 0.9 would satisfy "the rule exists" while looking identical on
     screen, and a `disabled` attribute with no rule behind it at all is the
     broken state that looks exactly like the working one -- so
     tests/model-tool-boards.spec.js reads the COMPUTED opacity, not the
     attribute. Three signals, none of them the accent: the key is dimmed, it
     loses the hover promise, and the cursor says it will not take the press. */
  .tool-key:disabled, .tool-key:disabled:hover { opacity:0.35; cursor:not-allowed;
    border-color: var(--edge-panel); color: var(--ink-quiet); box-shadow:none; }
  /* Fixed to the viewport and out of the way of hit-testing: a label that
     ate the pointer would break the very gesture it is reporting on. */
  #draw-len { position:fixed; z-index:40; pointer-events:none;
    font-family: var(--font-mono); font-size:12px; font-weight:600;
    padding:2px 6px; border-radius:3px; white-space:nowrap;
    background: var(--surface-panel); color: var(--ink-primary);
    border:1px solid var(--edge-panel); }
  [data-tool-letter] { position:absolute; top:2px; left:4px; font-size:11px;
    font-weight:600; line-height:1; }
  /* The five bare faces keep the same box: a key whose letter box collapses
     would sit differently from its neighbours and read as a different kind of
     key, which is a thing about the tool that is not true. */
  [data-tool-letter]:empty::after { content:'\200b'; }
  [data-tool-name] { position:absolute; left:0; right:0; bottom:2px;
    font-size:6.5px; font-weight:600; letter-spacing:0.02em;
    text-transform:uppercase; line-height:1.1; text-align:center;
    padding:0 1px; overflow:hidden; }
  /* SELECTION and OBJECT TYPE. Chips wrap rather than scroll: ALL LEVELS and
     FENESTRATION are long words in a 120px panel, and a row that scrolls
     sideways hides the chip a drafter is looking for. */
  /* THE COLUMN IS AS WIDE AS THE KEYPAD AND NO WIDER. Measured, because the
     first version was not: `flex:1 1 auto` chips plus the words FENESTRATION
     and ALL LEVELS pushed the panel to 451px, against the keypad's 172. A
     panel two and a half times the width it needs is drawing area taken for
     nothing, and it is the same occlusion cost Skipper measured and cut on the
     right. Fixing the slot's width makes the chips wrap inside it instead of
     stretching it. */
  #tool-slot { width:172px; }
  .sel-row { display:flex; flex-wrap:wrap; gap:3px; }
  .sel-chip { flex:0 1 auto; min-width:0; overflow-wrap:anywhere;
    padding:5px 4px; cursor:pointer;
    border:1px solid var(--edge-panel); border-radius:2px;
    background-color: var(--surface-chip);
    background-image: var(--surface-chip-tex, none);
    color: var(--ink-quiet); font-family: var(--font-ui); font-size:9px;
    font-weight:600; letter-spacing:0.04em; line-height:1; }
  .sel-chip:hover { border-color: var(--accent); color: var(--accent); }
  /* A TYPED DIMENSION, wearing the panel's own furniture rather than the
     browser's: the chips beside it set the border, the ink and the face, and
     a field that looked like neither would read as a hole in the panel. It is
     a text box, so it takes the READING font -- a dimension is meant to be
     read back, and the chips' 9px caps are a label voice, not a value one. */
  .prop-field { width:100%; box-sizing:border-box; padding:4px 5px;
    border:1px solid var(--edge-panel); border-radius:2px;
    background: var(--surface-field, var(--surface-chip));
    color: var(--ink); font-family: var(--font-ui); font-size:11px;
    letter-spacing:0.02em; line-height:1.2; }
  .prop-field:focus { outline:none; border-color: var(--accent); }
  /* §6's other two surfaces go down the same way the keys do, and the same
     0.35 so one number governs "unavailable" across the whole column. Read as
     computed opacity by the spec, never as the attribute. */
  .sel-chip:disabled, .sel-chip:disabled:hover { opacity:0.35; cursor:not-allowed;
    border-color: var(--edge-panel); color: var(--ink-quiet); box-shadow:none; }
  .sel-chip[aria-pressed="true"] { border-color: var(--accent);
    color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .sel-help { margin-top:5px; font-family: var(--font-ui); font-size:9px;
    line-height:1.25; color: var(--ink-quiet); }
  /* The old page's warning red (#b04050, :23622), and it means one thing: a
     filter is engaged. Not "the cursor is over something excluded". */
  .sel-help[data-engaged] { color:#b04050; }
  /* ASSEMBLY and UNGROUP run the panel's width -- they are commands, not a
     choice between siblings, and a full-width button is what says so. */
  .asm-wide { display:block; width:100%; margin-bottom:3px; }
  /* AN AUTHOR `display` BEATS THE BROWSER'S `[hidden]`, which is a rule of the
     cascade rather than a quirk: [hidden]{display:none} lives in the UA
     stylesheet and any author display wins it. Without this line UNGROUP is
     visible whenever it has been rendered, hidden attribute and all -- it
     showed with nothing selected, which invites a press that cannot do
     anything. Caught by the spec, not by looking. */
  .asm-wide[hidden] { display:none; }
  .asm-wide:disabled { opacity:0.42; cursor:not-allowed;
    border-color: var(--edge-panel); color: var(--ink-quiet); }
  .asm-wide:disabled:hover { border-color: var(--edge-panel);
    color: var(--ink-quiet); }
  [data-assembly-dialog] { margin-top:6px; padding-top:6px;
    border-top:1px solid var(--edge-panel); }
  [data-assembly-dialog][hidden] { display:none; }
  [data-assembly-name] { box-sizing:border-box; width:100%; margin-bottom:4px;
    padding:5px 4px; border:1px solid var(--edge-panel); border-radius:2px;
    background: var(--surface-chip); color: var(--ink);
    font-family: var(--font-ui); font-size:10px; letter-spacing:0.04em;
    text-transform:uppercase; }

  /* THE LEVELS / LAYERS PANEL. Movie: "i will also need the LEVELS / LAYERS
     menu too", and "the level layers should be a tab on the right side like
     in the DC files". It is a third pane in the right-edge group rather than
     a second rotated tab on the same edge -- Devin's ruling, and he withdrew
     the "must not bury the rail" line with it: reachable means one click, not
     simultaneously visible. Two tabs on one edge is how the chrome-on-chrome
     collisions of #389 happened.

     Carried from MODEL.dc.html:1850-1955 by SHAPE, not by stylesheet: a card
     per level with its layer rows inside, the active one lit. */
  /* NO SECOND SCROLLER, AND NO 42vh (Movie, 15 Sep: "take a look at the DC
     version that is the best version"). MODEL.dc.html's rail scrolls AS ONE
     (:1840, `overflow-y:auto` on the rail itself) so ELEVATIONS, LEVELS with
     their layer sets, SECTIONS and the BONEYARD read as one list. Capping
     this pane at 42vh put a short window inside a tall panel: the levels
     scrolled away inside it while the rail below them stood empty. */
  #levels-panel { display:flex; flex-direction:column; gap:6px; }
  #levels-panel::-webkit-scrollbar { display:none; }
  /* ONE PANE SHOWS AT A TIME, and `hidden` is not enough on its own: both
     panes set `display` in their own rules, which beats the attribute's UA
     style. */
  #right-rail #levels-panel[hidden],
  #right-rail #view-rail[hidden] { display:none; }
  .lv-head { display:flex; align-items:center; gap:6px; }
  .lv-head-title { flex:1; font-family: var(--font-ui); font-size:9px;
    letter-spacing:0.1em; text-transform:uppercase; color: var(--ink-quiet); }
  .lv-datum { font-family: var(--font-ui); font-size:9px; letter-spacing:0.04em;
    color: var(--ink-quiet); opacity:0.8; }
  .lv-card { display:flex; gap:0; border:1px solid var(--rule); background:transparent; }
  .lv-bar { width:4px; flex:0 0 4px; }
  .lv-body { flex:1; min-width:0; display:flex; flex-direction:column; }
  .lv-name { font-family: var(--font-ui); font-size:10px; letter-spacing:0.06em;
    text-align:left; padding:4px 6px; background:none; border:0; color: var(--ink);
    cursor:pointer; text-transform:uppercase; }
  .lv-card[data-active] .lv-name { font-weight:700; }
  .lv-layers { display:flex; flex-direction:column; }
  .lv-layer { font-family: var(--font-ui); font-size:9px; letter-spacing:0.04em;
    text-align:left; padding:3px 6px 3px 12px; background:none; border:0;
    color: var(--ink-quiet); cursor:pointer; }
  .lv-layer[data-active] { background: var(--accent); color: var(--on-accent);
    font-weight:700; }
  .lv-card-head { display:flex; align-items:center; }
  .lv-card-head .lv-name { flex:1; }
  .lv-add, .lv-del { font-family: var(--font-ui); background:none; cursor:pointer;
    color: var(--ink-quiet); }
  .lv-add { border:1px solid var(--rule); font-size:9px; font-weight:700;
    letter-spacing:0.06em; padding:2px 5px; }
  .lv-del { border:0; font-size:12px; line-height:1; padding:2px 6px; }
  .lv-del:hover, .lv-add:hover { color: var(--ink); }
  .lv-empty { font-family: var(--font-ui); font-size:9px; letter-spacing:0.04em;
    color: var(--ink-quiet); opacity:0.7; padding:3px 6px; }
  .lv-layer[disabled] { opacity:0.35; cursor:default; }
  .props-title { font-family: var(--font-ui); font-size:9px; font-weight:600;
    letter-spacing:0.1em; text-transform:uppercase; color: var(--ink-quiet);
    margin-bottom:6px; }
  /* THE PROPERTIES BOX, under the tool column in the left rail. The rule the
     slot used to carry is now the BOX's -- the divider belongs above the
     fold button, or a folded box would sit on the tools with no line between
     them. */
  /* AND IT CANNOT WIDEN THE RAIL. #left-rail sets min-width and no max
     (shell-bars.css:901), so the rail takes the width of its widest child --
     which made a panel's longest line into a measurement of how much of the
     PLAN the rail covers. A two-line note in the BEAM panel took the rail to
     470px and swallowed the presses model-structure-place.spec.js uses to
     draw a beam by hand: both its beam tests failed with `beams 0/0`, no page
     error, nothing on screen to explain it.
     The cap is the tool column's own width, so the box wraps inside the rail
     the tools already established instead of setting a new one. */
  #props-box { margin-top:10px; padding-top:10px; max-width:180px;
    border-top:1px solid var(--edge-panel); }
  #props-box[hidden] { display:none; }
  .props-fold { display:block; width:100%; padding:0 0 6px; border:0;
    background:none; cursor:pointer; text-align:left;
    font-family: var(--font-ui); font-size:9px; font-weight:600;
    letter-spacing:0.1em; text-transform:uppercase; color: var(--ink-quiet); }
  .props-fold:hover { color: var(--ink); }
  /* The fold's arrow is the button's own, so the word never moves. */
  .props-fold::after { content:' \25B4'; opacity:0.7; }
  [data-folded] > .props-fold::after { content:' \25BE'; }
  #props-slot { font-family: var(--font-ui); font-size:10px;
    color: var(--ink-quiet); }
  #props-slot[hidden] { display:none; }
  [data-folded] > #props-slot { display:none; }

  /* THE SEATING CHART: six cut views, all six always shown. The shape is
     MODEL.dc.html's rail (:188-200) and the PAIRING is its own -- E1|E3 over
     E2|E4, then the two section seats side by side (:7266, :7281).

     NOT its colours, though. That rail is #fff cards with #b04060 accents
     baked in, because that page has one light skin. This page has a night
     one, and the same literals inside drawCutMarks2D punched a white disc
     into the night drawing -- tests/model-html-cuts.spec.js's header records
     it. Every colour here is a palette token, so the rail follows the skin. */
  /* The CONTAINER takes no clicks, the seats do -- MODEL.dc.html's own split
     (.view-thumb carries `pointer-events:auto`, so its wrapper does not).
     Without it the 6px gutters between seats swallow taps meant for the
     drawing underneath. */
  /* TWO COLUMNS, AND THE SEATS ARE SMALL ON PURPOSE. Two because this rail is
     going to hold the plan cards as well -- ROOF and SITE, then plan/floor for
     each level, the way MODEL.dc.html pairs them across its two columns
     (:7268-7279). Six seats is three rows; the full chart is closer to seven,
     so the rail grows DOWNWARD and the seat has to be small enough that it
     still fits when it does.
     Measured on repro-garage-house rather than eyeballed: at 118px the rail
     hid 9.6% of the drawing, at 84px it hides 5.5%, for the same six views.
     A single tall column was worse than either (10.9%) -- fit() puts the house
     against the right edge, so a column runs straight down the work. */
  /* A TENANT OF THE RIGHT PANEL, not a corner overlay. It was fixed at
     right:12px/top:80px and hid 5.5% of the drawing whatever the drafter was
     doing; inside the panel it hides nothing when the panel is shut. */
  #view-rail { display:grid; grid-template-columns:repeat(2, 84px); gap:6px;
    /* No max-height of its own any more: the panel it sits in scrolls, so the
       plan cards can double the row count without the rail needing a second
       scroller inside the first. */ }
  #view-rail[hidden] { display:none; }
  .seat { pointer-events:auto;
    width:84px; padding:0; text-align:left; cursor:pointer; overflow:hidden;
    background-color: var(--surface-panel); background-image: var(--surface-panel-tex, none);
    border:1px solid var(--edge-panel); border-radius:4px; }
  .seat:hover { border-color: var(--accent); }
  .seat.active { border-color: var(--accent); box-shadow:0 0 0 1px var(--accent); }
  /* AN EMPTY SEAT IS A CHAIR, NOT A BUTTON. The creation gesture that fills a
     section seat on the old page is deferred (SPEC §3), so an empty seat must
     not invite a press that does nothing. It is disabled rather than merely
     unstyled: `cursor:default` tells a mouse and nothing else, while disabled
     also takes it out of the tab order and off a screen reader's list of
     things to press. */
  .seat[disabled] { cursor:default; }
  .seat[disabled]:hover { border-color: var(--edge-panel); }
  .seat canvas { display:block; width:82px; height:54px; }
  .seat[disabled] canvas { opacity:0.25; }
  .seat-label { padding:3px 4px 4px; border-top:1px solid var(--edge-panel);
    font-family: var(--font-ui); font-size:8px; font-weight:600;
    letter-spacing:0.04em; text-transform:uppercase; color: var(--ink-quiet);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .seat.active .seat-label { color: var(--accent); }

  /* The empty and error states say what to do, because a black screen with
     nothing on it is indistinguishable from a page that failed to boot. */
  /* The promotion confirm sits above everything, including the notice, because
     it is the one thing a drafter must answer before the page does what they
     asked. [hidden] is spelled out: the author display below would otherwise
     beat the UA rule, which is the bug the UNGROUP button had. */
  #promote { position:fixed; inset:0; z-index:7; display:flex;
    align-items:center; justify-content:center; padding:24px;
    background:rgba(0,0,0,0.35); }
  #promote[hidden] { display:none; }
  /* SAME SHELL AS #promote, deliberately. It is the same kind of question --
     a modal with two ways out -- and a second look would read as a second
     kind of thing. */
  /* THE SAME SHELL for the bone's second press -- and it is a SEPARATE
     element from #bone-choice above, deliberately. That one is the TOY
     board's "break the bone here, or move this wall?", a different bone
     entirely: reusing its id because both are about a bone and both offer
     two answers is exactly the collision DEFINITIONS.md exists to stop. */
  #bone-choice, #build-choice { position:fixed; inset:0; z-index:7; display:flex;
    align-items:center; justify-content:center; padding:24px;
    background:rgba(0,0,0,0.35); }
  #bone-choice[hidden], #build-choice[hidden] { display:none; }
  /* The queued house, named on its own line above the two answers -- Movie,
     19 Sep: "(and should show what type of house they are currently going to
     build - (1 storey bungalow, 2 storey over garage, Modified Bilevel
     etc.)". A choice between two verbs with no subject is not a choice. */
  [data-build-choice-house] { font-weight:700; letter-spacing:0.06em; }
  .promote-card { max-width:26em; padding:16px 18px; border-radius:4px;
    border:1px solid var(--edge-panel);
    background-color: var(--surface-panel);
    background-image: var(--surface-panel-tex, none); }
  .promote-card p { margin:0 0 12px; font-family: var(--font-ui);
    font-size:13px; line-height:1.4; color: var(--ink-primary); }
  .promote-row { display:flex; gap:8px; }
  .promote-row button { flex:1; padding:7px 10px; cursor:pointer;
    border-radius:3px; border:1px solid var(--edge-panel);
    background-color: var(--surface-chip);
    background-image: var(--surface-chip-tex, none);
    color: var(--ink-quiet); font-family: var(--font-ui); font-size:11px;
    font-weight:600; letter-spacing:0.04em; }
  .promote-row button:hover { border-color: var(--accent); color: var(--accent); }
  [data-promote-go] { border-color: var(--accent); color: var(--accent); }
  /* THE NOTICE IS A MESSAGE, NOT A DOOR. It covers the whole sheet to be
     read, and while it did so with pointer events it also swallowed every
     press aimed at the bars behind it -- including NEW and OPEN, the two
     controls the "no saved drawing" notice is asking the drafter to use. */
  #notice { position:fixed; inset:0; z-index:6; display:none;
    align-items:center; justify-content:center; padding:24px; text-align:center;
    pointer-events:none; }
  #notice.show { display:flex; }
  #notice div { max-width:34em; pointer-events:auto; }
  #notice h1 { font-family: var(--font-ui); font-size:19px; font-weight:600;
    letter-spacing:0.02em; margin:0 0 8px; color: var(--accent); }
  #notice p { margin:0 0 6px; color: var(--ink-secondary); }
  #notice code { font-family: var(--font-mono); font-size:0.92em;
    color: var(--ink-primary); padding:1px 5px; border-radius:3px;
    background-color: var(--surface-chip); background-image: var(--surface-chip-tex, none); }
</style>
</head>
<body>

<canvas id="plan"></canvas>
<!-- THE LOWER-LEFT ROW. Movie, 19 Sep: "i need the viewcounter lets put it
     on lower left (2nd row from bottom to the left of 'STATUS READOUT'". The
     count used to mount beside the PROJECT link, which on this page is the
     BOTTOM row; the row above is where the instruments are, and a count of
     visits reads as one.

     THE SLOT IS EMPTY ON EVERY DESK AND IN EVERY TEST, deliberately and
     unavoidably: traffic-counter.js reports nothing and mounts nothing on
     localhost, 127.0.0.1 or file:, so STATUS READOUT sits at the same 12px
     here that it always has and only moves right on the live site. That is
     the same shape the count already has on the five other pages -- it
     shifts the row it joins -- and it is why the slot is a real element with
     a name rather than a gap measured in pixels. -->
<script>window.DraftShellBars.readout();</script>

<!-- THE UPPER-RIGHT COLUMN, under the file row: the clock the drafter reads
     and the two things the page has to say about the FILE, stacked in the
     order they are wanted. The clock is always there; the other two are the
     exception, so they arrive beneath it rather than pushing it off.

     THE ORDER IS THE STACK. `hidden` is `display:none` here, so a column of
     three with two hidden is one line at the top and no gap paid for the
     other two -- which is what replaced the three hand-measured `top` values
     the stylesheet note above describes. -->
<div id="upper-right" data-upper-right>
  <div id="clock" data-local-clock></div>
  <div id="lease" data-lease-banner hidden>
    <span data-lease-message></span>
    <button id="take-over" type="button" data-take-over>TAKE OVER</button>
  </div>
  <div id="elsewhere" data-changed-elsewhere hidden>changed elsewhere</div>
  <!-- WHERE THE FILE WENT, and only when the page could not ask. A browser
       with a save dialog lets the drafter CHOOSE the folder, so telling them
       where it is would be telling them what they just typed. Without one the
       browser picks, silently, and "I just saved the file but have no clue
       where it is" is the whole of the complaint this answers. -->
  <div id="saved-where" data-saved-where hidden></div>
</div>

<!-- THE SHELL. Two pull-out sidebars, each with a tab on its own edge, after
     MODEL.dc.html's shape (:1762-1763) rather than its stylesheet. Devin's
     split: LEFT is what you are about to do, RIGHT is what you are looking at.
     The left panel is the tool palette's home and is empty until Gilligan's
     seven land -- the slot exists so a tool is not built against a canvas that
     is about to lose its edge. -->

<button id="left-tab" class="rail-tab" type="button" data-left-tab hidden>DRAFTING TOOLS</button>
<aside id="left-rail" data-left-rail hidden>
  <div id="tool-slot" data-tool-slot></div>
  <!-- PROPERTIES SITS UNDER THE TOOLS. Movie, 19 Sep: "we should designate an
       area on the model page for the PROPERTIES box (which will change
       depending on what you are using) i'm thinking add a collapsable box on
       the left side under the DRAFTING TOOLS". It was in the RIGHT rail under
       LEVELS / LAYERS until then, which put the thing you change a wall with
       on the far side of the sheet from the thing you draw a wall with.

       IT FOLDS ON ITS OWN, and that is the point of the box rather than a
       flourish: the tool column above it is six rows tall, so folding the
       properties away has to be possible WITHOUT shutting the rail that holds
       the keys. The fold is in the URL beside `left` and `right`, for the
       reason those are: it is what the drafter is looking at, and it survives
       a reload.

       THE TITLE STAYS INSIDE THE SLOT, not on the fold button. The button
       says PROPERTIES always; the slot says WALL, ROOF, COLUMN -- whatever is
       in hand. Putting the changing word on the button would have made the
       fold's own label move under the drafter's cursor. -->
  <div id="props-box" data-props-box hidden>
    <button class="props-fold" type="button" data-props-fold
      aria-expanded="true">PROPERTIES</button>
    <div id="props-slot" data-props-slot hidden></div>
  </div>
</aside>

<!-- TWO TABS ON THE RIGHT EDGE (Movie, 15 Sep): "2 seperate tabs top will be
     LEVELS / LAYERS, and then next down LAYOUT PREVIEWS".

     THIS OVERTURNS A RULING OF MINE, and the reason it can is that the
     ruling's evidence was about OVERLAP, not about count: two tabs on one
     edge is how #389's chrome-on-chrome collisions happened, when both were
     pinned to the same top. These two are pinned in sequence -- the second
     starts where the first ends -- and the pairwise chrome check measures
     every pair of boxes on the page, so a tab that grows into its neighbour
     fails a run rather than reaching a drafter.

     ONE PANE AT A TIME, because the panel is bounded at 288px and stacking
     both panes inside it was the arrangement that made the rail scroll past
     the levels to reach the seats. Pressing the open tab shuts the rail;
     pressing the other swaps the pane without shutting. -->
<button id="right-tab" class="rail-tab" type="button" data-right-tab
  data-pane-tab="levels" hidden>LEVELS / LAYERS</button>
<button id="previews-tab" class="rail-tab" type="button" data-previews-tab
  data-pane-tab="previews" hidden>LAYOUT PREVIEWS</button>
<aside id="right-rail" data-right-rail data-collapsed hidden>
  <!-- LEVELS / LAYERS. The rail's EDITOR, not its companion: the layer rows
       inside a level card are the same objects as the seats, so adding a
       level adds two seats and deleting one takes them away. -->
  <div id="levels-panel" data-levels-panel data-pane="levels"></div>
  <div id="view-rail" data-pane="previews"></div>
</aside>
<div id="hint">drag to pan · wheel to zoom · 0 to fit</div>


<!-- THE HOUSE STRIP (§7b), along the foot: what the drafter PICKS.
     MODEL.dc.html's row is "three families between the turtle and the bone",
     each opening ONE submenu (Movie, 6 Sep) -- that shape, from the same data,
     through build-menu.js. It was at the top of the sheet; the drive-thru sign
     rises from the foot and will cover exactly this row, which is why the
     things a drafter reads WHILE DRAWING went the other way.
     WHAT IS NOT HERE: the generator. See the seam note beside ModelBuild. -->
<script>window.DraftShellBars.bottomBar({ page: 'model' });</script>

<!-- GRUFF'S DRIVE-THRU SIGN. Movie, 15 Sep: the menu "should pop up from the
     bottom of the screen and cover both the DRIVE-THRU MENU BUTTON and the
     BONE BUTTON (there will be another BONE BUTTON on the Drivethru menu)",
     and "the dog on screen will take them through the menu of home types".
     So: one board, Gruff talking on its screen, the house types on its
     shelf, and his own bone on the post.

     IT ORDERS; IT DOES NOT DRAW. Picking a tile is the same press the build
     bar always was -- it records a type and produces no geometry -- and the
     bone fires window.ModelBuild's build handlers. The premade design per
     house type attaches at that seam, which is why nothing here knows what
     a bungalow looks like. -->
<div id="drivethru" data-drivethru-window data-shut role="dialog"
  aria-modal="false" aria-label="Gruff's drive-thru: pick a house type">
  <div id="dt-frame">
    <img id="dt-board" data-drivethru-board src="./assets/drivethru-menu-board.png" alt="" />
    <button id="dt-close" type="button" data-drivethru-close
      title="Shut the drive-thru">CLOSE</button>
    <div id="dt-screen" aria-live="polite">
      <div id="dt-line" data-drivethru-line></div>
      <div id="dt-note" data-drivethru-note></div>
      <!-- THE WAY OUT FOR THE DRAFTER WHO WANTS THE NUMBERS. Movie, 19 Sep:
           "on the bottom of the drivethru menu area (where display area is)
           we should put a button to the PROJECT area that says 'CLICK HERE
           TO GO OVER THE CONSTRUCTION DETAILS / SECTIONS FOR YOUR PROJECT'",
           and immediately after: "make it smaller text like don't draw
           attention to it, it will just be there for people who want to use
           it".

           SO IT IS DELIBERATELY QUIET, and that is the requirement rather
           than a style note: this board's job is to get a house built in one
           press, and a second call to action beside the bone would compete
           with the one thing it is for. Smaller than the note above it,
           dimmed, and last.

           A LINK, NOT A BUTTON, because PROJECT.html is a PLACE. The page row
           at the foot already teaches that a place you go is a link; a button
           that navigates would be the third thing on this page pretending to
           be a press when it is a door.

           OUTSIDE aria-live's USEFUL RANGE but inside its element, which is
           accepted: the screen announces what Gruff says, and this line never
           changes, so it is announced once when the board rises and not
           again. Moving it out of the screen to avoid that would put it on
           the board's artwork, where it has no dark ground to sit on. -->
      <a id="dt-project" data-drivethru-project href="./PROJECT.html"
        title="The project: wall and floor assemblies, heights, and the sections they make"
        >CLICK HERE TO GO OVER THE CONSTRUCTION DETAILS / SECTIONS FOR YOUR PROJECT</a>
    </div>
    <div id="dt-tiles" data-drivethru-tiles>
      <div id="build-bar" data-build-bar hidden>
        <div id="build-families" data-build-families></div>
        <div id="build-entries" data-build-entries hidden></div>
        <!-- HOW BIG THE GARAGE IS, and only the garage asks (Movie, 15 Sep).
             Three sizes and a pair of fields, on the shelf under the entry
             that raised the question -- a house's size arrives with its
             premade design, a garage's size IS the design. -->
        <div id="build-sizes" data-build-sizes hidden>
          <div id="size-stock" data-build-size-stock></div>
          <div id="size-custom" data-build-size-custom hidden>
            <label class="said" for="size-w">Garage width in feet</label>
            <input id="size-w" data-build-size-width type="number" inputmode="numeric"
              min="8" max="60" step="1" placeholder="__" />
            <span aria-hidden="true">FT X</span>
            <label class="said" for="size-d">Garage depth in feet</label>
            <input id="size-d" data-build-size-depth type="number" inputmode="numeric"
              min="8" max="60" step="1" placeholder="__" />
            <span aria-hidden="true">FT</span>
          </div>
        </div>
      </div>
    </div>
    <button id="dt-bone" type="button" data-drivethru-bone
      title="Build the house you picked">
      <img data-bone-art src="./assets/bone-red.png" alt="BONE — build it" />
    </button>
  </div>
</div>
<!-- THE LENGTH THE DRAFTER CAN SEE WHILE HE DRAWS. Movie, 13 Sep: "show the
     line length on screen to the user during the line drawing when their
     finger on screen for ipad". Fixed rather than absolute so it needs no
     positioned ancestor and can follow clientX/clientY straight. -->
<div id="draw-len" data-draw-length hidden></div>

<!-- THE INSTRUMENT STRIP. The icons are MODEL.dc.html:1975-2072's own paths,
     kept identical so the two pages read as the same board; the colours are
     not, because that strip is #fbfbfc with #1d1f20 ink baked in and this
     page has a night skin. Everything here paints in currentColor and takes
     it from a palette role. -->
<script>window.DraftShellBars.topBar({ instruments: true });</script>

<!-- WHAT THE PAGE IS SAYING, on the sheet rather than on the bar. It kept
     its id when it moved: eight specs across four files read the page's
     refusals out of it, and the thing that moved is where it is printed, not
     what it is. -->
<span id="strip-message" data-strip-message></span>

<div id="notice"><div id="notice-body"></div></div>
<!-- THE PROMOTION CONFIRM. Its own element rather than a window.confirm,
     because §7 names the two answers -- Continue, Stay in TOY -- and OK/Cancel
     does not say which one keeps the drawing where it is. deleteLevel uses
     window.confirm and is right to: "delete this level" needs no vocabulary of
     its own. This one does. -->
<div id="promote" data-promote hidden>
  <div class="promote-card">
    <p data-promote-text>Entering an exact length switches this drawing to DRAFTING.</p>
    <div class="promote-row">
      <button type="button" data-promote-go>Continue</button>
      <button type="button" data-promote-stay>Stay in TOY</button>
    </div>
  </div>
</div>

<!-- §4's CHOICE. Movie: "they will be allowed to 'BREAK the bone' every foot
     if they want to by clicking on it". A click on a bone offers both ways on,
     because the order names both -- and MOVE THIS WALL is not decoration even
     though the drag already moves it: a drafter who clicked to look must be
     able to leave without changing anything, and a choice with one button is
     an announcement. -->
<div id="bone-choice" data-bone-choice hidden>
  <div class="promote-card">
    <p data-bone-text>Break the bone here, or move this wall?</p>
    <div class="promote-row">
      <button type="button" data-break-here>Break here</button>
      <button type="button" data-break-move>Move this wall</button>
    </div>
  </div>
</div>

<!-- THE BONE'S SECOND PRESS. Movie, 19 Sep: "when the bone is pressed we
     should go to the DRIVE THRU menu always on the first press, and then on
     the 2nd press ask them REQUEST TO CHANGE HOUSE PROPERTIES or BUILD
     CURRENT HOUSE PROPERTIES (and should show what type of house they are
     currently going to build", and, ruling on the collision with his own
     18 Sep instruction: "go with the 19 sep rule, on 1st press go to
     drivethru questions and on 2nd always offer choice between drivetrhu or
     house build".

     CONSTRUCTION DETAILS, NOT PROPERTIES, in the words on the buttons. Movie
     corrected his own vocabulary the same day -- "properties is associated
     with the OBJECTS" -- and DEFINITIONS.md carries the ruling. What this
     press changes is WHICH HOUSE, so neither word is right for it and the
     buttons say what they do instead.

     NOT #bone-choice, which is the TOY board's break-or-move question about
     a different bone. -->
<div id="build-choice" data-build-choice hidden>
  <div class="promote-card">
    <p>Ready to build <span data-build-choice-house></span>.</p>
    <div class="promote-row">
      <button type="button" data-build-choice-change>Change it</button>
      <button type="button" data-build-choice-build>Build it</button>
    </div>
  </div>
</div>

<!-- THE UNSAVED GUARD (§1). NEW and OPEN both throw away what is on screen,
     so both ask first -- and SAVE FIRST really saves: it goes through the same
     press SAVE does, lease and revision included, and if that write is refused
     the drawing is NOT discarded. A guard that offered to save and then
     carried on regardless would be worse than no guard, because the drafter
     read the word SAVE and believed it. -->
<script>window.DraftShellBars.fileGuard();</script>

<!-- SAVE AS. The generated name is already in the box and already selected,
     so the drafter types over it or presses SAVE and takes it. §1: the name is
     a local timestamp to the MINUTE -- 20260913T2201.draft -- because two
     saves in one minute are the same drafting minute and a seconds field
     invites a file per keystroke. -->
<script>window.DraftShellBars.saveAs();</script>

<!-- ORDER IS LOAD-BEARING, not tidiness. cut-view.js destructures
     window.DraftWallTypes and window.DraftFormatters at MODULE SCOPE
     (cut-view.js:28-29), so it throws while loading if either comes after
     it -- and a page that throws in the head paints nothing at all. The
     tier-1 spec pins this exact list, in this exact order, for that reason.
     Everything else here is a lazy accessor and would not care. -->
<script src="./palette.js"></script>
<script src="./layer-views.js"></script>
<script src="./geometry-2d.js"></script>
<script src="./shared-file-store.js"></script>
<script src="./wall-types.js"></script>
<script src="./formatters.js"></script>
<script src="./cut-view.js"></script>
<script src="./drawing-format.js"></script>
<script src="./render-2d.js"></script>
<!-- Fixtures. fixture-geometry.js after wall-types.js (it reads the assembly
     width lazily, so this is convention rather than a hard order) and
     closets.js for the four closet dimensions and the door table the painter
     asks for. Neither is a painter: they are the ANSWERS drawFixture2D wants
     from its caller, which lived in MODEL.dc.html until now and are the whole
     reason this page drew no fixtures. -->
<script src="./fixture-geometry.js"></script>
<script src="./closets.js"></script>
<!-- The fixture catalogue, AFTER closets.js because the closet's depth is
     two of its numbers. Lifted out of MODEL.dc.html so this page can name
     the same cabinet: it DREW fixtures long before it could place one, and
     a kitchen is seven of them. See ORDER-tiers-of-assembly.md. -->
<script src="./fixture-kinds.js"></script>
<!-- Cut marks. cut-marks.js is the geometry; profile-manager.js is here for
     ONE reason and it is worth naming, because it is the first non-drawing
     dependency this page has taken: two of the four inputs a cut needs are not
     in the saved drawing. `structureStandards` -- is the auto-elevation ring
     on, and which bubble style -- is the drafter's OFFICE STANDARD, held in
     localStorage by profile-manager and read with getActive('standards'). The
     alternative was office defaults, which would have shown four elevation
     marks to a drafter who had switched them off. -->
<script src="./cut-marks.js"></script>
<script src="./outline-master.js"></script>
<!-- The house types the build bar offers. Lifted out of MODEL.dc.html so both
     pages read one list (build-menu.js says why). -->
<script src="./build-menu.js"></script>
<!-- What the project already holds, against Movie's cap of one house and one
     detached garage. The bone reads it to know whether there is anything
     left to offer. -->
<script src="./building-bodies.js"></script>
<!-- BUILD HOUSE's derivations, pure: an outline in, wall runs and the
     interior reference side out. The old page builds from the same module, so
     a house raised here and a house raised there cannot disagree about which
     side of the traced line the wall body sits on. -->
<script src="./build-house.js"></script>
<!-- AUTO DIMS: the exterior dimension strings. Extracted pure out of the old
     page -- plain data in, segments out, no THREE and no DOM -- and this page
     is its second caller. The computation is not ported anywhere: both pages
     call the same function with the same arguments, and the two tuning
     numbers live in it rather than in either page. -->
<script src="./auto-dims.js"></script>
<!-- The designs the drive-thru hands over. Movie, 18 Sep: "i'd just like to
     offer them premade designs in there at the beginning". A DESIGN, not a
     generator -- starter-shape.js invents a house, this one is the building
     in the picture the drafter pressed. -->
<script src="./bone-wallet.js"></script>
<script src="./premade-plans.js"></script>

<script>
(() => {
  // ── skin ──────────────────────────────────────────────────────────────────
  // Four dashboards: RUFF DRAFTER and ROUGH DRAFTER, each night and day
  // (RD-DOCUMENTS/SPEC-skins.md). The skins themselves get designed later;
  // what exists now is the seam they arrive through.
  //
  // ?theme= and ?mode= are the seam, deliberately: a URL is the cheapest way
  // for a designer to see a skin, and for a spec to assert one, before any
  // settings UI exists. When the profile package carries the choice, this
  // reads that first and the query string stays as an override.
  //
  // `skin` is captured ONCE at module scope, which is a load-order hazard this
  // repo has been bitten by 13 times across 8 files -- so palette.js is loaded
  // above and this throws here, naming itself, rather than painting undefined
  // three functions away.
  // resolve() throws on an unknown name, which is right for a painter asking
  // for a role that does not exist. It is WRONG here: a typo in a URL someone
  // pasted should not blank the page. So the query string is validated against
  // the palette's own lists and falls back, loudly, to the default skin.
  const params = new URLSearchParams(location.search);
  const pick = (name, allowed, fallback) => {
    const asked = params.get(name);
    if (!asked || allowed.includes(asked)) return asked || fallback;
    console.warn(`MODEL: unknown ${name} "${asked}"; using ${fallback}. `
      + `Known: ${allowed.join(', ')}`);
    return fallback;
  };
  // THE CHOICE OUTLIVES THE TAB, and the query string still wins. A drafter
  // who picks DAY on the strip gets DAY tomorrow morning; a ?mode= in a URL
  // someone pasted is a deliberate override for that visit and does not
  // overwrite what the drafter chose. Stored under one key rather than in the
  // profile package: the package is office standards, and a skin is not one.
  const SKIN_KEY = 'draft-skin';
  const stored = (() => {
    try { return JSON.parse(localStorage.getItem(SKIN_KEY) || 'null') || {}; }
    catch { return {}; }
  })();
  const storedOr = (name, allowed, fallback) =>
    (allowed.includes(stored[name]) ? stored[name] : fallback);
  // `let`, and this is the whole seam the switcher hangs on. Every painter
  // reads `skin['role']` INSIDE its own function (30 sites, checked), so
  // re-resolving here and repainting changes the drawing's colours without a
  // reload -- and a reload is what a switcher must avoid, because this page
  // holds unsaved edits.
  let theme = pick('theme', window.DraftPalette.THEMES,
    storedOr('theme', window.DraftPalette.THEMES, 'ruff'));
  let mode = pick('mode', window.DraftPalette.MODES,
    storedOr('mode', window.DraftPalette.MODES, 'night'));
  let skin = window.DraftPalette.apply(document, theme, mode);
  'use strict';

  const BUCKET = 'model-drawing';
  const canvas = document.getElementById('plan');
  // NOT const, and this is the one binding that decides whether a seat can
  // show a plan. Every painter on this page draws into `ctx` and projects
