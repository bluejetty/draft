  // however far in the drafter is -- and it is passed in rather than baked
  // into geometry-2d.js, because the old page uses eight different distances
  // (30, 24, 18, 14, 12, 4 px) for different targets and a number frozen in
  // the shared function would be wrong for seven of them.
  const wallAt = worldPt => {
    const G = window.DraftGeometry2D;
    const thresh = SELECT_GRAB_PX / view.scale;
    let best = null, bestD = thresh;
    walls().forEach(wall => {
      if (!wall.start || !wall.end) return;
      const { d } = G.pointToSegment(worldPt, wall);
      if (d < bestD) { bestD = d; best = wall; }
    });
    return best;
  };

  const paintSelection = () => {
    if (!selectedSeg) return;
    // Only if it is still on screen's level: a selection kept across a level
    // change would paint a highlight over nothing.
    if (!walls().includes(selectedSeg)) return;
    const a = toS(selectedSeg.start), b = toS(selectedSeg.end);
    ctx.save();
    ctx.strokeStyle = SELECT_INK;
    ctx.lineWidth = 7;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
    // Square handles at each end -- the same 8px squares the old page draws,
    // and the grab targets the corner drag will use next.
    ctx.fillStyle = SELECT_HANDLE;
    [a, b].forEach(pt => ctx.fillRect(pt.x - 4, pt.y - 4, 8, 8));
    ctx.restore();
  };

  // ── move a corner ─────────────────────────────────────────────────────────
  // THE DRAG MOVES THE POOLED VERTEX OBJECT, not a copy of its numbers. That
  // is the whole mechanism: load rebuilt reference equality at shared corners
  // (the pool, above), so one wall's endpoint IS its neighbour's, and writing
  // x/z once carries every wall in every view that meets there. Nothing
  // iterates "the other walls", because there is no such list to get wrong.
  //
  // The three distances are the old page's, measured rather than chosen:
  //   grab  _findVertexHit, MODEL.dc.html:16589 — _magnetRadius() * 1.5,
  //         and _magnetRadius() is snapZone * 5 (MODEL.dc.html:16532)
  //   snap  _nodeSnapRadius, MODEL.dc.html:16536 — snapZone flat
  //   arm   the node drag turns live past 4px of travel, MODEL.dc.html:10825
  // snapZone is a setting this page has no UI for, so it reads the shipped
  // default instead of inventing a number: 30px to grab, 4px to snap.
  const SNAP_ZONE_PX = window.DraftSnapZone.DEFAULT_SNAP_ZONE;
  const CORNER_GRAB_PX = SNAP_ZONE_PX * 5 * 1.5;
  const CORNER_SNAP_PX = SNAP_ZONE_PX;
  const DRAG_ARM_PX = 4;

  // A BUILD HOUSE wall corner rides a BONEYARD master point: srcId names the
  // master, offX/offZ hold the corner's offset from it. THE OLD PAGE KEEPS THE
  // LINK THROUGH A DRAG and re-measures the offset — _relinkVertex,
  // MODEL.dc.html:11641, called on every moved ref at MODEL.dc.html:10855. It
  // never drops srcId. This page matches that, because a dropped link is a
  // wall that quietly stops following its bone and nothing says so.
  //
  // The masters are reachable here: `drawing` is the parsed save spread whole,
  // so drawing.boneyardOutlines arrives untouched. It arrives RAW, which is
  // the trap — storage names a master point's id `id` (drawing-format.js:698)
  // and only MODEL.dc.html's loader renames it `pointId` in memory
  // (MODEL.dc.html:5828). Reading `pointId` here would resolve nothing,
  // silently, on every corner in the drawing.
  const masterPointById = srcId => {
    for (const master of (drawing?.boneyardOutlines || [])) {
      const src = (master?.points || []).find(p => p && String(p.id) === String(srcId));
      if (src) return src;
    }
    return null;
  };

  const relinkVertex = vtx => {
    if (!vtx?.srcId) return;
    const src = masterPointById(vtx.srcId);
    if (src) { vtx.offX = vtx.x - src.x; vtx.offZ = vtx.z - src.z; }
  };

  // Only the SELECTED wall's own two corners are grabbable. Selection first,
  // then drag: without that rule every pan begun near any corner anywhere in
  // the drawing would move it instead of sliding the sheet.
  const cornerAt = worldPt => {
    if (!selectedSeg || !walls().includes(selectedSeg)) return null;
    const G = window.DraftGeometry2D;
    const ends = [selectedSeg.start, selectedSeg.end].filter(Boolean);
    return G.nearestVertex(ends, worldPt, CORNER_GRAB_PX / view.scale);
  };

  // Corners on screen that a moving vertex may snap to. Excluded by reference
  // AND by coincident position, matching _withoutVertices (MODEL.dc.html:16543):
  // the pool keys corners by (level, view, body), so a garage corner and a
  // house corner can share a spot as two separate objects, and offering one as
  // a snap target for the other would be a snap that moved nothing.
  const snapCandidates = moving => {
    const out = [];
    walls().forEach(wall => {
      [wall.start, wall.end].forEach(v => {
        if (!v || moving.includes(v)) return;
        if (moving.some(m => Math.abs(v.x - m.x) < 0.001 && Math.abs(v.z - m.z) < 0.001)) return;
        out.push(v);
      });
    });
    return out;
  };

  const cornerSnap = (worldPt, moving) =>
    window.DraftGeometry2D.nearestVertex(
      snapCandidates([moving]), worldPt, CORNER_SNAP_PX / view.scale);

  // ── move a whole wall ─────────────────────────────────────────────────────
  // BOTH ENDS BY THE SAME DELTA. Their corners are pooled, so the neighbouring
  // walls that meet them travel too and the outline deforms around the moved
  // wall — the ruling, and the conservative one: a wall that detached from its
  // corners instead would be silently unhooked from the pool, the same failure
  // shape as a dropped srcId and just as invisible until much later. A true
  // detach, if it is ever wanted, is a deliberate gesture with its own name.
  //
  // THE OLD PAGE HAS NO SUCH GESTURE — its SELECT drag grabs a vertex
  // (_findVertexHit, MODEL.dc.html:10512) and a press on a wall body away from
  // a corner moves nothing. So this is the first behaviour on this page with
  // nothing to copy, and the one thing that IS copied is the precedence: the
  // old page tests for a vertex before it tests for a line
  // (MODEL.dc.html:16791 then :16799), and so does pointerdown below.
  //
  // A CONSEQUENCE OF THAT ORDER, stated rather than discovered later: the
  // corner zone is 30px and the body zone is 12, so on a wall shorter than
  // about 60px on screen the two corner zones meet and there is no body left
  // to grab. Zoom in and it appears. That is the old page's own precedence
  // producing it, not a rule added here.
  const wallBodyAt = worldPt => {
    if (!selectedSeg || !walls().includes(selectedSeg)) return null;
    if (!selectedSeg.start || !selectedSeg.end) return null;
    const { d } = window.DraftGeometry2D.pointToSegment(worldPt, selectedSeg);
    return d < SELECT_GRAB_PX / view.scale ? selectedSeg : null;
  };

  // The two vertex objects a wall drag moves. NOT deduped, and it took a
  // mutation to settle that. A wall whose ends were one pooled corner would
  // travel twice the cursor's distance, so a dedupe looks obviously necessary
  // — but nothing can reach it: segmentCore drops any wall shorter than 1e-6
  // before it arrives (drawing-format.js), the pool merges corners closer than
  // 0.001, and everything in between is sub-pixel, with its two corners on top
  // of each other. Every press on such a wall is inside the 30px corner zone,
  // so the body grab below never runs on one. The dedupe that was here could
  // not be made to fail, which is the same thing as not being a guard.
  const movingEnds = wall => [wall.start, wall.end];

  // A wall drag snaps by its ENDS, not its body: offer each moving end the
  // corner nearest to where the raw delta would put it, take the closer of the
  // two, and shift the whole delta so that end lands exactly. The wall still
  // moves rigidly — the correction applies to both ends — which is the corner
  // drag's snap generalised rather than a second rule.
  const wallSnapDelta = (before, dx, dz) => {
    const G = window.DraftGeometry2D;
    const moving = before.map(b => b.vtx);
    const candidates = snapCandidates(moving);
    const r = CORNER_SNAP_PX / view.scale;
    let best = null, bestD = Infinity;
    before.forEach(b => {
      const at = { x: b.x + dx, z: b.z + dz };
      const hit = G.nearestVertex(candidates, at, r);
      if (!hit) return;
      const d = Math.hypot(hit.x - at.x, hit.z - at.z);
      if (d < bestD) { bestD = d; best = { dx: hit.x - b.x, dz: hit.z - b.z }; }
    });
    return best;
  };

  // ONE ENTRY PER GESTURE, and an entry KNOWS WHAT IT UNDOES.
  //
  // TIER 3c GENERALISED THIS, and it had to. Until 3c an entry was a bare list
  // of vertices with the numbers they started with, and undo wrote those
  // numbers back — which can only restore the POSITION of an object that still
  // exists. A created wall has no position to go back to and a deleted one has
  // no vertex left to write on, so create and delete were unrepresentable, not
  // merely unimplemented.
  //
  // Three kinds now, and the old one is unchanged in behaviour:
  //   { kind: 'move',   before }              the corner / wall drag, as before
  //   { kind: 'add',    wall }                undo removes it again
  //   { kind: 'remove', wall, index, deps }   undo puts it and its dependents back
  //
  // The pool is still what keeps 'move' small — restoring those objects'
  // numbers puts back every wall that travelled with them. 'add' and 'remove'
  // carry the wall RECORD, whose endpoints are the pooled objects themselves,
  // so a re-added wall rejoins its corners by identity rather than by
  // coordinate — which is the same reason the loader pools at all.
  const undoStack = [];

  // ── TIER 3c: drawing a wall, and deleting one ─────────────────────────────
  // THE FIRST RUNG THAT CREATES AND DESTROYS. Everything before it moved
  // geometry that already existed; the whole write surface was a move-drag
  // commit and an undo. So the rule here is not "make it work" but "make it
  // indistinguishable from the old page's own writer", because the file has to
  // keep opening there.
  //
  // MODEL.dc.html:14609 `_commitWall` is the single authority — the two chain
  // committers (:11297, :21833) both funnel through it — and every field below
  // is derived the way that function derives it. DERIVER on the left of the
  // arrow, STORER on the right:
  //
  //   id          _newDrawingItemId('wall')  ->  `wall-${n}`, counter persisted
  //                                              as nextDrawingItemId (:3559)
  //   start/end   _mergeVertex(pt, levelId, homeView)  ->  the POOLED object
  //   levelId     the active level's ID, never its index
  //   view        _wallHomeView  ->  'foundation' on that set, else 'plan'
  //   wallType    _contextWallType()  ->  validated against WALL_TYPES
  //   baseHeight  state.wallBaseHeight  ->  number, 0
  //   topHeight   state.wallTopHeight   ->  number, 8
  //   refLine     state.wallRefLine     ->  'centre' folds to 'center'; 'left'
  //   body/auto   NOT SET by _commitWall — conditional keys, never invented
  //
  // `auto: true` in particular would tell the old page's delete path this is
  // generated geometry (:22218). A hand-drawn wall must not carry it.

  // THE THREE WALL SETTINGS ARE PERSISTED, so they are read off the drawing
  // rather than hardcoded here: MODEL.dc.html:3517-3519 writes wallRefLine,
  // wallBaseHeight and wallTopHeight into every save. Reading them back is how
  // a wall drawn on this page inherits the same settings the drafter last used
  // on the old one, instead of this page having a private opinion. The
  // fallbacks are the old page's own initial values (:2911-2913).
  const wallSetting = (key, fallback) =>
    (drawing && drawing[key] !== undefined && drawing[key] !== null) ? drawing[key] : fallback;

  // MODEL.dc.html:9010 `_contextWallTypes` and :9016 `_contextWallType`,
  // ported rather than re-decided. THE TWO LISTS ARE DISJOINT — foundation
  // assemblies on one side, stud/insul on the other — so picking the wrong
  // default is not a near miss, it is a wall of the wrong kind, silently.
  // (No BONEYARD on this page, so that arm of the original is not ported; a
  // level with no layer views returns every type, as viewId == null does there.)
  const contextWallTypes = viewId => {
    const WT = window.DraftWallTypes;
    if (viewId == null) return WT.WALL_TYPES;
    const isFdn = id => WT.FOUNDATION_WALL_TYPE_IDS.includes(id);
    return viewId === 'foundation'
      ? WT.WALL_TYPES.filter(t => isFdn(t.id))
      : WT.WALL_TYPES.filter(t => !isFdn(t.id));
  };
  const contextWallType = viewId => {
    const choices = contextWallTypes(viewId);
    const active = wallSetting('activeWallType', null);
    if (choices.some(t => t.id === active)) return active;
    const want = viewId === 'foundation' ? 'concrete_8' : 'stud_2x6';
    return (choices.find(t => t.id === want) || choices[0]).id;
  };

  // MODEL.dc.html:14614 `_wallHomeView`. A wall drawn on any set other than
  // FOUNDATION lives in PLAN — pooling it under the ACTIVE view instead would
  // let a foundation wall and a plan wall at the same coordinates share a
  // corner they do not share on the old page.
  const wallHomeView = viewId => (viewId === 'foundation' ? 'foundation' : 'plan');

  // MODEL.dc.html:3224 `_newDrawingItemId`, and :5982 is why the counter must
  // be BUMPED rather than left to heal itself. The old page's load takes
  // Math.max(saved, highestSuffix + 1, 1) — a maximum, never a lowering. Draw
  // wall-7, delete it, save without bumping: nothing survives carrying 7, the
  // max does not rise, and the NEXT wall drawn anywhere is wall-7 again. The
  // cascade below stops a door reattaching that way, but groups and level
  // locks reference members by id too and this page passes both through
  // untouched — so a stale group would adopt a brand-new wall nobody put in it.
  const newDrawingItemId = kind => {
    const next = Number.isInteger(drawing.nextDrawingItemId) ? drawing.nextDrawingItemId : 1;
    drawing.nextDrawingItemId = next + 1;
    return `${kind}-${next}`;
  };

  // The pool key is THREE VALUES plus coordinates — (levelId, viewId, body) —
  // and mergeVertex is the same shared function the loader pools with, so a
  // new endpoint landing on an existing corner returns THAT OBJECT. Anything
  // else and mitring silently reverts to butt joints: no error, capped ends.
  const poolVertex = (pt, levelId, viewId) =>
    window.DraftGeometry2D.mergeVertex(vertexPool, pt, levelId, viewId, 'house');

  // A corner is retired only when NOTHING still holds it. Identity, not
  // coordinates: two corners at the same place are still two corners if the
  // pool never merged them.
  // Returns WHAT IT RETIRED, because undo has to put exactly those back — see
  // the 'remove' branch. A retire that reports nothing forces undo to guess.
  const retirePoolCorners = corners => {
    const retired = [];
    corners.forEach(corner => {
      const held = drawing.walls.some(w => w.start === corner || w.end === corner);
      if (held) return;
      const at = vertexPool.indexOf(corner);
      if (at >= 0) { vertexPool.splice(at, 1); retired.push(corner); }
    });
    return retired;
  };

  const commitWall = (startPt, endPt) => {
    const { levelId, viewId } = onActiveLevel();
    const homeView = wallHomeView(viewId);
    const wall = {
      id: newDrawingItemId('wall'),
      start: poolVertex(startPt, levelId, homeView),
      end: poolVertex(endPt, levelId, homeView),
      levelId,
      view: homeView,
      wallType: contextWallType(viewId),
      baseHeight: wallSetting('wallBaseHeight', 0),
      topHeight: wallSetting('wallTopHeight', 8),
      // 'center', not 'centre'. drawing-format.js:400 folds the British
      // spelling on LOAD, but this page has no serializer — a record written
      // with 'centre' reaches the file unvalidated and only the next load
      // repairs it, moving the wall half an assembly thickness in between.
      refLine: (raw => (raw === 'centre' ? 'center' : raw))(wallSetting('wallRefLine', 'left')),
    };
    drawing.walls.push(wall);
    undoStack.push({ kind: 'add', wall });
    markDirty();
    return wall;
  };

  // DELETE CASCADES, IT DOES NOT REFUSE — MODEL.dc.html:22225-22251 does, and
  // the round-trip proof is about the two pages agreeing on what delete MEANS.
  // A refusal here would also need a message surface this page does not have
  // for a drafter with no keyboard.
  //
  // Three referent classes, all riding through on the ...parsed spread and
  // none of them validated on load — format.fenestrations and format.fixtures
  // check levelId, type, width and offset and NEVER that the host wall exists
  // (drawing-format.js:184-200, :229-245). So an orphan is invisible and
  // persistent: it survives every save, paints nowhere, and returns the moment
  // something is given its host's id.
  const deleteWall = wall => {
    const index = drawing.walls.indexOf(wall);
    if (index < 0) return null;
    drawing.walls.splice(index, 1);
    const gone = wall.id;
    const deps = [];
    const cut = (list, doomed) => {
      if (!Array.isArray(list)) return;
      for (let i = list.length - 1; i >= 0; i--) {
        if (!doomed(list[i])) continue;
        deps.push({ list, index: i, item: list[i] });
        list.splice(i, 1);
      }
    };
    // A door or window whose host is gone.
    cut(drawing.fenestrations, f => f && f.wallId === gone);
    // A fixture by either anchor: the tub needs its faucet-END wall too.
    cut(drawing.fixtures, f => f && (f.wallId === gone || f.endWallId === gone));
    // AND GROUPS, which neither the order nor the review named. The old page
    // runs _cleanupGroups() beside the cascade; groups reference members by
    // {type, id}, so a group left holding a dead wall id adopts the next wall
    // to be given it. Members go; a group emptied to fewer than two members
    // is not a group, so it goes too.
    if (Array.isArray(drawing.groups)) {
      drawing.groups.forEach(group => {
        cut(group && group.members, m => m && m.type === 'wall' && String(m.id) === gone);
      });
      cut(drawing.groups, g => g && Array.isArray(g.members) && g.members.length < 2);
    }
    // deps were collected newest-first per list; undo re-inserts in reverse so
    // each splice lands at the index it was taken from.
    deps.reverse();
    const retired = retirePoolCorners([wall.start, wall.end]);
    if (selectedSeg === wall) selectedSeg = null;
    undoStack.push({ kind: 'remove', wall, index, deps, retired });
    markDirty();
    return wall;
  };

  // ── the draw gesture ──────────────────────────────────────────────────────
  // TWO PRESSES, one wall. The first sets a start and the second commits, so
  // the gesture works with a finger, a pen or a mouse without a drag — the old
  // page's wall tool is press-press too (its chain committer is the same shape
  // repeated).
  //
  // ARMED IS A MODE, and it is visible: the button carries the accent while
  // the next tap will draw. A mode nobody can see is how a drafter loses a
  // pan and gets a wall.
  const drawButton = document.getElementById('draw-wall');
  const deleteButton = document.getElementById('delete-wall');
  let drawArmed = false;
  let drawStart = null;

  const setArmed = on => {
    drawArmed = on;
    drawStart = null;
    drawButton.classList.toggle('armed', on);
    canvas.style.cursor = on ? 'crosshair' : '';
  };

  // A drawn endpoint snaps to an existing corner exactly as a dragged one
  // does, and for the same reason: landing ON a corner is what makes the join
  // mitre. Nothing is moving during a draw, so nothing is excluded.
  const drawPoint = at => cornerSnap(at, []) || { x: at.x, y: 0, z: at.z };

  const drawPress = at => {
    if (!drawStart) { drawStart = drawPoint(at); paint(); return; }
    const end = drawPoint(at);
    // A wall of no length is not a wall — the format drops anything under
    // 1e-6 on load, so committing one would write a record that vanishes on
    // the next open. Treat the second tap as a correction, not a commit.
    if (Math.hypot(end.x - drawStart.x, end.z - drawStart.z) < 0.001) { drawStart = end; paint(); return; }
    const wall = commitWall(drawStart, end);
    // CHAINING, the old page's habit: the next wall starts where this one
    // ended, so a room is four taps and not eight. The pooled END object is
    // the start, so the corner is shared by identity.
    drawStart = wall.end;
    selectedSeg = wall;
    paint();
  };

  drawButton.addEventListener('click', () => setArmed(!drawArmed));
  deleteButton.addEventListener('click', () => {
    if (!selectedSeg) return;
    deleteWall(selectedSeg);
    paint();
  });

  // ── pan and zoom ──────────────────────────────────────────────────────────
  let dragging = null;
  // One drag for both gestures: `kind` says whether the press took a corner or
  // the wall's body, and `before` is the list of pooled vertices it will move
  // with the numbers they started with.
  let moveDrag = null;
  canvas.addEventListener('pointerdown', e => {
    const rect = canvas.getBoundingClientRect();
    const at = toWorld(e.clientX - rect.left, e.clientY - rect.top);
    // ARMED TAKES THE PRESS WHOLE, before the corner/body hit test and before
    // panning. Otherwise the first tap of a wall that starts on an existing
    // corner would be read as grabbing that corner, and the drafter would drag
    // the building instead of drawing against it.
    if (drawArmed) { drawPress(at); return; }
    // VERTEX BEFORE BODY — the old page's own precedence (_findVertexHit at
    // MODEL.dc.html:16791, then _findLineHit at :16799). A press near a corner
    // is a corner press even though it is also on the wall.
    const corner = cornerAt(at);
    const body = corner ? null : wallBodyAt(at);
    if (corner || body) {
      // A grabbed corner or wall takes the gesture whole: no pan starts, so
      // the sheet cannot slide out from under geometry being placed.
      const ends = corner ? [corner] : movingEnds(body);
      moveDrag = {
        kind: corner ? 'corner' : 'wall',
        grab: at,
        before: ends.map(v => ({ vtx: v, x: v.x, z: v.z, offX: v.offX, offZ: v.offZ })),
        sx: e.clientX, sy: e.clientY, active: false,
      };
      canvas.setPointerCapture(e.pointerId);
      return;
    }
    canvas.classList.remove('over-corner', 'over-wall');
    dragging = { sx: e.clientX, sy: e.clientY, cx: view.cx, cz: view.cz, moved: 0 };
    canvas.classList.add('dragging');
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e => {
    if (moveDrag) {
      const md = moveDrag;
      if (!md.active && Math.hypot(e.clientX - md.sx, e.clientY - md.sy) > DRAG_ARM_PX) md.active = true;
      if (md.active) {
        const rect = canvas.getBoundingClientRect();
        const raw = toWorld(e.clientX - rect.left, e.clientY - rect.top);
        if (md.kind === 'corner') {
          // The corner goes TO the cursor, not by the cursor's delta — the old
          // page's node drag writes the point through (MODEL.dc.html:10848),
          // so a corner grabbed off-centre still lands under the pointer.
          const pt = cornerSnap(raw, md.before[0].vtx) || raw;
          md.before[0].vtx.x = pt.x;
          md.before[0].vtx.z = pt.z;
        } else {
          // A WALL MOVES BY THE DELTA, and the delta is measured from where
          // the press landed to where the cursor is now — never accumulated
          // move to move. Absolute is what makes "both ends travelled the same
          // distance" exactly true, rather than true to within the float drift
          // of a hundred pointermove events.
          let dx = raw.x - md.grab.x, dz = raw.z - md.grab.z;
          const snapped = wallSnapDelta(md.before, dx, dz);
          if (snapped) { dx = snapped.dx; dz = snapped.dz; }
          md.before.forEach(b => { b.vtx.x = b.x + dx; b.vtx.z = b.z + dz; });
        }
        // Live, on every move, exactly where the old page relinks — not once
        // on release. The two agree at the end of a completed drag; they part
        // company on a drag the browser cancels mid-gesture, and matching the
        // old page is the point.
        md.before.forEach(b => relinkVertex(b.vtx));
        paint();
      }
      return;
    }
    if (!dragging) {
      // HOVER HINT. The handles are 8px squares and the grab zone is 30, so
      // without this there is nothing on screen telling a drafter where the
      // corner tool starts and the pan ends — and now the same for the body of
      // a selected wall, whose grab zone has no marks on it at all.
      const rect = canvas.getBoundingClientRect();
      const at = toWorld(e.clientX - rect.left, e.clientY - rect.top);
      const corner = cornerAt(at);
      canvas.classList.toggle('over-corner', !!corner);
      canvas.classList.toggle('over-wall', !corner && !!wallBodyAt(at));
      return;
    }
    dragging.moved = Math.max(dragging.moved,
      Math.hypot(e.clientX - dragging.sx, e.clientY - dragging.sy));
    view.cx = dragging.cx - (e.clientX - dragging.sx) / view.scale;
    view.cz = dragging.cz - (e.clientY - dragging.sy) / view.scale;
    paint();
  });
  const endDrag = e => {
    if (moveDrag) {
      const md = moveDrag;
      // A grab that never armed moved nothing, so there is nothing to undo —
      // and a snapshot pushed for it would make one Ctrl+Z do nothing visible.
      if (md.active) {
        undoStack.push({ kind: 'move', before: md.before });
        markDirty();
      }
      moveDrag = null;
      if (e && canvas.hasPointerCapture?.(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
      return;
    }
    if (!dragging) return;
    // A CLICK SELECTS, A DRAG PANS, and the difference is 4px of travel. Every
    // pointerdown starts a pan here -- it has since tier 1 -- so selection
    // cannot take pointerdown without taking panning with it. Deciding on
    // RELEASE, by how far the pointer actually went, leaves the pan untouched:
    // a drafter who moved the sheet gets no selection, and one who tapped a
    // wall gets no pan they can see.
    if (dragging.moved <= 4 && e) {
      const rect = canvas.getBoundingClientRect();
      const hit = wallAt(toWorld(e.clientX - rect.left, e.clientY - rect.top));
      // An empty click clears, which is the other half of select: without it
      // the drafter has no way to put a selection down.
      selectedSeg = hit || null;
      paint();
    }
    dragging = null;
    canvas.classList.remove('dragging');
    if (e && canvas.hasPointerCapture?.(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
  };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    // Zoom about the cursor: the world point under it must not move.
    const before = toWorld(sx, sy);
    const factor = Math.exp(-e.deltaY * 0.0015);
    view.scale = Math.max(0.25, Math.min(view.scale * factor, 200));
    const after = toWorld(sx, sy);
    view.cx += before.x - after.x;
    view.cz += before.z - after.z;
    paint();
  }, { passive: false });

  window.addEventListener('keydown', e => {
    if (e.key === '0') { fit(); paint(); }
    // ESCAPE IS THE OLD PAGE'S ESCAPE, measured rather than invented.
    // MODEL.dc.html:22165-22172 does two things in ONE press: it cancels every
    // in-progress gesture (_cancelWall among a dozen siblings) AND clears the
    // selection. It does NOT put the tool down — activeTool survives, so the
    // drafter who was drawing walls is still drawing walls.
    //
    // A ladder was tried here first — pending start, then the mode, then the
    // selection, one press each — and it is wrong twice over: it takes two
    // presses to reach the selection, and it disarms a tool the old page
    // keeps. A drafter who learns Escape on one page would lose their tool on
    // the other. The DRAW button is how this page puts the tool down, because
    // it is the affordance a drafter with no keyboard can reach.
    if (e.key === 'Escape') {
      drawStart = null;
      selectedSeg = null;
      paint();
      return;
    }
    // 3c TAKES THE WALL CASE ONLY. The old page's `delete` answers for walls,
    // floors, roofs, fenestrations, surface openings, dimensions, fixtures and
    // outline nodes at once (MODEL.dc.html:22209), behind a "this corner
    // carries built geometry" refusal (:22196). This page can select a wall
    // and nothing else, so the key does the one thing it can do and is silent
    // on the rest — said out loud here because the drafter presses the same
    // key for all of them and a silent no-op reads as a broken page.
    if ((e.key === 'Delete' || e.key === 'Backspace') && selectedSeg) {
      e.preventDefault();
      deleteWall(selectedSeg);
      paint();
      return;
    }
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z') {
      const step = undoStack.pop();
      if (!step) return;
      e.preventDefault();
      // ONE PRESS IS ONE UNDO whether the press moved one corner or a wall's
      // two, drew a wall, or deleted one: the entry is whatever that gesture
      // captured, so a wall goes back in one keystroke rather than two.
      if (step.kind === 'move') {
        step.before.forEach(b => {
          b.vtx.x = b.x;
          b.vtx.z = b.z;
          // The offsets go BACK to what they were, not to a re-measure. Undo that
          // recomputed them would leave the corner at its old position carrying a
          // new offset — a different drawing from the one before the drag, and one
          // whose difference nothing on screen would show.
          if (b.offX !== undefined) { b.vtx.offX = b.offX; b.vtx.offZ = b.offZ; }
        });
      } else if (step.kind === 'add') {
        const at = drawing.walls.indexOf(step.wall);
        if (at >= 0) drawing.walls.splice(at, 1);
        if (selectedSeg === step.wall) selectedSeg = null;
        // AND RETIRE THE CORNERS IT INTRODUCED, or the pool keeps a phantom
        // the next drawn wall snaps to — a corner belonging to a wall that no
        // longer exists, invisible and magnetic.
        retirePoolCorners([step.wall.start, step.wall.end]);
      } else if (step.kind === 'remove') {
        drawing.walls.splice(Math.min(step.index, drawing.walls.length), 0, step.wall);
        // The dependents come back BY VALUE into the same raw arrays the
        // cascade took them out of. They were never normalised on the way in
        // (this page rides them through on the ...parsed spread), so putting
        // the same objects back is the only restoration that is exact.
        step.deps.forEach(d => { if (Array.isArray(d.list)) d.list.splice(Math.min(d.index, d.list.length), 0, d.item); });
        // AND THE CORNERS GO BACK IN THE POOL. The restored wall already holds
        // these objects — identity on the wall survives the round trip — but
        // the pool is what the NEXT drawn endpoint searches. Leave them out
        // and a wall drawn onto the restored free end mints a fresh object at
        // the same coordinates instead of joining: every number right, the
        // drawing right, and the mitre silently gone. That is the same class
        // as the pooling mutation this rung's specs already caught, arriving
        // through undo instead of through create.
        (step.retired || []).forEach(corner => {
          if (!vertexPool.includes(corner)) vertexPool.push(corner);
        });
      }
      // AN UNDO IS AN EDIT TOO. The drawing on screen no longer matches the
      // file — going back to where you started is only free if you never
      // saved the trip out.
      markDirty();
      paint();
    }
  });
  window.addEventListener('resize', resize);

  // ── boot ──────────────────────────────────────────────────────────────────
  // ── from a saved file to the drawing on this page ─────────────────────────
  // Parse, check the envelope, normalise the four collections this page owns
  // rules for, and rebuild reference equality at the shared corners. BOOT AND
  // THE CHANGE BROADCAST BOTH COME THROUGH HERE, so a page that adopts another
  // page's write builds exactly the drawing a reload would have built — one
  // definition of what reading a file means, not two that drift.
  //
  // Returns false when the file could not be adopted, having already told the
  // drafter why. The drawing on screen is left alone in that case: a page that
  // blanked itself because somebody else wrote something unreadable would turn
  // one damaged file into two lost drawings.
  const adoptFile = async file => {
    let parsed;
    try {
      parsed = JSON.parse(await file.text());
    } catch (err) {
      readout.textContent = 'unreadable';
      say('The saved drawing could not be parsed',
        `<p><code>${String(err && err.message || err)}</code></p>`);
      return false;
    }

    // The same envelope check MODEL.dc.html runs, from the same module, so this
    // page agrees with the old one about what a valid drawing is rather than
    // inventing a second opinion.
    const check = window.DraftDrawingFormat?.checkEnvelope(parsed)
      || { ok: true, reason: 'unchecked' };
    if (!check.ok) {
      readout.textContent = `envelope ${check.reason}`;
      say('That drawing is not one this page can read',
        `<p>checkEnvelope said <code>${check.reason}</code>.
            <code>version</code> means it was written by a newer MODEL than this page knows.</p>`);
      return false;
    }

    // VALIDATE THE THREE TYPES NOTHING VALIDATED. Every other item type on a
    // saved drawing goes through drawing-format.js on load; walls, lines and
    // floors were inflated inline in MODEL.dc.html, so this page read them raw
    // -- no view whitelist, no wallType check, no zero-length rejection. The
    // rules now live in the shared module (drawing-format.js) and this is the
    // first caller of them.
    //
    // Rejected items are DROPPED, exactly as the old page drops them, and the
    // readout says how many so a malformed drawing reads as a fact rather than
    // as a page that quietly lost geometry.
    const F = window.DraftDrawingFormat;
    const levelIds = new Set((parsed.levels || []).map(level => Number(level.id)));
    const WT = window.DraftWallTypes;
    const raw = {
      walls: parsed.walls, lines: parsed.lines,
      floors: parsed.floors, dimensions: parsed.dimensions,
    };
    drawing = {
      ...parsed,
      walls: F.walls(parsed.walls, levelIds, {
        wallTypes: WT.WALL_TYPES,
        legacyWallTypes: WT.LEGACY_WALL_TYPES,
        defaultWallTopFt: 8,
      }),
      // THE KNOWN LAYERS, or the normaliser flattens them. format.lines folds
      // any layer outside this set to 'draft' (or E-POWER); passing {} here
      // read fine — a flattened layer still paints — but the Write Tier
      // re-emits what it loaded, so a save through this page would have
      // quietly moved every A-DOOR and A-GLAZ line to draft. The set is
      // derived from the same table MODEL.dc.html derives its own from.
      lines: F.lines(parsed.lines, levelIds, {
        knownLayerIds: new Set(window.DraftLayerStandards.DEFAULT_LAYER_STANDARDS
          .flatMap(group => group.layers).map(layer => layer.id)),
      }),
      floors: F.floors(parsed.floors, levelIds, { defaultFloorThickness: 0.75 }),
      // Dimensions already had a rule; this page just never called it. Running
      // it is what lets the view filter above trust that every dimension in
      // the array carries a real view.
      dimensions: F.dimensions(parsed.dimensions, levelIds),
      // Normalised here rather than at the paint site so the null survives to
      // exactly one place that resolves it. `drawing` is built by spreading
      // `parsed`, so without this line the raw key would still be present and
      // the paint site would read it -- indistinguishable for a valid number,
      // wrong for a quoted one, since the format does not coerce.
      autoDimFirstOffsetFt: F.autoDimFirstOffsetFt(parsed.autoDimFirstOffsetFt),
    };
    dropped = ['walls', 'lines', 'floors', 'dimensions']
      .map(k => (Array.isArray(raw[k]) ? raw[k].length : 0) - drawing[k].length)
      .reduce((a, b) => a + b, 0);

    // REBUILD REFERENCE EQUALITY AT SHARED CORNERS. Everything above restores
    // VALUES: JSON has no way to say "these two walls end at the same point",
    // only "these two walls end at points that happen to be equal". So a
    // drawing read back off disk holds a separate object at every corner --
    // and geometryJoins() keys on OBJECT IDENTITY, so without this pass it
    // finds nothing and every corner stays a butt joint. Silently: no error,
    // no warning, just capped ends on a house that should be mitred.
    //
    // MODEL.dc.html does the same thing on its own load path and describes it
    // the same way: "restores reference equality at shared corners instead of
    // merely restoring values."
    //
    // The key is the pool's, not this page's: (levelId, viewId, body). The
    // view is folded to two values because a wall on the e-power or floor set
    // is the same physical wall as the one on plan and shares its corner. The
    // BODY IS PASSED THROUGH UNTOUCHED -- collapsing it is what would let a
    // garage, or a shed, splice onto a house corner, and the normaliser is
    // already the place that decides what a body may be.
    const G = window.DraftGeometry2D;
    vertexPool = [];
    // mergeVertex copies coordinates and pool identity, NOTHING ELSE — and a
    // stored point may carry more: srcId/offX/offZ, the link that lets a wall
    // corner ride its BONEYARD master point (drawing-format.js stores them on
    // purpose). A viewer could shrug that off; a page that SAVES cannot,
    // because the pooled object is what gets re-emitted, and a save that
    // drops srcId silently unhooks every BUILD HOUSE wall from its bone.
    // First point into a pooled corner wins, matching the identity the old
    // page saved: one shared object per corner has one link.
    const pooled = (pt, wall, view, body) => {
      const v = G.mergeVertex(vertexPool, pt, wall.levelId, view, body);
      if (pt.srcId && !v.srcId) {
        v.srcId = pt.srcId;
        v.offX = pt.offX;
        v.offZ = pt.offZ;
      }
      return v;
    };
    drawing.walls.forEach(wall => {
      const view = wall.view === 'foundation' ? 'foundation' : 'plan';
      const body = wall.body || 'house';
      wall.start = pooled(wall.start, wall, view, body);
      wall.end = pooled(wall.end, wall, view, body);
    });

    // THE HISTORY GOES WITH THE DRAWING IT POINTS INTO. Undo entries hold
    // references to wall and corner OBJECTS, and every one of them has just
    // been replaced. Kept, an undo would splice a wall from the previous
    // drawing back into this one, or move a corner nothing is joined to.
    undoStack.length = 0;
    selectedSeg = null;
    drawStart = null;
    return true;
  };


  const boot = async () => {
    resize();
    let file = null;
    try {
      // loadSharedFileAt, not loadSharedFile: the file AND the revision it was
      // read at, in one transaction, so the rev handed to a later save really
      // describes the drawing on screen and not some neighbouring moment.
      const at = await window.SharedFileStore.loadSharedFileAt(BUCKET);
      file = at.file;
      storeRev = at.rev;
    } catch (err) {
      readout.textContent = 'store unavailable';
      say('The drawing store could not be opened',
        `<p>IndexedDB refused to open: <code>${String(err && err.message || err)}</code></p>
         <p>Private-browsing windows and blocked site data both do this.</p>`);
      return;
    }
    if (!file) {
      readout.textContent = 'no drawing saved';
      say('No saved drawing on this origin',
        `<p>Nothing is stored under <code>${BUCKET}</code> yet.</p>
         <p>Draw something in <code>MODEL.dc.html</code> on this same origin and save it,
            then reload this page. Storage is per-origin, so a drawing made on a
            different host or port will not appear here.</p>`);
      return;
    }

    if (!(await adoptFile(file))) return;
    fit();
    paint();
    // The switchers can only be built once the drawing is on the page: their
    // options ARE its levels. Before this the bar stays hidden, like #save.
    buildChrome();
    saveButton.classList.add('show');
    // CLEAN ON ARRIVAL, and stamped rather than assumed: without this the
    // attribute is absent, and absent is not '0' to anything reading it.
    document.body.dataset.saveDirty = '0';
    // Deliberately NOT awaited: the drawing is correct without its tracing
    // images and should be on screen before they arrive. Each one repaints
    // itself as it lands.
    loadUnderlayImages();
    // CLAIMED ONCE THERE IS SOMETHING TO EDIT. A page that failed to load a
    // drawing has nothing to protect and should not hold the lease shut against
    // a page that does.
    await askForLease();
    startLeaseHeartbeat();
  };

  // ── the Write Tier ──────────────────────────────────────────────────────────────────
  // This page has no serializer of its own, ON PURPOSE. `drawing` was built by
  // spreading the parsed save, so every persisted key — all 65 literal ones
  // plus conditional layout/specs passthrough — is still sitting on it,
  // untouched, in the shape MODEL.dc.html wrote. The four collections this
  // page normalises on load are re-emitted through the SAME shared rules the
  // old page saves through, and pooled wall corners go back to stored points
  // through the same pointForStorage that wrote them. Nothing here decides
  // what a drawing looks like; drawing-format.js already did.
  //
  // What a save through this page is, precisely: load → normalise → store.
  // The deep-compare proof in tests/write-tier.spec.js holds the result
  // against a straight legacy save of the same drawing, key for key.
  // ── unsaved edits ─────────────────────────────────────────────────────────
  // MODEL.dc.html AUTOSAVES: _markUnsaved (MODEL.dc.html:6199) writes on every
  // edit, so its UNSAVED is only ever briefly true. THIS PAGE SAVES ON A
  // PRESS, deliberately — the Write Tier note below says why, and the stale
  // check in save() is the other half of it: two pages writing the same file
  // on every drag would spend the day refusing each other. A manual save is
  // only honest if the drafter can see there is something unsaved, so the
  // button carries three true words: SAVE before anything is touched, UNSAVED
  // the instant a corner moves, SAVED once it is written.
  //
  // THE BODY ATTRIBUTE IS LIFTED FROM MODEL.dc.html:6206 and is there for the
  // same stated reason: it flips SYNCHRONOUSLY with the edit, where the
  // button's text lands a frame later. A test that watched the text would be
  // racing the edit it is checking.
  let dirty = false;
  const markDirty = () => {
    if (!drawing || dirty) return;
    dirty = true;
    document.body.dataset.saveDirty = '1';
    saveButton.textContent = 'UNSAVED';
    saveButton.classList.add('dirty');
  };
  const markSaved = () => {
    dirty = false;
    document.body.dataset.saveDirty = '0';
    saveButton.textContent = 'SAVED';
    saveButton.classList.remove('dirty');
  };

  const serializeDrawing = () => {
    const point = p => window.DraftDrawingFormat.pointForStorage(p);
    return {
      ...drawing,
      walls: drawing.walls.map(wall => ({
        ...wall, start: point(wall.start), end: point(wall.end),
      })),
    };
  };

  // ONE WRITE, TWO CALLERS. The press and the hide-save below both come through
  // here, and that is the point: two write paths to one file is how the two
  // halves drift apart, and the half that drifts is always the one nobody
  // watches. Everything that decides WHETHER to write stays with the caller;
  // everything that decides HOW lives here.
  //
  // markSaved() is inside the await rather than after it at the call site, so a
  // page cannot say SAVED before the store has taken the bytes.
  const writeDrawing = async () => {
    const contents = JSON.stringify(serializeDrawing());
    const file = new File([contents], 'model-drawing.json', { type: 'application/json' });
    storeRev = await window.SharedFileStore.saveSharedFile(file, BUCKET, {
      // BOTH GUARDS, NOT ONE. The lease prevents the collision; `ifRev`
      // catches the case where prevention failed. Dropping `ifRev` because
      // this page holds a lease would reintroduce audit C3.
      ifRev: Number.isInteger(storeRev) ? storeRev : null,
      lease: { scope: LEASE_SCOPE, holderId: holderId(), generation: leaseGeneration },
    });
    markSaved();
  };

  const save = async () => {
    if (!drawing) return;
    // A READ-ONLY PAGE DOES NOT ASK. The store would refuse it anyway — that gate
    // is the authority and is tested on its own — but a page that fires a write
    // it knows will be refused spends the drafter's attention to learn something
    // it already knew.
    if (!holdsLease()) { paintLease(); return; }
    saveButton.disabled = true;
    saveButton.textContent = 'SAVING…';
    try {
      await writeDrawing();
      // The note described a difference this save has just resolved.
      if (elsewhereNote) elsewhereNote.hidden = true;
      saveButton.disabled = false;
    } catch (error) {
      // The edit is still unsaved, so the button must still say so. Dropping
      // back to a neutral SAVE here would tell a drafter whose write just
      // failed that there is nothing to lose.
      saveButton.textContent = dirty ? 'UNSAVED' : 'SAVE';
      saveButton.disabled = false;
      // A STALE WRITE IS REFUSED, NOT MERGED. MODEL.dc.html re-reads and
      // retries because it holds live edits worth fighting for; this page
      // holds only what it loaded, so the honest resolution is to reload and
      // read what is really there now.
      // TAKEN OVER BETWEEN THE PRESS AND THE WRITE. The edit is untouched and
      // still on screen; the banner names who holds it and offers it back.
      if (error?.lease) {
        leaseGeneration = null;
        leaseHolder = error.holderId;
        paintLease();
        return;
      }
      if (error?.stale) {
        say('The drawing changed underneath this page',
          `<p>Another page saved since this one loaded. Nothing was written.
              Reload to pick up the current drawing, then save again.</p>`);
        return;
      }
      say('The save failed', `<p><code>${String(error && error.message || error)}</code></p>`);
    }
  };
  saveButton.addEventListener('click', save);

  // THE LAST THING BETWEEN AN EDIT AND LOSING IT. MODEL.dc.html never needed
  // this: _markUnsaved (MODEL.dc.html:6199) writes on every edit, so there is
  // never a closed tab with work in it. This page saves on a press, which is
  // the right call for a second writer on one file — and it is what puts a
  // drafter one stray Ctrl+W away from a moved corner that never landed.
  //
  // The browser owns the dialog and its wording; a page can only say whether
  // there is something to lose.
  //
  // TWO SPELLINGS, AND ONLY ONE OF THEM IS TESTED HERE. Mutating preventDefault
  // away makes the spec below fail; mutating returnValue away does not — this
  // Chromium reads preventDefault and nothing else. returnValue is the older
  // spelling, kept for the engines that still read only it, and THE SUITE
  // CANNOT PROVE IT DOES ANYTHING, because it runs one engine. Said out loud
  // rather than left as a line that reads as verified: a reader who deletes it
  // will see every test pass.
  //
  // This is the honest minimum, not the answer. The answer is autosave, and
  // autosave here means deciding what happens when this page and MODEL.dc.html
  // both hold the same file — the ifRev refusal in save() above is one half of
  // a story that has not been written yet. Not a rung to take on the way past.
  window.addEventListener('beforeunload', event => {
    if (!dirty) return;
    event.preventDefault();
    event.returnValue = '';
  });

  // ── the edit lease ──────────────────────────────────────────────────────────
  // RULING-autosave-two-writers.md §2 and §3.1-3.2, rung 3. The broadcast below
  // stops a CLEAN page going stale; this is what happens when two pages are both
  // being edited. It is the only thing in the design that protects work before
  // it is written, and it does not make concurrent editing safe — it makes it
  // refused, visibly, with the loser's work intact.
  const LEASE_SCOPE = 'model';
  // ONE ID PER PAGE INSTANCE, and it is rung 2's `writerId` rather than a second
  // one. A page that ignored its own broadcast under one identity and held the
  // lease under another would have two answers to "is this me".
  const holderId = () => window.SharedFileStore.leaseHolderId();
  let leaseGeneration = null;   // the generation we hold, or null when we do not
  let leaseHolder = null;       // whoever holds it instead, so the banner can say
  let leaseTimer = null;
  const holdsLease = () => leaseGeneration !== null;

  const paintLease = () => {
    const held = holdsLease();
    // A SYNCHRONOUS BEACON, like data-save-dirty: it flips with the state, where
    // the banner's text lands a frame later.
    document.body.dataset.leaseHeld = held ? '1' : '0';
    if (leaseBanner) {
      leaseBanner.hidden = held;
      // NAMED, as §2 asks — and the holder id is the only name there is. It is
      // not shown, because "w-mf2k3-8ad19c" tells a drafter nothing; it is
      // carried where a second page, and a test, can read WHICH page has it
      // rather than merely that one does.
      if (leaseHolder) leaseBanner.dataset.leaseHolder = leaseHolder;
      else delete leaseBanner.dataset.leaseHolder;
    }
    if (leaseMessage && !held) {
      // WORDED AS BEING EDITED ELSEWHERE, NOT AS EXPIRED (§3.4). An
      // expired-but-unclaimed lease is an absent drafter, not a free lease, and a
      // drafter told "expired" will reasonably assume they may simply carry on.
      leaseMessage.textContent = 'Being edited in another tab';
    }
    // DISABLED, NOT HIDDEN. The ruling leaves this unruled and asks that someone
    // who watches drafters pick it; THIS IS A PICK, NOT A SPECIFICATION. A
    // missing button reads as a broken page, where a dead one says the drafter
    // is looking at the right place and cannot use it yet.
    if (saveButton) saveButton.disabled = !held;
  };

  const askForLease = async ({ takeover = false } = {}) => {
    const S = window.SharedFileStore;
    if (!S || !S.claimLease) return false;
    let got;
    try {
      got = await S.claimLease(BUCKET, LEASE_SCOPE, holderId(),
        { ttlMs: S.LEASE_TTL_MS, takeover });
    } catch (error) {
      console.warn('draft: could not reach the edit lease', error);
      return holdsLease();
    }
    if (!got.ok) {
      // WE DO NOT HOLD IT, AND NOTHING OF OURS IS DISCARDED. A dirty page keeps
      // every edit it has; it is simply refused at the store if it tries to
      // write, and the banner tells the drafter why and offers the way out.
      leaseGeneration = null;
      leaseHolder = got.holderId;
      paintLease();
      return false;
    }
    // A GENERATION THAT MOVED WHILE WE WERE AWAY MEANS SOMEBODY HELD THIS IN
    // BETWEEN — we froze, they took it, it came back to us. They may have
    // written, so this page says the same thing rung 2 says when another page
    // writes rather than inventing a fourth kind of notice.
    //
    // A generation that did NOT move is the resume path (§3.4): our own lease
    // expired, nobody took it, nothing happened, and the drafter is told nothing
    // at all. Bump the generation on every re-claim and every woken tab
    // announces a takeover that never occurred.
    const wasTakenOver = leaseGeneration !== null && got.generation !== leaseGeneration;
    leaseGeneration = got.generation;
    leaseHolder = null;
    paintLease();
    if (wasTakenOver && !takeover && elsewhereNote) elsewhereNote.hidden = false;
    return true;
  };

  const startLeaseHeartbeat = () => {
    if (leaseTimer) return;
    const S = window.SharedFileStore;
    // It renews while we hold it and acquires when whoever does goes away —
    // expiry with a heartbeat is what stops a closed tab bricking the drawing,
    // and the ruling calls that non-negotiable.
    leaseTimer = setInterval(() => {
      askForLease().catch(error => console.warn('draft: lease heartbeat failed', error));
    }, (S && S.LEASE_HEARTBEAT_MS) || 4000);
  };

  if (takeOverButton) {
    takeOverButton.addEventListener('click', () => {
      // The only thing that may seize a live lease, and only because a person
      // read a banner and pressed it.
      askForLease({ takeover: true })
        .catch(error => console.warn('draft: takeover failed', error));
    });
  }

  // ── the hide-save ───────────────────────────────────────────────────────────
  // RULING-autosave-two-writers.md §3.4, rung 4. AN EXTRA, NOT A MECHANISM.
  // The press is still the only commit point and stays the only commit point.
  // This closes the tab-closed hole MOST OF THE TIME, which is the whole claim
  // and the most that can honestly be claimed: the probe (TTL-MEASUREMENT-MEMO)
  // measured a pagehide IndexedDB write failing to land on a tab reload with no
  // memory pressure at all. It landed on close. So nothing here — no rung, no
  // test, no comment — may assume this ran.
  //
  // TWO LISTENERS, AND NEITHER IS A SUPERSET OF THE OTHER. visibilitychange is
  // what fires when an iPad drafter switches apps or backgrounds the tab;
  // pagehide is what fires on close and on navigation. A page that listened to
  // one of them would miss whichever half of the drafter's day it did not pick.
  //
  // It writes only when it can write CLEANLY, and the three conditions are the
  // press's own: something to save, a lease to save under, a drawing to
  // serialise. A hide-save that fired without the lease would spend a refusal
  // to learn what holdsLease() already knew, exactly as save() says.
  //
  // NO TIMER, AND THAT IS NOT AN OVERSIGHT. Saving on an interval or a debounce
  // is rung 5, and rung 5 is illegal until this page is the sole model writer.
  // A mutation in the rung-4 PR fires this on a timer specifically so the suite
  // can tell the two rungs apart.
  // THE WRITE THE RELEASE WAITS ON. Rung 4 dropped this promise on the floor,
  // which is what left the write and the lease release racing; the release
  // below chains off it.
  let inFlightWrite = null;
  const saveOnHide = () => {
    if (!dirty || !drawing || !holdsLease()) return;
    const write = writeDrawing();
    inFlightWrite = write;
    // NOTHING ON FAILURE, ON PURPOSE. Stale, refused, store unreachable — the
    // page keeps the edit and keeps saying UNSAVED, because markSaved() runs
    // only inside a resolved write. The failure mode of a best-effort save is
    // "the drafter still has their work and can still see it is unsaved", never
    // "the drafter was told it was fine" on the way out the door.
    //
    // SWALLOWED HERE RATHER THAN IN THE STORED PROMISE. `inFlightWrite` keeps
    // the raw write, so the release can tell a failure from a success and
    // still run either way; a pre-caught promise would hide the difference and
    // make a release chained on success alone look correct.
    write.catch(() => {});
  };
  // REGISTERED BEFORE THE LEASE RELEASE BELOW, WHICH BUYS THE CALL ORDER AND
  // NOTHING MORE. Listeners run in registration order, so this handler is
  // CALLED first — but it starts an asynchronous write and returns, so the
  // release listener runs while that write is still in flight. What guarantees
  // the lease is still live when the write reads it is the release awaiting
  // `inFlightWrite`, below; registration order alone never settled a race
  // between two async operations.
  //
  // WHY THIS WAS NOT A BUG BEFORE THE CHAINING, for the record and not as the
  // guarantee: both paths reach IndexedDB through the store's `withDb`, which
  // awaits one cached connection promise, so the write's continuation is queued
  // as a microtask ahead of the release's and its `readwrite` transaction is
  // created first — and IndexedDB serialises overlapping transactions on a
  // store in creation order. True, load-bearing, and two levels below anything
  // this file says. One added `await` before the write's transaction opens, or
  // the re-open branch inside `withDb`, inverts it silently and nothing
  // reports. That is the sentence this comment used to make, and the reason it
  // was replaced rather than softened.
  window.addEventListener('pagehide', saveOnHide);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'hidden') return;
    saveOnHide();
  });

  // BEST EFFORT, AND NOTHING DEPENDS ON IT (§3.4). The probe found a pagehide
  // IndexedDB write fail to land on a tab reload with no memory pressure at all;
  // the TTL is the real backstop and this only shortens the wait for whoever is
  // next.
  //
  // AFTER THE HIDE-SAVE, AND AFTER IT EITHER WAY. The release is chained on the
  // write's promise SETTLING, not resolving: a write that was refused as stale
  // must still give the lease up, or a failed best-effort save would cost the
  // next drafter the full TTL — a regression traded for nothing. With no write
  // in flight this is exactly what it was.
  //
  // ONLY pagehide RELEASES. visibilitychange deliberately does not: a
  // backgrounded iPad tab is coming back, and handing its lease away while the
  // drafter is reading their mail is how they return to a read-only page.
  window.addEventListener('pagehide', () => {
    const S = window.SharedFileStore;
    if (!holdsLease() || !S || !S.releaseLease) return;
    const release = () => S.releaseLease(BUCKET, LEASE_SCOPE, holderId()).catch(() => {});
    if (inFlightWrite) inFlightWrite.then(release, release);
    else release();
  });

  // ── the change broadcast ────────────────────────────────────────────────────
  // RULING-autosave-two-writers.md §4, rung 2. This page reads its revision
  // once at load and advances it only by its own save, so before this listener
  // existed a single sheet edit in LAYOUT — a write to a key this page does not
  // touch — refused every save from here until the drafter reloaded, and
  // reloading is what costs them the corner they had not saved.
  //
  // A page that hears the write and re-reads is never stale, so it never has
  // anything to overwrite.
  //
  // Reads overlap: two writes land in quick succession and the second read can
  // resolve first, leaving the older file on screen with the newer revision
  // beside it. A sequence number is the cheapest thing that makes the last
  // change asked for the one that wins.
  let adoptSeq = 0;
  const adoptStore = async () => {
    const mine = ++adoptSeq;
    const at = await window.SharedFileStore.loadSharedFileAt(BUCKET);
    if (mine !== adoptSeq) return;
    // A cleared bucket is not a drawing to adopt. Keeping what is on screen is
    // the safe direction: nothing here can put it back.
    if (!at.file) return;
    if (!(await adoptFile(at.file))) return;
    if (mine !== adoptSeq) return;
    // THE REVISION COMES FROM THE READ, NOT FROM THE MESSAGE. loadSharedFileAt
    // takes the file and the revision in ONE transaction, so they describe one
    // state of the bucket. The message's rev describes the write that woke us,
    // and by the time this read ran a third page may have written again —
    // adopting that number would hand the next save an `ifRev` that does not
    // match the drawing it is about to write.
    storeRev = at.rev;
    // NOT fit(). A reload would re-frame the view; a live adopt must not move
    // the drafter's camera out from under them for someone else's edit.
    paint();
    buildChrome();
    loadUnderlayImages();
  };

  if (window.SharedFileStore?.onBucketChanged) {
    window.SharedFileStore.onBucketChanged(BUCKET, change => {
      // OUR OWN SAVE. The store tells every listener, this page's included, so
      // that "the bucket changed" means one thing regardless of who wrote it.
      // Ignoring our own is this page's decision and this is where it is made:
      // without it, every SAVE would be followed by a re-read that replaces the
      // drawing the undo stack points into, and the drafter's history would go
      // with it.
      if (change.writerId === window.SharedFileStore.writerId) return;
      // Nothing on screen yet — boot failed or the store was empty. There is no
      // drawing to keep current and no camera to preserve; a reload is the
      // honest way back and the notice already says so.
      if (!drawing) return;
      // A DIRTY PAGE RE-READS NOTHING. Not the drawing, not the revision: the
      // next save must still be refused, because this page's copy really is
      // built on an older one and rung 1's refusal is what stands between the
      // drafter and somebody else's work being eaten.
      if (dirty) {
        if (elsewhereNote) elsewhereNote.hidden = false;
        return;
      }
      adoptStore().catch(error => {
        console.warn('draft: could not adopt a change from another page', error);
      });
    });
  }

  boot();
})();
</script>
</body>
</html>
