<!DOCTYPE html>
<!--
  MODEL.html — the framework-free model space, tier 1.

  This is the migration target. It is NOT wired into the site: index.html still
  points at MODEL.dc.html, which serves every user until this page earns the
  swap. Both live at root together on purpose, so the old page keeps running
  untouched while this one is filled in.

  Tier 1 asks one question and answers only that: can a page with no framework
  read the drawing MODEL.dc.html saved, and paint it with the same painters?
  It reads. It does not write. Nothing here can damage a drawing.

  What it carries, and why the list is this short: render-2d.js reaches for
  zero globals — every outside thing it needs arrives in an `env` object — so
  the wall painter costs exactly one dependency, wall-types.js.

  Load order is not cosmetic. Eight modules in this repo capture a global at
  module scope (`const geo = window.DraftGeometry2D;`), which binds at load
  time, so a dependency arriving later never helps. None of the four below do
  that — checked, not assumed — but the moment tier 2 adds one, order becomes
  load-bearing. See MIGRATION-STATUS.md.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rough Drafter — Model Space</title>
<!-- Self-hosted (see vendor/fonts.css): no third-party request on the
     drafter's behalf, and the OFL text ships beside the files. -->
<link rel="stylesheet" href="vendor/fonts.css" />
<style>
  :root {
    color-scheme: dark;

    /* TYPE, DECLARED ONCE ON PURPOSE.
       MODEL.dc.html carries 284 inline `font-family:` declarations and the
       site 391 across seven files, so changing the typeface there is 391
       edits and a find-and-replace through a 22,000-line file. Here it is
       three lines. When the faces are redesigned, this block is the change
       and every later tier inherits it.

       Barlow / Barlow Condensed / DM Mono are all SIL OFL and vendored in
       vendor/fonts/ with the licence beside them -- nothing is fetched
       from a CDN. Each stack keeps a real fallback so the page is legible
       before the woff2 lands, and if a face is ever swapped for one with
       different metrics the fallback is what a reader sees mid-swap. */
    --font-ui:   'Barlow Condensed', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono: 'DM Mono', ui-monospace, Menlo, Consolas, monospace;

    /* COLOUR IS NOT DECLARED HERE. palette.js writes every --role token onto
       this element at boot, because 92% of MODEL's colour is set from
       JavaScript (canvas fills, inline styles) and only a table both the
       stylesheet and the painters can read reaches all of it. The fallbacks
       below are the night skin, so the page is never unpainted between parse
       and boot -- and never a SECOND definition to keep in step, because
       palette.js overwrites all of them. See RD-DOCUMENTS/SPEC-skins.md. */
    --surface-page: #1d1f20;
    --surface-panel: rgba(20,22,23,0.82);
    --surface-chip: #2a2d2e;
    --edge-panel: #3a3d3f;
    --ink-primary: #e7e5e2;
    --ink-secondary: #b9bcbe;
    --ink-quiet: #8b8f92;
    --accent: #f0b429;
  }
  html, body { margin:0; height:100%; overflow:hidden;
    /* Two properties rather than the `background:` shorthand: its layer list
       parses differently with and without an image, and a skin that later
       defines --surface-page-tex should not have to re-learn that. */
    background-color: var(--surface-page); background-image: var(--surface-page-tex, none);
    font: 13px/1.45 var(--font-body);
    color: var(--ink-primary); }
  #plan { display:block; width:100%; height:100%; cursor:grab; touch-action:none; }
  #plan.dragging { cursor:grabbing; }

  #readout { position:fixed; left:12px; bottom:12px; z-index:5;
    background-color: var(--surface-panel); background-image: var(--surface-panel-tex, none);
    border:1px solid var(--edge-panel); border-radius:6px;
    padding:8px 11px; white-space:pre; pointer-events:none;
    /* Instrument text: tabular figures so the counts do not jitter as they
       change, and the mono face so a column of numbers reads as a column. */
    font-family: var(--font-mono); font-size:12px;
    font-variant-numeric:tabular-nums; letter-spacing:0.01em; }
  #readout b { color: var(--accent); font-weight:600; }

  #hint { position:fixed; right:12px; bottom:12px; z-index:5; color: var(--ink-quiet);
    font-family: var(--font-ui); font-size:12px; letter-spacing:0.04em;
    text-transform:uppercase; pointer-events:none; }

  /* The empty and error states say what to do, because a black screen with
     nothing on it is indistinguishable from a page that failed to boot. */
  #notice { position:fixed; inset:0; z-index:6; display:none;
    align-items:center; justify-content:center; padding:24px; text-align:center; }
  #notice.show { display:flex; }
  #notice div { max-width:34em; }
  #notice h1 { font-family: var(--font-ui); font-size:19px; font-weight:600;
    letter-spacing:0.02em; margin:0 0 8px; color: var(--accent); }
  #notice p { margin:0 0 6px; color: var(--ink-secondary); }
  #notice code { font-family: var(--font-mono); font-size:0.92em;
    color: var(--ink-primary); padding:1px 5px; border-radius:3px;
    background-color: var(--surface-chip); background-image: var(--surface-chip-tex, none); }
</style>
</head>
<body>

<canvas id="plan"></canvas>
<div id="readout">loading…</div>
<div id="hint">drag to pan · wheel to zoom · 0 to fit</div>
<div id="notice"><div id="notice-body"></div></div>

<!-- ORDER IS LOAD-BEARING, not tidiness. cut-view.js destructures
     window.DraftWallTypes and window.DraftFormatters at MODULE SCOPE
     (cut-view.js:28-29), so it throws while loading if either comes after
     it -- and a page that throws in the head paints nothing at all. The
     tier-1 spec pins this exact list, in this exact order, for that reason.
     Everything else here is a lazy accessor and would not care. -->
<script src="./palette.js"></script>
<script src="./layer-views.js"></script>
<script src="./geometry-2d.js"></script>
<script src="./shared-file-store.js"></script>
<script src="./wall-types.js"></script>
<script src="./formatters.js"></script>
<script src="./cut-view.js"></script>
<script src="./drawing-format.js"></script>
<script src="./render-2d.js"></script>

<script>
(() => {
  // ── skin ──────────────────────────────────────────────────────────────────
  // Four dashboards: RUFF DRAFTER and ROUGH DRAFTER, each night and day
  // (RD-DOCUMENTS/SPEC-skins.md). The skins themselves get designed later;
  // what exists now is the seam they arrive through.
  //
  // ?theme= and ?mode= are the seam, deliberately: a URL is the cheapest way
  // for a designer to see a skin, and for a spec to assert one, before any
  // settings UI exists. When the profile package carries the choice, this
  // reads that first and the query string stays as an override.
  //
  // `skin` is captured ONCE at module scope, which is a load-order hazard this
  // repo has been bitten by 13 times across 8 files -- so palette.js is loaded
  // above and this throws here, naming itself, rather than painting undefined
  // three functions away.
  // resolve() throws on an unknown name, which is right for a painter asking
  // for a role that does not exist. It is WRONG here: a typo in a URL someone
  // pasted should not blank the page. So the query string is validated against
  // the palette's own lists and falls back, loudly, to the default skin.
  const params = new URLSearchParams(location.search);
  const pick = (name, allowed, fallback) => {
    const asked = params.get(name);
    if (!asked || allowed.includes(asked)) return asked || fallback;
    console.warn(`MODEL: unknown ${name} "${asked}"; using ${fallback}. `
      + `Known: ${allowed.join(', ')}`);
    return fallback;
  };
  const theme = pick('theme', window.DraftPalette.THEMES, 'ruff');
  const mode = pick('mode', window.DraftPalette.MODES, 'night');
  const skin = window.DraftPalette.apply(document, theme, mode);
  'use strict';

  const BUCKET = 'model-drawing';
  const canvas = document.getElementById('plan');
  const ctx = canvas.getContext('2d');
  const readout = document.getElementById('readout');
  const notice = document.getElementById('notice');
  const noticeBody = document.getElementById('notice-body');

  // View state in world units (feet). scale is screen pixels per foot.
  // Deliberately plain arithmetic: MODEL.dc.html projects through a three.js
  // camera, but the painters take `toS` as a parameter and never ask where it
  // came from, so tier 1 owes three.js nothing.
  const view = { cx: 0, cz: 0, scale: 6 };
  let drawing = null;
  let dropped = 0;   // items the format module rejected on load

  const say = (title, body) => {
    noticeBody.innerHTML = `<h1>${title}</h1>${body}`;
    notice.classList.add('show');
  };

  // ── canvas sizing ─────────────────────────────────────────────────────────
  // Backing store in device pixels, drawing in CSS pixels, so lines are crisp
  // on a retina screen without every painter having to know the ratio.
  let dpr = 1, cssW = 0, cssH = 0;
  const resize = () => {
    dpr = window.devicePixelRatio || 1;
    cssW = canvas.clientWidth;
    cssH = canvas.clientHeight;
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    paint();
  };

  // ── world → screen ────────────────────────────────────────────────────────
  const toS = p => ({
    x: (p.x - view.cx) * view.scale + cssW / 2,
    y: (p.z - view.cz) * view.scale + cssH / 2,
  });
  const toWorld = (sx, sy) => ({
    x: (sx - cssW / 2) / view.scale + view.cx,
    z: (sy - cssH / 2) / view.scale + view.cz,
  });

  // ── which level, and which drawing OF that level ──────────────────────────
  // Tier 1 painted all five levels at once, stacked. A drafter looks at one
  // level at a time, so this picks one -- and picking one is not
  // `levelId === active`, because a level is not one drawing. MAIN FL has a
  // walls plan, a floor layout, a stair drawing and an electrical plan;
  // FOUNDATION has basement walls and the concrete below them. That table is
  // layer-views.js, already shared with LAYOUT, so this reads it rather than
  // restating it.
  //
  // MAIN_FLOOR is an ID (3), not an index. MODEL.dc.html's own
  // state.activeLevelIdx is an INDEX into DEFAULT_LEVELS, and for the default
  // list index 3 also happens to be id 3 -- they stop agreeing the moment a
  // level is inserted. See RD-DOCUMENTS/SPEC-model-html-tiers.md.
  const MAIN_FLOOR_LEVEL_ID = 3;
  const levelIds = () => (drawing?.levels || []).map(level => Number(level.id));
  const activeLevelId = () => {
    const asked = Number(params.get('level'));
    if (Number.isFinite(asked) && levelIds().includes(asked)) return asked;
    if (params.get('level') !== null && drawing) {
      console.warn(`MODEL: unknown level "${params.get('level')}"; using MAIN FL. `
        + `Known: ${levelIds().join(', ')}`);
    }
    return levelIds().includes(MAIN_FLOOR_LEVEL_ID) ? MAIN_FLOOR_LEVEL_ID : levelIds()[0];
  };

  // ── what is on the page ───────────────────────────────────────────────────
  // FIVE RULES, NOT ONE, measured from MODEL.dc.html:6505-6513:
  //   walls / lines / floors  filter by level AND view
  //   roofs / outlines        filter by level ONLY -- no view filter at all
  //   and the view filter switches ITSELF OFF on a level that has no layer
  //   views (ROOF, SITE), which show everything they hold.
  //
  // The trap in the third rule: floors default to view 'floor', not 'plan'
  // (MODEL.dc.html:2905). Writing `view === 'plan'` hides every floor in the
  // drawing and reads exactly like a broken painter.
  // ?view= PICKS THE DRAWING, and without it half the level is unreachable.
  //
  // Tier 2a defaulted the layer view and offered no way to change it, which
  // quietly switched the floors off: MAIN FL and 2ND FL default to the walls
  // plan, FOUNDATION to the concrete, and a floor saves with `view: 'floor'`
  // (MODEL.dc.html:2905). So `(view || 'plan') === viewId` was false for every
  // floor on every reachable view, paintFloors() drew nothing anywhere, and
  // the readout said `floors 0` on a drawing that has them. Tier 1 painted
  // them; tier 2a turned them off and no spec noticed, because the specs
  // asserted walls.
  //
  // A level is not one drawing. Choosing the level and not the drawing is
  // choosing half.
  const activeViewId = () => {
    const LV = window.DraftLayerViews;
    const levelId = activeLevelId();
    const views = LV.layerViewsForLevelId(levelId);
    if (!views.length) return null;               // ROOF / SITE hold everything
    const asked = params.get('view');
    if (asked && views.some(v => v.id === asked)) return asked;
    if (asked) {
      console.warn(`MODEL: level ${levelId} has no view "${asked}"; using its `
        + `default. Known: ${views.map(v => v.id).join(', ')}`);
    }
    return LV.defaultLayerViewId(levelId);
  };

  const onActiveLevel = () => {
    const LV = window.DraftLayerViews;
    const levelId = activeLevelId();
    const views = LV.layerViewsForLevelId(levelId);
    const viewId = activeViewId();
    // THE FALLBACK DIFFERS BY ITEM TYPE. Measured, not assumed: every
    // `.view || '...'` in MODEL.dc.html reads 'plan' -- wall, line, stair,
    // opening, fixture, device, seg, 20-odd sites -- EXCEPT floors, which
    // read 'floor' (MODEL.dc.html:2905, 9029, 9089, 9098, 9162, 17025).
    //
    // A floor outline's home layer set is FLOOR, or FOUNDATION where it is a
    // concrete slab; it was never a plan-set item. Defaulting floors to
    // 'plan' put a view-less floor on the wrong layer set -- invisible on
    // every fixture, because a floor drawn by the old page always carries an
    // explicit `view`, and visible only on an older saved drawing whose
    // floors predate the field. Those are exactly the drawings that have to
    // keep opening, so the spec builds that case by hand.
    const onPlan = (item, fallback = 'plan') =>
      !views.length || (item.view || fallback) === viewId;
    const byLevel = item => Number(item.levelId) === levelId;
    return { levelId, viewId, onPlan, byLevel };
  };
  const walls = () => (drawing?.walls || [])
    .filter(w => { const f = onActiveLevel(); return f.byLevel(w) && f.onPlan(w); });
  const lines = () => (drawing?.lines || [])
    .filter(l => { const f = onActiveLevel(); return f.byLevel(l) && f.onPlan(l); });
  const floors = () => (drawing?.floors || [])
    .filter(x => { const f = onActiveLevel(); return f.byLevel(x) && f.onPlan(x, 'floor'); });
  // Rules four and five: LEVEL ONLY. A roof footprint and a reference shape are
  // level-wide -- every drawing of the level shows them -- so they take no view
  // filter at all. Copying the walls line here would hide both on FOUNDATION.
  const roofs = () => (drawing?.roofs || [])
    .filter(r => onActiveLevel().byLevel(r));
  const shapes = () => (drawing?.shapes || [])
    .filter(sh => onActiveLevel().byLevel(sh));

  // Every point that defines the drawing's extent, for fit-to-content.
  const allPoints = () => {
    const pts = [];
    walls().forEach(w => { if (w.start && w.end) pts.push(w.start, w.end); });
    lines().forEach(l => { if (l.start && l.end) pts.push(l.start, l.end); });
    floors().forEach(f => (f.points || []).forEach(p => pts.push(p)));
    return pts.filter(p => Number.isFinite(p?.x) && Number.isFinite(p?.z));
  };

  const fit = () => {
    const pts = allPoints();
    if (!pts.length) { view.cx = 0; view.cz = 0; view.scale = 6; return; }
    let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
    pts.forEach(p => {
      if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
      if (p.z < minZ) minZ = p.z; if (p.z > maxZ) maxZ = p.z;
    });
    view.cx = (minX + maxX) / 2;
    view.cz = (minZ + maxZ) / 2;
    // A drawing one foot across must not zoom to a thousand pixels per foot,
    // and a zero-extent one must not divide by zero.
    const spanX = Math.max(maxX - minX, 1);
    const spanZ = Math.max(maxZ - minZ, 1);
    const margin = 0.86;
    view.scale = Math.min(cssW / spanX, cssH / spanZ) * margin;
    view.scale = Math.max(0.25, Math.min(view.scale, 200));
  };

  // ── painting ──────────────────────────────────────────────────────────────
  // THE DATUM IS THE DRAFTER'S ZERO, not the world's. MODEL.dc.html sets
  // state.drawingOrigin from the drafter's FIRST CLICK (MODEL.dc.html:10360),
  // so the point they start on reads as 0,0 from then on, and drawGrid2D
  // anchors the grid to it. Movie, 3 Sep: "that way he always first clicks on
  // 0,0."
  //
  // No click, no datum, and therefore NO GRID. That is deliberate, not a gap:
  // tests/registration-grid.spec.js asserts it by name -- "an untouched model
  // space draws no grid, and the first node sets the datum" -- and the grid
  // cannot be anchored to a point the drafter has not chosen yet. Tier 1's
  // hand-rolled grid drew always, aligned to world 0,0, which was a
  // divergence from the old page rather than a feature.
  //
  // ABSENT AND NULL MEAN DIFFERENT THINGS. This is the tier-2a floors bug's
  // exact shape, so it is spelled out rather than compressed. MODEL.dc.html
  // :5160 reads:
  //     'drawingOrigin' in saved ? normalise(saved.drawingOrigin) : {x:0,z:0}
  // Absent = a drawing made before the datum existed. It was drawn on the
  // world grid, so 0,0 is what leaves every coordinate where it is. Explicit
  // null = "no origin yet", which is where NEW starts and how it avoids
  // silently adopting 0,0.
  //
  // `drawing.drawingOrigin || null` would collapse the two and strip the grid
  // from every old drawing -- and no fixture would catch it, because the old
  // page always writes the key now.
  const gridDatum = () => {
    if (!drawing) return null;
    if (!('drawingOrigin' in drawing)) return { x: 0, z: 0 };
    const raw = drawing.drawingOrigin;
    if (!raw || typeof raw !== 'object') return null;
    const x = Number(raw.x), z = Number(raw.z);
    return Number.isFinite(x) && Number.isFinite(z) ? { x, z } : null;
  };

  const paintGrid = () => {
    const R = window.DraftRender2D;
    if (!R) {
      throw new Error('MODEL.html: cannot paint the grid, render-2d.js did not '
        + 'load. Check the script order in the page head.');
    }
    // drawGrid2D builds its own screen transform instead of taking toS, so it
    // wants the camera in WORLD units. halfH is half the viewport height in
    // FEET: cssH/2 pixels divided by px-per-foot. Getting this wrong scales
    // the grid against everything else rather than hiding it, which is at
    // least loud.
    R.drawGrid2D(ctx, cssW, cssH, {
      datum: gridDatum(),
      halfH: cssH / 2 / view.scale,
      camX: view.cx,
      camZ: view.cz,
      // Three weights, not two: 1ft fine, 10ft major, 100ft coarse. The page
      // owns the look, as MODEL.dc.html:6559 does with its own greys.
      gridFine: skin['draw-grid-minor'],
      gridMajor: skin['draw-grid-major'],
      gridCoarse: skin['draw-grid-coarse'],
    });
  };

  // drawFloor2D's env, which is paintEnv() plus four keys only it reads.
  // Kept separate rather than folded into paintEnv() because of `colors`:
  // the name looks page-wide, but a grep of render-2d.js shows env.colors is
  // read at 848-886 and nowhere else -- i.e. by this painter only. Parking a
  // floor-specific five-colour set under a generic name in the shared env is
  // how the next person ends up wondering why changing it moves nothing.
  //
  // All seven keys are supplied, including the three the garage branch needs.
  // The default house has no garage slab, so that branch never runs HERE --
  // but old drawings must keep opening, and a garage slab with an undefined
  // taper offsets its dashed ring by NaN and silently draws nothing. Missing
  // env keys are the tier-2b lesson: an interface satisfied for the fixture
  // is not an interface satisfied.
  const floorEnv = () => {
    const S = window.DraftCutView.STANDARDS;
    return {
      ...paintEnv(),
      formatInchesOnly: window.DraftFormatters.formatInchesOnly,
      garageSlabThicknessIn: S.GARAGE_SLAB_THICKNESS_IN,
      garageEdgeDepthIn: S.GARAGE_EDGE_DEPTH_IN,
      // Derived exactly as MODEL.dc.html:1997 derives it -- at 45 degrees the
      // taper runs (edge - field) inches in plan. STANDARDS exports the two
      // depths but not this difference, so both pages compute it.
      garageEdgeTaperRunIn: S.GARAGE_EDGE_DEPTH_IN - S.GARAGE_SLAB_THICKNESS_IN,
      // drawFloor2D's own five-colour set. This page shows committed slabs
      // only -- it has no draw tool and no selection -- so the preview and
      // selected entries are wired to the committed look and to the brand
      // accent. Deliberate placeholders, not omissions: were a preview ever
      // to appear it would read as committed, which is visible and
      // diagnosable, rather than throwing on an absent colour.
      colors: {
        fill: skin['draw-floor'],
        fillPreview: skin['draw-floor'],
        stroke: skin['draw-floor-edge'],
        strokePreview: skin['draw-floor-edge'],
        selected: skin['accent'],
      },
    };
  };

  const paintFloors = () => {
    // Lazy and loud, like paintWalls. cut-view.js and formatters.js are new
    // to this page and they carry the load-order trap named in the head.
    const R = window.DraftRender2D;
    const CV = window.DraftCutView;
    const F = window.DraftFormatters;
    const missing = [!R && 'render-2d.js', !CV && 'cut-view.js', !F && 'formatters.js']
      .filter(Boolean);
    if (missing.length) {
      throw new Error(`MODEL.html: cannot paint floors, ${missing.join(' and ')} `
        + 'did not load. Check the script order in the page head.');
    }
    const env = floorEnv();
    floors().forEach(floor => {
      // drawFloor2D returns early under 2 points itself; this only skips the
      // degenerate ones the hand-rolled wash used to skip, so the count in
      // the readout keeps meaning the same thing.
      if ((floor.points || []).length < 2) return;
      R.drawFloor2D(ctx, toS, floor, {}, env);
    });
  };

  const paintLines = () => {
    ctx.save();
    ctx.strokeStyle = skin['draw-line'];
    ctx.lineWidth = 1;
    lines().forEach(line => {
      if (!line.start || !line.end) return;
      const a = toS(line.start), b = toS(line.end);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    });
    ctx.restore();
  };

  // EVERYTHING A PAINTER READS ARRIVES THROUGH env. That is what lets
  // render-2d.js serve this page and MODEL.dc.html from one copy: the module
  // owns the drawing, not the state of whoever is calling. Built at call time
  // from `skin` and the saved JSON, never captured at module scope.
  //
  // The contract is NINE keys, not the two that make a roof appear. It was
  // found by reading every `env.` in render-2d.js at once, after supplying two
  // and watching the page throw `env.roofSkeleton is not a function` -- which
  // is exactly what the loud painter was for. Discovering an interface one
  // exception at a time is how you end up believing you have finished.
  //
  //   drawWallSeg2D  wallTypes
  //   drawRoof2D     isPrinting offsetOutline roofSkeleton surfaceOpeningsFor
  //   drawShape2D    isPrinting areaLabel outlineAreaSqFt flooringTypes
  //                  shapeColor
  const paintEnv = () => ({
    wallTypes: window.DraftWallTypes.WALL_TYPES,
    shapeColor: skin['draw-shape'],
    flooringTypes: window.DraftDrawingFormat.FLOORING_TYPES,
    // This page never prints. When it does, this stops being a constant.
    isPrinting: false,
    offsetOutline: window.DraftGeometry2D.offsetOutline,
    roofSkeleton: window.DraftGeometry2D.roofSkeleton,
    // MODEL.dc.html also consults layer visibility and print flags here; this
    // page has neither yet, so an opening is shown whenever it is real.
    surfaceOpeningsFor: (hostType, hostId) => (drawing?.surfaceOpenings || [])
      .filter(o => o.hostType === hostType && o.hostId === hostId
        && (o.points || []).length >= 3),
    // DUPLICATED FROM MODEL.dc.html, deliberately and temporarily. Both are
    // pure -- a shoelace area and a unit label -- and both are needed by a
    // painter that has ALREADY been extracted, which makes them extraction
    // candidates rather than page code. Flagged to whoever holds board #1;
    // when they move, this env reads them instead of restating them.
    outlineAreaSqFt: points => {
      if (!Array.isArray(points) || points.length < 3) return 0;
      let doubled = 0;
      for (let i = 0; i < points.length; i += 1) {
        const a = points[i], b = points[(i + 1) % points.length];
        doubled += a.x * b.z - b.x * a.z;
      }
      return Math.abs(doubled) / 2;
    },
    areaLabel: sqFt => (sqFt > 0
      ? `${(Math.round(sqFt * 10) / 10).toLocaleString()} SQ FT` : ''),
  });

  const paintRoofs = () => {
    const R = window.DraftRender2D;
    roofs().forEach(roof => {
      if ((roof.points || []).length < 3) return;
      R.drawRoof2D(ctx, toS, roof, {}, paintEnv());
    });
  };

  const paintShapes = () => {
    const R = window.DraftRender2D;
    shapes().forEach(shape => {
      if ((shape.points || []).length < 2) return;
      R.drawShape2D(ctx, toS, shape, {}, paintEnv());
    });
  };

  const paintWalls = () => {
    // Lazy, so a load-order change cannot bind these to undefined at parse
    // time -- but LOUD, not guarded. An earlier version returned quietly when
    // a module was missing, which turns a broken page into an empty drawing:
    // no error, no warning, and a test asserting "nothing was drawn" passes
    // while the drafter's walls silently vanish. Gilligan's call, 3 Sep, and
    // it is the same shape as everything that cost this repo a night --
    // _stairAutoFit giving up silently, the vertex magnet merging corners
    // silently. A painter that cannot paint must say so.
    const WT = window.DraftWallTypes;
    const R = window.DraftRender2D;
    const missing = [!WT && 'wall-types.js', !R && 'render-2d.js'].filter(Boolean);
    if (missing.length) {
      throw new Error(`MODEL.html: cannot paint walls, ${missing.join(' and ')} `
        + 'did not load. Check the script order in the page head.');
    }
    // joins is optional in drawWallSeg2D — null gives capped ends instead of
    // mitred corners. Mitring needs MODEL's _wallJoins(), which is tier 2.
    walls().forEach(wall => {
      if (!wall.start || !wall.end) return;
      R.drawWallSeg2D(ctx, toS, wall, false, null, 'both', paintEnv());
    });
  };

  const paint = () => {
    ctx.save();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssW, cssH);
    ctx.fillStyle = skin['surface-page'];
    ctx.fillRect(0, 0, cssW, cssH);
    try {
      if (drawing) {
        paintGrid(); paintFloors(); paintRoofs(); paintShapes();
        paintLines(); paintWalls();
      }
    } catch (err) {
      // The throw above is only useful if someone SEES it. paint() runs on
      // every pan, zoom and resize, so an uncaught error here would be a
      // console full of noise behind a blank page; this puts it on screen
      // once, in the same notice the store errors use.
      ctx.restore();
      readout.textContent = 'painter failed';
      say('The drawing could not be painted',
        `<p><code>${String(err && err.message || err)}</code></p>`);
      throw err;
    }
    ctx.restore();
    updateReadout();
  };

  const levelName = () => (drawing?.levels || [])
    .find(level => Number(level.id) === activeLevelId())?.name || 'level';

  // THE READOUT IS THE ONLY INSTRUMENT ON THIS PAGE. Movie, 3 Sep: keep adding
  // to it, never prune -- he decides later what earns its place. So counts are
  // shown as SHOWN/TOTAL rather than shown alone: `walls 13/24` says both what
  // is painted and what the drawing holds, which makes the level filter
  // visible instead of something you have to trust. `floors 0/3` is what would
  // have shown the tier 2a floor bug on sight rather than after a screenshot.
  const shownOfTotal = (shown, all) => `${shown}/${(all || []).length}`;

  // Three states, matching gridDatum(): a point, the back-filled world origin
  // for a pre-datum drawing, or none at all -- and none means no grid.
  const datumLabel = () => {
    const d = gridDatum();
    if (!d) return 'none — no grid';
    const at = `${d.x.toFixed(2)},${d.z.toFixed(2)}`;
    return (drawing && !('drawingOrigin' in drawing)) ? `${at} (world, back-filled)` : at;
  };

  const updateReadout = () => {
    if (!drawing) return;
    readout.innerHTML =
      `walls <b>${shownOfTotal(walls().length, drawing.walls)}</b>   `
      + `lines <b>${shownOfTotal(lines().length, drawing.lines)}</b>   `
      + `floors <b>${shownOfTotal(floors().length, drawing.floors)}</b>   `
      + `roofs <b>${shownOfTotal(roofs().length, drawing.roofs)}</b>   `
      + `shapes <b>${shownOfTotal(shapes().length, drawing.shapes)}</b>\n`
      + `${levelName()} <b>${activeLevelId()}</b>/${(drawing.levels || []).length}   `
      + `view <b>${onActiveLevel().viewId || 'all'}</b>   `
      + `${theme}/${mode}   `
      + `scale <b>${view.scale.toFixed(2)}</b> px/ft   `
      // Why the grid is or is not there, so its absence reads as a fact about
      // the drawing rather than a broken page.
      + `datum <b>${datumLabel()}</b>`
      // Malformed geometry is dropped on load, as the old page drops it. Say
      // how much, so a thinner drawing is a fact rather than a mystery.
      + (dropped ? `   <b>${dropped} dropped</b>` : '');
  };

  // ── pan and zoom ──────────────────────────────────────────────────────────
  let dragging = null;
  canvas.addEventListener('pointerdown', e => {
    dragging = { sx: e.clientX, sy: e.clientY, cx: view.cx, cz: view.cz };
    canvas.classList.add('dragging');
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e => {
    if (!dragging) return;
    view.cx = dragging.cx - (e.clientX - dragging.sx) / view.scale;
    view.cz = dragging.cz - (e.clientY - dragging.sy) / view.scale;
    paint();
  });
  const endDrag = e => {
    if (!dragging) return;
    dragging = null;
    canvas.classList.remove('dragging');
    if (e && canvas.hasPointerCapture?.(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
  };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    // Zoom about the cursor: the world point under it must not move.
    const before = toWorld(sx, sy);
    const factor = Math.exp(-e.deltaY * 0.0015);
    view.scale = Math.max(0.25, Math.min(view.scale * factor, 200));
    const after = toWorld(sx, sy);
    view.cx += before.x - after.x;
    view.cz += before.z - after.z;
    paint();
  }, { passive: false });

  window.addEventListener('keydown', e => {
    if (e.key === '0') { fit(); paint(); }
  });
  window.addEventListener('resize', resize);

  // ── boot ──────────────────────────────────────────────────────────────────
  const boot = async () => {
    resize();
    let file = null;
    try {
      file = await window.SharedFileStore.loadSharedFile(BUCKET);
    } catch (err) {
      readout.textContent = 'store unavailable';
      say('The drawing store could not be opened',
        `<p>IndexedDB refused to open: <code>${String(err && err.message || err)}</code></p>
         <p>Private-browsing windows and blocked site data both do this.</p>`);
      return;
    }
    if (!file) {
      readout.textContent = 'no drawing saved';
      say('No saved drawing on this origin',
        `<p>Nothing is stored under <code>${BUCKET}</code> yet.</p>
         <p>Draw something in <code>MODEL.dc.html</code> on this same origin and save it,
            then reload this page. Storage is per-origin, so a drawing made on a
            different host or port will not appear here.</p>`);
      return;
    }

    let parsed;
    try {
      parsed = JSON.parse(await file.text());
    } catch (err) {
      readout.textContent = 'unreadable';
      say('The saved drawing could not be parsed',
        `<p><code>${String(err && err.message || err)}</code></p>`);
      return;
    }

    // The same envelope check MODEL.dc.html runs, from the same module, so this
    // page agrees with the old one about what a valid drawing is rather than
    // inventing a second opinion.
    const check = window.DraftDrawingFormat?.checkEnvelope(parsed)
      || { ok: true, reason: 'unchecked' };
    if (!check.ok) {
      readout.textContent = `envelope ${check.reason}`;
      say('That drawing is not one this page can read',
        `<p>checkEnvelope said <code>${check.reason}</code>.
            <code>version</code> means it was written by a newer MODEL than this page knows.</p>`);
      return;
    }

    // VALIDATE THE THREE TYPES NOTHING VALIDATED. Every other item type on a
    // saved drawing goes through drawing-format.js on load; walls, lines and
    // floors were inflated inline in MODEL.dc.html, so this page read them raw
    // -- no view whitelist, no wallType check, no zero-length rejection. The
    // rules now live in the shared module (drawing-format.js) and this is the
    // first caller of them.
    //
    // Rejected items are DROPPED, exactly as the old page drops them, and the
    // readout says how many so a malformed drawing reads as a fact rather than
    // as a page that quietly lost geometry.
    const F = window.DraftDrawingFormat;
    const levelIds = new Set((parsed.levels || []).map(level => Number(level.id)));
    const WT = window.DraftWallTypes;
    const raw = { walls: parsed.walls, lines: parsed.lines, floors: parsed.floors };
    drawing = {
      ...parsed,
      walls: F.walls(parsed.walls, levelIds, {
        wallTypes: WT.WALL_TYPES,
        legacyWallTypes: WT.LEGACY_WALL_TYPES,
        defaultWallTopFt: 8,
      }),
      lines: F.lines(parsed.lines, levelIds, {}),
      floors: F.floors(parsed.floors, levelIds, { defaultFloorThickness: 0.75 }),
    };
    dropped = ['walls', 'lines', 'floors']
      .map(k => (Array.isArray(raw[k]) ? raw[k].length : 0) - drawing[k].length)
      .reduce((a, b) => a + b, 0);
    fit();
    paint();
  };

  boot();
})();
</script>
</body>
</html>
