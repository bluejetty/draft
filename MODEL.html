<!DOCTYPE html>
<!--
  MODEL.html — the framework-free model space, tier 1.

  This is the migration target. It is NOT wired into the site: index.html still
  points at MODEL.dc.html, which serves every user until this page earns the
  swap. Both live at root together on purpose, so the old page keeps running
  untouched while this one is filled in.

  Tier 1 asks one question and answers only that: can a page with no framework
  read the drawing MODEL.dc.html saved, and paint it with the same painters?

  The Write Tier begins here: SAVE writes the drawing back to the shared
  store, revision-guarded, through the same drawing-format rules the old page
  saves through. This page still edits nothing — a save re-emits what it
  loaded — so the deep-compare proof (tests/write-tier.spec.js) is what says a
  save through this page equals a save through the old one.

  What it carries, and why the list is this short: render-2d.js reaches for
  zero globals — every outside thing it needs arrives in an `env` object — so
  the wall painter costs exactly one dependency, wall-types.js.

  Load order is not cosmetic. Eight modules in this repo capture a global at
  module scope (`const geo = window.DraftGeometry2D;`), which binds at load
  time, so a dependency arriving later never helps. None of the four below do
  that — checked, not assumed — but the moment tier 2 adds one, order becomes
  load-bearing. See MIGRATION-STATUS.md.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<title>Rough Drafter — Model Space</title>
<!-- Self-hosted (see vendor/fonts.css): no third-party request on the
     drafter's behalf, and the OFL text ships beside the files. -->
<link rel="stylesheet" href="vendor/fonts.css" />
<style>
  :root {
    color-scheme: dark;

    /* TYPE, DECLARED ONCE ON PURPOSE.
       MODEL.dc.html carries 284 inline `font-family:` declarations and the
       site 391 across seven files, so changing the typeface there is 391
       edits and a find-and-replace through a 22,000-line file. Here it is
       three lines. When the faces are redesigned, this block is the change
       and every later tier inherits it.

       Barlow / Barlow Condensed / DM Mono are all SIL OFL and vendored in
       vendor/fonts/ with the licence beside them -- nothing is fetched
       from a CDN. Each stack keeps a real fallback so the page is legible
       before the woff2 lands, and if a face is ever swapped for one with
       different metrics the fallback is what a reader sees mid-swap. */
    --font-ui:   'Barlow Condensed', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono: 'DM Mono', ui-monospace, Menlo, Consolas, monospace;

    /* COLOUR IS NOT DECLARED HERE. palette.js writes every --role token onto
       this element at boot, because 92% of MODEL's colour is set from
       JavaScript (canvas fills, inline styles) and only a table both the
       stylesheet and the painters can read reaches all of it. The fallbacks
       below are the night skin, so the page is never unpainted between parse
       and boot -- and never a SECOND definition to keep in step, because
       palette.js overwrites all of them. See RD-DOCUMENTS/SPEC-skins.md. */
    --surface-page: #1d1f20;
    --surface-panel: rgba(20,22,23,0.82);
    --surface-chip: #2a2d2e;
    --edge-panel: #3a3d3f;
    --ink-primary: #e7e5e2;
    --ink-secondary: #b9bcbe;
    --ink-quiet: #8b8f92;
    --accent: #f0b429;
  }
  html, body { margin:0; height:100%; overflow:hidden;
    /* Two properties rather than the `background:` shorthand: its layer list
       parses differently with and without an image, and a skin that later
       defines --surface-page-tex should not have to re-learn that. */
    background-color: var(--surface-page); background-image: var(--surface-page-tex, none);
    font: 13px/1.45 var(--font-body);
    color: var(--ink-primary); }
  #plan { display:block; width:100%; height:100%; cursor:grab; touch-action:none; }
  #plan.dragging { cursor:grabbing; }
  /* Over a grabbable corner. Declared AFTER .dragging so it wins while a
     corner is actually being dragged -- equal specificity, later rule. */
  #plan.over-corner, #plan.over-wall { cursor:move; }

  #readout { position:fixed; left:12px; bottom:12px; z-index:5;
    background-color: var(--surface-panel); background-image: var(--surface-panel-tex, none);
    border:1px solid var(--edge-panel); border-radius:6px;
    padding:8px 11px; white-space:pre; pointer-events:none;
    /* Instrument text: tabular figures so the counts do not jitter as they
       change, and the mono face so a column of numbers reads as a column. */
    font-family: var(--font-mono); font-size:12px;
    font-variant-numeric:tabular-nums; letter-spacing:0.01em; }
  #readout b { color: var(--accent); font-weight:600; }

  #hint { position:fixed; right:12px; bottom:12px; z-index:5; color: var(--ink-quiet);
    font-family: var(--font-ui); font-size:12px; letter-spacing:0.04em;
    text-transform:uppercase; pointer-events:none; }

  #save { position:fixed; right:12px; top:12px; z-index:5; display:none;
    font-family: var(--font-ui); font-size:13px; font-weight:600;
    letter-spacing:0.06em; text-transform:uppercase;
    color: var(--ink-primary); cursor:pointer;
    background-color: var(--surface-chip); background-image: var(--surface-chip-tex, none);
    border:1px solid var(--edge-panel); border-radius:6px; padding:7px 16px; }
  #save.show { display:block; }
  #save:disabled { color: var(--ink-quiet); cursor:default; }
  /* Unsaved edits. The accent is the page's one attention colour, so the
     button stops being furniture the moment there is something to lose. */
  #save.dirty { color: var(--accent); border-color: var(--accent); }

  /* RUNG 2's QUIET NOTE. A page holding an unsaved edit re-reads nothing when
     another page writes — throwing away this drafter's work to avoid throwing
     away someone else's is the defect the ruling exists to remove — so the
     only thing left to do is say so. Quiet on purpose: it reports a fact about
     the file, it does not ask for a decision, and it sits under SAVE rather
     than over the drawing. */
  #elsewhere { position:fixed; right:12px; top:46px; z-index:5;
    font-family: var(--font-ui); font-size:11px; letter-spacing:0.06em;
    text-transform:uppercase; color: var(--ink-quiet);
    background-color: var(--surface-chip); background-image: var(--surface-chip-tex, none);
    border:1px solid var(--edge-panel); border-radius:6px; padding:5px 10px; }
  #elsewhere[hidden] { display:none; }

  /* RUNG 3's READ-ONLY BANNER. It names the holder because "somebody is
     editing this" is not something a drafter can act on, and it carries the one
     press that resolves it. Sat under SAVE with the change note, so the page has
     one place where it says things about the file rather than three. */
  #lease { position:fixed; right:12px; top:46px; z-index:6;
    display:flex; gap:10px; align-items:center;
    font-family: var(--font-ui); font-size:11px; letter-spacing:0.06em;
    text-transform:uppercase; color: var(--ink-primary);
    background-color: var(--surface-chip); background-image: var(--surface-chip-tex, none);
    border:1px solid var(--accent); border-radius:6px; padding:5px 10px; }
  #lease[hidden] { display:none; }
  #take-over { font:inherit; letter-spacing:inherit; text-transform:inherit;
    color: var(--accent); background:none; border:1px solid var(--accent);
    border-radius:4px; padding:3px 8px; cursor:pointer; }
  /* The change note steps down when the banner is up, so they never overlap. */
  body[data-lease-held="0"] #elsewhere { top:78px; }

  /* TIER 3b chrome: the level and view switchers. Same panel idiom as the
     readout, top-left so it clears #save (top-right) and #hint (bottom-right)
     at a narrow width.

     THE [hidden] RULE IS LOAD-BEARING, not tidiness. `display:flex` on the bar
     beats the browser's own `[hidden] { display:none }`, so without this line
     `viewWrap.hidden = true` would set the attribute, change nothing on
     screen, and leave a picker offering a choice that does nothing on ROOF
     and SITE -- hidden in the DOM and visible to the drafter. */
  #chrome { position:fixed; left:12px; top:12px; z-index:5;
    display:flex; gap:10px; align-items:center; }
  #chrome[hidden], #chrome label[hidden] { display:none; }
  #chrome label { display:flex; align-items:center; gap:6px;
    font-family: var(--font-ui); font-size:11px; letter-spacing:0.06em;
    text-transform:uppercase; color: var(--ink-quiet); }
  /* TIER 3c, and §3.4 of its order is the reason these are BUTTONS. The old
     page deletes with a keybinding over a SELECT selection; this page's stated
     drafter is on an iPad and has no keyboard, so a verb reachable only by
     Ctrl/Delete is a verb half its audience cannot use. The key works too. */
  #chrome button { font-family: var(--font-ui); font-size:12px; font-weight:600;
    letter-spacing:0.04em; text-transform:uppercase; cursor:pointer;
    color: var(--ink-primary);
    background-color: var(--surface-chip); background-image: var(--surface-chip-tex, none);
    border:1px solid var(--edge-panel); border-radius:6px; padding:6px 12px; }
  #chrome button[hidden] { display:none; }
  /* Armed. The accent is the page's one attention colour, and a drafter
     mid-gesture must be able to see that the next tap draws. */
  #chrome button.armed { color: var(--accent); border-color: var(--accent); }

  #chrome select { font-family: var(--font-ui); font-size:12px;
    color: var(--ink-primary); cursor:pointer;
    background-color: var(--surface-chip); background-image: var(--surface-chip-tex, none);
    border:1px solid var(--edge-panel); border-radius:6px; padding:5px 8px; }

  /* The empty and error states say what to do, because a black screen with
     nothing on it is indistinguishable from a page that failed to boot. */
  #notice { position:fixed; inset:0; z-index:6; display:none;
    align-items:center; justify-content:center; padding:24px; text-align:center; }
  #notice.show { display:flex; }
  #notice div { max-width:34em; }
  #notice h1 { font-family: var(--font-ui); font-size:19px; font-weight:600;
    letter-spacing:0.02em; margin:0 0 8px; color: var(--accent); }
  #notice p { margin:0 0 6px; color: var(--ink-secondary); }
  #notice code { font-family: var(--font-mono); font-size:0.92em;
    color: var(--ink-primary); padding:1px 5px; border-radius:3px;
    background-color: var(--surface-chip); background-image: var(--surface-chip-tex, none); }
</style>
</head>
<body>

<canvas id="plan"></canvas>
<div id="readout">loading…</div>
<div id="chrome" hidden>
  <label>Level <select id="level-pick" data-level-pick></select></label>
  <label id="view-wrap">View <select id="view-pick" data-view-pick></select></label>
  <button id="draw-wall" type="button" data-draw-wall>Draw wall</button>
  <button id="delete-wall" type="button" data-delete-wall hidden>Delete wall</button>
</div>
<button id="save" type="button" data-model-save>SAVE</button>
<div id="elsewhere" data-changed-elsewhere hidden>changed elsewhere</div>
<div id="lease" data-lease-banner hidden>
  <span data-lease-message></span>
  <button id="take-over" type="button" data-take-over>TAKE OVER</button>
</div>
<div id="hint">drag to pan · wheel to zoom · 0 to fit</div>
<div id="notice"><div id="notice-body"></div></div>

<!-- ORDER IS LOAD-BEARING, not tidiness. cut-view.js destructures
     window.DraftWallTypes and window.DraftFormatters at MODULE SCOPE
     (cut-view.js:28-29), so it throws while loading if either comes after
     it -- and a page that throws in the head paints nothing at all. The
     tier-1 spec pins this exact list, in this exact order, for that reason.
     Everything else here is a lazy accessor and would not care. -->
<script src="./palette.js"></script>
<script src="./layer-views.js"></script>
<script src="./geometry-2d.js"></script>
<script src="./shared-file-store.js"></script>
<script src="./wall-types.js"></script>
<script src="./formatters.js"></script>
<script src="./cut-view.js"></script>
<script src="./drawing-format.js"></script>
<script src="./render-2d.js"></script>
<!-- Fixtures. fixture-geometry.js after wall-types.js (it reads the assembly
     width lazily, so this is convention rather than a hard order) and
     closets.js for the four closet dimensions and the door table the painter
     asks for. Neither is a painter: they are the ANSWERS drawFixture2D wants
     from its caller, which lived in MODEL.dc.html until now and are the whole
     reason this page drew no fixtures. -->
<script src="./fixture-geometry.js"></script>
<script src="./closets.js"></script>
<!-- Cut marks. cut-marks.js is the geometry; profile-manager.js is here for
     ONE reason and it is worth naming, because it is the first non-drawing
     dependency this page has taken: two of the four inputs a cut needs are not
     in the saved drawing. `structureStandards` -- is the auto-elevation ring
     on, and which bubble style -- is the drafter's OFFICE STANDARD, held in
     localStorage by profile-manager and read with getActive('standards'). The
     alternative was office defaults, which would have shown four elevation
     marks to a drafter who had switched them off. -->
<script src="./cut-marks.js"></script>
<script src="./profile-manager.js"></script>
<!-- Stairs. stair-geometry.js is the riser math and the plan parts; it is not
     a painter either, it is the two ANSWERS drawStairs2D asks its caller for
     (layoutFor, partsFor), which lived on the MODEL.dc.html component.
     level-assembly.js loads FIRST because the stair's rise is the level below's
     wall height plus this level's floor, and until now the table saying what a
     level is made of existed in three separate copies. Without it this page
     would have had to fall back on each stair's STORED rise -- which the bone
     treats as a fallback, not the truth, so the two boards would have drawn
     different riser counts for the same drawing after any wall-height edit. -->
<script src="./level-assembly.js"></script>
<script src="./stair-geometry.js"></script>

<script>
(() => {
  // ── skin ──────────────────────────────────────────────────────────────────
  // Four dashboards: RUFF DRAFTER and ROUGH DRAFTER, each night and day
  // (RD-DOCUMENTS/SPEC-skins.md). The skins themselves get designed later;
  // what exists now is the seam they arrive through.
  //
  // ?theme= and ?mode= are the seam, deliberately: a URL is the cheapest way
  // for a designer to see a skin, and for a spec to assert one, before any
  // settings UI exists. When the profile package carries the choice, this
  // reads that first and the query string stays as an override.
  //
  // `skin` is captured ONCE at module scope, which is a load-order hazard this
  // repo has been bitten by 13 times across 8 files -- so palette.js is loaded
  // above and this throws here, naming itself, rather than painting undefined
  // three functions away.
  // resolve() throws on an unknown name, which is right for a painter asking
  // for a role that does not exist. It is WRONG here: a typo in a URL someone
  // pasted should not blank the page. So the query string is validated against
  // the palette's own lists and falls back, loudly, to the default skin.
  const params = new URLSearchParams(location.search);
  const pick = (name, allowed, fallback) => {
    const asked = params.get(name);
    if (!asked || allowed.includes(asked)) return asked || fallback;
    console.warn(`MODEL: unknown ${name} "${asked}"; using ${fallback}. `
      + `Known: ${allowed.join(', ')}`);
    return fallback;
  };
  const theme = pick('theme', window.DraftPalette.THEMES, 'ruff');
  const mode = pick('mode', window.DraftPalette.MODES, 'night');
  const skin = window.DraftPalette.apply(document, theme, mode);
  'use strict';

  const BUCKET = 'model-drawing';
  const canvas = document.getElementById('plan');
  const ctx = canvas.getContext('2d');
  const readout = document.getElementById('readout');
  const notice = document.getElementById('notice');
  const noticeBody = document.getElementById('notice-body');
  const saveButton = document.getElementById('save');
  const elsewhereNote = document.getElementById('elsewhere');
  const leaseBanner = document.getElementById('lease');
  const leaseMessage = leaseBanner && leaseBanner.querySelector('[data-lease-message]');
  const takeOverButton = document.getElementById('take-over');

  // View state in world units (feet). scale is screen pixels per foot.
  // Deliberately plain arithmetic: MODEL.dc.html projects through a three.js
  // camera, but the painters take `toS` as a parameter and never ask where it
  // came from, so tier 1 owes three.js nothing.
  const view = { cx: 0, cz: 0, scale: 6 };
  let drawing = null;
  // The bucket revision the drawing was read at, handed back as `ifRev` on
  // save so a write that would land on top of someone else's is REFUSED
  // rather than silent — the same guard MODEL.dc.html saves under.
  let storeRev = null;
  // One shared object per corner, rebuilt on every load. Only wall endpoints
  // go in it today, because mitring is the only thing that needs identity;
  // MODEL.dc.html pools lines, floors and roofs too, and this grows to match
  // when something on this page needs them to share a corner.
  let vertexPool = [];
  let dropped = 0;   // items the format module rejected on load

  const say = (title, body) => {
    noticeBody.innerHTML = `<h1>${title}</h1>${body}`;
    notice.classList.add('show');
  };

  // ── canvas sizing ─────────────────────────────────────────────────────────
  // Backing store in device pixels, drawing in CSS pixels, so lines are crisp
  // on a retina screen without every painter having to know the ratio.
  let dpr = 1, cssW = 0, cssH = 0;
  const resize = () => {
    dpr = window.devicePixelRatio || 1;
    cssW = canvas.clientWidth;
    cssH = canvas.clientHeight;
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    paint();
  };

  // ── world → screen ────────────────────────────────────────────────────────
  const toS = p => ({
    x: (p.x - view.cx) * view.scale + cssW / 2,
    y: (p.z - view.cz) * view.scale + cssH / 2,
  });
  const toWorld = (sx, sy) => ({
    x: (sx - cssW / 2) / view.scale + view.cx,
    z: (sy - cssH / 2) / view.scale + view.cz,
  });

  // ── which level, and which drawing OF that level ──────────────────────────
  // Tier 1 painted all five levels at once, stacked. A drafter looks at one
  // level at a time, so this picks one -- and picking one is not
  // `levelId === active`, because a level is not one drawing. MAIN FL has a
  // walls plan, a floor layout, a stair drawing and an electrical plan;
  // FOUNDATION has basement walls and the concrete below them. That table is
  // layer-views.js, already shared with LAYOUT, so this reads it rather than
  // restating it.
  //
  // MAIN_FLOOR is an ID (3), not an index. MODEL.dc.html's own
  // state.activeLevelIdx is an INDEX into DEFAULT_LEVELS, and for the default
  // list index 3 also happens to be id 3 -- they stop agreeing the moment a
  // level is inserted. See RD-DOCUMENTS/SPEC-model-html-tiers.md.
  const MAIN_FLOOR_LEVEL_ID = 3;
  const levelIds = () => (drawing?.levels || []).map(level => Number(level.id));
  const activeLevelId = () => {
    const asked = Number(params.get('level'));
    if (Number.isFinite(asked) && levelIds().includes(asked)) return asked;
    if (params.get('level') !== null && drawing) {
      console.warn(`MODEL: unknown level "${params.get('level')}"; using MAIN FL. `
        + `Known: ${levelIds().join(', ')}`);
    }
    return levelIds().includes(MAIN_FLOOR_LEVEL_ID) ? MAIN_FLOOR_LEVEL_ID : levelIds()[0];
  };

  // ── what is on the page ───────────────────────────────────────────────────
  // FIVE RULES, NOT ONE, measured from MODEL.dc.html:6505-6513:
  //   walls / lines / floors  filter by level AND view
  //   roofs / outlines        filter by level ONLY -- no view filter at all
  //   and the view filter switches ITSELF OFF on a level that has no layer
  //   views (ROOF, SITE), which show everything they hold.
  //
  // The trap in the third rule: floors default to view 'floor', not 'plan'
  // (MODEL.dc.html:2905). Writing `view === 'plan'` hides every floor in the
  // drawing and reads exactly like a broken painter.
  // ?view= PICKS THE DRAWING, and without it half the level is unreachable.
  //
  // Tier 2a defaulted the layer view and offered no way to change it, which
  // quietly switched the floors off: MAIN FL and 2ND FL default to the walls
  // plan, FOUNDATION to the concrete, and a floor saves with `view: 'floor'`
  // (MODEL.dc.html:2905). So `(view || 'plan') === viewId` was false for every
  // floor on every reachable view, paintFloors() drew nothing anywhere, and
  // the readout said `floors 0` on a drawing that has them. Tier 1 painted
  // them; tier 2a turned them off and no spec noticed, because the specs
  // asserted walls.
  //
  // A level is not one drawing. Choosing the level and not the drawing is
  // choosing half.
  const activeViewId = () => {
    const LV = window.DraftLayerViews;
    const levelId = activeLevelId();
    const views = LV.layerViewsForLevelId(levelId);
    if (!views.length) return null;               // ROOF / SITE hold everything
    const asked = params.get('view');
    if (asked && views.some(v => v.id === asked)) return asked;
    if (asked) {
      console.warn(`MODEL: level ${levelId} has no view "${asked}"; using its `
        + `default. Known: ${views.map(v => v.id).join(', ')}`);
    }
    return LV.defaultLayerViewId(levelId);
  };

  const onActiveLevel = () => {
    const LV = window.DraftLayerViews;
    const levelId = activeLevelId();
    const views = LV.layerViewsForLevelId(levelId);
    const viewId = activeViewId();
    // THE FALLBACK DIFFERS BY ITEM TYPE. Measured, not assumed: every
    // `.view || '...'` in MODEL.dc.html reads 'plan' -- wall, line, stair,
    // opening, fixture, device, seg, 20-odd sites -- EXCEPT floors, which
    // read 'floor' (MODEL.dc.html:2905, 9029, 9089, 9098, 9162, 17025).
    //
    // A floor outline's home layer set is FLOOR, or FOUNDATION where it is a
    // concrete slab; it was never a plan-set item. Defaulting floors to
    // 'plan' put a view-less floor on the wrong layer set -- invisible on
    // every fixture, because a floor drawn by the old page always carries an
    // explicit `view`, and visible only on an older saved drawing whose
    // floors predate the field. Those are exactly the drawings that have to
    // keep opening, so the spec builds that case by hand.
    const onPlan = (item, fallback = 'plan') =>
      !views.length || (item.view || fallback) === viewId;
    const byLevel = item => Number(item.levelId) === levelId;
    return { levelId, viewId, onPlan, byLevel };
  };
  const walls = () => (drawing?.walls || [])
    .filter(w => { const f = onActiveLevel(); return f.byLevel(w) && f.onPlan(w); });
  const lines = () => (drawing?.lines || [])
    .filter(l => { const f = onActiveLevel(); return f.byLevel(l) && f.onPlan(l); });
  const floors = () => (drawing?.floors || [])
    .filter(x => { const f = onActiveLevel(); return f.byLevel(x) && f.onPlan(x, 'floor'); });
  // Rules four and five: LEVEL ONLY. A roof footprint and a reference shape are
  // level-wide -- every drawing of the level shows them -- so they take no view
  // filter at all. Copying the walls line here would hide both on FOUNDATION.
  const roofs = () => (drawing?.roofs || [])
    .filter(r => onActiveLevel().byLevel(r));
  // DIMENSIONS TAKE NO FALLBACK, and that is not an oversight -- it is the
  // one collection whose invariant is guaranteed upstream. MODEL.dc.html:8929
  // filters `dimension.view === view` with no `|| 'plan'`, because
  // format.dimensions (drawing-format.js:101) DROPS any dimension whose view
  // is not one of plan/floor/e-power/foundation. By the time anything filters
  // them, every survivor carries an explicit view.
  //
  // So copying the walls line here would be worse than redundant: `|| 'plan'`
  // can only fire on a dimension the normaliser already rejected, which means
  // it would only ever run on geometry that is not in the array. Writing the
  // filter to match the guarantee is what makes the guarantee readable.
  const dimensions = () => (drawing?.dimensions || [])
    .filter(d => { const f = onActiveLevel(); return f.byLevel(d)
      && (f.viewId == null || d.view === f.viewId); });
  // NOTES TAKE THE DIMENSION RULE -- level, plus view where the level has views
  // -- and then one exclusion the bone applies on top of it. MODEL.dc.html:7025
  // filters `note.view !== 'stair'` AFTER _activeNotes(), which reads redundant
  // beside the view match and is not: a level with NO layer views matches every
  // note it holds, stair ones included, and the STAIR workspace is a separate
  // surface with its own painter (drawStairNotes2D, tier 3).
  const notes = () => (drawing?.notes || [])
    .filter(n => { const f = onActiveLevel(); return f.byLevel(n)
      && (f.viewId == null || n.view === f.viewId)
      && n.view !== 'stair'; });
  // FIXTURES INHERIT THEIR WALL'S VISIBILITY -- they do not carry a view rule
  // of their own. MODEL.dc.html:_activeFixtures keeps a fixture whose levelId
  // matches AND whose wallId is in the set of walls the page is showing, and
  // the note above it says why in as many words: "a fixture inherits the
  // layer-view exclusion rather than having one of its own", and that
  // inheritance is the only thing keeping a sink unselectable on the ELECTRIC
  // sheet. Filtering on `fixture.view` here would look equivalent and would
  // not be -- a fixture on a hidden wall would come back.
  //
  // ONE DIFFERENCE, STATED RATHER THAN HIDDEN. The bone unions in
  // _sharedContextWalls() -- the foundation walls it ghosts under a plan, the
  // plan walls it ghosts under e-power. This page paints no context walls at
  // all (walls() is the plain view filter), so keying off walls() gives it the
  // same RULE against a smaller set: a fixture shows when its host wall shows
  // HERE. When context walls arrive, this follows them with no edit, which is
  // the reason it reads walls() rather than repeating the filter.
  const fixtures = () => {
    const shown = new Set(walls().map(w => w.id));
    return (drawing?.fixtures || [])
      .filter(fx => onActiveLevel().byLevel(fx) && shown.has(fx.wallId));
  };
  // CUTS TAKE NO LEVEL FILTER, and that is the bone's rule rather than an
  // omission here. _drawCuts2D (MODEL.dc.html:7432) is called ungated -- no
  // activeVisible, no view test -- because a section cut is a fact about the
  // BUILDING, not about one storey: the same line through the house is what
  // the drafter wants to see whichever floor is on screen. The four auto marks
  // carry levelId: null, which says the same thing in the data.
  const cuts = () => drawing?.cuts || [];
  // STAIRS FILTER STRICTLY ON view, and that is copied deliberately rather
  // than routed through onPlan(). _activeStairs (MODEL.dc.html) reads
  // `stair.view === view` with NO `|| 'plan'` fallback, unlike every wall,
  // line and fixture beside it. So a stair saved without a view is hidden on
  // a level that has layer views, and shown on one that has none. Reusing
  // onPlan() here would have quietly REVEALED those stairs on this page only.
  const stairs = () => {
    const { levelId, viewId } = onActiveLevel();
    const views = window.DraftLayerViews.layerViewsForLevelId(levelId);
    return (drawing?.stairs || [])
      .filter(stair => Number(stair.levelId) === levelId
        && (!views.length || stair.view === viewId));
  };
  // UNDERLAYS TAKE THE LEVEL FILTER ONLY -- no view filter, because an
  // underlay is a tracing image for the whole level, not for one layer set.
  // That is the painter's own rule (drawUnderlays2D skips on
  // `underlay.levelId !== env.activeLevel.id` and tests nothing else), copied
  // rather than invented.
  const underlays = () => (drawing?.underlays || [])
    .filter(underlay => Number(underlay.levelId) === activeLevelId());

  // Decoded tracing images, by underlay id. Empty until the async loader
  // fills it, which is why paint() must tolerate a missing image -- and the
  // painter already does: `if (!image) continue`.
  const underlayImages = new Map();

  // RASTER ONLY, AND THE PDF CASE IS NAMED RATHER THAN SKIPPED.
  //
  // MODEL.dc.html decodes both kinds: images straight from the blob, PDF pages
  // re-rendered through pdf.js. Carrying pdf.js here costs 1.37 MB
  // (vendor/pdf-3.11.174.min.js + its worker) against a page whose whole claim
  // is an exact, short dependency list -- so this page decodes rasters and
  // says so about the rest. The bone's loader already contains the same
  // refusal (`if (!window.pdfjsLib) continue;`); the difference is that this
  // page admits it on screen instead of drawing nothing and looking broken.
  const loadUnderlayImages = async () => {
    for (const underlay of (drawing?.underlays || [])) {
      if (underlayImages.has(underlay.id) || underlay.kind === 'pdf') continue;
      try {
        const file = await window.SharedFileStore.loadNamedFile(underlay.id, 'underlays');
        if (!file) continue;
        const bitmap = await createImageBitmap(file).catch(() => null);
        if (!bitmap) continue;
        const canvas = document.createElement('canvas');
        canvas.width = bitmap.width;
        canvas.height = bitmap.height;
        canvas.getContext('2d').drawImage(bitmap, 0, 0);
        bitmap.close();
        underlayImages.set(underlay.id, canvas);
        // Each image repaints as it lands, rather than one repaint at the end:
        // a large tracing image can take a moment and the drawing above it is
        // already correct without it.
        paint();
        updateReadout();
      } catch (error) {
        console.warn(`MODEL: underlay ${underlay.id} failed to load:`, error);
      }
    }
  };

  const shapes = () => (drawing?.shapes || [])
    .filter(sh => onActiveLevel().byLevel(sh));
  // Outlines take the same LEVEL-ONLY rule as roofs -- rule four above. They
  // are the room and garage footprints, level-wide, so no view filter.
  const outlines = () => (drawing?.outlines || [])
    .filter(o => onActiveLevel().byLevel(o));

  // Every point that defines the drawing's extent, for fit-to-content.
  const allPoints = () => {
    const pts = [];
    walls().forEach(w => { if (w.start && w.end) pts.push(w.start, w.end); });
    lines().forEach(l => { if (l.start && l.end) pts.push(l.start, l.end); });
    floors().forEach(f => (f.points || []).forEach(p => pts.push(p)));
    return pts.filter(p => Number.isFinite(p?.x) && Number.isFinite(p?.z));
  };

  const fit = () => {
    const pts = allPoints();
    if (!pts.length) { view.cx = 0; view.cz = 0; view.scale = 6; return; }
    let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
    pts.forEach(p => {
      if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
      if (p.z < minZ) minZ = p.z; if (p.z > maxZ) maxZ = p.z;
    });
    view.cx = (minX + maxX) / 2;
    view.cz = (minZ + maxZ) / 2;
    // A drawing one foot across must not zoom to a thousand pixels per foot,
    // and a zero-extent one must not divide by zero.
    const spanX = Math.max(maxX - minX, 1);
    const spanZ = Math.max(maxZ - minZ, 1);
    const margin = 0.86;
    view.scale = Math.min(cssW / spanX, cssH / spanZ) * margin;
    view.scale = Math.max(0.25, Math.min(view.scale, 200));
  };

  // ── painting ──────────────────────────────────────────────────────────────
  // THE DATUM IS THE DRAFTER'S ZERO, not the world's. MODEL.dc.html sets
  // state.drawingOrigin from the drafter's FIRST CLICK (MODEL.dc.html:10360),
  // so the point they start on reads as 0,0 from then on, and drawGrid2D
  // anchors the grid to it. Movie, 3 Sep: "that way he always first clicks on
  // 0,0."
  //
  // No click, no datum, and therefore NO GRID. That is deliberate, not a gap:
  // tests/registration-grid.spec.js asserts it by name -- "an untouched model
  // space draws no grid, and the first node sets the datum" -- and the grid
  // cannot be anchored to a point the drafter has not chosen yet. Tier 1's
  // hand-rolled grid drew always, aligned to world 0,0, which was a
  // divergence from the old page rather than a feature.
  //
  // ABSENT AND NULL MEAN DIFFERENT THINGS. This is the tier-2a floors bug's
  // exact shape, so it is spelled out rather than compressed. MODEL.dc.html
  // :5160 reads:
  //     'drawingOrigin' in saved ? normalise(saved.drawingOrigin) : {x:0,z:0}
  // Absent = a drawing made before the datum existed. It was drawn on the
  // world grid, so 0,0 is what leaves every coordinate where it is. Explicit
  // null = "no origin yet", which is where NEW starts and how it avoids
  // silently adopting 0,0.
  //
  // `drawing.drawingOrigin || null` would collapse the two and strip the grid
  // from every old drawing -- and no fixture would catch it, because the old
  // page always writes the key now.
  const gridDatum = () => {
    if (!drawing) return null;
    if (!('drawingOrigin' in drawing)) return { x: 0, z: 0 };
    const raw = drawing.drawingOrigin;
    if (!raw || typeof raw !== 'object') return null;
    const x = Number(raw.x), z = Number(raw.z);
    return Number.isFinite(x) && Number.isFinite(z) ? { x, z } : null;
  };

  const paintGrid = () => {
    const R = window.DraftRender2D;
    if (!R) {
      throw new Error('MODEL.html: cannot paint the grid, render-2d.js did not '
        + 'load. Check the script order in the page head.');
    }
    // drawGrid2D builds its own screen transform instead of taking toS, so it
    // wants the camera in WORLD units. halfH is half the viewport height in
    // FEET: cssH/2 pixels divided by px-per-foot. Getting this wrong scales
    // the grid against everything else rather than hiding it, which is at
    // least loud.
    R.drawGrid2D(ctx, cssW, cssH, {
      datum: gridDatum(),
      halfH: cssH / 2 / view.scale,
      camX: view.cx,
      camZ: view.cz,
      // Three weights, not two: 1ft fine, 10ft major, 100ft coarse. The page
      // owns the look, as MODEL.dc.html:6559 does with its own greys.
      gridFine: skin['draw-grid-minor'],
      gridMajor: skin['draw-grid-major'],
      gridCoarse: skin['draw-grid-coarse'],
    });
  };

  // drawFloor2D's env, which is paintEnv() plus four keys only it reads.
  // Kept separate rather than folded into paintEnv() because of `colors`:
  // the name looks page-wide, but a grep of render-2d.js shows env.colors is
  // read at 848-886 and nowhere else -- i.e. by this painter only. Parking a
  // floor-specific five-colour set under a generic name in the shared env is
  // how the next person ends up wondering why changing it moves nothing.
  //
  // All seven keys are supplied, including the three the garage branch needs.
  // The default house has no garage slab, so that branch never runs HERE --
  // but old drawings must keep opening, and a garage slab with an undefined
  // taper offsets its dashed ring by NaN and silently draws nothing. Missing
  // env keys are the tier-2b lesson: an interface satisfied for the fixture
  // is not an interface satisfied.
  const floorEnv = () => {
    const S = window.DraftCutView.STANDARDS;
    return {
      ...paintEnv(),
      formatInchesOnly: window.DraftFormatters.formatInchesOnly,
      garageSlabThicknessIn: S.GARAGE_SLAB_THICKNESS_IN,
      garageEdgeDepthIn: S.GARAGE_EDGE_DEPTH_IN,
      // Derived exactly as MODEL.dc.html:1997 derives it -- at 45 degrees the
      // taper runs (edge - field) inches in plan. STANDARDS exports the two
      // depths but not this difference, so both pages compute it.
      garageEdgeTaperRunIn: S.GARAGE_EDGE_DEPTH_IN - S.GARAGE_SLAB_THICKNESS_IN,
      // drawFloor2D's own five-colour set. This page shows committed slabs
      // only -- it has no draw tool and no selection -- so the preview and
      // selected entries are wired to the committed look and to the brand
      // accent. Deliberate placeholders, not omissions: were a preview ever
      // to appear it would read as committed, which is visible and
      // diagnosable, rather than throwing on an absent colour.
      colors: {
        fill: skin['draw-floor'],
        fillPreview: skin['draw-floor'],
        stroke: skin['draw-floor-edge'],
        strokePreview: skin['draw-floor-edge'],
        selected: skin['accent'],
      },
    };
  };

  const paintFloors = () => {
    // Lazy and loud, like paintWalls. cut-view.js and formatters.js are new
    // to this page and they carry the load-order trap named in the head.
    const R = window.DraftRender2D;
    const CV = window.DraftCutView;
    const F = window.DraftFormatters;
    const missing = [!R && 'render-2d.js', !CV && 'cut-view.js', !F && 'formatters.js']
      .filter(Boolean);
    if (missing.length) {
      throw new Error(`MODEL.html: cannot paint floors, ${missing.join(' and ')} `
        + 'did not load. Check the script order in the page head.');
    }
    const env = floorEnv();
    floors().forEach(floor => {
      // drawFloor2D returns early under 2 points itself; this only skips the
      // degenerate ones the hand-rolled wash used to skip, so the count in
      // the readout keeps meaning the same thing.
      if ((floor.points || []).length < 2) return;
      R.drawFloor2D(ctx, toS, floor, {}, env);
    });
  };

  const paintLines = () => {
    ctx.save();
    ctx.strokeStyle = skin['draw-line'];
    ctx.lineWidth = 1;
    lines().forEach(line => {
      if (!line.start || !line.end) return;
      const a = toS(line.start), b = toS(line.end);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    });
    ctx.restore();
  };

  // EVERYTHING A PAINTER READS ARRIVES THROUGH env. That is what lets
  // render-2d.js serve this page and MODEL.dc.html from one copy: the module
  // owns the drawing, not the state of whoever is calling. Built at call time
  // from `skin` and the saved JSON, never captured at module scope.
  //
  // The contract is NINE keys, not the two that make a roof appear. It was
  // found by reading every `env.` in render-2d.js at once, after supplying two
  // and watching the page throw `env.roofSkeleton is not a function` -- which
  // is exactly what the loud painter was for. Discovering an interface one
  // exception at a time is how you end up believing you have finished.
  //
  //   drawWallSeg2D  wallTypes
  //   drawRoof2D     isPrinting offsetOutline roofSkeleton surfaceOpeningsFor
  //                  colors.roof colors.roofGuide
  //   drawShape2D    isPrinting areaLabel outlineAreaSqFt flooringTypes
  //                  shapeColor
  const paintEnv = () => ({
    wallTypes: window.DraftWallTypes.WALL_TYPES,
    shapeColor: skin['draw-shape'],
    // THE ROOF READS THE SKIN, and that is the whole point of the pair.
    // drawRoof2D used one brown for both skins -- #7a4a21, which is 6.64 on
    // the day page and 2.23 on the night one, under the 3.0 non-text floor.
    // It also left the dashed guides at 3.90, LOUDER than the footprint they
    // belong to, which inverts the reading day always had. The old page has
    // no night skin at all, so it keeps the literals through the painter's
    // fallbacks and is untouched; this page is the one that has two grounds.
    //
    // The fill wash and the GABLE / EAVE tags are DERIVED from colors.roof
    // inside the painter rather than passed, so they cannot drift apart from
    // the outline. Only the two roles cross this boundary.
    colors: {
      roof: skin['draw-roof'],
      roofGuide: skin['draw-roof-guide'],
    },
    flooringTypes: window.DraftDrawingFormat.FLOORING_TYPES,
    // This page never prints. When it does, this stops being a constant.
    isPrinting: false,
    offsetOutline: window.DraftGeometry2D.offsetOutline,
    roofSkeleton: window.DraftGeometry2D.roofSkeleton,
    // MODEL.dc.html also consults layer visibility and print flags here; this
    // page has neither yet, so an opening is shown whenever it is real.
    surfaceOpeningsFor: (hostType, hostId) => (drawing?.surfaceOpenings || [])
      .filter(o => o.hostType === hostType && o.hostId === hostId
        && (o.points || []).length >= 3),
    // DUPLICATED FROM MODEL.dc.html, deliberately and temporarily. Both are
    // pure -- a shoelace area and a unit label -- and both are needed by a
    // painter that has ALREADY been extracted, which makes them extraction
    // candidates rather than page code. Flagged to whoever holds board #1;
    // when they move, this env reads them instead of restating them.
    outlineAreaSqFt: points => {
      if (!Array.isArray(points) || points.length < 3) return 0;
      let doubled = 0;
      for (let i = 0; i < points.length; i += 1) {
        const a = points[i], b = points[(i + 1) % points.length];
        doubled += a.x * b.z - b.x * a.z;
      }
      return Math.abs(doubled) / 2;
    },
    areaLabel: sqFt => (sqFt > 0
      ? `${(Math.round(sqFt * 10) / 10).toLocaleString()} SQ FT` : ''),
  });

  const paintRoofs = () => {
    const R = window.DraftRender2D;
    roofs().forEach(roof => {
      if ((roof.points || []).length < 3) return;
      R.drawRoof2D(ctx, toS, roof, {}, paintEnv());
    });
  };

  const paintShapes = () => {
    const R = window.DraftRender2D;
    shapes().forEach(shape => {
      if ((shape.points || []).length < 2) return;
      R.drawShape2D(ctx, toS, shape, {}, paintEnv());
    });
  };

  // OUTLINES. The painter has been in render-2d.js since the extraction; what
  // kept it unreachable was three env keys resolving to `this._` methods on the
  // old page. They now live in geometry-2d.js and this page reads them from
  // there -- which is the whole difference between a painter that moved and a
  // painter that is shared.
  //
  // THE LIVE-EDITING KEYS ARE PASSED EXPLICITLY AS FALSE AND EMPTY, not left
  // undefined and not deleted. Two blocks of the painter are guarded on them --
  // the fenestration ghost (`boneyardActive && activeTool === 'fenestration'
  // && snapPt`) and the in-progress outline (`outlineDrawing &&
  // outlinePoints.length`) -- and this page, which reads and never writes, can
  // never enter either. MODEL.dc.html's own env says as much: "a caller working
  // from a saved drawing passes none of it and the preview branches stay
  // inert." Naming them here rather than relying on undefined means the day
  // this page grows an outline tool, the keys to fill are already listed and
  // the branches are already wired -- instead of a reader concluding the
  // painter has no preview and quietly building a second one.
  //
  // The six colours are copied verbatim from MODEL.dc.html:7441. They are
  // hardcoded in BOTH pages now, which is one literal set too many -- flagged
  // for whoever takes the palette work, not fixed here, because moving a colour
  // into palette.js is a decision about the drawing rather than about this lift.
  const paintOutlines = () => {
    const R = window.DraftRender2D;
    const G = window.DraftGeometry2D;
    R.drawOutlines2D(ctx, toS, {
      isPrinting: false,
      // No boneyard on this page: it holds no unplaced geometry and offers no
      // way to switch to it. The false is what selects the LEVEL colours below.
      boneyardActive: false,
      outlines: outlines(),
      boneyardOutlines: [],
      // Handles belong to the outline and select tools. This page has neither.
      showHandles: false,
      // Nothing is selectable yet, so nothing is selected. Returning false is
      // the honest answer; omitting the key would throw.
      isSelected: () => false,
      segmentCount: G.outlineSegmentCount,
      segment: G.outlineSegment,
      controlPoint: G.lineControlPoint,
      // Boneyard marks only. Unreachable with boneyardActive false, and present
      // so the reader can see the branch exists rather than infer it is gone.
      geometryFor: () => null,
      markPlacement: () => null,
      // Live interaction state -- inert here, listed here. See above.
      activeTool: null,
      fenestrationType: null,
      outlineGarage: null,
      snapPt: null,
      outlineDrawing: false,
      outlinePoints: [],
      outlineStart: null,
      frozenEnd: null,
      colors: {
        boneyard: '#b04050',
        level: '#5980a6',
        garageBoneyard: '#cf7a1f',
        garageLevel: '#7d5ba6',
        traceHouse: '#c0392b',
        traceAttached: '#3f7fd6',
      },
    });
  };

  // drawWallSeg2D's two colours, plus the two preview entries it also reads.
  // Same split floorEnv and dimensionEnv use: this page has no draw tool, so
  // `preview` is the constant false at the call below and both preview
  // branches are unreachable -- but they are DEFINED, because a caller should
  // answer the whole interface, and because wiring a draw tool up later must
  // not be the moment someone discovers the key was missing.
  //
  // Preview takes the committed look rather than the accent here, unlike the
  // dimension placeholders. A preview wall is the same wall a moment earlier,
  // so committed-looking is the honest placeholder; loud would be wrong.
  const wallEnv = () => ({
    ...paintEnv(),
    colors: {
      wall: skin['draw-wall'],
      wallPreview: skin['draw-wall'],
      wallEdge: skin['draw-wall-edge'],
      wallEdgePreview: skin['draw-wall-edge'],
    },
  });

  const paintWalls = () => {
    // Lazy, so a load-order change cannot bind these to undefined at parse
    // time -- but LOUD, not guarded. An earlier version returned quietly when
    // a module was missing, which turns a broken page into an empty drawing:
    // no error, no warning, and a test asserting "nothing was drawn" passes
    // while the drafter's walls silently vanish. Gilligan's call, 3 Sep, and
    // it is the same shape as everything that cost this repo a night --
    // _stairAutoFit giving up silently, the vertex magnet merging corners
    // silently. A painter that cannot paint must say so.
    const WT = window.DraftWallTypes;
    const R = window.DraftRender2D;
    const G = window.DraftGeometry2D;
    const missing = [!WT && 'wall-types.js', !R && 'render-2d.js',
      !G && 'geometry-2d.js'].filter(Boolean);
    if (missing.length) {
      throw new Error(`MODEL.html: cannot paint walls, ${missing.join(' and ')} `
        + 'did not load. Check the script order in the page head.');
    }
    // MITRED, at last. This page passed `null` for joins from tier 1 until
    // now, which gives capped ends: every corner closed with a straight line
    // across the assembly instead of the layer boundaries running through the
    // vertex. The classifier was extracted before the thing it needs -- it
    // keys on object identity, and the pool that rebuilds identity at shared
    // corners is built in the load path above.
    //
    // Classified over the WALLS ON SCREEN rather than every wall in the
    // drawing -- but that scoping is a BELT, and the pool is the braces.
    //
    // Measured, after a first version of this comment claimed the scoping was
    // what stops an invisible wall voting on a visible corner. It is not, on
    // its own: the pool keys on (levelId, viewId, body), so a wall on another
    // level, another layer set or another body already holds a DIFFERENT
    // corner object and cannot be grouped with these whatever list is passed
    // in. Swapping `shown` for `drawing.walls` changes no pixel, and dropping
    // viewId from the pool key changes none either -- each mutation alone
    // survives because the other mechanism still delivers the answer. Only
    // removing both together turns the corner into a tee.
    //
    // Kept anyway, and not as decoration: it is the cheaper of the two to
    // reason about, it keeps the classifier's input the same set the painter
    // iterates, and a redundant guard on "the drawing mitres the way it looks"
    // is worth its two words.
    const shown = walls();
    const joins = G.wallJoins(shown);
    shown.forEach(wall => {
      if (!wall.start || !wall.end) return;
      R.drawWallSeg2D(ctx, toS, wall, false, joins, 'both', wallEnv());
    });
  };

  // drawDimension2D reads exactly two things: a label function and five
  // colours. Small, but the label is the one place this page can silently
  // diverge from the product, so the polarity below is copied and not
  // rewritten.
  const dimensionEnv = () => ({
    // IMPERIAL IS THE FALL-THROUGH, DELIBERATELY -- MODEL.dc.html:8058 reads
    // `units !== 'metric'`, not `units === 'imperial'`. Nothing normalises
    // `units`: drawing-format.js has no rule for it, so it arrives here raw
    // off the saved JSON, where it can be absent, null, or a string from a
    // drawing older than the toggle. Every one of those has to print SOMETHING
    // a drafter can read, and feet-and-inches is this app's home unit.
    //
    // Inverting it to `=== 'imperial'` reads identically on the fixture and
    // sends every one of those drawings to metres. This is the same polarity
    // that hid seven metric display sites from a grep earlier today: a test
    // for one value is not a test for the other when a third case exists.
    label: value => (drawing?.units !== 'metric'
      ? window.DraftFormatters.formatArchitecturalInches(value * 12)
      : window.DraftFormatters.formatMetres(value)),
    // Only `stroke` and `labelBack` ever paint here. This page has no
    // dimension tool and no selection, so drawDimension2D's `options` is
    // always `{}` and the preview and selected branches are unreachable --
    // but they must still be DEFINED, or wiring selection up later would read
    // `undefined`, paint transparent black, and look like a geometry bug.
    //
    // Placeholders follow floorEnv's split: preview takes the committed look,
    // selection takes the accent. The accent is the loud choice, and loud is
    // the point -- a placeholder that fires should be obviously wrong rather
    // than quietly plausible. Wiring the halo to `surface-panel` was the first
    // attempt and was the opposite: a page-coloured 7px band under the line,
    // which is the placeholder that HIDES. (On rough/day the accent happens to
    // equal draw-dim, so there the two would not be told apart -- harmless
    // while the branch is dead, and not worth a role of its own until
    // selection is real.)
    colors: {
      stroke: skin['draw-dim'],
      selected: skin['accent'],
      selectedHalo: skin['accent'],
      preview: skin['draw-dim'],
      // The plate the label is drawn ON. It has to be the ground draw-dim was
      // measured against, or the contrast the palette harness proves is a
      // contrast against something this page never paints.
      labelBack: skin['surface-panel'],
    },
  });

  const paintDimensions = () => {
    const R = window.DraftRender2D;
    const F = window.DraftFormatters;
    const missing = [!R && 'render-2d.js', !F && 'formatters.js'].filter(Boolean);
    if (missing.length) {
      throw new Error(`MODEL.html: cannot paint dimensions, ${missing.join(' and ')} `
        + 'did not load. Check the script order in the page head.');
    }
    const env = dimensionEnv();
    dimensions().forEach(dimension => R.drawDimension2D(ctx, toS, dimension, {}, env));
  };

  // LEADER NOTES. Two env keys, and until #302 there was no colour to put in
  // them: NOTE_COLOR is '#1d1f20' and the night skin's surface-page is
  // '#1d1f20' -- the identical hex, contrast 1.00, a note painted in exactly
  // the colour of the page behind it. MODEL.dc.html never saw it because that
  // page has one light ground and no second one to be wrong against, so the
  // port creates the defect rather than finding it. draw-note is the key now,
  // and it answers to 4.5 rather than 3.0 because a note is text.
  //
  // The painter takes SCREEN points, not world ones -- it is the only one here
  // that does. Both the anchor and the text block come through toS.
  const paintNotes = () => {
    const R = window.DraftRender2D;
    if (!R) {
      throw new Error('MODEL.html: cannot paint notes, render-2d.js did not '
        + 'load. Check the script order in the page head.');
    }
    const env = { color: skin['draw-note'], fillColor: skin['surface-page'] };
    // options is {} here: preview and pending are in-progress states of the
    // annotation TOOL, and this page has no tools. A committed note is the
    // only kind it can hold.
    notes().forEach(note =>
      R.drawNoteScreen2D(ctx, toS(note.anchor), toS(note.text), note, {}, env));
  };

  // The fixture body is filled with the page's own ground so the wall hatch
  // shows faintly through it -- which is what the painter's old literal white
  // meant on a light page, and the opposite of what it meant on a dark one.
  //
  // THE ALPHA IS APPENDED AS A HEX BYTE rather than parsed: 0.65 * 255 = 166 =
  // 0xa6, and canvas takes 8-digit hex. Guarded by the shape of the value, so
  // a skin that ever hands back an rgba() or a named colour falls through
  // opaque instead of producing '#f2f2f3a6'-shaped nonsense that silently
  // paints black. palette.js's own parse() reads 8-digit hex, so this is the
  // repo's spelling for the same idea, not a new one.
  const fixtureFill = () => {
    const ground = skin['surface-page'];
    return /^#[0-9a-f]{6}$/i.test(ground) ? `${ground}a6` : ground;
  };

  // FIXTURES -- kitchen, bath and laundry symbols riding their host walls.
  //
  // ELEVEN ENV KEYS, and only two of them are colours; the rest are ANSWERS.
  // drawFixture2D does not know where a fixture is: it asks its caller through
  // fixtureGeometry, wallFrame and wallCross. Those three (four, with the tub)
  // lived as methods on MODEL.dc.html's component and were therefore reachable
  // only from that page, which is why this one drew no fixtures through two
  // tiers. They are fixture-geometry.js now, one copy, both boards.
  //
  // The extraction was proved by a differential run while both copies existed
  // -- 8421 comparisons over 2994 fixtures, identical -- and that proof is
  // recorded in proto/fixture-geometry-harness.js rather than kept, because
  // MODEL.dc.html delegates here now and the same comparison would be the
  // module against itself.
  //
  // WALLS IS EVERY WALL, not fixtures()' filtered set, and the difference is
  // load-bearing: the tub scans for the wall that closes its alcove and does
  // its OWN level and view filtering while it scans (fixture-geometry.js).
  // Handing it a pre-filtered list would be filtering twice and would drop the
  // foundation wall a ground-floor tub can legitimately end against.
  const paintFixtures = () => {
    const R = window.DraftRender2D;
    const FG = window.DraftFixtureGeometry;
    const CL = window.DraftClosets;
    const missing = [!R && 'render-2d.js', !FG && 'fixture-geometry.js',
      !CL && 'closets.js'].filter(Boolean);
    if (missing.length) {
      throw new Error(`MODEL.html: cannot paint fixtures, ${missing.join(' and ')} `
        + 'did not load. Check the script order in the page head.');
    }
    const all = drawing?.walls || [];
    const env = {
      fixtureGeometry: (fx, wl) => FG.fixtureGeometry(all, fx, wl),
      wallCross: (a, frame, b) => FG.wallCross(a, frame, b),
      wallFrame: wl => FG.wallFrame(wl),
      walls: all,
      closetDoorFor: outsideWidthFt => CL.doorFor(outsideWidthFt),
      CLOSET_WALL_FT: CL.WALL_FT, CLOSET_ROD_FT: CL.RAIL_FT,
      CLOSET_SHELF_FT: CL.SHELF_FT, CLOSET_CLOTHES_FT: CL.CLOTHES_FT,
      COUNTER_OVERHANG_FT: FG.COUNTER_OVERHANG_FT,
      FIXTURE_COLOR: skin['draw-fixture'],
      fixtureFill: fixtureFill(),
    };
    // options is {} for the same reason it is on notes: preview and selected
    // are states of the fixture TOOL, and this page has no tools.
    fixtures().forEach(fixture => R.drawFixture2D(ctx, toS, fixture, {},
      all.find(w => w.id === fixture.wallId), env));
  };

  // CUT MARKS -- the section lines and their bubbles.
  //
  // FOUR INPUTS, AND THEY COME FROM THREE DIFFERENT PLACES. That is the whole
  // story of this painter, and it is why it went last of the ones that only
  // needed wiring:
  //
  //   cuts                  the drawing        persisted, read like walls
  //   elevationMarkOffsets  the drawing        persisted (PERSISTED_KEYS)
  //   structureStandards    the PROFILE        the drafter's office standard,
  //                                            localStorage, not the drawing
  //   autoDimFirstOffsetFt  the drawing        persisted since PR #319;
  //                                            null means derive
  //
  // The third is why profile-manager.js is in the head.
  //
  // THE FOURTH USED TO HAVE NO HOME, AND THIS PAGE PAINTED ITS OWN DEFAULT.
  // Until PR #319 the offset was session state on the old page, written
  // nowhere, so this page hardcoded 1.5' and the comment here said out loud
  // that a drafter who changed it mid-session saw a different gap on the two
  // boards. That was the one input this page could not be faithful about, and
  // it is now one it reads -- which is why this is a completion of tier 2
  // rather than a tidy: tier 2's whole claim is that this page paints what the
  // drawing says.
  //
  // NULL MEANS DERIVE, and reading it any other way reintroduces the bug the
  // key was added to close. `format.autoDimFirstOffsetFt` keeps null for a
  // drawing that never chose (drawing-format.js: "readers normalise, writers
  // never invent"), so `?? AUTO_DIM_FIRST_OFFSET_FT` is where the 1.5 comes
  // from -- and moving that default later then reaches every such drawing.
  //
  // HALF, because the bubbles sit in the middle of the gap between the walls
  // and the first string. MODEL.dc.html's `_cutMarkGapFt()` takes the same
  // half of the same number -- one underscore apart from this name, on the
  // board this one has to agree with, which is why that file carries a comment
  // pointing here and this one points back.
  const autoDimFirstOffsetFt = () =>
    drawing?.autoDimFirstOffsetFt ?? window.DraftDrawingFormat.AUTO_DIM_FIRST_OFFSET_FT;
  const cutMarkGapFt = () => autoDimFirstOffsetFt() / 2;

  // TWO GLOBALS, not one, and profile-manager.js publishes seven. The reader
  // is on DraftProfileManager; the normaliser is on DraftStructureStandards
  // (profile-manager.js:479). Written out rather than assumed: the first
  // version of this reached for PM.normaliseStructureStandards, which is
  // undefined, and the page caught the throw and said "painter failed".
  const structureStandards = () => window.DraftStructureStandards
    .normaliseStructureStandards(
      window.DraftProfileManager.getActive('standards')?.content?.model?.structureStandards);

  const paintCuts = () => {
    const R = window.DraftRender2D;
    const CM = window.DraftCutMarks;
    const PM = window.DraftProfileManager;
    const SS = window.DraftStructureStandards;
    // Both profile-manager globals are named, so a load-order slip says which
    // half is missing rather than blaming the file twice.
    const missing = [!R && 'render-2d.js', !CM && 'cut-marks.js',
      !PM && 'profile-manager.js (DraftProfileManager)',
      !SS && 'profile-manager.js (DraftStructureStandards)'].filter(Boolean);
    if (missing.length) {
      throw new Error(`MODEL.html: cannot paint cut marks, ${missing.join(' and ')} `
        + 'did not load. Check the script order in the page head.');
    }
    const all = drawing?.walls || [];
    const dims = drawing?.dimensions || [];
    const standards = structureStandards();
    R.drawCutMarks2D(ctx, toS, {
      bubbleStyle: standards.cutBubbleStyle,
      lineSpan: (start, end) => CM.cutLineSpan(all, start, end, cutMarkGapFt()),
      autoCuts: CM.autoElevationCuts({
        walls: all,
        dimensions: dims,
        elevationMarkOffsets: drawing?.elevationMarkOffsets || {},
        autoElevations: standards.autoElevations,
      }),
      cuts: cuts(),
      cutColor: skin['draw-cut'],
      // The bubble interior is the page's own ground, so the lettering inside
      // it reads at the same contrast the palette measured draw-cut against.
      bubbleFill: skin['surface-page'],
    });
  };

  // The level readings a stair's rise is built from. Faithful to the four
  // component methods it replaces, INCLUDING their inconsistencies: _floorLevels
  // does not coerce level ids and _levelWallTopFt compares them strictly, so
  // neither does this. A stair descends to the subfloor below, and on the
  // lowest floor past the foundation wall onto the slab -- stair-geometry.js
  // owns that rule; this only answers the four questions it asks.
  const stairLevels = () => {
    const LA = window.DraftLevelAssembly;
    const LV = window.DraftLayerViews;
    const all = drawing?.walls || [];
    const assemblies = drawing?.levelAssemblies || {};
    // THE ROLE, NOT JUST THE ID. Passing no role means every level frames
    // like a plain floor, and MODEL.dc.html stopped believing that on 6 Sep
    // (PR #323, Devin's ruling). This page's whole job is to paint what that
    // page saved, so the two must ask the module the same question.
    const assemblyFor = id => LA.normaliseLevelAssembly(assemblies[id], LA.levelRole(id));
    return {
      floors: (drawing?.levels || [])
        .filter(level => LV.layerViewsForLevelId(level.id).some(view => view.id === 'floor'))
        .slice()
        .reverse(),
      assemblyFor,
      floorFtFor: id => LA.levelFloorFt(assemblyFor(id)),
      wallTopFtFor: (id, view = 'plan') => {
        const tops = all
          .filter(wall => wall.levelId === id && (wall.view || 'plan') === view)
          .map(wall => wall.topHeight);
        return tops.length ? Math.max(...tops) : LA.DEFAULT_WALL_TOP_FT;
      },
    };
  };

  // A-STR IS UNCONFIGURED HERE, and that is the bone's own default rather than
  // a stub. _layerStandard(STAIR_LAYER) reads this.state.layerStandards and
  // falls back to `{ name, printable: true, visible: true }` for any layer the
  // drafter has not touched. Layer standards are page state, not drawing data,
  // so this page has none to read and every stair layer is untouched by
  // definition -- the fallback is the whole answer, not a placeholder for one.
  const STAIR_LAYER_STANDARD = Object.freeze({ name: 'A-STR', printable: true, visible: true });

  const paintStairs = () => {
    const R = window.DraftRender2D;
    const SG = window.DraftStairGeometry;
    const LA = window.DraftLevelAssembly;
    const F = window.DraftFormatters;
    const missing = [!R && 'render-2d.js', !SG && 'stair-geometry.js',
      !LA && 'level-assembly.js', !F && 'formatters.js'].filter(Boolean);
    if (missing.length) {
      throw new Error(`MODEL.html: cannot paint stairs, ${missing.join(' and ')} `
        + 'did not load. Check the script order in the page head.');
    }
    // Built ONCE per paint, not per stair: every stair on the level asks the
    // same four questions and wallTopFtFor scans the whole wall array.
    const levels = stairLevels();
    R.drawStairs2D(ctx, toS, {
      layer: STAIR_LAYER_STANDARD,
      isPrinting: false,
      stairs: stairs(),
      // Inert here for the same reason as the origin marker: toS is a plan
      // projection reading x and z only. Supplied because the painter reads
      // `env.elev || 0` and a caller answers the whole interface.
      elev: 0,
      stairColor: skin['draw-stair'],
      treadRunIn: SG.STAIR_TREAD_RUN_IN,
      layoutFor: stair => SG.stairCurrentLayout(stair, levels),
      partsFor: (stair, layout) => SG.stairPlanParts(stair, layout),
      formatInchesOnly: F.formatInchesOnly,
    });
  };

  // THE DATUM MADE VISIBLE. Tier 2d anchored the grid to the datum but never
  // showed the point itself, so the drafter saw a grid whose origin was
  // inferable only by counting squares. Same three states as the grid, from
  // the same gridDatum(): a point, the back-filled world origin, or nothing.
  //
  // MODEL.dc.html guards this with `!this._isPrinting`. This page never
  // prints, so the guard is the constant `false` and the marker always shows
  // when a datum exists -- which is the whole point of drawing it.
  // Reference images the drafter traces over. The painter refuses four ways
  // and every refusal draws NOTHING -- no placeholder, no outline -- which is
  // deliberate (see palette.js on draw-underlay: an underlay arrives with its
  // own colours and the painter puts no ink of its own on the page).
  const paintUnderlays = () => {
    const R = window.DraftRender2D;
    if (!R) {
      throw new Error('MODEL.html: cannot paint underlays, render-2d.js did '
        + 'not load. Check the script order in the page head.');
    }
    R.drawUnderlays2D(ctx, toS, {
      isPrinting: false,
      underlays: underlays(),
      // The painter reads `.id` and nothing else. MODEL.dc.html hands it
      // `state.levels[state.activeLevelIdx]` -- an INDEX into the level list --
      // and this page has an ID, so it builds the one field the painter asks
      // for rather than pretending to supply a level object.
      activeLevel: { id: activeLevelId() },
      imageFor: id => underlayImages.get(id),
    });
  };

  const paintOrigin = () => {
    const R = window.DraftRender2D;
    if (!R) {
      throw new Error('MODEL.html: cannot paint the origin, render-2d.js did '
        + 'not load. Check the script order in the page head.');
    }
    // elev is inert here and passed anyway: toS is a plan projection reading
    // x and z only, so the y it builds is dropped. Supplied rather than
    // omitted because the painter reads `env.elev || 0` and a caller should
    // answer the whole interface, not the part that happens to be observable.
    R.drawOrigin2D(ctx, toS, {
      datum: gridDatum(),
      elev: 0,
      colors: { origin: skin['draw-origin'] },
    });
  };

  const paint = () => {
    ctx.save();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssW, cssH);
    ctx.fillStyle = skin['surface-page'];
    ctx.fillRect(0, 0, cssW, cssH);
    try {
      if (drawing) {
        paintGrid();
        // "Underlays sit beneath everything drawn: over the grid, under
        // geometry" -- MODEL.dc.html's own words at the same seam. A tracing
        // image that painted over the walls would be worse than none.
        paintUnderlays();
        paintFloors(); paintRoofs(); paintShapes();
        paintOutlines();
        paintLines(); paintWalls();
        // Fixtures ride ON the walls, so they go after them and before the
        // annotation -- the slot the bone puts them in (MODEL.dc.html:6993,
        // straight after the wall and opening passes and well before the
        // dimensions at 6960's tail).
        paintFixtures();
        // Stairs sit with the geometry, not the annotation, and after the
        // fixtures for the slot the bone puts them in (MODEL.dc.html:7018 --
        // straight past the fixture and beam passes, and well before the
        // selection highlight and the dimension strings).
        paintStairs();
        // LAST, because dimensions are annotation: MODEL.dc.html paints them
        // after the walls and lines (6960) so a string is never buried under
        // the geometry it measures.
        paintDimensions();
        // The selection highlight sits where MODEL.dc.html puts it: after the
        // dimension strings (:6960) and immediately before the cut marks
        // (:7380 against :7432), so the highlight is never buried under the
        // geometry it marks but never covers the annotation either.
        paintSelection();
        // Cut marks go with the annotation rather than the geometry: they are
        // a fact ABOUT the drawing, and the bone paints them late for the same
        // reason (MODEL.dc.html:7432, after every piece of linework and just
        // before the outline guide).
        paintCuts();
        // Notes ride with the dimensions, for the same reason and in the same
        // place the bone puts them (MODEL.dc.html:7025, immediately after the
        // dimension pass): annotation goes over the geometry it annotates.
        paintNotes();
        // The datum marker goes on top of everything, as it does in the old
        // page (MODEL.dc.html:6956, immediately before the committed lines):
        // it is the one point the drafter must always be able to find.
        paintOrigin();
        // THE HALF-DRAWN WALL'S ANCHOR. Without it the first tap of a
        // two-tap gesture has no visible effect at all, which is
        // indistinguishable from the tap not registering.
        if (drawStart) {
          const p = toS(drawStart);
          ctx.save();
          ctx.strokeStyle = skin['accent'];
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }
      }
    } catch (err) {
      // The throw above is only useful if someone SEES it. paint() runs on
      // every pan, zoom and resize, so an uncaught error here would be a
      // console full of noise behind a blank page; this puts it on screen
      // once, in the same notice the store errors use.
      ctx.restore();
      readout.textContent = 'painter failed';
      say('The drawing could not be painted',
        `<p><code>${String(err && err.message || err)}</code></p>`);
      throw err;
    }
    ctx.restore();
    // The delete affordance exists exactly while there is something to delete.
    // A button that is always there and usually does nothing teaches a drafter
    // to distrust it.
    if (deleteButton) deleteButton.hidden = !selectedSeg;
    updateReadout();
  };

  const levelName = () => (drawing?.levels || [])
    .find(level => Number(level.id) === activeLevelId())?.name || 'level';

  // THE READOUT IS THE ONLY INSTRUMENT ON THIS PAGE. Movie, 3 Sep: keep adding
  // to it, never prune -- he decides later what earns its place. So counts are
  // shown as SHOWN/TOTAL rather than shown alone: `walls 13/24` says both what
  // is painted and what the drawing holds, which makes the level filter
  // visible instead of something you have to trust. `floors 0/3` is what would
  // have shown the tier 2a floor bug on sight rather than after a screenshot.
  const shownOfTotal = (shown, all) => `${shown}/${(all || []).length}`;

  // Three states, matching gridDatum(): a point, the back-filled world origin
  // for a pre-datum drawing, or none at all -- and none means no grid.
  const datumLabel = () => {
    const d = gridDatum();
    if (!d) return 'none — no grid';
    const at = `${d.x.toFixed(2)},${d.z.toFixed(2)}`;
    return (drawing && !('drawingOrigin' in drawing)) ? `${at} (world, back-filled)` : at;
  };

  // PDF underlays on THIS level: the ones the drafter would expect to see.
  const pdfUnderlays = () => underlays().filter(u => u.kind === 'pdf').length;

  const updateReadout = () => {
    if (!drawing) return;
    readout.innerHTML =
      `walls <b>${shownOfTotal(walls().length, drawing.walls)}</b>   `
      + `lines <b>${shownOfTotal(lines().length, drawing.lines)}</b>   `
      + `floors <b>${shownOfTotal(floors().length, drawing.floors)}</b>   `
      + `roofs <b>${shownOfTotal(roofs().length, drawing.roofs)}</b>   `
      + `shapes <b>${shownOfTotal(shapes().length, drawing.shapes)}</b>   `
      + `outlines <b>${shownOfTotal(outlines().length, drawing.outlines)}</b>   `
      + `dims <b>${shownOfTotal(dimensions().length, drawing.dimensions)}</b>   `
      // BOTH SIDES LEVEL-SCOPED. The loader decodes every underlay in the
      // drawing, not just this level's, so that switching level is instant --
      // which means underlayImages.size counts images the drafter cannot
      // currently see. Counting it against this level's total printed
      // `underlays 1/0`, and a ratio above one is not a fact, it is a bug.
      + `underlays <b>${underlays().filter(u => underlayImages.has(u.id)).length}</b>`
      + `/${underlays().length}\n`
      + `${levelName()} <b>${activeLevelId()}</b>/${(drawing.levels || []).length}   `
      + `view <b>${onActiveLevel().viewId || 'all'}</b>   `
      + `${theme}/${mode}   `
      + `scale <b>${view.scale.toFixed(2)}</b> px/ft   `
      // Why the grid is or is not there, so its absence reads as a fact about
      // the drawing rather than a broken page.
      + `datum <b>${datumLabel()}</b>`
      // Malformed geometry is dropped on load, as the old page drops it. Say
      // how much, so a thinner drawing is a fact rather than a mystery.
      + (dropped ? `   <b>${dropped} dropped</b>` : '')
      // THE SAME RULE AS `dropped` ABOVE, for the same reason. A PDF underlay
      // is stored, is on this level, and will never draw here -- so without
      // this line the drafter sees the thing they were tracing simply gone and
      // has no way to tell a missing feature from a broken page. Naming it
      // costs one clause and turns an absence into a fact.
      + (pdfUnderlays() ? `   <b>${pdfUnderlays()} PDF underlay`
          + `${pdfUnderlays() === 1 ? '' : 's'} not drawn</b> (needs pdf.js)` : '');
  };

  // ── the level switcher, and the view switcher ─────────────────────────────
  // TIER 3b, and the spec's own words: "a level switcher is chrome, and chrome
  // is tier 3." The page has painted any level correctly since tier 2a, but
  // only `?level=` could change which one -- and a URL is not a drafter.
  //
  // NO WRITES IN THIS RUNG. Both switchers change what is LOOKED AT and
  // nothing that is saved: they set a query parameter and repaint. `drawing`
  // is not touched, markDirty is not called, and the save button does not
  // move off SAVE.
  //
  // THE URL STAYS THE ONE SOURCE OF TRUTH. `params` is already what
  // activeLevelId() and activeViewId() read, so the switcher writes THERE and
  // repaints, rather than keeping a second copy of "which level" beside it.
  // Two copies is how a picker comes to disagree with the address bar; with
  // one, `?level=` keeps working untouched, every switch is shareable and
  // reloadable, and there is nothing to get out of step.
  //
  // IDS, NEVER INDEXES. Every option's value is the level's own `id`.
  // MAIN_FLOOR_LEVEL_ID is 3 and `state.activeLevelIdx` is an index; on the
  // default list they happen to agree, and they stop agreeing the moment a
  // level is inserted. A switcher carrying the index would pass every test on
  // a default drawing and paint the wrong level on a real one -- broken and
  // passing looking identical, which is the failure this whole rung is about.
  const chromeBar = document.getElementById('chrome');
  const levelPick = document.getElementById('level-pick');
  const viewPick = document.getElementById('view-pick');
  const viewWrap = document.getElementById('view-wrap');

  // replaceState, not pushState: a switch is a change of viewpoint, not a
  // navigation, and forty pushes would bury whatever page the drafter came
  // from under forty presses of Back.
  const syncUrl = () => {
    const query = params.toString();
    history.replaceState(null, '',
      query ? `${location.pathname}?${query}` : location.pathname);
  };

  const fillViewPick = () => {
    const views = window.DraftLayerViews.layerViewsForLevelId(activeLevelId());
    // ROOF and SITE have no layer views -- the view filter switches itself
    // off there and they show everything they hold. A picker on those levels
    // would be offering a choice that changes nothing, so there isn't one.
    viewWrap.hidden = !views.length;
    if (!views.length) return;
    const current = onActiveLevel().viewId;
    viewPick.innerHTML = '';
    views.forEach(view => {
      const option = document.createElement('option');
      option.value = view.id;
      option.textContent = view.label;
      option.selected = view.id === current;
      viewPick.append(option);
    });
  };

  const buildChrome = () => {
    const levels = drawing?.levels || [];
    levelPick.innerHTML = '';
    levels.forEach(level => {
      const option = document.createElement('option');
      option.value = String(level.id);
      option.textContent = level.name || `level ${level.id}`;
      option.selected = Number(level.id) === activeLevelId();
      levelPick.append(option);
    });
    fillViewPick();
    chromeBar.hidden = false;
  };

  const goToLevel = id => {
    params.set('level', String(id));
    // THE VIEW IS KEPT WHERE THE NEW LEVEL HAS IT, dropped where it does not.
    // MAIN FL and 2ND FL share the same four views, so a drafter comparing
    // one floor's electrical plan with the next stays on ELECTRIC rather than
    // being thrown back to walls at every switch. FOUNDATION has no 'stair',
    // so arriving there falls to that level's own default -- and dropping the
    // parameter is how it falls, since leaving a stale `?view=stair` in the
    // URL would make activeViewId() warn about a view the level never had.
    const views = window.DraftLayerViews.layerViewsForLevelId(Number(id));
    const asked = params.get('view');
    if (!asked || !views.some(view => view.id === asked)) params.delete('view');
    syncUrl();
    buildChrome();
    paint();
  };

  levelPick.addEventListener('change', () => goToLevel(levelPick.value));
  viewPick.addEventListener('change', () => {
    params.set('view', viewPick.value);
    syncUrl();
    // No buildChrome(): the level did not change, so the option lists are
    // still right and the browser has already moved the selection.
    paint();
  });

  // ── selection ─────────────────────────────────────────────────────────────
  // TIER 3a. The first editing tool: click a wall, it lights up.
  //
  // THE OLD PAGE IS THE SPEC, and it does NOT paint this through the painter.
  // drawWallSeg2D has no `selected` key -- drawRoof2D, drawFixture2D and
  // drawFloor2D do, and MODEL.dc.html uses both mechanisms deliberately, split
  // by what is being selected: AREAS go through their painter with
  // { selected: true } (:7393), SEGMENTS get a separate overlay pass (:7380).
  // A wall is a segment, so it gets the overlay, and render-2d.js needs no
  // change at all.
  //
  // The colours are MODEL.dc.html's literals. #5980a6 is the drafting blue --
  // 81 uses across the repo -- and the palette has no `selected` role to ask
  // for, only 'draw-floor-edge' which happens to hold the same hex under a
  // name that means something else. Naming a role is tier 2j's boarded colour
  // problem; borrowing the wrong name here would be worse than a literal that
  // says where it came from.
  const SELECT_INK = 'rgba(89,128,166,0.55)';   // MODEL.dc.html:7385
  const SELECT_HANDLE = '#5980a6';              // MODEL.dc.html:7388
  const SELECT_GRAB_PX = 12;                    // MODEL.dc.html:16707, _findLineHit
  let selectedSeg = null;

  // Nearest wall to a world point, or null. The threshold is converted from
  // pixels at the CURRENT zoom, so the grab zone stays the same size on screen
