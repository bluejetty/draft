<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rough Drafter — Architectural Workspace</title>
    <meta name="description" content="Rough Drafter: draw the outline, stamp the rooms, build the house." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Rough Drafter — Architectural Workspace" />
    <meta property="og:description" content="Rough Drafter: draw the outline, stamp the rooms, build the house." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- THE BONE IS NOT ON THIS PAGE, BUT ITS IMAGE IS. Model space shows the
         big bone to a first-time drafter, dead centre, painted before its
         runtime boots -- and it paints with no blink only because this page
         used to put btn-bone.png in the cache. The bone came off this page
         (Movie, 4 Sep: nobody sees a bone until they are in model space), so
         the cache is warmed here instead. Remove this and nothing fails; the
         first bone anyone sees just flickers in. -->
    <link rel="preload" as="image" href="assets/btn-bone.png" />
    <!-- Self-hosted (see vendor/fonts.css): no third-party request on the
         critical path of the page. -->
    <link rel="stylesheet" href="vendor/fonts.css" />
    <style>
      :root {
        --ink: #163653;
        --muted: rgba(22, 54, 83, 0.68);
        --line: rgba(22, 54, 83, 0.2);
        --paper: #eef5fb;
        --blue-dark: #1d4d78;
        --blue-medium: #3675a7;
        --blue-light: #77a8cb;
      }

      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        color: var(--ink);
        background:
          linear-gradient(rgba(22, 54, 83, 0.28) 1px, transparent 1px),
          linear-gradient(90deg, rgba(22, 54, 83, 0.28) 1px, transparent 1px),
          linear-gradient(rgba(22, 54, 83, 0.16) 1px, transparent 1px),
          linear-gradient(90deg, rgba(22, 54, 83, 0.16) 1px, transparent 1px),
          linear-gradient(rgba(22, 54, 83, 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(22, 54, 83, 0.07) 1px, transparent 1px),
          var(--paper);
        background-size: 1600px 1600px, 1600px 1600px, 160px 160px, 160px 160px, 16px 16px, 16px 16px;
        font-family: "Barlow Condensed", system-ui, sans-serif;
      }

      .shell {
        width: min(1120px, calc(100% - 48px));
        min-height: 100vh;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
      }

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        /* "less space at top" / "start the text up higher" (Movie, 13 Oct).
           Not symmetric any more: the top is what he is reading down from, so
           it is the one that gives. The bottom keeps enough to clear the
           visit counter. */
        padding: 14px 0 22px;
      }

      /* The logo's rendered width is the ONE number this page sizes from.
         It used to size a bone beneath it too, as a fraction of the same
         custom property; the bone is gone from this page and the logo is
         the only way in, but the rule stands for anything that joins it.

         Sizes are set from what the page actually PAINTS, not from the
         box: the logo is 450px, double the 225px that was really on
         screen before.

         That number was not the box number. The <img> carried a height
         attribute, which pins the box height, so `aspect-ratio` never
         applied and `object-fit: contain` letterboxed the art — the logo
         painted 225px wide no matter what width the box was given, and
         widening the box only added empty space either side. `height:
         auto` below hands sizing back to the width. */
      /* 460, not 450: the logo art fills 90.9% of its square canvas where the
         old wordmark filled 92.9%, so the wider box paints the mark at the
         same visible size. One file serves the entry page, the home links
         and the printed titleblock — 800x800, so nothing upscales. */
      /* ── AND IT HAS TO FIT THE SCREEN AT 100% (Movie, 13 Oct) ──────────
         "can you adjust the sizes on the main entry page (SMALLER) so it all
         fits when screen is set to 100% for desktop (like in these photos its
         100% but not all on the same screen)".
         THE RING IS TWO LOGOS TALL. Its grid is 4 rows of --logo-w/2, so the
         page's height is 2 x --logo-w plus the padding round it -- which made
         920px of ring on a 768px screen at the old 70vh cap, and 70vh never
         bound at all because 460px got there first. The height cap has to be
         HALF the room, less the padding, or it is not a cap on anything. */
      :root { --logo-w: min(460px, 88vw, calc(50vh - 20px)); }
      /* Stated once because two rules space against it: the column inside the
         door, and the spare gap on .enter. */
      /* Movie, 13 Oct: "less space between logo and text on top and bottom
         too". This is the one number both of those gaps are, so both close
         together. */
      :root { --enter-gap: 4px; }
      /* OPEN's size, and the reason it is a property rather than a number in
         one rule: Movie is drawing a GRAPHIC for the word ("i'll get a
         graphic for OPEN word"). When it arrives, the <span class="enter-open">
         becomes <img class="enter-open" src="assets/..." alt="OPEN" /> and
         takes `height: var(--enter-open-size); width: auto;` -- the same
         number, so the word lands at the size the lettering was tuned to and
         nothing has to be re-measured. */
      :root { --enter-open-size: clamp(30px, calc(var(--logo-w) / 9), 54px); }

      .enter {
        display: flex;
        flex-direction: column;
        align-items: center;
        /* One child STILL: the words under the logo went INSIDE the door
           rather than beside it (see the link below), so this gap continues
           to separate nothing. It is kept for the same reason as before --
           a second element added out here lands at the spacing that was
           measured when there was one. The logo art carries its own
           transparent margin inside an 800x800 square, so the gap you SEE is
           this number plus that. */
        gap: var(--enter-gap);
      }

      /* ONE LINK, AND THE WORDS ARE PART OF IT (Movie, 12 Oct): "when my MOM
         goes to the Rough Drafter Entry page - she doesn't realize she should
         click the logo".
         THIS LOOKS LIKE THE THING THAT WAS DELETED ON 20 SEP and is the
         opposite of it. What came off then was a SECOND, quieter door -- a
         "preview" link to the same room, which front-door.spec.js still pins
         at zero ("there is no second, quieter door to the same room any
         more"). What goes under the logo now is not another door: it is this
         door's LABEL, inside the same <a>, so the page still has exactly one
         way in and clicking the words is clicking the logo. A caption that
         said OPEN and did nothing when pressed would be worse than no
         caption, and two anchors would re-open the ruling rather than keep
         it.
         It was two siblings once, logo and bone, sharing a destination; the
         bone now waits in model space. */
      .enter-link {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--enter-gap);
        width: fit-content;
        text-decoration: none;
        color: var(--ink);
        transition: transform 160ms ease;
      }
      .enter-link:hover,
      .enter-link:focus-visible {
        transform: translateY(-4px);
      }
      .enter-link:focus-visible {
        outline: 2px solid var(--blue-medium);
        outline-offset: 12px;
      }
      .enter-logo {
        display: block;
        /* The width is the size; the height follows the image's own
           proportions. Without this the height attribute wins and the art
           is letterboxed inside a box it never fills. */
        height: auto;
        object-fit: contain;
        filter: drop-shadow(0 18px 30px rgba(22, 54, 83, 0.2));
        transition: filter 160ms ease;
      }
      .enter-link:hover .enter-logo,
      .enter-link:focus-visible .enter-logo {
        filter: drop-shadow(0 24px 38px rgba(22, 54, 83, 0.3));
      }
      .enter-logo {
        width: var(--logo-w);
        aspect-ratio: 1;               /* the logo is square, 800x800 */
      }

      /* THE WORDS UNDER THE LOGO, filling the two ring cells below it: "OPEN
         (next line centered) ROUGH DRAFTER (next line centered) RESIDENTIAL
         DRAFTING PROGRAM". Three lines, each centred, read top down as a
         sentence: what to do, what it is called, what it is.
         NEVER WIDER THAN THE LOGO. The two cells it sits in are columns 2 and
         3, which together are exactly one logo wide, so the longest line is
         held to that and wraps rather than reaching into the side cells where
         boxes 11/12 and 5/6 live. */
      .enter-call {
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: var(--logo-w);
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        line-height: 1.1;
      }
      /* The word she is looking for, and the biggest thing in the block after
         the logo itself (Movie: "make open a bit bigger"). A graphic replaces
         this span later -- see --enter-open-size. */
      .enter-open {
        font-size: var(--enter-open-size);
        font-weight: 700;
        color: var(--blue-dark);
        line-height: 1;
      }
      /* The name, under the verb. Sized off --logo-w like everything else on
         this page rather than off a figure of its own. */
      .enter-name {
        font-size: clamp(19px, calc(var(--logo-w) / 15), 31px);
        font-weight: 700;
        margin-top: 2px;
      }
      /* What it IS, for somebody who has never been told. The quietest line,
         because it is the one a returning drafter has already read. */
      .enter-what {
        font-size: clamp(12px, calc(var(--logo-w) / 27), 18px);
        font-weight: 600;
        color: var(--muted);
        letter-spacing: 0.1em;
        margin-top: 5px;
      }

      /* THE LINKS ROUND THE LOGO (Movie, 12 Oct): "a square shape around the
         centralized ROUGH DRAFTER logo ... a table that can't be seen with
         about 4 columns and 4 rows and make the middle 4 boxes as one and put
         the logo in those 4 boxes centered". The middle four cells are one
         cell the logo's own width, so each ring cell is half a logo square.
         Numbered as he named them: box 1 is the top-left, then along the top. */
      .ring {
        display: grid;
        grid-template-columns: repeat(4, calc(var(--logo-w) / 2));
        grid-template-rows: repeat(4, calc(var(--logo-w) / 2));
        align-items: center;
        justify-items: center;
      }
      /* ROWS 1 TO 3, SO THE WORDS ARE OVER THE LOGO (Movie, 12 Oct): "lets
         put the OPEN ROUGH DRAFTER part up top and the other stuff below".
         They were under it first, in row 4 -- which is what he asked for when
         he could only picture it ("under the logo in the 2 spaces below") --
         and the page said otherwise once it was on screen: the three utility
         links were at the top of the sheet and the thing the page is FOR was
         at the bottom. So the two spoken-for cells are now the ones ABOVE the
         logo, boxes 2 and 3 by the numbering below, and the links moved down
         to the bottom row.
         `align-self: end` is what keeps the logo where it already was. The
         area is a row and a half of logo, and the grid centres its items, so
         without this the logo would drift up by half the slack the words do
         not use -- a move nobody asked for on the one thing this page is for.
         Ended at the bottom, the logo still fills rows 2 and 3 exactly as it
         did, and the words hang up into row 1. */
      .ring .enter { grid-column: 2 / 4; grid-row: 1 / 4; align-self: end; }
      /* Box N's cell: along the top, down the right, back along the bottom,
         up the left -- the order the boxes are filled in. */
      .ring [data-box="1"] { grid-column: 1; grid-row: 1; }
      .ring [data-box="2"] { grid-column: 2; grid-row: 1; }
      .ring [data-box="3"] { grid-column: 3; grid-row: 1; }
      .ring [data-box="4"] { grid-column: 4; grid-row: 1; }
      .ring [data-box="5"] { grid-column: 4; grid-row: 2; }
      .ring [data-box="6"] { grid-column: 4; grid-row: 3; }
      .ring [data-box="7"] { grid-column: 4; grid-row: 4; }
      .ring [data-box="8"] { grid-column: 3; grid-row: 4; }
      .ring [data-box="9"] { grid-column: 2; grid-row: 4; }
      .ring [data-box="10"] { grid-column: 1; grid-row: 4; }
      .ring [data-box="11"] { grid-column: 1; grid-row: 3; }
      .ring [data-box="12"] { grid-column: 1; grid-row: 2; }
      /* THE SIDE COLUMNS (Movie, 17 Oct): one grid item each, standing in
         rows 2 and 3 -- the logo's own two rows -- and hung from the top of
         that area so the title sits level with the top of the logo. The
         logo art carries a transparent margin inside its square, so the
         title is dropped by an eighth of a logo to meet the ink, not the
         box. Its links stack under it at the stacked-cell height. */
      .ring-column {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        width: 100%;
        grid-row: 2 / 4;
        align-self: start;
        padding-top: calc(var(--logo-w) * 0.13);
      }
      .ring-column-left { grid-column: 1; }
      .ring-column-right { grid-column: 4; }
      .ring-column .ring-link { width: 88%; min-height: 36px; padding: 5px 8px; }
      .ring-title {
        font-family: "Barlow Condensed", system-ui, sans-serif;
        font-size: clamp(18px, calc(var(--logo-w) / 15), 30px);
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink);
        margin-bottom: 4px;
      }
      .ring-link {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 88%;
        min-height: 44px;
        padding: 8px;
        text-align: center;
        text-decoration: none;
        color: var(--ink);
        font-family: "Barlow Condensed", system-ui, sans-serif;
        font-size: clamp(14px, calc(var(--logo-w) / 22), 21px);
        font-weight: 700;
        letter-spacing: 0.06em;
        line-height: 1.15;
        text-transform: uppercase;
        border-radius: 6px;
        transition: transform 160ms ease, background-color 160ms ease;
      }
      .ring-link:hover,
      .ring-link:focus-visible {
        transform: translateY(-3px);
        background-color: rgba(54, 117, 167, 0.1);
      }
      .ring-link:focus-visible { outline: 2px solid var(--blue-medium); outline-offset: 4px; }
      /* THE BOOK CELLS (Movie, 14 Oct): "RED area - EBAY book links". A title
         line and a quieter line under it -- the author, or what the search is
         for -- so a cell says which book without running to three lines.
         The links themselves live in entry-books.js, which is the list he
         keeps adding to. */
      .ring-book { flex-direction: column; gap: 2px; }
      .ring-book .book-by {
        font-size: 0.72em;
        font-weight: 600;
        letter-spacing: 0.08em;
        opacity: 0.72;
      }
      /* A CELL WITH A SOURCE LINE UNDER IT. The ring cell is one grid square,
         so the two links stack inside it rather than taking a square each --
         a source note is not worth a cell of its own. */
      .ring-stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1px;
        width: 100%;
      }
      /* A STACKED CELL HOLDS MORE THAN ONE PRESS, so its links give up the
         44px of a lone one: four editions and their source lines in a fixed
         grid row would otherwise push the ring past the window, and this
         page's one rule is that it never scrolls to show a way in. 32px with
         the gap either side still clears a fingertip. */
      .ring-stack .ring-link { width: 88%; min-height: 32px; padding: 5px 8px; }
      /* REALLY REALLY SMALL, AND STILL READABLE, which is the whole of what he
         asked for. 8px is about as far down as type goes before it stops being
         readable at all -- so what buys the readability back is everything
         else: no uppercase, no letter-spacing, and the line left at full
         opacity until it is hovered. */
      .ring-source {
        max-width: 88%;
        font-family: "Barlow Condensed", system-ui, sans-serif;
        font-size: 8px;
        line-height: 1.2;
        letter-spacing: 0;
        text-align: center;
        text-decoration: none;
        color: var(--ink);
        opacity: 0.55;
        overflow-wrap: anywhere;
      }
      .ring-source:hover, .ring-source:focus-visible { opacity: 1; }
      .ring-source:focus-visible { outline: 2px solid var(--blue-medium); outline-offset: 2px; }
      /* THE DISCLOSURE, quiet and not a link: eBay's partner programme asks
         that the relationship be stated, and a buyer deserves to know before
         pressing. It is the last cell of the column rather than a line under
         the page, so it stands with the links it is about. */
      .ring-note {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 88%;
        padding: 4px 8px;
        text-align: center;
        color: var(--ink);
        opacity: 0.6;
        font-family: "Barlow Condensed", system-ui, sans-serif;
        font-size: clamp(10px, calc(var(--logo-w) / 38), 13px);
        font-weight: 600;
        letter-spacing: 0.08em;
        line-height: 1.2;
        text-transform: uppercase;
      }
      main { align-items: center; }

      /* A short window (a laptop with browser chrome eating the height) gets
         its breathing room trimmed rather than the logo, so the doubled
         size survives everywhere it can and the page never scrolls to
         show a way in that should be the first thing you see. */
      @media (max-height: 720px) {
        /* 20, NOT 24, AND THE DIFFERENCE IS THE WHOLE POINT. At exactly 720
           the ring is 680 tall (four rows of half a logo, and --logo-w is
           capped at 50vh - 20), so 24 either side came to 728 and the page
           scrolled 8px -- on the one page whose standing rule is that it
           never scrolls to show a way in. This is older than the code shelf:
           it measures the same on main with none of this column on it. */
        main { padding: 20px 0; }
      }

      @media (max-width: 760px) {
        .shell { width: min(100% - 32px, 540px); }
        /* 20, NOT 32. Measured on a 390x844 phone with the code shelf at four
           editions: the page came to exactly the window's height, with no
           room for the next one. The breathing room is what gives way --
           the same rule the short-window query above follows -- so the shelf
           can grow a few more rows before anything has to be rethought. */
        main { padding: 20px 0; }
        /* --logo-w needs no override: min(460px, 88vw) already shrinks to
           fit a phone. */
        /* ON A PHONE THE SQUARE WOULD SQUEEZE THE WORDS, so the logo stands
           alone on top and the links follow it, two to a row. */
        .ring {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          grid-template-rows: auto;
          width: min(100%, 460px);
          gap: 6px;
        }
        .ring .enter { grid-column: 1 / -1; grid-row: auto; order: -1; margin-bottom: 8px; justify-self: center; }
        .ring .ring-link { width: 100%; grid-column: auto; grid-row: auto; }
        /* A STACKED CELL ON A PHONE IS A LIST, NOT FOUR BUTTONS. The code
           shelf grew to four editions and their source lines, and on a
           390x844 screen that column pushed the page past the window --
           which breaks this page's one standing rule, that it never scrolls
           to show a way in. So on a phone a stack loses the 44px press
           height and the padding that goes with it: every link is still
           there and still pressable (a 28px row with the gap either side
           clears a fingertip), and the shelf reads as the list it is. */
        /* THE COLUMNS DISSOLVE INTO THE LIST: their links take cells two
           to a row like everything else, and a title takes a row of its own. */
        .ring-column { display: contents; }
        .ring-title { grid-column: 1 / -1; margin: 6px 0 0; font-size: clamp(14px, calc(var(--logo-w) / 24), 18px); }
        /* THE CLOCKWISE CELL NUMBERS ARE FOR THE SQUARE. On a phone there is
           no column 4 to put box 7 in: left to the desktop rule, the note
           and the third book opened a third and fourth implicit column, the
           two real ones shrank to nothing and the logo was pushed off the
           left of the screen. So here every numbered item flows in order,
           and the partner note takes a row of its own under the books. */
        .ring [data-box] { grid-column: auto; grid-row: auto; }
        .ring .ring-note { grid-column: 1 / -1; width: 100%; }
        .ring-stack { grid-column: auto; grid-row: auto; gap: 0; }
        .ring-stack .ring-link {
          width: 100%;
          min-height: 28px;
          padding: 4px 6px;
          font-size: clamp(12px, calc(var(--logo-w) / 28), 16px);
        }
        .ring-source { font-size: 7px; }
        .ring-empty { display: none; }
      }

    </style>
  </head>
  <body>
    <div class="shell">
      <main>
        <div class="ring">
          <!-- ALONG THE BOTTOM NOW (Movie, 12 Oct): "lets put the OPEN ROUGH
               DRAFTER part up top and the other stuff below". These three sat
               in boxes 1 to 3 along the TOP, which put the errands above the
               door. Boxes 10, 9 and 8 are the bottom row read left to right --
               the numbering runs clockwise, so it counts down along the
               bottom. Boxes 2 and 3 are the words over the logo now; 1, 4, 5,
               6, 7, 11 and 12 are still free. -->
          <!-- ── THE TWO SIDE COLUMNS, TITLED, HUNG FROM THE TOP OF THE LOGO ──
               (Movie, 17 Oct, drawn in GIMP over the page): "move the side
               columns down and switch the sides (put the books on the right
               and reference (span tables, codes etc) on the left" ... "add
               the titles (keep the titles aligned with approx the top of the
               logo in the middle like in the image upload)".

               So each side is ONE column standing in rows 2 and 3 -- the two
               rows the logo itself fills -- hung from the top of that area,
               with a title first and its links under it. REFERENCES on the
               left is the code shelf: Building Codes & Span Tables is a page
               of its own since 12 Oct (codes-catalog.js is its list), so the
               column is a title and that one link, and the municipal bylaws
               he is after belong in that catalog, not here. BOOKS on the
               right is the eBay shelf (14 Oct: "make sure you get my partner
               info for affiliate commissions"): three slots the script at the
               foot of the page fills from entry-books.js, "randomly show them
               each time", and a slot that gets no book draws nothing. The
               partner disclosure sits under the books, in the bottom-right
               cell.

               The data-box numbers are the ring's clockwise cells as before
               (1 to 4 along the top, 5 to 7 down the right, 8 to 10 along the
               bottom, 11 and 12 up the left); inside a column they are
               labels, not placement -- the column is the grid item. -->
          <div class="ring-column ring-column-left">
            <span class="ring-title">References</span>
            <!-- Box 12 -->
            <a class="ring-link" href="CODES.html" data-box="12">BUILDING CODES / SPAN TABLES</a>
          </div>
          <div class="ring-column ring-column-right">
            <span class="ring-title">Books</span>
            <!-- Box 5 --><span class="ring-empty" data-book-slot="1" data-box="5"></span>
            <!-- Box 6 --><span class="ring-empty" data-book-slot="2" data-box="6"></span>
            <!-- Box 7 --><span class="ring-empty" data-book-slot="3" data-box="7"></span>
          </div>
          <!-- Box 7, the bottom-right cell -->
          <span class="ring-note" data-box="7" data-book-note hidden>eBay partner links — Rough Drafter may earn a commission</span>
          <!-- Box 9 -->
          <a class="ring-link" href="https://pdf.bluejetty.ca/" data-box="9">PDF MANAGER</a>
          <!-- Box 8 -->
          <a class="ring-link" href="DXF/" data-box="8">DXF CONVERTER</a>
        <div class="enter">
          <!-- THE DOOR MOVED (Movie, 20 Sep): "can you make the main page
               link to the model.html". This pointed at MODEL.dc.html from the
               first day the repo had a front page, and the parity document
               has said for two weeks that the swap is two hrefs. This is one
               of them.

               ?from=entry, NOT ?new=1. The old page reads `new` and starts a
               fresh drawing; the new page reads `from` and pulls the
               drive-thru up by itself after two seconds, which is Movie's own
               rule for arriving through the front door (15 Sep). A drafter
               who has a drawing keeps it; one who has none gets a blank sheet
               and the board over it. -->
          <!-- THE LABEL IS INSIDE THE DOOR (Movie, 12 Oct): "when my MOM goes
               to the Rough Drafter Entry page - she doesn't realize she should
               click the logo", so the two ring cells under the logo say what
               it is for. In the same <a> as the logo on purpose: one way in
               (front-door.spec.js), and the words she reads are the thing she
               presses.
               THE ARIA LABEL CARRIES THE VISIBLE WORDS. An accessible name
               that left out "OPEN ROUGH DRAFTER" would fail WCAG 2.5.3 -- a
               voice user saying what they can see would not reach the link. -->
          <a class="enter-link" href="MODEL.html?from=entry"
             aria-label="OPEN ROUGH DRAFTER — residential drafting program">
            <span class="enter-call">
              <!-- A graphic replaces this span, not the block round it:

    <!-- No sound on this page. The big crunch used to play here, on the

    <!-- Visit counter: async, fail-silent, silent on localhost (see traffic-counter.js). -->
  <script src="./entry-books.js"></script>
  <script>
    // THE BOOK SHELF, DEALT (Movie, 14 Oct): "once i fill up the column, just
    // randomly show them each time show different ones from the list".
    //
    // THE PICKING IS entry-books.js's, not this page's: one list, one shuffle,
    // and a harness that can ask it the same question without a browser. What
    // happens here is only the drawing -- three slots, however many books came
    // back, and the slots that got none stay empty.
    (() => {
      const shelf = window.DraftEntryBooks;
      const slots = [...document.querySelectorAll('[data-book-slot]')];
      if (!shelf || !slots.length) return;
      const books = shelf.pickBooks(slots.length);
      slots.forEach((slot, index) => {
        const book = books[index];
        if (!book) return;
        const link = document.createElement('a');
        link.className = 'ring-link ring-book';
        link.href = book.href;
        link.target = '_blank';
        // SPONSORED, which is what these are: a paid link, declared as one.
        // `noopener` for the new tab, and `nofollow` beside `sponsored`
        // because older crawlers read only the one they know.
        link.rel = 'sponsored nofollow noopener';
        link.dataset.box = slot.dataset.box;
        const title = document.createElement('span');
        title.className = 'book-title';
        title.textContent = book.title;
        link.append(title);
        if (book.by) {
          const by = document.createElement('span');
          by.className = 'book-by';
          by.textContent = book.by;
          link.append(by);
        }
        slot.replaceWith(link);
      });
      // THE DISCLOSURE SHOWS ONLY WHERE THERE IS SOMETHING TO DISCLOSE.
      const note = document.querySelector('[data-book-note]');
      if (note && books.length) note.hidden = false;
    })();
  </script>
  <script src="./traffic-counter.js" defer></script>
