<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rough Drafter — Architectural Workspace</title>
    <meta name="description" content="Rough Drafter: draw the outline, stamp the rooms, build the house." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Rough Drafter — Architectural Workspace" />
    <meta property="og:description" content="Rough Drafter: draw the outline, stamp the rooms, build the house." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- Self-hosted (see vendor/fonts.css): no third-party request on the
         critical path of the page. -->
    <link rel="stylesheet" href="vendor/fonts.css" />
    <style>
      :root {
        --ink: #163653;
        --muted: rgba(22, 54, 83, 0.68);
        --line: rgba(22, 54, 83, 0.2);
        --paper: #eef5fb;
        --blue-dark: #1d4d78;
        --blue-medium: #3675a7;
        --blue-light: #77a8cb;
      }

      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        color: var(--ink);
        background:
          linear-gradient(rgba(22, 54, 83, 0.28) 1px, transparent 1px),
          linear-gradient(90deg, rgba(22, 54, 83, 0.28) 1px, transparent 1px),
          linear-gradient(rgba(22, 54, 83, 0.16) 1px, transparent 1px),
          linear-gradient(90deg, rgba(22, 54, 83, 0.16) 1px, transparent 1px),
          linear-gradient(rgba(22, 54, 83, 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(22, 54, 83, 0.07) 1px, transparent 1px),
          var(--paper);
        background-size: 1600px 1600px, 1600px 1600px, 160px 160px, 160px 160px, 16px 16px, 16px 16px;
        font-family: "Barlow Condensed", system-ui, sans-serif;
      }

      .shell {
        width: min(1120px, calc(100% - 48px));
        min-height: 100vh;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
      }

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 48px 0;
      }

      /* The logo's rendered width is the ONE number this page sizes from.
         The bone is a fraction of it, expressed as a calc off the same
         custom property rather than a second clamp — so the ratio holds at
         every breakpoint by construction, including the <=760px rule
         below, instead of relying on two sets of numbers being kept in
         step.

         Sizes are set from what the page actually PAINTS, not from the
         box: the logo is 450px and the bone 115px, which is double and
         half of the 225px / 231px that were really on screen before.

         Those two numbers were not the box numbers. The <img> carried a
         height attribute, which pins the box height, so `aspect-ratio`
         never applied and `object-fit: contain` letterboxed the art —
         the logo painted 225px wide no matter what width the box was
         given, and widening the box only added empty space either side.
         That is why the bone (231px painted) was wider than the wordmark.
         `height: auto` below hands sizing back to the width. */
      :root { --logo-w: min(450px, 88vw, 70vh); }

      .enter {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }

      /* Two SIBLING links, not one nested inside the other: the logo and
         the bone are separate targets that happen to share a destination,
         and a link inside a link is invalid besides. */
      .enter-link {
        display: block;
        width: fit-content;
        text-decoration: none;
        color: var(--ink);
        transition: transform 160ms ease;
      }
      .enter-link:hover,
      .enter-link:focus-visible {
        transform: translateY(-4px);
      }
      .enter-link:focus-visible {
        outline: 2px solid var(--blue-medium);
        outline-offset: 12px;
      }
      .enter-logo,
      .enter-bone {
        display: block;
        /* The width is the size; the height follows the image's own
           proportions. Without this the height attribute wins and the art
           is letterboxed inside a box it never fills. */
        height: auto;
        object-fit: contain;
        filter: drop-shadow(0 18px 30px rgba(22, 54, 83, 0.2));
        transition: filter 160ms ease;
      }
      .enter-link:hover .enter-logo,
      .enter-link:focus-visible .enter-logo,
      .enter-link:hover .enter-bone,
      .enter-link:focus-visible .enter-bone {
        filter: drop-shadow(0 24px 38px rgba(22, 54, 83, 0.3));
      }
      .enter-logo {
        width: var(--logo-w);
        aspect-ratio: 1;               /* the wordmark is square, 225x225 */
      }
      .enter-bone {
        width: calc(var(--logo-w) * 0.2567);
        aspect-ratio: 287 / 275;       /* the bone's own proportions, undistorted */
      }

      /* A short window (a laptop with browser chrome eating the height) gets
         its breathing room trimmed rather than the logo, so the doubled
         size survives everywhere it can and the page never scrolls to
         show a way in that should be the first thing you see. */
      @media (max-height: 720px) {
        main { padding: 24px 0; }
      }

      @media (max-width: 760px) {
        .shell { width: min(100% - 32px, 540px); }
        main { padding: 32px 0; }
        /* --logo-w needs no override: min(450px, 88vw) already shrinks to
           fit a phone, and the bone follows it down. */
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <main>
        <div class="enter">
          <a class="enter-link" href="MODEL.dc.html" aria-label="Open Rough Drafter model space">
            <img class="enter-logo" src="assets/rough-drafter-wordmark.png"
                 width="225" height="225"
                 alt="Rough Drafter: a rolled blueprint lettered ROUGH DRAFTER" />
          </a>
          <!-- The bone is the same art MODEL's BUILD HOUSE button wears, so
               the way in looks like the thing it opens. The link carries the
               words; the image is decorative inside it, hence alt="". -->
          <a class="enter-link" href="MODEL.dc.html" aria-label="Press the bone to open Rough Drafter model space">
            <img class="enter-bone" src="assets/btn-bone.png"
                 width="287" height="275" alt="" />
          </a>
        </div>
      </main>
    </div>


    <!-- Visit counter: async, fail-silent, silent on localhost (see traffic-counter.js). -->
  <script src="./traffic-counter.js" defer></script>
</body>
</html>
