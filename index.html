<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Draft — Architectural Workspace</title>
    <meta name="description" content="Choose a Draft workspace for architectural drawing, layout, and PDF markup." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Draft — Architectural Workspace" />
    <meta property="og:description" content="Choose a Draft workspace for architectural drawing, layout, and PDF markup." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #1d1f20;
        --muted: #6f777a;
        --line: rgba(29, 31, 32, 0.14);
        --paper: #f6f6f3;
        --card: rgba(255, 255, 253, 0.9);
        --blue: #5980a6;
        --gold: #b58a4b;
      }

      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        color: var(--ink);
        background:
          linear-gradient(rgba(29, 31, 32, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(29, 31, 32, 0.035) 1px, transparent 1px),
          var(--paper);
        background-size: 32px 32px;
        font-family: "Barlow Condensed", system-ui, sans-serif;
      }

      .shell {
        width: min(1100px, calc(100% - 48px));
        min-height: 100vh;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 88px;
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: flex;
        align-items: baseline;
        gap: 12px;
        letter-spacing: 0.08em;
      }
      .brand-mark {
        color: var(--blue);
        font-family: "DM Mono", monospace;
        font-size: 12px;
        letter-spacing: 0;
      }
      .brand-name { font-size: 23px; font-weight: 600; }
      .brand-note {
        color: var(--muted);
        font-family: "DM Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.04em;
      }

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 84px 0 96px;
      }

      .eyebrow {
        margin: 0 0 14px;
        color: var(--blue);
        font-family: "DM Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 {
        max-width: 650px;
        margin: 0;
        font-size: clamp(46px, 8vw, 92px);
        font-weight: 500;
        line-height: 0.9;
        letter-spacing: -0.025em;
      }
      .intro {
        max-width: 510px;
        margin: 26px 0 56px;
        color: var(--muted);
        font-size: 19px;
        line-height: 1.25;
      }

      .spaces {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
      }
      .space-card {
        position: relative;
        display: flex;
        min-height: 218px;
        flex-direction: column;
        justify-content: space-between;
        padding: 22px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
        text-decoration: none;
        transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
      }
      .space-card::before {
        position: absolute;
        top: 0;
        right: 0;
        left: 0;
        height: 4px;
        background: var(--accent);
        content: "";
      }
      .space-card:hover,
      .space-card:focus-visible {
        border-color: var(--accent);
        box-shadow: 0 12px 28px rgba(29, 31, 32, 0.1);
        outline: none;
        transform: translateY(-3px);
      }
      .space-card:focus-visible { box-shadow: 0 0 0 3px rgba(89, 128, 166, 0.26); }
      .space-code {
        color: var(--accent);
        font-family: "DM Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.08em;
      }
      .space-title { margin-top: 28px; font-size: 32px; font-weight: 500; line-height: 1; }
      .space-description {
        max-width: 230px;
        margin-top: 10px;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.15;
      }
      .space-open {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 28px;
        font-family: "DM Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .space-arrow { color: var(--accent); font-size: 19px; line-height: 0.5; }

      footer {
        display: flex;
        justify-content: space-between;
        padding: 18px 0;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-family: "DM Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      @media (max-width: 760px) {
        .shell { width: min(100% - 32px, 540px); }
        header { min-height: 72px; }
        .brand-note { display: none; }
        main { padding: 58px 0 72px; }
        .intro { margin-bottom: 38px; }
        .spaces { grid-template-columns: 1fr; }
        .space-card { min-height: 170px; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <div class="brand">
          <span class="brand-mark">BJ/</span>
          <span class="brand-name">DRAFT</span>
          <span class="brand-note">architectural workspace</span>
        </div>
        <div class="brand-note">BLUEJETTY / 01</div>
      </header>

      <main>
        <p class="eyebrow">Start a workspace</p>
        <h1>Make space<br />for the work.</h1>
        <p class="intro">Choose a place to draw, arrange, or mark up your project. More workspaces can be added here as Draft grows.</p>
        <nav class="spaces" aria-label="Draft workspaces" id="spaces"></nav>
      </main>

      <footer>
        <span>Draft / Bluejetty</span>
        <span>Local-first architectural tools</span>
      </footer>
    </div>

    <script>
      // Add future workspaces here. Each entry becomes one launcher card.
      const spaces = [
        {
          code: "01 / MODEL",
          title: "Model Space",
          description: "Draft plans, walls, lines, and floor references in 2D.",
          href: "MODEL.dc.html",
          accent: "#5980a6",
        },
        {
          code: "02 / LAYOUT",
          title: "Layout Space",
          description: "Organize the project shell and page structure.",
          href: "LAYOUT.dc.html",
          accent: "#b58a4b",
        },
        {
          code: "03 / PDF",
          title: "PDF Markup",
          description: "Annotate drawings, plans, and reference documents.",
          href: "PDF-MARKUP.dc.html",
          accent: "#6b8b72",
        },
      ];

      document.querySelector("#spaces").innerHTML = spaces.map((space) => `
        <a class="space-card" href="${space.href}" style="--accent: ${space.accent}">
          <div>
            <div class="space-code">${space.code}</div>
            <div class="space-title">${space.title}</div>
            <div class="space-description">${space.description}</div>
          </div>
          <div class="space-open">
            <span>Open workspace</span>
            <span class="space-arrow" aria-hidden="true">↗</span>
          </div>
        </a>
      `).join("");
    </script>
    <noscript>
      <p>Please enable JavaScript to choose a Draft workspace.</p>
    </noscript>
  </body>
</html>
