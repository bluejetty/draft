<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rough Drafter — Architectural Workspace</title>
    <meta name="description" content="Rough Drafter: draw the outline, stamp the rooms, build the house." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Rough Drafter — Architectural Workspace" />
    <meta property="og:description" content="Rough Drafter: draw the outline, stamp the rooms, build the house." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #163653;
        --muted: rgba(22, 54, 83, 0.68);
        --line: rgba(22, 54, 83, 0.2);
        --paper: #eef5fb;
        --blue-dark: #1d4d78;
        --blue-medium: #3675a7;
        --blue-light: #77a8cb;
      }

      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        color: var(--ink);
        background:
          linear-gradient(rgba(22, 54, 83, 0.28) 1px, transparent 1px),
          linear-gradient(90deg, rgba(22, 54, 83, 0.28) 1px, transparent 1px),
          linear-gradient(rgba(22, 54, 83, 0.16) 1px, transparent 1px),
          linear-gradient(90deg, rgba(22, 54, 83, 0.16) 1px, transparent 1px),
          linear-gradient(rgba(22, 54, 83, 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(22, 54, 83, 0.07) 1px, transparent 1px),
          var(--paper);
        background-size: 1600px 1600px, 1600px 1600px, 160px 160px, 160px 160px, 16px 16px, 16px 16px;
        font-family: "Barlow Condensed", system-ui, sans-serif;
      }

      .shell {
        width: min(1120px, calc(100% - 48px));
        min-height: 100vh;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
      }

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 48px 0;
      }

      .enter-link {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        width: fit-content;
        margin: 0 auto;
        text-decoration: none;
        color: var(--ink);
        transition: transform 160ms ease;
      }
      .enter-link:hover,
      .enter-link:focus-visible {
        transform: translateY(-4px);
      }
      .enter-link:focus-visible {
        outline: 2px solid var(--blue-medium);
        outline-offset: 12px;
      }
      .enter-logo {
        display: block;
        width: clamp(320px, 52vw, 560px);
        aspect-ratio: 1;
        object-fit: contain;
        filter: drop-shadow(0 18px 30px rgba(22, 54, 83, 0.2));
        transition: filter 160ms ease;
      }
      .enter-link:hover .enter-logo,
      .enter-link:focus-visible .enter-logo {
        filter: drop-shadow(0 24px 38px rgba(22, 54, 83, 0.3));
      }
      .enter-name {
        font-size: clamp(38px, 6vw, 58px);
        font-weight: 600;
        letter-spacing: 0.14em;
        line-height: 1;
        text-transform: uppercase;
      }

      @media (max-width: 760px) {
        .shell { width: min(100% - 32px, 540px); }
        main { padding: 32px 0; }
        .enter-logo { width: min(86vw, 420px); }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <main>
        <a class="enter-link" href="MODEL.dc.html" aria-label="Open Rough Drafter model space">
          <img class="enter-logo" src="assets/rough-drafter-logo.png" alt="A white model house popping up from a house plan" />
          <span class="enter-name">Rough Drafter</span>
        </a>
      </main>
    </div>


  </body>
</html>
