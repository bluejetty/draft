name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # THE NODE HARNESSES, WHICH NOTHING HAS EVER RUN AUTOMATICALLY.
  #
  # The harness files under proto/, each one written to pin down a defect that
  # had already cost a session, and not one of them was executed by anything
  # but a person remembering to. A harness nobody runs is a test suite that
  # decays silently: it keeps passing on the author's machine right up until
  # the day it cannot run at all, and nothing says so.
  #
  # Two were in that state when this job was written. load-order-harness.js
  # and palette-harness.js required their subjects by ABSOLUTE path --
  # /home/user/draft/palette.js -- which resolves on exactly one machine. CI
  # checks out to /home/runner/work/draft/draft, so both would have failed
  # here on the first run with MODULE_NOT_FOUND. Measured before this job was
  # added, by pointing the baked prefix at a root that does not exist:
  #
  #   load-order-harness.js   exit=1   Cannot find module '.../layout-plan.js'
  #   palette-harness.js      exit=1   Cannot find module '.../palette.js'
  #
  # SEPARATE JOB, not a step in the shards below. It needs no browser and no
  # npm install -- the harnesses require only fs, path, vm and files in this
  # repo, measured -- so it finishes in about two seconds against the suite's
  # twenty minutes. A red here arrives before the shards have finished
  # installing chromium.
  #
  # PLAIN MODE FOR THE LOOP, deliberately. Plain mode asks the one question
  # that is always fair of every harness: do the checks pass?
  #
  # THE MUTATION ENGINES RUN IN A SECOND STEP, BY NAME. Three harnesses carry
  # a real engine -- merge-vertex, render-2d, wall-joins -- and each is run
  # with --mutate below, so a rotted engine goes red here instead of decaying
  # unnoticed. They are NAMED, not globbed, and the reason is stated without
  # a count, because the count has already changed once while this comment
  # was being written: any harness that does not reject a flag it does not
  # honour would take --mutate, run plain mode, and print a green table for a
  # mode that never ran. A loop passing --mutate is therefore only as honest
  # as the least-guarded file in the glob. That loop is the defect this job
  # exists to prevent, and an earlier version of this comment made it the
  # prerequisite -- "not until the guard is universal". The conclusion did
  # not follow: nobody has to use a loop. Three named lines need no guard on
  # anything else, and stay correct however many harnesses join the glob.
  #
  # ONE OF THE THREE GATES ON MORE THAN MUTATIONS. In render-2d-harness.js
  # --mutate and --coverage are ONE mode, byte-identical output, and it exits
  # non-zero when any painter has no checks as well as when a mutant survives
  # (`return missed || unchecked.length ? 1 : 0`). So a contributor adding a
  # painter before its checks gets a red from the line labelled "mutate", and
  # that red is a coverage failure, not a mutation one. The table says which:
  # read the "painters have checks" line before the mutation rows. Kept as one
  # gate on purpose -- splitting the modes is a real change to that harness
  # and can wait -- but it has to be stated, or the next person debugs a
  # mutation failure that is actually a coverage failure. Green today at
  # 17/17. wall-joins and merge-vertex have no painter gate.
  harnesses:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # @v7 ON ALL THREE ACTIONS, AND THE MAJOR WAS CHECKED PER ACTION.
      #
      # The @v4 tags declare `using: node20` in their own action.yml. GitHub is
      # retiring that runtime and already force-runs them on Node 24; today a
      # warning, later a hard failure. This is about the runtime the ACTIONS
      # execute in -- `node-version` below is a different thing entirely, the
      # Node our harnesses run under, and is deliberately left alone.
      #
      # The obvious fix was wrong. Bumping every @v4 to @v5 looks like it
      # addresses the deprecation and passes review, but:
      #
      #   upload-artifact@v4      node20   what we pinned
      #   upload-artifact@v5      node20   the obvious bump -- changes NOTHING
      #   upload-artifact@v7.0.1  node24   the actual fix
      #
      # A version bump indistinguishable from a real one except by the thing it
      # was supposed to change. The warning would keep firing and the next
      # person would assume it had been handled.
      #
      # And three-for-three on v7 is a COINCIDENCE, not a pattern: three repos
      # with independent release cadences that happen to have converged this
      # week. When the next deprecation comes round, or a fourth action joins
      # this file, the per-action action.yml check is still the only thing that
      # answers it. Do not infer the major from a sibling.
      #
      # Two more traps worth naming, both hit while getting this right:
      # the deprecation WARNING enumerates the actions that RAN, and
      # upload-artifact only runs `if: failure()` -- so reading the fix off a
      # green log gives two of the three. The file is the enumeration.
      # And do NOT set ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: it forces the
      # old runtime back, which is the wrong direction, and the word is in the
      # variable name for a reason.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The Node the HARNESSES run under, unrelated to the above. Held at
          # 20 deliberately: it is the version this code is tested against, and
          # moving it is a decision about the code, not about a runner warning.
          node-version: 20
      - name: Run every proto harness
        run: |
          # nullglob so an unmatched pattern gives an EMPTY ARRAY rather than
          # the literal string 'proto/*-harness.js' -- without it the loop
          # would run node against a filename that does not exist, and the
          # difference between "nothing matched" and "one thing failed" would
          # be lost.
          shopt -s nullglob
          harnesses=(proto/*-harness.js)

          # A LOOP THAT MATCHES NOTHING PASSES. That is the failure this job
          # is least able to notice about itself: rename the files, or move
          # them, and every run afterwards is green having executed nothing.
          # So the empty case is an explicit error, not a silent success.
          if [ ${#harnesses[@]} -eq 0 ]; then
            echo "no harnesses matched proto/*-harness.js -- nothing ran"
            exit 1
          fi
          echo "${#harnesses[@]} harnesses"
          echo

          # The glob is '*-harness.js', with the hyphen. proto/harness-args.js
          # is a MODULE, not a harness: running it directly defines its
          # exports and exits 0, which would sit in this list as a permanent
          # false pass. The hyphen excludes it by construction rather than by
          # a name in a list that someone has to maintain.
          failed=0
          for h in "${harnesses[@]}"; do
            # Captured, never piped. `exit=$?` after a pipe reads the LAST
            # command's status, which is how a deliberately broken harness
            # once reported success in this repo.
            out=$(node "$h" 2>&1) && code=0 || code=$?
            if [ "$code" -eq 0 ]; then
              printf 'ok    %s\n' "$h"
            else
              failed=$((failed + 1))
              printf 'FAIL  %s  (exit %s)\n' "$h" "$code"
              echo "$out" | tail -40 | sed 's/^/      /'
            fi
          done

          echo
          echo "$(( ${#harnesses[@]} - failed ))/${#harnesses[@]} harnesses passed"
          [ "$failed" -eq 0 ]

      - name: Run the mutation engines
        run: |
          # DERIVED, NOT LISTED. The first version of this step named three
          # engines by hand, and a fourth existed on a sibling branch before
          # it merged: a hand-kept list is a claim about the present that
          # nothing enforces. So the list is derived from the one fact that
          # makes a file an engine -- it calls mutationMode() from the shared
          # guard. The grep keys on the CALL FORM, require(...).mutationMode(),
          # because the bare name appears in comments in twenty harnesses
          # that have no engine at all. Every file this selects carries the
          # guard by construction, so the "least-guarded file in the glob"
          # objection to a glob does not apply here.
          shopt -s nullglob
          engines=()
          for h in proto/*-harness.js; do
            grep -qF "harness-args.js').mutationMode()" "$h" && engines+=("$h")
          done

          # A FLOOR, NOT AN INVENTORY. The derived list must contain every
          # engine known when this was written. Its job is to make "the grep
          # matched nothing" and "the grep matched fewer than we know exist"
          # impossible -- a rename or a moved require goes red here instead
          # of silently dropping an engine from a green run. It is a MINIMUM:
          # a fifth engine is picked up by the grep without touching this
          # list, and the list goes stale only in the safe direction.
          failed=0
          for must in proto/merge-vertex-harness.js \
                      proto/outline-accessors-harness.js \
                      proto/render-2d-harness.js \
                      proto/wall-joins-harness.js; do
            if ! printf '%s\n' "${engines[@]}" | grep -qx "$must"; then
              failed=$((failed + 1))
              echo "FAIL  $must is a known engine and the derived list does not contain it"
            fi
          done
          if [ ${#engines[@]} -eq 0 ]; then
            echo "no harness declares a mutation mode -- nothing ran"
            exit 1
          fi
          echo "${#engines[@]} engines"

          # EXIT 0 IS NOT ENOUGH. The grep sees a file that declares the mode,
          # not one that honours it: a harness that calls mutationMode() and
          # never wraps its loop in the result prints no table and exits 0.
          # So each engine must also print its table -- the "mutations caught"
          # line every engine ends on -- or the step is red. Same captured-
          # never-piped pattern as the loop above.
          for h in "${engines[@]}"; do
            out=$(node "$h" --mutate 2>&1) && code=0 || code=$?
            if [ "$code" -ne 0 ]; then
              failed=$((failed + 1))
              printf 'FAIL  %s --mutate  (exit %s)\n' "$h" "$code"
              echo "$out" | tail -40 | sed 's/^/      /'
            elif ! echo "$out" | grep -q "mutations caught"; then
              failed=$((failed + 1))
              printf 'FAIL  %s --mutate  exited 0 without printing a mutation table\n' "$h"
              echo "$out" | tail -20 | sed 's/^/      /'
            else
              printf 'ok    %s --mutate  %s\n' "$h" "$(echo "$out" | grep "mutations caught" | tail -1)"
            fi
          done
          [ "$failed" -eq 0 ]

  playwright:
    runs-on: ubuntu-latest
    # SIX SHARDS. IT WAS FOUR, AND THE READING THAT CHANGED IT IS BELOW.
    #
    # FOUR SHARDS, BECAUSE AN HOUR SERIAL HAD RUN OUT OF ROAD.
    #
    # The suite is serial by design -- workers: 1, fullyParallel: false -- so
    # its wall clock was the sum of every spec, and it climbed with each board:
    #
    #   763 tests   51.8m   green
    #   772 tests   53.3m   green
    #   784 tests   55.0m   CANCELLED at the old 55-minute wall, twice
    #   784 tests   57.9m   green, after the wall went to 90
    #
    # workers: 1 is not timidity. The specs share an origin -- one server, one
    # localStorage -- so parallel workers on one machine would clobber each
    # other. A SHARD GETS ITS OWN RUNNER AND THEREFORE ITS OWN ORIGIN, which is
    # the only way to go parallel without giving that protection up.
    #
    # Four, measured rather than guessed. A full local run of all 137 files,
    # split by Playwright's own file assignment:
    #
    #   4 shards   21.3  15.3  16.7  17.5 min      slowest 21.3 vs 17.7 ideal   3.33x
    #   6 shards   14.6  12.5  9.5  11.6  10.8  11.9                            4.87x
    #   8 shards   11.6  9.6  10.7  4.7  7.4  9.3  7.4  10.2                    6.09x
    #
    # Efficiency falls as shards are added -- 83%, 81%, 76% -- because the split
    # is by file COUNT and the heavy files cluster. undo-history-hardening is
    # the one that breaks it: 25s per test against a 5.6s suite average. More
    # shards cannot fix that; only hand-ordering the files could, and that has
    # to be re-done every time a spec is added.
    #
    # So 4, and stop. It is a real 3.3x. Six would buy about another four
    # minutes for fifty per cent more runner time. If that trade ever becomes
    # worth it, this is a one-character change in two places.
    #
    # Those figures are local, where the run summed to 70.9 minutes against
    # CI's 46 -- treat the ratios as sound and scale the absolutes by about
    # two thirds. Each shard re-pays checkout, npm ci and the browser install
    # (23s last measured), but they pay it in parallel: +30s to the wall clock,
    # not four times over.
    #
    # ── AND ON 22 SEP THAT TRADE BECAME WORTH IT. SIX. ────────────────────────
    #
    # The condition the paragraph above set was met, so the count has moved --
    # and it is no longer a change in two places: the divisor is now derived
    # from the matrix (see the run step). What met the condition, on CI's own
    # boxes:
    #
    #   run 1209  main, #455 merged   shard 1 TIMED OUT at globalTimeout
    #                                 368 passed, 23 DID NOT RUN
    #   run 1211  #456 on the branch  33.6  21.0  18.7  25.7 min   (99 total)
    #   run 1212  main, #456 merged   shard 1 over 35m again; 21.4  20.6  27.7
    #
    # Twice in one day, and the second time on a green PR whose own run had
    # cleared the wall by 83 seconds. playwright.config.js sets globalTimeout to
    # 35 minutes so an overrunning run REPORTS BY NAME instead of being killed
    # grey by the runner -- Movie's ruling of 15 Sep. It is working exactly as
    # written: run 1209's badge is red and legible. But a shard that routinely
    # needs the whole 35 has no margin left to report anything WITH, and the
    # config comment named this in advance: "Raising `timeout` or adding heavy
    # specs eats that margin."
    #
    # NOT BY RAISING THE CEILING. That is the one fix the ruling rules out: the
    # ceiling exists to bound how long a hung run takes to speak, so lifting it
    # buys green by making the failure case slower. The work is what has to come
    # down, and more shards is the only lever that brings it down without giving
    # up `workers: 1`.
    #
    # AND THE CLUSTERING DIAGNOSIS ABOVE IS NOW WRONG, which matters more than
    # the number. Run 1211 against the test counts in each shard:
    #
    #   shard 1   392 tests   33.6 min      5.15 s/test
    #   shard 2   390 tests   21.0 min      3.23 s/test
    #   shard 3   386 tests   18.7 min      2.91 s/test
    #   shard 4   386 tests   25.7 min      4.00 s/test   <- holds
    #                                                        undo-history-hardening
    #                                                        AND controls
    #
    # The counts are balanced to within six tests, so Playwright's split is
    # doing its job. And the two files the paragraph above blames are both on
    # shard 4, which finishes EIGHT MINUTES BEFORE shard 1. Whatever makes
    # shard 1 cost 1.8x per test is something else and has not been found; a
    # reading that starts from undo-history-hardening starts in the wrong file.
    # Left as a measured open question rather than a guess.
    #
    # WHAT SIX IS EXPECTED TO DO, and it is an expectation, not a measurement:
    # 99 minutes over six shards is 16.5 ideal, and shard 1's 1.36x share of
    # ideal puts the worst at about 22. That restores roughly the margin the
    # config comment was written around. THE REAL NUMBER IS THE NEXT RUN OF
    # THIS FILE -- if the worst shard comes back near 30 again, the answer is
    # eight, or finding what shard 1 is actually doing.
    # 45, AND IT SITS ABOVE playwright.config.js's 35-MINUTE globalTimeout.
    # The two numbers are one mechanism and must not be edited apart.
    #
    # It was 40, and on 14 Sep shard 3 hit it on two consecutive runs and was
    # CANCELLED -- a grey badge with no failure text, twice read as
    # inconclusive. Fifteen tests were waiting on controls §6 correctly puts
    # away on a TOY board; twenty real failures sat behind that badge. The
    # per-test timeout was working perfectly: each one failed by name at 180s.
    # Fifteen times 180s simply outran the cap, and the runner killed the
    # reporter mid-sentence.
    #
    # THE SENTENCE BELOW ALREADY SAYS WHY THIS MATTERS, about sibling shards:
    # "one red and three cancelled is a mystery". A shard cancelled by its own
    # cap is the same mystery arriving by a different road. Playwright now
    # stops itself at 35m and prints what it has; this cap only has to stay
    # far enough above that the reporter is never interrupted.
    #
    # Ruled by Movie, 15 Sep: "a hung test must fail by name, under the job
    # limit, not cancel the shard".
    timeout-minutes: 45
    strategy:
        # EVERY SHARD'S RESULT, ALWAYS. A failing shard must not cancel its
      # siblings: five green and one red is a diagnosis, and one red and five
      # cancelled is a mystery.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # THE DIVISOR IS THE MATRIX, not a second number beside it.
      #
      # `strategy.job-total` IS the length of the matrix above, so the two
      # cannot disagree. Written as a literal they can, and one of the two ways
      # they disagree is SILENT: leave the matrix at four while this says /6 and
      # a third of the suite never runs, with four green badges saying it did.
      # (The other way round is loud -- Playwright rejects --shard=5/4 -- which
      # is exactly the asymmetry that makes the first one dangerous.)
      #
      # That is the same failure the harness job guards against above with "a
      # loop that matches nothing passes", and it is worth the same care: this
      # file's own history called changing the count "a one-character change in
      # two places", which is a count of the places it can be got half-done.
      # Now there is one.
      - run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          # Unique per shard: upload-artifact v4 rejects a duplicate name
          # outright, so a shared one would lose the traces of whichever shard
          # finished second -- exactly when they are wanted.
          name: playwright-traces-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
