<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<!-- Self-hosted (see vendor/fonts.css): no third-party request on the
     critical path of the page. -->
<link rel="stylesheet" href="vendor/fonts.css" />
<!-- THE SHELL EVERY PAGE WEARS. The stylesheet first so the bars are skinned
     on the first frame; the module below palette.js, because a bar with no
     roles resolved is a bar with no colours -- and before the body, because
     the bars are written where their mount call stands, mid-parse. -->
<link rel="stylesheet" href="./shell-bars.css" />
<!-- COLOUR BEFORE ANYTHING PAINTS, and FIRST, because every script below
     this line may reach for a role. palette.js is a table with two consumers
     -- toCSS() for the stylesheet and resolve() for the painters -- and this
     page uses both: the block below is written entirely in --role tokens, and
     _draw() clears the desk to the same table. -->
<script src="./palette.js"></script>
<script>
  // THE SKIN IS ONE CHOICE ACROSS THE WHOLE APP, not one per page. MODEL
  // stores the drafter's pick under `draft-skin` and reads ?theme=/?mode= as
  // a per-visit override; this page reads the SAME key the SAME way, so
  // walking from the model space to the construction layout does not change
  // the lights. Defaults match MODEL's -- ruff, night.
  //
  // Synchronous, and in the head ON PURPOSE. Between parse and boot a page
  // written in --role tokens has no colour at all; applying here means the
  // first frame the browser paints is already skinned.
  //
  // IT ONLY READS THE CHOICE TODAY. The switcher lives in the shared top bar,
  // which this page does not wear yet; when it does, that bar's onSkin
  // callback repaints the sheet and this comment comes out.
  (() => {
    const P = window.DraftPalette;
    const params = new URLSearchParams(location.search);
    const stored = (() => {
      try { return JSON.parse(localStorage.getItem('draft-skin') || 'null') || {}; }
      catch { return {}; }
    })();
    const pick = (name, allowed, fallback) => {
      const asked = params.get(name);
      if (asked && allowed.includes(asked)) return asked;
      if (asked) {
        console.warn(`LAYOUT: unknown ${name} "${asked}"; using ${fallback}. `
          + `Known: ${allowed.join(', ')}`);
      }
      return allowed.includes(stored[name]) ? stored[name] : fallback;
    };
    window.__layoutSkin = {
      theme: pick('theme', P.THEMES, 'ruff'),
      mode: pick('mode', P.MODES, 'night'),
    };
    P.apply(document, window.__layoutSkin.theme, window.__layoutSkin.mode);
  })();
</script>
<script src="./shell-bars.js"></script>
<script src="./profile-manager.js"></script>
<script src="./shared-file-store.js"></script>
<script src="./drawing-format.js"></script>
<script src="./wall-types.js"></script>
<script src="./level-assembly.js"></script>
<script src="./render-2d.js"></script>
<script src="./geometry-2d.js"></script>
<script src="./layer-views.js"></script>
<!-- THE PLAN IS COMPOSED ONCE AND THIS PAGE IS ONE OF THE CALLERS. It carries
     the draw order and the level/view filtering the Model Space uses, so a
     construction sheet and the drafter's screen cannot disagree about what a
     plan contains. layout-plan.js turns this page's saved JSON into the
     entities it draws; the drawing itself is not this page's to own. -->
<!-- The stair arithmetic the plan composition hands to render-2d's painter:
     MODEL.dc.html's own helpers for it are two-line wrappers over this. -->
<script src="./stair-geometry.js"></script>
<!-- What a fixture IS on a plan. A washroom, a kitchen and a laundry are all
     drawn as wall-hosted fixtures, so a construction sheet that cannot resolve
     one draws an empty room where the three-piece WC should be. closets.js is
     here because the closet is a fixture too and the painter reads its
     numbers. -->
<script src="./closets.js"></script>
<script src="./fixture-geometry.js"></script>
<script src="./plan-composition.js"></script>
<script src="./layout-plan.js"></script>
<script src="./formatters.js"></script>
<script src="./cut-view.js"></script>
<script src="./titleblock.js"></script>
<!-- Landscape on every working screen (board #310): in portrait on a touch
     device this covers the page until the tablet is turned. ENTRY is the one
     screen that does not load it. -->
<script src="./orientation-guard.js"></script>
<style>
  /* THE STYLES THIS PAGE USED TO WEAR INLINE. Every rule below was a `style=`
     attribute in LAYOUT.dc.html -- 67 of them, carrying 140 colour literals
     between them -- because a DC template has nowhere else to put them. They
     became rules when the page was ported; the colours became palette roles
     on 24 Sep, which is what lets this page answer to the same four skins as
     the rest of the shop.

     THE SHEET IS PAPER. THE ROOM AROUND IT IS CHROME. That sentence is the
     whole conversion policy, and it is worth stating because it is why half
     the literals on this page are still literals. A construction sheet is
     white with near-black ink on every skin -- that is what the plotter
     prints, and a sheet that changed colour with the lights would be lying
     about the drawing. So the paper, its margin guide, its titleblock and the
     frames drawn ON it keep their values, and they live in the canvas painter
     with a note of their own. Everything the drafter looks THROUGH to reach
     the sheet -- this panel, the bars, the dialog, the desk the paper lies on
     -- takes a role. Nothing in this block paints on paper.

     A DARK FACE IS NOT --ink-primary, and this is the trap the conversion was
     walked into. `.lay-pick.lay-paper.on` read `background:#1d1f20;
     color:#f2f2f3`, and the obvious reading of that pair is "ink, and the
     page on top of it". It is neither. On the night skin --ink-primary is
     #e7e5e2, so mapping the BACKGROUND to it would have made a chosen chip
     near-white with near-white lettering -- the exact defect that left SPECS
     a white page nobody could read. A selected face is --accent with
     --accent-ink on it, which is the idiom #units-corner and #mode-corner
     already use in the shared bar.

     AND THE ACCENT IS NOT REDECLARED HERE. shell-bars.css gives `aside` the
     mark colour (`--accent: var(--accent-mark)`) on Movie's 17 Sep rule about
     small outlines and text in menu areas. That rule holds for LINES and
     LETTERING, not for fills, and this panel is full of filled accent faces:
     on RUFF night the mark is gold and --accent-ink is white, so a blanket
     redeclaration would paint every chosen chip white-on-gold. The two
     outline states below name --accent-mark themselves instead. */
  *, *::before, *::after { box-sizing: border-box; }
  /* THE PAGE IS A COLUMN BETWEEN TWO FIXED BARS. It used to be three boxes in
     flow -- its own 44px top bar, a body at calc(100vh - 72px), a 28px status
     bar -- and that arithmetic was written out by hand in one place and had to
     agree with two heights typed in another.

     The shared bars are position:fixed, so they are NOT flex items and take no
     space in this column. The padding is what holds the column clear of them,
     and every number in it is the bar's own token: --strip-h at the head,
     --house-h plus --browser-lane at the foot. A bar that changes height moves
     this page with it, which is the point of the tokens existing.

     --browser-lane IS IN THE SUM, and leaving it out is the mistake worth
     naming: it is the band Firefox draws its link preview over and iOS keeps
     for the home indicator, and #house-strip reserves it as PADDING inside its
     own box. A page that subtracted only --house-h would put its last 24px
     under the bar's hem. */
  html { height:100%; }
  body { height:100vh; margin:0; overflow:hidden;
    display:flex; flex-direction:column;
    padding-top: var(--strip-h);
    padding-bottom: calc(var(--house-h) + var(--browser-lane));
    background-color: var(--surface-page); background-image: var(--surface-page-tex, none);
    font-family:'Barlow', system-ui, sans-serif; color: var(--ink-primary); }
  a { color: var(--ink-quiet); text-decoration:none;
    font-family:'Barlow Condensed', system-ui, sans-serif; font-weight:600;
    font-size:12px; letter-spacing:0.08em; text-transform:uppercase; }
  a:hover { color: var(--accent); }
  [hidden] { display:none !important; }

  /* THE PROFILE PAIR, wherever it is opened from. It rode the status bar for
     one commit and came straight back off (Movie: "not needed here in that
     location"), so what is left is the button face -- the dialog is still
     the only door in the app to READING a profile package back in, and the
     two openers now sit with the sheet's own controls at the foot of the
     panel. */
  #lay-profile { display:flex; gap:3px; margin-top:6px; }
  #lay-profile .layout-profile-button { flex:1; min-width:0; text-align:center; }
  /* The count reads as quietly as the rest of the strip. */
  [data-visit-counter-home] { margin-left:14px; display:inline-flex;
    align-items:center; color: var(--ink-quiet); }
  [data-visit-counter-home] * { font-family:'Barlow Condensed', system-ui, sans-serif;
    font-size:11px; letter-spacing:0.06em; }
  .layout-profile-button { min-width:64px; border:1px solid var(--edge-panel);
    background-color: var(--surface-chip); background-image: var(--surface-chip-tex, none);
    color: var(--ink-primary); padding:2px 6px;
    font-family:'Barlow Condensed', system-ui, sans-serif; font-size:9px;
    font-weight:600; letter-spacing:0.05em; cursor:pointer; }
  /* NEITHER WEARS THE ACCENT. SETTINGS carried a filled dark face on the old
     top bar, where it was the only colour in the strip and read as "start
     here". On the status bar it sits a few pixels above the page row, whose
     lit chip is the accent and means THIS IS THE PAGE YOU ARE ON -- so a
     second accent-filled chip in the same corner was saying that about a
     dialog. Both are outlines; the hover is the mark, like every other line
     and lettering on this page. */
  .layout-profile-button:hover { border-color: var(--accent-mark); color: var(--accent-mark); }
  @media (max-width:560px) {
    .layout-profile-button { min-width:48px; padding:1px 4px; font-size:7px; }
  }

  /* ── THE PROFILE DIALOG ─────────────────────────────────────────────── */
  /* THE SCRIM IS THE SHOP'S SCRIM. It was rgba(29,31,32,0.18) -- the page's
     own ink at 18%, which is a visible veil over a white page and very nearly
     nothing over a night one. shell-bars.css names rgba(0,0,0,0.35) as one of
     the four literals that survive the palette on purpose: black at 35%
     darkens whatever is behind it, which is the job on all four skins. Two
     scrims on one page, one of them skin-blind, is the drift this whole
     exercise is about, so this page uses that one. */
  #lay-scrim { position:fixed; inset:0; z-index:50; display:flex;
    align-items:flex-start; justify-content:center; padding-top:78px;
    background:rgba(0,0,0,0.35); }
  /* The card is .promote-card's shell (MODEL.html:865), down to the
     translucent panel: a modal over a 35% scrim is already separated from
     the page, so it does not also need to be opaque. */
  #lay-dialog { width:min(400px, calc(100vw - 32px));
    border:1px solid var(--edge-panel);
    background-color: var(--surface-panel); background-image: var(--surface-panel-tex, none);
    box-shadow:0 16px 44px rgba(0,0,0,0.35); padding:18px; color: var(--ink-primary); }
  #lay-dialog .lay-head { display:flex; align-items:flex-start; gap:14px; }
  #lay-dialog .lay-head > div { flex:1; }
  #lay-dialog-title { font-family:'Barlow Condensed', system-ui, sans-serif;
    font-size:17px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; }
  #lay-dialog-description { margin-top:5px; font-size:12px; line-height:1.45;
    color: var(--ink-secondary); }
  /* THE MARK, NOT THE ACCENT, and this one is measured rather than assumed:
     11px uppercase in --accent over the dialog's panel is 4.28 on RUFF night,
     under AA's 4.5, and the same text in --accent-mark is 9.32. It is also
     exactly what Movie asked for on 17 Sep -- "the stuff outlines and text in
     the menu areas". The rule for this page: LINES AND LETTERING take the
     mark, FILLS take the accent, because --accent-ink is measured against the
     accent and nothing else. On RUFF night that mark is gold and accent-ink
     is white, so a filled face wearing it would be white on gold. */
  #lay-keys-link { display:inline-block; margin-top:9px; color: var(--accent-mark);
    font-family:'Barlow Condensed', system-ui, sans-serif; font-size:11px;
    font-weight:600; letter-spacing:0.06em; text-transform:uppercase; }
  #lay-dialog-close { border:none; background:transparent; color: var(--ink-quiet);
    font-size:18px; line-height:1; cursor:pointer; }
  .lay-field-label { margin-top:16px; font-family:'Barlow Condensed', system-ui, sans-serif;
    font-size:11px; font-weight:600; letter-spacing:0.07em; text-transform:uppercase;
    color: var(--ink-quiet); }
  .lay-field { display:flex; align-items:center; margin-top:5px; }
  #lay-file-name { min-width:0; flex:1; height:32px;
    border:1px solid var(--edge-panel);
    background-color: var(--surface-chip); padding:5px 8px; color: var(--ink-primary);
    font-family:'Barlow', system-ui, sans-serif; font-size:12px; outline:none; }
  #lay-file-name:focus { border-color: var(--accent-mark); }
  #lay-file-ext { margin-left:6px; color: var(--ink-quiet);
    font-family:'Barlow Condensed', system-ui, sans-serif; font-size:12px; white-space:nowrap; }
  #lay-save { width:100%; height:34px; margin-top:10px; border:1px solid var(--accent);
    background-color: var(--accent); color: var(--accent-ink);
    font-family:'Barlow Condensed', system-ui, sans-serif;
    font-size:12px; font-weight:600; letter-spacing:0.06em; cursor:pointer; }
  #lay-import-box { margin-top:14px; border:1px dashed var(--edge-panel);
    background-color: var(--surface-chip); background-image: var(--surface-chip-tex, none);
    padding:12px; text-align:center; }
  #lay-import-box .lay-import-word { font-family:'Barlow Condensed', system-ui, sans-serif;
    font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase;
    color: var(--ink-quiet); }
  #lay-import { height:28px; margin-top:8px; border:1px solid var(--edge-panel);
    background-color: var(--surface-panel); background-image: var(--surface-panel-tex, none);
    color: var(--ink-primary); padding:3px 12px;
    font-family:'Barlow Condensed', system-ui, sans-serif; font-size:11px;
    font-weight:600; letter-spacing:0.06em; cursor:pointer; }
  #lay-import:hover { border-color: var(--accent-mark); color: var(--accent-mark); }
  /* THE TWO MESSAGE COLOURS STAY LITERAL, and they are the only ink in this
     block that does. palette.js has no role for "it worked" or "it did not":
     PROJECT.html keeps #557a46 on its own #status for exactly this reason and
     MODEL.html keeps #b04050 on .sel-help, so a third spelling here would be
     a new fact rather than a shared one. Both are on the allowlist in
     proto/skinned-page-harness.js, which is where widening it has to be
     argued for. */
  #lay-dialog-message { margin-top:10px; font-size:11px; line-height:1.4; color:#557a46; }
  #lay-dialog-message.lay-bad { color:#b04050; }

  /* ── BODY, PANEL, SECTIONS ──────────────────────────────────────────── */
  /* FLEX RATHER THAN A HEIGHT. calc(100vh - 72px) was the old page's own sum
     of its two bars; the column above does that arithmetic now, so this just
     takes what is left. min-height:0 is what lets it SHRINK -- a flex item's
     default min-height is auto, so the panel's content would otherwise push
     the sheet past the foot of the screen on a short window. */
  #lay-body { display:flex; flex:1; min-height:0; }
  #lay-panel { width:188px; border-right:1px solid var(--edge-panel);
    display:flex; flex-direction:column; flex-shrink:0; overflow-y:auto;
    background-color: var(--surface-panel); background-image: var(--surface-panel-tex, none);
    color: var(--ink-primary); font-size:13px; }
  .lay-section { padding:12px 14px; border-bottom:1px solid var(--edge-panel); }
  .lay-section-title { font-family:'Barlow Condensed', system-ui, sans-serif;
    font-size:11px; letter-spacing:0.08em; text-transform:uppercase;
    color: var(--ink-quiet); margin-bottom:8px; }

  /* A PANEL BUTTON, and the three sizes of it the panel actually uses. `.on`
     is the chosen one -- a class rather than a colour handed down from the
     render, which is what the DC template did and what made every one of
     these a style attribute. */
  .lay-pick { display:block; width:100%; text-align:left;
    border:1px solid var(--edge-panel);
    background-color: var(--surface-chip); background-image: var(--surface-chip-tex, none);
    color: var(--ink-primary);
    font-family:'Barlow Condensed', system-ui, sans-serif; font-weight:600;
    letter-spacing:0.02em; text-transform:uppercase; padding:5px 10px;
    cursor:pointer; margin-bottom:3px; font-size:11px; }
  /* CHOSEN IS AN OUTLINE, not the faint wash it used to be. The wash was
     rgba(29,31,32,0.09) -- ink at 9% over white, which is a shade of grey and
     not a colour the skins have. The .chip.lit idiom says the same thing in
     one the four skins all define, and it is the mark rather than the accent
     for Movie's reason: these are hairlines and 11px lettering inside a
     menu. */
  .lay-pick.on { border-color: var(--accent-mark); color: var(--accent-mark); }
  .lay-pick.lay-paper { font-size:12px; letter-spacing:0.04em; padding:7px 12px; margin-bottom:4px; }
  /* THE ONE FILLED FACE in the pick list: paper is the drafter's largest
     decision on this page and it reads as a chip that is ON rather than one
     that is merely outlined. --accent, NOT --accent-mark, because --accent-ink
     is measured against the accent and nothing else. */
  .lay-pick.lay-paper.on { border-color: var(--accent);
    background-color: var(--accent); background-image:none; color: var(--accent-ink); }
  #lay-add-sheet { display:block; width:100%; text-align:left;
    border:1px dashed var(--edge-panel); background:none; color: var(--ink-quiet);
    font-family:'Barlow Condensed', system-ui, sans-serif; font-weight:600;
    font-size:11px; letter-spacing:0.02em; text-transform:uppercase;
    padding:5px 10px; cursor:pointer; }
  #lay-add-sheet:hover { border-color: var(--accent-mark); color: var(--accent-mark); }
  #lay-north { margin-top:6px; margin-bottom:0; }
  #lay-north.on { border-color: var(--accent);
    background-color: var(--accent); background-image:none; color: var(--accent-ink); }

  /* ── ORIENTATION, A SEGMENTED PAIR ──────────────────────────────────── */
  .lay-seg { display:inline-flex; overflow:hidden; border:1px solid var(--edge-panel); }
  .lay-seg button { padding:7px 10px; font-size:12px; font-weight:600;
    font-family:'Barlow Condensed', system-ui, sans-serif; letter-spacing:0.04em;
    border:none;
    background-color: var(--surface-chip); background-image: var(--surface-chip-tex, none);
    color: var(--ink-primary); cursor:pointer; }
  .lay-seg button:first-child { border-right:1px solid var(--edge-panel); }
  .lay-seg button.on { background-color: var(--accent); background-image:none;
    color: var(--accent-ink); }

  /* ── THE VIEWPORT SECTION, PINNED TO THE FOOT OF THE PANEL ──────────── */
  /* Movie, 21 Sep, on an empty sheet: "the layouts aren't autogenerating
     views". Two things were true and only one of them was the feature.
     Measured at his window size (188px column, 660px of usable height), the
     one button that MAKES something sat 320px below the fold, behind nine
     scale buttons and two more sections, in a column that scrolls with
     nothing on screen to say so.

     STICKY RATHER THAN MOVED UP, and that is the choice worth stating. The
     panel's order is the drafter's order -- paper, then orientation, then
     sheet, then scale, then level, then place it -- so hoisting the verb
     above the settings it depends on would trade one confusion for another.
     `margin-top:auto` holds it at the foot when the panel is SHORTER than its
     box; `position:sticky` holds it there when the panel is taller and
     scrolls. Both happen: the level and titleblock sections appear only when
     the drawing has them. */
  /* AND ITS GROUND HAS TO BE OPAQUE, which the panel's own is not.
     --surface-panel is rgba(20,22,23,0.50) on night and 60% on day, so a
     sticky footer wearing it would have the scale buttons sliding visibly
     underneath. --surface-chip is a flat hex on both modes. That is the whole
     reason this one surface differs from the column it sits in. */
  #lay-viewport-section { padding:12px 14px; position:sticky; bottom:0;
    margin-top:auto;
    background-color: var(--surface-chip); background-image: var(--surface-chip-tex, none);
    border-top:1px solid var(--edge-panel); }
  #lay-add-viewport { display:block; width:100%; text-align:center;
    border:1px solid var(--accent);
    background-color: var(--accent); color: var(--accent-ink);
    font-family:'Barlow Condensed', system-ui, sans-serif; font-weight:600;
    font-size:13px; letter-spacing:0.04em; text-transform:uppercase;
    padding:9px 12px; cursor:pointer; }
  /* ARMED IS THE FACE TURNED INSIDE OUT. It was a swap to the page's near-
     black, which on a night skin is the page itself -- the button would have
     vanished at the moment it most needs to be seen. An outline where the
     fill was says "this is taking your next press" on every skin. */
  #lay-add-viewport.arming { background-color: var(--surface-chip);
    background-image: var(--surface-chip-tex, none); color: var(--accent-mark); }
  #lay-deal { display:block; width:100%; margin-top:6px; text-align:center;
    border:1px solid var(--edge-panel);
    background-color: var(--surface-panel); background-image: var(--surface-panel-tex, none);
    color: var(--ink-primary);
    font-family:'Barlow Condensed', system-ui, sans-serif; font-weight:600;
    font-size:13px; letter-spacing:0.04em; text-transform:uppercase;
    padding:9px 12px; cursor:pointer; }
  /* Dead with no drawing, for the note's reason: there is nothing to project.
     The note below already says so, so the button does not repeat it. */
  #lay-deal:disabled { background:none; color: var(--ink-quiet);
    border-color: var(--edge-panel); cursor:default; }
  #lay-viewport-note { margin-top:8px; font-size:11px; line-height:1.4; color: var(--ink-quiet); }

  /* ── THE SHEET ──────────────────────────────────────────────────────── */
  /* THE DESK, and the one surface in this block that the canvas paints too:
     _draw() clears to the same role, because the wrap shows only in the
     moment before the first frame and behind a canvas that has not been
     sized yet. It was #c8c8c8 -- a mid grey chosen to set a white sheet off,
     which is a job --surface-page does on three skins and nearly not at all
     on day, where the page is #f2f2f3. The sheet's drop shadow is what holds
     that edge, and it is drawn for this reason rather than for depth. */
  #lay-canvas-wrap { flex:1; position:relative; overflow:hidden;
    background-color: var(--surface-page); background-image: var(--surface-page-tex, none); }
  /* touch-action:none ONLY on the sheet (audit C2): a finger dragging a
     viewport must not be taken by the browser as page scroll. The panels and
     the scale list around it still scroll by touch. */
  #lay-canvas { display:block; width:100%; height:100%; outline:none; touch-action:none; cursor:default; }
  #lay-canvas.arming { cursor:crosshair; }
  #lay-canvas.grabbing { cursor:grabbing; }

  /* ── STATUS BAR ─────────────────────────────────────────────────────── */
  /* IN THE COLUMN, NOT FIXED, so it sits directly on top of the shared bottom
     bar without either knowing the other's height. MODEL's readout solves the
     same problem the other way -- position:fixed at --readout-bottom -- because
     it FLOATS over the drawing and this does not: this is a full-width strip
     the sheet has to end above, which is exactly what a flex sibling is. */
  #lay-status-bar { height:28px; flex-shrink:0; border-top:1px solid var(--edge-panel);
    display:flex; align-items:center; padding:0 18px;
    font-family:'Barlow Condensed', system-ui, sans-serif; font-size:11px;
    letter-spacing:0.06em; color: var(--ink-quiet);
    background-color: var(--surface-panel); background-image: var(--surface-panel-tex, none);
    flex-shrink:0; user-select:none; }
  #lay-status-bar .lay-spacer { flex:1; }
  /* A failed sheet save has to be visible. It used to be a console.warn: the
     drafter kept placing viewports onto a sheet that was not being written
     anywhere. Same readout the Model Space carries, and the same failure red
     as the dialog's -- see the note on #lay-dialog-message. */
  [data-layout-status].lay-bad { color:#b04050; font-weight:600; }

<script>
// ── THE PAGE, OFF THE DC RUNTIME ────────────────────────────────────────
//
// This file was LAYOUT.dc.html: a React component behind two vendor bundles
// and support.js, with its markup in an <x-dc> template of 89 `{{ }}`
// bindings. Everything below the panel painter is the same code it was --
// the geometry, the composer, the save queue, the history, the cut and plan
// painters' callers -- because the port is of the PLUMBING and a port that
// also rewrites the logic has nothing left to compare against.
//
// WHAT DCLogic ACTUALLY PROVIDED, in full: `state`, a `setState(patch, cb)`
// that merges and then re-renders and then calls back, `componentDidMount`,
// and `renderVals()` -- the flat object the template drew itself from. That
// is the whole contract, and it is reproduced here in twenty lines.
//
// SYNCHRONOUS, WHERE REACT WAS BATCHED, and that is a deliberate difference
// rather than an oversight. React replaced `this.state` immediately and ran
// the callback after the commit, so code that reads `this.state` straight
// after a setState already saw the patch -- this does the same. What it does
// not do is coalesce two setStates into one paint. That costs a paint and
// buys an ordering nobody has to reason about, on a page whose every paint
// is a handful of DOM writes.
class PageLogic {
  constructor() {
    this.state = {};
    this.__painting = false;
  }

  setState(update, cb) {
    const patch = typeof update === 'function' ? update(this.state) : update;
    this.state = { ...this.state, ...patch };
    this.__paint();
    if (cb) cb();
  }

  // The guard is not for this page -- renderVals builds values and touches
  // nothing -- it is so that a paint which one day sets state cannot spin.
  __paint() {
    if (this.__painting) return;
    this.__painting = true;
    try { this._paintPanel(); } finally { this.__painting = false; }
  }

  componentDidMount() {}
  _paintPanel() {}
}

// Paper sizes in inches [width, height] in portrait orientation
const PAPER_SIZES = {
  '11x17': { label: '11 × 17  (Ledger)', w: 11, h: 17 },
  '8.5x11': { label: '8.5 × 11  (Letter)', w: 8.5, h: 11 },
};

// Architectural scales: label, paperInchesPerFoot
const SCALES = [
  { label: '1/16" = 1\'-0"', pif: 1/16 },
  { label: '3/32" = 1\'-0"', pif: 3/32 },
  { label: '1/8" = 1\'-0"',  pif: 1/8  },
  { label: '3/16" = 1\'-0"', pif: 3/16 },
  { label: '1/4" = 1\'-0"',  pif: 1/4  },
  { label: '3/8" = 1\'-0"',  pif: 3/8  },
  { label: '1/2" = 1\'-0"',  pif: 1/2  },
  { label: '3/4" = 1\'-0"',  pif: 3/4  },
  { label: '1" = 1\'-0"',    pif: 1    },
];

// The auto composer's ladder, largest first: the working plan scale, then the
// honest steps down. Largest first, first rung that fits. 3/32" is the floor —
// half a step under 1/8", and the rung a wide house lands on rather than
// halving to 1/16". Below that nothing is dealt automatically: 1/16" reads too
// small to draft from, and a site plan wants an engineer's scale rather than
// the bottom of this ladder. Too big is self-evident; too small is an opinion,
// so the rule needs no fill threshold to tune.
const AUTO_SCALE_PREFS = [1 / 4, 3 / 16, 1 / 8, 3 / 32];
const WORKING_SCALE_IDX = SCALES.findIndex(s => s.pif === 1 / 4);
const AUTO_SCALE_LAST_RESORT = 3 / 32;
// A view's type picks which ladder it walks; the chooser is the same either
// way. A site plan at 1/8" is nonsense -- it wants an engineer's scale.
// Metric (1:50/1:100/1:200, site 1:250/1:500) is a drawing-wide setting
// rather than a per-view one, so adding it later is another entry here plus
// a lookup by the drawing's unit -- not a rewrite of the chooser.
const SITE_SCALE_PREFS = [1 / 120, 1 / 240, 1 / 360, 1 / 480];  // 1"=10',20',30',40'
const SCALE_FAMILIES = Object.freeze({
  architect: Object.freeze({ prefs: AUTO_SCALE_PREFS, lastResort: AUTO_SCALE_LAST_RESORT }),
  site:      Object.freeze({ prefs: SITE_SCALE_PREFS, lastResort: 1 / 480 }),
});
const scaleFamilyFor = view => (view && view.kind === 'site' ? 'site' : 'architect');

// Composer spacing, in paper inches: air between viewports, and the caption
// line each viewport wears under its frame.
// What a view claims on paper is the rectangle it DRAWS plus everything
// drawn around it. Dimension strings and elevation markers are not on
// elevations yet, so their allowances are zero — named and zero, so that
// adding them later moves the chosen scale by itself instead of sending
// someone back into this arithmetic. Feet per side.
// (The caption below the frame is COMPOSE_LABEL_IN and is counted there —
// do not add it again here.)
//
// AND `dimensions` STAYS ZERO FOR A PLAN ON PURPOSE, now that plans draw
// theirs (21 Sep). An allowance is a guess standing in for a measurement, and
// `_planBounds` measures: it takes the real extent of the strings in the
// drawing, which was 4.5 ft on one side and 3 ft on the other of the first
// house it met. A constant here would have to be the worst case for every
// drawing, and would then be wrong -- too roomy -- for all the rest.
// It is still the right hook for an ELEVATION, where dimensions are not drawn
// yet and so cannot be measured, which is why it keeps its name and its zero.
const VIEW_ALLOWANCE_FT = Object.freeze({
  dimensions: 0,   // strings standing off the object
  markers: 0,      // elevation / level markers hanging off the sides
});
const COMPOSE_GAP_IN = 0.35;
const COMPOSE_LABEL_IN = 0.3;

// The four standard elevations stand just outside the plan, the same rule the
// Model Space's E marks follow: dirVec points at the side the viewer is on.
const E_MARK_SIDES = {
  E1: { side: 'S', sign: 1,  dir: { x: 0,  z: 1 } },
  E2: { side: 'W', sign: -1, dir: { x: -1, z: 0 } },
  E3: { side: 'N', sign: -1, dir: { x: 0,  z: -1 } },
  E4: { side: 'E', sign: 1,  dir: { x: 1,  z: 0 } },
};
const E_MARK_CLEAR_FT = 2;

// The level assembly comes from level-assembly.js, which MODEL.dc.html binds
// the same way. This file used to keep its own copy, described in its own
// comment as "mirrored so the sheet reads a saved drawing the way the
// drawing's own screens do" -- an intent a copy can only approximate.
//
// IT HAD ALREADY DRIFTED, and quietly: the copy here answered SIX fields where
// MODEL's answers eight, missing joistType and joistSpacingIn. Both boards
// hand this object to cut-view.js, so that shared painter was being given two
// different shapes depending on which page called it. It worked only because
// cut-view reads three fields and all three happened to be in both. That is
// luck holding, not a design.
//
// The six shared fields were value-identical -- proved by a differential over
// 8002 comparisons against this file's own text before it was deleted, with
// seven mutations to show the check could fail. So this adopts a superset: the
// two added fields are ones nothing on this page's path reads.
const {
  defaultLevelAssembly, normaliseLevelAssembly, levelRole, levelFloorFt,
  DEFAULT_WALL_TOP_FT,
} = window.DraftLevelAssembly;
const DEFAULT_FOOTING_WIDTH_IN = 20;
const ICF_FOOTING_WIDTH_IN = 24;

const MODEL_STORAGE_BUCKET = 'model-drawing';

class Component extends PageLogic {
  state = {
    paperKey: '11x17',
    orientation: 'landscape',  // 'landscape' | 'portrait'
    titleblock: 'roughdrafter', // DraftTitleblock style id — 11×17 sheets only
    northArrow: false, // the titleblock's arrow cell — site plans by convention, any sheet by choice
    auto: false,       // the sheets are the composer's dealt hand; any manual edit takes them over
    activeSheet: 1,
    activeScale: WORKING_SCALE_IDX, // index into SCALES — 1/4" is the working plan scale
    activeLevelId: null,
    addingViewport: false,
    viewports: [],              // { id, kind, levelId|cutId|elevId, pif, sheet, xIn, yIn } — sheet inches
    nextViewportId: 1,
    selectedViewportId: null,
    zoom: 1,   // pixels per paper inch on screen
    panX: 0,
    panY: 0,
    profileDialog: null,
    profileFileName: '',
    profileDialogMessage: '',
    profileDialogError: false,
    // How deep the sheet's undo stacks are. They live in state because the
    // buttons are drawn from them and _persistLayout — where the history is
    // recorded — runs INSIDE a setState callback, after that render is gone.
    historyPast: 0,
    historyFuture: 0,
    persistenceStatus: 'SAVED',  // 'SAVED' | 'UNSAVED' — the sheet on disk
    persistenceError: '',
  };

  componentDidMount() {
    this._saved = null;
    this._levels = [];
    // The sheet's undo stack. `_layoutSnapshot` is the sheet as it stands
    // right now; `past` is what it was before each change.
    this._layoutHistory = { past: [], future: [] };
    this._layoutSnapshot = null;
    this._restoringLayout = false;
    this._planBoundsByLevel = new Map();
    this._canvas = document.querySelector('[data-layout-canvas]');
    this._ctx = this._canvas ? this._canvas.getContext('2d') : null;
    if (!this._canvas) return;

    // Company logos for the titleblock identity cell — redraw as each lands.
    this._logos = {};
    (window.DraftTitleblock?.STYLES || []).forEach(style => {
      const img = new Image();
      img.onload = () => this._draw();
      img.src = style.logoSrc;
      this._logos[style.id] = img;
    });

    this._ro = new ResizeObserver(() => { this._resize(); this._draw(); });
    const cont = document.querySelector('[data-layout-container]');
    if (cont) this._ro.observe(cont);

    this._resize();
    this._fitPaper();
    this._draw();
    this._restoreActiveProfilePackages();
    this._loadDrawing();

    this._canvas.addEventListener('wheel',      this._whl = (e) => this._onWheel(e), { passive: false });

    // Pan / viewport place + drag, through POINTER events (audit C2) — the
    // same door the Model Space uses, so a finger can place a viewport and
    // drag it around the sheet. `wheel` above stays as it is: there is no
    // pointer equivalent, and pinch-zoom is a later board.
    this._canvas.addEventListener('pointerdown',   this._mdn = (e) => {
      if (this._claimPointer(e)) this._onMouseDown(e);
    });
    this._canvas.addEventListener('pointercancel', this._pcl = (e) => this._abandonPointer(e));
    window.addEventListener('pointermove',      this._wmmv = (e) => { if (this._ownsPointer(e)) this._onMouseMove(e); });
    window.addEventListener('pointerup',        this._mup  = (e) => {
      if (!this._ownsPointer(e)) return;
      // Release first: _onMouseUp has early returns, and a pointer id left
      // claimed locks the sheet out of every later gesture.
      this._releasePointer(e);
      this._onMouseUp();
    });
    window.addEventListener('keydown',          this._kdn = (e) => this._onKeyDown(e));
  }

  // ─── The drawing behind the sheet ────────────────────────────────────────────
  // LAYOUT projects the saved Model Space drawing. The raw saved object is kept
  // as-is so writing the sheet back only ever touches its `layout` property —
  // sheet coordinates live in paper inches, model geometry stays in feet, and
  // the viewport's pif (paper inches per model foot) is the only bridge.
  async _loadDrawing() {
    let saved = null;
    try {
      const file = window.SharedFileStore
        ? await window.SharedFileStore.loadSharedFile(MODEL_STORAGE_BUCKET)
        : null;
      if (file) saved = JSON.parse(await file.text());
    } catch (error) {
      console.warn('Unable to load the saved model drawing:', error);
      saved = null;
    }
    const format = window.DraftDrawingFormat;
    if (saved && !format.checkEnvelope(saved).ok) saved = null;
    this._saved = saved;
    this._drawingChecked = true;
    this._levels = saved ? format.levels(saved.levels) : [];
    this._planBoundsByLevel = new Map();
    this._cutEnv = null;
    this._cutExtentsCache = new Map();
    this._elevCutsCache = null;
    const levelIds = new Set(this._levels.map(level => level.id));
    this._cuts = saved ? format.cuts(saved.cuts, levelIds) : [];
    const cutIds = new Set(this._cuts.map(cut => cut.id));
    const layout = saved?.layout ? format.layout(saved.layout, levelIds, cutIds) : null;
    const patch = {
      viewports: layout ? layout.viewports : [],
      nextViewportId: layout ? layout.nextViewportId : 1,
      activeLevelId: this._defaultLevelId(),
      auto: layout?.auto === true,
      activeSheet: 1,
    };
    if (layout?.paperKey) patch.paperKey = layout.paperKey;
    if (layout?.orientation) patch.orientation = layout.orientation;
    if (layout?.titleblock) patch.titleblock = layout.titleblock;
    if (typeof layout?.northArrow === 'boolean') patch.northArrow = layout.northArrow;
    this.setState(patch, () => {
      // The bone's request: a fresh build asks for the default sheet set, and
      // the sheets stay the composer's until a hand touches them. A drawing
      // whose sheets were ever arranged by hand loads exactly as saved.
      if (this.state.auto) this._composeDefaultSet();
      this._fitPaper();
      this._draw();
      // The sheet as it arrived is the state the first change undoes TO.
      // Without this the first change has nothing behind it and cannot be
      // taken back — the one every drafter tries first.
      this._layoutSnapshot = JSON.stringify(this._layoutKey());
      document.body.dataset.layoutReady = '1';
      if (!document.body.dataset.layoutSaveSeq) document.body.dataset.layoutSaveSeq = '0';
    });
  }

  // The level a new viewport shows first: the busiest plan — a house drawing
  // lands on MAIN FL.
  _defaultLevelId() {
    const withWalls = this._levelsWithWalls();
    if (!withWalls.length) return this._levels[0]?.id ?? null;
    return withWalls.reduce((best, level) => (level.wallCount > best.wallCount ? level : best)).id;
  }

  _levelsWithWalls() {
    if (!this._saved) return [];
    const counts = new Map();
    (Array.isArray(this._saved.walls) ? this._saved.walls : []).forEach(wall => {
      counts.set(wall?.levelId, (counts.get(wall?.levelId) || 0) + 1);
    });
    return this._levels
      .filter(level => counts.get(level.id))
      .map(level => ({ ...level, wallCount: counts.get(level.id) }));
  }

  // WHAT THE VIEWPORT HAS TO HOLD, which is not the same question as where the
  // walls are. This asked `wallBounds` until 21 Sep, and that was right only
  // while walls were the only thing a plan viewport drew.
  //
  // TWO THINGS WERE FALLING OFF THE SHEET because of it. A plan's DIMENSION
  // STRINGS stand 3 to 4.5 ft outside the walls they measure, so the viewport
  // was clipping away the very numbers it exists to carry -- and on screen
  // that is a pan, on paper it is gone. And a ROOF or SITE level holds no
  // walls at all, so `wallBounds` returned null there and `_viewportRectIn`
  // fell back to its 2-inch placeholder: a roof plan framed into a postage
  // stamp. MODEL.html's `allPoints` names that second one in its own comment
  // and it is the same gap, one page over.
  //
  // `planBounds` follows the Model Space's five collections and adds the
  // dimensions; see the block above it in layout-plan.js for why the fifth
  // one is the sheet's alone.
  _planBounds(levelId) {
    if (!this._planBoundsByLevel.has(levelId)) {
      this._planBoundsByLevel.set(levelId,
        window.DraftLayoutPlan.planBounds(this._saved, levelId));
    }
    return this._planBoundsByLevel.get(levelId);
  }

  // ─── The saved drawing as the cut painter's world ────────────────────────
  // The Model Space hands cut-view.js its live state; this page has only the
  // saved JSON, so the same environment contract is rebuilt from the file.
  _cutViewEnv() {
    if (this._cutEnv) return this._cutEnv;
    const saved = this._saved;
    if (!saved) return null;
    const format = window.DraftDrawingFormat;
    const levelIds = new Set(this._levels.map(level => level.id));
    const num = value => (Number.isFinite(Number(value)) ? Number(value) : null);
    const point = raw => {
      const x = num(raw?.x), z = num(raw?.z);
      return x === null || z === null ? null : { x, z };
    };
    const walls = (Array.isArray(saved.walls) ? saved.walls : []).map(wall => {
      const start = point(wall?.start), end = point(wall?.end);
      if (!start || !end || !levelIds.has(Number(wall?.levelId))) return null;
      const topHeight = num(wall?.topHeight);
      return {
        id: String(wall?.id || ''),
        start,
        end,
        levelId: Number(wall.levelId),
        view: wall?.view || 'plan',
        ...(wall?.body === 'garage' ? { body: 'garage' } : {}),
        wallType: wall?.wallType,
        baseHeight: num(wall?.baseHeight) ?? 0,
        topHeight: topHeight !== null && topHeight > 0 ? topHeight : DEFAULT_WALL_TOP_FT,
      };
    }).filter(Boolean);
    const floors = (Array.isArray(saved.floors) ? saved.floors : []).map(floor => {
      const points = (Array.isArray(floor?.points) ? floor.points : []).map(point).filter(Boolean);
      if (points.length < 3 || !levelIds.has(Number(floor?.levelId))) return null;
      return {
        points,
        levelId: Number(floor.levelId),
        view: floor?.view || 'floor',
        garage: floor?.garage === true,
        thickenedEdge: floor?.thickenedEdge === true,
      };
    }).filter(Boolean);
    const roofs = format.roofs(saved.roofs, levelIds);
    const fenestrations = format.fenestrations(saved.fenestrations, levelIds);
    const outlines = format.outlines(saved.outlines, levelIds);
    // Columns too: the elevation draws the piles under a grade beam.
    const columns = format.columns
      ? format.columns(saved.columns, levelIds, {}) : (saved.columns || []);
    const shelves = format.boneyardShelves(saved.boneyardShelves);
    const masters = format.boneyardOutlines(saved.boneyardOutlines, new Set(shelves.map(shelf => shelf.id)));
    const assemblies = saved.levelAssemblies && typeof saved.levelAssemblies === 'object'
      ? saved.levelAssemblies : {};
    // Role-aware since PR #323: OVER GARAGE spans clear on a 19 1/4" joist
    // and ENTRY frames on 2x10s. Reading these levels as plain floors drew
    // this board's sections and elevations off MODEL.dc.html's.
    const levelAssembly = levelId => normaliseLevelAssembly(assemblies[levelId], levelRole(levelId));
    // SITE and ROOF are whole-level contexts and the FOUNDATION bears no floor
    // of its own — the floor-bearing stack is every other level, lowest first.
    const floorLevels = this._levels
      .filter(level => level.id > 0 && level.id !== 1 && level.id !== 7 && level.id !== 8)
      .slice()
      .reverse();
    const levelWallTopFt = (levelId, view = 'plan') => {
      const tops = walls
        .filter(wall => wall.levelId === levelId && wall.view === view)
        .map(wall => wall.topHeight);
      return tops.length ? Math.max(...tops) : DEFAULT_WALL_TOP_FT;
    };
    // Board #346: the last outboard copy of point-to-segment, collapsed onto the
    // shared export. geometry-2d.js is already loaded here (line 16), and this
    // page's env feeds cut-view.js's garageOfWall through edgeOnOutline below —
    // the same contract proto/elevation-harness.js serves, whose identical copy
    // collapsed in PR #353.
    //
    // NO CALLER-LOCAL FALLBACK. The export refuses a segment under 0.01ft
    // (Infinity) where this copy answered distance-to-`a`, and the one caller
    // was measured rather than assumed: edgeOnOutline's onBoundary is a
    // `.some()` across every edge, and a zero-length edge sits exactly on a
    // point its two neighbours already reach, so the Infinity is skipped and a
    // neighbour answers the same number. Checked against a clean square, a
    // duplicated corner, an edge ending on the duplicate, three identical
    // points, and a point only the zero-length edge could match: no flip in any
    // of them. It differs in one shape only — an outline whose edges are ALL
    // degenerate — and there `false` is the better answer, because something
    // that is one point has no boundary for an edge to lie along.
    const distToSeg = (pt, a, b) =>
      window.DraftGeometry2D.pointToSegment(pt, { start: a, end: b }).d;
    const standards = window.DraftStructureStandards.normaliseStructureStandards(
      window.DraftProfileManager?.getActive('standards')?.content?.model?.structureStandards);
    const datum = format.number(saved.elevationDatum, 0) === 100 ? 100 : 0;
    const units = saved.units === 'metric' ? 'metric' : 'imperial';
    const ftIn = feet => window.DraftFormatters.formatArchitecturalInches(feet * 12);
    this._cutEnv = {
      floorLevels: () => floorLevels,
      levelAssembly,
      // ASKS THE MODULE. This spelt the arithmetic out until 7 Sep -- one of
      // four hand copies of `(joistDepthIn + sheathingIn) / 12`, which is
      // exactly what level-assembly.js's own comment warned the inlined form
      // would invite: "reading it at the call site invites someone to forget
      // the sheathing". Three call sites inlined it anyway.
      levelFloorFt: levelId => levelFloorFt(levelAssembly(levelId)),
      levelWallTopFt,
      footingWidthIn: levelId => {
        const assembly = levelAssembly(levelId);
        if (assembly.footingWidthIn) return assembly.footingWidthIn;
        const icf = walls.some(wall => wall.levelId === levelId
          && wall.view === 'foundation'
          && String(wall.wallType || '').startsWith('icf'));
        return icf ? ICF_FOOTING_WIDTH_IN : DEFAULT_FOOTING_WIDTH_IN;
      },
      walls: () => walls,
      roofs: () => roofs,
      floors: () => floors,
      columns: () => columns,
      fenestrations: () => fenestrations,
      garageOutlines: levelId => outlines.filter(outline =>
        outline.levelId === levelId && outline.garage && outline.points.length >= 3),
      garageFoundation: garage => {
        const mode = garage?.foundation
          || masters.find(master => master.id === garage?.masterId)?.foundation;
        return mode === 'thickened' ? 'thickened' : 'gradebeam';
      },
      edgeOnOutline: (a, b, outline, eps = 0.1) => {
        if (!outline) return false;
        const count = outline.open ? outline.points.length - 1 : outline.points.length;
        const onBoundary = pt => outline.points.some((p, index) => {
          if (index >= count) return false;
          const q = outline.points[(index + 1) % outline.points.length];
          return distToSeg(pt, p, q) <= eps;
        });
        return onBoundary(a) && onBoundary(b)
          && onBoundary({ x: (a.x + b.x) / 2, z: (a.z + b.z) / 2 });
      },
      masterPointById: srcId => {
        for (const master of masters) {
          const src = master.points.find(p => p.id === srcId);
          if (src) return src;
        }
        return null;
      },
      gableCornerStyle: () => standards.gableCorner,
      elevLabel: elev => {
        const sign = elev > 0 && !datum ? '+' : '';
        return sign + (units === 'imperial' ? ftIn(elev) : (elev * 0.3048).toFixed(3) + ' m');
      },
      ftIn,
      elevationDatum: () => datum,
    };
    return this._cutEnv;
  }

  // The four standard elevations, synthesized the way the Model Space's E
  // marks stand them: just outside the plan's walls, looking back at it.
  _standardElevationCuts() {
    if (this._elevCutsCache) return this._elevCutsCache;
    const walls = (this._cutViewEnv()?.walls() || []).filter(wall => wall.levelId > 0);
    if (!walls.length) return (this._elevCutsCache = []);
    let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
    walls.forEach(wall => [wall.start, wall.end].forEach(pt => {
      minX = Math.min(minX, pt.x); maxX = Math.max(maxX, pt.x);
      minZ = Math.min(minZ, pt.z); maxZ = Math.max(maxZ, pt.z);
    }));
    if (maxX - minX < 1 || maxZ - minZ < 1) return (this._elevCutsCache = []);
    const pad = 2;
    const edge = { S: maxZ, N: minZ, E: maxX, W: minX };
    const at = id => edge[E_MARK_SIDES[id].side] + E_MARK_SIDES[id].sign * E_MARK_CLEAR_FT;
    this._elevCutsCache = [
      { id: 'E1', name: 'E1', elev: 0, levelId: null,
        startPt: { x: minX - pad, z: at('E1') }, endPt: { x: maxX + pad, z: at('E1') },
        dirVec: E_MARK_SIDES.E1.dir },
      { id: 'E2', name: 'E2', elev: 0, levelId: null,
        startPt: { x: at('E2'), z: minZ - pad }, endPt: { x: at('E2'), z: maxZ + pad },
        dirVec: E_MARK_SIDES.E2.dir },
      { id: 'E3', name: 'E3', elev: 0, levelId: null,
        startPt: { x: minX - pad, z: at('E3') }, endPt: { x: maxX + pad, z: at('E3') },
        dirVec: E_MARK_SIDES.E3.dir },
      { id: 'E4', name: 'E4', elev: 0, levelId: null,
        startPt: { x: at('E4'), z: minZ - pad }, endPt: { x: at('E4'), z: maxZ + pad },
        dirVec: E_MARK_SIDES.E4.dir },
    ];
    return this._elevCutsCache;
  }

  _cutForViewport(viewport) {
    if (viewport.kind === 'section') return this._cuts.find(cut => cut.id === viewport.cutId) || null;
    if (viewport.kind === 'elevation') {
      return this._standardElevationCuts().find(cut => cut.id === viewport.elevId) || null;
    }
    return null;
  }

  // Model extents of a section / elevation view, cached per cut: horizontal
  // in the cut's own paper axis, vertical in model elevation feet.
  _cutExtents(viewport) {
    const key = `${viewport.kind}:${viewport.kind === 'section' ? viewport.cutId : viewport.elevId}`;
    if (!this._cutExtentsCache.has(key)) {
      const cut = this._cutForViewport(viewport);
      const env = this._cutViewEnv();
      let extents = null;
      if (cut && env) {
        try { extents = window.DraftCutView.cutViewExtents(env, cut); } catch { extents = null; }
      }
      this._cutExtentsCache.set(key, extents);
    }
    return this._cutExtentsCache.get(key);
  }

  // ── What a view occupies, measured once (board NEW-2) ────────────────
  // Measured: an elevation's height was the SECTION painter's reserved box —
  // the object plus 2' of air above the ridge and 2' below the footing. On a
  // two-storey over a basement that reads 36.25' for 32.25' of ink, and the
  // pair misses the 1/8" rung by 0.05'. The building was never too tall; it
  // was measured too tall.
  //
  // The buried foundation is NOT padding and stays in: an elevation draws it
  // dashed below grade, down to the footing. Only the air comes off.
  _viewAllowanceFt() {
    return VIEW_ALLOWANCE_FT.dimensions + VIEW_ALLOWANCE_FT.markers;
  }

  // The footprint a view claims on paper, in feet. The scale chooser, the
  // frame and the painter all ask this one function, so they cannot disagree
  // about how big the view is.
  _viewFootprintFt(view) {
    const pad = 2 * this._viewAllowanceFt();
    if (view.kind === 'plan') {
      const b = this._planBounds(view.levelId);
      return b ? { wFt: (b.maxX - b.minX) + pad, hFt: (b.maxZ - b.minZ) + pad } : null;
    }
    const ex = this._cutExtents(view);
    if (!ex) return null;
    const drawn = view.kind === 'elevation' && Number.isFinite(ex.yTopDrawn);
    const top = drawn ? ex.yTopDrawn : ex.yTop;
    const bottom = drawn ? ex.yBottomDrawn : ex.yBottom;
    return { wFt: (ex.uMax - ex.uMin) + pad, hFt: (top - bottom) + pad };
  }

  // The rectangle the painter fits its ink to. An elevation paints the drawn
  // box; a section keeps the padded one its own painter reserves.
  _paintExtents(viewport) {
    const ex = this._cutExtents(viewport);
    if (!ex) return null;
    if (viewport.kind !== 'elevation' || !Number.isFinite(ex.yTopDrawn)) return ex;
    return { ...ex, yTop: ex.yTopDrawn, yBottom: ex.yBottomDrawn };
  }

  // A viewport's rectangle on the sheet in paper inches, centred on xIn / yIn
  // and sized by the view's model extents at the viewport's own scale.
  _viewportRectIn(viewport) {
    const foot = this._viewFootprintFt(viewport);
    const wFt = foot ? foot.wFt : null;
    const hFt = foot ? foot.hFt : null;
    const wIn = wFt !== null ? Math.max(wFt * viewport.pif, 0.75) : 2;
    const hIn = hFt !== null ? Math.max(hFt * viewport.pif, 0.75) : 2;
    return { xIn: viewport.xIn - wIn / 2, yIn: viewport.yIn - hIn / 2, wIn, hIn };
  }

  // The sheet as this page owns it — the ONLY key this page may write, and
  // the unit both the guarded save and the history work in.
  _layoutKey() {
    return {
      paperKey: this.state.paperKey,
      orientation: this.state.orientation,
      titleblock: this.state.titleblock,
      northArrow: this.state.northArrow,
      auto: this.state.auto,
      viewports: this.state.viewports,
      nextViewportId: this.state.nextViewportId,
    };
  }

  // ─── The default sheet set (board #168) ───────────────────────────
  // The bone's dealt hand: every plan with walls, every drawn section, and
  // the four standard elevations, each at the largest real drafting scale
  // that fits the paper, packed onto as many sheets as they need. Plans and
  // sections flow together; elevations keep their own pages — E1+E2 on one,
  // E3+E4 on the next — squeezing all four onto one page is a manual move.

  // The paper a viewport may use: inside the margins, less the titleblock's
  // strip or band.
  _composeRegionIn() {
    const { paperKey, orientation } = this.state;
    const paper = PAPER_SIZES[paperKey];
    const pw = orientation === 'landscape' ? paper.h : paper.w;
    const ph = orientation === 'landscape' ? paper.w : paper.h;
    const margin = 0.5;
    let w = pw - margin * 2, h = ph - margin * 2;
    const style = paperKey === '11x17' && window.DraftTitleblock
      ? window.DraftTitleblock.styleById(this.state.titleblock) : null;
    if (style?.placement === 'right') w -= window.DraftTitleblock.STRIP_W_IN;
    else h -= (window.DraftTitleblock?.BAND_H_IN || 1.5);
    return { x: margin, y: margin, w, h };
  }

  // The largest scale on the ladder at which every view in the list fits the
  // region together (stacked for a pair, alone otherwise); the smallest rung
  // is the floor — a view too big for even the last rung (3/32" for the
  // architect ladder, 1"=40' for site) still prints, clipped. 1/16" left the
  // ladder in 274c78f and is no longer a scale the composer can choose, only
  // one a drafter can pick by hand from SCALES.
  //
  // This sentence named 1/16" as the floor for four days after that change,
  // and on 3 Sep it was quoted back as evidence that 1/16" was still live.
  // Name the rung, never the number.
  _autoScaleFor(views, region, axis = 'stack') {
    const family = SCALE_FAMILIES[scaleFamilyFor(views[0])] || SCALE_FAMILIES.architect;
    const fits = pif => {
      if (axis === 'row') {
        const sumW = views.reduce((sum, view) => sum + view.wFt * pif, 0)
          + COMPOSE_GAP_IN * (views.length - 1);
        const maxH = Math.max(...views.map(view => view.hFt)) * pif + COMPOSE_LABEL_IN;
        return sumW <= region.w && maxH <= region.h;
      }
      const maxW = Math.max(...views.map(view => view.wFt)) * pif;
      const sumH = views.reduce((sum, view) => sum + view.hFt * pif + COMPOSE_LABEL_IN, 0)
        + COMPOSE_GAP_IN * (views.length - 1);
      return maxW <= region.w && sumH <= region.h;
    };
    return family.prefs.find(fits) ?? family.lastResort;
  }

  _composeDefaultSet() {
    if (!this._saved) return;
    const region = this._composeRegionIn();
    const floorLevels = this._levelsWithWalls()
      .filter(level => level.id > 0 && level.id !== 1 && level.id !== 7 && level.id !== 8)
      .slice()
      .sort((x, y) => y.id - x.id);          // top storey first, the way a set reads
    const sized = view => {
      const foot = this._viewFootprintFt(view);
      return foot ? { ...view, wFt: foot.wFt, hFt: foot.hFt } : null;
    };
    // A sheet is dealt only if something would put ink on it. A bungalow has
    // no 2ND FL sheet; a drawing with no concrete has no FOUNDATION sheet.
    // Never deal a blank sheet.
    const planSheet = (levelId, view) => {
      const walls = window.DraftLayoutPlan.planWalls(this._saved, levelId, view);
      return walls.length ? sized({ kind: 'plan', levelId, view }) : null;
    };
    const sectionViews = this._cuts
      .map(cut => sized({ kind: 'section', cutId: cut.id }))
      .filter(Boolean);
    const elevViews = this._standardElevationCuts()
      .map(cut => sized({ kind: 'elevation', elevId: cut.id }))
      .filter(Boolean);

    // Movie's set order (board NEW-2 part 2). Sheets 3 and 4 (SITE, ROOF) and
    // the floor-layout and electrical sheets are absent on purpose: no
    // painter and, for S-SLAB / S-FDN / E-POWER, no entities in the drawing
    // format to paint. They are their own boards, not silent omissions.
    const sheetPlan = [];
    if (elevViews.length) sheetPlan.push(elevViews.slice(0, 2));      // 1
    if (elevViews.length > 2) sheetPlan.push(elevViews.slice(2));     // 2
    floorLevels.forEach(level => {                                    // 5, 7
      const view = planSheet(level.id, 'plan');
      if (view) sheetPlan.push([view]);
    });
    const foundation = planSheet(1, 'foundation');                    // 9
    if (foundation) sheetPlan.push([foundation]);
    sectionViews.forEach(view => sheetPlan.push([view]));             // 10-12
    const basement = planSheet(1, 'plan');                            // 13
    if (basement) sheetPlan.push([basement]);
    if (!sheetPlan.length) return;

    const viewports = [];
    let nextId = 1;
    // Sheet numbering follows the order: sheet 1 is the first dealt.
    sheetPlan.forEach((views, index) => {
      const sheet = index + 1;
      const pif = this._autoScaleFor(views, region);
      const commit = (view, xIn, yIn) => {
        const base = { id: nextId++, pif, sheet, xIn, yIn };
        if (view.kind === 'plan') {
          viewports.push({ ...base, kind: 'plan', levelId: view.levelId, view: view.view });
        } else if (view.kind === 'section') {
          viewports.push({ ...base, kind: 'section', cutId: view.cutId });
        } else {
          viewports.push({ ...base, kind: 'elevation', elevId: view.elevId });
        }
      };
      if (views.length === 1) {
        // Part 1's rule stands: a single view sits in the middle of its sheet.
        commit(views[0], region.x + region.w / 2,
          region.y + (region.h - COMPOSE_LABEL_IN) / 2);
        return;
      }
      const stackH = views.reduce((sum, view) => sum + view.hFt * pif + COMPOSE_LABEL_IN, 0)
        + COMPOSE_GAP_IN * (views.length - 1);
      let y = region.y + Math.max(0, (region.h - stackH) / 2);
      views.forEach(view => {
        commit(view, region.x + region.w / 2, y + (view.hFt * pif) / 2);
        y += view.hFt * pif + COMPOSE_LABEL_IN + COMPOSE_GAP_IN;
      });
    });
    this.setState({
      viewports,
      nextViewportId: nextId,
      selectedViewportId: null,
      activeSheet: 1,
      auto: true,
    }, () => { this._persistLayout(); this._draw(); });
  }

  // ─── The sheet's history (audit C4) ─────────────────────────────────────
  // This page had none. A viewport dragged off the edge, a titleblock swapped
  // by mistake, a delete — every one of them permanent, on the page that is
  // driven entirely by pointer and has no keyboard path at all.
  //
  // Every sheet mutation already funnels through _persistLayout, exactly the
  // way every drawing mutation funnels through the Model Space's
  // _markUnsaved, so that is where the snapshot is taken — one choke point,
  // and a new mutation is recorded whether or not whoever adds it remembers
  // this exists. Bounded by count for the same reason the drawing's is: a
  // long session must not grow without limit.
  static get LAYOUT_HISTORY_LIMIT() { return 60; }

  _recordLayoutHistory() {
    const snapshot = JSON.stringify(this._layoutKey());
    if (snapshot === this._layoutSnapshot) return;
    if (this._layoutSnapshot != null && !this._restoringLayout) {
      this._layoutHistory.past.push(this._layoutSnapshot);
      this._layoutHistory.future = [];
      while (this._layoutHistory.past.length > Component.LAYOUT_HISTORY_LIMIT) {
        this._layoutHistory.past.shift();
      }
    }
    this._layoutSnapshot = snapshot;
  }

  // Puts a snapshot back on the page: state, the paper fit, the ink, and the
  // write. Guarded so restoring is not itself recorded as a change.
  _restoreLayoutSnapshot(snapshot) {
    let next = null;
    try { next = JSON.parse(snapshot); } catch { return false; }
    if (!next || typeof next !== 'object') return false;
    this._restoringLayout = true;
    Object.assign(this.state, next);
    this._layoutSnapshot = snapshot;
    this.setState({ ...next, selectedViewportId: null }, () => {
      this._fitPaper();
      this._draw();
      this._persistLayout();
      this._restoringLayout = false;
    });
    return true;
  }

  // Publishes the stack depths so the buttons re-render. Without it a button
  // stays dead until some unrelated change happens to draw the page again.
  _syncHistoryState() {
    const past = this._layoutHistory.past.length;
    const future = this._layoutHistory.future.length;
    if (past === this.state.historyPast && future === this.state.historyFuture) return;
    this.setState({ historyPast: past, historyFuture: future });
  }

  // Both stacks move BEFORE the restore, not after: the restore renders, and
  // a render that ran while the other stack was still empty would draw the
  // opposite button dead for a frame.
  _undoLayout() {
    if (!this._layoutHistory.past.length) return false;
    const current = this._layoutSnapshot;
    const snapshot = this._layoutHistory.past.pop();
    if (current != null) this._layoutHistory.future.push(current);
    if (!this._restoreLayoutSnapshot(snapshot)) {
      if (current != null) this._layoutHistory.future.pop();
      this._layoutHistory.past.push(snapshot);
      return false;
    }
    return true;
  }

  _redoLayout() {
    if (!this._layoutHistory.future.length) return false;
    const current = this._layoutSnapshot;
    const snapshot = this._layoutHistory.future.pop();
    if (current != null) this._layoutHistory.past.push(current);
    if (!this._restoreLayoutSnapshot(snapshot)) {
      if (current != null) this._layoutHistory.past.pop();
      this._layoutHistory.future.push(snapshot);
      return false;
    }
    return true;
  }

  // Write the sheet back onto the saved drawing — additive, and now genuinely
  // so. It used to write `this._saved`: the whole drawing as this page read it
  // at load, with `layout` replaced. Every OTHER key in that object was a
  // snapshot, so a house drawn in the Model Space while a LAYOUT tab sat open
  // was erased the moment a viewport moved — the walls, the roof, all of it,
  // silently reverted to what the sheet happened to have loaded.
  //
  // So: re-read the stored file inside the save queue, put our `layout` onto
  // whatever is actually there now, and write it guarded by the revision we
  // just read. If the Model Space saved in between, the write is refused and
  // we go round again against the newer file rather than flattening it.
  //
  // The sheet's history is taken here too, and for the same reason the save
  // is: every sheet mutation funnels through this one choke point, so a
  // mutation added later is recorded whether or not whoever adds it knows the
  // history exists. It is deliberately NOT written onto `this._saved` — that
  // copy is a snapshot, and putting the layout on it is the very clobber the
  // guarded write above exists to prevent; `_writeLayoutToStore` merges the
  // key onto whatever is actually stored and refreshes `_saved` from that.
  _persistLayout() {
    if (!this._drawingChecked || !window.SharedFileStore) return;
    this._recordLayoutHistory();
    this._syncHistoryState();
    document.body.dataset.layoutSaveDirty = '1';
    this.setState({ persistenceStatus: 'UNSAVED', persistenceError: '' });
    this._saveQueue = (this._saveQueue || Promise.resolve())
      .catch(() => {})
      .then(() => this._writeLayoutToStore())
      .then(() => {
        document.body.dataset.layoutSaveDirty = '0';
        document.body.dataset.layoutSaveSeq = String(Number(document.body.dataset.layoutSaveSeq || 0) + 1);
        this.setState({ persistenceStatus: 'SAVED', persistenceError: '' });
      })
      .catch(error => {
        console.warn('Unable to save the layout:', error);
        this.setState({ persistenceStatus: 'UNSAVED', persistenceError: 'Save failed' });
      });
  }

  async _writeLayoutToStore(triesLeft = 3) {
    const store = window.SharedFileStore;
    const at = await store.loadSharedFileAt(MODEL_STORAGE_BUCKET);
    let base = null;
    if (at.file) {
      try { base = JSON.parse(await at.file.text()); } catch { base = null; }
    }
    // Nothing readable in the bucket: fall back to the copy this page loaded,
    // and if there is not one either there is no drawing to put a sheet on.
    if (!base || typeof base !== 'object') base = this._saved;
    if (!base) return;
    const merged = { ...base, layout: this._layoutKey() };
    const file = new File([JSON.stringify(merged)], 'model-drawing.json', { type: 'application/json' });
    try {
      await store.saveSharedFile(file, MODEL_STORAGE_BUCKET, { ifRev: at.rev });
    } catch (error) {
      if (!error?.stale || triesLeft <= 0) throw error;
      return this._writeLayoutToStore(triesLeft - 1);
    }
    this._saved = merged;
  }

  // ─── Personal settings and company standards packages ───────────────────────
  _profileContent() {
    return {
      layout: {
        paperKey: this.state.paperKey,
        orientation: this.state.orientation,
        activeScale: this.state.activeScale,
        activeScalePif: SCALES[this.state.activeScale]?.pif,
        titleblock: this.state.titleblock,
      },
    };
  }

  _profileStatePatch(pkg) {
    const values = pkg?.content?.layout;
    if (!values || typeof values !== 'object') return {};
    const patch = {};
    if (PAPER_SIZES[values.paperKey]) patch.paperKey = values.paperKey;
    if (['landscape', 'portrait'].includes(values.orientation)) patch.orientation = values.orientation;
    const byPif = SCALES.findIndex(s => s.pif === values.activeScalePif);
    if (byPif >= 0) patch.activeScale = byPif;
    else if (Number.isInteger(values.activeScale) && SCALES[values.activeScale]) patch.activeScale = values.activeScale;
    if (window.DraftTitleblock?.styleById(values.titleblock)) patch.titleblock = values.titleblock;
    return patch;
  }

  _applyProfilePackage(pkg) {
    const patch = this._profileStatePatch(pkg);
    if (!Object.keys(patch).length) return;
    this.setState(patch, () => {
      this._fitPaper();
      this._draw();
    });
  }

  _restoreActiveProfilePackages() {
    const manager = window.DraftProfileManager;
    if (!manager) return;
    const patch = {
      ...this._profileStatePatch(manager.getActive('settings')),
      ...this._profileStatePatch(manager.getActive('standards')),
    };
    if (Object.keys(patch).length) {
      this.setState(patch, () => {
        this._fitPaper();
        this._draw();
      });
    }
  }

  _rememberActiveProfile(kind) {
    const manager = window.DraftProfileManager;
    if (!manager) return;
    const active = manager.getActive(kind);
    manager.saveActive(manager.createPackage(kind, active?.name || manager.defaultName(), this._profileContent()));
  }

  _openProfileDialog(kind) {
    const manager = window.DraftProfileManager;
    this.setState({
      profileDialog: kind,
      profileFileName: manager ? manager.defaultName() : 'draft-profile',
      profileDialogMessage: '',
      profileDialogError: false,
    });
  }

  _closeProfileDialog() {
    this.setState({ profileDialog: null, profileDialogMessage: '', profileDialogError: false });
  }

  _saveProfilePackage() {
    const kind = this.state.profileDialog;
    const manager = window.DraftProfileManager;
    if (!kind || !manager) return;
    const pkg = manager.createPackage(kind, this.state.profileFileName, this._profileContent());
    manager.saveActive(pkg);
    const fileName = manager.download(pkg);
    this.setState({
      profileFileName: pkg.name,
      profileDialogMessage: `${fileName} downloaded and is active in this browser.`,
      profileDialogError: false,
    });
  }

  async _importProfilePackage(file) {
    const kind = this.state.profileDialog;
    const manager = window.DraftProfileManager;
    if (!kind || !manager) return;
    try {
      const pkg = await manager.parseFile(file, kind);
      manager.saveActive(pkg);
      this._applyProfilePackage(pkg);
      this.setState({
        profileFileName: pkg.name,
        profileDialogMessage: `${file.name} imported and is now active.`,
        profileDialogError: false,
      });
    } catch (error) {
      this.setState({
        profileDialogMessage: error instanceof Error ? error.message : 'Unable to import this file.',
        profileDialogError: true,
      });
    }
  }

  componentWillUnmount() {
    if (this._ro) this._ro.disconnect();
    const c = this._canvas;
    if (c) {
      c.removeEventListener('wheel', this._whl);
      c.removeEventListener('pointerdown', this._mdn);
      c.removeEventListener('pointercancel', this._pcl);
    }
    window.removeEventListener('pointermove', this._wmmv);
    window.removeEventListener('pointerup', this._mup);
    window.removeEventListener('keydown', this._kdn);
  }

  _resize() {
    const cont = document.querySelector('[data-layout-container]');
    if (!cont || !this._canvas) return;
    this._canvas.width  = cont.clientWidth;
    this._canvas.height = cont.clientHeight;
  }

  // Fit the paper to the canvas with a margin
  _fitPaper() {
    const canvas = this._canvas;
    if (!canvas) return;
    const { paperKey, orientation } = this.state;
    const paper = PAPER_SIZES[paperKey];
    const pw = orientation === 'landscape' ? paper.h : paper.w;
    const ph = orientation === 'landscape' ? paper.w : paper.h;
    const margin = 60; // px padding around paper
    const scaleX = (canvas.width  - margin * 2) / pw;
    const scaleY = (canvas.height - margin * 2) / ph;
    const zoom = Math.min(scaleX, scaleY);
    this.state.zoom = zoom;
    this.state.panX = (canvas.width  - pw * zoom) / 2;
    this.state.panY = (canvas.height - ph * zoom) / 2;
  }

  // COLOUR ON THE CANVAS, READ FROM THE SAME TABLE THE STYLESHEET READS.
  // DraftPalette.apply() writes data-theme / data-mode on the root, so the
  // painter ASKS the document which skin is on rather than being told -- one
  // source of truth, and a skin switched after boot needs nothing here but a
  // repaint. Cached on the pair because _draw runs on every frame of a drag
  // and resolve() rebuilds and freezes an object each call.
  //
  // ONLY THE DESK AND ITS LABEL COME FROM HERE, which is the sheet-is-paper
  // rule from the style block's head stated once more where it is actually
  // enforced: everything painted INSIDE the paper rectangle below is a
  // literal on purpose, because a construction sheet is white with near-black
  // ink on all four skins. The plotter does not have a night mode.
  _skin() {
    const root = document.documentElement;
    const theme = root.getAttribute('data-theme') || 'ruff';
    const mode = root.getAttribute('data-mode') || 'night';
    const key = `${theme}/${mode}`;
    if (this.__skinKey !== key) {
      this.__skinKey = key;
      this.__skin = window.DraftPalette.resolve(theme, mode);
    }
    return this.__skin;
  }

  _draw() {
    const canvas = this._canvas;
    const ctx = this._ctx;
    if (!ctx || !canvas) return;
    const { paperKey, orientation, zoom, panX, panY } = this.state;
    const paper = PAPER_SIZES[paperKey];
    const pw = orientation === 'landscape' ? paper.h : paper.w;
    const ph = orientation === 'landscape' ? paper.w : paper.h;
    const pxW = pw * zoom;
    const pxH = ph * zoom;

    const skin = this._skin();

    // THE DESK the paper lies on. It was #c8c8c8 -- a mid grey picked to set
    // a white sheet off -- and it is the page's ground, which is what
    // --surface-page names. On day that ground is #f2f2f3 and very nearly the
    // paper's own white, so the shadow below stops being depth and becomes
    // the sheet's edge; it is kept for that job.
    ctx.fillStyle = skin['surface-page'];
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Paper shadow. A LIGHT, NOT A COLOUR: black at 22% darkens whatever is
    // under it, which is the job on all four skins -- the same argument
    // shell-bars.css makes for keeping its modal scrim a literal.
    ctx.shadowColor = 'rgba(0,0,0,0.22)';
    ctx.shadowBlur = 18;
    ctx.shadowOffsetX = 4;
    ctx.shadowOffsetY = 4;
    // THE PAPER, and from here down every literal is deliberate. A sheet is
    // white on all four skins because that is the sheet that gets printed,
    // and the ink on it is near-black for the same reason. The temptation is
    // --surface-page for the paper and --ink-primary for the ink, which reads
    // beautifully and is wrong twice over: on night it would paint a
    // near-black sheet and then letter it in near-white, so the drafter's
    // screen would stop matching the plot -- and the one place that pairing
    // was actually made, SPECS, shipped a page nobody could read.
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(panX, panY, pxW, pxH);
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 0;

    // Margin border (0.5" inset). A right-strip titleblock owns the border:
    // solid ink with the CLAY sheet's quite-rounded corners. Everything else
    // keeps the faint dashed margin guide.
    const mPx = 0.5 * zoom;
    const style = paperKey === '11x17' && window.DraftTitleblock
      ? window.DraftTitleblock.styleById(this.state.titleblock) : null;
    const inner = { x: panX + mPx, y: panY + mPx, w: pxW - mPx * 2, h: pxH - mPx * 2 };
    if (style?.placement === 'right') {
      const r = (style.cornerRadiusIn ?? window.DraftTitleblock.CORNER_RADIUS_IN) * zoom;
      ctx.strokeStyle = '#1d1f20';
      ctx.lineWidth = 1.25;
      ctx.beginPath();
      ctx.roundRect(inner.x, inner.y, inner.w, inner.h, r);
      ctx.stroke();
    } else {
      ctx.strokeStyle = 'rgba(29,31,32,0.18)';
      ctx.lineWidth = 0.75;
      ctx.setLineDash([4, 4]);
      ctx.strokeRect(inner.x, inner.y, inner.w, inner.h);
      ctx.setLineDash([]);
    }

    // Title block: the company strip on 11×17 (boards #285/#286); the
    // letter sheet keeps the plain placeholder strip.
    const tbBox = style?.placement === 'right'
      ? (() => {
          const tbW = window.DraftTitleblock.STRIP_W_IN * zoom;
          return { x: inner.x + inner.w - tbW, y: inner.y, w: tbW, h: inner.h };
        })()
      : (() => {
          const tbH = (window.DraftTitleblock?.BAND_H_IN || 1.5) * zoom;
          return { x: inner.x, y: inner.y + inner.h - tbH, w: inner.w, h: tbH };
        })();
    if (style) {
      window.DraftTitleblock.draw(ctx, tbBox, style, this._titleblockInfo(), this._logos?.[style.id] || null);
    } else {
      ctx.strokeStyle = 'rgba(29,31,32,0.25)';
      ctx.lineWidth = 1;
      ctx.strokeRect(tbBox.x, tbBox.y, tbBox.w, tbBox.h);
      ctx.fillStyle = 'rgba(29,31,32,0.18)';
      ctx.font = `${Math.max(9, zoom * 0.3)}px 'Barlow Condensed', sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('TITLE BLOCK', tbBox.x + tbBox.w / 2, tbBox.y + tbBox.h / 2);
    }

    // Paper size label (top-left OUTSIDE paper). Outside is the whole reason
    // this one takes a role while the ink a few lines above does not: it is
    // printed on the desk, so on a night skin the old ink-at-40% would have
    // been dark grey on near-black.
    ctx.fillStyle = skin['ink-quiet'];
    ctx.font = `600 11px 'Barlow Condensed', sans-serif`;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'bottom';
    const sheetCount = this._sheetCount();
    ctx.fillText(
      `${pw}" × ${ph}"  (${paperKey.toUpperCase()})${sheetCount > 1 ? `  ·  SHEET ${this.state.activeSheet} OF ${sheetCount}` : ''}`,
      panX, panY - 6,
    );

    this._sheetViewports().forEach(viewport => this._drawViewport(ctx, viewport));
  }

  _sheetViewports(sheet = this.state.activeSheet) {
    return this.state.viewports.filter(viewport => (viewport.sheet || 1) === sheet);
  }

  _sheetCount() {
    return Math.max(1, ...this.state.viewports.map(viewport => viewport.sheet || 1));
  }

  // One plan viewport: the model drawn at the viewport's architectural scale,
  // clipped to its sheet rectangle. The transform chains model feet → paper
  // inches (pif) → screen pixels (sheet zoom + pan); the plan centre sits on
  // the viewport's xIn / yIn.
  _drawViewport(ctx, viewport) {
    const { zoom, panX, panY, selectedViewportId } = this.state;
    const rect = this._viewportRectIn(viewport);
    const px = {
      x: panX + rect.xIn * zoom,
      y: panY + rect.yIn * zoom,
      w: rect.wIn * zoom,
      h: rect.hIn * zoom,
    };
    if (viewport.kind === 'plan') {
      const bounds = this._planBounds(viewport.levelId);
      if (bounds) {
        const cx = (bounds.minX + bounds.maxX) / 2;
        const cz = (bounds.minZ + bounds.maxZ) / 2;
        const toS = pt => ({
          x: panX + (viewport.xIn + (pt.x - cx) * viewport.pif) * zoom,
          y: panY + (viewport.yIn + (pt.z - cz) * viewport.pif) * zoom,
        });
        ctx.save();
        ctx.beginPath();
        ctx.rect(px.x, px.y, px.w, px.h);
        ctx.clip();
        window.DraftLayoutPlan.drawPlan(ctx, toS, this._saved, viewport.levelId, {
          padFt: 0.5 / 12,
          paperColor: '#ffffff',
          // WHICH DRAWING OF THE LEVEL. Left out until 23 Sep, and that is
          // what made the FOUNDATION sheet and the basement sheet the same
          // picture: drawPlan reads `env.view` and takes an absent one to
          // mean EVERY view on the level, so both sheets drew the concrete
          // and the basement walls on top of each other -- which is the
          // stacking board NEW-2 part 2 was opened to end. The composer had
          // been dealing the two sheets correctly the whole time.
          //
          // `|| null` KEEPS THE OLD PROMISE: a viewport saved before views
          // existed carries no view and still draws the whole level.
          view: viewport.view || null,
        });
        ctx.restore();
      }
    } else {
      const cut = this._cutForViewport(viewport);
