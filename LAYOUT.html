      const extents = this._paintExtents(viewport);
      const env = this._cutViewEnv();
      if (cut && extents && env) {
        ctx.save();
        ctx.beginPath();
        ctx.rect(px.x, px.y, px.w, px.h);
        ctx.clip();
        ctx.translate(px.x, px.y);
        window.DraftCutView.drawCutView(env, ctx, px.w, px.h, cut, {
          pxPerFt: viewport.pif * zoom,
          extents,
          paperColor: '#ffffff',
        });
        ctx.restore();
      }
    }
    // The frame is desk furniture, not ink: faint always, blue when selected.
    // LITERAL, THOUGH, AND NOT THE ACCENT, because furniture or not it is
    // drawn ON the white sheet. The accent is measured against the skin's own
    // page: ROUGH's night blue is lifted to clear AA on black, which leaves
    // it at about 2.4 on paper. The drafting blue reads on white on every
    // skin, because the sheet under it is white on every skin.
    const selected = viewport.id === selectedViewportId;
    ctx.strokeStyle = selected ? '#5980a6' : 'rgba(29,31,32,0.18)';
    ctx.lineWidth = selected ? 1.5 : 0.75;
    ctx.strokeRect(px.x, px.y, px.w, px.h);
    const scale = SCALES.find(s => s.pif === viewport.pif);
    ctx.fillStyle = selected ? '#5980a6' : 'rgba(29,31,32,0.45)';
    ctx.font = `600 ${Math.max(9, zoom * 0.14)}px 'Barlow Condensed', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(
      `${this._viewportTitle(viewport)}${scale ? `  ·  ${scale.label}` : ''}`,
      px.x + px.w / 2, px.y + px.h + 4,
    );
  }

  _viewportTitle(viewport) {
    if (viewport.kind === 'section') {
      const cut = this._cutForViewport(viewport);
      return cut ? `SECTION ${cut.name}` : 'SECTION';
    }
    if (viewport.kind === 'elevation') return `ELEVATION ${viewport.elevId}`;
    return this._planTitle(viewport);
  }

  // WHAT A PLAN SHEET IS CALLED, in one place because there are two readers:
  // the caption under the drawing and the title in the company strip. They
  // said `${level.name} PLAN` separately, and separately is how two answers
  // to one question start.
  //
  // THE VIEW NAMES IT, NOT THE LEVEL, on a level that holds more than one
  // drawing. Level 1 is NAMED FOUNDATION because that is the level; the two
  // drawings of it are the concrete and the basement walls above it, and a
  // permit set that calls both of them FOUNDATION PLAN is wrong twice over.
  // A level that has no foundation view has only the one plan, so its own
  // name is the right title and nothing changes for it.
  _planTitle(viewport) {
    const level = this._levels.find(l => l.id === viewport.levelId);
    if (!level) return 'PLAN';
    if (viewport.view === 'foundation') return 'FOUNDATION PLAN';
    const splits = (window.DraftLayerViews?.layerViewsForLevelId(level.id) || [])
      .some(view => view.id === 'foundation');
    if (splits && viewport.view === 'plan') return 'BASEMENT PLAN';
    return `${level.name} PLAN`;
  }

  // The words the titleblock prints: project info rides the drawing, the
  // drafter's identity rides the personal settings package, and the scale
  // reads AS NOTED the moment two viewports disagree.
  _titleblockInfo() {
    const format = window.DraftDrawingFormat;
    const project = format.projectInfo(this._saved?.projectInfo);
    const drafter = window.DraftDrafter.normaliseDrafter(
      window.DraftProfileManager?.getActive('settings')?.content?.model?.drafter);
    const sheetViewports = this._sheetViewports();
    const pifs = [...new Set(sheetViewports.map(viewport => viewport.pif))];
    const scale = pifs.length === 1
      ? (SCALES.find(s => s.pif === pifs[0])?.label || 'AS NOTED')
      : (pifs.length ? 'AS NOTED' : '');
    return {
      projectName: project.name,
      owner: project.client,
      address: project.address,
      drafterName: drafter.name,
      drafterPhone: drafter.phone,
      date: new Date().toISOString().slice(0, 10),
      scale,
      sheet: String(this.state.activeSheet),
      revision: '',
      pageTitle: this._pageTitle(sheetViewports),
      // The sidebar toggle flies the arrow: site plans by convention (#43),
      // any sheet by choice. The real plumbing — true north placed in model
      // space, construction north derived — is board #289.
      northArrow: this.state.northArrow,
    };
  }

  // The sheet's second title line: the one view's own name when the sheet
  // holds a single kind that agrees, the kind's plural when it doesn't, and
  // the kinds joined when the sheet mixes them.
  _pageTitle(sheetViewports = this._sheetViewports()) {
    if (!sheetViewports.length) return '';
    const kinds = [...new Set(sheetViewports.map(viewport => viewport.kind))];
    if (kinds.length > 1) {
      return [['plan', 'PLANS'], ['section', 'SECTIONS'], ['elevation', 'ELEVATIONS']]
        .filter(([kind]) => kinds.includes(kind))
        .map(([, word]) => word)
        .join(' · ');
    }
    if (kinds[0] === 'section') {
      const names = [...new Set(sheetViewports.map(viewport => this._cutForViewport(viewport)?.name).filter(Boolean))];
      return names.length === 1 ? `SECTION ${names[0]}` : 'SECTIONS';
    }
    if (kinds[0] === 'elevation') {
      const ids = [...new Set(sheetViewports.map(viewport => viewport.elevId))];
      return ids.length === 1 ? `ELEVATION ${ids[0]}` : `ELEVATIONS ${ids.join(' · ')}`;
    }
    // BY DRAWING, NOT BY LEVEL. Two plan viewports of level 1 are the
    // concrete and the basement walls -- two drawings, not one repeated --
    // so a sheet holding both is PLANS, exactly as a sheet holding two
    // levels is.
    const titles = [...new Set(sheetViewports.map(viewport => this._planTitle(viewport)))];
    return titles.length === 1 ? titles[0] : 'PLANS';
  }

  _onWheel(e) {
    e.preventDefault();
    const canvas = this._canvas;
    if (!canvas) return;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
    const newZoom = Math.max(10, Math.min(300, this.state.zoom * factor));
    const ratio = newZoom / this.state.zoom;
    this.state.panX = mx - (mx - this.state.panX) * ratio;
    this.state.panY = my - (my - this.state.panY) * ratio;
    this.state.zoom = newZoom;
    this._draw();
  }

  // Screen pixels → sheet paper inches, through the sheet zoom and pan.
  _sheetPointIn(e) {
    const rect = this._canvas.getBoundingClientRect();
    return {
      xIn: (e.clientX - rect.left - this.state.panX) / this.state.zoom,
      yIn: (e.clientY - rect.top - this.state.panY) / this.state.zoom,
    };
  }

  _viewportAt(ptIn) {
    const list = this._sheetViewports();
    for (let i = list.length - 1; i >= 0; i--) {
      const r = this._viewportRectIn(list[i]);
      if (ptIn.xIn >= r.xIn && ptIn.xIn <= r.xIn + r.wIn
        && ptIn.yIn >= r.yIn && ptIn.yIn <= r.yIn + r.hIn) return list[i];
    }
    return null;
  }

  // ─── One pointer at a time (audit C2) ────────────────────────────────────
  // Mirrors the Model Space: the sheet takes the FIRST pointer down and
  // ignores the rest until it lifts, and captures it so a viewport dragged
  // past the edge of the canvas still gets its moves and its up.
  _ownsPointer(e) {
    return this._activePointerId == null || this._activePointerId === e.pointerId;
  }

  _claimPointer(e) {
    if (this._activePointerId != null && this._activePointerId !== e.pointerId) return false;
    this._activePointerId = e.pointerId;
    try { this._canvas.setPointerCapture(e.pointerId); } catch { /* pointer already gone */ }
    return true;
  }

  _releasePointer(e) {
    if (this._activePointerId !== e.pointerId) return;
    this._activePointerId = null;
    try { this._canvas.releasePointerCapture(e.pointerId); } catch { /* already released */ }
  }

  // A cancelled pointer never sends an up. Free the claim and drop the
  // in-flight gesture WITHOUT committing it — the drag did not finish, it was
  // taken away.
  _abandonPointer(e) {
    if (!this._ownsPointer(e)) return;
    this._releasePointer(e);
    this._panning = false;
    this._draggingViewport = null;
    this._draw();
  }

  _onMouseDown(e) {
    if (e.button === 1 || (e.button === 0 && e.altKey)) { // middle click or alt+left pans
      this._panning = true;
      this._panStartX = e.clientX - this.state.panX;
      this._panStartY = e.clientY - this.state.panY;
      e.preventDefault();
      return;
    }
    if (e.button !== 0) return;
    const ptIn = this._sheetPointIn(e);
    if (this.state.addingViewport) {
      this._placeViewport(ptIn);
      e.preventDefault();
      return;
    }
    const hit = this._viewportAt(ptIn);
    if (hit) {
      this._draggingViewport = { id: hit.id, dxIn: hit.xIn - ptIn.xIn, dyIn: hit.yIn - ptIn.yIn };
      this.setState({ selectedViewportId: hit.id }, () => this._draw());
      e.preventDefault();
    } else if (this.state.selectedViewportId != null) {
      this.setState({ selectedViewportId: null }, () => this._draw());
    }
  }

  _onMouseMove(e) {
    if (this._panning) {
      this.state.panX = e.clientX - this._panStartX;
      this.state.panY = e.clientY - this._panStartY;
      this._draw();
      return;
    }
    if (this._draggingViewport) {
      const ptIn = this._sheetPointIn(e);
      const drag = this._draggingViewport;
      this.state.viewports = this.state.viewports.map(viewport =>
        (viewport.id === drag.id
          ? { ...viewport, xIn: ptIn.xIn + drag.dxIn, yIn: ptIn.yIn + drag.dyIn }
          : viewport));
      drag.moved = true;
      this._draw();
    }
  }

  _onMouseUp() {
    this._panning = false;
    if (this._draggingViewport) {
      const moved = this._draggingViewport.moved;
      this._draggingViewport = null;
      if (moved) this.setState({ viewports: this.state.viewports, auto: false }, () => this._persistLayout());
    }
  }

  _onKeyDown(e) {
    if (e.target instanceof HTMLInputElement || e.target instanceof HTMLTextAreaElement) return;
    if (e.key === 'Escape') {
      if (this.state.addingViewport || this.state.selectedViewportId != null) {
        this.setState({ addingViewport: false, selectedViewportId: null }, () => this._draw());
      }
      return;
    }
    if ((e.key === 'Delete' || e.key === 'Backspace') && this.state.selectedViewportId != null) {
      e.preventDefault();
      this.setState({
        viewports: this.state.viewports.filter(viewport => viewport.id !== this.state.selectedViewportId),
        selectedViewportId: null,
        auto: false,
      }, () => { this._persistLayout(); this._draw(); });
    }
  }

  // THE PICKED SCALE IS A CEILING, NOT A COMMAND (Movie, 21 Sep: "needs more
  // compact scale", and "on model.dc it would first try ... and then if it
  // didn't fit it would try the next scale down and check to see if it fit and
  // then maybe one more down").
  //
  // A HAND-PLACED VIEWPORT USED TO TAKE `activeScale` AND NOTHING ELSE, so a
  // 66 ft house placed at the 1/4" working scale ran off an 11x17 sheet and
  // stayed there -- `_setScale` writes `activeScale`, which is read HERE and
  // nowhere else, so there was no way to bring it back short of deleting the
  // viewport and placing it again.
  //
  // The composer has walked a ladder since it was written (`_autoScaleFor`,
  // AUTO_SCALE_PREFS largest-first, first rung that fits). This is the same
  // walk on the other path. The drafter's pick is honoured as the LARGEST
  // scale they are willing to accept rather than as a fixed one: the walk
  // starts there and steps down, so a plan that already fits is placed at
  // exactly what they asked for and only an overflowing one moves.
  //
  // NOTHING FITS, NOTHING IS REFUSED. A drawing too big for the paper at every
  // rung is placed at the smallest rung rather than not placed at all -- the
  // sheet is the drafter's to arrange, and a viewport they can see and move
  // beats a press that silently did nothing.
  _placementPif(levelId) {
    const start = this.state.activeScale;
    const foot = this._viewFootprintFt({ kind: 'plan', levelId });
    if (!foot) return SCALES[start].pif;
    const region = this._composeRegionIn();
    const fits = pif => foot.wFt * pif <= region.w
      && foot.hFt * pif + COMPOSE_LABEL_IN <= region.h;
    for (let i = start; i >= 0; i -= 1) {
      if (fits(SCALES[i].pif)) return SCALES[i].pif;
    }
    return SCALES[0].pif;
  }

  _placeViewport(ptIn) {
    const levelId = this.state.activeLevelId;
    if (!this._saved || levelId == null) {
      this.setState({ addingViewport: false });
      return;
    }
    const viewport = {
      id: this.state.nextViewportId,
      kind: 'plan',
      levelId,
      pif: this._placementPif(levelId),
      xIn: ptIn.xIn,
      yIn: ptIn.yIn,
      sheet: this.state.activeSheet,
    };
    this.setState({
      viewports: [...this.state.viewports, viewport],
      nextViewportId: viewport.id + 1,
      selectedViewportId: viewport.id,
      addingViewport: false,
      auto: false,
    }, () => { this._persistLayout(); this._draw(); });
  }

  _setPaper(key) {
    this.state.paperKey = key;
    this._fitPaper();
    this._draw();
    this.setState({ paperKey: key, auto: false }, () => {
      this._rememberActiveProfile('settings');
      this._persistLayout();
    });
  }

  _setOrientation(o) {
    this.state.orientation = o;
    this._fitPaper();
    this._draw();
    this.setState({ orientation: o, auto: false }, () => {
      this._rememberActiveProfile('settings');
      this._persistLayout();
    });
  }

  _setScale(idx) {
    this.setState({ activeScale: idx }, () => this._rememberActiveProfile('settings'));
  }

  _setTitleblock(id) {
    this.setState({ titleblock: id, auto: false }, () => {
      this._draw();
      this._rememberActiveProfile('settings');
      this._persistLayout();
    });
  }

  _setActiveSheet(sheet) {
    this.setState({ activeSheet: sheet, selectedViewportId: null }, () => this._draw());
  }

  // The arrow flies on site plans by convention, but any sheet may raise or
  // strike it — auto-setup from a model-space true north is board #289.
  _toggleNorthArrow() {
    this.setState({ northArrow: !this.state.northArrow, auto: false }, () => {
      this._draw();
      this._persistLayout();
    });
  }

  // ── THE PANEL, PAINTED ──────────────────────────────────────────────
  // What `renderVals()` used to return. The DC template read a flat object of
  // ~40 values and forty style attributes off it; this writes the same facts
  // onto the same elements, and the chosen-ness that used to arrive as a
  // colour (`bg: '#1d1f20'`) arrives as a class the stylesheet owns.
  //
  // REBUILT RATHER THAN DIFFED, for the five lists. A panel of at most twenty
  // buttons is not worth a reconciler, and the page never paints during a
  // drag -- _onMouseMove writes `this.state` directly and calls `_draw()`,
  // exactly as it did under React, so a paint only follows a real change.
  _paintPanel() {
    const {
      paperKey, orientation, activeScale, addingViewport, activeLevelId,
    } = this.state;
    const paper = PAPER_SIZES[paperKey];
    const pw = orientation === 'landscape' ? paper.h : paper.w;
    const ph = orientation === 'landscape' ? paper.w : paper.h;

    // One list of picks into one host. `key` is what the click hands back;
    // `on` is the one wearing the chosen face.
    const picks = (selector, items, onPick, extraClass = '') => {
      const host = document.querySelector(selector);
      if (!host) return;
      host.textContent = '';
      items.forEach(item => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `lay-pick${extraClass ? ` ${extraClass}` : ''}${item.on ? ' on' : ''}`;
        button.textContent = item.label;
        if (item.data) Object.entries(item.data).forEach(([k, v]) => button.setAttribute(k, v));
        button.addEventListener('click', () => onPick(item.key));
        host.appendChild(button);
      });
    };

    picks('[data-paper-sizes]',
      Object.entries(PAPER_SIZES).map(([key, size]) =>
        ({ key, label: size.label, on: paperKey === key })),
      key => this._setPaper(key), 'lay-paper');

    document.querySelectorAll('[data-orient]').forEach(button =>
      button.classList.toggle('on', button.dataset.orient === orientation));

    picks('[data-sheet-list]',
      Array.from({ length: this._sheetCount() }, (_, i) => ({
        key: i + 1,
        label: `SHEET ${i + 1}`,
        on: this.state.activeSheet === i + 1,
        data: { 'data-layout-sheet': String(i + 1) },
      })),
      sheet => this._setActiveSheet(sheet));

    picks('[data-scale-list]',
      SCALES.map((scale, i) => ({ key: i, label: scale.label, on: activeScale === i })),
      i => this._setScale(i));

    const levels = this._levelsWithWalls?.() || [];
    document.querySelector('[data-level-section]').hidden = !levels.length;
    picks('[data-level-list]',
      levels.map(level => ({
        key: level.id,
        label: level.name,
        on: activeLevelId === level.id,
        data: { 'data-layout-level': String(level.id) },
      })),
      id => this.setState({ activeLevelId: id }));

    // The company strips are an 11×17 feature: the letter sheet stands the
    // picker down and keeps the plain strip.
    //
    // EMPTIED, NOT HIDDEN, and a spec caught the difference. The DC template
    // carried this section inside an `sc-if`, which REMOVES its contents --
    // so on a letter sheet there was no picker in the document at all.
    // layout-titleblock.spec.js asks for exactly that (`toHaveCount(0)`), and
    // it is the right question: a control that is merely invisible is still
    // in the tab order.
    const showTitleblocks = paperKey === '11x17' && Boolean(window.DraftTitleblock);
    document.querySelector('[data-titleblock-section]').hidden = !showTitleblocks;
    picks('[data-titleblock-list]',
      showTitleblocks ? (window.DraftTitleblock?.STYLES || []).map(style => ({
        key: style.id,
        label: style.label,
        on: this.state.titleblock === style.id,
        data: { 'data-layout-titleblock': style.id },
      })) : [],
      id => this._setTitleblock(id));

    // The arrow rides with the picker, for the same reason. The template had
    // it inside the same block.
    if (showTitleblocks) {
      const north = document.createElement('button');
      north.type = 'button';
      north.id = 'lay-north';
      north.className = `lay-pick${this.state.northArrow ? ' on' : ''}`;
      north.setAttribute('data-layout-north', '');
      north.textContent = this.state.northArrow ? 'North Arrow · On' : 'North Arrow · Off';
      north.addEventListener('click', () => this._toggleNorthArrow());
      document.querySelector('[data-titleblock-list]').appendChild(north);
    }

    const addViewport = document.querySelector('[data-layout-add-viewport]');
    addViewport.classList.toggle('arming', addingViewport);
    addViewport.textContent = addingViewport ? 'CLICK THE SHEET…' : '+ Add Viewport';

    const deal = document.querySelector('[data-layout-deal-sheets]');
    deal.disabled = !this._saved;
    // IT SAYS WHICH IT WOULD DO. Dealing over a dealt set is a re-deal, and
    // naming that is the difference between a button a drafter trusts and one
    // they press twice to find out.
    deal.textContent = this.state.viewports.length ? 'Re-deal Sheets' : 'Deal Sheets';

    const note = document.querySelector('#lay-viewport-note');
    note.hidden = !(this._drawingChecked && !this._saved);
    note.textContent = 'Draw a house in the MODEL space first — viewports project the saved drawing.';

    const canvas = document.querySelector('[data-layout-canvas]');
    canvas.classList.toggle('grabbing', Boolean(this._panning || this._draggingViewport));
    canvas.classList.toggle('arming', Boolean(addingViewport) && !this._panning && !this._draggingViewport);

    const status = document.querySelector('[data-layout-status]');
    status.textContent = this.state.persistenceError
      ? `${this.state.persistenceStatus} — ${this.state.persistenceError}`
      : this.state.persistenceStatus;
    status.classList.toggle('lay-bad', Boolean(this.state.persistenceError));

    const undo = document.querySelector('[data-undo]');
    const redo = document.querySelector('[data-redo]');
    const title = (button, text) => {
      button.title = text;
      button.setAttribute('aria-label', text);
    };
    undo.disabled = !this.state.historyPast;
    redo.disabled = !this.state.historyFuture;
    title(undo, this.state.historyPast ? 'Undo the last sheet change' : 'Nothing to undo yet');
    title(redo, this.state.historyFuture ? 'Redo the sheet change just undone' : 'Nothing to redo');

    document.querySelector('[data-sheet-readout]').textContent =
      `${pw}" × ${ph}"  ·  ${SCALES[activeScale].label}`;

    this._paintProfileDialog();
  }

  _paintProfileDialog() {
    const which = this.state.profileDialog;
    document.querySelector('#lay-scrim').hidden = !which;
    if (!which) return;
    const title = which === 'standards' ? 'Company Standards' : 'Personal Settings';
    document.querySelector('#lay-dialog').setAttribute('aria-label', title);
    document.querySelector('#lay-dialog-title').textContent = title;
    document.querySelector('#lay-dialog-description').textContent = which === 'standards'
      ? 'Save the current layout standards to share with an office, or import standards from a portable file.'
      : 'Save the current personal layout preferences, or import a saved setup from another browser or computer.';
    document.querySelector('#lay-keys-link').hidden = which !== 'settings';
    document.querySelector('#lay-save').textContent = `SAVE ${title}`;
    const name = document.querySelector('#lay-file-name');
    if (name.value !== this.state.profileFileName) name.value = this.state.profileFileName;
    document.querySelector('#lay-file-ext').textContent = `.draft.${which}`;
    document.querySelector('[data-profile-import]')
      .setAttribute('accept', `application/json,.draft.${which}`);
    const message = document.querySelector('#lay-dialog-message');
    message.hidden = !this.state.profileDialogMessage;
    message.textContent = this.state.profileDialogMessage;
    message.classList.toggle('lay-bad', Boolean(this.state.profileDialogError));
  }

  // ── THE CONTROLS, WIRED ONCE ────────────────────────────────────────
  // The template carried these as `onClick="{{ name }}"` against closures the
  // render rebuilt every time. These elements never move, so they are bound
  // once and read `this.state` when they fire.
  _wirePanel() {
    const on = (selector, event, handler) =>
      document.querySelector(selector)?.addEventListener(event, handler);

    on('[data-open-settings]', 'click', () => this._openProfileDialog('settings'));
    on('[data-open-standards]', 'click', () => this._openProfileDialog('standards'));
    document.querySelectorAll('[data-orient]').forEach(button =>
      button.addEventListener('click', () => this._setOrientation(button.dataset.orient)));
    on('[data-layout-add-sheet]', 'click', () => this._setActiveSheet(this._sheetCount() + 1));
    on('[data-layout-add-viewport]', 'click', () => this.setState(
      { addingViewport: !this.state.addingViewport }, () => this._draw()));
    on('[data-layout-deal-sheets]', 'click', () => this._dealSheets());

    on('#lay-dialog-close', 'click', () => this._closeProfileDialog());
    on('#lay-save', 'click', () => this._saveProfilePackage());
    on('#lay-import', 'click', () => document.querySelector('[data-profile-import]')?.click());
    on('[data-profile-import]', 'change', e => {
      const file = e.target.files?.[0];
      if (file) this._importProfilePackage(file);
      e.target.value = '';
    });
    on('#lay-file-name', 'input', e => this.setState({ profileFileName: e.target.value }));
    on('#lay-file-name', 'keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); this._saveProfilePackage(); }
      if (e.key === 'Escape') { e.preventDefault(); this._closeProfileDialog(); }
    });
    on('[data-undo]', 'click', () => this._undoLayout());
    on('[data-redo]', 'click', () => this._redoLayout());
  }

  // THE COMPOSER, ON DEMAND. It replaces every viewport on every sheet, so a
  // drafter who has placed any by hand is asked first -- and is NOT asked when
  // there is nothing of theirs to lose, because a confirm over an empty sheet
  // is a dialog that only ever has one sensible answer.
  _dealSheets() {
    if (!this._saved) return;
    const byHand = this.state.viewports.length > 0 && this.state.auto !== true;
    if (byHand && !window.confirm(
      'Deal the standard sheet set?\n\nThis replaces the viewports you have '
      + 'placed by hand. Undo takes it back.')) return;
    this.setState({ addingViewport: false }, () => this._composeDefaultSet());
  }
}

// ── BOOT ────────────────────────────────────────────────────────────────
// The order React used: the controls exist, the panel is painted from the
// initial state, and only then does the page mount -- so componentDidMount
// finds a canvas to size and a panel already showing what the state says.
const page = new Component();
page._wirePanel();
page._paintPanel();
page.componentDidMount();

// ── THE SHARED BAR, WIRED TO WHAT THIS PAGE CAN HONESTLY DO ─────────────
(() => {
  const S = window.DraftShellBars;

  // THE BONE WEARS THE THEME FROM THE FIRST FRAME. wireSkin repaints it on
  // every press, but nothing has been pressed on load -- and a page opened
  // straight into ROUGH would show a red bone until the drafter touched a
  // switch. PROJECT learned this one the hard way.
  S.paintBone(window.__layoutSkin.theme);

  // THE SKIN SWITCH IS THE BAR'S; WHAT TO REPAINT IS THIS PAGE'S. The sheet
  // is a canvas and _draw() reads its inks from DraftPalette.resolve() off
  // the root's data-theme/data-mode, which wireSkin has already rewritten by
  // the time onSkin runs -- so the repaint is one call and the painter needs
  // to know nothing about switches. The comment in the head boot that said
  // this page "only READS the choice" stopped being true here.
  S.wireSkin({
    theme: window.__layoutSkin.theme,
    mode: window.__layoutSkin.mode,
    onSkin: (skin, theme, mode) => {
      window.__layoutSkin = { theme, mode };
      page._draw();
    },
  });

  // ── AND THE CONTROLS IT CANNOT ─────────────────────────────────────────
  //
  // DISABLED, NOT LEFT LIVE, which is this bar's own vocabulary: the page row
  // has shown REAL ESTATE LAYOUT and ESTIMATES greyed since it was built,
  // because "the row is the map of the job" and a map with a town missing
  // teaches a shape that is wrong. A button that looks pressable and does
  // nothing teaches a worse one. Each carries a title saying why, so the
  // answer is one hover away rather than in this file.
  const standDown = (id, why) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.disabled = true;
    el.title = why;
  };

  // THE FILE ROW. All six are operations on the DRAWING, and this page does
  // not own the drawing -- it arranges views OF it onto sheets, and it writes
  // exactly one thing back: the layout record, on every change, through
  // _persistLayout's queue. That is why SAVE is greyed on a page that saves
  // constantly: there is no moment when a drafter here has unsaved work to
  // press a button about, and the status word to the left says so.
  //
  // PRINTSCREEN IS THE ONE THAT WILL COME BACK. This is the page that makes
  // printable sheets, so it is the page where that button most obviously
  // belongs -- but printing a sheet is a feature with its own questions (which
  // sheet, at what size, with the titleblock's fields filled from where), and
  // wiring it under cover of a bar swap would be answering them by accident.
  standDown('file-new', 'NEW — start a drawing in the MODEL space');
  standDown('file-open', 'OPEN — open a drawing in the MODEL space');
  standDown('save', 'SAVE — this page writes every change as you make it; '
    + 'the word at the foot says where that stands');
  standDown('file-save-as', 'SAVE AS — not on the construction layout yet');
  standDown('file-ext', 'Not on the construction layout yet');
  standDown('printscreen', 'PRINTSCREEN — printing a sheet is not wired yet');

  // UNITS. Not "not yet": a construction sheet is scaled in ARCHITECTURAL
  // scales -- 1/4" = 1'-0" and the eight either side of it -- and the whole
  // scale ladder, the paper sizes and the paper-inch arithmetic are imperial
  // all the way down. METRIC here would need a second ladder, not a
  // conversion. IMPERIAL stays marked so the corner still reads true.
  S.markSwitch(S.switchSet('data-units'), 'units', 'imperial');
  document.querySelectorAll('[data-units-corner] button').forEach(b => {
    b.disabled = true;
    b.title = 'The construction sheet reads in architectural scales, which are '
      + 'imperial — see the VIEWPORT SCALE list';
  });

  // TOY / DRAFTING is what the drawing is being made in, and nothing is being
  // made here: this page arranges views of a drawing the MODEL space owns.
  document.querySelectorAll('[data-mode-corner] button[data-board]').forEach(b => {
    b.disabled = true;
    b.title = 'TOY and DRAFTING are set where the house is drawn, in the MODEL space';
  });

  // THE INSTRUMENTS. Movie asked for them on this bar -- "we may need to draw
  // sometimes" -- so they are mounted, and they are DORMANT because nothing on
  // this page fills them yet. `.chip.dormant` is the bar's own word for it,
  // already worn by MODEL's unbuilt tools: "the rest of the kit, not yet in
  // hand". The LENGTH and ANGLE readouts need nothing done to them; they
  // reserve width only when they are reading, so empty they cost no space.
  //
  // A CHIP IS NOT ALWAYS A BUTTON, which this got wrong first time and a spec
  // caught: four of them are -- brush, ruler, tsquare, scale -- and the rest
  // are SPANS. Setting .disabled on a span is silently ignored, so the page
  // looked stood-down and three of its chips were still live elements. The
  // class is what every chip gets; the property goes where it means something.
  //
  // AND THREE OF THEM SHIPPED DORMANT ALREADY -- compass, triangle, erasing
  // shield, "not built on this page yet" in the bar's own markup. Their titles
  // say something truer than anything this page could add, so they keep them.
  document.querySelectorAll('#strip-center .chip').forEach(chip => {
    const alreadyDown = chip.classList.contains('dormant');
    chip.classList.add('dormant');
    if ('disabled' in chip) chip.disabled = true;
    if (!alreadyDown) chip.title = 'Drawing instruments live in the MODEL space';
  });

  // THE BONE. The bar owns the button; this page owns the verb, and the verb
  // is PRINT -- board #20, not built. Until it is, a press that silently did
  // nothing would be worse than one that says what it is waiting for.
  //
  // IT SAYS SO IN THE STATUS WORD AND THEN GETS OUT OF THE WAY. The word is
  // painted from state.persistenceStatus on every _paintPanel, so the way back
  // is a repaint rather than remembering what was there -- which also means a
  // save landing during those four seconds wins, as it should.
  const bone = document.getElementById('bone');
  if (bone) {
    let clearing = 0;
    bone.addEventListener('click', () => {
      const status = document.querySelector('[data-layout-status]');
      if (!status) return;
      status.classList.remove('lay-bad');
      status.textContent = 'PRINTING A SHEET IS NOT WIRED YET';
      window.clearTimeout(clearing);
      clearing = window.setTimeout(() => page._paintPanel(), 4000);
    });
  }
})();
</script>
<!-- Visit counter: async, fail-silent, silent on localhost (see traffic-counter.js). -->
<script src="./traffic-counter.js" defer></script>
</body>
