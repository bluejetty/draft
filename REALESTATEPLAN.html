<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Rough Drafter &mdash; Real Estate Plan</title>
<!-- Self-hosted (see vendor/fonts.css): no third-party request on the
     critical path of the page. -->
<link rel="stylesheet" href="vendor/fonts.css" />
<link rel="stylesheet" href="./shell-bars.css" />
<script src="./palette.js"></script>
<!-- WHAT A PLAN NEEDS, AND NOT WHAT A CONSTRUCTION SHEET NEEDS.
     Movie, 27 Sep: "the REAL ESTATE PLAN area will be similar to the
     CONSTRUCTION layout but we will present the drawings in a different way.
     can you add that tab as a new page similar to construction layout and we
     can modify it to creat our REAL ESTATE PLAN".

     SIMILAR, THROUGH THE SAME MODULES rather than by copying the page. The
     drawing half of Construction Layout is already lifted out -- layout-plan.js
     composes a level into a box and plan-composition.js is the order it draws
     in -- so this page is the same painter under a different sheet, which is
     exactly the shape "we can modify it" wants. A clone of LAYOUT.html would
     have been eighteen hundred lines that drift apart from the day they are
     written.

     AND FEWER MODULES, because a listing plan is not a construction document.
     auto-dims, the electrical symbols and the section tables are things a
     sheet carries to be BUILT from. What a buyer reads is the shape of the
     rooms -- so the shell walls, the openings, the stairs and the fixtures
     are here, and the rest is deliberately absent rather than loaded and
     switched off.

     LAYER-VIEWS AND CUT-VIEW ARE NOT PART OF THAT ECONOMY, and this ledger
     used to say otherwise -- it listed layer-views among the things dropped
     and in the same breath promised the stairs. Both cannot be true, and the
     page shipped the second sentence while the script list kept the first:

       layout-plan builds its stair stage only as
       `stairs && LEVELS && VIEWS ? {...} : null`, and VIEWS is
       DraftLayerViews. Absent, the whole stage is null and every stair on
       every level is silently not drawn. Nothing throws.

       layout-plan reads its slab standards as
       `(window.DraftCutView && window.DraftCutView.STANDARDS) || {}`. Absent,
       every standard is `undefined` -- which reaches the garage slab note as
       a blank thickness and the thickened edge as geometry computed from two
       undefineds. Nothing throws there either.

     THE INTENT WAS NEVER IN DOUBT. The drawPlan call below refuses `shell:
     true` precisely BECAUSE it "drops the stairs, the fixtures and the
     structure" -- so this page took deliberate care to keep its stairs and
     then lost them through the back door of a missing script tag. Devin's
     audit, 28 Sep, found both and reproduced both; no test had ever opened
     this page.

     THE LESSON THIS LEDGER OWES ITS NEXT READER: a module dropped from a page
     is only dropped if nothing the page still loads ASKS for it. Both of
     these were asked for by layout-plan.js, which this page has loaded all
     along.

     AND THE SAME RULE, APPLIED TO THE FIX ITSELF. cut-view.js is here for
     ONE THING: its STANDARDS table, which layout-plan reads for the garage
     slab. Nothing on this page calls a cut-view PAINTER -- there are no
     elevations on a listing plan -- so the modules those painters reach for
     are deliberately absent, and a mirror check will list them:

       finish-patterns, roof-patterns, roof-types   wall and roof hatching,
                                                    only ever asked for
                                                    behind `opts.finishes`,
                                                    which this page never sets
       build-house                                  pile footing sizes, read
                                                    by the elevation's column
                                                    painter
       fen-labels                                   window and door tags on an
                                                    ELEVATION; the plan's own
                                                    tags come through
                                                    plan-composition, which
                                                    this page gates off

     Written down because the count going UP after a fix is exactly the shape
     that gets waved away, and because the previous version of this ledger
     shows what happens when nobody checks whether a stated absence is still
     true. If any of those five is ever reached from this page, it is a
     defect and not an inconvenience: add the script, do not widen a guard. ALL IN THE HEAD: the bars are written where their mount call
     stands, mid-parse, so a module loaded after the body is one that call
     cannot find. -->
<script src="./shell-bars.js"></script>
<script src="./profile-manager.js"></script>
<script src="./shared-file-store.js"></script>
<script src="./drawing-format.js"></script>
<script src="./wall-types.js"></script>
<script src="./level-assembly.js"></script>
<script src="./layer-views.js"></script>
<script src="./render-2d.js"></script>
<script src="./geometry-2d.js"></script>
<!-- AFTER geometry-2d.js: areas.js asks it whether a stair hole lies inside
     its floor, and throws rather than guess without it. -->
<script src="./areas.js"></script>
<script src="./stair-geometry.js"></script>
<script src="./closets.js"></script>
<script src="./fixture-geometry.js"></script>
<script src="./plan-composition.js"></script>
<script src="./layout-plan.js"></script>
<script src="./formatters.js"></script>
<!-- AFTER formatters.js, and the order is the whole of it: cut-view.js
     destructures window.DraftFormatters AT LOAD, so placed before it the
     tag is present, the module throws, DraftCutView is never defined, and
     the page carries on and draws a plan. That is the same defect this
     script was added to fix, one layer down -- a script tag is not a
     dependency met until the thing it needs is already in hand. -->
<script src="./cut-view.js"></script>
<script src="./orientation-guard.js"></script>
<script>
  // THE SKIN IS ONE CHOICE ACROSS THE WHOLE APP, read off the same
  // `draft-skin` key MODEL writes. Synchronous and in the head: a page written
  // in --role tokens has no colour at all between parse and boot.
  (() => {
    const P = window.DraftPalette;
    const params = new URLSearchParams(location.search);
    const stored = (() => {
      try { return JSON.parse(localStorage.getItem('draft-skin') || 'null') || {}; }
      catch { return {}; }
    })();
    const theme = params.get('theme') || stored.theme || 'ruff';
    const mode = params.get('mode') || stored.skinMode || 'night';
    window.__rpSkin = P.apply(document, theme, mode);   // role -> colour
    window.__rpTheme = { theme, mode };
  })();
</script>
<style>
  :root { --sheet-edge: 1px solid var(--edge-panel); }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  /* THE BARS ARE FIXED AND THIS COLUMN HOLDS ITSELF CLEAR OF THEM. Both bars
     are positioned out of flow, so they take no space here -- and without this
     padding the top of the page sits under the instrument rule and the bottom
     under the page row. Construction Layout carries the same two lines with
     the same note; this page went in without them, and the foot of the right
     rail was the price: "Add band" rendered under the bar, visible and
     unpressable. Found by a Playwright click that kept being intercepted by
     the SPECIFICATIONS chip on top of it.

     EVERY NUMBER IS THE BAR'S OWN TOKEN, so a bar that changes height moves
     this page with it -- --strip-h at the head, --house-h plus --browser-lane
     at the foot. --browser-lane is in the sum on purpose: it is the band a
     browser draws its link preview over and iOS keeps for the home indicator,
     and #house-strip reserves it as padding INSIDE its own box, so a page
     subtracting only --house-h puts its last 24px under the bar's hem. */
  body {
    margin: 0; background: var(--surface-page); color: var(--ink-primary);
    font-family: 'Barlow Condensed', system-ui, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
    padding-top: var(--strip-h);
    padding-bottom: calc(var(--house-h) + var(--browser-lane));
  }
  main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .stage { flex: 1; display: flex; min-height: 0; }

  /* ONE RAIL WIDTH, LEFT AND RIGHT ALIKE (board #48). */
  .rail {
    flex: none; width: 188px; padding: 10px; overflow-y: auto;
    background: var(--surface-panel); display: flex; flex-direction: column; gap: 10px;
  }
  .rail.left { border-right: var(--sheet-edge); }
  .rail-title {
    font-size: 11px; font-weight: 600; letter-spacing: .1em;
    text-transform: uppercase; color: var(--accent-mark); margin: 2px 0 0 0;
  }
  .seat {
    display: flex; align-items: center; gap: 6px; font-size: 12px;
    border: 1px solid var(--edge-panel); background: var(--surface-chip);
    padding: 5px 6px; letter-spacing: .05em;
  }
  .seat .what { flex: 1; min-width: 0; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .seat input[type="checkbox"] { accent-color: var(--accent-mark); }
  .seat[data-empty="true"] .what { color: var(--ink-quiet); }
  .prop { display: flex; flex-direction: column; gap: 4px; }
  .prop label {
    font-size: 10px; letter-spacing: .09em; text-transform: uppercase;
    color: var(--ink-quiet);
  }
  .prop select {
    appearance: none; background: var(--surface-chip); color: var(--ink-primary);
    border: 1px solid var(--edge-panel); font: inherit; font-size: 12px;
    padding: 5px 6px; width: 100%;
  }
  .empty { font-size: 11px; color: var(--ink-quiet); line-height: 1.45; margin: 0; }

  /* THE DESK, AND THE PAPER ON IT. The sheet is white in every skin: it is
     paper, and paper that changed colour with the lights would be lying about
     what comes out of the printer. Construction Layout's own note says the
     same thing about the same rectangle. */
  .sheet-wrap {
    flex: 1; min-width: 0; display: flex; align-items: center;
    justify-content: center; padding: 14px; overflow: hidden;
  }
  canvas#sheet {
    background: var(--surface-chip); border: var(--sheet-edge);
    width: 100%; height: 100%; display: block;
  }
  #status {
    flex: none; padding: 5px 12px; font-size: 11px; letter-spacing: .05em;
    color: var(--ink-quiet); min-height: 22px;
  }
</style>
</head>
<body>
  <!-- THE INSTRUMENTS ARE HERE AND ASLEEP, as on EXT. FINISH: the bar owns the
       furniture, the page owns what the furniture does, and nothing on a sheet
       is drawn by length and angle yet. -->
  <script>window.DraftShellBars.topBar({ instruments: true });</script>
  <main>
    <div class="stage">
      <div class="rail left">
        <p class="rail-title">On the sheet</p>
        <!-- THE SEATS HE NAMED, 27 Sep: "it will need the floor plans but i
             will need to adjust what is shown and how it is shown in this
             layout view, so will have the MAIN FL, 2nd FL (maybe basement
             (optional) and will have main front 3D View (once available)".

             SO THE SEATS ARE A LIST AND NOT A LAYOUT. Each one is a level of
             the drawing that is actually there, with a tick that says whether
             it prints -- the basement's is the "optional" he asked for, and it
             starts OFF for the same reason he wrote the word. The 3D seat is
             held open and says so: nothing can draw it yet. -->
        <div id="seat-list"></div>
        <p class="rail-title">Sheet</p>
        <div class="prop">
          <label for="paper">Paper</label>
          <select id="paper"></select>
        </div>
        <p class="empty" id="note"></p>
      </div>
      <div class="sheet-wrap"><canvas id="sheet" width="1000" height="640"></canvas></div>
    </div>
    <div id="status" role="status"></div>
  </main>

  <!-- page:'real-estate' marks this chip "you are here". NO BONE yet: the bone
       prints, and what this sheet prints is the thing Movie has said he wants
       to arrange before it goes anywhere. -->
  <script>window.DraftShellBars.bottomBar({ page: 'real-estate', bone: false });</script>

  <script>
    (async () => {
      const FORMAT = window.DraftDrawingFormat;
      const WT = window.DraftWallTypes;
      const LP = window.DraftLayoutPlan;
      const BUCKET = 'model-drawing';
      const statusEl = document.getElementById('status');
      const say = text => { statusEl.textContent = text; };

      // ── THE PAPER ─────────────────────────────────────────────────────
      // 8.5 x 11 LANDSCAPE IS THE DEFAULT, which is Movie's: "the LAYOUT tabe
      // with real estate layout will have a default 8.5 x 11 size Landscape
      // sheet". Landscape means 11 wide by 8.5 high, and it is FIRST in the
      // list so it is what the page opens on.
      const PAPERS = [
        { id: 'letter-land', label: 'Letter 11 × 8.5', w: 11, h: 8.5 },
        { id: 'letter-port', label: 'Letter 8.5 × 11', w: 8.5, h: 11 },
        { id: 'tabloid-land', label: 'Tabloid 17 × 11', w: 17, h: 11 },
      ];
      let paper = PAPERS[0];
      const MARGIN_IN = 0.5;

      // ── WHAT IS ON IT ─────────────────────────────────────────────────
      // A seat is a LEVEL plus whether it prints. Kept in the order the
      // drawing's own levels are in, so the sheet reads bottom-up the way the
      // house is stacked -- and the 3D view sits at the end as a seat with no
      // level behind it, which is why it carries `kind` rather than an id.
      let seats = [];

      const load = async () => {
        const store = window.SharedFileStore;
        if (!store) return null;
        let file = null;
        try { file = await store.loadSharedFile(BUCKET); } catch { file = null; }
        if (!file) return null;
        let parsed = null;
        try { parsed = JSON.parse(await file.text()); } catch { return null; }
        const envelope = FORMAT.checkEnvelope(parsed);
        return envelope.ok ? parsed : null;
      };

      let drawing = null, levels = [];

      // A LEVEL EARNS A SEAT BY HAVING WALLS ON IT. layout-plan's own
      // auto-layout works the same way, and for the same reason Movie gave on
      // 21 Sep about empty sheets: a seat holding a level nothing is drawn on
      // is a rectangle that teaches the drafter the plan is missing.
      const planned = levelId => LP.planWalls(drawing, levelId, 'plan').length > 0;

      // WHICH LEVEL IS THE BASEMENT: the lowest one that carries plan walls
      // and sits below the first floor. Read off the drawing rather than off a
      // name, because a level called anything at all can be the one under the
      // house -- and `optional` is the only thing this page does differently
      // with it, so getting it wrong costs a tick and not a drawing.
      const buildSeats = () => {
        const withWalls = levels.filter(level => planned(level.id))
          .sort((a, b) => (a.elev || 0) - (b.elev || 0));
        const lowest = withWalls[0];
        seats = withWalls.map(level => ({
          kind: 'plan',
          id: level.id,
          label: level.name || `LEVEL ${level.id}`,
          // THE BASEMENT IS OPTIONAL AND OFF, which is the word he used:
          // "(maybe basement (optional)". Everything else prints.
          optional: withWalls.length > 1 && level === lowest && (level.elev || 0) < 0,
          on: !(withWalls.length > 1 && level === lowest && (level.elev || 0) < 0),
        }));
        // THE 3D SEAT, HELD OPEN. "will have main front 3D View (once
        // available)" -- so it is on the sheet as a reserved rectangle with its
        // own label, not as a silence. It cannot be ticked on, because there is
        // nothing to tick on yet.
        // THE AREAS, as a seat of their own so they can be ticked off like a
        // plan (Movie, 1 Oct: "the floor areas and total house area on main
        // and above levels and area for foundation area").
        seats.push({ kind: 'areas', id: null, label: 'FLOOR AREAS', on: true });
        seats.push({ kind: 'view3d', id: null, label: 'FRONT 3D VIEW',
          waiting: true, on: true });
      };

      const paintSeats = () => {
        const host = document.getElementById('seat-list');
        host.innerHTML = '';
        if (!seats.length) {
          const p = document.createElement('p');
          p.className = 'empty';
          p.textContent = 'No plans in this drawing yet.';
          host.appendChild(p);
          return;
        }
        seats.forEach((seat, i) => {
          const row = document.createElement('div');
          row.className = 'seat';
          if (seat.waiting) row.dataset.empty = 'true';
          const box = document.createElement('input');
          box.type = 'checkbox';
          box.checked = !!seat.on;
          box.disabled = !!seat.waiting;
          box.id = `seat-${i}`;
          box.addEventListener('change', () => {
            seats[i].on = box.checked;
            paintSheet();
            say(`${seat.label} ${box.checked ? 'on' : 'off'} the sheet.`);
          });
          const label = document.createElement('label');
          label.className = 'what';
          label.htmlFor = box.id;
          label.textContent = seat.waiting ? `${seat.label} — waiting on 3D` : seat.label;
          row.appendChild(box);
          row.appendChild(label);
          host.appendChild(row);
        });
      };

      // ── THE SHEET ─────────────────────────────────────────────────────
      const fitCanvas = canvas => {
        const box = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        const w = Math.max(320, Math.round(box.width * dpr));
        const h = Math.max(240, Math.round(box.height * dpr));
        if (canvas.width !== w) canvas.width = w;
        if (canvas.height !== h) canvas.height = h;
      };

      // THE SEATS ARE LAID IN A ROW OF EQUAL BOXES, which is the plainest
      // arrangement that is honestly an arrangement -- and the one Movie said
      // he would change: "i will need to adjust what is shown and how it is
      // shown in this layout view". So the boxes are computed from a count
      // rather than written down, and moving to a different presentation is a
      // change to this function and to nothing else.
      const boxesFor = (n, x, y, w, h) => {
        if (n <= 0) return [];
        const gap = Math.min(w, h) * 0.03;
        const cols = n <= 2 ? n : Math.ceil(n / 2);
        const rows = Math.ceil(n / cols);
        const bw = (w - gap * (cols - 1)) / cols;
        const bh = (h - gap * (rows - 1)) / rows;
        const out = [];
        for (let i = 0; i < n; i += 1) {
          const c = i % cols, r = Math.floor(i / cols);
          out.push({ x: x + c * (bw + gap), y: y + r * (bh + gap), w: bw, h: bh });
        }
        return out;
      };

      // ── THE AREAS ─────────────────────────────────────────────────────
      //
      // Movie, 1 Oct: "the floor areas and total house area on main and above
      // levels and area for foundation area ... (but basement not always
      // shown)". So: every level's own area, top down; the HOUSE total is the
      // levels at grade and above; anything below grade -- the foundation or
      // a basement -- is its own line and never in the house total.
      //
      // MEASURED BY areas.js, the calculator the AREAS dialog has used: a
      // floor's polygons, less the stair holes cut in it, with the GARAGE
      // kept out of every figure. A level with no floor drawn falls back to
      // its outline, and one with neither says so rather than printing 0.
      const areaReport = () => {
        const A = window.DraftAreas;
        if (!A || !drawing) return null;
        const pts = list => (Array.isArray(list) ? list : []);
        // A LEVEL WITH A PLAN OR A FLOOR. The foundation's walls are drawn on
        // its own FOUNDATION view, so "has plan walls" alone would leave the
        // foundation off the very box that is asked to list it; its slab is
        // what is measured.
        const floored = levelId => pts(drawing.floors).some(f => f && f.levelId === levelId);
        const onSheet = levels.filter(level => planned(level.id) || floored(level.id))
          .sort((a, b) => (b.elev || 0) - (a.elev || 0));
        const report = A.computeAreas({
          levels: onSheet.map(level => ({ id: level.id, name: level.name || `LEVEL ${level.id}` })),
          floors: pts(drawing.floors).filter(f => f && Array.isArray(f.points))
            .map(f => ({ id: f.id, levelId: f.levelId, points: f.points, garage: f.garage === true })),
          openings: pts(drawing.surfaceOpenings)
            .filter(o => o && o.hostType === 'floor' && Array.isArray(o.points))
            .map(o => ({ hostId: o.hostId, points: o.points })),
          outlines: pts(drawing.outlines).filter(o => o && Array.isArray(o.points))
            .map(o => ({ levelId: o.levelId, points: o.points })),
          roomTags: [],
          basementLevelId: null,
        });
        const elevOf = id => (onSheet.find(level => level.id === id)?.elev || 0);
        const above = report.levels.filter(row => elevOf(row.levelId) >= 0);
        const below = report.levels.filter(row => elevOf(row.levelId) < 0);
        const measured = above.filter(row => row.netSqFt !== null);
        // SECONDARY SUITES: a SHAPE the drafter outlined and ticked, measured
        // and listed under the floor it is drawn on (Movie, 1 Oct: "the suite
        // will have its own AREA marker like MAIN FL, 2ND FL, FOUNDATION ...
        // on which floor the suite is on they will have 2 area markers"). The
        // floor's own figure is left as it is -- the suite is inside it.
        const suitesOn = levelId => pts(drawing.shapes)
          .filter(sh => sh && sh.suite === true && sh.levelId === levelId
            && Array.isArray(sh.points) && sh.points.length >= 3)
          .map(sh => Math.abs(A.polygonArea(sh.points)));
        return {
          above, below, suitesOn,
          houseSqFt: measured.length ? measured.reduce((sum, row) => sum + row.netSqFt, 0) : null,
        };
      };
      const sqft = n => (n === null || n === undefined
        ? 'NO FLOOR DRAWN' : `${Math.round(n).toLocaleString('en-US')} SQ FT`);

      const drawAreas = (ctx, box) => {
        const report = areaReport();
        const rows = [];
        if (report) {
          const level = row => {
            const name = row.name.toUpperCase();
            rows.push([name, sqft(row.netSqFt)]);
            report.suitesOn(row.levelId)
              .forEach(area => rows.push([`  SUITE (${name})`, sqft(area)]));
          };
          report.above.forEach(level);
          rows.push(['TOTAL HOUSE', sqft(report.houseSqFt), true]);
          report.below.forEach(level);
        }
        const lineH = 18;
        const left = box.x + 14, right = box.x + box.w - 14;
        let y = box.y + 22;
        ctx.fillStyle = '#1d1f20';
        ctx.textBaseline = 'alphabetic';
        rows.forEach(([name, value, total]) => {
          // 600 for both, larger for the total: the page loads Barlow
          // Condensed at 600, and a 700 fell back to another face entirely.
          ctx.font = `600 ${total ? 15 : 13}px "Barlow Condensed", system-ui, sans-serif`;
          if (total) {
            ctx.strokeStyle = '#1d1f20';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(left, y - 13);
            ctx.lineTo(right, y - 13);
            ctx.stroke();
          }
          ctx.textAlign = 'left';
          ctx.fillText(name, left, y);
          ctx.textAlign = 'right';
          ctx.fillText(value, right, y);
          y += lineH + (total ? 6 : 0);
        });
        // What the page drew, for the spec: the rows as text, nothing parsed back.
        window.__rpAreas = rows.map(([name, value]) => `${name} ${value}`);
      };

      // ONE PLAN INTO ONE BOX, at whatever scale makes it fit. A listing plan
      // is not drawn to a named scale -- nobody measures off it -- so the fit
      // is the box's and the scale bar a construction sheet carries is absent
      // on purpose rather than forgotten.
      const drawSeat = (ctx, seat, box) => {
        const skin = window.__rpSkin;
        ctx.save();
        ctx.strokeStyle = skin['edge-panel'];
        ctx.lineWidth = 1;
        ctx.setLineDash([3, 3]);
        ctx.strokeRect(box.x + 0.5, box.y + 0.5, box.w, box.h);
        ctx.setLineDash([]);
        ctx.fillStyle = skin['ink-quiet'];
        ctx.font = '600 11px "Barlow Condensed", system-ui, sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
        ctx.fillText(seat.label.toUpperCase(), box.x + 4, box.y + box.h - 5);

        if (seat.kind === 'areas') {
          drawAreas(ctx, box);
          ctx.restore();
          return;
        }
        if (seat.kind !== 'plan') {
          ctx.fillStyle = skin['ink-quiet'];
          ctx.textAlign = 'center';
          ctx.fillText('3D VIEW — once available', box.x + box.w / 2, box.y + box.h / 2);
          ctx.restore();
          return;
        }

        // FRAMED OVER WHAT IS DRAWN, NOT OVER THE WALLS. This asked
        // `wallBounds` until now, and every dimension string on the sheet paid
        // for it: the strings stand 3 to 4.5 ft OUTSIDE the walls they measure,
        // the box below clips to its own rectangle, and what falls outside a
        // clip on paper is not one pan away -- it is gone. On Movie's own
        // drawing that silently cut nineteen of them, including both overalls,
        // off the top and bottom of every plan.
        //
        // `planBounds` is the answer layout-plan.js already wrote for exactly
        // this, and LAYOUT.html and the neighborhood page have both read it
        // since 21 Sep: walls with their thickness, plus lines, floors, roofs,
        // outlines AND dimensions, measured rather than allowed for. This page
        // was the last caller left on the old one.
        //
        // NOT A PAD BUMP, which is the tempting one-liner and is wrong twice:
        // a constant would have to be the worst case for every drawing and
        // would then be too roomy for all the rest, and it would shrink the
        // plan on drawings whose strings already fit. LAYOUT.html's
        // VIEW_ALLOWANCE_FT carries that argument in full and keeps its
        // `dimensions: 0` for the same reason.
        const bounds = LP.planBounds(drawing, seat.id);
        if (!bounds) { ctx.restore(); return; }
        // AND THE HALF OF IT NO BOUNDS IN MODEL FEET CAN REACH. `planBounds`
        // frames the dimension RECORDS, which is everything it can honestly
        // do, and it is still not where the string is drawn:
        // render-2d.js's drawDimension2D stands its line off the two recorded
        // points by a CONSTANT NINETEEN SCREEN PIXELS and centres the label on
        // that line. A screen-space stand-off does not shrink with the scale,
        // so no amount of fitting in feet accounts for it -- it is the same
        // 19px on a cottage and on a whole subdivision, and it is why the top
        // row of strings was still cut after the bounds were fixed.
        //
        // So it is reserved where it lives, in PIXELS, on top of the pad.
        // 19 is the painter's own offset and 7 is half an 11px label plus its
        // backing box. If either number in render-2d.js ever moves, the strings
        // start clipping again -- which is precisely what
        // realestateplan-listing.spec.js measured, so the drift failed a test
        // rather than reaching a sheet.
        const STANDOFF_PX = 19;
        const LABEL_HALF_PX = 7;
        // ONLY WHERE THERE ARE STRINGS TO CLEAR. A plan with no dimensions on
        // it would otherwise be drawn 26px smaller in every direction to leave
        // room for nothing.
        // AND THERE ARE NONE ON A LISTING (Movie, 1 Oct: "on REAL ESTATE
        // LAYOUTS we should NOT show the dimensions at all"), so no room is
        // kept for strings that are not drawn.
        const dimensioned = false;
        const pad = 14 + (dimensioned ? STANDOFF_PX + LABEL_HALF_PX : 0);
        const spanX = Math.max(1, bounds.maxX - bounds.minX);
        const spanZ = Math.max(1, bounds.maxZ - bounds.minZ);
        const scale = Math.min((box.w - pad * 2) / spanX, (box.h - pad * 2 - 14) / spanZ);
        const ox = box.x + (box.w - spanX * scale) / 2 - bounds.minX * scale;
        const oy = box.y + (box.h - 14 - spanZ * scale) / 2 - bounds.minZ * scale;
        const toS = pt => ({ x: ox + pt.x * scale, y: oy + pt.z * scale });
        ctx.save();
        ctx.beginPath();
        ctx.rect(box.x, box.y, box.w, box.h);
        ctx.clip();
        // THE SAME PLAN CONSTRUCTION LAYOUT DRAWS, which is where Movie asked
        // this page to start: "similar to the CONSTRUCTION layout but we will
        // present the drawings in a different way".
        //
        // AND NOT `shell: true`, though a listing plan wants no dimension
        // strings over it. That flag is all-or-nothing in layout-plan -- it
        // drops the stairs, the fixtures and the structure with the dimensions
        // and the notes -- and a real-estate plan is the one plan that most
        // wants the fixtures, because a buyer reads rooms by what is in them.
        // Splitting it into a finer gate is a change to a module LAYOUT and
        // the neighborhood page both draw through, so it waits on him saying
        // which of the two halves he wants gone.
        LP.drawPlan(ctx, toS, drawing, seat.id, {
          view: 'plan',
          paperColor: '#ffffff',
          // THE LISTING PLAN: no dimensions, no size tags, solid walls, and
          // each room tag with its size line. Stairs and fixtures stay.
          listing: true,
        });
        ctx.restore();
        ctx.restore();
      };

      const paintSheet = () => {
        const cv = document.getElementById('sheet');
        fitCanvas(cv);
        const ctx = cv.getContext('2d');
        const skin = window.__rpSkin;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, cv.width, cv.height);

        const pad = 20;
        const pxPerIn = Math.min((cv.width - pad * 2) / paper.w,
          (cv.height - pad * 2) / paper.h);
        const w = paper.w * pxPerIn, h = paper.h * pxPerIn;
        const x = Math.round((cv.width - w) / 2), y = Math.round((cv.height - h) / 2);

        // THE PAPER IS WHITE IN EVERY SKIN. It is paper.
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(x, y, w, h);
        ctx.strokeStyle = skin['edge-panel'];
        ctx.lineWidth = 1;
        ctx.strokeRect(x + 0.5, y + 0.5, w, h);

        const m = MARGIN_IN * pxPerIn;
        const inner = { x: x + m, y: y + m, w: w - m * 2, h: h - m * 2 };
        ctx.save();
        ctx.setLineDash([4, 4]);
        ctx.strokeStyle = skin['edge-panel'];
        ctx.strokeRect(inner.x + 0.5, inner.y + 0.5, inner.w, inner.h);
        ctx.restore();

        if (!drawing) {
          ctx.fillStyle = skin['ink-quiet'];
          ctx.font = '600 12px "Barlow Condensed", system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('No drawing in browser storage — draw a house in the Model Space first.',
            x + w / 2, y + h / 2);
          return;
        }

        const showing = seats.filter(seat => seat.on);
        if (!showing.length) {
          ctx.fillStyle = skin['ink-quiet'];
          ctx.font = '600 12px "Barlow Condensed", system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('Nothing ticked — pick what goes on the sheet.',
            x + w / 2, y + h / 2);
          return;
        }
        boxesFor(showing.length, inner.x, inner.y, inner.w, inner.h)
          .forEach((box, i) => drawSeat(ctx, showing[i], box));
      };

      // ── BOOT ──────────────────────────────────────────────────────────
      const paperSel = document.getElementById('paper');
      PAPERS.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = p.label;
        paperSel.appendChild(opt);
      });
      paperSel.value = paper.id;
      paperSel.addEventListener('change', () => {
        paper = PAPERS.find(p => p.id === paperSel.value) || PAPERS[0];
        paintSheet();
        say(`${paper.label}.`);
      });

      document.getElementById('note').textContent =
        'Drawn the way Construction Layout draws a plan, for now \u2014 say how you '
        + 'want it presented and this is the page it changes on.';

      const raw = await load();
      if (!raw) {
        say('No drawing in browser storage — draw a house in the Model Space first.');
        paintSeats();
        paintSheet();
      } else {
        levels = FORMAT.levels(raw.levels);
        drawing = {
          ...raw,
          walls: FORMAT.walls(raw.walls, new Set(levels.map(l => l.id)), {
            wallTypes: WT.WALL_TYPES,
            legacyWallTypes: WT.LEGACY_WALL_TYPES,
            finishIds: WT.EXTERIOR_FINISHES.map(f => f.id),
            legacyFinishes: WT.LEGACY_FINISH_IDS,
            finishAnchors: WT.FINISH_ANCHORS,
            defaultWallTopFt: 8,
          }),
        };
        buildSeats();
        paintSeats();
        paintSheet();
        say(seats.length > 1
          ? 'Tick what goes on the sheet.'
          : 'This drawing has no plans to lay out yet.');
      }

      window.addEventListener('resize', () => paintSheet());

      window.DraftShellBars.wireSkin({
        theme: window.__rpTheme.theme,
        mode: window.__rpTheme.mode,
        onSkin: skin => { window.__rpSkin = skin; paintSheet(); },
      });
    })();
  </script>
  <script src="./traffic-counter.js" defer></script>
</body>
</html>
