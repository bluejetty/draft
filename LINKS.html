<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Favourite Links · Rough Drafter</title>
    <meta name="description" content="Rough Drafter's favourite links: the converters, tools and sites we use alongside it." />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="vendor/fonts.css" />
    <!-- INTERNET LINKS (Movie, 19 Oct): "put a link to useful other programs
         on my entry page maybe in the REFERENCE side, put INTERNET LINKS --
         as a link that will go into a new page with basically ROUGHDRAFTER
         Favorite links". The list is links-catalog.js; this page is the codes
         page's skin with the span table left out, so the two reference pages
         read as one set. -->
    <style>
      :root {
        --ink: #163653;
        --muted: rgba(22, 54, 83, 0.68);
        --line: rgba(22, 54, 83, 0.2);
        --paper: #eef5fb;
        --card: rgba(255, 255, 255, 0.82);
        --blue-medium: #3675a7;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        color: var(--ink);
        background:
          linear-gradient(rgba(22, 54, 83, 0.16) 1px, transparent 1px),
          linear-gradient(90deg, rgba(22, 54, 83, 0.16) 1px, transparent 1px),
          linear-gradient(rgba(22, 54, 83, 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(22, 54, 83, 0.07) 1px, transparent 1px),
          var(--paper);
        background-size: 160px 160px, 160px 160px, 16px 16px, 16px 16px;
        font-family: "Barlow", system-ui, sans-serif;
        font-size: 15px;
        line-height: 1.5;
      }
      .shell { width: min(960px, calc(100% - 32px)); margin: 0 auto; padding: 24px 0 48px; }
      header { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
      header a { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; }
      header img { width: 56px; height: 56px; }
      h1, h2, h3, .tag { font-family: "Barlow Condensed", system-ui, sans-serif; letter-spacing: 0.05em; text-transform: uppercase; }
      h1 { margin: 0; font-size: 26px; line-height: 1.1; }
      h2 { margin: 0 0 6px; font-size: 20px; }
      h3 { margin: 18px 0 6px; font-size: 16px; }
      section { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; margin-bottom: 18px; }
      p { margin: 6px 0; }
      .muted { color: var(--muted); font-size: 13px; }
      ul.catalog { list-style: none; margin: 8px 0 0; padding: 0; }
      ul.catalog li { padding: 9px 0; border-top: 1px solid var(--line); }
      ul.catalog li:first-child { border-top: 0; }
      ul.catalog a { color: var(--blue-medium); font-weight: 600; }
      .tag { display: inline-block; margin-right: 6px; padding: 0 6px; border: 1px solid var(--line); border-radius: 4px; font-size: 12px; color: var(--muted); }
      .empty { color: var(--muted); font-style: italic; }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <a href="./" aria-label="Rough Drafter home">
          <img src="assets/rough-drafter-logo.png" alt="" width="56" height="56" />
          <h1>Rough Drafter Favourite Links</h1>
        </a>
      </header>

      <section aria-labelledby="links-title">
        <h2 id="links-title">Useful programs and sites</h2>
        <p class="muted">The converters, tools and sites we use alongside Rough Drafter. Each opens in a new tab.</p>
        <div data-links></div>
      </section>

    </div>

    <script src="./links-catalog.js"></script>
    <script>
      (() => {
        // ── THE LIST, off links-catalog.js, grouped under its headings ────
        const host = document.querySelector('[data-links]');
        const entries = Array.isArray(window.DraftLinksCatalog) ? window.DraftLinksCatalog : [];
        const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        if (!entries.length) {
          host.innerHTML = '<p class="empty">No links yet.</p>';
          return;
        }
        const groups = new Map();
        entries.forEach(e => {
          const g = e.group || 'Other';
          if (!groups.has(g)) groups.set(g, []);
          groups.get(g).push(e);
        });
        host.innerHTML = [...groups].map(([group, list]) => `<h3>${esc(group)}</h3><ul class="catalog">${
          list.map(e => `<li>${e.kind ? `<span class="tag">${esc(e.kind)}</span>` : ''}<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a>${
            e.note ? `<div class="muted">${esc(e.note)}</div>` : ''}</li>`).join('')}</ul>`).join('');
      })();
    </script>
    <script src="./traffic-counter.js" defer></script>
  </body>
</html>
