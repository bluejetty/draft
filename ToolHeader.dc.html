<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./vendor/react-18.3.1.production.min.js"></script>
<script src="./vendor/react-dom-18.3.1.production.min.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex; align-items:center; gap:14px; margin-bottom:0; padding:0;">
  <img src="{{ selfAssetSrc }}" title="{{ selfTitle }}" style="width:100px; height:100px; object-fit:contain; display:block; border-radius:12px; border:1.5px solid rgba(29,31,32,0.18); box-shadow:0 3px 6px rgba(29,31,32,0.18), 0 1px 3px rgba(29,31,32,0.12); background:#fff;" />
  <sc-if value="{{ hasSecondary }}" hint-placeholder-val="{{ false }}">
    <button onClick="{{ onClearSecondary }}" title="{{ clearSecondaryTitle }}" style="border:none; background:none; padding:0; margin:0; cursor:pointer; display:flex; align-items:center; justify-content:center; font-family:'Barlow Condensed',system-ui,sans-serif; font-weight:600; font-size:18px; color:#5980a6; text-transform:uppercase; white-space:nowrap; line-height:1;" style-hover="color:#416180;">{{ clearSecondaryLabel }}</button>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;activeTool&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;PDF-MARKUP&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onClear&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;clearLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;CLICK TO CLEAR DROP-BOX&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onClearSecondary&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(() =&gt; void) | undefined&quot;},&quot;clearSecondaryLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;clearSecondaryTitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const TOOLS = [
  { key: 'PDF-MARKUP', name: 'PDF-MARKUP', file: './PDF-MARKUP.dc.html', asset: 'PDF-MARKUP' },
];

class Component extends DCLogic {
  renderVals() {
    const activeKey = this.props.activeTool || 'PDF-MARKUP';
    const self = TOOLS.find((t) => t.key === activeKey) || TOOLS[0];
    return {
      selfAssetSrc: `./assets/${self.asset}.png`,
      selfTitle: self.name,
      hasSecondary: !!this.props.onClearSecondary,
      onClear: this.props.onClear,
      clearLabel: this.props.clearLabel,
      onClearSecondary: this.props.onClearSecondary,
      clearSecondaryLabel: this.props.clearSecondaryLabel,
      clearSecondaryTitle: this.props.clearSecondaryTitle,
    };
  }
}
</script>
</body>
</html>
