<!DOCTYPE html>
<html>
<head>

<title>Rough Drafter &mdash; Boneyard</title>
<link rel="stylesheet" href="vendor/fonts.css" />
<!-- THE BONEYARD / WIREFRAME PAGE (Movie, 1 Oct): the house's bones as an
     isometric 3D wireframe on the left -- one loop per floor and one for the
     roof (2 Oct: "only 1 loops per floor and one for the roof which will be
     at highest floor ceiling") -- and the chosen level, flat, on the right.

     PR 2 OF 4 EDITS THEM ON THE RIGHT (boneyard-edit.js): pick an edge, push
     it in whole feet, BREAK it on a foot mark, and the house follows. Drawing
     a new outline here, the drive-thru on an empty boneyard, and the shelves
     come in the PRs after this one. -->
<link rel="stylesheet" href="./shell-bars.css" />
<script src="./palette.js"></script>
<!-- ALL IN THE HEAD, as on EXT. FINISH: the bars are written where their
     mount call stands. The heights come from cut-view's sectionLevelStack --
     the table every elevation stands its floors on -- so this page loads what
     that function's env asks for. -->

<script>
  // THE SKIN IS ONE CHOICE ACROSS THE APP: the same `draft-skin` key MODEL
  // writes, read synchronously so the page has its colours on the first frame.
  (() => {
    const P = window.DraftPalette;
    const params = new URLSearchParams(location.search);
    const stored = (() => {
      try { return JSON.parse(localStorage.getItem('draft-skin') || 'null') || {}; }
      catch { return {}; }
    })();
    const theme = params.get('theme') || stored.theme || 'ruff';
    const mode = params.get('mode') || stored.skinMode || 'night';
    window.__byTheme = { theme, mode };
    window.__bySkin = P.apply(document, theme, mode);
  })();
</script>
<style>
  :root { --sheet-edge: 1px solid var(--edge-panel); }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--surface-page); color: var(--ink-primary);
    font-family: 'Barlow Condensed', system-ui, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
    padding-top: var(--strip-h);
    padding-bottom: calc(var(--house-h) + var(--browser-lane));
  }
  main { flex: 1; display: flex; min-height: 0; gap: 10px; padding: 10px; }
  .pane {
    flex: 1; min-width: 0; display: flex; flex-direction: column;
    border: var(--sheet-edge); background: var(--surface-chip);
  }
  .pane-head {
    flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 10px;
    border-bottom: var(--sheet-edge); background: var(--surface-panel);
    font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
  }
  .pane-head .title { color: var(--accent-mark); font-weight: 600; flex: 1; }
  .pane canvas { flex: 1; min-height: 0; width: 100%; display: block; }
  /* THE 3D GIVES UP THE ROOM (Movie, 16 Oct: "the 3D Model area can get
     smaller and the 3D model smaller as well to alllow for the extra space
     needed"). It is the pane that can afford it: the right one is where the
     editing happens and every foot of it is worked in, while the left is a
     picture of what the editing did. The model inside follows on its own --
     the 3D fits itself to its box, so a narrower box IS a smaller model. */
  .pane-3d { flex: 0 1 38%; }
  canvas#bones3d { cursor: grab; touch-action: none; }
  /* THE LEVELS STAND BETWEEN THE PANES, top-aligned so the first one is
     level with both heads, and no wider than the longest name needs. */
  .levels-rail { flex: none; display: flex; align-items: flex-start; }
  .levels-rail .legend { flex-direction: column; align-items: stretch;
    gap: 4px; flex-wrap: nowrap; }
  .levels-rail .legend button { justify-content: flex-start; white-space: nowrap; }
  /* A LEVEL AND ITS BG, side by side: the name takes the room and BG takes
     what it needs, so the stack keeps one left edge and one right one. */
  .level-row { display: flex; align-items: stretch; gap: 4px; }
  .level-row > button:first-child { flex: 1; min-width: 0; }
  .legend button.bg {
    flex: none; font-size: 10px; letter-spacing: .08em; padding: 2px 5px;
    color: var(--ink-quiet); justify-content: center;
  }
  .legend button.bg:disabled { opacity: .3; cursor: default; }
  .btn {
    appearance: none; border: 1px solid var(--edge-panel); background: var(--surface-chip);
    color: var(--ink-primary); font: inherit; font-size: 12px; letter-spacing: .07em;
    padding: 3px 10px; cursor: pointer;
  }
  .btn:hover { border-color: var(--accent-mark); color: var(--accent-mark); }
  #angle, #tilt { min-width: 36px; text-align: center; font-family: 'DM Mono', ui-monospace, monospace; }
  .turns { display: flex; flex-direction: column; gap: 3px; }
  .turn-row { display: flex; align-items: center; gap: 8px; }
  .turn-row .btn { padding: 1px 10px; }
  .legend { display: flex; gap: 6px; flex-wrap: wrap; }
  .legend button {
    appearance: none; border: 1px solid var(--edge-panel); background: var(--surface-chip);
    color: var(--ink-primary); font: inherit; font-size: 11px; letter-spacing: .06em;
    padding: 2px 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
  }
  .legend button[aria-pressed="true"] { border-color: var(--accent-mark); color: var(--accent-mark); }
  .legend .swatch { width: 10px; height: 10px; display: inline-block; }
  .btn[aria-pressed="true"] { border-color: var(--accent-mark); color: var(--accent-mark); }
  .btn:disabled { opacity: .45; cursor: default; }
  canvas#bones2d { touch-action: none; }
  #to-drivethru { flex: none; align-self: center; margin: 0 0 8px; }
  #to-drivethru[hidden] { display: none; }
  #status { flex: none; padding: 4px 12px; font-size: 11px; color: var(--ink-quiet); min-height: 20px; }
</style>

<body>
  <script>window.DraftShellBars.topBar({ instruments: true });</script>
  <main>
    <!-- LEFT: THE BONES IN 3D. Isometric; it turns in 15-degree steps, one
         still frame per step and nothing in between (Movie, 1 Oct: stepped,
         "to save processing"). A tap on a loop picks that level for the right. -->
    <section class="pane pane-3d" aria-label="The bones in 3D">
      <div class="pane-head">
        <span class="title">BONES &mdash; 3D</span>
        <!-- TWO ROWS, THE TILT OVER THE TURN (Movie, 16 Oct: "put in up and
             down arrows over the rotation and 15 degree iterations in those
             directions too"). Up raises the eye toward a plan, down lowers it
             toward an elevation; the readout between them is the tilt. -->
        <span class="turns">
          <span class="turn-row">
            <button type="button" class="btn" id="tip-down" title="Tip down 15°, toward an elevation">&#9660;</button>
            <span id="tilt">35°</span>
            <button type="button" class="btn" id="tip-up" title="Tip up 15°, toward a plan">&#9650;</button>
          </span>
          <span class="turn-row">
            <button type="button" class="btn" id="turn-left" title="Turn 15° left">&#9664;</button>
            <span id="angle">45°</span>
            <button type="button" class="btn" id="turn-right" title="Turn 15° right">&#9654;</button>
          </span>
        </span>
      </div>
      <canvas id="bones3d"></canvas>
    </section>
    <!-- BETWEEN THE TWO: THE LEVELS, STACKED (Movie, 16 Oct). "can we
         decrease the 3D model side on the left and squeeze in between the 2
         windows the LEVELS (take them off the upper right area and move
         those so they are stacked between the 2 windows) the 3D Model area
         can get smaller and the 3D model smaller as well to alllow for the
         extra space needed".

         A COLUMN, NOT A ROW IN A HEAD. They sat in the right pane's head,
         sharing it with the title and two verbs, where a fourth level
         squeezed everything else; standing between the panes they are what
         they are -- the thing both windows are showing -- and each is beside
         the stack it names. -->
    <div class="levels-rail" aria-label="Levels">
      <div class="legend" id="legend"></div>
    </div>
    <!-- RIGHT: THE CHOSEN LEVEL, FLAT, AND WHERE IT IS EDITED. Tap an edge,
         then drag it or use the arrow keys: whole feet, square to itself.
         BREAK puts a corner on a foot mark so part of an edge moves alone.
         "The 3D is never edited directly" -- it mirrors what happens here. -->
    <section class="pane" aria-label="The chosen level">
      <div class="pane-head">
        <span class="title" id="level-title">LEVEL</span>
        <button type="button" class="btn" id="break" aria-pressed="false"
          title="Put a corner on an edge at a foot mark (B)">BREAK</button>
        <button type="button" class="btn" id="undo" title="Undo the last change (Ctrl+Z)" disabled>UNDO</button>
      </div>
      <canvas id="bones2d"></canvas>
    </section>
  </main>
  <div id="status" role="status"></div>
  <button type="button" class="btn" id="to-drivethru" hidden
    title="Nothing here yet: pick a house at the drive-thru, built or drawn"
    >PICK A HOUSE AT THE DRIVE-THRU</button>
  <script>window.DraftShellBars.bottomBar({ page: 'boneyard', bone: false });</script>

  <script>
    (async () => {
      const BL = window.DraftBoneyardLoops;
      const BE = window.DraftBoneyardEdit;
      const FORMAT = window.DraftDrawingFormat;
      const FMT = window.DraftFormatters;
      const S = window.SharedFileStore;
      const BUCKET = 'model-drawing';
      // THE SAME LEASE MODEL HOLDS: one page edits the drawing at a time, and
      // this page and MODEL in the same tab are the same holder.
      const LEASE_SCOPE = 'model';
      const c3 = document.getElementById('bones3d');
      const c2 = document.getElementById('bones2d');
      const statusEl = document.getElementById('status');
      const breakBtn = document.getElementById('break');
      const undoBtn = document.getElementById('undo');
      const say = text => { statusEl.textContent = text; };
      const DRIVE_THRU = './MODEL.html?from=boneyard';
      const toDriveThru = document.getElementById('to-drivethru');
      toDriveThru.addEventListener('click', () => location.assign(DRIVE_THRU));
      const cameFromTheApp = () => {
        try {
          const from = new URL(document.referrer);
          return from.origin === location.origin && !/BONEYARD\.html$/i.test(from.pathname);
        } catch { return false; }
      };
      const ft = v => (FMT ? FMT.formatArchitecturalInches(Math.abs(v) * 12) : `${Math.abs(v)}'`);
      let skin = window.__bySkin || {};

      let raw = null;
      let rev = null;
      let stack = null;
      let levels = [];
      let angle = 45;
      let tilt = BL.ISO_TILT_DEG;
      let picked = null;
      // THE LEVELS SHOWN BEHIND THE PICKED ONE, by the drafter's choice.
      //
      // Movie, 16 Oct: "in the middle LEVELS area can you add a BG button to
      // each of those and if they press the BG button that LEVEL will show up
      // lightweight in the background (won't be noticed where it overlaps but
      // any parts that aren't aligned will show up in lighter lines (faded
      // lines) BACKGROUND lines".
      //
      // EVERY OTHER LEVEL USED TO BE DRAWN FADED, always. That answers the
      // 4 Oct ask ("show the other BONE lines in faded out ... so i can line
      // up stuff") and then keeps answering it on a four-storey stack where
      // the drafter is lining up two of them and reading four. Asked for is
      // better than always: a level is behind the picked one because he put
      // it there.
      //
      // Keyed by kind AND level id, like every other comparison on this page:
      // a level id alone is not unique across a roof and the floor it stands
      // on. Not persisted -- which levels you are looking THROUGH is a
      // question about the next five minutes, not about the drawing.
      const bg = new Set();
      const keyOf = level => `${level.kind}:${level.levelId}`;
      let laid = { levels: [], scale: 0 };
      // The edge the drafter picked: which loop of the picked level, which edge.
      let selected = null;
      let breaking = false;
      let undo = [];
      let lease = null;
      let preview = null;
      let saves = 0;
      // A push being dragged on the right: where it started and how far.
      let drag = null;

      const load = async () => {
        if (!S) return null;
        let got = null;
        try { got = await S.loadSharedFileAt(BUCKET); } catch { got = null; }
        if (!got || !got.file) return null;
        rev = got.rev;
        try {
          const parsed = JSON.parse(await got.file.text());
          return FORMAT.checkEnvelope(parsed).ok ? parsed : null;
        } catch { return null; }
      };

      // The posts a drawing's piles carry, once per drawing: a drag paints
      // many times over one preview.
      const posts = new WeakMap();
      const postsOf = drawing => {
        if (!drawing || !stack || !window.DraftCutView.pilePosts) return [];
        if (!posts.has(drawing)) {
          const env = window.DraftCutViewEnv.buildCutViewEnv(drawing, FORMAT.levels(drawing.levels));
          posts.set(drawing, env ? window.DraftCutView.pilePosts(env, window.DraftCutView.sectionLevelStack(env)) : []);
        }
        return posts.get(drawing);
      };

      const restack = () => {
        const env = window.DraftCutViewEnv.buildCutViewEnv(raw, FORMAT.levels(raw.levels));
        stack = env ? window.DraftCutView.sectionLevelStack(env) : null;
        levels = BL.boneLevels(raw, stack);
        if (picked) {
          picked = levels.find(l => l.kind === picked.kind && l.levelId === picked.levelId) || null;
        }
      };

      const sized = canvas => {
        const dpr = window.devicePixelRatio || 1;
        const w = canvas.clientWidth, h = canvas.clientHeight;
        if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
          canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
        }
        const ctx = canvas.getContext('2d');
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, w, h);
        return { ctx, w, h };
      };

      const strokePolys = (ctx, polys, color, width, dash = []) => {
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.setLineDash(dash);
        polys.forEach(poly => {
          ctx.beginPath();
          poly.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
          ctx.closePath();
          ctx.stroke();
        });
        ctx.setLineDash([]);
      };

      // THE ROOF'S OWN LINES, HAIRLINE: where the overhang ends, and where the
      // planes meet each other. Movie, 16 Oct: "really thin lins like the edge
      // walls also very very thin lines".
      //
      // NOT strokePolys, FOR TWO REASONS. A hip is an OPEN line and that one
      // closes every path it is handed, which would draw a second line back
      // along the first. And the width is the whole point: 0.6 against the
      // 1.6 of the lightest bone, so the roof's own geometry reads as what the
      // roof DOES rather than as another storey in the stack.
      //
      // `to` is what puts a point on the screen -- identity in the 3D window,
      // where layout has already done it, and toScreen in the 2D one.
      const THIN_PX = 0.6;
      const strokeThin = (ctx, lines, color, to) => {
        if (!lines || !lines.length) return;
        ctx.save();
        ctx.strokeStyle = color;
        ctx.lineWidth = THIN_PX;
        lines.forEach(line => {
          const pts = (line.points || []).map(to);
          if (pts.length < 2) return;
          ctx.beginPath();
          pts.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
          if (line.closed) ctx.closePath();
          ctx.stroke();
        });
        ctx.restore();
      };
      const same = p => p;

      // A LOOP WITH ITS OPENINGS (Movie, 3 Oct): the line broken where a door
      // or window is, and a dot at its centre -- a door's colour, a window's.
      // `cut` is boneyard-loops.js's, laid out: runs of line and dots, in
      // screen points; `dy` lifts it (the grow).
      const strokeCut = (ctx, cut, color, width, dy = 0) => {
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.lineCap = 'butt';
        cut.forEach(c => c.runs.forEach(r => {
          ctx.beginPath();
          ctx.moveTo(r.a.x, r.a.y + dy);
          ctx.lineTo(r.b.x, r.b.y + dy);
          ctx.stroke();
        }));
        cut.forEach(c => c.dots.forEach(d => {
          ctx.fillStyle = d.type === 'door' ? BL.COLORS.door : BL.COLORS.window;
          ctx.beginPath(); ctx.arc(d.x, d.y + dy, Math.max(2.5, width + 1), 0, Math.PI * 2); ctx.fill();
        }));
      };
      // The same, for the 2D window: a level's loops in plan feet, to screen.
      const cutOf = (loops, to) => loops.map(loop => {
        const { runs, dots } = BL.runsOf(loop);
        return { runs: runs.map(r => ({ a: to(r.a), b: to(r.b) })),
          dots: dots.map(d => ({ ...to(d.p), type: d.type })) };
      });
      // FOR THE SPECS: every thin line DRAWN, by level and kind, in the points
      // it was drawn at. Published from the same lists the painter strokes and
      // only for the levels it strokes them for, so "the 2D window shows the
      // roof's lines only when the roof is picked or put behind" is a question
      // this answers rather than one it assumes.
      //
      // TWICE OVER IN THE 2D WINDOW, and both earn it: `points` is where the
      // line landed on the canvas, which is what a check on the ink needs,
      // and `ft` is the same line in plan feet, which is what a check against
      // the saved drawing needs -- an eave that is the roof's own outline and
      // a bone that is that outline brought in by the overhang are a claim
      // about the file, not about the window. In the 3D window the points
      // have already been projected and there are no feet left to give.
      const thinAttr = shownLines => JSON.stringify(shownLines.flatMap(({ name, lines, to }) =>
        (lines || []).map(line => {
          const plan = line.points[0] && line.points[0].z !== undefined;
          return { level: name, kind: line.kind,
            points: line.points.map(p => {
              const q = to(p);
              return [Number(q.x.toFixed(1)), Number(q.y.toFixed(1))];
            }),
            ...(plan ? { ft: line.points.map(p =>
              [Number(p.x.toFixed(4)), Number(p.z.toFixed(4))]) } : {}) };
        })));
      // FOR THE SPECS: every opening drawn, by level, with its dot.
      // The stairs standing on a bone level: a floor's or the foundation's
      // (a basement stair stands on it), by level id, in whatever view they
      // were drawn in (this page has no layer views). The roof has none.
      const stairsOn = (level, d) => (level && (level.kind === 'floor' || level.kind === 'foundation')
        ? ((d && d.stairs) || []).filter(stair => Number(stair.levelId) === Number(level.levelId)
          && stair.start && stair.widthFt > 0)
        : []);
      const stairEnvFor = (d, stairs, level) => {
        const LEVELS = window.DraftLevelAssembly, VIEWS = window.DraftLayerViews;
        const SG = window.DraftStairGeometry, F = window.DraftFormatters;
        const stairLevels = {
          floors: VIEWS.floorLevels(d.levels),
          assemblyFor: id => LEVELS.levelAssemblyFor(d.levelAssemblies, id),
          floorFtFor: id => LEVELS.levelFloorFt(LEVELS.levelAssemblyFor(d.levelAssemblies, id)),
          wallTopFtFor: (id, forView) => LEVELS.levelWallTopFt(d.walls, id, forView),
        };
        return {
          layer: { visible: true, printable: true },
          isPrinting: false,
          elev: 0,
          stairs,
          stairColor: skin['draw-stair'] || level.color,
          treadRunIn: SG.STAIR_TREAD_RUN_IN,
          layoutFor: stair => SG.stairCurrentLayout(stair, stairLevels),
          partsFor: (stair, layout) => SG.stairPlanParts(stair, layout),
          formatInchesOnly: F.formatInchesOnly,
        };
      };

      const openingsAttr = lvls => JSON.stringify(lvls.flatMap(l => (l.cut || []).flatMap(c => c.dots
        .map(d => ({ level: l.name, type: d.type, at: [Number(d.x.toFixed(1)), Number(d.y.toFixed(1))] })))));

      // What is on screen: the drawing, or the push being dragged.
      const shown = () => (preview ? preview.levels : levels);
      const shownPicked = () => (picked
        ? shown().find(l => l.kind === picked.kind && l.levelId === picked.levelId) || picked : null);

      // ── THE 3D WINDOW ───────────────────────────────────────────────
      const paint3d = () => {
        const { ctx, w, h } = sized(c3);
        laid = BL.layout(shown(), angle, w, h, 30, tilt);
        if (growStart !== null) { paintGrow(ctx); return; }
        laid.levels.forEach(level => {
          const on = picked && picked.kind === level.kind && picked.levelId === level.levelId;
          strokeCut(ctx, level.cut, level.color, on ? 3 : 1.6);
          // THE ROOF'S OWN LINES ARE ALWAYS IN THE 3D -- "show the roof
          // outline in 3d" (Movie, 16 Oct), with no BG button needed. The
          // left window is the whole building at once; it is the right one
          // that shows a level at a time and so has to be asked.
          strokeThin(ctx, level.thinPolys, level.color, same);
        });
        // THE POSTS (Movie, 4 Oct: "show me the veritical stick"): a pile out
        // in the open carries a post up to what it holds -- cut-view.js's
        // pilePosts, the same answer the elevations draw -- stood here as a
        // stick from the top of the concrete to that floor or roof, in that
        // bone's colour.
        const sticks = laid.at ? postsOf(preview ? preview.drawing : raw) : [];
        ctx.lineWidth = 1.6;
        sticks.forEach(post => {
          const a = laid.at(post.point, post.foot), b = laid.at(post.point, post.top);
          const held = post.carries === 'roof' ? null
            : laid.levels.find(l => l.kind !== 'roof' && Number(l.levelId) === Number(post.levelId));
          ctx.strokeStyle = held ? held.color : BL.COLORS.roof;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        });
        c3.setAttribute('data-posts', JSON.stringify(sticks.map(post => ({
          x: post.point.x, z: post.point.z, foot: Number(post.foot.toFixed(4)),
          top: Number(post.top.toFixed(4)), carries: post.carries }))));
        c3.setAttribute('data-openings', openingsAttr(laid.levels));
        c3.setAttribute('data-thin', thinAttr(laid.levels.map(l =>
          ({ name: l.name, lines: l.thinPolys, to: same }))));
        document.getElementById('angle').textContent = `${angle}°`;
        c3.setAttribute('data-angle', String(angle));
        document.getElementById('tilt').textContent = `${Math.round(tilt)}°`;
        c3.setAttribute('data-tilt', String(Math.round(tilt * 100) / 100));
        // Dead at the ends of the ladder, the way a BG button is dead with
        // nothing to show: an arrow that does nothing is a lie.
        document.getElementById('tip-up').disabled = tilt >= 90;
        document.getElementById('tip-down').disabled = tilt <= 0;
        // FOR THE SPECS: what is drawn, and where each level's first corner landed.
        c3.setAttribute('data-bones', JSON.stringify(laid.levels.map(l => ({
          name: l.name, kind: l.kind, elev: Number(l.elev.toFixed(4)), loops: l.loops.length,
          color: l.color, at: l.polys[0] && l.polys[0][0]
            ? [Number(l.polys[0][0].x.toFixed(1)), Number(l.polys[0][0].y.toFixed(1))] : null,
        }))));
      };

      // ── THE GROW: MODEL SENT A FRESH BUILD HERE TO BE SHOWN ─────────
      //
      // Movie, 3 Oct: "show the 3d ISO bone grow first and then flip to model
      // space and show the front elevation grow". MODEL saves the build and
      // comes here with `grow=1`; the bones rise level by level in this
      // window, bottom first (boneyard-loops.js decides where each one is),
      // and then the page goes back to MODEL with `reveal=1`, which plays the
      // E1 grow. A tap or a key skips straight to that.
      //
      // Each level is drawn where it has risen to, with a riser from each of
      // its corners down to the level it is coming off -- the studs going up.
      // The scale is the finished stack's, so nothing shifts as levels land.
      const query = new URLSearchParams(location.search);
      const growing = query.get('grow') === '1';
      let growStart = null;
      let leaving = false;
      // Only back to MODEL, and only with a query string: `back` comes in the
      // URL, so anything else in it is ignored rather than followed.
      const backTo = () => {
        const asked = query.get('back') || '';
        const back = new URLSearchParams(/^\?[^#]*$/.test(asked) ? asked.slice(1) : '');
        back.set('reveal', '1');
        return `./MODEL.html?${back.toString()}`;
      };
      const leave = () => {
        if (leaving) return;
        leaving = true;
        document.body.dataset.boneyardGrow = 'done';
        location.assign(backTo());
      };
      const paintGrow = ctx => {
        const ms = performance.now() - growStart;
        const stage = BL.growStage(laid.levels, ms);
        const lift = laid.lift;
        laid.levels.forEach((level, i) => {
          const st = stage[i];
          if (!st.shown) return;
          const dy = (level.elev - st.h) * lift;
          const dyBase = (level.elev - st.base) * lift;
          ctx.globalAlpha = 0.45;
          ctx.strokeStyle = level.color;
          ctx.lineWidth = 1;
          level.polys.forEach(poly => poly.forEach(p => {
            ctx.beginPath();
            ctx.moveTo(p.x, p.y + dyBase);
            ctx.lineTo(p.x, p.y + dy);
            ctx.stroke();
          }));
          ctx.globalAlpha = 1;
          strokeCut(ctx, level.cut, level.color, st.done ? 1.6 : 2.4, dy);
        });
        c3.setAttribute('data-grow', JSON.stringify(stage.map(st => (st.shown ? Number(st.h.toFixed(2)) : null))));
        if (ms < BL.growMs(laid.levels) + GROW_HOLD_MS) requestAnimationFrame(paint3d);
        else leave();
      };
      // The finished bones stay up for a beat before the page moves on.
      const GROW_HOLD_MS = 900;
      const skipGrow = () => { if (growStart !== null) leave(); };

      // ── THE 2D WINDOW: THE CHOSEN LEVEL, FLAT ───────────────────────
      //
      // THE FRAME IS THE WHOLE BUILDING'S, so a level keeps its place when
      // another is picked and an edit does not slide the plan under the
      // finger. It is fixed for the length of a drag.
      let frame = null;
      // THE EAVE IS PART OF THE EXTENT, whether or not the ROOF is the level
      // showing: the frame is the whole building's, and a frame that changed
      // shape when a roof was picked would slide the plan under the finger --
      // which is the thing this frame exists to stop.
      const framePoints = l => [...l.loops.flatMap(loop => loop.points),
        ...(l.thin || []).flatMap(line => line.points)];
      const frameFor = (w, h) => {
        const pts = levels.flatMap(framePoints);
        if (!pts.length) return null;
        const xs = pts.map(p => p.x), zs = pts.map(p => p.z);
        const pad = 6;
        const minX = Math.min(...xs) - pad, maxX = Math.max(...xs) + pad;
        const minZ = Math.min(...zs) - pad, maxZ = Math.max(...zs) + pad;
        const m = 20;
        const s = Math.min((w - 2 * m) / Math.max(maxX - minX, 1), (h - 2 * m) / Math.max(maxZ - minZ, 1));
        return { s, ox: (w - (maxX - minX) * s) / 2 - minX * s, oy: (h - (maxZ - minZ) * s) / 2 - minZ * s };
      };
      const toScreen = p => ({ x: frame.ox + p.x * frame.s, y: frame.oy + p.z * frame.s });
      const fits = (w, h) => levels.every(l => framePoints(l).every(pt => {
        const p = toScreen(pt);
        return p.x >= 4 && p.x <= w - 4 && p.y >= 4 && p.y <= h - 4;
      }));
      const toWorld = (x, y) => ({ x: (x - frame.ox) / frame.s, z: (y - frame.oy) / frame.s });

      // The level under the picked one, drawn faint: what an overhang hangs past.
      const under = level => {
        const order = shown().filter(l => l.kind === 'foundation' || l.kind === 'floor')
          .sort((a, b) => a.elev - b.elev);
        if (level.kind === 'roof') return shown().find(l => l.kind === 'floor' && l.levelId === level.sourceLevelId);
        const at = order.findIndex(l => l.kind === level.kind && l.levelId === level.levelId);
        return at > 0 ? order[at - 1] : null;
      };

      const paint2d = () => {
        const { ctx, w, h } = sized(c2);
        const level = shownPicked();
        document.getElementById('level-title').textContent = level ? level.name : 'LEVEL';
        c2.setAttribute('data-level', level ? level.name : '');
        c2.setAttribute('data-openings', '[]');
        c2.setAttribute('data-thin', '[]');
        const thinDrawn = [];
        // Refitted only when something has gone off the window.
        if (!frame || (!drag && !fits(w, h))) frame = frameFor(w, h);
        if (!level || !frame) return;
        const below = under(level);
        // THE BONES THE DRAFTER PUT BEHIND THIS ONE, faded, for lining one
        // floor up on another. Movie, 4 Oct: "could we show the other 'BONE
        // lines in faded out or something so i can line up stuff if i need to
        // floor to floor, and when they select one, bring it to top and
        // increase thickness and opacity of that one" -- and 16 Oct, which
        // made it a choice rather than all of them: "won't be noticed where it
        // overlaps but any parts that aren't aligned will show up in lighter
        // lines".
        //
        // Each in its own colour, thin and see-through, under everything; the
        // level under the picked one keeps its grey dashes (what an overhang
        // hangs past) rather than drawing twice.
        const faded = shown().filter(l => l !== level && l !== below
          && !(l.kind === level.kind && l.levelId === level.levelId)
          && bg.has(keyOf(l)));
        ctx.save();
        ctx.globalAlpha = 0.5;
        faded.forEach(l => {
          strokePolys(ctx, l.loops.map(loop => loop.points.map(toScreen)), l.color, 1.5);
          // AND ITS THIN LINES WITH IT, which is the whole of "or selected as
          // a BACKGROUND layer": a roof behind the floor plan is how an
          // overhang is lined up against the wall under it.
          strokeThin(ctx, l.thin, l.color, toScreen);
          if ((l.thin || []).length) thinDrawn.push({ name: l.name, lines: l.thin, to: toScreen });
        });
        ctx.restore();
        c2.setAttribute('data-faded', JSON.stringify(faded.map(l => l.name)));
        if (below) {
          strokePolys(ctx, below.loops.map(l => l.points.map(toScreen)),
            skin['ink-quiet'] || '#888', 1, [5, 4]);
        }
        // The piles the bones stand on, where any overhang needs them.
        ctx.fillStyle = skin['ink-quiet'] || '#888';
        (preview ? preview.drawing : raw).columns?.forEach(col => {
          if (col.pileMark !== BE.PILE_MARK || !col.point) return;
          const p = toScreen(col.point);
          ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill();
        });
        const cut = cutOf(level.loops, toScreen);
        // The picked bone on top of them all, heavier than it was -- with its
        // own thin lines under it, so a picked ROOF shows where its overhang
        // ends and where its hips and valleys run. Movie, 16 Oct: "only show
        // it on the right window if the ROOF is selected (or selected as a
        // BACKGROUND layer)".
        strokeThin(ctx, level.thin, level.color, toScreen);
        if ((level.thin || []).length) {
          thinDrawn.push({ name: level.name, lines: level.thin, to: toScreen });
        }
        c2.setAttribute('data-thin', thinAttr(thinDrawn));
        strokeCut(ctx, cut, level.color, 3);
        c2.setAttribute('data-openings', openingsAttr([{ name: level.name, cut }]));
        // ── THE STAIRS ON THIS LEVEL ──────────────────────────────────────
        //
        // Movie, 16 Oct: "can you add the stairs to the wireframe so i can
        // adjust the openings around the stairs". The painter is render-2d's
        // drawStairs2D and the arithmetic stair-geometry's, handed over the
        // way LAYOUT hands them (layout-plan.js stairEnv); this page adds
        // only which stairs -- the picked level's -- and the pen.
        const stairsHere = stairsOn(level, preview ? preview.drawing : raw);
        if (stairsHere.length) {
          window.DraftRender2D.drawStairs2D(ctx, p => toScreen(p), stairEnvFor(preview ? preview.drawing : raw, stairsHere, level));
        }
        c2.setAttribute('data-stairs', String(stairsHere.length));
        // Every corner, so a BREAK can be seen.
        ctx.fillStyle = level.color;
        level.loops.forEach(l => l.points.forEach(pt => {
          const p = toScreen(pt);
          ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
        }));
        if (selected && level.loops[selected.loopIndex]) {
          const loop = level.loops[selected.loopIndex];
          const a = loop.points[selected.edgeIndex];
          const b = loop.points[(selected.edgeIndex + 1) % loop.points.length];
          if (a && b) {
            const pa = toScreen(a), pb = toScreen(b);
            ctx.strokeStyle = skin['accent-mark'] || '#ffb000';
            ctx.lineWidth = 5;
            ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
            const len = Math.hypot(b.x - a.x, b.z - a.z);
            ctx.fillStyle = skin['accent-mark'] || '#ffb000';
            ctx.font = '12px "DM Mono", monospace';
            ctx.fillText(ft(len), (pa.x + pb.x) / 2 + 6, (pa.y + pb.y) / 2 - 6);
            // AND THE TWO EDGES EITHER SIDE, which are the ones that stretch
            // or shrink as this one is pushed. Movie, 4 Oct: "add the lengths
            // to the 2 side lines connected to the wall that will move (so we
            // can see the length change as they pull out or in)". Each sits
            // just outside the loop, at its edge's middle, in the edge's own
            // colour so it reads as that line's number and not the picked one's.
            const n = loop.points.length;
            const cx = loop.points.reduce((s, p) => s + p.x, 0) / n;
            const cz = loop.points.reduce((s, p) => s + p.z, 0) / n;
            const sides = [(selected.edgeIndex - 1 + n) % n, (selected.edgeIndex + 1) % n]
              .filter((i, k, all) => i !== selected.edgeIndex && all.indexOf(i) === k)
              .map(i => {
                const p0 = loop.points[i], p1 = loop.points[(i + 1) % n];
                const mid = { x: (p0.x + p1.x) / 2, z: (p0.z + p1.z) / 2 };
                const L = Math.hypot(p1.x - p0.x, p1.z - p0.z);
                const m = toScreen(mid), c = toScreen({ x: cx, z: cz });
                const dx = m.x - c.x, dy = m.y - c.y, d = Math.hypot(dx, dy) || 1;
                return { edgeIndex: i, lengthFt: Math.round(L * 1e4) / 1e4,
                  x: m.x + (dx / d) * 10, y: m.y + (dy / d) * 10 };
              });
            ctx.fillStyle = level.color;
            sides.forEach(side => {
              const text = ft(side.lengthFt);
              const w = ctx.measureText(text).width;
              // Left of the anchor when the edge's outside is to the left.
              ctx.fillText(text, side.x < (pa.x + pb.x) / 2 && side.x < toScreen({ x: cx, z: cz }).x
                ? side.x - w : side.x, side.y + 4);
            });
            c2.setAttribute('data-side-lengths', JSON.stringify(sides.map(s => s.lengthFt)));
          }
        } else {
          c2.setAttribute('data-side-lengths', '[]');
        }
        c2.setAttribute('data-selected', selected ? JSON.stringify(selected) : '');
        c2.setAttribute('data-frame', JSON.stringify(frame));
        c2.setAttribute('data-loops', JSON.stringify(level.loops.map(l => l.points.map(p => [p.x, p.z]))));
      };

      const paintLegend = () => {
        const legend = document.getElementById('legend');
        legend.replaceChildren(...levels.map(level => {
          const row = document.createElement('div');
          row.className = 'level-row';
          const b = document.createElement('button');
          b.type = 'button';
          b.dataset.boneLevel = level.name;
          b.setAttribute('aria-pressed', String(picked === level));
          const sw = document.createElement('span');
          sw.className = 'swatch';
          sw.style.background = level.color;
          b.append(sw, level.name);
          b.addEventListener('click', () => { pick(level); });
          // BG: SHOW THIS LEVEL BEHIND THE PICKED ONE (Movie, 16 Oct). Its
          // own button, beside the level rather than inside it, because the
          // two are different questions -- which level am I editing, and
          // which am I looking through -- and one button cannot ask both.
          const back = document.createElement('button');
          back.type = 'button';
          back.className = 'bg';
          back.dataset.boneBg = level.name;
          back.textContent = 'BG';
          back.title = `Show ${level.name} faded behind the level being edited`;
          // THE PICKED LEVEL IS ALREADY IN FRONT, so its BG is not a thing to
          // press: a level cannot be behind itself. Disabled rather than
          // hidden, so the row does not change shape as levels are picked.
          const isPicked = picked === level;
          back.disabled = isPicked;
          back.setAttribute('aria-pressed', String(!isPicked && bg.has(keyOf(level))));
          back.addEventListener('click', () => {
            const key = keyOf(level);
            if (bg.has(key)) bg.delete(key); else bg.add(key);
            paintLegend();
            paint2d();
          });
          row.append(b, back);
          return row;
        }));
      };

      const pick = level => {
        picked = level;
        selected = null;
        paintLegend();
        paint3d();
        paint2d();
      };
      const paintAll = () => { paint3d(); paint2d(); };

      // ── TURNING: 15 DEGREES A STEP, ONE FRAME PER STEP ──────────────
      const turn = steps => {
        const next = BL.stepAngle(angle, steps);
        if (next === angle) return;
        angle = next;
        paint3d();
      };
      document.getElementById('turn-left').addEventListener('click', () => turn(-1));
      document.getElementById('turn-right').addEventListener('click', () => turn(1));
      // ── TIPPING: A RUNG OF THE LADDER A STEP, the same way ───────────
      const tip = steps => {
        const next = BL.stepTilt(tilt, steps);
        if (next === tilt) return;
        tilt = next;
        paint3d();
      };
      document.getElementById('tip-up').addEventListener('click', () => tip(1));
      document.getElementById('tip-down').addEventListener('click', () => tip(-1));
      // A DRAG TURNS TOO, but still in steps: a step per 40 px dragged, and
      // nothing is painted between steps. A press that does not drag is a tap,
      // and a tap on a loop picks its level.
      let spin = null;
      c3.addEventListener('pointerdown', e => {
        spin = { x: e.clientX, y: e.clientY, from: angle, moved: false };
        c3.setPointerCapture(e.pointerId);
      });
      c3.addEventListener('pointermove', e => {
        if (!spin) return;
        const dx = e.clientX - spin.x;
        if (Math.abs(dx) > 6) spin.moved = true;
        const steps = Math.trunc(dx / 40);
        const next = BL.stepAngle(spin.from, steps);
        if (next !== angle) { angle = next; paint3d(); }
      });
      c3.addEventListener('pointerup', e => {
        const was = spin;
        spin = null;
        if (!was || was.moved) return;
        const box = c3.getBoundingClientRect();
        const hit = BL.levelAt(laid, { x: e.clientX - box.left, y: e.clientY - box.top });
        if (hit) pick(levels.find(l => l.kind === hit.kind && l.levelId === hit.levelId) || null);
      });

      // ── EDITING ─────────────────────────────────────────────────────
      const editCtx = () => ({
        levels,
        ladder: window.DraftTour && window.DraftTour.floorPullLadder,
        roofSourceId: (levels.find(l => l.kind === 'roof') || {}).sourceLevelId,
        // THE WALL UNDER AN UPPER ROOF RUN OUT OVER THE MAIN ROOF (boneyard-
        // edit.js roofHood): from MAIN's ceiling to the room's plate, on the
        // room's own level datum, off the same stack the views stand on.
        hoodHeights: levelId => {
          const floors = (stack && stack.floors) || [];
          const main = floors.find(l => Number(l.id) === 3);
          const own = floors.find(l => Number(l.id) === Number(levelId));
          if (!main || !own || !(own.wallTop > own.floorTop)) return null;
          return {
            baseHeight: Math.max(0, main.wallTop - own.floorTop),
            topHeight: own.wallTop - own.floorTop,
          };
        },
      });
      const WORDS = {
        NOT_SQUARE: 'that edge is not square, so it cannot be pushed here',
        NO_OPENING: 'that opening is not in the drawing any more',
        NO_ROOM: 'that wall is too short for the opening to move along it',
        NO_MOVE: 'that is the end of the wall for this opening',
        CROWDED: 'another opening is in the way on that wall',
        SHARED: 'the garage and the house meet along that edge — BREAK it where they part and push the free part',
        NO_RUNG: 'that overhang is already as far as the ladder allows that way',
        NO_ROOF: 'there is no roof edge over that line to move',
        AT_END: 'a break goes at least a foot in from each end of the edge',
        NO_MOVE: 'nothing to move',
      };
      const why = reason => WORDS[reason] || `cannot: ${reason}`;
      const describe = report => {
        const parts = report.moves.map(m => `${m.name} ${m.outFt > 0 ? 'out' : 'in'} ${ft(m.outFt)}`);
        if (report.overhangFt != null) {
          parts[0] += report.overhangFt > 1e-3 ? ` (overhang now ${ft(report.overhangFt)})`
            : report.overhangFt < -1e-3 ? ` (set back ${ft(report.overhangFt)})` : ' (flush)';
        }
        report.trims.forEach(t => parts.push(`${t.name} trimmed ${ft(t.trimFt)} — its overhang is back to 2'-0" with no piles`));
        if (report.roofs) parts.push('the roof followed');
        if (report.piles.placed) parts.push(`${report.piles.placed} pile${report.piles.placed === 1 ? '' : 's'} under the overhang`);
        if (report.piles.removed && !report.piles.placed) parts.push(`${report.piles.removed} pile${report.piles.removed === 1 ? '' : 's'} taken out`);
        if (report.hoodWalls) parts.push(`${report.hoodWalls} wall${report.hoodWalls === 1 ? '' : 's'} under it over the main roof`);
        return parts.join(' · ');
      };

      const readOnly = () => !lease;
      // ONE WRITE AT A TIME. Two arrow presses in quick succession are two
      // edits, and two writes in flight would both carry the revision read
      // before either landed -- the second refused as stale and the page
      // locked out. So writes queue, each taking the drawing as it is then.
      let writing = Promise.resolve(true);
      const save = () => {
        writing = writing.then(() => writeNow());
        return writing;
      };
      const writeNow = async () => {
        if (!S || !lease) return false;
        const file = new File([JSON.stringify(raw)], 'model-drawing.json', { type: 'application/json' });
        try {
          rev = await S.saveSharedFile(file, BUCKET, { ifRev: Number.isInteger(rev) ? rev : null, lease });
          // FOR THE SPECS: how many edits this page has written.
          saves += 1;
          document.body.dataset.boneyardSaves = String(saves);
          return true;
        } catch (error) {
          say(`NOT SAVED — ${error && error.message ? error.message : error}. Reload the page before editing again.`);
          lease = null;
          return false;
        }
      };

      const commit = async result => {
        undo.push(raw);
        raw = result.drawing;
        restack();
        undoBtn.disabled = false;
        paintLegend();
        paintAll();
        await save();
      };

      // After a push, keep the same edge picked where it now stands.
      const reselect = (loopIndex, line) => {
        const level = picked;
        const loop = level && level.loops[loopIndex];
        if (!loop) { selected = null; return; }
        const hit = BE.edgesOf(loop.points).find(e => e.square && e.axis === line.axis
          && Math.abs(e.c - line.c) < 1e-3 && Math.min(e.hi, line.hi) - Math.max(e.lo, line.lo) > 1e-3);
        selected = hit ? { loopIndex, edgeIndex: hit.index } : null;
      };

      // ONE EDIT AT A TIME. Each push reads the picked edge, changes the
      // drawing and then re-finds that edge where it now stands; a second
      // press let in between found the edge already moved under it, lost the
      // pick, and every press after it did nothing. So edits queue: a press
      // waits for the one before it to finish, re-pick and all.
      let editing = Promise.resolve();
      const queued = fn => (...args) => {
        editing = editing.then(() => fn(...args)).catch(() => {});
        return editing;
      };

      const push = queued(async deltaFt => {
        if (!selected || !picked) return;
        if (readOnly()) { say(leaseWords()); return; }
        const loop = picked.loops[selected.loopIndex];
        const edge = loop && BE.edgeOf(loop.points, selected.edgeIndex);
        const result = BE.pushEdge(raw, { kind: picked.kind, levelId: picked.levelId,
          loopIndex: selected.loopIndex, edgeIndex: selected.edgeIndex, deltaFt }, editCtx());
        if (!result.ok) { say(why(result.reason)); return; }
        const moved = result.report.moves[0];
        await commit(result);
        if (edge && edge.square) {
          reselect(selected.loopIndex, { ...edge, c: edge.c + moved.outFt * edge.n });
        }
        paint2d();
        say(describe(result.report));
      });

      const doBreak = queued(async (hit, world) => {
        if (readOnly()) { say(leaseWords()); return; }
        const along = hit.edge.axis === 'z' ? world.x : world.z;
        const result = BE.breakEdge(raw, { kind: picked.kind, levelId: picked.levelId,
          loopIndex: hit.loopIndex, edgeIndex: hit.edge.index, atFt: along }, editCtx());
        if (!result.ok) { say(why(result.reason)); return; }
        await commit(result);
        say(`Broken at ${ft(Math.round(along))} — tap either part and push it.`);
      });

      const setBreaking = on => {
        breaking = on;
        breakBtn.setAttribute('aria-pressed', String(on));
        c2.setAttribute('data-mode', on ? 'break' : 'edit');
        if (on) say('BREAK: tap an edge where the corner goes — it lands on the nearest foot.');
      };
      breakBtn.addEventListener('click', () => setBreaking(!breaking));

      const undoLast = queued(async () => {
        if (!undo.length || readOnly()) return;
        raw = undo.pop();
        restack();
        selected = null;
        undoBtn.disabled = !undo.length;
        paintLegend();
        paintAll();
        await save();
        say('Undone.');
      });
      undoBtn.addEventListener('click', undoLast);

      // A press on an edge picks it, and a drag pushes it -- in whole feet,
      // square to itself, shown as it goes and done when the finger lifts.
      const edgeUnder = (x, y) => {
        const level = picked;
        if (!level || !frame) return null;
        return BE.edgeNear(level.loops, toWorld(x, y), 10 / frame.s);
      };
      // ── A PRESS ON A DOT PICKS THE OPENING, AND A DRAG SLIDES IT ────────
      //
      // Movie, 16 Oct: "i'd like to be able to select the windows and doors
      // and then move them along the wall surface". The dot is the opening's
      // centre on the bone; it is found before the edge under it, since the
      // dot sits ON the edge, and the drag is read along that edge in whole
      // feet. boneyard-edit's slideOpening moves the fenestration.
      const dotUnder = (x, y) => {
        const level = picked;
        if (!level || !frame) return null;
        return BE.openingNear(level.loops, toWorld(x, y), 8 / frame.s);
      };
      let dotDrag = null;
      const slideWords = report => `${report.opening.type} slid ${ft(Math.abs(report.opening.slidFt))} along its wall`;
      const slide = queued(async (id, along, deltaFt) => {
        if (!picked) return;
        if (readOnly()) { say(leaseWords()); return; }
        const result = BE.slideOpening(raw, { id, along, deltaFt });
        if (!result.ok) { say(why(result.reason)); return; }
        await commit(result);
        paint2d();
        say(slideWords(result.report));
      });
      c2.addEventListener('pointerdown', e => {
        const box = c2.getBoundingClientRect();
        const x = e.clientX - box.left, y = e.clientY - box.top;
        const dot = !breaking ? dotUnder(x, y) : null;
        if (dot) {
          selected = null;
          const a = toScreen({ x: 0, z: 0 }), b = toScreen(dot.along);
          const ux = b.x - a.x, uy = b.y - a.y, ul = Math.hypot(ux, uy) || 1;
          dotDrag = { x, y, id: dot.opening.id, along: dot.along, screen: { x: ux / ul, y: uy / ul }, feet: 0 };
          c2.setPointerCapture(e.pointerId);
          c2.setAttribute('data-opening-picked', String(dot.opening.id));
          paint2d();
          say(`${picked.name}: ${dot.opening.type} picked — drag it along the wall, a foot at a time.`);
          return;
        }
        const hit = edgeUnder(x, y);
        if (!hit) { selected = null; paint2d(); return; }
        if (breaking) { doBreak(hit, toWorld(x, y)); return; }
        selected = { loopIndex: hit.loopIndex, edgeIndex: hit.edge.index };
        paint2d();
        if (!hit.edge.square) { say(why('NOT_SQUARE')); return; }
        drag = { x, y, edge: hit.edge, feet: 0 };
        c2.setPointerCapture(e.pointerId);
        const len = ft(hit.edge.length);
        say(`${picked.name}: ${len} edge picked — drag it, or use the arrow keys, a foot at a time.`);
      });
      c2.addEventListener('pointermove', e => {
        if (dotDrag) {
          const box = c2.getBoundingClientRect();
          const dx = e.clientX - box.left - dotDrag.x, dy = e.clientY - box.top - dotDrag.y;
          const feet = Math.round((dx * dotDrag.screen.x + dy * dotDrag.screen.y) / frame.s);
          if (feet === dotDrag.feet) return;
          dotDrag.feet = feet;
          const result = feet ? BE.slideOpening(raw, { id: dotDrag.id, along: dotDrag.along, deltaFt: feet }) : null;
          preview = result && result.ok
            ? { drawing: result.drawing, levels: BL.boneLevels(result.drawing, stack) } : null;
          say(result ? (result.ok ? slideWords(result.report) : why(result.reason)) : '');
          paintAll();
          return;
        }
        if (!drag) return;
        const box = c2.getBoundingClientRect();
        const dx = e.clientX - box.left - drag.x, dy = e.clientY - box.top - drag.y;
        const feet = Math.round((drag.edge.axis === 'x' ? dx : dy) / frame.s);
        if (feet === drag.feet) return;
        drag.feet = feet;
        const result = feet ? BE.pushEdge(raw, { kind: picked.kind, levelId: picked.levelId,
          loopIndex: selected.loopIndex, edgeIndex: selected.edgeIndex, deltaFt: feet }, editCtx()) : null;
        preview = result && result.ok
          ? { drawing: result.drawing, levels: BL.boneLevels(result.drawing, stack) } : null;
        say(result ? (result.ok ? describe(result.report) : why(result.reason)) : '');
        paintAll();
      });
      c2.addEventListener('pointerup', async () => {
        if (dotDrag) {
          const dot = dotDrag;
          dotDrag = null;
          preview = null;
          c2.removeAttribute('data-opening-picked');
          if (!dot.feet) { paintAll(); return; }
          await slide(dot.id, dot.along, dot.feet);
          return;
        }
        const was = drag;
        drag = null;
        preview = null;
        if (!was || !was.feet) { paintAll(); return; }
        await push(was.feet);
      });

      const leaseWords = () => 'MODEL is open for editing in another tab — the bones can be looked at here but not changed.';

      window.addEventListener('keydown', e => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undoLast(); return; }
        if (e.key === 'Escape') { setBreaking(false); selected = null; paint2d(); return; }
        if (e.key.toLowerCase() === 'b' && !e.ctrlKey && !e.metaKey) { setBreaking(!breaking); return; }
        const loop = selected && picked && picked.loops[selected.loopIndex];
        const edge = loop && BE.edgeOf(loop.points, selected.edgeIndex);
        // WITH AN EDGE PICKED the arrows push it a foot; without, left and
        // right turn the 3D as before.
        if (edge && edge.square) {
          const step = { ArrowLeft: ['x', -1], ArrowRight: ['x', 1], ArrowUp: ['z', -1], ArrowDown: ['z', 1] }[e.key];
          if (step && step[0] === edge.axis) { e.preventDefault(); push(step[1]); return; }
          if (step) return;
        }
        if (e.key === 'ArrowLeft') turn(-1);
        if (e.key === 'ArrowRight') turn(1);
      });

      // ── THE DRAWING ─────────────────────────────────────────────────
      raw = await load();
      if (raw) restack();
      if (levels.length) {
        // THE LOWEST FLOOR FIRST: it is where a house starts.
        picked = levels.find(l => l.kind === 'floor') || levels[0];
        // THE LEASE, for editing. Refused means MODEL holds it in another tab.
        // NOT CLAIMED FOR THE GROW: the page is only passing through on the
        // way back to MODEL, which claims it again on arrival.
        if (S && S.claimLease && !growing) {
          try {
            const holderId = S.leaseHolderId();
            const got = await S.claimLease(BUCKET, LEASE_SCOPE, holderId);
            if (got && got.ok) {
              lease = { scope: LEASE_SCOPE, holderId, generation: got.generation };
              const beat = setInterval(async () => {
                if (!lease) { clearInterval(beat); return; }
                try {
                  const again = await S.renewLease(BUCKET, LEASE_SCOPE, holderId);
                  if (!again || !again.ok || again.generation !== lease.generation) { lease = null; say(leaseWords()); }
                } catch { /* the next beat tries again */ }
              }, S.LEASE_HEARTBEAT_MS || 3750);
              window.addEventListener('pagehide', () => {
                if (lease) S.releaseLease(BUCKET, LEASE_SCOPE, holderId).catch(() => {});
              });
            }
          } catch { lease = null; }
        }
        document.body.dataset.boneyardEditable = lease ? '1' : '0';
      }
      setBreaking(false);
      if (growing) {
        // Nothing to grow is not a reason to strand the drafter here.
        if (!levels.length) { leave(); return; }
        document.body.dataset.boneyardGrow = 'playing';
        say('THE BONES GROW — tap or press any key to skip to the front elevation.');
        window.addEventListener('pointerdown', skipGrow, true);
        window.addEventListener('keydown', skipGrow, true);
        growStart = performance.now();
      } else if (!levels.length) {
        // AN EMPTY BONEYARD BRINGS UP THE DRIVE-THRU (Movie, 3 Oct): there is
        // nothing on the shelf to look at, so the drafter goes to MODEL,
        // where the sign rises to pick a house -- built, or drawn.
        //
        // WHEN HE CAME FROM ANOTHER PAGE OF THE APP, straight away. Opened
        // on its own (a bookmark, a typed address) the page stays and says
        // so, with the same way out on a button -- a page that will not stay
        // open cannot be looked at, and nothing about an empty yard needs
        // hiding.
        say('Nothing in the boneyard yet.');
        toDriveThru.hidden = false;
        if (cameFromTheApp()) {
          document.body.dataset.boneyardReady = '1';
          location.replace(DRIVE_THRU);
          return;
        }
      }
      else if (!lease) say(leaseWords());
      else say('Tap a loop, or a level above, to see it flat on the right. Tap an edge there to push it; BREAK puts a corner on a foot mark.');
      paintLegend();
      paintAll();
      document.body.dataset.boneyardReady = '1';
      window.addEventListener('resize', () => { frame = null; paintAll(); });
      window.DraftShellBars.wireSkin({
        theme: window.__byTheme.theme,
        mode: window.__byTheme.mode,
        onSkin: next => { skin = next; paintAll(); },
      });
    })();
  </script>
  <script src="./traffic-counter.js" defer></script>
</body>
</html>
