<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Rough Drafter &mdash; Ext. Finish</title>
<!-- Self-hosted (see vendor/fonts.css): no third-party request on the
     critical path of the page. -->
<link rel="stylesheet" href="vendor/fonts.css" />
<!-- THE SHELL EVERY PAGE WEARS. Movie, 27 Sep: "make sure you bring in the
     bottom and top bars". The stylesheet first so the bars are skinned on the
     first frame; the module below palette.js, because a bar with no roles
     resolved is a bar with no colours. -->
<link rel="stylesheet" href="./shell-bars.css" />
<script src="./palette.js"></script>
<!-- THE SHELL'S OWN MODULE, and then everything the elevation painter asks
     for. ALL IN THE HEAD, because the bars are written where their mount call
     stands, mid-parse -- a module loaded after the body is a module that call
     cannot find. cut-view.js names five: DraftGeometry2D, DraftLevelAssembly,
     DraftWallTypes, DraftFormatters, and DraftBuildHouse for a pile's footing
     size. cut-view-env.js adds the profile manager, for the office standards. -->
<script src="./shell-bars.js"></script>
<script src="./profile-manager.js"></script>
<script src="./shared-file-store.js"></script>
<script src="./drawing-format.js"></script>
<script src="./wall-types.js"></script>
<script src="./roof-types.js"></script>
<script src="./level-assembly.js"></script>
<script src="./geometry-2d.js"></script>
<script src="./build-house.js"></script>
<script src="./formatters.js"></script>
<script src="./finish-patterns.js"></script>
<!-- THE ROOF'S HATCHES, beside the wall's. cut-view reaches for both off
     `window` when finishes are asked for and warns rather than throwing when
     either is missing -- which is a page that draws every roof plain with one
     line in the console and nothing on the sheet saying why. -->
<script src="./roof-patterns.js"></script>
<script src="./cut-marks.js"></script>
<!-- The window size tag's formatter. cut-view.js guards on
     DraftFenLabels and draws no tag without it -- silently, which is
     exactly how the plan tag hid on MODEL.html for an afternoon. -->
<script src="./fen-labels.js"></script>
<script src="./cut-view.js"></script>
<script src="./cut-view-env.js"></script>
<script src="./orientation-guard.js"></script>
<script>
  // THE SKIN IS ONE CHOICE ACROSS THE WHOLE APP. Read the same `draft-skin`
  // key MODEL writes, the same way LAYOUT does, so walking here from the
  // model space does not change the lights. Synchronous and in the head: a
  // page written in --role tokens has no colour at all between parse and boot.
  (() => {
    const P = window.DraftPalette;
    const params = new URLSearchParams(location.search);
    const stored = (() => {
      try { return JSON.parse(localStorage.getItem('draft-skin') || 'null') || {}; }
      catch { return {}; }
    })();
    const theme = params.get('theme') || stored.theme || 'ruff';
    const mode = params.get('mode') || stored.skinMode || 'night';
    window.__reSkin = P.apply(document, theme, mode);   // role -> colour
    window.__reTheme = { theme, mode };
  })();
</script>
<style>
  :root { --sheet-edge: 1px solid var(--edge-panel); }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  /* THE BARS ARE FIXED AND THIS COLUMN HOLDS ITSELF CLEAR OF THEM. Both bars
     are positioned out of flow, so they take no space here -- and without this
     padding the top of the page sits under the instrument rule and the bottom
     under the page row. Construction Layout carries the same two lines with
     the same note; this page went in without them, and the foot of the right
     rail was the price: "Add band" rendered under the bar, visible and
     unpressable. Found by a Playwright click that kept being intercepted by
     the SPECIFICATIONS chip on top of it.

     EVERY NUMBER IS THE BAR'S OWN TOKEN, so a bar that changes height moves
     this page with it -- --strip-h at the head, --house-h plus --browser-lane
     at the foot. --browser-lane is in the sum on purpose: it is the band a
     browser draws its link preview over and iOS keeps for the home indicator,
     and #house-strip reserves it as padding INSIDE its own box, so a page
     subtracting only --house-h puts its last 24px under the bar's hem. */
  body {
    margin: 0; background: var(--surface-page); color: var(--ink-primary);
    font-family: 'Barlow Condensed', system-ui, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
    padding-top: var(--strip-h);
    padding-bottom: calc(var(--house-h) + var(--browser-lane));
  }
  main { flex: 1; display: flex; flex-direction: column; min-height: 0; }

  /* THE TAB STRIP CAME OFF (27 Sep). This page carried two tabs, FINISHES
     and LAYOUT, because Movie had said the real-estate sheet "will be a tab
     within the REAL ESTATE LAYOUT area". Later the same day he split them:
     "i should change the name of this from REAL ESTATE PLAN ... insert tab ->
     'EXT. FINISH' and make this area that name", and "the REAL ESTATE PLAN
     area will be similar to the CONSTRUCTION layout ... can you add that tab
     as a new page". So the sheet became REALESTATEPLAN.html and this page is
     one workspace again -- a tab strip with one tab in it is a control that
     cannot be used. */

  .stage { flex: 1; display: flex; min-height: 0; }
  .stage[hidden] { display: none; }

  /* ── THE ELEVATION RAIL, THE SHEET, AND THE FINISH RAIL ───────────────
     Every side rail is one width, left and right alike (board #48). */
  .rail {
    flex: none; width: 188px; padding: 10px; overflow-y: auto;
    background: var(--surface-panel); display: flex; flex-direction: column; gap: 10px;
  }
  .rail.right { border-left: var(--sheet-edge); }
  .rail.left { border-right: var(--sheet-edge); }
  .rail-title {
    font-size: 11px; font-weight: 600; letter-spacing: .1em;
    text-transform: uppercase; color: var(--accent-mark); margin: 2px 0 0 0;
  }
  .elev-btn {
    display: block; width: 100%; text-align: left; appearance: none;
    border: 1px solid var(--edge-panel); background: var(--surface-chip);
    color: var(--ink-primary); font: inherit; font-size: 12px; letter-spacing: .06em;
    text-transform: uppercase; padding: 8px 10px; cursor: pointer; margin-bottom: 5px;
  }
  .elev-btn[aria-pressed="true"] { border-color: var(--accent-mark); color: var(--accent-mark); }
  .elev-btn .mark { color: var(--ink-quiet); font-size: 10px; margin-left: 6px; }

  .sheet-wrap {
    flex: 1; min-width: 0; display: flex; align-items: center;
    justify-content: center; padding: 10px; overflow: hidden;
  }
  canvas#elev, canvas#sheet {
    background: var(--surface-chip); border: var(--sheet-edge);
    width: 100%; height: 100%; display: block;
  }
  canvas#elev { cursor: crosshair; }

  .prop { display: flex; flex-direction: column; gap: 4px; }
  .prop label {
    font-size: 10px; letter-spacing: .09em; text-transform: uppercase;
    color: var(--ink-quiet);
  }
  .prop select, .prop input[type="text"], .prop input[type="number"] {
    appearance: none; background: var(--surface-chip); color: var(--ink-primary);
    border: 1px solid var(--edge-panel); font: inherit; font-size: 12px;
    padding: 5px 6px; width: 100%;
  }
  .prop input[type="color"] {
    appearance: none; background: var(--surface-chip); border: 1px solid var(--edge-panel);
    width: 100%; height: 26px; padding: 2px; cursor: pointer;
  }
  .row { display: flex; gap: 6px; }
  .row > * { flex: 1; min-width: 0; }
  .btn {
    appearance: none; border: 1px solid var(--edge-panel); background: var(--surface-chip);
    color: var(--ink-primary); font: inherit; font-size: 11px; letter-spacing: .07em;
    text-transform: uppercase; padding: 6px 8px; cursor: pointer;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent-mark); color: var(--accent-mark); }
  .btn:disabled { cursor: default; color: var(--ink-quiet); opacity: .5; }
  .empty { font-size: 11px; color: var(--ink-quiet); line-height: 1.45; margin: 0; }
  .band-list { display: flex; flex-direction: column; gap: 4px; }
  .band {
    display: flex; align-items: center; gap: 5px; font-size: 11px;
    border: 1px solid var(--edge-panel); padding: 4px 5px; background: var(--surface-chip);
  }
  .band .what { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .band .drop {
    appearance: none; border: none; background: none; color: var(--ink-quiet);
    font: inherit; cursor: pointer; padding: 0 2px;
  }
  .band .drop:hover { color: var(--accent-mark); }
  /* A BAND IS A THING YOU OPEN, not just a thing you delete. Everything
     Movie asked for on 27 Sep -- the anchor, the 1 ft nudges, the side
     insets, the corner wrap, the ledge switch -- is an adjustment to a band
     that is already laid, so the chip had to become a door. */
  .band .what { cursor: pointer; }
  .band[data-open="true"] { border-color: var(--accent-mark); }
  .band[data-open="true"] .what { color: var(--accent-mark); }
  .band-edit {
    border: 1px solid var(--accent-mark); border-top: none;
    padding: 7px 6px; display: flex; flex-direction: column; gap: 7px;
    margin-top: -4px;
  }
  /* THE NUDGE ROW: minus, the reading, plus. The reading is a TEXT SPAN and
     not a number input -- Movie, 27 Sep: "make it 1ft changes default and
     then later when he get the 'L' 'R' commands and the lengthbox we can
     allow them to use specific length other than 1ft". A box you can type in
     would be promising the thing he said comes later. */
  .nudge { display: flex; align-items: center; gap: 4px; }
  .nudge button {
    appearance: none; border: 1px solid var(--edge-panel); background: var(--surface-chip);
    color: var(--ink-primary); font: inherit; font-size: 12px; line-height: 1;
    width: 22px; height: 22px; cursor: pointer; flex: none; padding: 0;
  }
  .nudge button:hover:not(:disabled) { border-color: var(--accent-mark); color: var(--accent-mark); }
  .nudge button:disabled { cursor: default; opacity: .35; }
  .nudge .read {
    flex: 1; min-width: 0; text-align: center; font-size: 12px;
    font-family: 'DM Mono', ui-monospace, monospace; color: var(--ink-primary);
  }
  .tick { display: flex; align-items: center; gap: 6px; font-size: 11px; }
  .tick input { accent-color: var(--accent-mark); flex: none; }
  /* AND `hidden` HAS TO BE SAID AGAIN FOR ANYTHING GIVEN A display. The UA
     sheet's [hidden]{display:none} is one attribute selector, so a class rule
     setting display:flex outranks it and the attribute silently does nothing
     -- the element carries hidden="" and stands there in full view. Measured:
     the gable's "Top" row and the ledge switch both stayed on screen with the
     attribute set, and Playwright reported them visible while the DOM showed
     them hidden. .stage[hidden] two hundred lines up is the same guard for the
     same reason. */
  .prop[hidden], .tick[hidden], .band-edit[hidden] { display: none; }
  #status {
    flex: none; padding: 5px 12px; font-size: 11px; letter-spacing: .05em;
    color: var(--ink-quiet); min-height: 22px;
  }
</style>
</head>
<body>
  <!-- THE INSTRUMENTS ARE HERE, AND ASLEEP. Movie, 27 Sep, having seen the
       page: "we should also bring the 'length' and 'angle' textboxes into the
       top center bar.. we may need some of the instruments to be active too so
       bring them all but leave them inactive for now".

       MOUNTED BUT NOT WIRED, which is the seam the module already states: the
       bar owns the FURNITURE and the page owns what the furniture DOES. The
       strip arrives with its chips dormant and its two boxes disabled, and
       nothing here tells them otherwise -- so they stand in the right place,
       at the right size, in the right order, and do nothing until there is
       something for them to do. A row of controls in their final positions is
       worth more than a gap: it says the page is not finished yet, where a gap
       says it forgot. -->
  <script>window.DraftShellBars.topBar({ instruments: true });</script>
  <main>

    <!-- ── THE MAIN AREA: ELEVATIONS, AND THE FINISHES ON THEM ──────────── -->
    <div class="stage" id="stage-finishes">
      <!-- LEFT IS WHERE YOU ARE LOOKING, RIGHT IS WHAT YOU ARE CHANGING.
           Movie, 27 Sep: "on the EXT FINISHES - lets put all the elevations
           views on left (as they are) and put the editing stuff for walls and
           roofs on the right right menu area".

           WHICH MOVED THE ROOF AREA ACROSS the same day it was built -- it
           went in on the left because that is where the ROOF CORNERS
           placeholder had been standing, and he had said then "might change
           it later". The split he has landed on is the one a drafter reads
           without being told: one rail chooses the VIEW, the other edits what
           is in it. -->
      <div class="rail left">
        <p class="rail-title">Elevations</p>
        <div id="elev-list"></div>
      </div>
      <div class="sheet-wrap"><canvas id="elev" width="900" height="560"></canvas></div>
      <div class="rail right">
        <p class="rail-title">Wall finish</p>
        <p class="empty" id="pick-note">Click a wall on the elevation.</p>
        <div id="wall-props" hidden>
          <div class="prop">
            <label for="base-finish">Whole wall</label>
            <select id="base-finish"></select>
          </div>
          <div class="prop" style="margin-top:8px">
            <label for="base-color">Colour</label>
            <input type="color" id="base-color" value="#ffffff">
            <p class="empty">Stored for the 3D window, drawn by nothing yet.</p>
          </div>
          <p class="empty" id="fdn-note" hidden>The exposed concrete wears one
            finish, grade to the top of the pour. Bands are not drawn on it.</p>
          <div id="band-area">
          <p class="rail-title" style="margin-top:12px">Bands</p>
          <div class="band-list" id="band-list"></div>
          <!-- ── ADJUSTING A BAND THAT IS ALREADY LAID ────────────────────
               Movie, 27 Sep: "for the BANDS (not full wall) can we allow them
               to start at the top or bottom and allow the user move the bottom
               or top up by 1' and also on the sides by 1ft", then "for
               materials that reach the edge of the wall lets add a choice to
               'ADD CORNER WRAP' and make it default 2ft", and "lets add a
               choice button on the menu that allows them to TURN OFF the
               ledge".

               THE RECORD HAS CARRIED ALL SIX since they were asked for --
               `anchor`, `toTop`, `startFt`, `endFt`, `wrapFt` and
               `noSillLedge` -- and the rail was the half that had not caught
               up, so a drafter could hold none of it.

               AND THIS NOTE SAID THE PAINTER READ ALL SIX, WHICH WAS FALSE.
               `wrapFt` appeared NOWHERE in cut-view.js: the checkbox below
               stored a two and the drawing did not change, under a comment
               asserting that it worked. A dead control is bad; a dead control
               with a note vouching for it is how the next person stops
               looking. The painter reads all six now -- the wrap turns the
               corner and runs onto the neighbouring wall, which is where it
               was always going to show -- and elevation-harness measures the
               return rather than taking this sentence's word for it. -->
          <div class="band-edit" id="band-edit" hidden>
            <div class="prop">
              <label for="band-anchor">Measured from</label>
              <select id="band-anchor"></select>
            </div>
            <div class="prop">
              <label id="lab-low" for="nudge-low-up">Bottom</label>
              <div class="nudge" id="nudge-low">
                <button type="button" data-nudge="low" data-by="-1"
                  title="Down one foot">&minus;</button>
                <span class="read" id="read-low"></span>
                <button type="button" id="nudge-low-up" data-nudge="low" data-by="1"
                  title="Up one foot">+</button>
              </div>
            </div>
            <div class="prop" id="prop-high">
              <label id="lab-high" for="nudge-high-up">Top</label>
              <div class="nudge" id="nudge-high">
                <button type="button" data-nudge="high" data-by="-1"
                  title="Down one foot">&minus;</button>
                <span class="read" id="read-high"></span>
                <button type="button" id="nudge-high-up" data-nudge="high" data-by="1"
                  title="Up one foot">+</button>
              </div>
            </div>
            <label class="tick"><input type="checkbox" id="band-totop">
              Fill to the top</label>
            <div class="prop">
              <label for="nudge-start-up">Inset, start of wall</label>
              <div class="nudge">
                <button type="button" data-nudge="start" data-by="-1"
                  title="A foot less">&minus;</button>
                <span class="read" id="read-start"></span>
                <button type="button" id="nudge-start-up" data-nudge="start" data-by="1"
                  title="A foot more">+</button>
              </div>
            </div>
            <div class="prop">
              <label for="nudge-end-up">Inset, end of wall</label>
              <div class="nudge">
                <button type="button" data-nudge="end" data-by="-1"
                  title="A foot less">&minus;</button>
                <span class="read" id="read-end"></span>
                <button type="button" id="nudge-end-up" data-nudge="end" data-by="1"
                  title="A foot more">+</button>
              </div>
            </div>
            <label class="tick"><input type="checkbox" id="band-wrap">
              Add corner wrap</label>
            <div class="prop" id="prop-wrap" hidden>
              <div class="nudge">
                <button type="button" data-nudge="wrap" data-by="-1"
                  title="A foot less">&minus;</button>
                <span class="read" id="read-wrap"></span>
                <button type="button" data-nudge="wrap" data-by="1"
                  title="A foot more">+</button>
              </div>
            </div>
            <label class="tick" id="tick-ledge"><input type="checkbox" id="band-ledge">
              Sill ledge under windows</label>
            <p class="empty" id="band-note"></p>
          </div>
          <div class="prop" style="margin-top:6px">
            <label for="band-finish">Add a band</label>
            <select id="band-finish"></select>
          </div>
          <div class="row" style="margin-top:4px">
            <div class="prop">
              <label for="band-low">From (ft)</label>
              <input type="number" id="band-low" value="0" step="0.25" min="0">
            </div>
            <div class="prop">
              <label for="band-high">To (ft)</label>
              <input type="number" id="band-high" value="3" step="0.25" min="0">
            </div>
          </div>
          <button class="btn" id="band-add" style="margin-top:6px; width:100%">Add band</button>
          </div>
        </div>
        <!-- ── THE ROOF AREA ──────────────────────────────────
             Movie, 27 Sep: "we should make a special ROOF area with the roof
             corners in there and the ROOFING TYPE", and on where it goes:
             "over where the ROOF CORNERS are for now (might change it later)
             in the 'EXT FINISH' tab".

             IT WENT IN WHERE THE PLACEHOLDER WAS, on the left, and moved
             here the same day -- see the note on the left rail. The
             placeholder had said what it was waiting for: "which scale these
             are set at -- per roof, or one for the house". He answered that
             days ago -- "allow them to change each iduvidually, don't worry
             about changing all" -- so the list is of ROOFS and a pick is one
             roof.

             THE CORNER FALLS BACK TO THE OFFICE and says so in the option
             itself, because "follows the office" and "set to what the office
             currently says" are different records: the first moves when
             STANDARDS moves, the second does not, and a picker that showed
             them as the same word would make the difference unreachable. -->
        <p class="rail-title">Roof</p>
        <div id="roof-list"></div>
        <div id="roof-props" hidden>
          <div class="prop" style="margin-top:6px">
            <label for="roofing">Roofing type</label>
            <select id="roofing"></select>
          </div>
          <div class="prop" style="margin-top:6px">
            <label for="gable-corner">Gable corner</label>
            <select id="gable-corner"></select>
          </div>
          <p class="empty" id="roof-weight"></p>
        </div>
      </div>
    </div>

    </div>

    <div id="status" role="status"></div>
  </main>

  <!-- page:'ext-finish' marks this chip "you are here", off the one PAGES
       table. Mounted BELOW the page's own markup and ABOVE its script, for the
       reason PROJECT's and SPECS' are: a bar that does not exist yet is a bar
       that script cannot find. NO BONE: this page changes what the house WEARS
       and prints nothing of its own -- the sheet that prints is REAL ESTATE
       PLAN, one chip along. -->
  <script>window.DraftShellBars.bottomBar({ page: 'ext-finish', bone: false });</script>

  <script>
    (async () => {
      const FORMAT = window.DraftDrawingFormat;
      const WT = window.DraftWallTypes;
      const RT = window.DraftRoofTypes;
      const PROFILES = window.DraftProfileManager;
      const CV = window.DraftCutView;
      const BUCKET = 'model-drawing';
      const statusEl = document.getElementById('status');
      const say = text => { statusEl.textContent = text; };


      // ── THE DRAWING ───────────────────────────────────────────────────
      // READ THE SAME BUCKET MODEL WRITES. This page does not build a house;
      // it clads the one that is there. A drawing that will not parse is said
      // so plainly rather than drawn empty.
      let drawing = null, levels = [], env = null, cuts = [];
      const load = async () => {
        const store = window.SharedFileStore;
        if (!store) return null;
        let file = null;
        try { file = await store.loadSharedFile(BUCKET); } catch { file = null; }
        if (!file) return null;
        let parsed = null;
        try { parsed = JSON.parse(await file.text()); } catch { return null; }
        const envelope = FORMAT.checkEnvelope(parsed);
        return envelope.ok ? parsed : null;
      };

      // ── WHAT A BAND IS MEASURED FROM ──────────────────────────────────
      // The bottom of the wall's own cladding: `lowFt: 0` is where the siding
      // starts, which on a finished elevation is the top of the concrete. So
      // a wall's bands are offsets from `baseHeight` plus the level it stands
      // on, and "the bottom 3 ft" is 0 to 3 whatever the foundation under it.
      // ── THE BOX ROUND A FACE READS THE PAINTER'S OWN LINES ──────────────
      //
      // THESE WERE THIS PAGE'S OWN ARITHMETIC, and they disagreed with the
      // paint at both ends. The foot was `floorTop + baseHeight` -- the
      // FINISHED FLOOR -- while cut-view clads from the bottom of the sill
      // plate. Measured on repro-garage-house, E1:
      //
      //     MAIN FL   box 0.0000   paint -1.1771   out by 1'-2 1/8"
      //     2ND FL    box 9.1458   paint  8.0938   out by 1'-0 5/8"
      //
      // Movie reported this as the FINISHES being wrong, twice, with
      // screenshots -- and every measurement of the finishes came back
      // correct, because they were. The box was the thing lying, and a
      // drafter has no way to tell a wrong box from wrong paint.
      //
      // THE HEAD CHANGED TOO, though it measured identical on all six faces
      // of the fixture. `floorTop + topHeight` is the WALL's top; the painter
      // clads to `level.wallTop`, the LEVEL's plate. They agree whenever a
      // wall is as tall as its storey, which is every wall here -- and a
      // number that agrees today by coincidence is the same trap as the foot,
      // one fixture away from being found.
      const wallFootFt = (face, stack) => CV.faceSillFt(env, face, stack);
      const wallHeadFt = face => face.level.wallTop;

      const ELEV_NAMES = { E1: 'FRONT', E2: 'LEFT', E3: 'BACK', E4: 'RIGHT' };
      let picked = null;   // { wallId }
      let currentElev = 'E1';

      // ── THE FOUR ELEVATIONS, STOOD THE WAY THE MODEL'S E MARKS STAND THEM
      // Lifted from LAYOUT's _standardElevationCuts, which is the same four:
      // just outside the plan's walls, looking back at it.
      // ── WHERE THE FOUR STANDARD ELEVATIONS STAND ──────────────────
      //
      // OFF cut-marks.js, WHICH IS THE ONE TABLE. This page carried its own
      // copy of it and every direction in that copy was NEGATED, so E1 drew
      // the back of the house and E3 drew the front. Movie, 27 Sep: "the E3 is
      // showing the FRONT - E1 should be front -- the other E2, E3, E4 are
      // also in wrong positions". Nothing went red, because a flipped
      // elevation is a perfectly good drawing of the wrong wall.
      //
      // THE FOURTH COPY IS GONE rather than corrected. MODEL places its marks
      // off cut-marks, LAYOUT and the harness env keep their own, and this
      // page making a fourth was the fourth chance to drift.
      // ── THE FOUR ELEVATIONS, FROM THE ONE PLACE THAT OWNS THEM ────────
      //
      // Movie, 27 Sep: *"i rotated the main floor plan and then went into the
      // EXT FINISH area and the ELEVATIONS weren't switched E1 showed a side
      // view instead of front. E2 was back view and also a line is cutting
      // through in a wierd angle ... looks like something to do with the
      // attached garage"*.
      //
      // THIS PAGE HAD ITS OWN COPY OF THE CUT BUILDER, and the copy predated
      // the turn. cut-marks grew `planTurn` when the house-rotate button
      // landed -- E1 keeps its own wall, so after a quarter turn its mark
      // stands on the west rather than the south -- and MODEL was taught to
      // pass it. This page was not: it seated each cut from E_MARK_SIDES
      // directly, chose the cut's axis from a hardcoded `id === 'E1' || id
      // === 'E3'`, and asked eMarkDir for a direction with no turn in it.
      // Three places for the same omission, so a turned plan came here and
      // E1 drew whatever wall now happened to face south.
      //
      // AND THE WEIRD DIAGONAL IS THE SAME FAULT, not a second one. Looking
      // at the house from a direction the geometry has moved out from under,
      // the garage's roof projects across the main wall as a long shallow
      // line -- a real edge, drawn from an impossible viewpoint.
      //
      // SO THE COPY IS GONE. cut-marks.autoElevationCuts is what MODEL calls,
      // it takes the turn, and it seats the ring off the dimension strings
      // rather than at a flat twelve feet -- which is the other thing this
      // page was quietly doing differently from the page a drafter had just
      // come from. The fourth copy of E_MARK_SIDES was deleted from here on
      // 27 Sep for exactly this reason; this is the builder that went with it.
      const MARKS = window.DraftCutMarks;
      const standardCuts = () => {
        const walls = (drawing?.walls || []).filter(wall => wall.levelId > 0);
        if (!walls.length) return [];
        return MARKS.autoElevationCuts({
          walls,
          dimensions: drawing?.dimensions || [],
          elevationMarkOffsets: drawing?.elevationMarkOffsets || {},
          // TRUE, NOT THE DRAFTER'S SETTING, and that is a difference from
          // MODEL worth naming. `autoElevations` says whether the MARKS are
          // drawn on the plan; this page is not a plan and draws no marks --
          // the four views ARE its subject, and a drafter who turned the plan
          // marks off has not asked for the cladding page to go blank.
          autoElevations: true,
          // HOW FAR ROUND THE HOUSE HAS BEEN TURNED. It rides in the file --
          // serializeDrawing spreads it -- and this page keeps it through its
          // own load, so the only thing that was ever missing was asking.
          planTurn: drawing?.planTurn || 0,
        });
      };

      // ── THE RAILS ─────────────────────────────────────────────────────
      const finishOptions = () => WT.EXTERIOR_FINISHES
        .map(f => `<option value="${f.id}">${f.label}</option>`).join('');
      document.getElementById('base-finish').innerHTML = finishOptions();
      document.getElementById('band-finish').innerHTML = finishOptions();

      const elevList = document.getElementById('elev-list');
      const paintElevList = () => {
        elevList.innerHTML = cuts.map(cut => `<button class="elev-btn" data-elev="${cut.id}"
          aria-pressed="${cut.id === currentElev}">${cut.id}<span class="mark">${
          ELEV_NAMES[cut.id] || ''}</span></button>`).join('')
          || '<p class="empty">No walls in this drawing yet.</p>';
        elevList.querySelectorAll('[data-elev]').forEach(btn =>
          btn.addEventListener('click', () => {
            currentElev = btn.dataset.elev;
            picked = null;
            paintElevList();
            paintElevation();
            paintProps();
          }));
      };

      // The wall a pick landed on, as it sits in the drawing -- the object the
      // save writes, not the painter's copy of it.
      const storedWall = () => (drawing?.walls || []).find(w => String(w.id) === picked);

      // ── THE ROOF AREA ──────────────────────────────────────
      //
      // PICKED FROM A LIST AND NOT OFF THE DRAWING, which is a deliberate
      // difference from the walls beside it. A wall is picked by clicking the
      // face you want to clad, because a face is a thing you can see and aim
      // at on an elevation. A roof seen from the front is mostly a line, and
      // on a hip it is a line shared by two planes -- so a click would be a
      // guess between two answers where a list is two named buttons.
      let roofPicked = null;
      const roofList = document.getElementById('roof-list');
      const storedRoof = () => (drawing?.roofs || []).find(r => String(r.id) === roofPicked);
      // A ROOF HAS NO NAME, so one is made from what a drafter can see: the
      // level it stands on and whether it is the garage's. Numbered from 1 in
      // the drawing's own order, so the same roof is the same button twice.
      const roofLabel = (roof, i) => {
        const level = levels.find(l => l.id === roof.levelId);
        return `ROOF ${i + 1}${roof.garage ? ' \u00b7 GARAGE' : ''}`
          + (level && level.name ? ` \u00b7 ${level.name}` : '');
      };
      const paintRoofList = () => {
        const roofs = Array.isArray(drawing?.roofs) ? drawing.roofs : [];
        roofList.innerHTML = roofs.map((roof, i) =>
          `<button class="elev-btn" data-roof="${roof.id}"
            aria-pressed="${String(roof.id) === roofPicked}">${roofLabel(roof, i)}</button>`).join('')
          || '<p class="empty">No roofs in this drawing yet.</p>';
        roofList.querySelectorAll('[data-roof]').forEach(btn =>
          btn.addEventListener('click', () => {
            roofPicked = btn.dataset.roof;
            paintRoofList();
            paintRoofProps();
          }));
      };

      // THE OFFICE'S ANSWER, which is what an unset roof follows. Read once at
      // boot rather than per paint: STANDARDS is another page, so it cannot
      // change under this one while a drafter is looking at it.
      // READ THE WAY EVERY OTHER PAGE READS IT, through the normaliser on
      // DraftStructureStandards, off the active standards package. The first
      // draft of this line invented `getActive().structure.gableCorner`, which
      // is not a shape this module has -- getActive takes a KIND and answers a
      // package -- so it threw on every load and the catch quietly answered
      // "flat". A fallback that hides a wrong path shows a drafter the office
      // standard of an office that does not exist.
      const officeCorner = window.DraftStructureStandards.normaliseStructureStandards(
        PROFILES.getActive('standards')?.content?.model?.structureStandards).gableCorner;
      const CORNER_LABELS = { flat: 'Flat', return: 'Return',
        porkchop: 'Porkchop', boxed: 'Boxed' };
      const cornerLabel = id => CORNER_LABELS[id] || id;
      document.getElementById('roofing').innerHTML = RT.ROOFING_TYPES
        .map(r => `<option value="${r.id}">${r.label}</option>`).join('');
      // THE FIFTH OPTION IS THE ABSENCE, and it has to be reachable or
      // per-roof control has no off switch: "follows the office" and "set to
      // whatever the office happens to say today" are different records, and
      // only the first moves when STANDARDS moves.
      document.getElementById('gable-corner').innerHTML =
        `<option value="">Office \u2014 ${cornerLabel(officeCorner)}</option>`
        + PROFILES.GABLE_CORNER_STYLES
          .map(id => `<option value="${id}">${cornerLabel(id)}</option>`).join('');

      const paintRoofProps = () => {
        const roof = storedRoof();
        document.getElementById('roof-props').hidden = !roof;
        if (!roof) return;
        const roofing = RT.roofingById(roof.roofing);
        document.getElementById('roofing').value = roofing.id;
        document.getElementById('gable-corner').value = roof.gableCorner || '';
        // THE WEIGHT, SAID OUT LOUD where the choice is made. It is the one
        // number on that table with a consequence -- a tile roof is four times
        // an asphalt one, which is a truss somebody designs rather than buys
        // -- and a rail that knew it and did not say it would be keeping a
        // secret from the person choosing.
        document.getElementById('roof-weight').textContent =
          `${roofing.weightPsf} psf`
          + (RT.HEAVY_ROOFING_IDS.includes(roofing.id)
            ? ' \u2014 heavy; the framing wants checking.' : '.');
      };

      const writeRoof = patch => {
        const roof = storedRoof();
        if (!roof) return;
        Object.entries(patch).forEach(([key, value]) => {
          if (value === null) delete roof[key];
          else roof[key] = value;
        });
        // THROUGH THE NORMALISER, WITH BOTH VOCABULARIES. Without them the two
        // keys are dropped on the way past and the rail appears to do nothing
        // -- the trap this page already fell into once with the wall finishes,
        // and the reason roof-types-harness carries a check for it.
        drawing.roofs = FORMAT.roofs(drawing.roofs, new Set(levels.map(l => l.id)), {
          roofingIds: RT.ROOFING_TYPES.map(r => r.id),
          cornerStyles: PROFILES.GABLE_CORNER_STYLES,
        });
        env = null;
        rebuild();
        save();
      };

      document.getElementById('roofing').addEventListener('change', event =>
        // THE DEFAULT IS STORED AS NOTHING, so a roof wearing asphalt carries
        // no key -- the record rule this whole file keeps.
        writeRoof({ roofing: event.target.value === RT.DEFAULT_ROOFING_ID
          ? null : event.target.value }));
      document.getElementById('gable-corner').addEventListener('change', event =>
        writeRoof({ gableCorner: event.target.value || null }));

      // ── THE BAND BEING ADJUSTED ────────────────────────────────
      //
      // AN INDEX AND NOT A REFERENCE, because writeWall runs the list back
      // through the normaliser and hands back new objects. The index is also
      // the band's PAINT ORDER, which is the one thing about a band that
      // cannot be read off it -- so it is what the chip shows a drafter.
      let bandPicked = null;
      // THE THREE LINES A BAND CAN BE MEASURED FROM, in a drafter's words
      // rather than the record's. Movie: "can we allow them to start at the
      // top or bottom", and "sometimes the foundation might have finishing too
      // so we should allow that bottom 'sill' line the location for starting a
      // bottom band for foundation".
      const ANCHOR_LABELS = { sill: 'Bottom of sill plate', plate: 'Top plate',
        head: 'Roof head' };
      document.getElementById('band-anchor').innerHTML = WT.FINISH_ANCHORS
        .map(id => `<option value="${id}">${ANCHOR_LABELS[id] || id}</option>`).join('');

      const STEP = WT.FINISH_NUDGE_FT;
      const ft = value => `${Number(value).toFixed(Number.isInteger(value) ? 0 : 2)}\u2032`;

      const paintProps = () => {
        const wall = storedWall();
        document.getElementById('wall-props').hidden = !wall;
        document.getElementById('pick-note').hidden = !!wall;
        if (!wall) return;
        // ── CONCRETE TAKES ONE FINISH, NOT BANDS -- YET ─────────────────
        //
        // The painter clads the exposed pour from grade to the top of it, in
        // the wall's `finish`, and reads no bands there. So the BANDS block
        // is taken off a foundation rather than left standing: a control that
        // stores a value the drawing never shows is worse than no control,
        // and this file has the scar to prove it -- see the note by the
        // corner-wrap tick, where `wrapFt` was stored for days under a
        // comment vouching that the painter read it.
        //
        // WHAT IT NEEDS NEXT is Movie's *"if i want to DROP the main floor
        // finish i can add a bit to the TOP of the FOUNDATION finish"* -- one
        // height above the pour, not a band list. That is the control to
        // build here, and it is not built.
        const onFoundation = (wall.view || 'plan') === 'foundation';
        document.getElementById('band-area').hidden = onFoundation;
        document.getElementById('fdn-note').hidden = !onFoundation;
        document.getElementById('base-finish').value = wall.finish || WT.DEFAULT_FINISH_ID;
        document.getElementById('base-color').value = wall.finishColor || '#ffffff';
        const bands = Array.isArray(wall.finishBands) ? wall.finishBands : [];
        // A DROPPED BAND TAKES THE SELECTION WITH IT rather than leaving it
        // pointing at whatever slid into that index.
        if (bandPicked !== null && bandPicked >= bands.length) bandPicked = null;
        const list = document.getElementById('band-list');
        list.innerHTML = bands.length ? bands.map((band, i) => {
          const label = WT.finishById(band.finishId).label;
          const span = band.toTop ? `${band.lowFt}&prime;&ndash;top`
            : `${band.lowFt}&ndash;${band.highFt}&prime;`;
          return `<div class="band" data-open="${i === bandPicked}">
            <span class="what" data-open-band="${i}"
              title="Adjust this band">${label}</span>
            <span style="color:var(--ink-quiet)">${span}</span>
            <button class="drop" data-drop="${i}" title="Remove this band">&times;</button></div>`;
        }).join('') : '<p class="empty">No bands &mdash; the whole wall is one finish.</p>';
        list.querySelectorAll('[data-drop]').forEach(btn =>
          btn.addEventListener('click', () => {
            const next = bands.slice();
            next.splice(Number(btn.dataset.drop), 1);
            if (bandPicked === Number(btn.dataset.drop)) bandPicked = null;
            writeWall(next.length ? { finishBands: next } : { finishBands: null });
          }));
        list.querySelectorAll('[data-open-band]').forEach(el =>
          el.addEventListener('click', () => {
            const i = Number(el.dataset.openBand);
            bandPicked = bandPicked === i ? null : i;
            paintProps();
          }));
        paintBandEdit(bands);
      };

      // ── WHAT ONE BAND'S CONTROLS READ ──────────────────────────
      const paintBandEdit = bands => {
        const box = document.getElementById('band-edit');
        const band = bandPicked === null ? null : bands[bandPicked];
        box.hidden = !band;
        if (!band) return;
        const anchor = band.anchor || WT.DEFAULT_FINISH_ANCHOR;
        document.getElementById('band-anchor').value = anchor;
        // THE EDGES ARE NAMED FOR THE LINE THEY ARE MEASURED FROM. Above a
        // plate anchor, "bottom" at -2 means two feet BELOW the plate, and a
        // label that just said "Bottom: -2" would leave the drafter working
        // out the sign. Movie asked for exactly this case -- "allow them to
        // move either the upper 'BOTTOM line' to below the bottom of the SILL,
        // or the lower foundation finish allow it to go above".
        const relative = value => (value === 0 ? `at the ${ANCHOR_LABELS[anchor].toLowerCase()}`
          : `${ft(Math.abs(value))} ${value > 0 ? 'above' : 'below'}`);
        document.getElementById('read-low').textContent = relative(band.lowFt);
        document.getElementById('band-totop').checked = band.toTop === true;
        document.getElementById('prop-high').hidden = band.toTop === true;
        if (!band.toTop) {
          document.getElementById('read-high').textContent = relative(band.highFt);
        }
        document.getElementById('read-start').textContent = ft(band.startFt || 0);
        document.getElementById('read-end').textContent = ft(band.endFt || 0);
        document.getElementById('band-wrap').checked = !!band.wrapFt;
        document.getElementById('prop-wrap').hidden = !band.wrapFt;
        if (band.wrapFt) document.getElementById('read-wrap').textContent = ft(band.wrapFt);
        // THE LEDGE SWITCH IS ONLY THERE WHERE THERE IS A LEDGE. Movie's gate
        // is "the types that are over 1\"", so on siding the control would be
        // a switch for a thing the drawing never does -- which teaches the
        // rule wrong. Off the table, not off a literal.
        const finish = WT.finishById(band.finishId);
        const ledges = finish.thicknessIn > 1 && !!finish.cap;
        document.getElementById('tick-ledge').hidden = !ledges;
        document.getElementById('band-ledge').checked = !band.noSillLedge;
        document.getElementById('band-note').textContent = band.toTop
          ? 'Filled to the head \u2014 a gable takes the whole triangle.'
          : (ledges ? '' : `${finish.label} is under an inch, so it takes no sill ledge.`);
      };

      // ── CHANGING ONE BAND ─────────────────────────────────
      //
      // THE LIST IS REPLACED, NOT MUTATED IN PLACE, so paint order is kept
      // exactly: a band being adjusted must not move to the end of the list
      // and start winning arguments it was losing.
      const patchBand = patch => {
        const wall = storedWall();
        if (!wall || bandPicked === null) return;
        const bands = (Array.isArray(wall.finishBands) ? wall.finishBands : []).slice();
        const band = bands[bandPicked];
        if (!band) return;
        const next = { ...band };
        Object.entries(patch).forEach(([key, value]) => {
          if (value === null) delete next[key];
          else next[key] = value;
        });
        // A NUDGE MUST NEVER DELETE THE BAND IT IS ADJUSTING. The normaliser
        // drops a band whose top is at or below its bottom -- correctly, since
        // that band claims no wall -- but a drafter pressing MINUS one time too
        // many would watch the band he is working on vanish with no word said.
        // So the refusal happens HERE, where it can be explained.
        if (!next.toTop && !(Number(next.highFt) > Number(next.lowFt))) {
          say('That would put the top at or below the bottom \u2014 the band would have no wall.');
          return;
        }
        bands[bandPicked] = next;
        writeWall({ finishBands: bands });
      };

      document.getElementById('band-anchor').addEventListener('change', event =>
        // THE DEFAULT IS STORED AS NOTHING, the record's rule everywhere else
        // on this page.
        patchBand({ anchor: event.target.value === WT.DEFAULT_FINISH_ANCHOR
          ? null : event.target.value }));

      document.getElementById('band-totop').addEventListener('change', event => {
        if (event.target.checked) { patchBand({ toTop: true, highFt: null }); return; }
        // COMING BACK DOWN NEEDS A TOP AGAIN, and the one it had is gone --
        // `toTop` and `highFt` cannot both be stored. Three feet of wall above
        // the bottom is a band you can see and then nudge, which is better
        // than a band of nothing.
        const wall = storedWall();
        const band = (wall?.finishBands || [])[bandPicked];
        patchBand({ toTop: null, highFt: (Number(band?.lowFt) || 0) + 3 });
      });

      document.getElementById('band-wrap').addEventListener('change', event =>
        // TWO FEET IS HIS DEFAULT: "make it default 2ft but they can change it
        // (1ft, 4ft etc)".
        patchBand({ wrapFt: event.target.checked ? 2 : null }));

      document.getElementById('band-ledge').addEventListener('change', event =>
        // STORED AS THE REFUSAL: the tick is "show it", which is the default,
        // so only the UNticked state is written down.
        patchBand({ noSillLedge: event.target.checked ? null : true }));

      // THE NUDGES. One handler for all five, because they differ only in
      // which key they move and what a negative means there.
      document.querySelectorAll('[data-nudge]').forEach(btn =>
        btn.addEventListener('click', () => {
          const wall = storedWall();
          const band = (wall?.finishBands || [])[bandPicked];
          if (!band) return;
          const by = Number(btn.dataset.by) * STEP;
          const which = btn.dataset.nudge;
          if (which === 'low') { patchBand({ lowFt: (Number(band.lowFt) || 0) + by }); return; }
          if (which === 'high') { patchBand({ highFt: (Number(band.highFt) || 0) + by }); return; }
          // THE INSETS AND THE WRAP ARE DISTANCES, not positions: below zero
          // is not "the other way", it is nothing. Clamped, and a clamp to
          // zero on an inset means the band runs to the corner again, so the
          // key comes off rather than being stored as a zero.
          const key = { start: 'startFt', end: 'endFt', wrap: 'wrapFt' }[which];
          const now = Math.max(0, (Number(band[key]) || 0) + by);
          patchBand({ [key]: now > 0 ? now : null });
        }));

      // ── ONE WRITE PATH ────────────────────────────────────────────────
      // Every edit in the rail comes through here: patch the stored wall,
      // re-normalise so a bad band is refused at the door rather than at the
      // painter, then repaint and save. `null` in a patch REMOVES the key --
      // the record's own rule is conditional keys, never invented, and a wall
      // with no bands must not carry an empty list.
      const writeWall = patch => {
        const wall = storedWall();
        if (!wall) return;
        Object.entries(patch).forEach(([key, value]) => {
          if (value === null) delete wall[key];
          else wall[key] = value;
        });
        drawing.walls = FORMAT.walls(drawing.walls, new Set(levels.map(l => l.id)), {
          wallTypes: WT.WALL_TYPES,
          legacyWallTypes: WT.LEGACY_WALL_TYPES,
          finishIds: WT.EXTERIOR_FINISHES.map(f => f.id),
          legacyFinishes: WT.LEGACY_FINISH_IDS,
          finishAnchors: WT.FINISH_ANCHORS,
          defaultWallTopFt: 8,
        });
        env = null;
        rebuild();
        paintProps();
        save();
      };

      document.getElementById('base-finish').addEventListener('change', event =>
        writeWall({ finish: event.target.value === WT.DEFAULT_FINISH_ID
          ? null : event.target.value }));
      document.getElementById('base-color').addEventListener('change', event =>
        writeWall({ finishColor: event.target.value }));
      document.getElementById('band-add').addEventListener('click', () => {
        const wall = storedWall();
        if (!wall) return;
        const bands = (Array.isArray(wall.finishBands) ? wall.finishBands : []).slice();
        // APPENDED, NOT INSERTED IN ORDER. The list is paint order: the band
        // just added is the one on top where it overlaps an older one, which
        // is what a drafter laying stone over shake means by doing it second.
        bands.push({
          finishId: document.getElementById('band-finish').value,
          lowFt: Number(document.getElementById('band-low').value),
          highFt: Number(document.getElementById('band-high').value),
        });
        writeWall({ finishBands: bands });
      });

      // ── SAVING ────────────────────────────────────────────────────────
      // RE-READ, MERGE, WRITE GUARDED BY THE REVISION, the way PROJECT does:
      // a drafter with the Model Space open in another tab must not have their
      // house flattened by this page writing its own snapshot over it. Only
      // `walls` and `roofs` go back, which is all this page touches.
      let queue = Promise.resolve();
      const save = () => {
        queue = queue.catch(() => {}).then(async (tries = 3) => {
          const store = window.SharedFileStore;
          if (!store) return;
          const at = await store.loadSharedFileAt(BUCKET);
          let base = null;
          if (at.file) {
            try { base = JSON.parse(await at.file.text()); } catch { base = null; }
          }
          if (!base || typeof base !== 'object') base = drawing;
          // ROOFS GO BACK TOO, since 27 Sep. This wrote `walls` alone for as
          // long as walls were all the page touched; the ROOF area edits the
          // roofs, and a merge that left them out would show the change on
          // screen and lose it on reload.
          const merged = { ...base, walls: drawing.walls, roofs: drawing.roofs };
          const file = new File([JSON.stringify(merged)], 'drawing.json',
            { type: 'application/json' });
          try { await store.saveSharedFile(file, BUCKET, { ifRev: at.rev }); }
          catch (error) {
            if (error?.stale && tries > 0) return save();
            throw error;
          }
          say('Saved with the drawing.');
        }).catch(error => {
          console.warn('Unable to save the finishes:', error);
          say('Could not save — is browser storage available?');
        });
      };

      // ── THE ELEVATION, AND WHAT A CLICK ON IT MEANS ───────────────────
      // The painter is handed the canvas and draws what MODEL draws. The pick
      // asks cut-view for the SAME face list the paint used -- elevationFaces,
      // lifted out of the painter for exactly this -- so a click cannot land
      // on a wall the drafter is not looking at.
      const canvas = document.getElementById('elev');
      let frame = null;    // the mapping the last paint used, for the inverse
      // SIZED TO ITS ROOM, in CSS pixels, before anything measures it. The
      // pick inverts the frame this paint used, so the backing store and the
      // box on screen have to be the same number or every click is off by the
      // ratio between them.
      const fitCanvas = cv => {
        const box = cv.parentElement.getBoundingClientRect();
        const w = Math.max(320, Math.floor(box.width));
        const h = Math.max(240, Math.floor(box.height));
        if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
      };

      const paintElevation = () => {
        fitCanvas(canvas);
        const ctx = canvas.getContext('2d');
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const cut = cuts.find(c => c.id === currentElev);
        if (!env || !cut) {
          frame = null;
          return;
        }
        const extents = CV.cutViewExtents(env, cut);
        if (!extents) { frame = null; return; }
        const axis = CV.cutAxis(cut);
        const uA = cut.startPt.x * axis.x + cut.startPt.z * axis.z;
        const uB = cut.endPt.x * axis.x + cut.endPt.z * axis.z;
        const uMin = Math.min(uA, uB), uMax = Math.max(uA, uB);
        const { yTop, yBottom } = extents;
        // OUR OWN FIT, so the inverse below is exact rather than a guess at
        // what the painter chose. With `pxPerFt` and `extents` handed in, the
        // painter's margins are zero and its frame is arithmetic on these five
        // numbers -- see the note at externalFit.
        const pad = 14;
        const pxPerFt = Math.max(2, Math.min(
          (canvas.width - pad * 2) / Math.max(uMax - uMin, 4),
          (canvas.height - pad * 2) / Math.max(yTop - yBottom, 8)));
        const x0 = (canvas.width - (uMax - uMin) * pxPerFt) / 2;
        const y0 = (canvas.height - (yTop - yBottom) * pxPerFt) / 2;
        frame = { uMin, uMax, yTop, yBottom, pxPerFt, x0, y0, cut, axis };
        const colors = CV.inksFromSkin(window.__reSkin);
        CV.drawCutView(env, ctx, canvas.width, canvas.height, cut,
          { pxPerFt, extents, colors, finishes: true });
        if (picked) paintPickMark(ctx);
      };

      // ── WHAT CAN BE CLICKED, WALLS AND CONCRETE ALIKE ─────────────────
      //
      // Movie, 28 Sep: *"we also need the FOUNDATION to be clickable -
      // sometimes someone may want finish added to the side of foundation
      // too"*, and *"sometimes it will be needed on the side of a house that
      // has a walkout for instance"*.
      //
      // ONE SHAPE FOR BOTH, which is what keeps the pick, the marker and the
      // readout from each growing a branch. A wall face carries `u1/u2` and a
      // level; a foundation face carries `lo/hi` and heights off the pour.
      // Reduced to ends, a foot and a head, they are the same thing to
      // everything downstream -- and the wall RECORD is common to both
      // already, which is what the rail reads.
      //
      // THE CONCRETE'S FOOT IS GRADE, NOT ITS BASE. What is buried is not on
      // the sheet, so it is not clickable either: a click lands on what the
      // drafter can see, which is the same rule the painter draws by.
      const pickables = stack => {
        const out = [];
        const { faces, fdnFaces } = CV.elevationFaces(env, frame.cut, stack, frame.axis);
        faces.forEach(face => out.push({
          wall: face.wall, depth: face.depth,
          lo: Math.min(face.u1, face.u2), hi: Math.max(face.u1, face.u2),
          foot: wallFootFt(face, stack), head: wallHeadFt(face),
        }));
        const fdn = stack.foundation;
        if (fdn) {
          fdnFaces.forEach(face => {
            if (!face.wall) return;
            const head = fdn.wallBottom + face.top;
            const foot = Math.max(fdn.wallBottom + face.base, fdn.grade);
            if (head - foot < 0.02 || face.hi - face.lo < 0.5) return;
            out.push({ wall: face.wall, depth: face.depth,
              lo: face.lo, hi: face.hi, foot, head });
          });
        }
        return out.sort((a, b) => a.depth - b.depth);
      };

      const faceAt = (px, py) => {
        if (!frame || !env) return null;
        const u = frame.uMin + (px - frame.x0) / frame.pxPerFt;
        const e = frame.yTop - (py - frame.y0) / frame.pxPerFt;
        const stack = CV.sectionLevelStack(env);
        if (!stack) return null;
        const list = pickables(stack);
        // NEAREST FIRST, which is the painter's order reversed. An elevation
        // is occlusion by paint ORDER -- each face covers what stands behind
        // it -- so the LAST one painted at a spot is the one a drafter sees,
        // and the one a click means.
        for (let i = list.length - 1; i >= 0; i -= 1) {
          const g = list[i];
          if (u < g.lo || u > g.hi) continue;
          if (e < g.foot || e > g.head) continue;
          return g;
        }
        return null;
      };

      const paintPickMark = ctx => {
        const stack = CV.sectionLevelStack(env);
        if (!stack || !frame) return;
        const g = pickables(stack).find(f => String(f.wall.id) === picked);
        if (!g) return;
        const X = u => frame.x0 + (u - frame.uMin) * frame.pxPerFt;
        const Y = el => frame.y0 + (frame.yTop - el) * frame.pxPerFt;
        ctx.save();
        ctx.strokeStyle = window.__reSkin['accent-mark'];
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 4]);
        ctx.strokeRect(X(g.lo), Y(g.head),
          (g.hi - g.lo) * frame.pxPerFt, (g.head - g.foot) * frame.pxPerFt);
        ctx.restore();
      };

      canvas.addEventListener('click', event => {
        const box = canvas.getBoundingClientRect();
        const face = faceAt(
          (event.clientX - box.left) * canvas.width / box.width,
          (event.clientY - box.top) * canvas.height / box.height);
        picked = face ? String(face.wall.id) : null;
        paintElevation();
        paintProps();
        // THE CONCRETE SAYS WHAT IT IS. A foundation wall's type label is
        // the pour's, not a stud wall's, and a drafter who has just clicked
        // below grade should be told he is on the foundation rather than
        // left to infer it from a name he half recognises.
        const onFdn = face && (face.wall.view || 'plan') === 'foundation';
        say(face
          ? `${onFdn ? 'Foundation' : ''}`
            + `${WT.WALL_TYPES.find(t => t.id === face.wall.wallType)?.label || 'Wall'}`
              .replace(/^/, onFdn ? ' ' : '')
            + `, ${(face.hi - face.lo).toFixed(1)} ft on ${currentElev}`
          : 'Nothing there — click a wall face or the exposed concrete.');
      });

      // ── BOOT ──────────────────────────────────────────────────────────
      const rebuild = () => {
        env = window.DraftCutViewEnv.buildCutViewEnv(drawing, levels);
        cuts = standardCuts();
        if (!cuts.some(cut => cut.id === currentElev)) currentElev = cuts[0]?.id || 'E1';
        paintElevList();
        paintElevation();
        paintRoofList();
        paintRoofProps();
      };

      // ── AND IT IS WIRED BEFORE THE DRAWING IS READ ───────────────
      //
      // IT USED TO STAND BELOW `const raw = await load()`, AFTER THE EARLY
      // RETURN -- so on a browser with no drawing in storage this page said
      // "draw a house in the Model Space first", returned, and left NEW
      // looking exactly as pressable as it does here and doing nothing. That
      // is the one state where the button is the drafter's way out, and it
      // is the state it was never wired in.
      //
      // NOTHING IN THE HANDLER NEEDS THE DRAWING: it drains `queue`, declared
      // 200 lines up, and navigates. So it goes above the read, and the page
      // keeps its promise whether or not there is anything on it.

      // ── NEW GOES HOME AND STARTS A BLANK ONE ──────────────────────────
      //
      // Movie, 28 Sep: *"when i press NEW can you take me back to MODEL page
      // from the EXT FINISH page and open a new blank plan"*.
      //
      // THIS PAGE HAS NO DRAWING TO BLANK. It clads one it does not own -- it
      // re-reads, merges and writes `walls` and `roofs` back on every edit,
      // the way LAYOUT does -- which is also why there is nothing unsaved
      // here to guard, and why the word at the foot reads "Saved with the
      // drawing" rather than offering a button.
      //
      // SO IT ASKS RATHER THAN ANSWERS. This page could blank the shared
      // store itself and navigate, and then there would be TWO answers to
      // what a blank drawing is, drifting apart the first time MODEL's
      // changes. `?new=1` hands the question to the page that owns it.
      const fileNew = document.getElementById('file-new');
      if (fileNew) {
        fileNew.title = 'NEW — start an empty drawing in the MODEL space';
        fileNew.addEventListener('click', async () => {
          // THE LAST EDIT MAY STILL BE IN THE QUEUE. Every change here starts
          // a write, and a write is a promise; navigating out from under one
          // loses whatever it was carrying. Draining first costs nothing when
          // the queue is already empty, which is the usual case.
          try { await queue; } catch { /* the queue says so itself */ }
          window.location.href = './MODEL.html?new=1';
        });
      }

      const raw = await load();
      if (!raw) {
        say('No drawing in browser storage — draw a house in the Model Space first.');
        paintElevList();
        paintRoofList();
        return;
      }
      levels = FORMAT.levels(raw.levels);
      drawing = {
        ...raw,
        walls: FORMAT.walls(raw.walls, new Set(levels.map(l => l.id)), {
          wallTypes: WT.WALL_TYPES,
          legacyWallTypes: WT.LEGACY_WALL_TYPES,
          // WITHOUT THIS THE PAGE IS BLANK OF ITS OWN SUBJECT. The normaliser
          // drops a finish it cannot recognise, and this page draws nothing
          // else -- the same trap MODEL's loader note describes, pointing the
          // other way.
          finishIds: WT.EXTERIOR_FINISHES.map(f => f.id),
          legacyFinishes: WT.LEGACY_FINISH_IDS,
          finishAnchors: WT.FINISH_ANCHORS,
          defaultWallTopFt: 8,
        }),
      };
      rebuild();
      say(cuts.length ? 'Click a wall on the elevation to clad it.'
        : 'This drawing has no walls to clad yet.');

      window.addEventListener('resize', () => { paintElevation(); });

      window.DraftShellBars.wireSkin({
        theme: window.__reTheme.theme,
        mode: window.__reTheme.mode,
        onSkin: skin => { window.__reSkin = skin; paintElevation(); },
      });
    })();
  </script>
  <script src="./traffic-counter.js" defer></script>
</body>
</html>
