<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOY — Rough Drafter</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="stylesheet" href="../vendor/fonts.css">

<!-- THE SHARED PIECES, LOADED FROM ONE FOLDER UP, as neighborhood/ does:
     they publish onto window.Draft* and read each other from there, so a page
     down here uses them unchanged. Only what the game reads: the wall table
     (for the wall's thickness) and the format's board vocabulary. -->
<script src="../wall-types.js"></script>
<script src="../drawing-format.js"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --ink: #1d1f20;
    --ink-quiet: rgba(29,31,32,0.5);
    --rule: rgba(29,31,32,0.14);
    --toy: #e2683c;
    --wall: #3b4146;
    --ground: #fbf8f2;
    --grid: rgba(29,31,32,0.07);
    --grid-bold: rgba(29,31,32,0.16);
    --font-ui: 'Barlow Condensed', system-ui, sans-serif;
  }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ground); color: var(--ink); }
  body { display: flex; flex-direction: column; font-family: 'Barlow', system-ui, sans-serif; }

  #bar {
    flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    border-bottom: 1px solid var(--rule); background: #fff;
  }
  #bar h1 {
    margin: 0 10px 0 0; font-family: var(--font-ui); font-size: 20px; font-weight: 700;
    letter-spacing: 0.1em; color: var(--toy);
  }
  #bar .grow { flex: 1; }
  button {
    font-family: var(--font-ui); font-size: 13px; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase;
    border: 2px solid var(--rule); border-radius: 8px; background: #fff; color: var(--ink);
    padding: 6px 12px; cursor: pointer;
  }
  button:hover { border-color: var(--toy); color: var(--toy); }
  button.on { background: var(--toy); border-color: var(--toy); color: #fff; }

  #stage { flex: 1; position: relative; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
  #strip {
    position: absolute; left: 0; right: 0; bottom: 0; height: 30px;
    display: flex; align-items: center; gap: 16px; padding: 0 12px;
    border-top: 1px solid var(--rule); background: #fff;
    font-family: var(--font-ui); font-size: 13px; font-weight: 600;
    letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-quiet);
  }
  #strip b { color: var(--toy); font-weight: 700; }
  #say { margin-left: auto; color: var(--ink); }
</style>
</head>
<body>

<div id="bar">
  <h1>TOY</h1>
  <button id="wall" class="on" title="Draw walls: click, click, click. Esc, Enter or a double-click ends the run.">Wall</button>
  <button id="undo" title="Take back the last wall (Ctrl+Z)">Undo</button>
  <button id="clear" title="Start over">Clear</button>
  <span class="grow"></span>
  <button id="open" title="Open a house saved from TOY">Open</button>
  <input id="file" type="file" accept=".draft,.json,application/json" hidden>
  <button id="save" title="Save the house as a .draft file. OPEN it in Rough Drafter's MODEL to keep working on it.">Save .draft</button>
</div>

<div id="stage">
  <canvas id="plan"></canvas>
  <div id="strip">
    <span id="s-walls">0 walls</span>
    <span id="s-run">—</span>
    <span id="say">Click to start a wall · every wall is square and a whole foot</span>
  </div>
</div>

<script src="toy-game.js"></script>
</body>
</html>
